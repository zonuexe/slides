[project]
name = "pdf-link-extractor"
version = "1.0.0"
description = "指定したPDFからリンクを抽出してYAML形式で出力するツール"
authors = [
    {name = "USAMI Kenta", email = "tadsan@zonu.me"}
]
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "PyYAML>=6.0",
]

[project.scripts]
pdf-link-extractor = "pdf_link_extractor:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
