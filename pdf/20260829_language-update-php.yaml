  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 Platform Div > WebTechnology Team PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近チームが再編されてインフラっぽい仕事もしてます
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - kind: para
    text: コミュニティでは
  - kind: list
    items:
    - 2016年から毎年PHPカンファレンスで発表しています
    - PHPの言語仕様と構文解析・標準関数などについて
    - PHPのWebフレームワークとコンポーネントの設計・実装について
    - PHPのテストと静的解析・型について
    - Emacs JPというコミュニティをやっています
    - Emacs-PHPというコミュニティでPHP Modeなどをメンテしています
  p4: []
  p5: []
  p6: []
  p7:
  - kind: para
    text: PHPやTypeScriptの最新の動的言語の型検査型推論の知見を寄せ集め
  p8: []
  p9:
  - kind: heading
    level: 1
    text: <?php
  p10:
  - kind: heading
    level: 1
    text: PHPという言語について
  - kind: list
    items:
    - HTML+Perlっぽい変数$、ちょっとC言語っぽい構文、JavaっぽいOOP
    - RubyもPerl, Smalltalk, Eiffel, Ada, Lisp, …の構文を融合させた
  - kind: para
    text: 独自の言語を構築できていたことと対比して、PHPはメジャー言語の構文の不器用なデッドコピー感が強かった。
  p11:
  - kind: para
    text: ここまでの進化の歴史をまとめましょう
  p12:
  - kind: para
    text: HTMLテンプレート
  - kind: para
    text: 1. PHPはC言語用ライブラリ+テンプレートエンジンだった(mSQL付き)
  p13:
  - kind: para
    text: + 手続き型
  - kind: para
    text: 2. PHP/FIとして、ほんのりC言語/Perl風味+HTMLテンプレートなスクリプト言語になった
  p14:
  - kind: para
    text: + オブジェクト指向
  - kind: heading
    level: 1
    text: 3. Java風味なクラス／
  - kind: heading
    level: 1
    text: オブジェクト指向機能が追加
  p15:
  - kind: heading
    level: 1
    text: 結局PHPとは何か
  - kind: para
    text: HTMLテンプレート
  - kind: para
    text: Perlっぽいスクリプト
  - kind: para
    text: JavaっぽいOOP
  - kind: para
    text: C言語構文
  - kind: para
    text: libc関数
  p16:
  - kind: para
    text: いろいろな人の期待と欲望を取り込んでPHPはさらに進化
  p17: []
  p18: []
  p19:
