  p32:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told you you should be using.I
      don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p33:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”
  - kind: para
    text: –Rasmus Lerdorf (tadsanによる超訳)
  p34: []
  p35:
  - kind: para
    text: Rasmusの作る言語は構文への関心が薄かった
  p36:
  - kind: para
    text: '出典: 伝説のPHP作者「Rasmus Lerdorf」名言集を聞くと嫌PHP厨がファビョる'
  - kind: para
    text: https://web.archive.org/web/20100501140915/http://anond.hatelabo.jp/20100427231539
  p37: []
  p38:
  - kind: heading
    level: 1
    text: PHPのライセンス変更
  - kind: list
    items:
    - いままでPHPはApache-1.0派生の独自ライセンスだった
    - 一般的な寛容な自由ソフトウェアライセンスの条件は満たしているが、
  - kind: para
    text: OSIの承認を得られていないので微妙に使いにくいものだった
  - kind: list
    items:
    - PHP 8.6からは修正BSDライセンス(BSD-3-Clause)に変更された
    - “PHP License 4”としてBSDLの文面を指定することで、
  - kind: para
    text: PHP License 3.0のアップデート条項を適用して軟着陸した
  p39: []
  p40: []
  p41:
  - kind: heading
    level: 1
    text: True-Async
  - kind: list
    items:
    - シングルスレッドで動くPHPに「真の非同期」を入れようぜというプロジェクト
    - 全てのPHP関数は基本的に全てI/Oでブロックする
    - What Color is Your Function? 問題
    - よくある言語では Promise や async/await で非同期処理
    - True-AsyncではGoroutineに近い方法で処理できるように
    - PHP 9.0とかで入るといいなあ…
