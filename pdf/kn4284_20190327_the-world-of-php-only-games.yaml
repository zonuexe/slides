text:
  p1:
  - kind: heading
    level: 1
    text: PHP縛りゲーの世界
  - kind: para
    text: '第136回 PHP勉強会＠東京2019年3月27日 #phpstudy'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: 待ってるにょ
  p4: []
  p5: []
  p6:
  - kind: para
    text: 宣伝
  p7:
  - kind: para
    text: 今週末はPHPerKaigiです
  p8:
  - kind: para
    text: CIとか静的解析
  - kind: para
    text: の話をします
  p9:
  - kind: para
    text: チケットを持ってない人は今すぐ購
  - kind: para
    text: 入
  p10:
  - kind: para
    text: さてみなさん
  p11:
  - kind: para
    text: プログラミングは
  - kind: para
    text: 好きですか？
  p12:
  - kind: para
    text: プログラミングは
  - kind: para
    text: 楽しいですか？
  p13:
  - kind: para
    text: もっと楽しくしたくないですか？
  p14:
  - kind: para
    text: そうですね
  p15:
  - kind: para
    text: 制約を課すべし
  p16:
  - kind: para
    text: ゲームをプレイする際、本来ゲーム側からは設定されていない制限（縛り）を自ら科
  - kind: para
    text: す事によって、より難易度の高いゲームを
  - kind: para
    text: プレイする事。
  - kind: para
    text: –ニコニコ大百科
  - kind: para
    text: https://dic.nicovideo.jp/a/%E7%B8%9B%E3%82%8A%E3%83%97%E3%83%AC%E3%82%A4
  p17:
  - kind: para
    text: 他言語における
  - kind: para
    text: 実例
  p18:
  - kind: para
    text: セミコロンレスJava
  - kind: para
    text: 常識的なJavaは、式文の末尾にセミコロン(;)を要求
  - kind: para
    text: ところが、工夫することで ;の挿入を回避してコードを書くことが可能
  p19:
  - kind: para
    text: Pythonワンライナー
  - kind: para
    text: Pythonはインデントベースの文法(オフサイドルール)を持つため、改行を要求する文法が多い
  - kind: para
    text: ……が、さまざまなテクを駆使することでこの制約を回避
  p20:
  - kind: para
    text: それならPHPは
  p21:
  - kind: para
    text: セミコロンレスPHP
  - kind: para
    text: PHPもJavaと同じく式文の末尾にセミコロン(;)を要求する
  - kind: para
    text: だが実はPHPは ?> 直前の ; を省略できる
  - kind: para
    text: ?> も禁止することで成立する
  p22:
  - kind: para
    text: ワンライナーPHP
  - kind: para
    text: PHPは改行が文法的な意味を(ほぼ)持たず ; で区切って複数の式文を一行に書ける
  - kind: para
    text: Pythonと同等の難易度にはならない
  p23:
  - kind: para
    text: どうしよう
  p24:
  - kind: para
    text: 🤔
  p25:
  - kind: para
    text: 🤑
  p26:
  - kind: para
    text: ＄
  p27:
  - kind: para
    text: PHPにおける $ とは
  - kind: para
    text: 言わずと知れた変数のシンボル(sigil)
  - kind: para
    text: おそらくPerlに由来するが、Perlの意味とはまったく異なる
  - kind: para
    text: 実際いろんなところで必須
  p28:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: <?php
  - kind: para
    text: function foo($a, $b) {$name = "hoge"; // 変数代入var_dump($_SERVER); // ← スーパーグローバル変数
  - kind: para
    text: foreach (piyo() as $p) { // ← 省略できないecho $piyo->$name; // ← 可変プロパティ}}
  p29:
  - kind: para
    text: どうしよう
  p30:
  - kind: para
    text: (２回め)
  p31:
  - kind: para
    text: 変数を利用できない＝状態の更新ができない
  p32:
  - kind: para
    text: 🙃
  p33:
  - kind: para
    text: 大丈夫です
  p34:
  - kind: para
    text: $なしで意外と
  - kind: para
    text: 書けます
  p35:
  - kind: para
    text: FizzBuzzは
  - kind: para
    text: 書けます
  p36:
  - kind: para
    text: どうすんの
  p37:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: <?php const FB = ['FizzBuzz', null, null, 'Fizz', null,'Buzz', 'Fizz', null,
      null, 'Fizz', 'Buzz', null,'Fizz', null, null];
  - kind: para
    text: call_user_func(new class { function __invoke() {if (func_get_arg(0) -1 )call_user_func(__METHOD__,
      func_get_arg(0) - 1);echo FB[func_get_arg(0) % 15] ?? func_get_arg(0), "\n";}},
      100);
  p38:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: <?php const FB = ['FizzBuzz', null, null, 'Fizz', null,'Buzz', 'Fizz', null,
      null, 'Fizz', 'Buzz', null,'Fizz', null, null];
  - kind: para
    text: 定数定義 ($不要)
  - kind: para
    text: call_user_func(new class { function __invoke() {if (func_get_arg(0) -1 )call_user_func(__METHOD__,
      func_get_arg(0) - 1);echo FB[func_get_arg(0) % 15] ?? func_get_arg(0), "\n";}},
      100);
  p39:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: 無名関数を起動
  - kind: para
    text: <?php const FB = ['FizzBuzz', null, null, 'Fizz', null,'Buzz', 'Fizz', null,
      null, 'Fizz', 'Buzz', null,'Fizz', null, null];
  - kind: para
    text: call_user_func(new class { function __invoke() {if (func_get_arg(0) -1 )call_user_func(__METHOD__,
      func_get_arg(0) - 1);echo FB[func_get_arg(0) % 15] ?? func_get_arg(0), "\n";}},
      100);
  p40:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: FizzBuzzのロジック
  - kind: para
    text: <?php const FB = ['FizzBuzz', null, null, 'Fizz', null,'Buzz', 'Fizz', null,
      null, 'Fizz', 'Buzz', null,'Fizz', null, null];
  - kind: para
    text: call_user_func(new class { function __invoke() {if (func_get_arg(0) -1 )call_user_func(__METHOD__,
      func_get_arg(0) - 1);echo FB[func_get_arg(0) % 15] ?? func_get_arg(0), "\n";}},
      100);
  p41:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: <?php const FB = ['FizzBuzz', null, null, 'Fizz', null,'Buzz', 'Fizz', null,
      null, 'Fizz', 'Buzz', null,'Fizz', null, null];
  - kind: para
    text: 100から0になるまで、自分自身の関数を呼び出す
  - kind: para
    text: call_user_func(new class { function __invoke() {if (func_get_arg(0) -1 )call_user_func(__METHOD__,
      func_get_arg(0) - 1);echo FB[func_get_arg(0) % 15] ?? func_get_arg(0), "\n";}},
      100);
  p42:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: <?php const FB = ['FizzBuzz', null, null, 'Fizz', null,'Buzz', 'Fizz', null,
      null, 'Fizz', 'Buzz', null,'Fizz', null, null];
  - kind: para
    text: FizzBuzzをプリント
  - kind: para
    text: call_user_func(new class { function __invoke() {if (func_get_arg(0) -1 )call_user_func(__METHOD__,
      func_get_arg(0) - 1);echo FB[func_get_arg(0) % 15] ?? func_get_arg(0), "\n";}},
      100);
  p43:
  - kind: heading
    level: 1
    text: PHPにおける $
  - kind: para
    text: <?php const FB = ['FizzBuzz', null, null, 'Fizz', null,'Buzz', 'Fizz', null,
      null, 'Fizz', 'Buzz', null,'Fizz', null, null];
  - kind: para
    text: 引数をとる
  - kind: para
    text: call_user_func(new class { function __invoke() {if (func_get_arg(0) -1 )call_user_func(__METHOD__,
      func_get_arg(0) - 1);echo FB[func_get_arg(0) % 15] ?? func_get_arg(0), "\n";}},
      100);
  p44:
  - kind: para
    text: 変数禁止って言ってんのに
  - kind: para
    text: func_get_arg(0)使ってるのずるくね？
  p45:
  - kind: para
    text: ずるいとってもずるい
  p46:
  - kind: para
    text: しかしfunc_get_arg()を禁止すると関数が完全に利用不能になるので難易度急上昇↑↑
  p47:
  - kind: para
    text: 今回は妥協
  p48:
  - kind: para
    text: 今回は再帰呼び出しする
  - kind: para
    text: ことで状態更新を回避
  p49:
  - kind: para
    text: さらなる難易度を
  - kind: para
    text: 求めるあなたへ
  p50:
  - kind: para
    text: 難易度を下げる関数を禁止
  - kind: para
    text: 状態を持てる関数
  - kind: para
    text: APCu, getenv(), ini_get()
  - kind: para
    text: 変数テーブルの操作
  - kind: para
    text: compact(), extract()
  p51:
  - kind: para
    text: 難易度を下げる関数を禁止
  - kind: para
    text: 定数の動的定義
  - kind: para
    text: define(), constant()
  - kind: para
    text: 更新不能のグローバル変数として状態を持てるため
  - kind: para
    text: 禁止する文字を増やす
  - kind: para
    text: '{} とか : とか(両方は重い)'
