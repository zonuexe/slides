    - node: text
      content: <?phpWhat's PHP?It is a kind of Web platform.Small sites, many CMS,
        large scale SNS are built with PHP.It is also a general purpose programming
        language.
  p20:
  - node: p
    children:
    - node: text
      content: 手続き？PHP as a LanguagePHP is procedural and it has object-oriented feature.Weak
        typing and dynamic type-checking.PHP is relatively suitable for static analysis
        in dynamic langs.
  p21:
  - node: p
    children:
    - node: text
      content: '知らんけど“We have things like protected properties. We have abstract methods.
        We have all this stuff that your computer science '
    - node: bold
      content: '         '
    - node: text
      content: teacher told you you should be using. I don't care about this crap
        at all.”
    - node: bold
      content: '         '
    - node: text
      content: –Rasmus Lerdorfhttps://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p22:
  - node: p
    children:
    - node: text
      content: なんでもできるAbstract class, Trait, Interface, Generator, Iterator, Closure,
        Dynamic function call, Anonymous class, eval, Type declaration, Associative
        array (Hash table), Reflection API, Self-documentation, Standard I/O, REPL,
        Lazy class loading, etc...
  p23:
  - node: p
    children:
    - node: text
      content: 'ばらばらPHP coding stylesPHP can be run on cheap hosting servers.PHP as
        a HTML template,         PHP as a CGI script,         PHP as a OOP language...Various people share PHP.'
  p24:
  - node: p
    children:
    - node: text
      content: くぁwせdrftgyPHP needs IDE?In the early days of my career, there was no
        one around me developing with IDE.However, the scale of our code was huge
        and it was obvious that tool assistance is necessary.
  p25:
  - node: p
    children:
    - node: text
      content: 'ふじこｌｐ；＠ PHP with text editorThe usual way to code PHP with a text
        editor is tag jump.But project has multiple methods         with the same name in OOP.There is no smart input completion.'
  p26:
  - node: p
    children:
    - node: text
      content: むりぽRefactoring...?The important thing is sed and a visual check.Must
        allow the possibility of a run-time error due to refactoring.
  p27:
  - node: p
    children:
    - node: text
      content: PhotoshopPhpStorm
  p28:
  - node: p
    children:
    - node: text
      content: つよいJetBrains IDEPhpStorm is an IDE derived from IntelliJ IDEA (Java
        IDE).JetBrains' IDE is good at static analysis and refactoring.The PHP static
        analysis features of PhpStorm is practical.
  p29:
  - node: p
    children:
    - node: text
      content: 解析できるぞStatic AnalysisStatic analysis is required for error detection
        of code path not executed in test.PhpStorm can check mistakes with high accuracy
        if conditions for specifying types are available.
  p30:
  - node: p
    children:
    - node: text
      content: ミスがわかるCoding on PhpStorm
