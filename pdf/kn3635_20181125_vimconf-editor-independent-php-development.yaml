        the entire project preciselyIt's included LSP Server
  p41:
  - node: p
    children:
    - node: text
      content: 鬼速いPHPStanhttps://github.com/phpstan/phpstanDynamic and Static hybridVery
        fast and accurateSpecific RPC and LSP
  p42:
  - node: p
    children:
    - node: text
      content: 互換性PSR-5 (PHPDoc)PHP Standard Recommendation(Draft)PHPDoc is the de
        facto standard for writing type definitions in DocComment.They are working
        on the standard specification of that tag and type definition
  p43:
  - node: p
    children:
    - node: text
      content: 鬼速いPhpactorhttp://phpactor.github.io/phpactor/Phpactor provide code
        jump, completion, refactoringThis is under development and is now inferior
        to PhpStorm, but it is promising in the future.
