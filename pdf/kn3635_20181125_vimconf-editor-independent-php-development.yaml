    - node: text
      content: 'Awesome!         PhpStorm'
  p34:
  - node: p
    children:
    - node: text
      content: But, do we have to purchase PhpStorm to write PHP?
  p35:
  - node: p
    children:
    - node: text
      content: No, No.
  p36:
  - node: p
    children:
    - node: text
      content: Since we are developers, we can create FREE implementations other than
        PhpStorm.
