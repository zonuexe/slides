  p19:
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: What's PHP?
  - node: p
    children:
    - node: text
      content: It is a kind of Web platform.
  - node: p
    children:
    - node: text
      content: Small sites, many CMS, large scale SNS are built with PHP.
  - node: p
    children:
    - node: text
      content: 'It is also a general purpose '
    - node: br
    - node: text
      content: programming language.
  p20:
  - node: p
    children:
    - node: text
      content: 手続き？
  - node: p
    children:
    - node: text
      content: PHP as a Language
  - node: p
    children:
    - node: text
      content: 'PHP is procedural and it has '
    - node: br
    - node: text
      content: object-oriented feature.
  - node: p
    children:
    - node: text
      content: Weak typing and dynamic type-
    - node: br
    - node: text
      content: checking.
  - node: p
    children:
    - node: text
      content: 'PHP is relatively suitable for '
    - node: br
    - node: text
      content: static analysis in dynamic langs.
  p21:
  - node: p
    children:
    - node: text
      content: 知らんけど
  - node: p
    children:
    - node: bold
      content: '“We have things like protected properties. '
    - node: br
    - node: bold
      content: 'We have abstract methods. We have all '
    - node: br
    - node: bold
      content: 'this stuff that your computer science '
  - node: p
    children:
    - node: bold
      content: 'teacher told you you should be using. '
    - node: br
    - node: bold
      content: I don't care about this crap at all.”
  - node: p
    children:
    - node: bold
      content: –Rasmus Lerdorf
    - node: br
    - node: bold
      content: https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p22:
  - node: p
    children:
    - node: text
      content: なんでもできる
  - node: p
    children:
    - node: bold
      content: 'Abstract class, Trait, Interface, '
    - node: br
    - node: bold
      content: 'Generator, Iterator, Closure, Dynamic '
    - node: br
    - node: bold
      content: function call, Anonymous class, eval, Type declaration, Associative
        array (Hash table), Reflection API, Self-
    - node: text
      content: ' '
    - node: bold
      content: 'documentation, Standard I/O, REPL, '
    - node: br
    - node: bold
      content: Lazy class loading, etc...
  p23:
  - node: p
    children:
    - node: text
      content: ばらばら
  - node: p
    children:
    - node: text
      content: PHP coding styles
  - node: p
    children:
    - node: text
      content: 'PHP can be run on cheap '
    - node: br
    - node: text
      content: hosting servers.
  - node: p
    children:
    - node: text
      content: PHP as a HTML template,
  - node: p
    children:
    - node: text
      content: PHP as a CGI script,
  - node: p
    children:
    - node: text
      content: PHP as a OOP language...
  - node: p
    children:
    - node: text
      content: Various people share PHP.
  p24:
  - node: p
    children:
    - node: text
      content: くぁwせdrftgy
  - node: p
    children:
    - node: text
      content: PHP needs IDE?
  - node: p
    children:
    - node: text
      content: 'In the early days of my career, '
    - node: br
    - node: text
      content: 'there was no one around me '
    - node: br
    - node: text
      content: developing with IDE.
  - node: p
    children:
    - node: text
      content: 'However, the scale of our code was huge and it was obvious that '
    - node: br
    - node: text
      content: tool assistance is necessary.
  p25:
  - node: p
    children:
    - node: text
      content: 'ふじこｌｐ；＠ '
  - node: p
    children:
    - node: text
      content: PHP with text editor
  - node: p
    children:
    - node: text
      content: 'The usual way to code PHP with a '
    - node: br
    - node: text
      content: text editor is tag jump.
  - node: p
    children:
    - node: text
      content: But project has multiple methods
  - node: p
    children:
    - node: text
      content: with the same name in OOP.
  - node: p
    children:
    - node: text
      content: 'There is no smart input '
    - node: br
    - node: text
      content: completion.
  p26:
  - node: p
    children:
    - node: text
      content: むりぽ
  - node: p
    children:
    - node: text
      content: Refactoring...?
  - node: p
    children:
    - node: text
      content: 'The important thing is sed and a '
    - node: br
    - node: text
      content: visual check.
  - node: p
    children:
    - node: text
      content: 'Must allow the possibility of a '
    - node: br
    - node: text
      content: 'run-time error due to '
    - node: br
    - node: text
      content: refactoring.
  p27:
  - node: p
    children:
    - node: text
      content: Photoshop
  - node: p
    children:
    - node: text
      content: PhpStorm
  p28:
  - node: p
    children:
    - node: text
      content: つよい
  - node: p
    children:
    - node: text
      content: JetBrains IDE
  - node: p
    children:
    - node: text
      content: 'PhpStorm is an IDE derived from '
    - node: br
    - node: text
      content: IntelliJ IDEA (Java IDE).
  - node: p
    children:
    - node: text
      content: 'JetBrains'' IDE is good at static '
    - node: br
    - node: text
      content: analysis and refactoring.
  - node: p
    children:
    - node: text
      content: 'The PHP static analysis features '
    - node: br
    - node: text
      content: of PhpStorm is practical.
  p29:
  - node: p
    children:
    - node: text
      content: 解析できるぞ
  - node: p
    children:
    - node: text
      content: Static Analysis
  - node: p
    children:
    - node: text
      content: 'Static analysis is required for '
    - node: br
    - node: text
      content: 'error detection of code path not '
    - node: br
    - node: text
      content: executed in test.
  - node: p
    children:
    - node: text
      content: PhpStorm can check mistakes with high accuracy if conditions for specifying
        types are available.
  p30:
  - node: p
    children:
    - node: text
      content: ミスがわかる
  - node: p
    children:
    - node: text
      content: Coding on PhpStorm
  p31:
  - node: p
    children:
    - node: text
      content: スマート
  - node: p
    children:
    - node: text
      content: Coding on PhpStorm
  - node: p
    children:
    - node: text
      content: Typed
  p32:
  - node: p
    children:
    - node: text
      content: わかりやすい
  - node: p
    children:
    - node: text
      content: Coding on PhpStorm
  - node: p
    children:
    - node: text
      content: 'Popup '
    - node: br
    - node: text
      content: signature
  p33:
  - node: p
    children:
    - node: text
      content: Awesome!
  - node: p
    children:
    - node: text
      content: PhpStorm
  p34:
  - node: p
    children:
    - node: text
      content: 'But, do we have to purchase PhpStorm '
    - node: br
    - node: text
      content: to write PHP?
  p35:
  - node: p
    children:
    - node: text
      content: No, No.
  p36:
  - node: p
    children:
    - node: text
      content: 'Since we are developers, '
    - node: br
    - node: text
      content: 'we can create FREE '
    - node: br
    - node: text
      content: 'implementations other '
    - node: br
    - node: text
      content: than PhpStorm.
  p37:
  - node: p
    children:
    - node: text
      content: クォリティﾀｶｽ
  - node: p
    children:
    - node: text
      content: PHP QA Projects
  p38:
  - node: p
    children:
    - node: text
      content: 'Several PHP static analyzer projects '
    - node: br
    - node: text
      content: are active
  p39:
  - node: p
    children:
    - node: text
      content: Phan
    - node: br
    - node: text
      content: PHPStan Phpactor
  p40:
  - node: p
    children:
    - node: text
      content: 鬼強い
  - node: p
    children:
    - node: text
      content: Phan
  - node: p
    children:
    - node: text
      content: https://github.com/phan/phan
  - node: p
    children:
    - node: text
      content: Static analyzer
  - node: p
    children:
    - node: text
      content: 'Slow, but it inspects the entire '
    - node: br
    - node: text
      content: project precisely
  - node: p
    children:
    - node: text
      content: It's included LSP Server
  p41:
  - node: p
    children:
    - node: text
      content: 鬼速い
  - node: p
    children:
    - node: text
      content: PHPStan
  - node: p
    children:
    - node: text
      content: https://github.com/phpstan/phpstan
  - node: p
    children:
    - node: text
      content: Dynamic and Static hybrid
  - node: p
    children:
    - node: text
      content: Very fast and accurate
  - node: p
    children:
    - node: text
      content: Specific RPC and LSP
  p42:
  - node: p
    children:
    - node: text
      content: 互換性
  - node: p
    children:
    - node: text
      content: PSR-5 (PHPDoc)
  - node: p
    children:
    - node: text
      content: PHP Standard Recommendation(Draft)
  - node: p
    children:
    - node: text
      content: 'PHPDoc is the de facto standard for '
    - node: br
    - node: text
      content: 'writing type definitions in '
    - node: br
    - node: text
      content: DocComment.
  - node: p
    children:
    - node: text
      content: 'They are working on the standard specification of that tag and type '
    - node: br
    - node: text
      content: definition
  p43:
  - node: p
    children:
    - node: text
      content: 鬼速い
  - node: p
    children:
    - node: text
      content: Phpactor
  - node: p
    children:
    - node: text
      content: http://phpactor.github.io/phpactor/
  - node: p
    children:
    - node: text
      content: 'Phpactor provide code jump, '
    - node: br
    - node: text
      content: completion, refactoring
  - node: p
    children:
    - node: text
      content: 'This is under development and is now inferior to PhpStorm, but it '
    - node: br
    - node: text
      content: is promising in the future.
  p44:
  - node: p
    children:
    - node: text
      content: 各位仲良く
  - node: p
    children:
    - node: text
      content: Editor-independent
    - node: br
    - node: text
      content: Movements
  p45:
  - node: p
    children:
    - node: text
      content: スマート
  - node: p
    children:
    - node: text
      content: LSP
  - node: p
    children:
    - node: text
      content: Language Server Protocol
  - node: p
    children:
    - node: text
      content: https://microsoft.github.io/language-server-protocol/
  - node: p
    children:
    - node: text
      content: 'A Language Server is meant to provide '
    - node: br
    - node: text
      content: 'the language-specific smarts and '
    - node: br
    - node: text
      content: 'communicate with development tools '
    - node: br
    - node: text
      content: over a protocol that enables inter-
    - node: br
    - node: text
      content: process communication.
  p46:
  - node: p
    children:
    - node: text
      content: Tab vs Space
  - node: p
