text:
  p1:
  - kind: para
    text: エディタ中立なPHP開発環境の現在
  - kind: para
    text: 公開版
  - kind: heading
    level: 1
    text: Modern editor-independent
  - kind: heading
    level: 1
    text: development
  - kind: heading
    level: 1
    text: environment for PHP
  - kind: para
    text: 2018-11-23 Akiba Tokyo, Japan
  - kind: para
    text: 'VimConf 2018 #vimconf'
  p2:
  - kind: heading
    level: 1
    text: 日本語でおｋ
  - kind: para
    text: 筆者の英語は残念なので
  - kind: para
    text: 発表済みの日本語資料を
  - kind: para
    text: 先に読むことをおすすめ
  p3:
  - kind: para
    text: aka @tadsan
  - kind: para
    text: Who am I...?
  - kind: para
    text: Kenta Usami (うさみけんた, @zonuexe)
  - kind: para
    text: Language hobbyist, I love Lisp.
  - kind: para
    text: Web programmer @pixiv
  - kind: para
    text: Founder of Emacs-PHP
  - kind: para
    text: https://github.com/emacs-php
  p4:
  - kind: para
    text: My favorite text editors
  - kind: para
    text: Maruo Editor (秀丸)
  - kind: para
    text: Mery
  p5:
  - kind: para
    text: I usually use Emacs
  - kind: para
    text: That's because it's a Lisp
  - kind: para
    text: machine that is easy for me to
  - kind: para
    text: hack.
  - kind: para
    text: There are reasons for each
  - kind: para
    text: person to choose an editor.
  - kind: para
    text: I am a professional programmer
  - kind: para
    text: so I would like to raise
  - kind: para
    text: development efficiency.
  p6:
  - kind: para
    text: First of all...
  p7:
  - kind: para
    text: We hate
  - kind: para
    text: “Religious War”
  - kind: para
    text: 宗教戦争
  p8:
  - kind: para
    text: Code of Conduct
  p9:
  - kind: para
    text: Windows
  - kind: para
    text: vs
  - kind: para
    text: UNIX
  p10:
  - kind: para
    text: Tab
  - kind: para
    text: vs
  - kind: para
    text: Space
  p11:
  - kind: para
    text: Statically typed
  - kind: para
    text: vs
  - kind: para
    text: Dynamic typing
  p12:
  - kind: para
    text: '...and'
  p13:
  - kind: para
    text: Emacs
  - kind: para
    text: vs
  - kind: para
    text: vi
  p14:
  - kind: para
    text: 'No'
  - kind: para
    text: It was a joke?
  - kind: para
    text: It violates professionalism.
  - kind: heading
    level: 1
    text: 
  p15:
  - kind: para
    text: おｋ？
  - kind: para
    text: Even outside
  - kind: para
    text: the conference.
  - kind: para
    text: Is that okay?
  p16:
  - kind: para
    text: リスペクト
  - kind: para
    text: Text editor and Plugin
  - kind: para
    text: developers and power users
  - kind: para
    text: respect each other and
  - kind: para
    text: incorporate the trends of
  - kind: para
    text: other text editors.
  p17:
  - kind: para
    text: Rainbow Brackets
  p18:
  - kind: para
    text: ElePHPant
  p19:
  - kind: para
    text: <?php
  - kind: para
    text: What's PHP?
  - kind: para
    text: It is a kind of Web platform.
  - kind: para
    text: Small sites, many CMS, large
  - kind: para
    text: scale SNS are built with PHP.
  - kind: para
    text: It is also a general purpose
  - kind: para
    text: programming language.
  p20:
  - kind: para
    text: 手続き？
  - kind: para
    text: PHP as a Language
  - kind: para
    text: PHP is procedural and it has
  - kind: para
    text: object-oriented feature.
  - kind: para
    text: Weak typing and dynamic type-
  - kind: para
    text: checking.
  - kind: para
    text: PHP is relatively suitable for
  - kind: para
    text: static analysis in dynamic langs.
  p21:
  - kind: para
    text: 知らんけど
  - kind: para
    text: “We have things like protected properties.
  - kind: para
    text: We have abstract methods. We have all
  - kind: para
    text: this stuff that your computer science
  - kind: para
    text: teacher told you you should be using.
  - kind: para
    text: I don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf
  - kind: para
    text: https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p22:
  - kind: para
    text: なんでもできる
  - kind: para
    text: Abstract class, Trait, Interface,
  - kind: para
    text: Generator, Iterator, Closure, Dynamic
  - kind: para
    text: function call, Anonymous class, eval,
  - kind: para
    text: Type declaration, Associative array
  - kind: para
    text: (Hash table), Reflection API, Self-
  - kind: para
    text: documentation, Standard I/O, REPL,
  - kind: para
    text: Lazy class loading, etc...
  p23:
  - kind: para
    text: ばらばら
  - kind: para
    text: PHP coding styles
  - kind: para
    text: PHP can be run on cheap
  - kind: para
    text: hosting servers.
  - kind: para
    text: PHP as a HTML template,
  - kind: para
    text: PHP as a CGI script,
  - kind: para
    text: PHP as a OOP language...
  - kind: para
    text: Various people share PHP.
  p24:
  - kind: para
    text: くぁwせdrftgy
  - kind: para
    text: PHP needs IDE?
  - kind: para
    text: In the early days of my career,
  - kind: para
    text: there was no one around me
  - kind: para
    text: developing with IDE.
  - kind: para
    text: However, the scale of our code
  - kind: para
    text: was huge and it was obvious that
  - kind: para
    text: tool assistance is necessary.
  p25:
  - kind: para
    text: ふじこｌｐ；＠
  - kind: para
    text: PHP with text editor
  - kind: para
    text: The usual way to code PHP with a
  - kind: para
    text: text editor is tag jump.
  - kind: para
    text: But project has multiple methods
  - kind: para
    text: with the same name in OOP.
  - kind: para
    text: There is no smart input
  - kind: para
    text: completion.
  p26:
  - kind: para
    text: むりぽ
  - kind: para
    text: Refactoring...?
  - kind: para
    text: The important thing is sed and a
  - kind: para
    text: visual check.
  - kind: para
    text: Must allow the possibility of a
  - kind: para
    text: run-time error due to
  - kind: para
    text: refactoring.
  p27:
  - kind: para
    text: Photoshop
  - kind: heading
    level: 1
    text: PhpStorm
  p28:
  - kind: para
    text: つよい
  - kind: para
    text: JetBrains IDE
  - kind: para
    text: PhpStorm is an IDE derived from
  - kind: para
    text: IntelliJ IDEA (Java IDE).
  - kind: para
    text: JetBrains' IDE is good at static
  - kind: para
    text: analysis and refactoring.
  - kind: para
    text: The PHP static analysis features
  - kind: para
    text: of PhpStorm is practical.
  p29:
  - kind: para
    text: 解析できるぞ
  - kind: para
    text: Static Analysis
  - kind: para
    text: Static analysis is required for
  - kind: para
    text: error detection of code path not
  - kind: para
    text: executed in test.
  - kind: para
    text: PhpStorm can check mistakes
  - kind: para
    text: with high accuracy if conditions
  - kind: para
    text: for specifying types are available.
  p30:
  - kind: para
    text: ミスがわかる
  - kind: heading
    level: 1
    text: Coding on PhpStorm
  p31:
  - kind: para
    text: スマート
  - kind: heading
    level: 1
    text: Coding on PhpStorm
  - kind: heading
    level: 2
    text: Typed
  p32:
  - kind: para
    text: わかりやすい
  - kind: para
    text: Coding on PhpStorm
  - kind: para
    text: Popup
  - kind: para
    text: signature
  p33:
  - kind: para
    text: Awesome!
  - kind: para
    text: PhpStorm
  p34:
  - kind: para
    text: But, do we have to
  - kind: para
    text: purchase PhpStorm
  - kind: para
    text: to write PHP?
  p35:
  - kind: para
    text: No, No.
  p36:
  - kind: para
    text: Since we are developers,
  - kind: para
    text: we can create FREE
  - kind: para
    text: implementations other
  - kind: para
    text: than PhpStorm.
  p37:
  - kind: para
    text: クォリティﾀｶｽ
  - kind: para
    text: PHP QA
  - kind: para
    text: Projects
  p38:
  - kind: para
    text: Several PHP static
  - kind: para
    text: analyzer projects
  - kind: para
    text: are active
  p39:
  - kind: para
    text: Phan
  - kind: para
    text: PHPStan
  - kind: para
    text: Phpactor
  p40:
  - kind: para
    text: 鬼強い
  - kind: para
    text: Phan
  - kind: para
    text: https://github.com/phan/phan
  - kind: para
    text: Static analyzer
  - kind: para
    text: Slow, but it inspects the entire
  - kind: para
    text: project precisely
  - kind: para
    text: It's included LSP Server
  p41:
  - kind: para
    text: 鬼速い
  - kind: para
    text: PHPStan
  - kind: para
    text: https://github.com/phpstan/phpstan
  - kind: para
    text: Dynamic and Static hybrid
  - kind: para
    text: Very fast and accurate
  - kind: para
    text: Specific RPC and LSP
  p42:
  - kind: para
    text: 互換性
  - kind: heading
    level: 1
    text: PSR-5 (PHPDoc)
  - kind: para
    text: PHP Standard Recommendation(Draft)
  - kind: para
    text: PHPDoc is the de facto standard for
  - kind: para
    text: writing type definitions in
  - kind: para
    text: DocComment.
  - kind: para
    text: They are working on the standard
  - kind: para
    text: specification of that tag and type
  - kind: para
    text: definition
  p43:
  - kind: para
    text: 鬼速い
  - kind: para
    text: Phpactor
  - kind: para
    text: http://phpactor.github.io/phpactor/
  - kind: para
    text: Phpactor provide code jump,
  - kind: para
    text: completion, refactoring
  - kind: para
    text: This is under development and is
  - kind: para
    text: now inferior to PhpStorm, but it
  - kind: para
    text: is promising in the future.
  p44:
  - kind: para
    text: 各位仲良く
  - kind: para
    text: Editor-independent
  - kind: para
    text: Movements
  p45:
  - kind: para
    text: スマート
  - kind: heading
    level: 1
    text: LSP
  - kind: heading
    level: 1
    text: Language Server Protocol
  - kind: para
    text: https://microsoft.github.io/language-server-protocol/
  - kind: para
    text: A Language Server is meant to provide
  - kind: para
    text: the language-specific smarts and
  - kind: para
    text: communicate with development tools
  - kind: para
    text: over a protocol that enables inter-
  - kind: para
    text: process communication.
  p46:
  - kind: para
    text: Tab vs Space
  - kind: para
    text: EditorConfig
  - kind: para
    text: https://editorconfig.org/
  - kind: para
    text: Indent and Newline code can be
  - kind: para
    text: set for each file name and
  - kind: para
    text: extension.
  p47:
  - kind: para
    text: エディタ横断
  - kind: heading
    level: 1
    text: EditorConfig
  - kind: para
    text: '# Unix-style newlines with a newline ending every file'
  - kind: para
    text: '[*]'
  - kind: para
    text: end_of_line = lf
  - kind: para
    text: insert_final_newline = true
  - kind: para
    text: '# Set default charset'
  - kind: para
    text: '[*.{js,py}]'
  - kind: para
    text: charset = utf-8
  - kind: para
    text: '# 4 space indentation'
  - kind: para
    text: '[*.py]'
  - kind: para
    text: indent_style = space
  - kind: para
    text: indent_size = 4
  - kind: para
    text: '# Tab indentation (no size specified)'
  - kind: para
    text: '[Makefile]'
  - kind: para
    text: indent_style = tab
  p48: []
  p49:
  - kind: para
    text: vim
  - kind: heading
    level: 1
    text: On Vim
  p50:
  - kind: para
    text: 編集中にわかる
  - kind: heading
    level: 1
    text: ALE
  - kind: para
    text: Asynchronous Lint Engine
  - kind: para
    text: https://github.com/w0rp/ale
  - kind: para
    text: ALE supports PHP syntax checker,
  - kind: para
    text: PHPStan, Phan, Psalm, PHP CS,
  - kind: para
    text: PHP-CS-Fixer and LSP
  p51:
  - kind: para
    text: ミスがわかる
  - kind: heading
    level: 1
    text: Coding on Vim+ALE
  p52:
  - kind: para
    text: 型付けされてる
  - kind: heading
    level: 1
    text: Coding on Vim+ALE
  - kind: para
    text: https://camo.qiitausercontent.com/
  - kind: para
    text: 63f80f6472f7de44d28a25cf275c2f80d782d94e/
  - kind: para
    text: 68747470733a2f2f71696974612d696d6167652d73746f7265
  - kind: para
    text: 2e73332e616d617a6f6e6177732e636f6d2f302f343132312f3
  - kind: para
    text: 8373535663234332d353532662d663939302d373266332d
  - kind: para
    text: 3561303835643563643334392e706e67
  - kind: heading
    level: 2
    text: Typed
  p53:
  - kind: para
    text: リファクタ
  - kind: heading
    level: 1
    text: Phpactor
  - kind: para
    text: Phpactor Vim Plugin Provides
  - kind: para
    text: Context menu
  - kind: para
    text: Code Navigation
  - kind: para
    text: Completion (It supports Vim's
  - kind: para
    text: Omni-completion, Deoplete,
  - kind: para
    text: NeoVim's NCM and NCM 2)
  p54:
  - kind: para
    text: なにそれ
  - kind: heading
    level: 1
    text: Veonim
  p55:
  - kind: para
    text: やばい
  - kind: heading
    level: 1
    text: Veonim
  - kind: para
    text: veonim is a simple modal IDE built on
  - kind: para
    text: neovim.
  - kind: para
    text: https://github.com/veonim/veonim
  - kind: para
    text: That is integrated with LSP and has a
  - kind: para
    text: graphical interface like IDE.
  - kind: para
    text: Veonim realized almost all the
  - kind: para
    text: functions I wanted as ideal Vim.
  p56:
  - kind: para
    text: やばい
  - kind: heading
    level: 1
    text: Veonim
  - kind: para
    text: I learned Veonim by @ShougoMatsu
  - kind: para
    text: two weeks ago.
  - kind: para
    text: He said that I do not use yet
  - kind: para
    text: because my plugins does not work.
  - kind: para
    text: I have not finished studying Veonim
  - kind: para
    text: yet, but this may be a wonderful IDE
