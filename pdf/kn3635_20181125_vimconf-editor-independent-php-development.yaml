      content: リスペクト
  - node: p
    children:
    - node: text
      content: 'Text editor and Plugin '
    - node: br
    - node: text
      content: 'developers and power users '
    - node: br
    - node: text
      content: 'respect each other and '
    - node: br
    - node: text
      content: 'incorporate the trends of '
    - node: br
    - node: text
      content: other text editors.
  p17:
