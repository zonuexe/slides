text:
  p1:
  - kind: heading
    level: 1
    text: “慈悲深いユニオン”とは何か
  - kind: heading
    level: 2
    text: What's benevolent union?
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 'PHP勉強会 in 神戸2024-07-19 #関ガレ'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - kind: para
    text: 最近のプログラミング言語っぽい発表
  - kind: list
    items:
    - 「コードを自在に操るためのPHP文法入門」
  - kind: para
    text: (2月 PHPカンファレンス関西2024)
  - kind: list
    items:
    - 「こんな静的解析導入は負けフラグ」 (3月 PHPerKaigi)
    - 「動的言語型付けバトル」 (3月 PHPerKaigi)
  p4:
  - kind: heading
    level: 2
    text: さてみなさん
  - kind: heading
    level: 1
    text: Now, everyone
  p5:
  - kind: para
    text: 静的解析は好きですか？
  - kind: heading
    level: 1
    text: Do you like static
  - kind: heading
    level: 1
    text: type analysis?
  p6:
  - kind: para
    text: <?php
  - kind: para
    text: $v = [1, 2, 3];echo json_decode($v);
  p7:
  - kind: para
    text: <?php
  - kind: para
    text: $v = [1, 2, 3];echo json_decode($v);
  p8:
  - kind: para
    text: <?php
  - kind: para
    text: $v = [1, 2, 3];echo json_encode($v);
  p9:
  - kind: para
    text: <?php
  - kind: para
    text: $v = '[1, 2, 3]';var_dump(json_decode($v));
  p10:
  - kind: para
    text: 静的型検査万歳型チェッカーは常に愚かな我々に先んじてプログラムのミスを指摘してくれる… そうですよね？
  p11:
  - kind: para
    text: 次のスライドのコードはどうでしょうか？
  p12:
  - kind: para
    text: <?php
  - kind: para
    text: $v = file_get_contents('data.json');var_dump(json_decode($v));
  p13:
  - kind: para
    text: <?php
  - kind: para
    text: $v = file_get_contents('data.json');var_dump(json_decode($v));
  p14: []
  p15:
  - kind: para
    text: なんでfalse？？
  - kind: heading
    level: 1
    text: どうしてこの関数は失敗したら
  - kind: heading
    level: 1
    text: falseを返すのはなんで？？？
  p16:
  - kind: para
    text: デプロイのミス
  - kind: para
    text: A-1.要求されたファイルが正しく配置されなかった
  p17:
  - kind: para
    text: ファイルの存在チェックしてない
  - kind: heading
    level: 1
    text: A-2.
  - kind: heading
    level: 1
    text: 動的に生成されるファイルを
  - kind: heading
    level: 1
    text: file_exists()でチェックせずに
  - kind: heading
    level: 1
    text: アクセスしてしまった
  - kind: para
    text: この手法は潜在的なリスクがある…
  p18:
  - kind: para
    text: <?php
  - kind: para
    text: if (!file_exists('data.json')) {return;}
  - kind: para
    text: // maybe safe$v = file_get_contents('data.json');var_dump(json_decode($v));
  p19:
  - kind: para
    text: <?php
  - kind: para
    text: この関数がfalseを返すことはない… たぶん…おそらく… きっと…
  - kind: para
    text: if (!file_exists('data.json')) {return;}
  - kind: para
    text: // maybe safe?$v = file_get_contents('data.json');var_dump(json_decode($v));
  p20:
  - kind: heading
    level: 1
    text: <?php
  - kind: para
    text: $vが絶対にfalseになっていないことをアサーション(表明)
  - kind: heading
    level: 1
    text: $v = file_get_contents('data.json');
  - kind: heading
    level: 1
    text: assert($v !== false);
  - kind: heading
    level: 1
    text: var_dump(json_decode($v));
  p21:
  - kind: para
    text: 実際にはfalseが返ってくる可能性を見て見ぬふり
  - kind: para
    text: <?php
  - kind: para
    text: /** @var string */$v = file_get_contents('data.json');
  - kind: para
    text: var_dump(json_decode($v));
  p22:
  - kind: para
    text: ほんとにfalse返すの？
  - kind: heading
    level: 1
    text: Q. ところで file_get_contents()
  - kind: heading
    level: 1
    text: ほんとにほんとにfalse返すの？
  p23:
  - kind: para
    text: 実行時のハンドラー設定に依存する
  - kind: heading
    level: 1
    text: Q. 実行時のハンドラー設定に
  - kind: heading
    level: 1
    text: 依存する
  p24: []
  p25: []
  p26: []
  p27: []
  p28: []
  p29:
  - kind: para
    text: 状況整理
  - kind: heading
    level: 1
    text: どういう状況が考えられるか
  - kind: heading
    level: 1
    text: 一度確認してみましょう
  p30:
  - kind: heading
    level: 1
    text: file_get_contents() が返すのは...
  - kind: list
    items:
    - error_reporting(0) 設定のとき…
    - 関数は常に string と false のどちらも返す可能性がある
    - PHPの既定の振る舞いではファイルが読み込めなくても停止しない
    - ハンドラでエラーをErrorExceptionに変換しているとき…
    - 関数は常に string 値を返す。falseが返ってくることはありえない。
    - 多くのPHPアプリケーションではフレームワークによって設定済み
  p31:
  - kind: para
    text: falseが返ってこないなら
  - kind: para
    text: この確認は常に無駄！
  - kind: para
    text: <?php
  - kind: para
    text: $v = file_get_contents('data.json');
  - kind: para
    text: assert($v !== false);var_dump(json_decode($v));
  p32:
  - kind: heading
    level: 2
    text: 本題
  - kind: heading
    level: 1
    text: ここからがタイトルのネタ
  p33:
  - kind: heading
    level: 1
    text: “慈悲深いユニオン”とは何か
  - kind: heading
    level: 2
    text: What's benevolent union?
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 'PHP勉強会 in 神戸2024-07-19 #関ガレ'
  p34:
  - kind: para
    text: 謎の型
  - kind: heading
    level: 1
    text: __benevolent<> は
  - kind: heading
    level: 1
    text: PHPStanに実装された隠し機能
  p35:
  - kind: para
    text: functionMap
  - kind: para
    text: TypeResolver
  - kind: para
    text: Test code
  p36:
  - kind: heading
    level: 2
    text: なんだこれ？
  - kind: heading
    level: 1
    text: で、結局なにこれ????
  p37: []
  p38: []
  p39:
  - kind: para
    text: これらの関数の共通点を探ってみましょう
  p40: []
  p41: []
  p42: []
  p43:
  - kind: para
    text: __benevolent<>が使われた関数の共通点は？
  - kind: list
    items:
    - これらの関数は異常な状態でfalseを返す可能性がある
    - 引数に適切なパラメータを渡して呼び出す限りfalseが返されることはない
  - kind: para
    text: ので、呼び出し後に毎回型検査をするのは不毛
  - kind: list
    items:
    - PHP 8でfalseを返す代りにErrorがthrowされるようになった
  p44:
  - kind: para
    text: __benevolent<>って結局どう動くの？
  p45: []
  p46:
  - kind: para
    text: この型を使えば標準関数を使いやすくするラッパーも作れる
  p47: []
  p48:
  - kind: para
    text: 便利っぽい…?んだけど、使わないでね！
  p49:
  - kind: heading
    level: 1
    text: benevolent unionを濫用するな
  - kind: list
    items:
    - この型は、例外的な状態でfalseを返すまれなケースを表現するのに役立つ
    - その関数が間違った前提条件で呼び出された場合は、false を返す代わり
  - kind: para
    text: に例外を発生させ、呼び出しコードを修正する。
  - kind: list
    items:
    - その他の例外的な状況では、例外をスローして呼び出し元に処理させるべ
  - kind: para
    text: き。Javaのチェック例外みたいに。
  p50:
  - kind: para
    text: 安全性を保ちコードの繰り返しを防ぐには？
  p51: []
  p52: []
  p53: []
  p54:
  - kind: heading
    level: 1
    text: この関数はFileSystemExceptionをthrowsする
  p55:
  - kind: heading
    level: 1
    text: PhpStormはハンドリングしない例外を警告する
  p56: []
  p57:
  - kind: para
    text: benevolent unionよりも構造化された例外を！！
  p58:
  - kind: para
    text: みんなのコードではbenevolent unionsを使わないでね！
