text:
  p1:
  - node: p
    children:
    - node: text
      content: 'PHP 5.4から8までを '
    - node: br
    - node: text
      content: ⚡
    - node: br
    - node: text
      content: サポートするCIを構築する
  - node: p
    children:
    - node: text
      content: 'Build a CI that supports PHP 5.4 to 8.x '
  - node: p
    children:
    - node: text
      content: ⚡
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2023-10-05 '
  - node: p
    children:
    - node: bold
      content: '【Cybozu Tech Meetup #22】PHPカンファレンス 2023 リジェクトコン '
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職でPHPを書いているWebプログラマ
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - node: p
    children:
    - node: text
      content: emacs-php
  p4:
  - node: p
    children:
    - node: text
      content: このトークの文脈
  p5:
  - node: p
    children:
    - node: text
      content: 今回のお題
  p6:
  - node: p
    children:
    - node: text
      content: '※注意： '
    - node: br
    - node: text
      content: 本発表はレガシーPHPを 使い続けることを推奨する ものではございませぬぞ
  p7:
  - node: p
    children:
    - node: text
      content: みなさんライブラリを
    - node: br
    - node: text
      content: 公開していますか?
  p8:
  - node: p
    children:
    - node: text
      content: '(たぶんあまり居ないと思うので) '
    - node: br
    - node: text
      content: しましょう
  p9:
  - node: p
    children:
    - node: text
      content: PHPどこまで切るか
  p10:
  - node: p
    children:
    - node: text
      content: そもそも誰が 使ってるの？
  p11:
  - node: p
    children:
    - node: text
      content: 数を見てみよう
  p12: []
  p13: []
  p14: []
  p15:
  - node: p
    children:
    - node: text
      content: Packagist Statsについて
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Packagist = Composerのデフォルトリポジトリ
    - node: li
      children:
      - node: text
        content: composer install時に送られるPHPバージョンが集計される
    - node: li
      children:
      - node: text
        content: インストール回数なので本番運用環境での利用回数ではないので注意
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 開発者が多かったりデプロイ回数が多かったりキャッシュ構造に左右
        - node: li
          children:
          - node: text
            content: とはいえ、ある種の勢いが表現されていることは確か
  p16:
  - node: p
    children:
    - node: text
      content: 私が開発している ライブラリの場合
  p17:
  - node: p
    children:
    - node: text
      content: 5.x
  - node: p
    children:
    - node: text
      content: 7.x
  - node: p
    children:
    - node: text
      content: 8.x
  p18:
  - node: p
    children:
    - node: text
      content: zonuexe/tetosqlについて
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: これが何者かはPHPカンファレンスで話します！！！
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 間接的にPDOに依存しているが、PHPのバージョン依存はあまりない
    - node: li
      children:
      - node: text
        content: もともとは5.5以上の対応だったが途中で心変わりして5.4対応にした
    - node: li
      children:
      - node: text
        content: 2022年4月に何かが起こった (お察しください)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 途中で7.2と8.2が増え、5.xは潰えた (たぶんそれは…)
  p19:
  - node: p
    children:
    - node: bold
      content: '5.xが全滅したので '
    - node: br
    - node: bold
      content: 'サポート終了の判断が '
    - node: br
    - node: bold
      content: できる
  - node: p
    children:
    - node: text
      content: 5.x
  - node: p
    children:
    - node: text
      content: 7.x
  - node: p
    children:
    - node: text
      content: 8.x
  p20:
  - node: p
    children:
    - node: text
      content: サポート対象の決め方
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP Groupが公式サポートしているバージョンを対象にする
    - node: li
      children:
      - node: text
        content: 自分が(個人|会社)で使っているバージョンをサポートする
    - node: li
      children:
      - node: text
        content: 現実的にサポート可能なバージョンは全てサポートする
  - node: p
    children:
    - node: text
      content: 💪
  - node: p
    children:
    - node: text
      content: '一般論としてはバージョンが上がれば '
    - node: br
    - node: text
      content: 新しい機能や新しい構文が使えて嬉しい！！！
  p21: []
  p22:
  - node: p
    children:
    - node: text
      content: PHPのオブジェクト指向機能
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'PHP 7.4: 型付きプロパティ'
    - node: li
      children:
      - node: text
        content: 'PHP 8.0: コンストラクタプロモーション (PHP 8.2)'
    - node: li
      children:
      - node: text
        content: 'PHP 8.1: readonlyプロパティ'
    - node: li
      children:
      - node: text
        content: 'PHP 8.2: trait定数宣言'
    - node: li
      children:
      - node: text
        content: 'PHP 8.3: 型付き定数宣言'
  p23:
  - node: p
    children:
    - node: text
      content: '<?php  <?php '
  - node: p
    children:
    - node: text
      content: 'class Book {  class Book { '
    - node: br
    - node: text
      content: '  /**      public function __construct( '
    - node: br
    - node: text
      content: '   * @var string          public readonly string $name, '
    - node: br
    - node: text
      content: '   * @readonly      ) {    */      } '
    - node: br
    - node: text
      content: '  private $name; '
    - node: br
    - node: text
      content: '     ... '
    - node: br
    - node: text
      content: '  /** @param string $name */ '
    - node: br
    - node: text
      content: '  public function __construct($name) { '
    - node: br
    - node: text
      content: '    $this->name = $name; '
  - node: p
    children:
    - node: text
      content: '  ...'
  p24:
  - node: p
    children:
    - node: text
      content: 'そういうおしゃれな '
    - node: br
    - node: text
      content: 言語機能は使えない！
  p25:
  - node: p
    children:
    - node: text
      content: ここから本題
  p26:
  - node: p
    children:
    - node: text
      content: 'この後のコードは '
    - node: br
    - node: text
      content: 'zonuexe/tetosqlを '
    - node: br
    - node: text
      content: ご参照ください
  p27:
  - node: p
    children:
    - node: text
      content: 'むかしのバージョンの '
    - node: br
    - node: text
      content: 'PHPは '
    - node: br
    - node: text
      content: どうすれば使えるか
  p28:
  - node: p
    children:
    - node: text
      content: 古いPHPを動かす方法
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ソースコードからコンパイルする
    - node: li
      children:
      - node: text
        content: Dockerの公式コンテナ
    - node: li
      children:
      - node: text
        content: GitHub Actions (shivammathur/setup-php)
  p29:
  - node: p
    children:
    - node: text
      content: 'GitHub使ってるなら '
    - node: br
    - node: text
      content: Actionsが簡単
  p30: []
  p31:
  - node: p
    children:
    - node: text
      content: これで動かす 環境はできた
  p32:
  - node: p
    children:
    - node: text
      content: '新しいバージョン '
    - node: br
    - node: text
      content: 使えないと辛くない？
  p33:
  - node: p
    children:
    - node: text
      content: 辛いところもあるし 辛くないこともある
  p34:
  - node: p
    children:
    - node: text
      content: Polyﬁllを使おう
  p35: []
  p36: []
  p37: []
  p38:
  - node: p
    children:
    - node: text
      content: '古いPHPでも '
    - node: br
    - node: text
      content: 新しい関数は使える！
  p39:
  - node: p
    children:
    - node: text
      content: 問題はPHPUnit
  p40: []
  p41:
  - node: p
    children:
    - node: bold
      content: 'PHP 5.3〜8.2 '
    - node: br
    - node: bold
      content: '全部が動く都合のいい '
    - node: br
    - node: bold
      content: PHPUnitなんてものはない
  p42:
  - node: p
    children:
    - node: text
      content: ならどうするか
  p43:
  - node: p
    children:
    - node: text
      content: 'PHPUnit4.8を '
    - node: br
    - node: text
      content: 'PHP8で動くように '
    - node: br
    - node: text
      content: 魔改造する
  - node: p
    children:
    - node: text
      content: 😈
  p44:
  - node: p
    children:
    - node: text
      content: 'PHPUnit4.8を '
    - node: br
    - node: text
      content: 'PHP8で動くように '
    - node: br
    - node: text
      content: 魔改造する
  - node: p
    children:
    - node: text
      content: 😈
  p45: []
  p46: []
  p47:
  - node: p
    children:
    - node: text
      content: メンテが… つらい…
  p48:
  - node: p
    children:
    - node: text
      content: 'もっとよくできた '
    - node: br
    - node: text
      content: ものがある
  p49: []
  p50: []
  p51:
  - node: p
    children:
    - node: text
      content: '不思議な力で '
    - node: br
    - node: text
      content: 複数バージョンの PHPUnitが動く
  p52: []
  p53:
  - node: p
    children:
    - node: text
      content: '不思議な力で '
    - node: br
    - node: text
      content: '互換性を '
    - node: br
    - node: text
      content: 合わせてくれる
  - node: p
    children:
    - node: text
      content: 😇
  p54: []
  p55: []
  p56:
  - node: p
    children:
    - node: text
      content: まとめ
  p57:
  - node: p
    children:
    - node: text
      content: 'TetoSQLは依存が '
    - node: br
    - node: text
      content: 少ないので複数 サポートが簡単
  p58:
  - node: p
    children:
    - node: text
      content: 'みんなは '
    - node: br
    - node: text
      content: '必要ないバージョンは '
    - node: br
    - node: text
      content: さくっと切ろうね！
