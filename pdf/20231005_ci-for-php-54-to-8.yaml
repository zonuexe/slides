  - kind: para
    text: PHPのオブジェクト指向機能
  - kind: list
    items:
    - 'PHP 7.4: 型付きプロパティ'
    - 'PHP 8.0: コンストラクタプロモーション (PHP 8.2)'
    - 'PHP 8.1: readonlyプロパティ'
    - 'PHP 8.2: trait定数宣言'
    - 'PHP 8.3: 型付き定数宣言'
