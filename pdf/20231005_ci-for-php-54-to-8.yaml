  p15:
  - kind: para
    text: Packagist Statsについて
  - kind: list
    items:
    - Packagist = Composerのデフォルトリポジトリ
    - composer install時に送られるPHPバージョンが集計される
    - インストール回数なので本番運用環境での利用回数ではないので注意
    - 開発者が多かったりデプロイ回数が多かったりキャッシュ構造に左右
    - とはいえ、ある種の勢いが表現されていることは確か
  p16:
  - kind: para
    text: 私が開発している
  - kind: para
    text: ライブラリの場合
  p17:
  - kind: para
    text: 5.x
  - kind: para
    text: 7.x
  - kind: para
    text: 8.x
  p18:
  - kind: para
    text: zonuexe/tetosqlについて
  - kind: list
    items:
    - これが何者かはPHPカンファレンスで話します！！！
    - 間接的にPDOに依存しているが、PHPのバージョン依存はあまりない
    - もともとは5.5以上の対応だったが途中で心変わりして5.4対応にした
    - 2022年4月に何かが起こった (お察しください)
    - 途中で7.2と8.2が増え、5.xは潰えた (たぶんそれは…)
  p19:
  - kind: heading
    level: 1
    text: 5.xが全滅したので
  - kind: heading
    level: 1
    text: サポート終了の判断が
  - kind: heading
    level: 1
    text: できる
  - kind: para
    text: 5.x
  - kind: para
    text: 7.x
  - kind: para
    text: 8.x
  p20:
  - kind: heading
    level: 1
    text: サポート対象の決め方
  - kind: para
    text: 💪
  - kind: list
    items:
    - PHP Groupが公式サポートしているバージョンを対象にする
    - 自分が(個人|会社)で使っているバージョンをサポートする
    - 現実的にサポート可能なバージョンは全てサポートする
  - kind: para
    text: 一般論としてはバージョンが上がれば
  - kind: para
    text: 新しい機能や新しい構文が使えて嬉しい！！！
  p21: []
