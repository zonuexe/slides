text:
  p1:
  - kind: heading
    level: 1
    text: Emacs as a VM
  - kind: heading
    level: 2
    text: A Virtual Machine called Emacs
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2024-07-13 TechFeed Expert Night
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - TechFeed公認PHPエキスパート
  p3:
  - kind: heading
    level: 1
    text: 私の立ち位置
  p4: []
  p5:
  - kind: heading
    level: 1
    text: Emacs最新情報！
  p6:
  - kind: heading
    level: 1
    text: といいたいのですが
  p7:
  - kind: para
    text: わかりやすいニュースとしての変化は多くない
  p8:
  - kind: para
    text: Emacs30の開発は着々と進んでいます
  p9:
  - kind: para
    text: AIなど使えるような拡張も登場している
  p10:
  - kind: heading
    level: 1
    text: さて
  p11:
  - kind: heading
    level: 1
    text: 前回のおさらい
  p12:
  - kind: heading
    level: 1
    text: Vimはいいぞ！
  p13: []
  p14:
  - kind: para
    text: Emacsの本質とは何か
  p15:
  - kind: para
    text: A modern Lisp machine
  p16: []
  p17:
  - kind: para
    text: そういう機械が40年以上前にあった
  p18:
  - kind: para
    text: 「Multi-Paradigm Language TAO」より引用https://www.nue.org/nue/tao/bitao/s001.html
  p19:
  - kind: para
    text: この写真は国産LISPマシンのELISなので本家Emacsの開発経緯とは直接関係ないのだが内蔵されたZENというEmacs風独自エディタの日本語入力メソッドKanzenが後のSKKに繋がりIME史に影響を及ぼしている
  p20:
  - kind: para
    text: みなさんご存じ(ない)通りLISPマシンのような高級言語専用マシンは廃れている
  p21:
  - kind: para
    text: だが、Lispは死滅していなかった！
  p22:
  - kind: heading
    level: 1
    text: 世紀末救世主伝説Emacs
  p23:
  - kind: para
    text: スクリプトで拡張できるテキストエディタの元祖
  p24:
  - kind: para
    text: 元祖EmacsはTECOというエディタの拡張マクロ集(EditorMACroS)
  p25:
  - kind: heading
    level: 1
    text: この人が作りました
  p26:
  - kind: heading
    level: 1
    text: なんだかんだありまして
  p27: []
  p28:
  - kind: para
    text: リチャードストールマン(RMS)とかいう若者がマサチューセッツ工科大学で自由を求めて戦ったりAI研究所でLispを書いてたりしてたらラボ内がLISPマシンを作ってる企業の派閥で分裂ちゃったのでどうしようもなくなってAIラボを去ってGNUっていう自由なOSを作ろうぜ！という物語があったりするのは後の話
  p29:
  - kind: para
    text: 自由なOSを作りたいよまずコンパイラとエディタを作ったよ
  p30:
  - kind: para
    text: そうしてGCCとEmacsができましたとさ
  p31:
  - kind: heading
    level: 1
    text: めでたしめでたし
  p32:
  - kind: heading
    level: 1
    text: 振り返りここまで
  p33:
  - kind: heading
    level: 1
    text: 改めて
  p34:
  - kind: para
    text: Emacsで何ができるかユーザーと非ユーザーで大きな認識の開きがある
  p35:
  - kind: para
    text: (ある種のジョークとして)しばしばEmacsはエディタではないと言及される
  p36: []
  p37: []
  p38:
  - kind: heading
    level: 1
    text: Emacsはなんでもできる
  p39:
  - kind: para
    text: メーラーでもありRSSリーダーでもありEPUBやPDFも読める
  p40:
  - kind: para
    text: EmacsはOS Emacsは環境
  p41:
  - kind: heading
    level: 1
    text: ジョークではなく
  p42:
  - kind: heading
    level: 1
    text: Emacsの大きな誤解
  p43:
  - kind: para
    text: 「Emacsってターミナルのエディタでしょ？」
  p44:
  - kind: heading
    level: 1
    text: EmacsはGUIでも動く
  p45:
  - kind: heading
    level: 1
    text: 起動時から目立つEmacsロゴ
  p46:
  - kind: heading
    level: 1
    text: フォントを扱える
  p47:
  - kind: heading
    level: 1
    text: PDFが開ける
  p48:
  - kind: heading
    level: 1
    text: EPUBも開ける
  p49:
  - kind: heading
    level: 1
    text: EPUBも開ける
  p50:
  - kind: heading
    level: 1
    text: ディレクトリを開いて画像見れる
  p51:
  - kind: heading
    level: 1
    text: ディレクトリを開いて画像見れる
  p52: []
  p53: []
  p54:
  - kind: para
    text: ウィンドウ内でブラウザも開ける！(が、macOSで動作しなかった…)
  p55: []
  p56:
  - kind: para
    text: Emacsは単なるエディタではなくアプリケーション実行環境
  p57:
  - kind: heading
    level: 1
    text: OSを問わず実行できる
  - kind: para
    text: (Windows, GNU/Linux, *BSD,macOS, Haiku, ...)
  p58:
  - kind: para
    text: …といいたいが、外部プロセスやファイルシステムに依存すると意図通り動かない
  p59:
  - kind: para
    text: WindowsではWSLで動かすこともできる(WSLgでGUI起動もできる)
  p60:
  - kind: para
    text: 問題意識を持って高速な非同期UIを実装している人も居る
  p61: []
  p62: []
  p63: []
  p64:
  - kind: heading
    level: 1
    text: Emacsは環境！
  p65:
  - kind: heading
    level: 1
    text: 仮想環境？
  p66:
  - kind: para
    text: 「Multi-Paradigm Language TAO」より引用https://www.nue.org/nue/tao/bitao/s001.html
  p67:
  - kind: para
    text: 現代に残る最後の(仮想)Lispマシン
  p68:
  - kind: heading
    level: 1
    text: 言語にはパワーがある
  p69:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用http://practical-scheme.net/trans/beating-the-averages-j.html
  p70:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用http://practical-scheme.net/trans/beating-the-averages-j.html
  p71:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用http://practical-scheme.net/trans/beating-the-averages-j.html
  p72:
  - kind: para
    text: ということをYコンビネータ創始者のポールグレアムが言ってる
  p73: []
  p74:
  - kind: para
    text: ハッカーになりたければEmacs
  p75: []
  p76:
  - kind: para
    text: 外見に変化はなくても中身は洗練されている
  p77:
  - kind: para
    text: コンピュータサイエンスの問題に立ち向かって最強の環境を作りたい人はEmacsを
  p78:
  - kind: heading
    level: 1
    text: コミュニティは
  - kind: heading
    level: 1
    text: Emacs JPのSlackに
  - kind: para
    text: (不定期にオンラインミートアップもやってるよ)
  p79: []
  p80: []
  p81: []
  p82: []
