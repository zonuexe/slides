text:
  p1:
  - kind: heading
    level: 1
    text: Emacs as a VM
  - kind: heading
    level: 2
    text: A Virtual Machine called Emacs
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2024-07-13 TechFeed Expert Night
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - TechFeed公認PHPエキスパート
  p3:
  - kind: heading
    level: 1
    text: 私の立ち位置
  p4: []
  p5:
  - kind: heading
    level: 1
    text: Emacs最新情報！
  p6:
  - kind: heading
    level: 1
    text: といいたいのですが
  p7:
  - kind: para
    text: わかりやすい
  - kind: para
    text: ニュースとしての
  - kind: para
    text: 変化は多くない
  p8:
  - kind: para
    text: Emacs30の開発は
  - kind: para
    text: 着々と進んでいます
  p9:
  - kind: para
    text: AIなど使えるような
  - kind: para
    text: 拡張も登場している
  p10:
  - kind: heading
    level: 1
    text: さて
  p11:
  - kind: heading
    level: 1
    text: 前回のおさらい
  p12:
  - kind: heading
    level: 1
    text: Vimはいいぞ！
  p13: []
  p14:
  - kind: para
    text: Emacsの
  - kind: para
    text: 本質とは何か
  p15:
  - kind: para
    text: A modern
  - kind: para
    text: Lisp machine
  p16: []
  p17:
  - kind: para
    text: そういう機械が
  - kind: para
    text: 40年以上前にあった
  p18:
  - kind: para
    text: 「Multi-Paradigm Language TAO」より引用
  - kind: para
    text: https://www.nue.org/nue/tao/bitao/s001.html
  p19:
  - kind: para
    text: この写真は国産LISPマシンのELIS
  - kind: para
    text: なので本家Emacsの開発経緯とは直
  - kind: para
    text: 接関係ないのだが内蔵されたZENと
  - kind: para
    text: いうEmacs風独自エディタの日本語
  - kind: para
    text: 入力メソッドKanzenが後のSKKに
  - kind: para
    text: 繋がりIME史に影響を及ぼしている
  p20:
  - kind: para
    text: みなさんご存じ(ない)通り
  - kind: para
    text: LISPマシンのような
  - kind: para
    text: 高級言語専用マシンは
  - kind: para
    text: 廃れている
  p21:
  - kind: para
    text: だが、Lispは
  - kind: para
    text: 死滅していなかった！
  p22:
  - kind: heading
    level: 1
    text: 世紀末救世主伝説Emacs
  p23:
  - kind: para
    text: スクリプトで拡張できる
  - kind: para
    text: テキストエディタの元祖
  p24:
  - kind: para
    text: 元祖Emacsは
  - kind: para
    text: TECOというエディタの
  - kind: para
    text: 拡張マクロ集
  - kind: para
    text: (EditorMACroS)
  p25:
  - kind: heading
    level: 1
    text: この人が作りました
  p26:
  - kind: heading
    level: 1
    text: なんだかんだありまして
  p27: []
  p28:
  - kind: para
    text: リチャードストールマン(RMS)とかいう若者
  - kind: para
    text: がマサチューセッツ工科大学で自由を求めて
  - kind: para
    text: 戦ったりAI研究所でLispを書いてたりしてた
  - kind: para
    text: らラボ内がLISPマシンを作ってる企業の派閥
  - kind: para
    text: で分裂ちゃったのでどうしようもなくなって
  - kind: para
    text: AIラボを去ってGNUっていう自由なOSを作
  - kind: para
    text: ろうぜ！という物語があったりするのは後の話
  p29:
  - kind: para
    text: 自由なOSを作りたいよ
  - kind: para
    text: まずコンパイラと
  - kind: para
    text: エディタを作ったよ
  p30:
  - kind: para
    text: そうしてGCCと
  - kind: para
    text: Emacsができましたとさ
  p31:
  - kind: heading
    level: 1
    text: めでたしめでたし
  p32:
  - kind: heading
    level: 1
    text: 振り返りここまで
  p33:
  - kind: heading
    level: 1
    text: 改めて
  p34:
  - kind: para
    text: Emacsで何ができるか
  - kind: para
    text: ユーザーと非ユーザーで
  - kind: para
    text: 大きな認識の開きがある
  p35:
  - kind: para
    text: (ある種のジョークとして)
  - kind: para
    text: しばしば
  - kind: para
    text: Emacsはエディタではない
  - kind: para
    text: と言及される
  p36: []
  p37: []
  p38:
  - kind: heading
    level: 1
    text: Emacsはなんでもできる
  p39:
  - kind: para
    text: メーラーでもあり
  - kind: para
    text: RSSリーダーでもあり
  - kind: para
    text: EPUBやPDFも読める
  p40:
  - kind: para
    text: EmacsはOS
  - kind: para
    text: Emacsは環境
  p41:
  - kind: heading
    level: 1
    text: ジョークではなく
  p42:
  - kind: heading
    level: 1
    text: Emacsの大きな誤解
  p43:
  - kind: para
    text: 「Emacsってターミナルの
  - kind: para
    text: エディタでしょ？」
  p44:
  - kind: heading
    level: 1
    text: EmacsはGUIでも動く
  p45:
  - kind: heading
    level: 1
    text: 起動時から目立つEmacsロゴ
  p46:
  - kind: heading
    level: 1
    text: フォントを扱える
  p47:
  - kind: heading
    level: 1
    text: PDFが開ける
  p48:
  - kind: heading
    level: 1
    text: EPUBも開ける
  p49:
  - kind: heading
    level: 1
    text: EPUBも開ける
  p50:
  - kind: heading
    level: 1
    text: ディレクトリを開いて画像見れる
  p51:
  - kind: heading
    level: 1
    text: ディレクトリを開いて画像見れる
  p52: []
  p53: []
  p54:
  - kind: para
    text: ウィンドウ内で
  - kind: para
    text: ブラウザも開ける！
  - kind: para
    text: (が、macOSで動作しなかった…)
  p55: []
  p56:
  - kind: para
    text: Emacsは単なる
  - kind: para
    text: エディタではなく
  - kind: para
    text: アプリケーション実行環境
  p57:
  - kind: heading
    level: 1
    text: OSを問わず実行できる
  - kind: para
    text: (Windows, GNU/Linux, *BSD,
  - kind: para
    text: macOS, Haiku, ...)
  p58:
  - kind: para
    text: …といいたいが、
  - kind: para
    text: 外部プロセスやファイル
  - kind: para
    text: システムに依存すると
  - kind: para
    text: 意図通り動かない
  p59:
  - kind: para
    text: WindowsではWSLで
  - kind: para
    text: 動かすこともできる
  - kind: para
    text: (WSLgでGUI起動もできる)
  p60:
  - kind: para
    text: 問題意識を持って
  - kind: para
    text: 高速な非同期UIを
  - kind: para
    text: 実装している人も居る
  p61: []
  p62: []
  p63: []
  p64:
  - kind: heading
    level: 1
    text: Emacsは環境！
  p65:
  - kind: heading
    level: 1
    text: 仮想環境？
  p66:
  - kind: para
    text: 「Multi-Paradigm Language TAO」より引用
  - kind: para
    text: https://www.nue.org/nue/tao/bitao/s001.html
  p67:
  - kind: para
    text: 現代に残る最後の
  - kind: para
    text: (仮想)Lispマシン
  p68:
  - kind: heading
    level: 1
    text: 言語にはパワーがある
  p69:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p70:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p71:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p72:
  - kind: para
    text: ということを
  - kind: para
    text: Yコンビネータ創始者の
  - kind: para
    text: ポールグレアムが
  - kind: para
    text: 言ってる
  p73: []
  p74:
  - kind: para
    text: ハッカーになりたければ
  - kind: para
    text: Emacs
  p75: []
  p76:
  - kind: para
    text: 外見に変化はなくても
  - kind: para
    text: 中身は洗練されている
  p77:
  - kind: para
    text: コンピュータサイエンス
  - kind: para
    text: の問題に立ち向かって
  - kind: para
    text: 最強の環境を作りたい人
  - kind: para
    text: はEmacsを
  p78:
  - kind: heading
    level: 1
    text: コミュニティは
  - kind: heading
    level: 1
    text: Emacs JPのSlackに
  - kind: para
    text: (不定期にオンラインミートアップも
  - kind: para
    text: やってるよ)
  p79: []
  p80: []
  p81: []
  p82: []
