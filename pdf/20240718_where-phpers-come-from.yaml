text:
  p1:
  - node: p
    children:
    - node: text
      content: 'PHPerはどこから来たのか '
    - node: br
    - node: text
      content: 'PHPerは何者か '
    - node: br
    - node: text
      content: PHPerはどこへ行くのか
  - node: p
    children:
    - node: text
      content: Where do PHPers come from?  Who are PHPers?  Where are PHPers going?
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2024-07-18 #orekobe '
  - node: p
    children:
    - node: bold
      content: 'PHP"オレ"カンファレンス神戸 #1'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2007-2011 北海道で情報通信系の勉強をしていた
    - node: li
      children:
      - node: text
        content: 2010年から札幌でRubyコミュニティに出入りしてた
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: この頃からプログラミング言語論とか言語処理系に興味を持つ
    - node: li
      children:
      - node: text
        content: 2011年に札幌でPython勉強会などを運営していた
    - node: li
      children:
      - node: text
        content: 2012年から東京に引っ越した
    - node: li
      children:
      - node: text
        content: 2016年くらいからPHP系のカンファレンス発表など
  p4:
  - node: p
    children:
    - node: text
      content: さて
  p5:
  - node: p
    children:
    - node: text
      content: '2024年は '
    - node: br
    - node: text
      content: いろいろありました
  p6: []
  p7:
  - node: p
    children:
    - node: text
      content: 'どうして '
    - node: br
    - node: text
      content: 'こんなことに '
    - node: br
    - node: text
      content: なったのか
  p8:
  - node: p
    children:
    - node: text
      content: '話は '
    - node: br
    - node: text
      content: 1993年に さかのぼる
  p9:
  - node: p
    children:
    - node: text
      content: その前に
  p10:
  - node: p
    children:
    - node: text
      content: 本日のあらすじ
  - node: p
    children:
    - node: text
      content: '1. PHPはどこからきたのか 2.  PHPerは何者か '
    - node: br
    - node: text
      content: (日本の)
    - node: br
    - node: text
      content: 3. PHPerはどこへ行くのか
  p11:
  - node: p
    children:
    - node: text
      content: はじまります
  p12:
  - node: p
    children:
    - node: text
      content: 'PHPは '
    - node: br
    - node: text
      content: どこから来たのか
  p13:
  - node: p
    children:
    - node: text
      content: 'PHPを '
    - node: br
    - node: text
      content: '作ったのは '
    - node: br
    - node: text
      content: 誰でしょうか
  p14:
  - node: p
    children:
    - node: bold
      content: '出典: フリー百科事典『ウィキペディア（Wikipedia）』より引用 '
    - node: br
    - node: bold
      content: 'https://ja.wikipedia.org/wiki/ラスマス・ラードフ '
  - node: p
    children:
    - node: text
      content: 2021-07-01T14:10:55版
  p15:
  - node: p
    children:
    - node: bold
      content: '出典: 伝説のPHP作者「Rasmus Lerdorf」名言集を聞くと嫌PHP厨がファビョる '
  - node: p
    children:
    - node: bold
      content: https://web.archive.org/web/20100501140915/http://anond.hatelabo.jp/20100427231539
  p16:
  - node: p
    children:
    - node: bold
      content: '出典:伝説の喫煙者「黒木　灰次郎」名言集を聞くと嫌煙がファビョる '
  - node: p
    children:
    - node: bold
      content: http://blog.livedoor.jp/hokanisurukotoha/archives/1121714.html
  p17:
  - node: p
    children:
    - node: bold
      content: '出典: ウィキクォート https://ja.wikiquote.org/wiki/ラスマス・ラードフ'
  p18:
  - node: p
    children:
    - node: text
      content: 'PHPは多くの人から疎まれ、 '
    - node: br
    - node: text
      content: まじめなプログラミング言語として
    - node: br
    - node: text
      content: 考察対象とされていない節がある
  p19:
  - node: p
    children:
    - node: text
      content: '正しい '
  - node: p
    children:
    - node: text
      content: だが､そうじゃない
  p20:
  - node: p
    children:
    - node: bold
      content: '出典: IT Conversations | Rasmus Lerdorf | PHP on Hormones '
  - node: p
    children:
    - node: bold
      content: https://web.archive.org/web/20130729204354/http://itc.conversationsnetwork.org/shows/detail3298.html
  p21:
  - node: p
    children:
    - node: text
      content: 'Rasmus LerdorfはMySQLとPostgreSQLの両方に 導入されているSQL標準(ANSI92 SQL)を無視した '
    - node: br
    - node: text
      content: mSQLのLIMIT句のオリジナル作者です
  - node: p
    children:
    - node: bold
      content: '出典: IT Conversations | Rasmus Lerdorf | PHP on Hormones '
  - node: p
    children:
    - node: bold
      content: https://web.archive.org/web/20130729204354/http://itc.conversationsnetwork.org/shows/detail3298.html
  p22: []
  p23: []
  p24: []
  p25: []
  p26: []
  p27:
  - node: p
    children:
    - node: text
      content: '1993年時点で存在したデータベースソフトウェア。 '
    - node: br
    - node: text
      content: 'フリーソフトウェアではないがソースコードが '
    - node: br
    - node: text
      content: 公開されていて、MySQLなどに影響を及ぼした。
  p28: []
  p29: []
  p30: []
  p31: []
  p32: []
  p33: []
  p34: []
  p35: []
  p36: []
  p37: []
  p38: []
  p39:
  - node: p
    children:
    - node: text
      content: 'Q. つまりPHPって '
    - node: br
    - node: text
      content: 何だったの？
  p40:
  - node: p
    children:
    - node: text
      content: 'A. '
  - node: p
    children:
    - node: text
      content: 異常に行動力があるRasmus
    - node: br
    - node: text
      content: さんが自分のためにPHPを作っ て、何回か書き直した後に利己的 な動機でソースコード公開したら 世界的に開発が盛り上がっちゃった
  p41: []
  p42:
  - node: p
    children:
    - node: text
      content: 'イスラエルの大学生 '
    - node: br
    - node: text
      content: ZeevとAndiが仲間に なって大革新を遂げる
  p43:
  - node: p
    children:
    - node: bold
      content: '出典: フリー百科事典『ウィキペディア（Wikipedia）』より引用 '
    - node: br
    - node: bold
      content: 'https://ja.wikipedia.org/wiki/ラスマス・ラードフ '
  - node: p
    children:
    - node: text
      content: 2021-07-01T14:10:55版
  p44:
  - node: p
    children:
    - node: text
      content: Rasmusは一般的な意 味でのBDFLではない
  p45: []
  p46: []
  p47: []
  p48:
  - node: p
    children:
    - node: text
      content: (日本の)
    - node: br
    - node: text
      content: PHPerは何者か
  p49:
  - node: p
    children:
    - node: text
      content: 'PHPのユーザーは '
    - node: br
    - node: text
      content: '他の言語よりも '
    - node: br
    - node: text
      content: 多様だと思う
  p50:
  - node: p
    children:
    - node: text
      content: A
  - node: p
    children:
    - node: text
      content: '<!DOCTYPE html> '
    - node: br
    - node: text
      content: '<html><head><title>Hello, PHP!</title></head> '
    - node: br
    - node: text
      content: '<p> '
    - node: br
    - node: text
      content: '<?php if (date(''H'') < 19): ?> '
    - node: br
    - node: text
      content: '     こんにちは '
  - node: p
    children:
    - node: text
      content: '<?php else: ?>      こんばんは '
  - node: p
    children:
    - node: text
      content: '<?php endif; ?> '
    - node: br
    - node: text
      content: '</p> '
    - node: br
    - node: text
      content: <p>今は<?= htmlspecialchars(date('H')) ?>時です</p>
  p51:
  - node: p
    children:
    - node: text
      content: B
  - node: p
    children:
    - node: text
      content: '<?php require ''bootstrap.php''; '
  - node: p
    children:
    - node: text
      content: '$db = mysqli_connect(); '
    - node: br
    - node: text
      content: '$stmt = mysqli_prepare($db, ''SELECT * FROM books''); '
    - node: br
    - node: text
      content: 'mysqli_stmt_execute($stmt); print ''<h1>本の一覧</h1>''; '
  - node: p
    children:
    - node: text
      content: 'print ''<ul>''; '
    - node: br
    - node: text
      content: 'foreach ($stmt as $s) { '
    - node: br
    - node: text
      content: '    print ''<li>''; print $s->name; print ''</li>''; '
    - node: br
    - node: text
      content: '} '
    - node: br
    - node: text
      content: print '</ul>';
  p52:
  - node: p
    children:
    - node: text
      content: C
  - node: p
    children:
    - node: text
      content: '<?php declare(strict_types=1); '
  - node: p
    children:
    - node: text
      content: 'namespace Foo\Http\Controller; '
  - node: p
    children:
    - node: text
      content: 'class BooksController extends BaseController { '
    - node: br
    - node: text
      content: '    public function index() { '
    - node: br
    - node: text
      content: '        $books = Books::getAll(); '
  - node: p
    children:
    - node: text
      content: '        $this->render(compact("books")); '
    - node: br
    - node: text
      content: '    } '
    - node: br
    - node: text
      content: '}'
  p53:
  - node: p
    children:
    - node: text
      content: '前提が｢プログラミング｣ '
    - node: br
    - node: text
      content: '｢システム開発｣ '
    - node: br
    - node: text
      content: ではないユーザーも多い
  p54: []
  p55: []
  p56: []
  p57: []
  p58:
  - node: p
    children:
    - node: text
      content: 'Q. 日本でPHP系の '
    - node: br
    - node: text
      content: 'カンファレンスは何回 '
    - node: br
    - node: text
      content: 開催されたのでしょうか
  p59:
  - node: p
    children:
    - node: text
      content: 'A. 数えかたにもよるが、 '
    - node: br
    - node: text
      content: '60〜100回くらい '
    - node: br
    - node: text
      content: (WordCampをカウントするかで変化)
  p60: []
  p61: []
  p62: []
  p63:
  - node: p
    children:
    - node: text
      content: Q. どうしてこうなったのか
  p64:
  - node: p
    children:
    - node: text
      content: 'A. コロナ禍明けで '
    - node: br
    - node: text
      content: 直接会って会話する楽しさ
    - node: br
    - node: text
      content: を思い出してしまった
  p65:
  - node: p
    children:
    - node: text
      content: 'A. 自分も発表したり '
    - node: br
    - node: text
      content: 'イベントを開催したいと '
    - node: br
    - node: text
      content: 思う人口の裾野が拡がった
  p66: []
  p67:
  - node: p
    children:
    - node: text
      content: 'YAPC '
    - node: br
    - node: text
      content: 'RubyKaigi PyCon JP '
    - node: br
    - node: text
      content: etc...
  p68:
  - node: p
    children:
    - node: text
      content: '言語固有のコミュニティの '
    - node: br
    - node: text
      content: 事情がいろいろある
  p69:
  - node: p
    children:
    - node: text
      content: 'PHPerは '
    - node: br
    - node: text
      content: どこへ行くのか
  p70:
  - node: p
    children:
    - node: text
      content: 'よくも悪くも '
    - node: br
    - node: text
      content: 'コミュニティの盛り上がりで '
    - node: br
    - node: text
      content: 'カンファレンス発表の '
    - node: br
    - node: text
      content: ハードルが上がってしまった
  p71:
  - node: p
    children:
    - node: text
      content: 'コミュニケーションの場は '
    - node: br
    - node: text
      content: カンファレンスだけじゃない
  p72: []
  p73: []
  p74:
  - node: p
    children:
    - node: text
      content: '会って触れ合う場は '
    - node: br
    - node: text
      content: 多い方がいい
  p75: []
  p76: []
  p77:
  - node: p
    children:
    - node: text
      content: '情報を他者に教えられる レベルに整理することで '
    - node: br
    - node: text
      content: 自分の理解を深めたい
  p78:
  - node: p
    children:
    - node: text
      content: '個人的な思想： '
    - node: br
    - node: text
      content: '直接的な勉強より '
    - node: br
    - node: text
      content: 多角的な視点を得たい
  p79:
  - node: p
    children:
    - node: text
      content: 'PHP && 技術 '
    - node: br
    - node: text
      content: 'ではなく '
    - node: br
    - node: text
      content: PHP愛 || 技術
  p80:
  - node: p
    children:
    - node: text
      content: '発表内容を｢勉強｣として '
    - node: br
    - node: text
      content: 完全理解することに こだわる必要はない
  p81:
  - node: p
    children:
    - node: text
      content: 記憶のフックを作って いつか役立ててほしい
  p82:
  - node: p
    children:
    - node: text
      content: 'PHPにお世話になっている '
    - node: br
    - node: text
      content: 'からといって全員が '
    - node: br
    - node: text
      content: PHPエコシステムに貢献し ないといけないことはない
  p83:
  - node: p
    children:
    - node: text
      content: '技術コミュニティを '
    - node: br
    - node: text
      content: 楽しみましょう
