  p1:
  - kind: heading
    level: 1
    text: PHPerはどこから来たのか
  - kind: heading
    level: 1
    text: PHPerは何者か
  - kind: heading
    level: 1
    text: PHPerはどこへ行くのか
  - kind: heading
    level: 2
    text: Where do PHPers come from? Who are PHPers? Where are PHPers going?
  - kind: heading
    level: 2
    text: pixiv Inc.
  - kind: heading
    level: 2
    text: USAMI Kenta
  - kind: para
    text: '2024-07-18 #orekobe PHP"オレ"カンファレンス神戸 #1'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - 2007-2011 北海道で情報通信系の勉強をしていた
    - 2010年から札幌でRubyコミュニティに出入りしてた
    - この頃からプログラミング言語論とか言語処理系に興味を持つ
    - 2011年に札幌でPython勉強会などを運営していた
    - 2012年から東京に引っ越した
    - 2016年くらいからPHP系のカンファレンス発表など
  p4:
  - kind: heading
    level: 1
    text: さて
  p5:
  - kind: para
    text: 2024年はいろいろありました
  p6: []
  p7:
  - kind: para
    text: どうしてこんなことになったのか
  p8:
  - kind: para
    text: 話は1993年にさかのぼる
  p9:
  - kind: heading
    level: 1
    text: その前に
  p10:
  - kind: para
    text: 本日のあらすじ
  - kind: para
    text: 1. PHPはどこからきたのか
  - kind: para
    text: 2. (日本の)PHPerは何者か
  - kind: para
    text: 3. PHPerはどこへ行くのか
  p11:
  - kind: heading
    level: 1
    text: はじまります
  p12:
  - kind: para
    text: PHPはどこから来たのか
  p13:
  - kind: para
    text: PHPを作ったのは誰でしょうか
  p14:
  - kind: para
    text: '出典: フリー百科事典『ウィキペディア（Wikipedia）』より引用https://ja.wikipedia.org/wiki/ラスマス・ラードフ
      2021-07-01T14:10:55版'
  p15:
  - kind: para
    text: '出典: 伝説のPHP作者「Rasmus Lerdorf」名言集を聞くと嫌PHP厨がファビョる'
  - kind: para
    text: https://web.archive.org/web/20100501140915/http://anond.hatelabo.jp/20100427231539
  p16:
  - kind: para
    text: 出典:伝説の喫煙者「黒木 灰次郎」名言集を聞くと嫌煙がファビョるhttp://blog.livedoor.jp/hokanisurukotoha/archives/1121714.html
  p17:
  - kind: para
    text: '出典: ウィキクォート https://ja.wikiquote.org/wiki/ラスマス・ラードフ'
  p18:
  - kind: para
    text: PHPは多くの人から疎まれ、まじめなプログラミング言語として考察対象とされていない節がある
  p19:
  - kind: para
    text: 正しい
  - kind: para
    text: だが、そうじゃない
  p20:
  - kind: para
    text: '出典: IT Conversations | Rasmus Lerdorf | PHP on Hormones'
  - kind: para
    text: https://web.archive.org/web/20130729204354/http://itc.conversationsnetwork.org/shows/detail3298.html
  p21:
  - kind: heading
    level: 1
    text: Rasmus LerdorfはMySQLとPostgreSQLの両方に
  - kind: heading
    level: 1
    text: 導入されているSQL標準(ANSI92 SQL)を無視した
  - kind: heading
    level: 1
    text: mSQLのLIMIT句のオリジナル作者です
  - kind: para
    text: '出典: IT Conversations | Rasmus Lerdorf | PHP on Hormones'
  - kind: para
    text: https://web.archive.org/web/20130729204354/http://itc.conversationsnetwork.org/shows/detail3298.html
  p22: []
  p23: []
  p24: []
  p25: []
  p26: []
  p27:
  - kind: para
    text: 1993年時点で存在したデータベースソフトウェア。フリーソフトウェアではないがソースコードが公開されていて、MySQLなどに影響を及ぼした。
  p28: []
  p29: []
  p30: []
  p31: []
  p32: []
  p33: []
  p34: []
  p35: []
  p36: []
  p37: []
  p38: []
  p39:
  - kind: para
    text: Q. つまりPHPって何だったの？
  p40:
  - kind: para
    text: A. 異常に行動力があるRasmusさんが自分のためにPHPを作って、何回か書き直した後に利己的な動機でソースコード公開したら世界的に開発が盛り上がっちゃった
  p41: []
  p42:
  - kind: para
    text: イスラエルの大学生ZeevとAndiが仲間になって大革新を遂げる
  p43:
  - kind: para
    text: '出典: フリー百科事典『ウィキペディア（Wikipedia）』より引用https://ja.wikipedia.org/wiki/ラスマス・ラードフ
      2021-07-01T14:10:55版'
  p44:
  - kind: para
    text: Rasmusは一般的な意味でのBDFLではない
  p45: []
  p46: []
  p47: []
  p48:
  - kind: heading
    level: 2
    text: (日本の)
  - kind: heading
    level: 1
    text: PHPerは何者か
  p49:
  - kind: para
    text: PHPのユーザーは他の言語よりも多様だと思う
  p50:
  - kind: heading
    level: 1
    text: A
  - kind: para
    text: '<!DOCTYPE html><html><head><title>Hello, PHP!</title></head><p><?php if
      (date(''H'') < 19): ?>こんにちは<?php else: ?>こんばんは<?php endif; ?></p><p>今は<?= htmlspecialchars(date(''H''))
      ?>時です</p>'
  p51:
  - kind: heading
    level: 1
    text: B
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s) {print '<li>'; print $s->name; print '</li>';}print
      '</ul>';
  p52:
  - kind: heading
    level: 1
    text: C
  - kind: para
    text: <?php declare(strict_types=1);namespace Foo\Http\Controller;
  - kind: para
    text: class BooksController extends BaseController {public function index() {$books
      = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));}}
  p53:
  - kind: para
    text: 前提が「プログラミング」「システム開発」ではないユーザーも多い
  p54: []
  p55: []
  p56: []
  p57: []
  p58:
  - kind: para
    text: Q. 日本でPHP系のカンファレンスは何回開催されたのでしょうか
  p59:
  - kind: para
    text: A. 数えかたにもよるが、60～100回くらい(WordCampをカウントするかで変化)
  p60: []
  p61: []
  p62: []
  p63:
  - kind: heading
    level: 1
    text: Q. どうしてこうなったのか
  p64:
  - kind: para
    text: A. コロナ禍明けで直接会って会話する楽しさを思い出してしまった
  p65:
  - kind: para
    text: A. 自分も発表したりイベントを開催したいと思う人口の裾野が拡がった
  p66: []
  p67:
  - kind: para
    text: YAPC RubyKaigi PyCon JP etc...
  p68:
  - kind: para
    text: 言語固有のコミュニティの事情がいろいろある
  p69:
  - kind: para
    text: PHPerはどこへ行くのか
  p70:
  - kind: para
    text: よくも悪くもコミュニティの盛り上がりでカンファレンス発表のハードルが上がってしまった
  p71:
  - kind: para
    text: コミュニケーションの場はカンファレンスだけじゃない
  p72: []
  p73: []
  p74:
  - kind: para
    text: 会って触れ合う場は多い方がいい
  p75: []
  p76: []
  p77:
  - kind: para
    text: 情報を他者に教えられるレベルに整理することで自分の理解を深めたい
  p78:
  - kind: para
    text: 個人的な思想：直接的な勉強より多角的な視点を得たい
  p79:
  - kind: para
    text: PHP && 技術ではなくPHP愛 || 技術
  p80:
  - kind: para
    text: 発表内容を「勉強」として完全理解することにこだわる必要はない
  p81:
  - kind: para
    text: 記憶のフックを作っていつか役立ててほしい
  p82:
  - kind: para
    text: PHPにお世話になっているからといって全員がPHPエコシステムに貢献しないといけないことはない
  p83:
  - kind: para
    text: 技術コミュニティを楽しみましょう
