text:
  p1:
  - kind: heading
    level: 1
    text: PHPerはどこから来たのか
  - kind: heading
    level: 1
    text: PHPerは何者か
  - kind: heading
    level: 1
    text: PHPerはどこへ行くのか
  - kind: heading
    level: 2
    text: Where do PHPers come from? Who are PHPers? Where are PHPers going?
  - kind: heading
    level: 2
    text: pixiv Inc.
  - kind: heading
    level: 2
    text: USAMI Kenta
  - kind: para
    text: '2024-07-18 #orekobe'
  - kind: para
    text: 'PHP"オレ"カンファレンス神戸 #1'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - 2007-2011 北海道で情報通信系の勉強をしていた
    - 2010年から札幌でRubyコミュニティに出入りしてた
    - この頃からプログラミング言語論とか言語処理系に興味を持つ
    - 2011年に札幌でPython勉強会などを運営していた
    - 2012年から東京に引っ越した
    - 2016年くらいからPHP系のカンファレンス発表など
  p4:
  - kind: heading
    level: 1
    text: さて
  p5:
  - kind: para
    text: 2024年は
  - kind: para
    text: いろいろありました
  p6: []
  p7:
  - kind: para
    text: どうして
  - kind: para
    text: こんなことに
  - kind: para
    text: なったのか
  p8:
  - kind: para
    text: 話は
  - kind: para
    text: 1993年に
  - kind: para
    text: さかのぼる
  p9:
  - kind: heading
    level: 1
    text: その前に
  p10:
  - kind: para
    text: 本日のあらすじ
  - kind: para
    text: 1. PHPはどこからきたのか
  - kind: para
    text: 2. (日本の)PHPerは何者か
  - kind: para
    text: 3. PHPerはどこへ行くのか
  p11:
  - kind: heading
    level: 1
    text: はじまります
  p12:
  - kind: para
    text: PHPは
  - kind: para
    text: どこから来たのか
  p13:
  - kind: para
    text: PHPを
  - kind: para
    text: 作ったのは
  - kind: para
    text: 誰でしょうか
  p14:
  - kind: para
    text: '出典: フリー百科事典『ウィキペディア（Wikipedia）』より引用'
  - kind: para
    text: https://ja.wikipedia.org/wiki/ラスマス・ラードフ 2021-07-01T14:10:55版
  p15:
  - kind: para
    text: '出典: 伝説のPHP作者「Rasmus Lerdorf」名言集を聞くと嫌PHP厨がファビョる'
  - kind: para
    text: https://web.archive.org/web/20100501140915/http://anond.hatelabo.jp/20100427231539
  p16:
  - kind: para
    text: 出典:伝説の喫煙者「黒木 灰次郎」名言集を聞くと嫌煙がファビョる
  - kind: para
    text: http://blog.livedoor.jp/hokanisurukotoha/archives/1121714.html
  p17:
  - kind: para
    text: '出典: ウィキクォート https://ja.wikiquote.org/wiki/ラスマス・ラードフ'
  p18:
  - kind: para
    text: PHPは多くの人から疎まれ、
  - kind: para
    text: まじめなプログラミング言語として
  - kind: para
    text: 考察対象とされていない節がある
  p19:
  - kind: para
    text: 正しい
  - kind: para
    text: だが、そうじゃない
  p20:
  - kind: para
    text: '出典: IT Conversations | Rasmus Lerdorf | PHP on Hormones'
  - kind: para
    text: https://web.archive.org/web/20130729204354/http://itc.conversationsnetwork.org/shows/detail3298.html
  p21:
  - kind: heading
    level: 1
    text: Rasmus LerdorfはMySQLとPostgreSQLの両方に
  - kind: heading
    level: 1
    text: 導入されているSQL標準(ANSI92 SQL)を無視した
  - kind: heading
    level: 1
    text: mSQLのLIMIT句のオリジナル作者です
  - kind: para
    text: '出典: IT Conversations | Rasmus Lerdorf | PHP on Hormones'
  - kind: para
    text: https://web.archive.org/web/20130729204354/http://itc.conversationsnetwork.org/shows/detail3298.html
  p22: []
  p23: []
  p24: []
  p25: []
  p26: []
  p27:
  - kind: para
    text: 1993年時点で存在したデータベースソフトウェア。
  - kind: para
    text: フリーソフトウェアではないがソースコードが
  - kind: para
    text: 公開されていて、MySQLなどに影響を及ぼした。
  p28: []
  p29: []
  p30: []
  p31: []
  p32: []
  p33: []
  p34: []
  p35: []
  p36: []
  p37: []
  p38: []
  p39:
  - kind: para
    text: Q. つまりPHPって
  - kind: para
    text: 何だったの？
  p40:
  - kind: para
    text: A. 異常に行動力があるRasmus
  - kind: para
    text: さんが自分のためにPHPを作っ
  - kind: para
    text: て、何回か書き直した後に利己的
  - kind: para
    text: な動機でソースコード公開したら
  - kind: para
    text: 世界的に開発が盛り上がっちゃった
  p41: []
  p42:
  - kind: para
    text: イスラエルの大学生
  - kind: para
    text: ZeevとAndiが仲間に
  - kind: para
    text: なって大革新を遂げる
  p43:
  - kind: para
    text: '出典: フリー百科事典『ウィキペディア（Wikipedia）』より引用'
  - kind: para
    text: https://ja.wikipedia.org/wiki/ラスマス・ラードフ 2021-07-01T14:10:55版
  p44:
  - kind: para
    text: Rasmusは一般的な意
  - kind: para
    text: 味でのBDFLではない
  p45: []
  p46: []
  p47: []
  p48:
  - kind: heading
    level: 2
    text: (日本の)
  - kind: heading
    level: 1
    text: PHPerは何者か
  p49:
  - kind: para
    text: PHPのユーザーは
  - kind: para
    text: 他の言語よりも
  - kind: para
    text: 多様だと思う
  p50:
  - kind: heading
    level: 1
    text: A
  - kind: para
    text: <!DOCTYPE html>
  - kind: para
    text: <html><head><title>Hello, PHP!</title></head>
  - kind: para
    text: <p>
  - kind: para
    text: '<?php if (date(''H'') < 19): ?>'
  - kind: para
    text: こんにちは
  - kind: para
    text: '<?php else: ?>'
  - kind: para
    text: こんばんは
  - kind: para
    text: <?php endif; ?>
  - kind: para
    text: </p>
  - kind: para
    text: <p>今は<?= htmlspecialchars(date('H')) ?>時です</p>
  p51:
  - kind: heading
    level: 1
    text: B
  - kind: para
    text: <?php require 'bootstrap.php';
  - kind: para
    text: $db = mysqli_connect();
  - kind: para
    text: $stmt = mysqli_prepare($db, 'SELECT * FROM books');
  - kind: para
    text: mysqli_stmt_execute($stmt);
  - kind: para
    text: print '<h1>本の一覧</h1>';
  - kind: para
    text: print '<ul>';
  - kind: para
    text: foreach ($stmt as $s) {
  - kind: para
    text: print '<li>'; print $s->name; print '</li>';
  - kind: para
    text: '}'
  - kind: para
    text: print '</ul>';
  p52:
  - kind: heading
    level: 1
    text: C
  - kind: para
    text: <?php declare(strict_types=1);
  - kind: para
    text: namespace Foo\Http\Controller;
  - kind: para
    text: class BooksController extends BaseController {
  - kind: para
    text: public function index() {
  - kind: para
    text: $books = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p53:
  - kind: para
    text: 前提が「プログラミング」
  - kind: para
    text: 「システム開発」
  - kind: para
    text: ではないユーザーも多い
  p54: []
  p55: []
  p56: []
  p57: []
  p58:
  - kind: para
    text: Q. 日本でPHP系の
  - kind: para
    text: カンファレンスは何回
  - kind: para
    text: 開催されたのでしょうか
  p59:
  - kind: para
    text: A. 数えかたにもよるが、
  - kind: para
    text: 60～100回くらい
  - kind: para
    text: (WordCampをカウントするかで変化)
  p60: []
  p61: []
  p62: []
  p63:
  - kind: heading
    level: 1
    text: Q. どうしてこうなったのか
  p64:
  - kind: para
    text: A. コロナ禍明けで
  - kind: para
    text: 直接会って会話する楽しさ
  - kind: para
    text: を思い出してしまった
  p65:
  - kind: para
    text: A. 自分も発表したり
  - kind: para
    text: イベントを開催したいと
  - kind: para
    text: 思う人口の裾野が拡がった
  p66: []
  p67:
  - kind: para
    text: YAPC
  - kind: para
    text: RubyKaigi
  - kind: para
    text: PyCon JP
  - kind: para
    text: etc...
  p68:
  - kind: para
    text: 言語固有のコミュニティの
  - kind: para
    text: 事情がいろいろある
  p69:
  - kind: para
    text: PHPerは
  - kind: para
    text: どこへ行くのか
  p70:
  - kind: para
    text: よくも悪くも
  - kind: para
    text: コミュニティの盛り上がりで
  - kind: para
    text: カンファレンス発表の
  - kind: para
    text: ハードルが上がってしまった
  p71:
  - kind: para
    text: コミュニケーションの場は
  - kind: para
    text: カンファレンスだけじゃない
  p72: []
  p73: []
  p74:
  - kind: para
    text: 会って触れ合う場は
  - kind: para
    text: 多い方がいい
  p75: []
  p76: []
  p77:
  - kind: para
    text: 情報を他者に教えられる
  - kind: para
    text: レベルに整理することで
  - kind: para
    text: 自分の理解を深めたい
  p78:
  - kind: para
    text: 個人的な思想：
  - kind: para
    text: 直接的な勉強より
  - kind: para
    text: 多角的な視点を得たい
  p79:
  - kind: para
    text: PHP && 技術
  - kind: para
    text: ではなく
  - kind: para
    text: PHP愛 || 技術
  p80:
  - kind: para
    text: 発表内容を「勉強」として
  - kind: para
    text: 完全理解することに
  - kind: para
    text: こだわる必要はない
  p81:
  - kind: para
    text: 記憶のフックを作って
  - kind: para
    text: いつか役立ててほしい
  p82:
  - kind: para
    text: PHPにお世話になっている
  - kind: para
    text: からといって全員が
  - kind: para
    text: PHPエコシステムに貢献し
  - kind: para
    text: ないといけないことはない
  p83:
  - kind: para
    text: 技術コミュニティを
  - kind: para
    text: 楽しみましょう
