text:
  p1:
  - node: p
    children:
    - node: text
      content: 正しいプログラムは 綺麗なコードに宿る
  - node: p
    children:
    - node: text
      content: A good program resides in clean code.
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '北海道LT大会 '
  - node: p
    children:
    - node: bold
      content: '2022-04-15'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人
  p3:
  - node: p
    children:
    - node: text
      content: 'お前誰よ '
  - node: p
    children:
    - node: text
      content: (地元向け)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 砂川  → 宮の沢  → 代々木
  - node: p
    children:
    - node: text
      content: (1990-2007) (2007-2011) (2012-)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 北海道工業大学 (えっ、北科大なにそれ知らん)
    - node: li
      children:
      - node: text
        content: 2011年頃にPython札幌勉強会とかのコミュニティをやっていました
    - node: li
      children:
      - node: text
        content: PHPカンファレンス北海道があれば帰省する生活 (2016, 2019)
    - node: li
      children:
      - node: text
        content: 札幌Ruby会議2012スタッフ、札幌市中央区Ruby会議LT
  p4:
  - node: p
    children:
    - node: text
      content: ふだんはEmacsとか PHPとかやってます
  p5:
  - node: p
    children:
    - node: text
      content: さて
  p6:
  - node: p
    children:
    - node: text
      content: '綺麗なコード '
    - node: br
    - node: text
      content: 書いてますか？
  p7:
  - node: p
    children:
    - node: text
      content: 'コードの乱れは '
    - node: br
    - node: text
      content: 心の乱れ
  p8:
  - node: p
    children:
    - node: text
      content: 正しいプログラムは 綺麗なコードに宿る
  p9:
  - node: p
    children:
    - node: text
      content: '綺麗なコードが '
    - node: br
    - node: text
      content: モダーンなコード
  p10:
  - node: p
    children:
    - node: text
      content: '美しいコードを書くのは '
    - node: br
    - node: text
      content: 靴を脱いで揃えるのと同じ
  p11:
  - node: p
    children:
    - node: text
      content: 'きたないコードは '
    - node: br
    - node: text
      content: 争いを生む
  p12:
  - node: p
    children:
    - node: text
      content: 'さあ美しいコードを '
    - node: br
    - node: text
      content: 書きましょう…
  p13:
  - node: p
    children:
    - node: text
      content: そう思いませんか？
  p14:
  - node: p
    children:
    - node: text
      content: どうやってコードをインデントする？
  - node: p
    children:
    - node: bold
      content: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png より
  p15:
  - node: p
    children:
    - node: text
      content: 均整でないソースコードの弊害
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: チーム内での認知的な摩擦
    - node: li
      children:
      - node: text
        content: 同じリポジトリ内でも「ナワバリ」によってフォーマットの慣習が違う(!)
    - node: li
      children:
      - node: text
        content: コードレビューで「ここにスペースを入れてください」「ここで改行してくださ
      - node: br
      - node: text
        content: 'い」などの不毛すぎる指摘をする羽目に… '
    - node: li
      children:
      - node: text
        content: 「レビュー対応」というコードスタイルを直すだけの最悪のコミットが履歴に積
      - node: br
      - node: text
        content: まれる (そういう些細な変更は(fixupで直して…という意見はある)
  p16:
  - node: p
    children:
    - node: text
      content: 誰がコードを書いても 同じスタイルにしたい
  p17:
  - node: p
    children:
    - node: text
      content: Code Formatter
  - node: p
    children:
    - node: text
      content: コードスタイルを整形
    - node: br
    - node: text
      content: するツールの総称
  p18:
  - node: p
    children:
    - node: text
      content: 'フォーマッター導入 '
    - node: br
    - node: text
      content: 待ったなし
  p19: []
  p20: []
  p21:
  - node: p
    children:
    - node: text
      content: 退屈なことは機械にやらせよう
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ツールを呼び出すとフォーマッタが全てのコードを整形してくれる
    - node: li
      children:
      - node: text
        content: 人間が細かいところに気をつけながらコーディングしなくていい
    - node: li
      children:
      - node: text
        content: 最悪、人間がコードフォーマットをまったく把握してなくてもいい
    - node: li
      children:
      - node: text
        content: コミットする前にフォーマッターをかけてくれることだけ徹底してくれれば
  p22:
  - node: p
    children:
    - node: text
      content: それでだ
  p23:
  - node: p
    children:
    - node: text
      content: モダーンな言語の定義
  p24:
  - node: p
    children:
    - node: text
      content: '言語標準の '
    - node: br
    - node: text
      content: フォーマッターがある
  p25:
  - node: p
    children:
    - node: bold
      content: 'go fmt '
    - node: br
    - node: bold
      content: 'dart format '
    - node: br
    - node: bold
      content: rustfmt
  p26:
  - node: p
    children:
    - node: text
      content: 'われらが最新最高言語 '
    - node: br
    - node: text
      content: PHPはどうだ
  p27: []
  p28:
  - node: p
    children:
    - node: text
      content: 'ただ普及してる '
    - node: br
    - node: text
      content: フォーマッターはある
  p29:
  - node: p
    children:
    - node: bold
      content: 'PHP-CS-Fixer '
    - node: br
    - node: bold
      content: PHP_CodeSiffer
  p30:
  - node: p
    children:
    - node: text
      content: ＿人人人人人人＿  ＞　二つある　＜  ￣Y^Y^Y^Y^Y￣
  p31:
  - node: p
    children:
    - node: text
      content: '語ると長いが… '
    - node: br
    - node: text
      content: 設計思想の違いがある
  p32:
  - node: p
    children:
    - node: text
      content: 'まじめなプロジェクトでは '
    - node: br
    - node: text
      content: どちらかを選んで使う
  p33:
  - node: p
    children:
    - node: text
      content: で､あんたは どっち派？
  p34:
  - node: p
    children:
    - node: text
      content: どうやってコードをインデントする？
  - node: p
    children:
    - node: text
      content: CodeSniﬀer
  - node: p
    children:
    - node: text
      content: CS-Fixer
  - node: p
    children:
    - node: text
      content: 両方
  - node: p
    children:
    - node: text
      content: もちつけ
  - node: p
    children:
    - node: text
      content: tadsan
  - node: p
    children:
    - node: bold
      content: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png より
  p35:
  - node: p
    children:
    - node: text
      content: PHPについては そのうちどこかで
  p36: []
  p37:
  - node: p
    children:
    - node: text
      content: 続きはWebで
size:
  max_width: 1920
  max_height: 1080
links:
  p14:
  - url: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png
    title: www.emacswiki.org
  p27:
  - url: https://dic.pixiv.net/a/%E3%81%9D%E3%82%93%E3%81%AA%E3%82%82%E3%81%AE%E3%81%AF%E3%81%AA%E3%81%84
    title: そんなものはない (そんなものはない)とは【ピクシブ百科事典】
  p34:
  - url: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png
    title: www.emacswiki.org
