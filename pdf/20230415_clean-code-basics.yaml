text:
  p1:
  - kind: heading
    level: 1
    text: 正しいプログラムは
  - kind: heading
    level: 1
    text: 綺麗なコードに宿る
  - kind: heading
    level: 2
    text: A good program resides in clean code.
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 北海道LT大会
  - kind: para
    text: '2022-04-15'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人
  p3:
  - kind: para
    text: お前誰よ (地元向け)
  - kind: list
    items:
    - 砂川(1990-2007) → 宮の沢(2007-2011) → 代々木(2012-)
    - 北海道工業大学 (えっ、北科大なにそれ知らん)
    - 2011年頃にPython札幌勉強会とかのコミュニティをやっていました
    - PHPカンファレンス北海道があれば帰省する生活 (2016, 2019)
    - 札幌Ruby会議2012スタッフ、札幌市中央区Ruby会議LT
  p4:
  - kind: para
    text: ふだんはEmacsとか
  - kind: para
    text: PHPとかやってます
  p5:
  - kind: heading
    level: 1
    text: さて
  p6:
  - kind: para
    text: 綺麗なコード
  - kind: para
    text: 書いてますか？
  p7:
  - kind: para
    text: コードの乱れは
  - kind: para
    text: 心の乱れ
  p8:
  - kind: para
    text: 正しいプログラムは
  - kind: para
    text: 綺麗なコードに宿る
  p9:
  - kind: para
    text: 綺麗なコードが
  - kind: para
    text: モダーンなコード
  p10:
  - kind: para
    text: 美しいコードを書くのは
  - kind: para
    text: 靴を脱いで揃えるのと同じ
  p11:
  - kind: para
    text: きたないコードは
  - kind: para
    text: 争いを生む
  p12:
  - kind: para
    text: さあ美しいコードを
  - kind: para
    text: 書きましょう…
  p13:
  - kind: heading
    level: 1
    text: そう思いませんか？
  p14:
  - kind: heading
    level: 1
    text: どうやってコードをインデントする？
  - kind: para
    text: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png より
  p15:
  - kind: para
    text: 均整でないソースコードの弊害
  - kind: list
    items:
    - チーム内での認知的な摩擦
    - 同じリポジトリ内でも「ナワバリ」によってフォーマットの慣習が違う(!)
    - コードレビューで「ここにスペースを入れてください」「ここで改行してくださ
  - kind: para
    text: い」などの不毛すぎる指摘をする羽目に…
  - kind: list
    items:
    - 「レビュー対応」というコードスタイルを直すだけの最悪のコミットが履歴に積
  - kind: para
    text: まれる (そういう些細な変更はfixupで直して…という意見はある)
  p16:
  - kind: para
    text: 誰がコードを書いても
  - kind: para
    text: 同じスタイルにしたい
  p17:
  - kind: para
    text: Code Formatter
  - kind: para
    text: コードスタイルを整形
  - kind: para
    text: するツールの総称
  p18:
  - kind: para
    text: フォーマッター導入
  - kind: para
    text: 待ったなし
  p19: []
  p20: []
  p21:
  - kind: para
    text: 退屈なことは機械にやらせよう
  - kind: list
    items:
    - ツールを呼び出すとフォーマッタが全てのコードを整形してくれる
    - 人間が細かいところに気をつけながらコーディングしなくていい
    - 最悪、人間がコードフォーマットをまったく把握してなくてもいい
    - コミットする前にフォーマッターをかけてくれることだけ徹底してくれれば
  p22:
  - kind: heading
    level: 1
    text: それでだ
  p23:
  - kind: heading
    level: 1
    text: モダーンな言語の定義
  p24:
  - kind: para
    text: 言語標準の
  - kind: para
    text: フォーマッターがある
  p25:
  - kind: para
    text: go fmt
  - kind: para
    text: dart format
  - kind: para
    text: rustfmt
  p26:
  - kind: para
    text: われらが最新最高言語
  - kind: para
    text: PHPはどうだ
  p27: []
  p28:
  - kind: para
    text: ただ普及してる
  - kind: para
    text: フォーマッターはある
  p29:
  - kind: para
    text: PHP-CS-Fixer
  - kind: para
    text: PHP_CodeSiffer
  p30:
  - kind: para
    text: ＿人人人人人人＿
  - kind: para
    text: ＞ 二つある ＜
  - kind: para
    text: ‾Y^Y^Y^Y^Y‾
  p31:
  - kind: para
    text: 語ると長いが…
  - kind: para
    text: 設計思想の違いがある
  p32:
  - kind: para
    text: まじめなプロジェクトでは
  - kind: para
    text: どちらかを選んで使う
  p33:
  - kind: para
    text: で、あんたは
  - kind: para
    text: どっち派？
  p34:
  - kind: heading
    level: 1
    text: どうやってコードをインデントする？
  - kind: para
    text: CS-Fixer
  - kind: para
    text: CodeSniffer
  - kind: para
    text: 両方
  - kind: para
    text: もちつけ
  - kind: para
    text: tadsan
  - kind: para
    text: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png より
  p35:
