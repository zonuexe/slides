    text: 構文解析(parsing)
  - kind: para
    text: if文if条件式==比較式
  - kind: para
    text: echo文
  p47:
  - kind: heading
    level: 1
    text: トークン列
  - kind: para
    text: PHPはじまったな
  - kind: para
    text: if文はじまったな
  - kind: para
    text: 条件式はじまったな
  - kind: para
    text: こいつの前後は==比較だな
  - kind: para
    text: 条件式終了のお知らせ
  - kind: para
    text: ここからブロックだな
  - kind: para
    text: echoだな
  - kind: para
    text: 文字列だな
  - kind: para
    text: ; で echo ＼(^o^)／ ｵﾜﾀ
  - kind: para
    text: '} で if文 ＼(^o^)／ ｵﾜﾀ'
  p48: []
  p49:
  - kind: heading
    level: 1
    text: PHP-Parser
  - kind: list
    items:
    - PHPの(元)コア開発者のNikita PopovによるPHP構文解析ライブラリ
    - PHPで書かれておりComposerで導入可能
    - PHPStan, Rector, PHPUnitなどはじめ多くのツールの基盤
    - 2024年1月8日にPHP-Parser 5.0がリリースされた
    - ただし現行のPHPStan, RectorはまだPHP-Parser 4.xを利用
    - PHPStanは2024年内にリリース予定の2.0で5.xに移行予定
  p50:
  - kind: heading
    level: 1
    text: 構文木 (4.x)
  p51:
  - kind: heading
    level: 1
    text: 構文解析(parsing)
  - kind: para
    text: if文if条件式==比較式
  - kind: para
    text: echo文
  p52:
  - kind: heading
    level: 1
    text: 構文木 (4.x)
  p53:
  - kind: heading
    level: 1
    text: 構文木 (5.x)
  p54:
  - kind: para
    text: 構文木 (syntax tree)
  - kind: list
    items:
    - プログラムの構造を解析した結果を木構造にしたもの
    - PHPの場合は <?php foo(); bar(); のように ; 区切りでいくつも文を書
  - kind: para
    text: けるので、トップレベル(一番外側)は配列 [] になっている
  - kind: list
    items:
    - その内側に入っているものの一個一個のことを「ノード」と呼ぶ
    - PHPのクラスとして定義されている
    - PHP-Parserのノードの種類はGitHubで見るのがわかりやすい
  p55:
  - kind: para
    text: expression
  - kind: para
    text: = 式
  - kind: para
    text: Statement
  - kind: para
    text: = 文
  p56:
  - kind: para
    text: PHP構文でのechoとprintの違いは？
  p57:
  - kind: para
    text: 式 vs 文
  - kind: list
    items:
    - '式 (expressions) : 演算子や関数呼び出しなど組み合わせて書ける'
    - '文 (statement) : 制御構造など、式の内側に書けないもの'
    - if/switchのような制御構造やclass、functionの宣言文など
    - var_dump($v); 関数呼び出しや代入式だけの文は「式文」と呼ばれる
  p58: []
  p59: []
  p60:
  - kind: para
    text: 式と文と式文
  - kind: list
    items:
    - $a = 1 「代入文」と呼ばれがちだが、代入そのもの式
    - include_once や require_once も実は式ではなく文
    - PHP 8系では fn() や match () {} など式が使いやすくなった
    - PHP 7までは「throw文」だったが、PHP 8からは「throw式」になった
    - var_dump($v); 関数呼び出しや代入式だけの文は「式文」と呼ばれる
  p61:
  - kind: para
    text: PHP-Parser 4.x → 5.0
  - kind: list
    items:
    - 実行環境要件としてPHP 7.4以上を要求
    - PHP 5.x専用パーサーを削除
    - 変な名前のクラスをわかりやすいようにリネーム
  p62:
  - kind: para
    text: 'PHP7 vs 8: トークナイズの違い'
  - kind: list
    items:
    - https://wiki.php.net/rfc/namespaced_names_as_token
    - PHP 8.0からnamespaceの一部に予約語を含められるようになった
    - その代りにトークンの間にスペース空けるのが許容されなくなった
    - PHP-Parser 5.0ではこのトークナイズの結果が反映される
  p63:
  - kind: heading
    level: 1
    text: token_get_all()の違い
  p64:
  - kind: heading
    level: 1
    text: PHP 7.xで動いてたコード
  p65:
