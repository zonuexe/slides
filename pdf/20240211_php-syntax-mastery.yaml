    text: 今回のお題
  p7:
  - kind: para
    text: 世はまさに静的解析時代！
  p8:
  - kind: para
    text: 静的解析プログラムの性質をプログラムを実行せずに検査する技術の総称
  p9:
  - kind: para
    text: 2010年～PhpStormリリース
  p10: []
  p11:
  - kind: para
    text: 2018年～PHPStanの普及
  p12: []
  p13:
  - kind: heading
    level: 1
    text: PHPStanの特徴
  - kind: list
    items:
    - PHPで書かれたオープンソースの静的解析ツール
    - ルールや型付けなどの拡張をPHPで柔軟に記述可能
    - 変数スコープや型推論が実装されており、プログラムを実行しなくても
  - kind: para
    text: 実行時の状態をかなり正確に推測できる
  - kind: list
    items:
    - レガシーコードを解析するために実行時情報(ランタイムリフレクション)を
  - kind: para
    text: 利用することもできる
  p14:
  - kind: para
    text: PHPを正確に理解したいと思ったことはありますか？
  p15:
  - kind: para
    text: PHPを正確に理解したいと思ったことはありますか？
  p16:
  - kind: para
    text: 正確じゃない理解
  - kind: para
    text: '#とは'
  p17:
  - kind: para
    text: ソースコードをリファクタリングすることを考えましょう
  p18:
  - kind: para
    text: 例えば:クラス名を変更したい
  p19:
  - kind: para
    text: パッケージ全部ではなく1クラスだけ移動したい
  - kind: heading
    level: 1
    text: Hakone\Runner
  - kind: heading
    level: 1
    text: ↓
  - kind: heading
    level: 1
    text: Olympic\Athlete
  p20:
  - kind: heading
    level: 1
    text: シェル芸で一発
  - kind: para
    text: $ find . -type f -name "*.php" -exec gsed -I \'s/Hakone\\\\Runner/Olympic\\\\Athlete/g'
      {} +
  p21:
  - kind: heading
    level: 2
    text: シェル芸で一発
  - kind: para
    text: $ find . -type f -name "*.php" -exec gsed -I \'s/Hakone\\\\Runner/Olympic\\\\Athlete/g'
      {} +
  - kind: heading
    level: 1
    text: 完
  p22:
  - kind: para
    text: …そう簡単にはいきませんよね？
  p23:
  - kind: para
    text: なぜ単純に置換してはいけないのか
  - kind: list
    items:
    - 単純置換でいける場合もある
    - クラス名が常にFQCN(完全修飾クラス名)で書かれているなら
    - PHPのクラス名は常にFQCNが書かれるわけではない
    - そもそも、ただの出力文字列としてコードに書かれたものと区別ができない
    - 例：クラスについてのHTMLドキュメントをPHPファイルに埋め込む
  p24:
  - kind: para
    text: PHP名前空間のクラス名解決
  p25:
  - kind: para
    text: <?php namespace Foo;
  - kind: para
    text: $now = new Date();
  - kind: para
    text: '// Fatal error: Uncaught Error: Class "Foo\DateTime" not found'
  p26:
  - kind: para
    text: クラス名の絶対参照
  - kind: heading
    level: 1
    text: <?php
  - kind: heading
    level: 1
    text: namespace Foo;
  - kind: heading
    level: 1
    text: $now = new \Date();
  - kind: para
    text: // No errors.
  p27:
  - kind: para
    text: クラスのインポート
  - kind: para
    text: <?php namespace Foo;use Date;$now = new Date();
  - kind: para
    text: // No errors.
  p28: []
  p29: []
  p30:
  - kind: heading
    level: 1
    text: もっと簡単に
  p31: []
  p32:
  - kind: heading
    level: 1
    text: PhpStorm最高！
  p33:
  - kind: heading
    level: 1
    text: PhpStorm最高！
  p34:
  - kind: para
    text: 2024年、全PHPerはリファクタリングの全フローをPhpStormに委ねるしかないのか？
  p35:
  - kind: heading
    level: 1
    text: そうではない
  - kind: para
    text: (もちろんPhpStormも優れた製品だが)
  p36:
  - kind: heading
    level: 1
    text: ということで
  p37:
  - kind: heading
    level: 1
    text: Rectorを使おう
  p38: []
  p39:
  - kind: para
    text: Rectorとは
  - kind: list
    items:
    - Tomas Votruba氏が開発する自動リファクタリングツール
    - ソースコード https://github.com/rectorphp/rector-src
    - Composerで簡単に導入できる
    - PHP 7.2以上で動作し、PHPStan以外への依存関係を持たない
    - 非常に数多くのルールを内蔵しているので、そのままで多くのユースケースに
  - kind: para
    text: 対応できる (PHPやPHPUnitのバージョンアップなど)
  p40:
  - kind: heading
    level: 1
    text: Rectorの特徴
  - kind: list
    items:
    - PHP-ParserとPHPStanをベースにカスタムルールを構築できる
    - 単純な構文木を扱えるだけでなく、PHPStanが分析する変数スコープや
  - kind: para
    text: 型情報にアクセスできるため、(コードに適切な型がついているという前提において)かなり信頼性の高いリファクタリングが可能
  - kind: list
    items:
    - あくまで構文木を扱うツールなので、出力されるコードの細かいスタイルの
  - kind: para
    text: 制御には対応していない (ほかのフォーマットツールや同作者のECSを併用)
  p41:
  - kind: heading
    level: 2
    text: こうぶんき
  - kind: heading
    level: 1
    text: 構文木ってなんだ
  p42:
  - kind: para
    text: プログラムはどうやって動くの？
  p43:
  - kind: heading
    level: 1
    text: ソースコード
  p44:
