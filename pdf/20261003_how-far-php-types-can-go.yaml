  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p42:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p43:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にfloatを強制するのか
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p44:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p45:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p46:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p47:
  - kind: heading
    level: 1
    text: PHPの型宣言の特徴
  - kind: list
    items:
    - コードごとに declare(strict_types=1); が宣言できる
    - 引数とデータ型の種類を厳密にチェックしてTypeErrorを出す
    - デフォルト(無宣言)では、 add("1", "2”) を add(1, 2) としてキャスト
    - add(“a”, “b”) のような数値ではない文字列はTypeErrorになり安心
    - add((int) $a, (int) $b); のようなコードとは安全性のレベルが違う
  p48:
  - kind: heading
    level: 1
    text: ここまでのまとめ
  p49:
  - kind: heading
    level: 1
    text: PHPに型宣言はある
  p50:
  - kind: para
    text: 型宣言された型は口約束ではなく実効性がある
  p51:
  - kind: para
    text: 型理論としては型なしだががんばって動作確認するなら実用上ほぼ型付きと認められなくもなくなってきた
  p52:
  - kind: para
