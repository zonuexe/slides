    level: 1
    text: まとめ
  p112:
  - kind: para
    text: 正しいものは？ (複数回答可能)
  - kind: para
    text: 1. PHPは型なし言語である2. PHPには型宣言がある3. PHPに書く型は実行時に保証されない4. PHPは静的型付きである
  p113:
  - kind: para
    text: 正しいものは？ (複数回答可能)
  - kind: para
    text: ✅ PHPは型なし言語である
  - kind: para
    text: ✅ PHPには型宣言がある
  - kind: para
    text: ✅ PHPに書く型は実行時に保証されない
  - kind: para
    text: ✅ PHPは静的型付きである
  p114:
  - kind: para
    text: 考え方によってはすべて正しい
  p115:
  - kind: heading
    level: 1
    text: PHPが静的型付きと言える条件
  - kind: list
    items:
    - 静的解析やユニットテストなどのCIチェックした上でデプロイされている
    - PHPStan, Psalm, Phan, Magoなど… Lv.maxかどうかは問わない
    - ユニットテストで十分なカバレッジのテストが網羅されている
    - ツールの種類×プロジェクトが静的に信頼に足る状況にできるかが大きい
    - 静的型付きの言語を使っていても本番で健全性がないコードにできる
    - PHPは動的言語の中では実行時バリデーションのお蔭で問題が隠れない
  p116:
  - kind: para
    text: AI時代にPHPを使うメンタルモデルについては香川で話した
