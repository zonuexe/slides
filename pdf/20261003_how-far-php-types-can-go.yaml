  p59:
  - kind: para
    text: 型宣言にarrayとしか書かないと
  - kind: list
    items:
    - メソッドに何を渡せばいいのかわからない
    - どんな形式の配列を渡しても動くという関数は決して多くない
    - 標準関数の count() のようなユーティリティが多め
    - プロパティにも何が入ってるのかわからない
    - 従来のLaravelは @var array まみれだった
    - Laravel 9.xのコードベースでは配列の内部構造に型がついている
  p60:
  - kind: heading
