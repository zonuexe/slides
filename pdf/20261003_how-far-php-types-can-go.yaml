  p24:
  - kind: heading
    level: 1
    text: 型付け(typing) vs 型付き(typed)
  - kind: list
    items:
    - プログラムを検査して、項(≒ 式, expression)のとりうる状態を
  - kind: para
    text: 分類するのが型付け(typing)。型を明示しなくても項の種類を特定する具体的な手続きが型推論(type inference)。
  - kind: list
    items:
    - 実行時に値の型チェックを行なうことを、
  - kind: para
    text: 便宜的に動的型付け(dynamic typing)と呼ぶこともある
  - kind: list
    items:
    - 静的な型付けによってとりうる状態が定まったプログラムのことを
  - kind: para
    text: 「型付き(typed)」と呼ぶ
  p25:
  - kind: para
    text: 1. PHPは型なし言語である2. PHPには型宣言がある3. PHPに書く型は実行時に保証されない4. PHPは静的型付きである
  p26:
  - kind: heading
    level: 1
    text: 健全性
  - kind: heading
    level: 2
    text: (Soundness)
  p27:
  - kind: para
    text: 静的解析が通れば実行時に(型に関する)エラーは起こらないという性質
  p28:
  - kind: para
    text: いわゆる「型安全」(type safety)
  - kind: list
    items:
    - 健全性(Soundness)と同じ意味
    - 濫用されがちな用語だが、概ね型に関する記述に矛盾がないことを保証でき
  - kind: para
    text: るようになっていることを表わしている
  - kind: list
    items:
    - 「健全性がある」 実行したときに、型に関するエラーが起こらないといえる
    - 「健全性がない」 実行してみたときに、エラーが起こりかねない
    - C言語全般、Javaの「ぬるぽ」、TypeScriptのany/asや配列など
  p29:
  - kind: para
    text: 言語が静的か動的かとは[独自研究]
  - kind: list
    items:
    - ある言語の仕様または標準的な処理系によって構造が事前に検証されている
  - kind: para
    text: ことが前提になっている言語が静的(型付き)
  - kind: list
    items:
    - 事前検証が前提ではなく、実行時(run-time)に構造が決定されるのが動的
    - 一般的にはコンパイラ vs インタプリタに一致するが、必ずしもそうではない
    - 静的言語にも多かれ少なかれ動的な機能が存在し、グラデーションは大きい
    - 動的言語でもPHP, Python, Ruby, JavaScriptで動的要素が全然違う
  p30:
  - kind: heading
    level: 1
    text: TypeScriptにとっての型
  - kind: list
    items:
    - 型宣言をもとに型チェックを行なって、分析情報を報告
    - 実行時には型情報は何も残らない
    - JavaScriptにコンパイル ≒ 型定義の部分をひっぺがして実行
    - Node.js 25.2ではType Strippingで直接実行できるようになった
    - 実際にはTypeScript enum など別のコード生成をする機能もある
    - 型がついたコードは実行時にはエラーが出ないでほしい(願望)
  p31:
  - kind: heading
    level: 1
    text: ファクトチェック
  p32:
  - kind: para
    text: 1. PHPは型なし言語である2. PHPには型宣言がある3. PHPに書く型は実行時に保証されない4. PHPは静的型付きである
  p33:
  - kind: heading
    level: 1
    text: 型理論から見たPHPインタプリタ
  - kind: list
    items:
    - 型が合わない（Ill-typed）コードであっても、エラーとして弾かれず、
  - kind: para
    text: 正当なプログラム（構文木）として受理される → 実行時エラー
  - kind: list
    items:
    - 関数は型宣言に拘らず、任意の値を返そうとすることができる
    - プロパティは型宣言に拘らず、任意の値を代入しようとすることができる
    - ローカル変数に型宣言はなく、任意の型の値を代入可能
    - オペコードコンパイラは実行前にプログラムの健全性を「証明」しない
  p34:
  - kind: para
    text: 実行時のインタプリタの振る舞い
  - kind: list
    items:
    - PHP処理系(ZendVM)内では、zval構造体に型タグを保持している
    - 常に is_int() のような関数で型を識別できる
    - 型宣言と反した値が渡されると、キャストまたは実行時エラーが起こる
    - いわゆる「強い型付け」であり、実行時に型がとり違えられることはない
    - RTTI(実行時型情報)は型理論における(静的な)型ではない
    - 言語セマンティクスとしては型なしだが、JITは静的型情報を活用する
  p35:
  - kind: heading
    level: 1
    text: ここまでのまとめ
  p36:
  - kind: para
    text: PHPインタプリタは型なしである
  p37:
  - kind: para
    text: 1. PHPは型なし言語である2. PHPには型宣言がある3. PHPに書く型は実行時に保証されない4. PHPは静的型付きである
  p38:
  - kind: para
    text: PHPと型宣言
  - kind: list
    items:
    - 引数などのデータ型を表わす手段としてコメントにPHPDocを書く文化
    - PHP 5.xで関数／メソッドのパラメータに「型ヒント」が書けるようになった
    - array, callable, クラス名, インターフェイス名だけを書けた
    - PHP 7.0で正式に「型宣言」としてスカラー型宣言と戻り値型が記述可能に
    - PHP 8.0以降でユニオン型宣言などが機能追加
  p39:
  - kind: heading
    level: 1
    text: 型宣言がない関数(PHP5)
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p40:
  - kind: heading
    level: 1
    text: スカラー型宣言(PHP7)
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p41:
  - kind: heading
    level: 1
