text:
  p1:
  - node: p
    children:
    - node: text
      content: PHP筋肉をつけるI want to get PHP muscle2018-12-15  Japan PHP Conference
    - node: bold
      content: '         '
    - node: text
      content: 'Kamata, Tokyo, Japan '
    - node: bold
      content: '#phpcon2018'
  p2:
  - node: p
    children:
    - node: text
      content: 'お前誰ようさみけんた (@tadsan) / Zonu.EXE

        '
    - node: text
      content: 'GitHub/Packagistでは id: zonuexe

        •ピクシブ株式会社 pixiv運営本部

        •Emacs Lisper, PHPer

        •Emacs PHP Modeのメンテナ引き継ぎました

        •好きなリスプはEmacs Lispです

        •Qiitaに記事を書いたり変なコメントしてるよ•'
  p3:
  - node: p
    children:
    - node: text
      content: 待ってるにょ
  p6:
  - node: p
    children:
    - node: text
      content: 趣味趣味はQiitaとphpusers-jaのSlackで困ってる人が居たら即レスすることです
  p7:
  - node: p
    children:
    - node: text
      content: 💪日々の筋トレのたまもの
  p8:
  - node: p
    children:
    - node: text
      content: <?php
  p9:
  - node: p
    children:
    - node: text
      content: 💪
  p10:
  - node: p
    children:
    - node: text
      content: '日本語でおｋPHP: Hypertext Preprocessor (or simply PHP) is a server-side
        scripting language designed for Web development, and also used as a general-purpose
        programming language.'
  p11:
  - node: p
    children:
    - node: text
      content: 'インターネッツWeb開発         汎用言語'
  p12:
  - node: p
    children:
    - node: text
      content: ヒト形決戦兵器汎用
  p13:
  - node: p
    children:
    - node: text
      content: 'ボクのAA　　　　　　+ 　　　　+　　+　　　　　／￣￣￣￣￣￣￣￣￣￣￣￣  　　　∧＿∧　　　　＜　 わーいPHPだー！　PHPだー
        　 br（´∀｀　）ﾜｰｲ !　|　 　　何でもできるぞー + 　　ヽ 　　　つ　 　　＼＿＿＿＿＿＿＿＿＿＿＿＿ 　　 　　(⌒_ノ 　　 　　
        し''ゝ　;;::⌒:: '
  p14:
  - node: p
    children:
    - node: text
      content: '並列処理…なんでもできる         とは言ってない'
  p15:
  - node: p
    children:
    - node: text
      content: 'できないこと以外         なんでもできる'
  p16:
  - node: p
    children:
    - node: text
      content: バックグラウンド
  p17:
  - node: p
    children:
    - node: text
      content: かけらに眠る勇者の心…Rubyを勉強してRailsにジョブチェンジしました！
  p18:
  - node: p
    children:
    - node: text
      content: 'PHPつらたんみたいな話は         結構よく聞く'
  p19:
  - node: p
    children:
    - node: text
      content: Ruby最高、一番好きなLispです私は逆でRubyからPHPに入りました
  p20:
  - node: p
    children:
    - node: text
      content: 'PHP関係なく強い人はたくさん居る2014年当時の社内には         PHPが好きでPHPを極めてるような人はごく少数だった'
  p21:
  - node: p
    children:
    - node: text
      content: 'PHP関係なく強い人はたくさん居るすくなくともPHPの         極意を伝授してくれる         ひとは居なかった'
  p22:
  - node: p
    children:
    - node: text
      content: '力が… 欲しいなので2014年         くらいから         やってみた'
  p23:
  - node: p
    children:
    - node: text
      content: 契機
  p24:
  - node: p
    children:
    - node: text
      content: 'ちょっとAPI叩いて         ファイルに書き出すだけだしRubyで書くか…pixiv本体の一部だしPHPでアッハイ…'
  p25:
  - node: p
    children:
    - node: text
      content: なるほど…PHPで書いた
  p26:
  - node: p
    children:
    - node: text
      content: '力が… 欲しいそのとき         作ったもの'
  p27:
  - node: p
    children:
    - node: text
      content: メタプログラミングサブコマンドが作れるCLIツール
  p28:
  - node: p
    children:
    - node: text
      content: 'gitgitにしてやんよサブコマンド          || とか          git diﬀgit statusみたいに         第二引数の文字列によって         動きを変えるコマンド'
  p29:
  - node: p
    children:
    - node: text
      content: 'Rubyでタスク定義するなら         そのとき念頭にあったRake'
  p30:
  - node: p
    children:
    - node: text
      content: 'Hash[]がないIO/StringIOがない…Rubyみたいに         メタプロるには…'
  p31:
  - node: p
    children:
    - node: text
      content: メタプログラミングうまくいった点
  p32:
  - node: p
    children:
    - node: text
      content: 'よっしゃReflectionで         クラスの定義が         実行時に取れる'
  p33:
  - node: p
    children:
    - node: text
      content: 'オプションごとに         ヘルプを         書きたかった'
  p34:
  - node: p
    children:
    - node: text
      content: メタプログラミング車輪の再発明
  p35:
  - node: p
    children:
    - node: text
      content: メタプログラミング必要な機能を持ったStringIOクラスを作ってみる
  p36:
  - node: p
    children:
    - node: text
      content: 継承関係はないRubyのStringIOは実際のファイルと紐付いてないがIOクラスと同じメソッドを持つクラス
  p37:
  - node: p
    children:
    - node: text
      content: 継承関係はないこのときは文字列をバッファ代りにしてポインタを保持してシークするようにした
  p38:
  - node: p
    children:
    - node: text
      content: '         php://temp'
    - node: bold
      content: '2018'
    - node: text
      content: でいいじゃん
  p39:
  - node: p
    children:
    - node: text
      content: 'new SplFileObject第一引数にファイル名をとるが、実は "          php://memory"という文字列も渡せるこの仕様を知ったのは後だった         http://php.net/manual/ja/wrappers.php'
  p40:
  - node: p
    children:
    - node: text
      content: そのあと
    - node: bold
      content: '         '
    - node: text
      content: やったこと
  p41:
  - node: p
    children:
    - node: text
      content: 'http://php.net/manual/ja/信頼できる         情報源を知る'
  p42:
  - node: p
    children:
    - node: text
      content: コードを読むとか仕様書を読むとか、できるならそれに越したことはない
  p43:
  - node: p
    children:
    - node: text
      content: http://php.net/manual/ja/PHPマニュアル
  p44:
  - node: p
    children:
    - node: text
      content: 'JavaScriptHTML, CSS, JavaScript         MDN web docs (Mozilla)'
  p45:
  - node: p
    children:
    - node: text
      content: http://php.net/manual/ja/PHPマニュアルを読む
  p46:
  - node: p
    children:
    - node: text
      content: http://php.net/manual/ja/載ってる関数を実際使ってみる
  p47:
  - node: p
    children:
    - node: text
      content: http://php.net/manual/ja/配列関数SPLイテレータ
  p48:
  - node: p
    children:
    - node: text
      content: 'PHPコードを         書く手数を増やす'
  p49:
  - node: p
    children:
    - node: text
      content: 'readevalprint loop––Rubyだと         IRBがある'
  p50:
  - node: p
    children:
    - node: text
      content: readevalprint loop––JavaScriptでもChromeにコンソールがある
  p51:
  - node: p
    children:
    - node: text
      content: 'readevalprint loop––PHPだとどうすれば… 検索をすれば         いろいろあるけど'
  p52:
  - node: p
    children:
    - node: text
      content: なんか作り込まれてるPsySH
  p53:
  - node: p
    children:
    - node: text
      content: 過去のPHPが比較https://3v4l.org/
  p54:
  - node: p
    children:
    - node: text
      content: 'Rubyのsortと         sort!の違いは         どう表現するか'
  p55:
  - node: p
    children:
    - node: text
      content: 'sortしてみる<?php $a = [4, 3, 1, 2];          $b = $a; sort($b); // $a は変化なく $b だけがソートされる         // Rubyで書くと b = a.sort sort($a); // Rubyで書くと a.sort'
  p56:
  - node: p
    children:
    - node: text
      content: こういう挙動を調べるとRubyのArrayとPHPの配列が全然別物だとわかってくる
  p57:
  - node: p
    children:
    - node: text
      content: readevalprint loop––ほかの言語から拝借したものをPHPに持ち込んでどやってみる
  p58:
  - node: p
    children:
    - node: text
      content: 'http://php.net/manual/ja/ほかの言語で         できることを         実現してみる'
  p60:
  - node: p
    children:
    - node: text
      content: http://php.net/manual/ja/一見役に立たなそうでもPHPの世界になかったものを実現できてしまった
  p61:
  - node: p
    children:
    - node: text
      content: 'http://php.net/manual/ja/Rubyで特別に         見えた機能Enumerable#lazy'
  p62:
  - node: p
    children:
    - node: text
      content: http://php.net/manual/ja/PHPのarray_mapと同じような機能だが、実行タイミングを必要になるタイミングまで遅らせられる
  p63:
  - node: p
    children:
    - node: text
      content: 'http://php.net/manual/ja/実はPHPでは         遙かに簡単に         遅延評価mapが         作れるとわかった'
  p64:
  - node: p
    children:
    - node: text
      content: baguette/copipe-iter
  p65:
  - node: p
    children:
    - node: text
      content: '他の言語に無根拠に         羨ましがらなくなった'
  p66:
  - node: p
    children:
    - node: text
      content: PHPは便利なのでEmacs LispからPHP関数を実行できるようにもした
  p67:
  - node: p
    children:
    - node: text
      content: まとめ
  p68:
  - node: p
    children:
    - node: text
      content: '増井先生という人は         「PHPの関数の数は人がWebでやりたいことの数」         だと言った'
  p69:
  - node: p
    children:
    - node: text
      content: 隣の芝は青くない！俺たちの方が青い！
  p70:
  - node: p
    children:
    - node: text
      content: 筋肉は自信！
  p71:
  - node: p
    children:
    - node: text
      content: 同僚がPHPがそこまで好きじゃないことは知ってる
  p72:
  - node: p
    children:
    - node: text
      content: 'みんな違って         みんないい'
  p73:
  - node: p
    children:
    - node: text
      content: 方針を決められれば手早く解決できる人たちはいっぱい居る
  p74:
  - node: p
    children:
    - node: text
      content: '知らないことは         調べる'
  p75:
  - node: p
    children:
    - node: text
      content: 'だから創作活動が         好きな人は来てくれ'
  p76:
  - node: p
    children:
    - node: text
      content: '私からは         異常です'
