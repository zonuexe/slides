text:
  p1:
  - node: p
    children:
    - node: text
      content: PHPStan超クイックマスター
  - node: p
    children:
    - node: text
      content: PHPStan “super” quick master
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: 2021.10.02
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人
  p3: []
  p4:
  - node: p
    children:
    - node: text
      content: さて
  p5:
  - node: p
    children:
    - node: text
      content: 'PHPerKaigiの '
    - node: br
    - node: text
      content: 'チケットを買うと '
    - node: br
    - node: text
      content: パンフレットがもらえる
  p6: []
  p7:
  - node: p
    children:
    - node: text
      content: 'PHPStan '
    - node: br
    - node: text
      content: '= '
    - node: br
    - node: text
      content: Static Analyzer
  p8:
  - node: p
    children:
    - node: text
      content: '実行しなくても バグの可能性を '
    - node: br
    - node: text
      content: 検知できる
  p9:
  - node: p
    children:
    - node: text
      content: '全8ページで PHPStanの '
    - node: br
    - node: text
      content: 基礎を押えられる
  p10:
  - node: p
    children:
    - node: text
      content: 実務で最低限使うため に知っておきたいこと を詰め込んだ… はず
  p11:
  - node: p
    children:
    - node: text
      content: PHP本来の型のコン セプトからPHPDoc による拡張までを網羅
  p12:
  - node: p
    children:
    - node: text
      content: 僕と契約して
    - node: br
    - node: text
      content: 'PHPStanを完全に '
    - node: br
    - node: text
      content: マスターしてよ
  p13:
  - node: p
    children:
    - node: text
      content: 'という話をしたい '
    - node: br
    - node: text
      content: のではない
  p14:
  - node: p
    children:
    - node: text
      content: 'PHPStanは '
    - node: br
    - node: text
      content: '完全無料なので '
    - node: br
    - node: text
      content: いますぐ入れよう
  p15:
  - node: p
    children:
    - node: text
      content: これからプロになりた い人に本当に伝えたい PHPDocの書きかた
  p16:
  - node: p
    children:
    - node: text
      content: 'その1 '
    - node: br
    - node: text
      content: 配列は使い分ける
  p17:
  - node: p
    children:
    - node: text
      content: '世の中には '
    - node: br
    - node: text
      content: いろんな配列がある
  p18:
  - node: p
    children:
    - node: bold
      content: '[1, 2, 3]'
  p19:
  - node: p
    children:
    - node: bold
      content: '[ '
    - node: br
    - node: bold
      content: '     ''name'' => ''Miku'', '
    - node: br
    - node: bold
      content: '     ''age'' => 14, '
    - node: br
    - node: bold
      content: '] '
  p20:
  - node: p
    children:
    - node: bold
      content: '[ '
    - node: br
    - node: bold
      content: '    ''Miku'', ''Rin'', ''Luka'', '
    - node: br
    - node: bold
      content: ']'
  p21:
  - node: p
    children:
    - node: bold
      content: '[ '
    - node: br
    - node: bold
      content: '    ''main''    => ''Miku'',     ''sub''      => ''Rin'', '
    - node: br
    - node: bold
      content: '    ''chorus'' => ''Luka'', '
    - node: br
    - node: bold
      content: ']'
  p22:
  - node: p
    children:
    - node: text
      content: '単なる型で書くと '
  - node: p
    children:
    - node: text
      content: array
  p23:
  - node: p
    children:
    - node: bold
      content: 'interface X '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    function a(): array; '
    - node: br
    - node: bold
      content: '}'
  p24:
  - node: p
    children:
    - node: bold
      content: 'function (X $obj) {     $a = $obj->a(); '
    - node: br
    - node: bold
      content: '};'
  p25:
  - node: p
    children:
    - node: bold
      content: 'function (X $x) {     $a = $x->a(); '
    - node: br
    - node: bold
      content: '    $v = $a[0]; '
    - node: br
    - node: bold
      content: '};'
  p26:
  - node: p
    children:
    - node: text
      content: '配列から取り出した '
    - node: br
    - node: text
      content: '要素の型がわからない '
    - node: br
    - node: text
      content: のは都合が悪い
  p27:
  - node: p
    children:
    - node: bold
      content: 'array<int> '
    - node: br
    - node: bold
      content: array<string>
  p28:
  - node: p
    children:
    - node: text
      content: 'ちょっと前は '
    - node: br
    - node: text
      content: ' とか   '
  - node: p
    children:
    - node: bold
      content: int[] string[]
    - node: br
    - node: text
      content: とか書かれてた
  p29:
  - node: p
    children:
    - node: text
      content: PSR-5式の配列記法(ジェネリクス)
  - node: p
    children:
    - node: text
      content: array<int,User>
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 配列インデックスの型を指定できる
    - node: li
      children:
      - node: text
        content: 以下の配列が区別できる
  - node: p
    children:
    - node: text
      content: array<string, User>
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: '[12 => new User(), 34 => new User()]'
    - node: li
      children:
      - node: text
        content: '[''太郎'' => new User(), ''花子'' => new User()]'
    - node: li
      children:
      - node: text
        content: '[new User(''太郎''), new User(''花子'')]'
  - node: p
    children:
    - node: text
      content: list<User>
  p30:
  - node: p
    children:
    - node: text
      content: 配列には2通りある
  p31:
  - node: p
    children:
    - node: text
      content: '同じような構造が '
    - node: br
    - node: text
      content: 繰り返す配列
  p32:
  - node: p
    children:
    - node: text
      content: 'キーによって '
    - node: br
    - node: text
      content: 別の意味の値が 入っている配列
  p33:
  - node: p
    children:
    - node: bold
      content: '$a = [ '
    - node: br
    - node: bold
      content: '    ''name'' => ''初音ミク'', '
  - node: p
    children:
    - node: bold
      content: '    ''age'' => 16, '
    - node: br
    - node: bold
      content: ']; '
    - node: br
    - node: bold
      content: '// array{name:string, age: int}'
  p34:
  - node: p
    children:
    - node: bold
      content: 'array{ '
    - node: br
    - node: bold
      content: '    name: string, '
    - node: br
    - node: bold
      content: '    age: int '
    - node: br
    - node: bold
      content: '}'
  p35:
  - node: p
    children:
    - node: bold
      content: '$a = [''初音ミク'', 16]; '
  - node: p
    children:
    - node: bold
      content: '// array{0: string, 1: int}'
  p36:
  - node: p
    children:
    - node: text
      content: '繰り返すなら<> '
    - node: br
    - node: text
      content: キーごとに違うなら{}
  p37:
  - node: p
    children:
    - node: text
      content: 'その2 '
    - node: br
    - node: text
      content: 型は入出力に宿る
  p38:
  - node: p
    children:
    - node: text
      content: クエリパラメータから
    - node: br
    - node: text
      content: 値をとりたい
  p39:
  - node: p
    children:
    - node: bold
      content: 'function getById(int $id): Article '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    // '
    - node: br
    - node: bold
      content: '}'
  p40:
  - node: p
    children:
    - node: text
      content: クエリパラメータから
    - node: br
    - node: text
      content: ID値をとりたい
  p41:
  - node: p
    children:
    - node: text
      content: 実際あぶない
  - node: p
    children:
    - node: bold
      content: '$id = $_GET[''id'']; '
    - node: br
    - node: bold
      content: $article=getById($id);
  p42:
  - node: p
    children:
    - node: bold
      content: '// ?id=1 '
    - node: br
    - node: bold
      content: $_GET['id'] === '1';
  p43:
  - node: p
    children:
    - node: bold
      content: '// ?id=a '
    - node: br
    - node: bold
      content: $_GET['id'] === 'a';
  p44:
  - node: p
    children:
    - node: bold
      content: '// ?id[]=a '
    - node: br
    - node: bold
      content: $_GET['id'] === ['a'];
  p45:
  - node: p
    children:
    - node: text
      content: '危険ではないが '
    - node: br
    - node: text
      content: よくはない
  - node: p
    children:
    - node: bold
      content: $id = (int)$_GET['id'];
  p46:
  - node: p
    children:
    - node: text
      content: '安全に '
  - node: p
    children:
    - node: text
      content: int|false
  - node: p
    children:
    - node: bold
      content: '$id = mlter_var( '
    - node: br
    - node: bold
      content: '    $_GET[''id''] ?? '''', '
    - node: br
    - node: bold
      content: '    FILTER_VALIDATE_INT '
    - node: br
    - node: bold
      content: );
  p47:
  - node: p
    children:
    - node: text
      content: 'その3 '
    - node: br
    - node: text
      content: むやみに@var書かない
  p48:
  - node: p
    children:
    - node: text
      content: 初心者殺しなことに @varには複数の用法
  p49:
  - node: p
    children:
    - node: text
      content: '@varはプロパティに'
    - node: br
    - node: text
      content: 付けて書くもの
  p50:
  - node: p
    children:
    - node: bold
      content: 'class Book '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    /** @var string */ '
    - node: br
    - node: bold
      content: '    public $name; '
    - node: br
    - node: bold
      content: '}'
  p51:
  - node: p
    children:
    - node: bold
      content: 'class Book '
    - node: br
    - node: bold
      content: '{ '
  - node: p
    children:
    - node: bold
      content: '    public string $name; '
    - node: br
    - node: bold
      content: '}'
  p52:
  - node: p
    children:
    - node: bold
      content: 'class Book '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    /** @var list<Author> */ '
    - node: br
    - node: bold
      content: '    public $authors; '
    - node: br
    - node: bold
      content: '}'
  p53:
  - node: p
    children:
    - node: bold
      content: 'class Book '
    - node: br
    - node: bold
      content: '{ '
  - node: p
    children:
    - node: bold
      content: '    public list<Author> $authors; '
    - node: br
    - node: bold
      content: '}'
  p54:
  - node: p
    children:
    - node: bold
      content: 'class Book '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    /** @var list<Author> */     public array $authors; '
    - node: br
    - node: bold
      content: '}'
  p55:
  - node: p
    children:
    - node: text
      content: '@varはconstには 基本的に付けない'
  p56:
  - node: p
    children:
    - node: bold
      content: 'class Book '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    /** @var list<int> */     const IDS = [1, 2, 3]; '
    - node: br
    - node: bold
      content: '}'
  p57:
  - node: p
    children:
    - node: text
      content: 'できれば '
    - node: br
    - node: text
      content: つけない方がいい
  - node: p
    children:
    - node: bold
      content: 'class Book '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    /** @var list<int> */     const IDS = [1, 2, 3]; '
    - node: br
    - node: bold
      content: '}'
  p58:
  - node: p
    children:
    - node: text
      content: '@varを '
    - node: br
    - node: text
      content: つけない場合
  - node: p
    children:
    - node: bold
      content: 'Book::IDS[0] // => 1 Book::IDS[1] // => 2 Book::IDS[2] // => 3 '
  p59:
  - node: p
    children:
    - node: text
      content: '@varを付けると '
    - node: br
    - node: text
      content: 弱くなる
  - node: p
    children:
    - node: bold
      content: 'Book::IDS[0] // => int Book::IDS[1] // => int Book::IDS[2] // => int '
  p60:
  - node: p
    children:
    - node: text
      content: 'ローカル変数に '
    - node: br
    - node: text
      content: '@varを書く'
  p61:
  - node: p
    children:
    - node: text
      content: 'できれば '
    - node: br
    - node: text
      content: 書かないでくれ！！
  p62:
  - node: p
    children:
    - node: text
      content: 'むやみに '
    - node: br
    - node: text
      content: '@varを書かないテク'
  p63:
  - node: p
    children:
    - node: text
      content: 'そのうちどこかに '
    - node: br
    - node: text
      content: ちゃんと書きます…
size:
  max_width: 1920
  max_height: 1080
links: {}
