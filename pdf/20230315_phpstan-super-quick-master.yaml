text:
  p1:
  - kind: heading
    level: 1
    text: PHPStan超クイックマスター
  - kind: heading
    level: 2
    text: PHPStan “super” quick master
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2021.10.02
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人
  p3: []
  p4:
  - kind: heading
    level: 1
    text: さて
  p5:
  - kind: para
    text: PHPerKaigiのチケットを買うとパンフレットがもらえる
  p6: []
  p7:
  - kind: para
    text: PHPStan=Static Analyzer
  p8:
  - kind: para
    text: 実行しなくてもバグの可能性を検知できる
  p9:
  - kind: para
    text: 全8ページでPHPStanの基礎を押えられる
  p10:
  - kind: para
    text: 実務で最低限使うために知っておきたいことを詰め込んだ… はず
  p11:
  - kind: para
    text: PHP本来の型のコンセプトからPHPDocによる拡張までを網羅
  p12:
  - kind: para
    text: 僕と契約してPHPStanを完全にマスターしてよ
  p13:
  - kind: para
    text: という話をしたいのではない
  p14:
  - kind: para
    text: PHPStanは完全無料なのでいますぐ入れよう
  p15:
  - kind: para
    text: これからプロになりたい人に本当に伝えたいPHPDocの書きかた
  p16:
  - kind: para
    text: その1配列は使い分ける
  p17:
  - kind: para
    text: 世の中にはいろんな配列がある
  p18:
  - kind: heading
    level: 1
    text: '[1, 2, 3]'
  p19:
  - kind: para
    text: '[''name'' => ''Miku'',''age'' => 14,]'
  p20:
  - kind: para
    text: '[''Miku'', ''Rin'', ''Luka'',]'
  p21:
  - kind: para
    text: '[''main'' => ''Miku'',''sub'' => ''Rin'',''chorus'' => ''Luka'',]'
  p22:
  - kind: para
    text: 単なる型で書くと
  - kind: para
    text: array
  p23:
  - kind: para
    text: 'interface X{function a(): array;}'
  p24:
  - kind: para
    text: function (X $obj) {$a = $obj->a();};
  p25:
  - kind: para
    text: function (X $x) {$a = $x->a();$v = $a[0];};
  p26:
  - kind: para
    text: 配列から取り出した要素の型がわからないのは都合が悪い
  p27:
  - kind: para
    text: array<int>array<string>
  p28:
  - kind: para
    text: ちょっと前はint[] とか string[]とか書かれてた
  p29:
  - kind: heading
    level: 1
    text: PSR-5式の配列記法(ジェネリクス)
  - kind: para
    text: array<int,User>
  - kind: para
    text: array<string, User>
  - kind: list
    items:
    - 配列インデックスの型を指定できる
    - 以下の配列が区別できる
    - '[12 => new User(), 34 => new User()]'
    - '[''太郎'' => new User(), ''花子'' => new User()]'
    - '[new User(''太郎''), new User(''花子'')]'
  - kind: para
    text: list<User>
  p30:
  - kind: heading
    level: 1
    text: 配列には2通りある
  p31:
  - kind: para
    text: 同じような構造が繰り返す配列
  p32:
  - kind: para
    text: キーによって別の意味の値が入っている配列
  p33:
  - kind: para
    text: $a = ['name' => '初音ミク','age' => 16,];
  - kind: para
    text: '// array{name:string, age: int}'
  p34:
  - kind: para
    text: 'array{name: string,age: int}'
  p35:
  - kind: para
    text: '$a = [''初音ミク'', 16];// array{0: string, 1: int}'
  p36:
  - kind: para
    text: 繰り返すなら<>キーごとに違うなら{}
  p37:
  - kind: para
    text: その2型は入出力に宿る
  p38:
  - kind: para
    text: クエリパラメータから値をとりたい
  p39:
  - kind: para
    text: 'function getById(int $id): Article{//}'
  p40:
  - kind: para
    text: クエリパラメータからID値をとりたい
  p41:
  - kind: para
    text: 実際あぶない
  - kind: heading
    level: 1
    text: $id = $_GET['id'];
  - kind: heading
    level: 1
    text: $article = getById($id);
  p42:
  - kind: para
    text: // ?id=1$_GET['id'] === '1';
  p43:
  - kind: para
    text: // ?id=a$_GET['id'] === 'a';
  p44:
  - kind: para
    text: // ?id[]=a$_GET['id'] === ['a'];
  p45:
  - kind: para
    text: 危険ではないがよくはない
  - kind: heading
    level: 1
    text: $id = (int)$_GET['id'];
  p46:
  - kind: para
    text: 安全に
  - kind: para
    text: int|false
  - kind: para
    text: $id = filter_var($_GET['id'] ?? '',FILTER_VALIDATE_INT);
  p47:
  - kind: para
    text: その3むやみに@var書かない
  p48:
  - kind: para
    text: 初心者殺しなことに@varには複数の用法
  p49:
  - kind: para
    text: '@varはプロパティに付けて書くもの'
  p50:
  - kind: para
    text: class Book{/** @var string */public $name;}
  p51:
  - kind: para
    text: class Book{
  - kind: para
    text: public string $name;}
  p52:
  - kind: para
    text: class Book{/** @var list<Author> */public $authors;}
  p53:
  - kind: para
    text: class Book{
  - kind: para
    text: public list<Author> $authors;}
  p54:
  - kind: para
    text: class Book{/** @var list<Author> */public array $authors;}
  p55:
  - kind: para
    text: '@varはconstには基本的に付けない'
  p56:
  - kind: para
    text: class Book{/** @var list<int> */const IDS = [1, 2, 3];}
  p57:
  - kind: para
    text: できればつけない方がいい
  - kind: para
    text: class Book{/** @var list<int> */const IDS = [1, 2, 3];}
  p58:
  - kind: para
    text: '@varをつけない場合'
  - kind: heading
    level: 1
    text: Book::IDS[0] // => 1
  - kind: heading
    level: 1
    text: Book::IDS[1] // => 2
  - kind: heading
    level: 1
    text: Book::IDS[2] // => 3
  p59:
  - kind: para
    text: '@varを付けると弱くなる'
  - kind: heading
    level: 1
    text: Book::IDS[0] // => int
  - kind: heading
    level: 1
    text: Book::IDS[1] // => int
  - kind: heading
    level: 1
    text: Book::IDS[2] // => int
  p60:
  - kind: para
    text: ローカル変数に@varを書く
  p61:
  - kind: para
    text: できれば書かないでくれ！！
  p62:
  - kind: para
    text: むやみに@varを書かないテク
  p63:
  - kind: para
    text: そのうちどこかにちゃんと書きます…
size:
  max_width: 1920
  max_height: 1080
