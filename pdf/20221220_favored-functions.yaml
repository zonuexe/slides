    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
  p3:
  - kind: heading
    level: 1
    text: さて
  p4: []
  p5: []
  p6:
  - kind: para
    text: Zend Engineってなあに
  p7: []
  p8:
  - kind: heading
    level: 1
    text: 仮想機械？
  p9: []
  p10: []
  p11:
  - kind: heading
    level: 1
    text: I am CPU.
  p12:
  - kind: heading
    level: 1
    text: つまり？
  p13:
  - kind: para
    text: 自分のことをCPUだと思い込んだ象
  p14:
  - kind: heading
    level: 1
    text: CPUの言葉でしゃべれ
  p15:
  - kind: heading
    level: 1
    text: Zend Engine
  - kind: para
    text: オペコード
  - kind: heading
    level: 1
    text: opcode
  p16:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: echo 1;
  - kind: para
    text: ECHO 1
  p17:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: echo 'foo';
  - kind: para
    text: ECHO 'foo'
  p18:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: print 'foo';
  - kind: para
    text: ECHO 'foo'
  p19:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: echo 1 + 2;
  - kind: para
    text: ECHO 3
  p20:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php$a = 1;echo $a + 2;
  - kind: para
    text: ASSIGN !0, 1 ADD ~2 !0, 2 ECHO ~2
  p21:
  - kind: para
    text: opcodeでおｋ
  - kind: para
    text: <?php echo "foo";
  - kind: para
    text: ECHO 'foo'
  p22:
  - kind: para
    text: なんでこんなことするの
  p23:
  - kind: para
    text: PHP高度な構文解析が必要な高級なシンタックス
  p24:
  - kind: para
    text: opcode構文解析不要なシンプルな命令セット
  p25:
  - kind: para
    text: 分けて開発することで最適化しやすくなる
  p26:
  - kind: para
    text: これを極めればパフォーマンス改善に役立つのか？
  p27: []
  p28:
  - kind: heading
    level: 1
    text: ここまでが前振り
  p29:
  - kind: heading
    level: 1
    text: 関数呼び出し
  - kind: para
    text: <?php
  - kind: para
    text: var_dump("foo");
  - kind: para
    text: INIT_FCALL 'var_dump'SEND_VAL 'foo'DO_ICALL
  p30:
  - kind: para
    text: 関数呼び出しは関数呼び出しに
  p31:
  - kind: heading
    level: 1
    text: なるとは限らない
  p32:
  - kind: para
    text: ！？
  - kind: heading
    level: 1
    text: 関数呼び出し
  - kind: para
    text: <?php
  - kind: para
    text: echo is_int('foo');
  - kind: para
    text: TYPE_CHECK 16 ~0 'foo'ECHO ~0
  p33:
  - kind: para
    text: ！？
  - kind: heading
    level: 1
    text: 関数呼び出し
  - kind: para
    text: <?php
  - kind: para
    text: ECHO 3
  - kind: para
    text: echo strlen('foo');
  p34:
  - kind: heading
    level: 1
    text: まとめ
  p35:
  - kind: para
    text: 『えこひいき』とは何だったのか
  - kind: list
    items:
    - PHPの処理系の心臓部は“Zend Engine”と呼ばれる仮想機械
    - 実行時にOPCode(Zend Engineのマシン語)にコンパイルする
    - 現代的なスクリプト言語はほとんど同じような構造になっている
    - PHPコードはOPCodeにコンパイルされるが一対一で変換されず、
  - kind: para
    text: 一部の関数呼び出しは特別な最適化が施される
  - kind: list
    items:
    - 一般的なアプリケーションではあまりパフォーマンスに寄与しないかも
