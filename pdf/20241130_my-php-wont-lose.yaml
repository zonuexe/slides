text:
  p1:
  - kind: heading
    level: 1
    text: 俺のPHPが合戦で
  - kind: heading
    level: 1
    text: 負けるわけがない
  - kind: heading
    level: 2
    text: There's No Way My PHP Could Lose in a Battle
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2024-11-30'
  - kind: para
    text: ￼1
  - kind: para
    text: 紅白ぺぱ合戦
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3: []
  p4:
  - kind: heading
    level: 1
    text: ぺとぱで戦えと言われた……
  p5:
  - kind: heading
    level: 1
    text: Perlは魂の故郷
  p6:
  - kind: para
    text: tadsanは動的言語が大好き
  p7:
  - kind: para
    text: なぜtadsanはPHPを書いているのか
  p8:
  - kind: para
    text: YAPCで就職したから
  - kind: para
    text: (本当)
  p9:
  - kind: heading
    level: 1
    text: こないだもこういう話をした
  p10:
  - kind: para
    text: 僕がPHP界隈で偉そうに話してるネタはYAPCとか
  - kind: para
    text: ビルコンの二番煎じだ！
  - kind: para
    text: (本当)
  p11:
  - kind: heading
    level: 1
    text: 大切なことはYAPCで教わった
  p12:
  - kind: para
    text: tadsanとPHPは
  - kind: para
    text: ビジネスの関係
  p13:
  - kind: heading
    level: 1
    text: プロフィールにも書いてる
  p14:
  - kind: para
    text: PHPについてのパブリックイメージ
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  p15:
  - kind: para
    text: PHPについての認識は概ね間違い
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  p16:
  - kind: heading
    level: 1
    text: そんなわけで
  p17:
  - kind: para
    text: お前をPHPerに
  - kind: para
    text: してやろうか
  p18:
  - kind: heading
    level: 1
    text: PHPとPerlの関係
  p19:
  - kind: para
    text: 変数に$があって
  - kind: para
    text: Perlっぽくて
  p20:
  - kind: para
    text: C言語っぽい
  - kind: para
    text: 関数と-> があって
  p21:
  - kind: para
    text: 雰囲気Javaっぽいオブジェクト指向で
  p22:
  - kind: heading
    level: 1
    text: PHPは見る人の心を映す
  p23:
  - kind: para
    text: Perlが捨てた
  - kind: para
    text: CGIの末裔
  p24:
  - kind: heading
    level: 1
    text: PHPは過去と未来を繋ぐ言語
  - kind: list
    items:
    - PHPの仕様はCGIの時代から地続き
    - PerlやRubyはApache mod時代やPost WSGI時代に断絶がある
    - PHPはpreforkなサーバ上でもCGI互換のシェアードナッシング
  - kind: para
    text: (すべての状態が隔離され、リクエストごとに初期化される)
  - kind: list
    items:
    - 汎用プログラミング言語の能力を持ちながら根幹がテンプレートエンジンに
  - kind: para
    text: あるので、小規模からある程度大規模なアプリケーションにもフィットする
  p25:
  - kind: para
    text: そういうことは結構どうでもいい
  p26:
  - kind: para
    text: PHPはどこでも65点がとれる言語
  - kind: list
    items:
    - '「現代におけるプロダクト開発とPHPを選定するワケ #phpkansai」'
    - By @potato4d (PHPカンファレンス関西2017)
    - 小難しいことを考えずに簡単にWebアプリを書ける(HTML+α)の言語
    - なんだかんだいってWEB+DB連携がさくっとできる言語ランタイムとして
  - kind: para
    text: の存在感は健在
  - kind: list
    items:
    - 求められているのは素晴らしい言語ではなく簡単に使える言語
  p27:
  - kind: para
    text: Perl以上に雑に使える
  - kind: para
    text: 初心者向けWeb言語
  p28:
  - kind: heading
    level: 1
    text: それでいいのか？
  p29:
  - kind: heading
    level: 1
    text: 俺のPHPがこんなに
  - kind: heading
    level: 1
    text: 静的なわけがない
  - kind: heading
    level: 2
    text: There's No Way My PHP is so static
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2024-11-30'
  - kind: para
    text: 紅白ぺぱ合戦
  p30:
  - kind: heading
    level: 1
    text: PHPは静的型付き言語
  p31:
  - kind: heading
    level: 1
    text: Statically typed?
  p32:
  - kind: para
    text: int n = 1;int m = n + 2;printf("%d\n");
  p33:
  - kind: para
    text: こんな当たり前の型をちんたら書いてられないと思った人たちが
  - kind: para
    text: 作った言語がPerl(という認識)
  - kind: heading
    level: 1
    text: int n = 1;
  - kind: heading
    level: 1
    text: int m = n + 2;
  - kind: heading
    level: 1
    text: printf("%d\n");
  p34:
  - kind: heading
    level: 1
    text: 時代は型推論
  p35: []
  p36:
  - kind: para
    text: 型なんて人間が書かなくても
  - kind: para
    text: コードを解析すれば一意に定まるじゃん、ワロス
  p37:
  - kind: para
    text: PHPでも型宣言？とかできますけど…
  p38:
  - kind: para
    text: /*** @param int $a* @param int $b* @return int|float*/function add($a, $b)
      {return $a + $b;}
  p39:
  - kind: para
    text: DocCommentとかいう
  - kind: para
    text: 机上の空論
  - kind: para
    text: /*** @param int $a* @param int $b* @return int|float*/function add($a, $b)
      {return $a + $b;}
  p40:
  - kind: para
    text: DocCommentとかいう
  - kind: para
    text: 机上の空論
  - kind: para
    text: コーディング時のヒントとして役に立つ…
  - kind: para
    text: かもしれない
  - kind: para
    text: /*** @param int $a* @param int $b* @return int|float*/function add($a, $b)
      {return $a + $b;}
  p41:
  - kind: para
    text: 'function add(int $a, int $b): int|float{return $a + $b;}'
  p42:
  - kind: para
    text: intしか渡されないことは
  - kind: para
    text: 実行時に保証される
  - kind: para
    text: 'function add(int $a, int $b): int|float{return $a + $b;}'
  p43:
  - kind: para
    text: intしか渡されないことは
  - kind: para
    text: 実行時に保証される
  - kind: heading
    level: 1
    text: 'function add(int $a, int $b): int|float'
  - kind: heading
    level: 1
    text: '{'
  - kind: heading
    level: 1
    text: return $a + $b;
  - kind: heading
    level: 1
    text: '}'
  - kind: para
    text: 型宣言に反する値が返されたら実行時エラー
  p44:
  - kind: para
    text: そうだけどそれだけじゃないんだ
  p45: []
  p46: []
  p47: []
  p48:
  - kind: para
    text: 可能な限り定数型が保存される！
  - kind: para
    text: (TSでは1, number)
  p49: []
  p50: []
  p51:
  - kind: para
    text: 可能な限り定数型が保存される！
  - kind: para
    text: (TSではstring)
  p52: []
  p53: []
  p54:
  - kind: para
    text: 分岐などのフローも解析して
  - kind: para
    text: 型を絞り込んでくれる！！
  p55:
  - kind: para
    text: その辺の静的言語とは別の方向に尖りつつある
  - kind: para
    text: PHPにご期待ください
