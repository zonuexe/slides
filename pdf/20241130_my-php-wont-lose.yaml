text:
  p1:
  - node: p
    children:
    - node: text
      content: 俺のPHPが合戦で 負けるわけがない
  - node: p
    children:
    - node: text
      content: There's No Way My PHP Could Lose in a Battle
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2024-11-30 '
  - node: p
    children:
    - node: bold
      content: 紅白ぺぱ合戦
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3: []
  p4:
  - node: p
    children:
    - node: text
      content: ぺとぱで戦えと言われた……
  p5:
  - node: p
    children:
    - node: text
      content: Perlは魂の故郷
  p6:
  - node: p
    children:
    - node: text
      content: 'tadsanは '
    - node: br
    - node: text
      content: 動的言語が大好き
  p7:
  - node: p
    children:
    - node: text
      content: 'なぜtadsanは '
    - node: br
    - node: text
      content: PHPを書いているのか
  p8:
  - node: p
    children:
    - node: text
      content: 'YAPCで就職したから '
    - node: br
    - node: text
      content: (本当)
  p9:
  - node: p
    children:
    - node: text
      content: こないだもこういう話をした
  p10:
  - node: p
    children:
    - node: text
      content: 僕がPHP界隈で偉そうに 話してるネタはYAPCとか
  - node: p
    children:
    - node: text
      content: ビルコンの二番煎じだ！
    - node: br
    - node: text
      content: (本当)
  p11:
  - node: p
    children:
    - node: text
      content: 大切なことはYAPCで教わった
  p12:
  - node: p
    children:
    - node: text
      content: 'tadsanとPHPは '
    - node: br
    - node: text
      content: ビジネスの関係
  p13:
  - node: p
    children:
    - node: text
      content: プロフィールにも書いてる
  p14:
  - node: p
    children:
    - node: text
      content: PHPについてのパブリックイメージ
  - node: p
    children:
    - node: text
      content: '脆弱性 ゆるふわ 弱い型 動的         '
    - node: br
    - node: text
      content: クソザコ 型なし 意味不明 弱い 自動変換 貧弱 Perlっぽい 適当
  p15:
  - node: p
    children:
    - node: text
      content: PHPについての認識は概ね間違い
  - node: p
    children:
    - node: text
      content: '脆弱性 ゆるふわ 弱い型 動的         '
    - node: br
    - node: text
      content: クソザコ 型なし 意味不明 弱い 自動変換 貧弱 Perlっぽい 適当
  p16:
  - node: p
    children:
    - node: text
      content: そんなわけで
  p17:
  - node: p
    children:
    - node: text
      content: 'お前をPHPerに '
    - node: br
    - node: text
      content: してやろうか
  p18:
  - node: p
    children:
    - node: text
      content: PHPとPerlの関係
  p19:
  - node: p
    children:
    - node: text
      content: '変数に$があって '
    - node: br
    - node: text
      content: Perlっぽくて
  p20:
  - node: p
    children:
    - node: text
      content: 'C言語っぽい '
    - node: br
    - node: text
      content: '関数と '
    - node: br
    - node: text
      content: -> があって
  p21:
  - node: p
    children:
    - node: text
      content: 雰囲気Javaっぽい オブジェクト指向で
  p22:
  - node: p
    children:
    - node: text
      content: PHPは見る人の心を映す
  p23:
  - node: p
    children:
    - node: text
      content: 'Perlが捨てた '
    - node: br
    - node: text
      content: CGIの末裔
  p24:
  - node: p
    children:
    - node: text
      content: PHPは過去と未来を繋ぐ言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPの仕様はCGIの時代から地続き
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PerlやRubyはApache mod時代やPost WSGI時代に断絶がある
        - node: li
          children:
          - node: text
            content: PHPはpreforkなサーバ上でもCGI互換のシェアードナッシング
          - node: br
          - node: text
            content: '(すべての状態が隔離され、リクエストごとに初期化される) '
    - node: li
      children:
      - node: text
        content: 汎用プログラミング言語の能力を持ちながら根幹がテンプレートエンジンに
      - node: br
      - node: text
        content: あるので、小規模からある程度大規模なアプリケーションにもフィットする
  p25:
  - node: p
    children:
    - node: text
      content: 'そういうことは '
    - node: br
    - node: text
      content: 結構どうでもいい
  p26:
  - node: p
    children:
    - node: text
      content: PHPはどこでも65点がとれる言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: '「現代におけるプロダクト開発とPHPを選定するワケ #phpkansai」'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: By @potato4d (PHPカンファレンス関西2017)
    - node: li
      children:
      - node: text
        content: 小難しいことを考えずに簡単にWebアプリを書ける(HTML+α)の言語
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: なんだかんだいってWEB+DB連携がさくっとできる言語ランタイムとして
          - node: br
          - node: text
            content: 'の存在感は健在 '
    - node: li
      children:
      - node: text
        content: 求められているのは素晴らしい言語ではなく簡単に使える言語
  p27:
  - node: p
    children:
    - node: text
      content: 'Perl以上に雑に使える '
    - node: br
    - node: text
      content: 初心者向けWeb言語
  p28:
  - node: p
    children:
    - node: text
      content: それでいいのか？
  p29:
  - node: p
    children:
    - node: text
      content: '俺のPHPがこんなに '
    - node: br
    - node: text
      content: 静的なわけがない
  - node: p
    children:
    - node: text
      content: There's No Way My PHP is so static
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2024-11-30 '
  - node: p
    children:
    - node: bold
      content: 紅白ぺぱ合戦
  p30:
  - node: p
    children:
    - node: text
      content: PHPは静的型付き言語
  p31:
  - node: p
    children:
    - node: text
      content: Statically typed?
  p32:
  - node: p
    children:
    - node: text
      content: 'int n = 1; '
    - node: br
    - node: text
      content: int m = n + 2; printf("%d n");
  - node: p
    children:
    - node: text
      content: \
  p33:
  - node: p
    children:
    - node: text
      content: 'こんな当たり前の型をちんたら '
    - node: br
    - node: text
      content: '書いてられないと思った人たちが '
    - node: br
    - node: text
      content: 作った言語がPerl(という認識)
  - node: p
    children:
    - node: text
      content: 'int n = 1; '
    - node: br
    - node: text
      content: int m = n + 2; printf("%d n");
  - node: p
    children:
    - node: text
      content: \
  p34:
  - node: p
    children:
    - node: text
      content: 時代は型推論
  p35: []
  p36:
  - node: p
    children:
    - node: text
      content: '型なんて人間が書かなくても '
    - node: br
    - node: text
      content: 'コードを解析すれば '
    - node: br
    - node: text
      content: 一意に定まるじゃん、ワロス
  p37:
  - node: p
    children:
    - node: text
      content: PHPでも型宣言？ とかできますけど…
  p38:
  - node: p
    children:
    - node: text
      content: '/** '
    - node: br
    - node: text
      content: ' * @param int $a  * @param int $b '
    - node: br
    - node: text
      content: ' * @return int|fioat '
    - node: br
    - node: text
      content: ' */ '
    - node: br
    - node: text
      content: 'function add($a, $b) { '
    - node: br
    - node: text
      content: '    return $a + $b; '
    - node: br
    - node: text
      content: '}'
  p39:
  - node: p
    children:
    - node: text
      content: 'DocCommentとかいう '
  - node: p
    children:
    - node: text
      content: '/** '
  - node: p
    children:
    - node: text
      content: 机上の空論
  - node: p
    children:
    - node: text
      content: ' * @param int $a  * @param int $b '
    - node: br
    - node: text
      content: ' * @return int|fioat '
    - node: br
    - node: text
      content: ' */ '
    - node: br
    - node: text
      content: 'function add($a, $b) { '
    - node: br
    - node: text
      content: '    return $a + $b; '
    - node: br
    - node: text
      content: '}'
  p40:
  - node: p
    children:
    - node: text
      content: 'DocCommentとかいう '
  - node: p
    children:
    - node: text
      content: '/** '
  - node: p
    children:
    - node: text
      content: 机上の空論
  - node: p
    children:
    - node: text
      content: ' * @param int $a  * @param int $b '
    - node: br
    - node: text
      content: ' * @return int|fioat '
    - node: br
    - node: text
      content: ' */ '
    - node: br
    - node: text
      content: 'function add($a, $b) { '
  - node: p
    children:
    - node: text
      content: 'コーディング時の '
    - node: br
    - node: text
      content: 'ヒントとして役に立つ… '
  - node: p
    children:
    - node: text
      content: '    return $a + $b; '
  - node: p
    children:
    - node: text
      content: かもしれない
  - node: p
    children:
    - node: text
      content: '}'
  p41:
  - node: p
    children:
    - node: text
      content: 'function add(int $a, int $b): int|fioat '
    - node: br
    - node: text
      content: '{ '
    - node: br
    - node: text
      content: '    return $a + $b; '
    - node: br
    - node: text
      content: '}'
  p42:
  - node: p
    children:
    - node: text
      content: 'intしか渡されないことは '
    - node: br
    - node: text
      content: 実行時に保証される
  - node: p
    children:
    - node: text
      content: 'function add(int $a, int $b): int|fioat '
    - node: br
    - node: text
      content: '{ '
    - node: br
    - node: text
      content: '    return $a + $b; '
    - node: br
    - node: text
      content: '}'
  p43:
  - node: p
    children:
    - node: text
      content: 'intしか渡されないことは '
    - node: br
    - node: text
      content: 実行時に保証される
  - node: p
    children:
    - node: text
      content: 'function add(int $a, int $b): int|fioat '
    - node: br
    - node: text
      content: '{ '
    - node: br
    - node: text
      content: '    return $a + $b; '
    - node: br
    - node: text
      content: '}'
  - node: p
    children:
    - node: text
      content: '型宣言に反する値が '
    - node: br
    - node: text
      content: 返されたら実行時エラー
  p44:
  - node: p
    children:
    - node: text
      content: 'そうだけど '
    - node: br
    - node: text
      content: それだけじゃないんだ
  p45: []
  p46: []
  p47: []
  p48:
  - node: p
    children:
    - node: text
      content: '可能な限り定数型が保存される！ '
    - node: br
    - node: text
      content: (TSでは1, number)
  p49: []
  p50: []
  p51:
  - node: p
    children:
    - node: text
      content: '可能な限り定数型が保存される！ '
    - node: br
    - node: text
      content: (TSではstring)
  p52: []
  p53: []
  p54:
  - node: p
    children:
    - node: text
      content: '分岐などのフローも解析して '
    - node: br
    - node: text
      content: 型を絞り込んでくれる！！
  p55:
  - node: p
    children:
    - node: text
      content: 'その辺の静的言語とは '
    - node: br
    - node: text
      content: 別の方向に尖りつつある PHPにご期待ください
