text:
  p1:
  - kind: heading
    level: 1
    text: 「ふつうのPHP」が
  - kind: heading
    level: 1
    text: pixivになるまで前史
  - kind: para
    text: pixiv.inc
  - kind: para
    text: '@tadsan'
  - kind: para
    text: 2020.02.17 PIXIV TECH FES.
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - 2012年11月にアルバイトとして入社
    - 2013年3月に正社員として入社、API開発
    - 2013年10月からpixiv本体の開発に携わる
    - 2014年グロースチーム
    - 2015年フィーチャーフォン向けpixiv小説開発
    - 2016年メンテナンスチーム
    - 2019年から開発支援チーム
  p3:
  - kind: heading
    level: 1
    text: 何をしてきたのか
  - kind: list
    items:
    - 公開APIおよびフレームワークのメンテ
    - 2013年pixivのアカウント基盤統合
    - pixivの翻訳入稿フロー実装
    - 2015年オートロード化、ドメイン統合設計
    - 2018年PHPStan CIの本番導入
    - 2019年ピクシブ百科事典メンテ引き継ぎ
  p4:
  - kind: para
    text: 2012年入社
  p5:
  - kind: para
    text: PHPは入社してから
  - kind: para
    text: （それ以前はRuby）
  p6:
  - kind: para
    text: 今回のお題
  p7:
  - kind: para
    text: 「ふつうのPHP」が
  - kind: para
    text: pixivになるまで前史
  p8:
  - kind: para
    text: 前史？
  p9: []
  p10:
  - kind: para
    text: PHPカンファレンス
  - kind: para
    text: 関西2018
  p11: []
  p12: []
  p13:
  - kind: para
    text: このときは2012年
  - kind: para
    text: 以後に改善したことを
  - kind: para
    text: 主に話しました
  p14:
  - kind: para
    text: 今回は私の入社時
  - kind: para
    text: （2012年以前）に既に
  - kind: para
    text: あったものについて
  - kind: para
    text: 紹介していきます
  p15:
  - kind: para
    text: 前提を
  - kind: para
    text: 揃えましょう
  p16:
  - kind: para
    text: ふつうのPHP？
  p17:
  - kind: para
    text: URLに.phpが
  - kind: para
    text: 入っている
  p18:
  - kind: para
    text: http://www.pixiv.net
  - kind: para
    text: /member.php?id=105589
  p19:
  - kind: para
    text: http://www.pixiv.net
  - kind: para
    text: /member.php?id=105589
  p20:
  - kind: para
    text: https://www.pixiv.net
  - kind: para
    text: /users/105589
  p21:
  - kind: para
    text: URLとスクリプト
  - kind: para
    text: ファイルが1:1で
  - kind: para
    text: 対応する時代だった
  p22:
  - kind: para
    text: （当時の世間では）
  - kind: para
    text: Webアプリ ≒ CGI
  - kind: para
    text: ≒ Perl or PHP
  p23:
  - kind: para
    text: pixivリリースの
  - kind: para
    text: 2007年は
  - kind: para
    text: まだそういう時代
  p24:
  - kind: para
    text: 参考までにRails2.0
  - kind: para
    text: が出て日本で注目さ
  - kind: para
    text: れだしたのが2008年
  p25:
  - kind: para
    text: Ruby関係者に怒られないよ
  - kind: para
    text: う言及するとRails以前にも
  - kind: para
    text: tDiaryのようなRuby CGIな
  - kind: para
    text: Webアプリもあったし現在
  - kind: para
    text: もRackでばっちり動きます
  p26:
  - kind: para
    text: 重要なこと：
  - kind: para
    text: ファイル=URLのCGI的な
  - kind: para
    text: 構造でFWに依存してない
  - kind: para
    text: （これは2015年まで続く）
  p27:
  - kind: para
    text: というわけで
  - kind: para
    text: 話を本筋に戻して
  p28:
  - kind: para
    text: 温故知新
  p29:
  - kind: para
    text: ふつうのPHP？
  p30:
  - kind: para
    text: LAMPスタック
  p31:
  - kind: para
    text: Linux, Apache,
  - kind: para
    text: MySQL, P言語
  p32:
  - kind: heading
    level: 1
    text: UTF-8
  - kind: para
    text: （リリース当時はUTF-8
  - kind: para
    text: じゃなかったらしいけど
  - kind: para
    text: 2007年中には移行完了）
  p33:
  - kind: heading
    level: 1
    text: Git
  - kind: para
    text: (2012年は普及時期だけど
  - kind: para
    text: 会社としてSVNから完全
  - kind: para
    text: 移行したのは割と早め)
  p34:
  - kind: para
    text: あとは制限時間で
  - kind: para
    text: 打ち切られるまで
  - kind: para
    text: 個別要素を語っていくぞ
  p35:
  - kind: para
    text: pixiv開発メンバーでも何
  - kind: para
    text: が一般的で何がpixiv独自
  - kind: para
    text: 要素なのか把握できてる
  - kind: para
    text: ひとは多くないと思う
  p36:
  - kind: heading
    level: 1
    text: PDO
  - kind: para
    text: (PHP Database Object)
  p37:
  - kind: para
    text: 入社時には僅かなmysql関数
  - kind: para
    text: も残ってたけど、ほぼPDO
  - kind: para
    text: 化が済んでた（時代的には
  - kind: para
    text: PEAR::DBやMDB2でもおかしくない）
  p38:
  - kind: para
    text: SQLのクエリ末尾にスタッ
  - kind: para
    text: クトレースを付加すること
  - kind: para
    text: でスロークエリの発生箇所
  - kind: para
    text: を容易に特定できる
  p39:
  - kind: para
    text: それもPDOを生で使わず
  - kind: para
    text: にラッパークラスを設けて
  - kind: para
    text: 使ってたのが本当にすごい
  p40:
  - kind: para
    text: 基本は_call()をつかった
  - kind: para
    text: Proxyクラス
  - kind: para
    text: +べんりメソッドの追加
  p41:
  - kind: para
    text: 系統とmaster/slaveごと
  - kind: para
    text: にPDOのシングルトンを
  - kind: para
    text: 管理するクラス
  p42:
  - kind: para
    text: slaveに対して書き込み
  - kind: para
    text: クエリが発行されることを
  - kind: para
    text: 事前に防ぐ構造を提供
  p43:
  - kind: heading
    level: 1
    text: Smarty
  - kind: para
    text: (HTMLテンプレートエンジン)
  p44:
  - kind: para
    text: SmartyはPHPの定番テ
  - kind: para
    text: ンプレートエンジンだが、
  - kind: para
    text: それ自体はXSS耐性がなく
  - kind: para
    text: 全ての値を明示的にエス
  - kind: para
    text: ケープしないといけない
  p45:
  - kind: para
    text: pixivではSmarty_
  - kind: para
    text: Compilerを拡張して
  - kind: para
    text: attributeで明示的にエス
  - kind: para
    text: ケープしない出力を拒否
  p46:
  - kind: para
    text: SmartyはPHPスクリプトとして
  - kind: para
    text: 変換されるものが実行され(コン
  - kind: para
    text: パイルキャッシュ)、チェッカー
  - kind: para
    text: が走るのはコンパイル時のみで
  - kind: para
    text: 実行時コストは掛からない
  p47:
  - kind: para
    text: フレームワーク
  p48:
  - kind: para
    text: pixiv本体はフレームワー
  - kind: para
    text: クに依存していない
  p49:
  - kind: para
    text: が、部分的に薄いフレーム
  - kind: para
    text: ワークのような機能を持つ層
  - kind: para
    text: は複数あった
  p50:
  - kind: para
    text: 独自フレームワーク
  - kind: para
    text: そのものも複数あった
  p51: []
  p52:
  - kind: para
    text: (いわゆる)RESTful APIの
  - kind: para
    text: pixiv内における初期事例
  - kind: para
    text: (PHPカンファレンス2013)
  p53:
  - kind: para
    text: 身近に24ファイル程度の
  - kind: para
    text: 読めるフレームワークが
  - kind: para
    text: あったのはPHPの理解に
  - kind: para
    text: 非常に大きく役立った
  p54:
  - kind: para
    text: タグジャンプできない
  - kind: para
    text: (=静的解析しにくい)制約は
  - kind: para
    text: 反面教師として現在の改善に
  - kind: para
    text: 活かされている
  p55:
  - kind: para
    text: 総括
  p56:
  - kind: para
    text: 今回は2012年以前の
  - kind: para
    text: 前期pixivから現在も
  - kind: para
    text: 現役の実装を紹介した
  p57:
  - kind: para
    text: 前期pixivの内部実装
  - kind: para
    text: について情報が外に出
  - kind: para
    text: る機会は少なかった
  p58:
  - kind: para
    text: CGI時代の空気を色濃く
  - kind: para
    text: 残していたコードは
  - kind: para
    text: 2015年頃にフレームワーク
  - kind: para
    text: 的な構造に移植されている
  p59:
  - kind: para
    text: 良いアーキテクチャとは言
  - kind: para
    text: いがたいが、実装面として
  - kind: para
    text: ユニークなものは多くある
  p60:
  - kind: para
    text: 良い遺産だからと
  - kind: para
    text: 全肯定して残したい
  - kind: para
    text: わけではない
  p61:
  - kind: para
    text: 歴史から学んで
  - kind: para
    text: もっと良いもので
  - kind: para
    text: 置き換えていこう
  p62:
  - kind: heading
    level: 1
    text: 温故知新
  - kind: para
    text: ご静聴ありがとうございました
