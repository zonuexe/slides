text:
  p1:
  - kind: heading
    level: 1
    text: 「ふつうのPHP」が
  - kind: heading
    level: 1
    text: pixivになるまで前史
  - kind: para
    text: pixiv.inc@tadsan
  - kind: para
    text: 2020.02.17 PIXIV TECH FES.
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - 2012年11月にアルバイトとして入社
    - 2013年3月に正社員として入社、API開発
    - 2013年10月からpixiv本体の開発に携わる
    - 2014年グロースチーム
    - 2015年フィーチャーフォン向けpixiv小説開発
    - 2016年メンテナンスチーム
    - 2019年から開発支援チーム
  p3:
  - kind: heading
    level: 1
    text: 何をしてきたのか
  - kind: list
    items:
    - 公開APIおよびフレームワークのメンテ
    - 2013年pixivのアカウント基盤統合
    - pixivの翻訳入稿フロー実装
    - 2015年オートロード化、ドメイン統合設計
    - 2018年PHPStan CIの本番導入
    - 2019年ピクシブ百科事典メンテ引き継ぎ
  p4:
  - kind: para
    text: 2012年入社
  p5:
  - kind: para
    text: PHPは入社してから（それ以前はRuby）
  p6:
  - kind: para
    text: 今回のお題
  p7:
  - kind: para
    text: 「ふつうのPHP」がpixivになるまで前史
  p8:
  - kind: para
    text: 前史？
  p9: []
  p10:
  - kind: para
    text: PHPカンファレンス関西2018
  p11: []
  p12: []
  p13:
  - kind: para
    text: このときは2012年以後に改善したことを主に話しました
  p14:
  - kind: para
    text: 今回は私の入社時（2012年以前）に既にあったものについて紹介していきます
  p15:
  - kind: para
    text: 前提を揃えましょう
  p16:
  - kind: para
    text: ふつうのPHP？
  p17:
  - kind: para
    text: URLに.phpが入っている
  p18:
  - kind: para
    text: http://www.pixiv.net/member.php?id=105589
  p19:
  - kind: para
    text: http://www.pixiv.net/member.php?id=105589
  p20:
  - kind: para
    text: https://www.pixiv.net/users/105589
  p21:
  - kind: para
    text: URLとスクリプトファイルが1:1で対応する時代だった
  p22:
  - kind: para
    text: （当時の世間では）Webアプリ ≒ CGI≒ Perl or PHP
  p23:
  - kind: para
    text: pixivリリースの2007年はまだそういう時代
  p24:
  - kind: para
    text: 参考までにRails2.0が出て日本で注目されだしたのが2008年
  p25:
  - kind: para
    text: Ruby関係者に怒られないよう言及するとRails以前にもtDiaryのようなRuby CGIなWebアプリもあったし現在もRackでばっちり動きます
  p26:
  - kind: para
    text: 重要なこと：ファイル=URLのCGI的な構造でFWに依存してない（これは2015年まで続く）
  p27:
  - kind: para
    text: というわけで話を本筋に戻して
  p28:
  - kind: para
    text: 温故知新
  p29:
  - kind: para
    text: ふつうのPHP？
  p30:
  - kind: para
    text: LAMPスタック
  p31:
  - kind: para
    text: Linux, Apache,MySQL, P言語
  p32:
  - kind: heading
    level: 1
    text: UTF-8
  - kind: para
    text: （リリース当時はUTF-8じゃなかったらしいけど2007年中には移行完了）
  p33:
  - kind: heading
    level: 1
    text: Git
  - kind: para
    text: (2012年は普及時期だけど会社としてSVNから完全移行したのは割と早め)
  p34:
  - kind: para
    text: あとは制限時間で打ち切られるまで個別要素を語っていくぞ
  p35:
  - kind: para
    text: pixiv開発メンバーでも何が一般的で何がpixiv独自要素なのか把握できてるひとは多くないと思う
  p36:
  - kind: heading
    level: 1
    text: PDO
  - kind: para
    text: (PHP Database Object)
  p37:
  - kind: para
    text: 入社時には僅かなmysql関数も残ってたけど、ほぼPDO化が済んでた（時代的にはPEAR::DBやMDB2でもおかしくない）
  p38:
  - kind: para
    text: SQLのクエリ末尾にスタックトレースを付加することでスロークエリの発生箇所を容易に特定できる
  p39:
  - kind: para
    text: それもPDOを生で使わずにラッパークラスを設けて使ってたのが本当にすごい
  p40:
  - kind: para
    text: 基本は_call()をつかった
  - kind: para
    text: Proxyクラス+べんりメソッドの追加
  p41:
  - kind: para
    text: 系統とmaster/slaveごとにPDOのシングルトンを管理するクラス
  p42:
  - kind: para
    text: slaveに対して書き込みクエリが発行されることを事前に防ぐ構造を提供
  p43:
  - kind: heading
    level: 1
    text: Smarty
  - kind: para
    text: (HTMLテンプレートエンジン)
  p44:
  - kind: para
    text: SmartyはPHPの定番テンプレートエンジンだが、それ自体はXSS耐性がなく全ての値を明示的にエスケープしないといけない
  p45:
  - kind: para
    text: pixivではSmarty_Compilerを拡張してattributeで明示的にエスケープしない出力を拒否
  p46:
  - kind: para
    text: SmartyはPHPスクリプトとして変換されるものが実行され(コンパイルキャッシュ)、チェッカーが走るのはコンパイル時のみで実行時コストは掛からない
  p47:
  - kind: para
    text: フレームワーク
  p48:
  - kind: para
    text: pixiv本体はフレームワークに依存していない
  p49:
  - kind: para
    text: が、部分的に薄いフレームワークのような機能を持つ層は複数あった
  p50:
  - kind: para
    text: 独自フレームワークそのものも複数あった
  p51: []
  p52:
  - kind: para
    text: (いわゆる)RESTful APIのpixiv内における初期事例(PHPカンファレンス2013)
  p53:
  - kind: para
    text: 身近に24ファイル程度の読めるフレームワークがあったのはPHPの理解に非常に大きく役立った
  p54:
  - kind: para
    text: タグジャンプできない(=静的解析しにくい)制約は反面教師として現在の改善に活かされている
  p55:
  - kind: para
    text: 総括
  p56:
  - kind: para
    text: 今回は2012年以前の前期pixivから現在も現役の実装を紹介した
  p57:
  - kind: para
    text: 前期pixivの内部実装について情報が外に出る機会は少なかった
  p58:
  - kind: para
    text: CGI時代の空気を色濃く残していたコードは2015年頃にフレームワーク的な構造に移植されている
  p59:
  - kind: para
    text: 良いアーキテクチャとは言いがたいが、実装面としてユニークなものは多くある
  p60:
  - kind: para
    text: 良い遺産だからと全肯定して残したいわけではない
  p61:
  - kind: para
    text: 歴史から学んでもっと良いもので置き換えていこう
  p62:
  - kind: heading
    level: 1
    text: 温故知新
  - kind: para
    text: ご静聴ありがとうございました
