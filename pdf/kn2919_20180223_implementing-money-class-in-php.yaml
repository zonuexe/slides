    text: PHPで雑に通貨クラスを実装してみた結果
  - kind: para
    text: 🤑
  - kind: para
    text: I implemented a Money class, and I'm sleepy.
  - kind: para
    text: 2018-02-23 ピクシブ社内勉強会
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社技術基盤チーム (pixiv.net)
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: 伏線
  p4: []
  p5:
  - kind: para
    text: 金
  p6:
  - kind: para
    text: 日本で流通する最低貨幣は一円硬貨
  p7:
  - kind: para
    text: USで流通する最低貨幣は一セント硬貨
  p8:
  - kind: para
    text: セントは1/100ドル$0.01と表記される
  p9:
  - kind: para
    text: コンピュータで扱える数
  p10:
  - kind: para
    text: PHPでは型が3つある
  p11:
  - kind: para
    text: 整数型 (int)
  - kind: para
    text: PHPの整数は signed int
  - kind: para
    text: ビット数はPHP_INT_SIZE最大値はPHP_INT_MAXで定義
  - kind: para
    text: 概念上、この式で最大値が得られる2 ** (PHP_INT_SIZE * 8 - 1) - 1
  p12:
  - kind: para
    text: 浮動小数点数型 (float)
  - kind: para
    text: PHPの整数はdouble
  - kind: para
    text: (IEEE 754 倍精度フォーマット)
  - kind: para
    text: 型名としては(real)の別名もあるが、別に実数ではない
  p13:
  - kind: para
    text: とても大事なこと
  p14:
  - kind: para
    text: PHP_INT_MAX 9223372036854775807
  p15:
  - kind: para
    text: PHP_INT_MAX + 1どうなる？
  p16:
  - kind: para
    text: var_dump(PHP_INT_MAX + 1);//=> float(9.2233720368548E+18)
  p17:
  - kind: para
    text: $bytes = PHP_INT_SIZE * 8;var_dump(2**($bytes-1)-1);//=> float(9.2233720368548E+18)
  p18:
  - kind: para
    text: 突然のfloat
  p19:
  - kind: para
    text: そうです
  p20:
  - kind: para
    text: PHPの演算子は整数演算でPHP_INT_MAXを超えるとfloatになります
  p21:
  - kind: para
    text: 😩
  p22:
  - kind: para
    text: もひとつ大事なこと
  p23:
  - kind: para
    text: 浮動小数点は「ぴったり」の数を表現できない
  p24: []
  p25:
  - kind: para
    text: https://ja.wikipedia.org/wiki/浮動小数点数#エラー（誤差）
  p26:
  - kind: para
    text: 浮動小数点数は概算で十分な計算に向く
  p27:
  - kind: para
    text: 誤差を許容できない用途には使ってはならない
  p28:
  - kind: para
    text: われわれが欲するのは誤差が生じずに小数点以下を表現できる数
  p29:
  - kind: para
    text: 颯爽と現れる
  p30:
  - kind: para
    text: BC Math 関数
  p31:
  - kind: para
    text: http://php.net/manual/ja/ref.bc.php
  p32:
  - kind: para
    text: http://php.net/manual/ja/function.bcadd.php
  p33:
  - kind: para
    text: 突然のstring
  p34:
  - kind: para
    text: 冷静になってほしい
  p35:
  - kind: para
    text: 文字列で入出力を表現すれば桁は落ちない
  p36:
  - kind: para
    text: $scaleオプションで任意の精度を指定できる
  p37:
  - kind: para
    text: 裸の文字列のまま取り回したくない…
  p38:
  - kind: para
    text: クラスを作ろう
