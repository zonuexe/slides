  - kind: para
    text: 実行時に無視される
  p105:
  - kind: para
    text: あ
  - kind: para
    text: と単純に名前空間との
  - kind: para
    text: 相性が悪くて
  - kind: para
    text: ､
  - kind: para
    text: IDEや
  - kind: para
    text: 静的解析を使ってないと
  - kind: para
    text: useし忘れて無意味な
  - kind: para
    text: おまじないとして残り…
  p106:
  - kind: para
    text: この問題はアノテー
  - kind: para
    text: ションベースAOPで
  - kind: para
    text: 結構深刻だと思うんで
  - kind: para
    text: すけど皆さんどうやっ
  - kind: para
    text: て解決してるんだろ
  p107:
  - kind: para
    text: 全部のタグ/アノテー
  - kind: para
    text: ションがアトリビュー
  - kind: para
    text: トに移行されるの？
  p108:
  - kind: para
    text: されない
  - kind: para
    text: と思う
  p109:
  - kind: heading
    level: 1
    text: いままでのタグ
