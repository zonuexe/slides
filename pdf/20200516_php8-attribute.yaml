text:
  p1:
  - kind: heading
    level: 1
    text: PHP8 <<Attribute>>
  - kind: para
    text: '2020-05-16 #phpkansai【オンライン】関西PHP勉強会'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer, Rubyist
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: 近況
  p6:
  - kind: para
    text: 月から氏んでた
  p7:
  - kind: para
    text: 最近はやや元気
  p8:
  - kind: para
    text: PHPカンファレンス関西にはPHP-Parserの話をしようと応募してました
  p9:
  - kind: para
    text: はじめに
  p10:
  - kind: para
    text: 今回紹介する内容によって今すぐ何かが変わることはあまりない
  p11:
  - kind: para
    text: 少なくともコードをPHP7系から8に移行できないと使えない
  p12:
  - kind: para
    text: これから一年くらいかけて対応するツールやフレームワークも徐々に出てくると思う
  p13:
  - kind: para
    text: PHP8時代に心の準備だけしておこう
  p14:
  - kind: para
    text: さて
  p15:
  - kind: para
    text: RFC
  p16:
  - kind: para
    text: PHPへの変更提案
  p17:
  - kind: para
    text: 全てのPHPへの変更はここで議決
  p18:
  - kind: para
    text: ここを観察すれば次のPHPがわかる
  p19:
  - kind: para
    text: ウォッチしてますか？
  p20: []
  p21:
  - kind: para
    text: '@PHPRFCBot'
  p22:
  - kind: para
    text: 今年12月にリリース予定のPHP8.0に向けてさまざまな機能が提案
  p23:
  - kind: para
    text: Feature freezeは7月だが既にPHP8向けにいろいろ決まってる
  p24:
  - kind: para
    text: さて
  p25: []
  p26:
  - kind: para
    text: RFCは受理されたが､実装はまだマージされてない
  p27:
  - kind: para
    text: 過去何度も提案されてきたが今回の仕様でようやく受理された
  p28:
  - kind: para
    text: そもそもこれは何だ
  p29: []
  p30:
  - kind: para
    text: このRFCはクラス・プロパティ・関数・メソッド・引数および定数の宣言に対する構文的メタデータの構造化された形式として「アトリビュート」を提案します。アトリビュートによって宣言に直接埋め込まれた構成ディレクティブを定義できます。
  p31: []
  p32:
  - kind: para
    text: 似たようなコンセプトは｢アノテーション｣としてJavaに､｢アトリビュート｣としてC#・C++・Rust・Hackに、そして｢デコレータ｣としてPython･JavaScriptにあります。
  p33:
  - kind: para
    text: attribute
  - kind: para
    text: の定訳とし
  - kind: para
    text: ては
  - kind: para
    text: ｢
  - kind: para
    text: 属性
  - kind: para
    text: ｣｡
  - kind: para
    text: 直接関係な
  - kind: para
    text: いが同じ用語としては
  - kind: para
    text: HTMLでも非常に重要
  - kind: para
    text: な概念。<a
  - kind: para
    text: href="..."
  - kind: para
    text: '>'
  p34:
  - kind: para
    text: これまでPHPは構造化されていない形式のメタデータとしてDoc-commentだけを提供しています。ただ、Doc-commentは単なる文字列であり、構造化情報を保持するための
      @ ベースの擬似言語がさまざまなPHPサブコミュニティによって提案されてきました。
  p35:
  - kind: para
    text: Doc-commentはリフレクションAPI経由で実行時に文字列として取得できる
  p36:
  - kind: para
    text: 実行時に影響することもあるし､しないこともある特殊なやつ
  p37:
  - kind: para
    text: /**
  - kind: para
    text: '* これ'
  - kind: para
    text: '*/'
  p38:
  - kind: para
    text: /**
  - kind: para
    text: '*'
  - kind: para
    text: '@return int'
  - kind: para
    text: '*/'
  p39:
  - kind: para
    text: /**
  - kind: para
    text: '*'
  - kind: para
    text: '@phpstan-return 1|2'
  - kind: para
    text: '*/'
  p40:
  - kind: para
    text: /**
  - kind: para
    text: '*'
  - kind: para
    text: '@deprecated'
  - kind: para
    text: '*/'
  p41:
  - kind: para
    text: /**
  - kind: para
    text: '*'
  - kind: para
    text: '@Inject'
  - kind: para
    text: '*/'
  p42:
  - kind: para
    text: /**
  - kind: para
    text: '*'
  - kind: para
    text: '@Inject(optional=true)'
  - kind: para
    text: '*/'
  p43:
  - kind: para
    text: 各プロジェクトが雰囲気で定義してる
  p44:
  - kind: para
    text: 各プロジェクト固有タグは@phan-param みたいに共通のタグにprefixをつけたりアノテーションを\ で名前空間で区切ってる
  p45:
  - kind: para
    text: 文字列を解析してるだけだからPHPに存在しない名前付き引数も好き勝手に使えるぜ！！！１１
  p46:
  - kind: para
    text: ‒ PHPerKaigi 2020 (Feb 9, 2020)
  p47:
  - kind: para
    text: 大雑把に言うとIDEや静的解析のヒント実行時メタプログラミングに分類できる
  p48:
  - kind: para
    text: なんとなくの風潮として
  - kind: para
    text: '@tag'
  - kind: para
    text: は
  - kind: para
    text: タグ
  - kind: para
    text: ､
  - kind: para
    text: '@Anno("arg", attr=true)は'
  - kind: para
    text: アノテーション
  - kind: para
    text: と呼び分け
  p49:
  - kind: para
    text: あくまで｢なんとなく｣であって､各サブコミュニティが勝手に実装してるだけなので厳密な定義はない
  p50:
  - kind: para
    text: 区別はかなり曖昧だがPSR-19はタグカタログであり､アノテーションカタログではない
  p51:
  - kind: para
    text: どちらにせよ､PHPスクリプトに書く以上の付加情報を記述できる
  p52:
  - kind: para
    text: あるいは実装から分離してアノテーションとして記述することでAOPを実現
  p53:
  - kind: para
    text: 実行時メタプログラミングの温床
  p54:
  - kind: para
    text: 例:Go! AOP
  p55:
  - kind: para
    text: そんなわけでAttributeが入ると
  p56:
  - kind: para
    text: /**
  - kind: para
    text: '* @'
  - kind: para
    text: ExampleAttribute
  - kind: para
    text: '*/'
  - kind: para
    text: class Foo
  - kind: para
    text: '{'
  - kind: para
    text: // ...
  - kind: para
    text: '}'
  p57:
  - kind: para
    text: '<<'
  - kind: para
    text: ExampleAttribute
  - kind: para
    text: '>>'
  - kind: para
    text: class Foo
  - kind: para
    text: '{'
  - kind: para
    text: // ...
  - kind: para
    text: '}'
  p58:
  - kind: para
    text: // この記法は不採用
  - kind: para
    text: '@:'
  - kind: para
    text: ExampleAttribute
  - kind: para
    text: class Foo
  - kind: para
    text: '{'
  - kind: para
    text: // ...
  - kind: para
    text: '}'
  p59:
  - kind: para
    text: Doc-commentから取得できるのは文字列なので､実行時に活用するにはそれを構文解析する必要
  p60:
  - kind: para
    text: AttributeはDoc-commentと同じように実行時に取得でき､構造化されており構文解析不要
  p61:
  - kind: para
    text: 好き勝手な記法が使えるタグ/アノテーションと違ってAttributes v2仕様は単純な関数呼び出し風構文と静的な式
  p62:
  - kind: para
    text: 静的な式 = PHPで有効な式のうちリテラルと定数と演算子式で解決できる(実行時に変わらない)
  p63:
  - kind: para
    text: たぶんPHP-Parserからもリフレクションと似たAPIが用意されて簡単に取得できるだろう
  p64:
  - kind: para
    text: アトリビュートはクラスと同じようにuseで名前解決できる
  p65:
  - kind: para
    text: アトリビュートはクラスにマッピングし、Reflectionからインスタンスがとれる
  p66:
  - kind: heading
    level: 1
    text: アトリビュートクラス
  - kind: para
    text: <<PhpAttribute>>
  - kind: para
    text: class MyAttr
  - kind: para
    text: '{'
  - kind: para
    text: function __construct($arg){
  - kind: para
    text: // 特にやることがなければ
  - kind: para
    text: // 実行時には何もしなくていい
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p67:
  - kind: para
    text: ある意味ではコメントと同じで､取得されない限りAttributeは実行に影響を及ぼさない
  p68:
  - kind: para
    text: 先程のAttributeクラスは静的解析のためのヒントであって必須ではない
  p69:
  - kind: para
    text: その意味でPythonのデコレータとは全然違う
  p70:
  - kind: para
    text: アトリビュートを加味してインスタンスを生成する実行時のファクトリーまたはクラスローダーで近似させることはできる
  p71:
  - kind: para
    text: 明確な分類はできないが、タグよりもアノテーション系の方がアトリビュートで表現しやすい
  p72:
  - kind: para
    text: PHPコンパイラ(処理系)のためのアトリビュートがあることが示唆されている(詳細はRFC範囲外)
  p73:
  - kind: para
    text: PHPやるじゃん
  p74:
  - kind: para
    text: ほんとに？
  - kind: heading
    level: 1
    text: 🤔
  p75:
  - kind: para
    text: 誰のためのアトリビュート?
  p76:
  - kind: para
    text: コンパイラアトリビュート(処理系への指示)はなんとなくわかる
  p77:
  - kind: para
    text: ユーザーランドアトリビュートは…？
  p78:
  - kind: para
    text: ユースケースは…？
  p79:
  - kind: para
    text: RFCで実例が紹介されている
  p80:
  - kind: para
    text: これはわかる
  p81:
  - kind: para
    text: これも… まあまあ
  p82:
  - kind: para
    text: これは… そうなるね
  p83:
  - kind: para
    text: ここまでくると…
  p84:
  - kind: para
    text: もうつらたん
  p85:
  - kind: para
    text: DSLを喜んで覚え直したいひとは居るのか？
  - kind: heading
    level: 1
    text: 🙃
  p86:
  - kind: para
    text: 移行対象ではなく例として考えれば､アノテーションベースDSLの新規実装コストは多少下がってそう
  p87:
  - kind: para
    text: とはいえライブラリは既にあるし､コードインジェクションもキャッシュ機構があるので実行時コストには影響しない
  p88:
  - kind: para
    text: 実はPHP RFC:Named Argumentsも復活してPHP8に向けて議論されそうな雰囲気があるので影響あるかもね
  p89:
  - kind: para
    text: <<Deprecated>>
  p90: []
  p91:
  - kind: para
    text: アトリビュートの実際の利用例としての新しいRFC
  p92:
  - kind: para
    text: trigger_error
  - kind: para
    text: (E_DEPRE
  - kind: para
    text: CATED)
  - kind: para
    text: 相当のコードを
  - kind: para
    text: 生成する実行エンジン組
  - kind: para
    text: み込みのアトリビュート
  p93:
  - kind: para
    text: 言語組み込みのアトリビュートがある意義もわかるし､ユーザーランドで再現もめんどいので助かるといえば助かる
  p94:
  - kind: para
    text: 関数やメソッド以外にプロパティや定数の非推奨化もできる
  p95:
  - kind: para
    text: が､メーリングリストでは存在意義について割と揉めてる
  p96:
  - kind: para
    text: ついでに引数へのアトリビュートの付けかたについても議論
  p97:
  - kind: heading
    level: 1
    text: 普通の実装
  - kind: para
    text: function f(
  - kind: para
    text: $arg1,
  - kind: para
    text: $arg2
  - kind: para
    text: ){}
  p98:
  - kind: heading
    level: 1
    text: 引数の非推奨化
  - kind: para
    text: function f(
  - kind: para
    text: <<Deprecated>>
  - kind: para
    text: $arg1,
  - kind: para
    text: $arg2
  - kind: para
    text: ){}
  p99:
  - kind: para
    text: 引数のアトリビュートってほんとに必要なんですか…
  p100:
  - kind: para
    text: そもそも名前空間
  - kind: para
    text: \Php\Attributes
  - kind: para
    text: \Deprecated
  - kind: para
    text: じゃなくていいの？
  p101:
  - kind: para
    text: Attributesのfuture scopeの段階では名前空間がついてたのに､しれっとグローバル名前空間に移動している
  p102:
  - kind: para
    text: Attributeが解決できない問題
  p103:
  - kind: para
    text: /** @duplicated */
  - kind: para
    text: アノテーション
  - kind: para
    text: 名を
  - kind: para
    text: タイプミスすると
  - kind: para
    text: (上手に静的解析しない限り)
  - kind: para
    text: 実行時に無視される
  p104:
  - kind: para
    text: <<Duplicated>>
  - kind: para
    text: アトリビュート
  - kind: para
    text: 名を
  - kind: para
    text: タイプミスすると
  - kind: para
    text: (静的解析しない限り)
  - kind: para
    text: 実行時に無視される
  p105:
  - kind: para
    text: あと単純に名前空間との相性が悪くて､IDEや静的解析を使ってないとuseし忘れて無意味なおまじないとして残り…
  p106:
  - kind: para
    text: この問題はアノテーションベースAOPで結構深刻だと思うんですけど皆さんどうやって解決してるんだろ
  p107:
  - kind: para
    text: 全部のタグ/アノテーションがアトリビュートに移行されるの？
  p108:
  - kind: para
    text: されないと思う
  p109:
  - kind: heading
    level: 1
    text: いままでのタグ
  - kind: para
    text: '@param 1|2 $arg'
  - kind: para
    text: /**
  - kind: para
    text: '*/'
  - kind: para
    text: function f(
  - kind: para
    text: int $arg1
  - kind: para
    text: ){}
  p110:
  - kind: para
    text: (イメージ)
  - kind: para
    text: アトリビュート
  - kind: para
    text: で置換
  - kind: para
    text: use PHPStan\Param as param;
  - kind: para
    text: function f(
  - kind: para
    text: <<param("1|2")>>
  - kind: para
    text: int $arg1
  - kind: para
    text: ){}
  p111:
  - kind: para
    text: IDEの入力補完があったとしても書きにくい
  - kind: heading
    level: 1
    text: 🙃
  p112:
  - kind: para
    text: Attributeの明日はどっちだ
  p113:
  - kind: para
    text: PHP先生の次回作にご期待ください
