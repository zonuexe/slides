  p19:
  - kind: heading
    level: 1
    text: PHPStanとは何か
  - kind: para
    text: リンター
  - kind: list
    items:
    - 静的に(=プログラムを動作させずに)コードの状態を解析するツール
    - 広い意味ではコードのフォーマッターやタグ生成なども含む
    - PHPStanは静的解析の中でもLinterと呼ばれるジャンルのツール
    - ⇔ 動的解析 (静的解析の対義語)
    - XdebugやPHPUnitはプログラムを動かしてみて性質を確かめる
    - 従来のPHPStanは静的と動的のハイブリッドだった
