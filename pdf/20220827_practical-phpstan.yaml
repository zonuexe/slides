  - kind: list
    items:
    - PHPではいろんなところから型がついてない値が吹き出してくる
    - そのまま使えない mixed, array<mixed>, string, string|array, ...
    - スーパーグローバル変数($_GET)、PDO、$args、fgetcsv()、などなど…
    - そのまま使えると信じ込んで(=間違った値は来ないと祈って)使う
