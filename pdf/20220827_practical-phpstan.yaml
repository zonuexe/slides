    level: 1
    text: 動的型 vs 型なし
  - kind: list
    items:
    - 型宣言しなくても、全ての値は実行時に必ず具体的な型情報を持っている
    - get_debug_type() や is_string() などで動的に正しく判別できる
    - 型宣言すると
    - ここで言いたい「型なし」はソースコードを見て具体的な型が定まらないもの
    - 実行してみれば「動く」とわかるが、実行するまで正しいとは判断しきれない
  p137:
