    - node: text
      content: 'arrayと '
    - node: br
    - node: text
      content: 'ａｒｒａｙ＜ｍｉｘｅｄ＞と '
    - node: br
    - node: text
      content: mixed[] を混同しない
  p33:
  - node: p
    children:
    - node: text
      content: ここ最近のPHPStan
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 完全静的解析モードがデフォルトになりました
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: いままでのPHPStanは実行時リフレクションで解析コストを抑えていた
        - node: li
          children:
          - node: text
            content: 改善の積み重ねによりパフォーマンスがものすごく向上している
        - node: li
          children:
          - node: text
            content: 従来通りの実行時リフレクションも使える
    - node: li
      children:
      - node: text
        content: PHPStanはハイペースで改善されているのでガンガン更新しましょう
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ただし今月は開発者が夏休みを宣言している
  - node: p
    children:
    - node: text
      content: ⛱
  p34:
  - node: p
    children:
    - node: text
      content: PHPStanは何ではないか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPのあらゆる関数に対して完璧な型を付けてくれるわけではない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 不具合や意図しない挙動を発見したら報告してほしい
        - node: li
          children:
          - node: text
            content: Twitterに書くだけでも作者か日本人の誰かが反応してくれると思う
    - node: li
      children:
      - node: text
        content: オープンソースソフトウェアであり、商用サポートはない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: チェコ在住の個人 が開発している
  - node: p
    children:
    - node: text
      content: (Ondřej Mirtes)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: コミュニティによるバグ修正や機能追加の貢献も受け入れている
  p35:
  - node: p
    children:
    - node: text
      content: PHPの型の基礎
  p36:
  - node: p
    children:
    - node: text
      content: 型の基本的な考え方
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 基本は型宣言できるPHPの型を覚える
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: クラス/インターフェイス名 (PHP 5)
        - node: li
          children:
          - node: text
            content: 複合型 array / callable (PHP 5)
        - node: li
          children:
          - node: text
            content: スカラー値 int / Hoat / string / bool (≧ PHP 7.0)
        - node: li
          children:
          - node: text
            content: 特別な戻り値型 void (≧ PHP 7.0) / never (≧ PHP 8.1)
        - node: li
          children:
          - node: text
            content: そのほかの型表記
  p37:
  - node: p
    children:
    - node: text
      content: 'ユニオン型 '
  - node: p
    children:
    - node: bold
      content: A|B
  - node: p
    children:
    - node: text
      content: 'AまたはB '
    - node: br
    - node: text
      content: (複雑な式は書けない)
  p38:
  - node: p
    children:
    - node: text
      content: '交(cid:20281)型 '
  - node: p
    children:
    - node: bold
      content: A&B
  - node: p
    children:
    - node: text
      content: 'AおよびB '
    - node: br
    - node: text
      content: (複雑な式は書けない)
  p39:
  - node: p
    children:
    - node: text
      content: '型 '
  - node: p
    children:
    - node: text
      content: DNF
    - node: br
    - node: bold
      content: int|A|(B&C)|null
  - node: p
    children:
    - node: text
      content: 'intまたはAまたは「BおよびC」またはnull '
    - node: br
    - node: text
      content: (一定の制約下で複雑な型も書ける)
  p40:
  - node: p
    children:
    - node: text
      content: 'null許容型 '
  - node: p
    children:
    - node: text
      content: '?'
    - node: br
    - node: bold
      content: A
  - node: p
    children:
    - node: text
      content: 'Aまたはnull '
    - node: br
    - node: text
      content: デフォルトで許容しない
  p41:
  - node: p
    children:
    - node: text
