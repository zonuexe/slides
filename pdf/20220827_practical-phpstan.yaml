  p119:
  - kind: para
    text: DTO (Data Transfer Object)
  - kind: list
    items:
    - データを格納して持ち運ぶことを目的としたクラス
    - C言語などの構造体(struct)をクラスで表現したものとも考えられる
    - 典型的には単なるPOPOで実装できる
    - PHP 8.0からはコンストラクタプロモーションで、異様に簡潔に定義できる
    - 現代PHPでは小さいイミュータブルなクラスをバンバン切っていく方が
  - kind: para
    text: 責務が小さく解析もしやすくなるが今回の本題ではないので割愛
