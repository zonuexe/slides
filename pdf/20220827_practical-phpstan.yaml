  p51:
  - node: p
    children:
    - node: text
      content: 型宣言 vs PHPDoc(型注釈)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 型宣言された型は、実行時に100%確実に保証される実効性のある型です
    - node: li
      children:
      - node: text
        content: PHPDocは /** ... */ 形式のブロック内に書かれる単なるコメントです
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 実行時にはその通りの型であることは保証されず、型は口約束に過ぎません
    - node: li
      children:
      - node: text
        content: この発表内で「型を付ける」というときは型宣言と型注釈のどちらも使います
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 実効性のある型と口約束に過ぎない型の二枚舌の使い分けが
          - node: br
          - node: text
            content: 動的言語における現実的な型の付け方になります
  p52:
  - node: p
    children:
    - node: text
      content: 無駄なPHPDocは書かない
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 型宣言と同じ内容をPHPDocに書き写さない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 自然言語で説明を書きたいときは書く
        - node: li
          children:
          - node: text
            content: int→positive-int string→定数 のように型を強化する場合は書く
    - node: li
      children:
      - node: text
        content: 継承元と同じ型の場合は何も書かない (共変型付けをしたいときは書く)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 'PHP: 共変性と反変性 - Manual'
    - node: li
      children:
      - node: text
        content: 几帳面に埋めようとしてくるPhpStormの言うことを聞かない
