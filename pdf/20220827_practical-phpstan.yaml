  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'その他のLSP対応エディタ: efm-langserver'
  - node: p
    children:
    - node: text
      content: (汎用言語サーバー)
  p30:
  - node: p
    children:
    - node: text
      content: 外した方がいいPhpStorm設定
  p31:
  - node: p
    children:
    - node: text
