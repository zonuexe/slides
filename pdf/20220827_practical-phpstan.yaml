  p116:
  - kind: para
    text: 基本的な型の付け方
  - kind: list
    items:
    - 関数／メソッドとクラス定義に絞って詳細な型を付けていく
    - パラメータ (仮引数)
    - 戻り値
    - プロパティ
    - ただしクロージャ(無名関数)はがんばらなくていい
    - 基本はこれだけに絞っていけばコードに型は付く (理想論)
