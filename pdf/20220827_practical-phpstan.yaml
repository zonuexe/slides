  p163:
  - kind: heading
    level: 1
    text: if/assert vs @var
  - kind: list
    items:
    - if文/assertなどは単純な型宣言よりも詳細に型付けできる
    - 本番でassert式の内容を評価するかは設定で制御できる(マニュアル参照)
    - 私は無効化しない方が安全だと思います
    - '@varはarray-shapesなどを使って配列の構造も詳細に型を付けられる。'
  - kind: para
    text: ただし単なるコメントなので実態に反する型も付けられてしまうので要注意
  p164:
  - kind: heading
    level: 1
    text: if/assert vs @var の使い分け案
  - kind: list
    items:
    - 変数を生成/取り出した直後に引数としてそのまま渡す場合は、
  - kind: para
    text: 実装側の責任とする／型宣言による自動型チェックで保証されるので @var
  - kind: list
    items:
    - DBのクエリ結果などは@varで済ませるか、hydratorライブラリを使って
  - kind: para
    text: 期待通りの構造の配列／クラスにマッピングする
  - kind: list
    items:
    - 変数を生成/取り出した直後にそのオブジェクトのメソッド呼び出しをする
  - kind: para
    text: 場合は、 assert($var instaceof Foo) のようにチェックしておくことでエラーメッセージがわかりやすくなる
  p165:
  - kind: para
    text: 標準関数 vs 型
  - kind: list
    items:
    - 失敗したらfalseを返す標準関数が多い
    - 'file_get_contents(): string|false'
    - 存在しないファイルにアクセスするとWarningを発生
    - Warningなどのエラーはset_error_handler()で振る舞いが変わる
    - $content = file_get_contents(); assert($content !== false);
    - 'Safe PHP: 全ての標準関数の失敗を例外に変換してくれるライブラリ'
