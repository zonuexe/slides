    - node: br
    - node: text
      content: mixed[] を混同しない
  p32:
  - node: p
    children:
    - node: text
      content: 外した方がいいPhpStorm設定
  - node: p
    children:
    - node: text
      content: '@param とか @returnを'
    - node: br
    - node: text
      content: 執拗に全部埋めてくる
  - node: p
