  p18: []
  p19:
  - node: p
    children:
    - node: text
      content: PHPStanとは何か
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 静的に(=プログラムを動作させずに)コードの状態を解析するツール
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 広い意味ではコードのフォーマッターやタグ生成なども含む
  - node: p
    children:
    - node: bold
      content: リ ン タ ー
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPStanは静的解析の中でもLinterと呼ばれるジャンルのツール
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ⇔ 動的解析 (静的解析の対義語)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: XdebugやPHPUnitはプログラムを動かしてみて性質を確かめる
        - node: li
          children:
          - node: text
            content: 従来のPHPStanは静的と動的のハイブリッドだった
  p20:
  - node: p
    children:
    - node: text
      content: なに? 使ってない?
  p21:
  - node: p
    children:
    - node: text
      content: ' あなたとPHPStan いますぐダウンロー '
    - node: br
    - node: text
      content: ド
  p22:
  - node: p
    children:
    - node: text
      content: どうやって？
  p23:
  - node: p
    children:
    - node: text
      content: Ond ej said...
    - node: br
    - node: bold
      content: ř
  p24:
  - node: p
    children:
    - node: bold
      content: PHP 7.2以上ならプロジェクトに追加しよう
  - node: p
    children:
    - node: text
      content: 'composer require--dev '
  - node: p
    children:
    - node: text
      content: phpstan/phpstan
  p25:
  - node: p
    children:
    - node: bold
      content: プロジェクトに追加できないなら
  - node: p
    children:
    - node: text
      content: 'composer globalrequire '
  - node: p
    children:
    - node: text
      content: phpstan/phpstan
  p26:
  - node: p
    children:
    - node: text
      content: require --dev以外の方法を検討
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 要は何らかの事情があってcomposer.jsonに追加できないなら仕方ない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: プロジェクトがPHP 7.2以前に依存しているとき
        - node: li
          children:
          - node: text
            content: 権限の問題などでcomposer.jsonに追加でないとき
    - node: li
      children:
      - node: text
        content: それ以外は原則Composerに追加しましょう
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PhpStormの最新版なら、いい感じに勝手にPHPStanを動かしてくれる
        - node: li
          children:
          - node: text
            content: もっと詳細な話はぺちこん沖縄当日までの間にzennに書きます
  p27:
  - node: p
    children:
    - node: text
      content: PHPStanを入れてどうするの
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Composerの実行ファイルは ./vendor/bin/phpstan にある
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 以下、パスを省略して単に phpstan コマンドとして表記
    - node: li
      children:
      - node: text
        content: 基本は phpstan analyze のように動かすと解析できる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: phpstan analyze src/Foo/Target.php でファイル単位解析
    - node: li
      children:
      - node: text
        content: PHPStan ProというWebインターフェイスもある
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 弊社では応援の意味も込めてProを契約しています
  p28:
  - node: p
    children:
    - node: text
      content: PhpStormがあるのに必要…?
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PhpStormもがんばってPHPStanやPsalmとの互換性を高めているが、
      - node: br
      - node: text
        content: '解析能力に関しては専門のツールの方が強い '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PHPStanとPsalmはユーザーがPHPで自由に拡張できる
    - node: li
      children:
      - node: text
        content: PhpStormの方がレガシー寄りのPHPバージョンに強い
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PHPStanはPHP 7.2を以上サポート
        - node: li
          children:
          - node: text
            content: PhpStormのヘッドレス版のQodanaというツールがCI用途に使える
  p29:
  - node: p
    children:
    - node: text
      content: 解析結果はリアルタイム表示しよう
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'PhpStorm: 最近のバージョンでは標準組み込み'
  - node: p
    children:
    - node: text
      content: (場合によって要設定)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'VS Code: sordev.phpstan ErrorLens'
  - node: p
    children:
    - node: text
      content: +
  - node: p
    children:
    - node: text
      content: ' (Marketplaceには古いのもあるので注意)'
  - node: ul
    children:
    - node: li
      children:
      - node: text
