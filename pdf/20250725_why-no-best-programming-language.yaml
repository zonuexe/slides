    text: A.「いい質問ですね!」
  p17:
  - kind: para
    text: 特に初心者は覚えることが多い
  p18:
  - kind: heading
    level: 1
    text: Web開発は多言語を要求しがち
  - kind: list
    items:
    - バックエンド言語どれか
    - JavaScript(Node.js), Ruby, Python, Java, C#, PHP, ...etc.
    - フロントエンド
    - HTML, JavaScript, TypeScript, CSS, ...etc.
    - その他
    - SQL, 正規表現, シェルスクリプト ...etc.
  p19:
  - kind: para
    text: どれか1つにならんか
  - kind: para
    text: と願いたくなる気持ちはわかる
  p20:
  - kind: para
    text: 言語を1個だけ覚えたら
  - kind: para
    text: なんでも作れる！
  p21:
  - kind: para
    text: ゲームも作れるしシステム開発もできる
  p22:
  - kind: para
    text: そうなったらいいのにな…
  p23:
  - kind: heading
    level: 1
