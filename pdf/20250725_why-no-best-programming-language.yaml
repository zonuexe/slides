  p27:
  - kind: para
    text: Q.(自然言語)何言語知っていますか？
  p28:
  - kind: para
    text: 日本語、英語、中国語、韓国語ドイツ語、フランス語、タイ語
  - kind: para
    text: ヒンディー語、マレー語…
  p29:
  - kind: para
    text: 言語って結構いっぱいある
  p30:
  - kind: para
    text: 日本人は結構「何か国語」「母国語」って言っちゃいがち
  p31:
