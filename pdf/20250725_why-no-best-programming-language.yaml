  p40:
  - kind: para
    text: 世界にプログラミング
  - kind: para
    text: 言語は何種類あるで
  - kind: para
    text: しょうか
  p41:
  - kind: heading
    level: 1
    text: 151種類！
  p42:
  - kind: para
    text: …と断言してくれるオーキ
  - kind: para
    text: ド博士がいてくれたらよかったのですが… そのよう
  - kind: para
    text: に明快な回答は出せない
  p43:
  - kind: para
    text: (計算機言語)何言語
  - kind: para
    text: 言えますか？
  p44:
  - kind: heading
    level: 1
    text: GitHubの言語検出
  p45:
  - kind: heading
    level: 2
    text: '594'
  - kind: heading
    level: 1
    text: GitHubの言語検出
  p46:
  - kind: heading
    level: 1
    text: コンピュータ言語
  - kind: list
    items:
    - 人工的に作られた言語のうち、コンピュータで処理することを
  - kind: para
    text: 前提に設計された言語
  - kind: list
    items:
    - データ記述言語 (HTML, XML, JSON, Markdown, ...etc.)
    - 問い合わせ言語 (SQL, SPARQL, …etc.)
    - スタイルシート言語 (CSS, XSL, …etc.)
    - プログラミング言語 (C言語, JavaScript, Ruby, Python, ...etc.)
  p47:
  - kind: para
    text: このトークでは言語の種類
  - kind: para
    text: を厳密には区別しない…
  p48:
  - kind: para
    text: が、分類する必要性が生じている時点で統一無理そう
  - kind: para
    text: という予感がしてくる
  p49:
  - kind: heading
    level: 1
    text: プログラムで全てを司る
  - kind: list
    items:
    - 汎用のプログラミング言語、だいたい何でも書ける
    - データも記述できる
    - 問い合わせもできる
    - スタイルシートも埋め込める
    - もちろんプログラムも書ける (それはそう)
  p50:
  - kind: heading
    level: 1
    text: データ記述言語もなんでもできる
  - kind: list
    items:
    - '例: GitHub Actions (YAML)'
    - GitHubで処理させることをYAMLで記述する
    - 制御構造を持っていて、ほかのActionsを呼び出せる
    - 構文としてはYAMLだが、これって独自のプログラミング言語では？
  p51:
  - kind: heading
    level: 1
    text: データと処理の世界を往復する
  - kind: list
    items:
    - Lispという言語はプログラムをS式というリスト形式で記述する
    - 関数は (format “string”) のような形式で記述する
    - マクロという言語機能によって、コンパイル過程でプログラムを生成できる
    - データとプログラムが同じ構造をとっている (同図像性)
    - eval という機能でリストをプログラムとして実行できる
    - Julia, Elixirなどの言語はS式ではないが、この性質を受け継いでいる
  p52: []
  p53: []
  p54: []
  p55: []
  p56:
  - kind: heading
    level: 1
    text: eval
  - kind: list
    items:
    - evaluation (評価)
    - プログラムの実行中に文字列やリスト形式のプログラムを実行することで、
  - kind: para
    text: 柔軟な実行時処理を実現できる
  - kind: list
    items:
    - 非常に強力だが、多用しすぎると処理が追いにくい意味不明なプログラムに
  - kind: para
    text: なりがち
  - kind: list
    items:
    - 現代となっては(Lisp以外の世界では)使うなという風評になっている
  p57:
  - kind: para
    text: なんでもできる
  - kind: para
    text: は難しい
  p58:
  - kind: heading
    level: 1
    text: プログラムで全てを司る
  - kind: list
    items:
    - 汎用のプログラミング言語、だいたい何でも書ける
    - 良いことも、悪いことも、なんでも記述できる
    - 意図しない記述で無限ループに陥るとか
    - 「大いなる力には大いなる責任が伴う」
    - LispやRubyなどはこういう考えが前提にありそう
  p59:
  - kind: para
    text: 式言語 (expression language)
  - kind: list
    items:
    - ユーザーに計算式やロジックなどを入力させたいケースがある
    - 汎用のプログラミング言語よりもシンプルな計算式や数学関数だけを持つ
  - kind: para
    text: 「式言語」を提供することで、プログラミング
  - kind: list
    items:
    - プログラミング言語そのものを入力させると
  - kind: para
    text: 任意コード実行(ACE： Arbitrary Code Execution)が成立しうる
  - kind: list
    items:
    - 悪意がなくても、うっかりで停止しないプログラムを書けてしまう
  p60:
  - kind: para
    text: Excel数式
  - kind: list
    items:
    - スプレッドシートのセルに数式を書くと、計算結果が画面に表示される
    - 基本的には「命令」は書けなかった (過去形)
    - 近年はExcelではPythonプログラムを書けたり、
  - kind: para
    text: Google SpreadsheetsではJavaScriptを書けるようになった
  p61:
  - kind: heading
    level: 1
    text: Write once, run anywhereの夢
  - kind: list
    items:
    - Javaは「一度書けばどこでも動く」マルチプラットフォーム性を謳っていた
    - 汎用的なライブラリなどは共通化できるが、アプリケーションとしては
  - kind: para
    text: 環境固有の実装が必要
  - kind: list
    items:
    - 現代でもReact Native(JavaScript), Flutter(Dart), KMP(Kotlin
  - kind: para
    text: Multiplatform) などマルチプラットフォームの環境は多い
  - kind: list
    items:
    - WebAssembly(WASM)
  p62:
  - kind: para
    text: プログラミング言語の
  - kind: para
    text: パラダイム
  p63:
  - kind: heading
    level: 1
    text: なんちゃら型、なんちゃら指向
  - kind: list
    items:
    - 一般に普及しているプログラムは「手順」を順番に記述する (手続型)
    - C言語(手続き型)→C++, Java, C#(オブジェクト指向)
    - どれもC言語を発展させたような言語と捉えられる(互換性はない)が、
  - kind: para
    text: それぞれのアプローチは非常に違っている
  - kind: list
    items:
    - 関数を基本的な単位とするパラダイム (関数型)
  p64:
  - kind: para
    text: PHPはどこでも65点がとれる言語
  - kind: list
    items:
    - '「現代におけるプロダクト開発とPHPを選定するワケ #phpkansai」'
    - By @potato4d (PHPカンファレンス関西2017)
    - 小難しいことを考えずに簡単にWebアプリを書ける(HTML+α)の言語
    - なんだかんだいってWEB+DB連携がさくっとできる言語ランタイムとして
  - kind: para
    text: の存在感は健在
  - kind: list
    items:
    - 求められているのは素晴らしい言語ではなく簡単に使える言語
