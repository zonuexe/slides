    children:
    - node: text
      content: magit-ﬁnd-ﬁles
  p9:
  - node: p
    children:
    - node: text
      content: 'magit-ﬁnd-ﬁleshttps://github.com/bradwright/magit-ﬁnd-ﬁle.el •なストームとか使ってる人たちが         んとか•簡単にファイル絞り込んでるので悔しかった Git使ってるプロジェクトなら有効 •TRAMP使ってても問題なく利用できるよ         •(ただし、初回だけ若干重い…)'
