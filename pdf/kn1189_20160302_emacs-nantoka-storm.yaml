    children:
    - node: text
      content: 'php-modehttps://github.com/ejmr/php-mode •現在でも活発に開発されてるよ！ •もちろんPHP
        7にも対応してる！ •数年前にインストールして放置してる…         •ってひとは是非ともアップデートするべき'
  p6:
  - node: p
    children:
    - node: text
      content: TRAMP
  p7:
  - node: p
    children:
    - node: text
      content: 'TRAMPEmacsに標準で入ってる •SSHでサーバ上のファイルを編集できるよ！ •とても賢いので、Magitとかも普通に動く •
        •         scp:your-server:/home/user/…みたいに開ける recentfとかでも開けるので超べんり•'
  p8:
