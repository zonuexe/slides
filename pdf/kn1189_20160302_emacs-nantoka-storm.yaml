      content: 'に負けたくない         なStormんとかEmacs 初級(cid:7979)2016-03-01 PHP BLT #3'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰ようさみけんた / tadsan / Zonu.EXE •このスライドは開始10分前に書きはじめました •pixiv Inc.でまじめにふまじめPHP書いてるよ
        •WEB+DB PRESS Vol. 91買ってね！！！•
  p3:
  - node: p
    children:
    - node: text
      content: 'あじぇんだ無理せず手に馴染む道具で書くのが一番だよ！ •今回は入門(cid:7979)なので、         •あんまりすごいことはやらないよ！ 私のはGitHubにあるよ！•         init.el https://github.com/zonuexe/dotﬁles/tree/master/.emacs.dEmacsは24.5を入れよう•'
  p4:
