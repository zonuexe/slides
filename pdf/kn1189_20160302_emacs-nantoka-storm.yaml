text:
  p1:
  - kind: para
    text: なんとかStormに負けたくない
  - kind: para
    text: Emacs 初級篇
  - kind: para
    text: '2016-03-01 PHP BLT #3'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた / tadsan / Zonu.EXE
    - このスライドは開始10分前に書きはじめました
    - pixiv Inc.でまじめにふまじめPHP書いてるよ
    - WEB+DB PRESS Vol. 91買ってね！！！
  p3:
  - kind: heading
    level: 1
    text: あじぇんだ
  - kind: list
    items:
    - 無理せず手に馴染む道具で書くのが一番だよ！
    - 今回は入門篇なので、
  - kind: para
    text: あんまりすごいことはやらないよ！
  - kind: list
    items:
    - 私のinit.elはGitHubにあるよ！
  - kind: para
    text: https://github.com/zonuexe/dotﬁles/tree/master/.emacs.d
  - kind: list
    items:
    - Emacsは24.5を入れよう
  p4:
  - kind: para
    text: php-mode
  p5:
  - kind: heading
    level: 1
    text: php-mode
  - kind: list
    items:
    - https://github.com/ejmr/php-mode
    - 現在でも活発に開発されてるよ！
    - もちろんPHP 7にも対応してる！
    - 数年前にインストールして放置してる…
  - kind: para
    text: ってひとは是非ともアップデートするべき
  p6:
  - kind: para
    text: TRAMP
  p7:
  - kind: heading
    level: 1
    text: TRAMP
  - kind: list
    items:
    - Emacsに標準で入ってる
    - SSHでサーバ上のファイルを編集できるよ！
    - とても賢いので、Magitとかも普通に動く
    - scp:your-server:/home/user/…
  - kind: para
    text: みたいに開ける
  - kind: list
    items:
    - recentfとかでも開けるので超べんり
  p8:
  - kind: para
    text: magit-ﬁnd-ﬁles
  p9:
  - kind: heading
    level: 1
    text: magit-ﬁnd-ﬁles
  - kind: list
    items:
    - https://github.com/bradwright/magit-ﬁnd-ﬁle.el
    - なんとかストームとか使ってる人たちが
  - kind: para
    text: 簡単にファイル絞り込んでるので悔しかった
  - kind: list
    items:
    - Git使ってるプロジェクトなら有効
    - TRAMP使ってても問題なく利用できるよ
  - kind: para
    text: (ただし、初回だけ若干重い…)
  p10:
  - kind: para
    text: php-eldoc
  p11:
  - kind: heading
    level: 1
    text: php-eldoc
  - kind: list
    items:
    - https://github.com/zonuexe/dotﬁles/blob/
  - kind: para
    text: master/.emacs.d/site-lisp/php-eldoc.el
  - kind: list
    items:
    - 標準関数の引数とか覚えてられっか馬鹿野郎
    - implode() の引数とかね！
    - たしか入れかたがめんどくさいので、そのうち
  - kind: para
    text: Qiitaとかに書きます
  p12:
  - kind: para
    text: smartchr.el
  p13:
  - kind: heading
    level: 1
    text: smartchr.el
  - kind: list
    items:
    - https://github.com/imakado/emacs-smartchr
    - キーを連打すると入力文字列が入れ変ってく
    - 変換パターンは自分で登録する
    - たとえば [ → [] → array() みたいに
    - 同名のVim Scriptが原作
  p14:
  - kind: para
    text: psysh
  p15:
  - kind: heading
    level: 1
    text: psysh
  - kind: list
    items:
    - https://github.com/zonuexe/psysh.el
    - PHPで動くインタラクティブシェル
    - composer g require psy/psysh
    - Emacsからも当然のように動かせるよ
  p16:
  - kind: heading
    level: 1
    text: まとめ
  - kind: list
    items:
    - なんとかストームがなくてもPHPは書けるよ
    - 今回は入門篇なので、
  - kind: para
    text: そのうちもっとすごいことを書くよ
  - kind: list
    items:
    - エディタハラスメントはダメ、ゼッタイ。
    - Emacsでキミだけの最強IDEを実装しちゃおう！
size:
  max_width: 1024
  max_height: 768
