    - node: text
      content: 'まとめなストームがなくてもPHPは書けるよ んとか•今回は入門(cid:7979)なので、         •そのうちもっとすごいことを書くよ エディタハラスメントはダメ、ゼッタイ。 •Emacsでキミだけの最強IDEを実装しちゃおう！•'
