text:
  p1:
  - kind: heading
    level: 1
    text: PHP式プログラミング入門
  - kind: heading
    level: 2
    text: Guide to expression-oriented programming in PHP
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2022.01.21
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - 仕事ではPHPという静的型付き関数型プログラミング言語を書いています
    - 趣味ではEmacs Lispという雑草のような生命力*の言語を書いています
  - kind: para
    text: (*出典： 『初めての人のためのLISP』)
  p3:
  - kind: para
    text: 普段はEmacsというLisp専用OSでPHP開発する環境を作ってます
  p4:
  - kind: para
    text: こういうバックグラウンドなので関数型よくわからない…
  p5:
  - kind: para
    text: map/reduceが関数プログラミングなんでしょ
  p6:
  - kind: para
    text: 僕はあらゆるループをLispのLOOPマクロで書きたい派なんで…
  p7:
  - kind: para
    text: ちなみにLispはElixirと同様に、基本的にreturnを書けません
  p8:
  - kind: heading
    level: 1
    text: さて
  p9:
  - kind: para
    text: PHPってどういう言語
  p10:
  - kind: heading
    level: 1
    text: PHPはHTMLに書く言語？
  - kind: para
    text: <!DOCTYPE html public>
  - kind: para
    text: <p>現在は<?= date('%H時%i分%s秒です') ?></p>
  p11:
  - kind: heading
    level: 1
    text: PHPスクリプト
  - kind: para
    text: <?php echo "<!DOCTYPE html public>\n\n";echo "<p>現在は", date('%H時%i分%s秒です'),
      "</p>\n";
  p12:
  - kind: para
    text: こういうノリでWebアプリがサクっと書ける素朴な言語
  p13:
  - kind: para
    text: PHPはこんな言語
  - kind: list
    items:
    - 汎用プログラミング言語 (Webだけではない)
    - 昨今ではHTMLにそのまま埋め込むよりもクラス定義が主体
    - <?php タグの内側のシンタックスはCっぽい
    - C言語っぽい {} を使った制御構造がある
    - 式文が ; で終端する
  p14:
  - kind: heading
    level: 1
    text: PHPとクロージャ
  - kind: list
    items:
    - 基本的にレキシカルスコープです
  p15:
  - kind: heading
    level: 1
    text: PHPとクロージャ
  - kind: list
    items:
    - 基本的にレキシカルスコープです
    - function ($a, $b) { return $a + $b; } のような無名関数
  p16:
  - kind: heading
    level: 1
    text: PHPとクロージャ
  - kind: list
    items:
    - 基本的にレキシカルスコープです
    - function ($a, $b) { return $a + $b; } のような無名関数
    - 外側の変数をキャプチャするには明示が必要
  - kind: para
    text: function ($a, $b) use ($c) { return $a + $b + $c; }
  p17:
  - kind: heading
    level: 1
    text: PHPとクロージャ
  - kind: list
    items:
    - 基本的にレキシカルスコープです
    - function ($a, $b) { return $a + $b; } のような無名関数
    - 外側の変数をキャプチャするには明示が必要
  - kind: para
    text: function ($a, $b) use ($c) { return $a + $b + $c; }
  - kind: list
    items:
    - PHP 7.4からは fn($a, $b) => $a + $b + $c;
    - 明示しなくても キャプチャできて便利
  p18:
  - kind: para
    text: これだけ知ればおもしろいこといろいろできそう
  p19:
  - kind: heading
    level: 1
    text: ところで
  p20:
  - kind: para
    text: 世の中にはいろんな制約を課したプログラミングがある
  p21:
  - kind: para
    text: セミコロンなしでJavaを書くとか
  p22:
  - kind: para
    text: Pythonワンライナーとか
  p23:
  - kind: para
    text: $なしでPHPを書くとか
  p24:
  - kind: heading
    level: 1
    text: https://tadsan.fanbox.cc/posts/329540
  p25:
  - kind: para
    text: これはこれでおもしろい
  p26:
  - kind: para
    text: (再掲)PHPはこんな言語
  - kind: list
    items:
    - 汎用プログラミング言語 (Webだけではない)
    - 昨今ではHTMLにそのまま埋め込むよりもクラス定義が主体
    - <?php タグの内側のシンタックスはCっぽい
    - C言語っぽい {} を使った制御構造がある
    - 式文が ; で終端する
  p27:
  - kind: heading
    level: 1
    text: (再掲)PHPはこんな言語
  - kind: list
    items:
    - 汎用プログラミング言語 (Webだけではない)
    - 昨今ではHTMLにそのまま埋め込むよりもクラス定義が主体
    - <?php タグの内側のシンタックスはCっぽい
    - C言語っぽい {} を使った制御構造がある
    - 式文が ; で終端する
  - kind: para
    text: こいつら目障りじゃないですか？
  p28:
  - kind: para
    text: セミコロンレス
  - kind: para
    text: Javaでは
  p29:
  - kind: heading
    level: 1
    text: https://horosora.hatenablog.com/entry/2018/08/03/162147より引用
  p30:
  - kind: para
    text: ; だけじゃなくて{} も縛りたくない？
  p31:
  - kind: heading
    level: 1
    text: 今回の本題
  p32:
  - kind: heading
    level: 1
    text: (再掲)PHPはHTMLに書く言語
  - kind: para
    text: <!DOCTYPE html public>
  - kind: para
    text: <p>現在は<?= date('%H時%i分%s秒です') ?></p>
  - kind: para
    text: ?> 直前は
  - kind: para
    text: ; を削れる
  p33:
  - kind: para
    text: すべての処理を<?= に押し込む
  p34:
  - kind: para
    text: できれば一個の<?= に押し込む
  p35:
  - kind: para
    text: PHPは式指向プログラミングできる下地はいろいろある
  p36:
  - kind: heading
    level: 1
    text: PHPの特徴
  - kind: list
    items:
    - スクリプト言語にありがちな定義せずに代入したら使える変数
    - 代入は式！
    - C言語とほぼ同じ制御構造なので if や while は {} または ; 必須
    - '分岐は条件演算子 $cond ? $then : $else でどうにか'
    - ループは array_map(), array_reduce() でどうにか
  p37:
  - kind: para
    text: これだけできればチューリング完全であることは自明
  p38:
  - kind: heading
    level: 1
    text: FizzBuzzを書いてみよう
  - kind: para
    text: 1から100を改行区切りで出力
  - kind: para
    text: <?= implode(range(1, 100), "\n") ?>
  p39:
  - kind: heading
    level: 1
    text: FizzBuzzを書いてみよう
  - kind: para
    text: 1から100をFizzBuzzに変換して改行区切りで出力
  - kind: para
    text: '<?= implode(array_map(fn(int $n): string => [[$n, ''Buzz''],[''Fizz'',
      ''FizzBuzz'']][$n%3==0][$n%5==0],range(1, 100), "\n") ?>'
  p40:
  - kind: para
    text: こういうノリでmap/reduceに変形できれば任意の処理が可能
  p41:
  - kind: para
    text: パイプライン演算子が欲しくなってくるぜ(Lispならスレッドマクロがあるのに)
  p42:
  - kind: heading
    level: 1
    text: これはLispですね
  p43:
  - kind: para
    text: そう思ったことが私にもありました
  p44:
  - kind: heading
    level: 1
    text: ある日のこと…
  p45:
  - kind: heading
    level: 1
    text: https://qiita.com/perpouh/items/807775de16986a956d1c より引用
  p46:
  - kind: heading
    level: 1
    text: https://qiita.com/perpouh/items/807775de16986a956d1c より引用
  p47:
  - kind: heading
    level: 1
    text: これはやばい
  p48:
  - kind: para
    text: https://qiita.com/perpouh/items/807775de16986a956d1c より引用
  - kind: para
    text: 文を多用してるのでfn() に置き換え困難
  p49:
  - kind: heading
    level: 1
    text: この路線の限界
  p50:
  - kind: para
    text: array_map/array_reduceはあくまで配列処理
  p51:
  - kind: heading
    level: 1
    text: 無限ループできない
  p52:
  - kind: heading
    level: 1
    text: 旧式のfunctionでは自己再帰可能
  - kind: para
    text: 変数を参照としてキャプチャしないと
  - kind: para
    text: <?php
  - kind: para
    text: いけない
  - kind: para
    text: '$fib = function (int $n) use (&$fib) {return ($n < 2)? 1: $fib($n - 1)
      + $fib($n -2);};'
  p53:
  - kind: heading
    level: 1
    text: アロー関数(fn)では自己再帰不能
  - kind: para
    text: クロージャ作成時にはクロージャ自体は作られてない
  - kind: para
    text: <?php
  - kind: para
    text: ので束縛できない
  - kind: para
    text: '$fib = fn (int $n) =>($n < 2)? 1: $fib($n - 1) + $fib($n -2);'
  p54:
  - kind: heading
    level: 1
    text: じゃあどうすればいい
  p55:
  - kind: heading
    level: 1
    text: そうですね
  p56:
  - kind: heading
    level: 1
    text: 不動点演算子
  p57:
  - kind: para
    text: いわゆるYコンビネータ(Zコンビネータ)
  p58:
  - kind: heading
    level: 1
    text: Zコンビネータ
  p59:
  - kind: heading
    level: 1
    text: これで勝てる
  p60:
  - kind: heading
    level: 1
    text: 可読性重視版
  p61:
  - kind: heading
    level: 1
    text: 圧縮版
  p62:
  - kind: heading
    level: 1
    text: 完
  p63:
  - kind: heading
    level: 1
    text: まとめ
  p64:
  - kind: para
    text: PHPはLispじゃない式指向プログラミングは大変
  p65:
  - kind: para
    text: エクストリームスポーツを楽しもう
  p66:
  - kind: para
    text: ご静聴ありがとうございました
  p67:
  - kind: para
    text: あとPHPでもかなり実用的な静的型検査ができるようになってる
  p68:
  - kind: para
    text: 関連記事
  - kind: list
    items:
    - PHP式プログラミング入門 (原稿版)
    - PHPの無名関数式とは何か、そしてPHP7.4のアロー関数にそなえよう
    - Functoolsを作った
    - Functoolsで過剰にスマートなPHPを書こう (無名再帰篇)
