text:
  p1:
  - node: p
    children:
    - node: bold
      content: PHP式プログラミング入門
  - node: p
    children:
    - node: text
      content: Guide to expression-oriented programming in PHP
  - node: p
    children:
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: 2022.01.21
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: 仕事ではPHPという静的型付き関数型プログラミング言語を書いています
    - node: li
      children:
      - node: text
        content: 趣味ではEmacs Lispという雑草のような生命力の言語を書いています
  - node: p
    children:
    - node: bold
      content: '*'
  - node: p
    children:
    - node: text
      content: (出典： 『初めての人のためのLISP』)
  - node: p
    children:
    - node: bold
      content: '*'
  p3:
  - node: p
    children:
    - node: text
      content: 普段はEmacsという
    - node: br
    - node: text
      content: Lisp専用OSでPHP開発
    - node: br
    - node: text
      content: する環境を作ってます
  p4:
  - node: p
    children:
    - node: text
      content: 'こういうバック '
    - node: br
    - node: text
      content: 'グラウンドなので '
    - node: br
    - node: text
      content: 関数型よくわからない…
  p5:
  - node: p
    children:
    - node: text
      content: 'map/reduceが '
    - node: br
    - node: text
      content: '関数プログラミング '
    - node: br
    - node: text
      content: なんでしょ
  p6:
  - node: p
    children:
    - node: text
      content: 僕はあらゆるループを LispのLOOPマクロ で書きたい派なんで…
  p7:
  - node: p
    children:
    - node: text
      content: 'ちなみにLispはElixir '
    - node: br
    - node: text
      content: と同様に、基本的に returnを書けません
  p8:
  - node: p
    children:
    - node: text
      content: さて
  p9:
  - node: p
    children:
    - node: text
      content: 'PHPって '
    - node: br
    - node: text
      content: どういう言語
  p10:
  - node: p
    children:
    - node: text
      content: PHPはHTMLに書く言語？
  - node: p
    children:
    - node: text
      content: <!DOCTYPE html public>
  - node: p
    children:
    - node: text
      content: 現在は 時 分 秒です
  - node: p
    children:
    - node: text
      content: <p> <?= date('%H %i %s ') ?></p>
  p11:
  - node: p
    children:
    - node: text
      content: PHPスクリプト
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: echo "<!DOCTYPE html public>\n\n";
  - node: p
    children:
    - node: text
      content: 現在は 時 分 秒です
  - node: p
    children:
    - node: text
      content: echo "<p> ", date('%H %i %s '), "</p>\n";
  p12:
  - node: p
    children:
    - node: text
      content: 'こういうノリで '
    - node: br
    - node: text
      content: Webアプリがサクっと
    - node: br
    - node: text
      content: 書ける素朴な言語
  p13:
  - node: p
    children:
    - node: text
      content: PHPはこんな言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 汎用プログラミング言語 (Webだけではない)
    - node: li
      children:
      - node: text
        content: 昨今ではHTMLにそのまま埋め込むよりもクラス定義が主体
    - node: li
      children:
      - node: text
        content: <?php タグの内側のシンタックスはCっぽい
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: C言語っぽい {} を使った制御構造がある
        - node: li
          children:
          - node: text
            content: 式文が ; で終端する
  p14:
  - node: p
    children:
    - node: text
      content: PHPとクロージャ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 基本的にレキシカルスコープです
  p15:
  - node: p
    children:
    - node: text
      content: PHPとクロージャ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 基本的にレキシカルスコープです
    - node: li
      children:
      - node: text
        content: function ($a, $b)  { return $a + $b; } のような無名関数
  p16:
  - node: p
    children:
    - node: text
      content: PHPとクロージャ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 基本的にレキシカルスコープです
    - node: li
      children:
      - node: text
        content: function ($a, $b)  { return $a + $b; } のような無名関数
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 外側の変数をキャプチャするには明示が必要
          - node: br
          - node: text
            content: function ($a, $b) use ($c)  { return $a + $b + $c; }
  p17:
  - node: p
    children:
    - node: text
      content: PHPとクロージャ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 基本的にレキシカルスコープです
    - node: li
      children:
      - node: text
        content: function ($a, $b)  { return $a + $b; } のような無名関数
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 外側の変数をキャプチャするには明示が必要
          - node: br
          - node: text
            content: 'function ($a, $b) use ($c)  { return $a + $b + $c; } '
    - node: li
      children:
      - node: text
        content: PHP 7.4からは  fn($a, $b) => $a + $b + $c;
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 明示しなくても キャプチャできて便利
  p18:
  - node: p
    children:
    - node: text
      content: 'これだけ知れば おもしろいこと '
    - node: br
    - node: text
      content: いろいろできそう
  p19:
  - node: p
    children:
    - node: text
      content: ところで
  p20:
  - node: p
    children:
    - node: text
      content: '世の中にはいろんな '
    - node: br
    - node: text
      content: '制約を課した '
    - node: br
    - node: text
      content: プログラミングがある
  p21:
  - node: p
    children:
    - node: text
      content: セミコロンなしで Javaを書くとか
  p22:
  - node: p
    children:
    - node: text
      content: Pythonワンライナー
    - node: br
    - node: text
      content: とか
  p23:
  - node: p
    children:
    - node: text
      content: '$なしでPHPを '
    - node: br
    - node: text
      content: 書くとか
  p24:
  - node: p
    children:
    - node: text
      content: https://tadsan.fanbox.cc/posts/329540
  p25:
  - node: p
    children:
    - node: text
      content: 'これはこれで '
    - node: br
    - node: text
      content: おもしろい
  p26:
  - node: p
    children:
    - node: text
      content: (再掲)PHPはこんな言語
  - node: ul
