  - node: p
    children:
    - node: text
      content: 'こいつら目障り '
    - node: br
    - node: text
      content: じゃないですか？
  p28:
  - node: p
    children:
    - node: text
      content: 'セミコロンレス '
    - node: br
    - node: text
      content: Javaでは
  p29:
  - node: p
    children:
    - node: text
      content: https://horosora.hatenablog.com/entry/2018/08/03/162147より引用
  p30:
  - node: p
    children:
    - node: text
      content: '; だけじゃなくて '
    - node: br
    - node: text
      content: '{} も縛りたくない？'
  p31:
  - node: p
    children:
    - node: text
      content: 今回の本題
  p32:
  - node: p
    children:
    - node: text
      content: (再掲)PHPはHTMLに書く言語
  - node: p
    children:
    - node: text
      content: <!DOCTYPE html public>
  - node: p
    children:
    - node: text
      content: 現在は 時 分 秒です
  - node: p
    children:
    - node: text
      content: <p> <?= date('%H %i %s ') ?></p>
  - node: p
    children:
    - node: text
      content: ?> 直前は ; を削れる
  p33:
  - node: p
    children:
    - node: text
      content: すべての処理を <?= に押し込む
  p34:
  - node: p
    children:
    - node: text
      content: できれば一個の <?= に押し込む
  p35:
  - node: p
    children:
    - node: text
      content: 'PHPは式指向 '
    - node: br
    - node: text
      content: プログラミングできる
    - node: br
    - node: text
      content: 下地はいろいろある
  p36:
  - node: p
    children:
    - node: text
      content: PHPの特徴
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: スクリプト言語にありがちな定義せずに代入したら使える変数
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 代入は式！
    - node: li
      children:
      - node: text
        content: C言語とほぼ同じ制御構造なので if や while は {} または ; 必須
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: '分岐は条件演算子 $cond ? $then : $else でどうにか'
        - node: li
          children:
          - node: text
            content: ループは array_map(), array_reduce() でどうにか
  p37:
  - node: p
    children:
    - node: text
      content: これだけできれば チューリング完全 であることは自明
  p38:
  - node: p
    children:
    - node: text
      content: FizzBuzzを書いてみよう
  - node: p
    children:
    - node: text
      content: から を改行区切りで出力
  - node: p
    children:
    - node: text
      content: 1 100
  - node: p
    children:
    - node: text
      content: <?= implode(range(1, 100), "\n") ?>
  p39:
  - node: p
    children:
    - node: text
      content: FizzBuzzを書いてみよう
  - node: p
    children:
    - node: text
      content: から を に変換して改行区切りで出力
  - node: p
    children:
    - node: text
      content: 1 100 FizzBuzz
  - node: p
    children:
    - node: text
      content: <?= implode(array_map(
    - node: br
    - node: text
      content: 'fn(int $n): string => [[$n, ''Buzz''],          '
    - node: br
    - node: text
      content: '  [''Fizz'', ''FizzBuzz'']][$n%3==0][$n%5==0],'
    - node: br
    - node: text
      content: range(1, 100), "\n") ?>
  p40:
  - node: p
    children:
    - node: text
      content: 'こういうノリで map/reduceに '
    - node: br
    - node: text
      content: '変形できれば '
    - node: br
    - node: text
      content: 任意の処理が可能
  p41:
  - node: p
    children:
    - node: text
      content: パイプライン演算子が
    - node: br
    - node: text
      content: '欲しくなってくるぜ '
    - node: br
    - node: text
      content: (Lispならスレッドマクロがあるのに)
  p42:
  - node: p
    children:
    - node: text
      content: これはLispですね
  p43:
  - node: p
    children:
    - node: text
      content: そう思ったことが 私にもありました
  p44:
  - node: p
    children:
    - node: text
      content: ある日のこと…
  p45:
  - node: p
    children:
    - node: text
      content: https://qiita.com/perpouh/items/807775de16986a956d1c より引用
  p46:
  - node: p
    children:
    - node: text
      content: https://qiita.com/perpouh/items/807775de16986a956d1c より引用
  p47:
  - node: p
    children:
    - node: text
      content: これはやばい
  p48:
  - node: p
    children:
    - node: text
      content: https://qiita.com/perpouh/items/807775de16986a956d1c より引用
  - node: p
    children:
    - node: text
      content: 文を多用してるので fn() に置き換え困難
  p49:
  - node: p
    children:
    - node: text
      content: この路線の限界
  p50:
  - node: p
    children:
    - node: text
      content: array_map/
    - node: br
    - node: text
      content: array_reduceは あくまで配列処理
  p51:
  - node: p
    children:
    - node: text
      content: 無限ループできない
  p52:
  - node: p
    children:
    - node: text
      content: 旧式のfunctionでは自己再帰可能
  - node: p
    children:
    - node: text
      content: '変数を参照として '
    - node: br
    - node: text
      content: 'キャプチャしないと '
  - node: p
    children:
    - node: text
      content: '<?php '
  - node: p
    children:
    - node: text
      content: いけない
  - node: p
    children:
    - node: text
      content: $fib = function (int $n) use (&$fib) {
    - node: br
    - node: text
      content: '    return ($n < 2)         '
    - node: br
    - node: text
      content: '        ? 1         '
    - node: br
    - node: text
      content: '        : $fib($n - 1) + $fib($n -2);'
    - node: br
    - node: text
      content: '};'
  p53:
  - node: p
    children:
    - node: text
      content: アロー関数(fn)では自己再帰不能
  - node: p
    children:
    - node: text
      content: 'クロージャ作成時には '
    - node: br
    - node: text
      content: クロージャ自体は作られてない
  - node: p
    children:
    - node: text
      content: '<?php '
  - node: p
    children:
    - node: text
      content: ので束縛できない
  - node: p
    children:
    - node: text
      content: '$fib = fn (int $n) =>         '
    - node: br
    - node: text
      content: '    ($n < 2)                  ? 1         '
    - node: br
    - node: text
      content: '        : $fib($n - 1) + $fib($n -2);'
  p54:
  - node: p
    children:
    - node: text
      content: じゃあどうすればいい
  p55:
  - node: p
    children:
    - node: text
      content: そうですね
  p56:
  - node: p
    children:
    - node: text
      content: 不動点演算子
  p57:
  - node: p
    children:
    - node: text
      content: 'いわゆる '
    - node: br
    - node: text
      content: Yコンビネータ (Zコンビネータ)
  p58:
  - node: p
    children:
    - node: text
      content: Zコンビネータ
  p59:
  - node: p
    children:
    - node: text
      content: これで勝てる
  p60:
  - node: p
    children:
    - node: text
      content: 可読性重視版
  p61:
  - node: p
    children:
    - node: text
      content: 圧縮版
  p62:
