    text: 重厚なIDE…長大なコンパイル時間…
  p15:
  - kind: para
    text: スクリプト言語はシンプルなエディタで簡単に書ける！
  p16:
  - kind: para
    text: 2000年前後CGIで簡単にWebアプリが書ける
  p17:
  - kind: para
    text: 2010年前後Railsで高機能なものが簡単に書ける
  p18:
  - kind: para
    text: アプリケーションが大規模に「育つ」と収拾がつかなくなってくる
  p19:
  - kind: para
    text: メソッドの実装をわざわざ探してコードを読まなければ引数の種類すらわからん
