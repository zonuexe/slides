  p70:
  - kind: heading
    level: 1
    text: いろんなところから湧き出す
  - kind: heading
    level: 1
    text: 型の特定できないデータ
  p71:
  - kind: heading
    level: 1
    text: arrayは無限の可能性を秘める
  - kind: heading
    level: 1
    text: (悪い意味で)
  p72:
  - kind: heading
    level: 1
    text: 扱う対象が複数になったのに
  - kind: heading
    level: 1
    text: 型に反映されない
  p73:
  - kind: para
    text: PHPの組み込みの型機能ではどんなに型推論しても静的に型が定まらない
  p74:
  - kind: para
    text: 無限の可能性を秘めたarrayを放置するとコード全体のエントロピーが増大しプロジェクトは熱的死を迎える
  p75:
  - kind: heading
    level: 1
    text: TypeScriptにとっての型
  - kind: list
    items:
    - 型宣言をもとに型チェックを行なって、分析情報を報告
    - 実行時には型情報は何も残らない
    - JavaScriptにコンパイル ≒ 型定義の部分をひっぺがして実行
    - Node.js 25.2ではType Strippingで直接実行できるようになった
    - 実際にはTypeScript enum など別のコード生成をする機能もある
    - 型がついたコードは実行時にはエラーが出ないでほしい(願望)
  p76:
  - kind: heading
    level: 1
    text: PHPにとっての型
  - kind: list
    items:
    - 構文内の型宣言に含まれる型情報は実行時に必ず検証される
    - エラーなく動いているとき、型宣言と実行時の状態が必ず一致する
    - 実行時に検査するのは重そうだが(先入観) 実際にはJITで最適化
    - PHPDoc(コメント)に書いた型注釈はIDE/静的解析ツールが解釈する
    - PHPDocに書かれたものは机上の空論に過ぎない
  p77:
  - kind: heading
    level: 1
    text: 動的言語と型
  - kind: list
    items:
    - 自分のプロジェクト内で型を書き始めるのは簡単だが…
  - kind: para
    text: 現実には外部のライブラリで型が書かれていないこともある
  - kind: list
    items:
    - 型が書かれていても実態と一致しないこともよくある
    - Ruby, Python, JavaScriptでは外部プロジェクトで
  - kind: para
    text: ライブラリの型をメンテナンスされているものもある
  - kind: list
    items:
    - PHPでは実行時に強制力のある型宣言があるので、
  - kind: para
    text: 実装と一致した型がきちんと書かれていることが多い
  p78:
  - kind: para
    text: そんなに動的言語を書きたいか
  p79:
  - kind: heading
    level: 1
    text: 書きたい！
  p80:
  - kind: para
    text: 静的型付きと動的の良いとこどりができるゆるふわ言語PHPにこれからもご期待ください
