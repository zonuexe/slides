  - kind: heading
    level: 1
    text: '{'
  - kind: heading
    level: 1
    text: return $a + $b;
  - kind: heading
    level: 1
    text: '}'
  - kind: para
    text: 型宣言に反する値が返されたら実行時エラー
  p51:
  - kind: para
    text: 実際には型宣言をもとに型を再構築する
  p52:
  - kind: para
    text: PHP
  - kind: para
    text: $a = 1;$b = 2;$c = $a + $b;
  p53:
