    text: 世紀末救世主伝説
  - kind: para
    text: <?php
  p31:
  - kind: para
    text: 誰でも簡単にホームページが作れるゆるふわ言語
  p32:
  - kind: para
    text: PHPについてのパブリックイメージ
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  p33:
  - kind: para
    text: PHPについての認識は概ね間違い
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  p34:
  - kind: para
    text: 認識を揃えておきましょう
  p35:
  - kind: para
    text: 動的言語／スクリプト言語
  - kind: list
    items:
    - 実行時の宣言、evalなどプログラム自身を操作対象としながら実行できがち
    - スクリプト／インタプリタなどの特徴は直交する概念だが、結びつきがち
    - 関数・変数に静的な型がついてない言語でしょ、という回答は30点くらい
    - C#はいわゆる静的型付きの言語だが、dynamicとして動的な機能も提供
  p36:
  - kind: para
    text: 言語としてのPHP
  - kind: list
    items:
    - よくあるC言語風の制御構文と標準関数をもったスクリプト言語
    - if, else, switch, while, for, goto
    - PHPのgotoは綺麗なgoto
    - 関数定義、クラス定義(class, interface, trait, enum)
    - クラスや関数の再定義(オープンクラス・モンキーパッチ)はできない
  p37:
  - kind: para
    text: 動的言語でも型を書くことが広まってきた
  p38:
  - kind: para
    text: ドキュメントとしての型
  p39:
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p40:
  - kind: para
    text: /*** @param int $a* @param int $b* @return int|float*/
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p41:
  - kind: para
    text: 宣言の構文内にも型を書けるようになった
  p42:
  - kind: para
    text: 'function add(int $a, int $b): int|float{return $a + $b;}'
  p43:
  - kind: para
    text: 関数に入出力の型を書いておくことで影響を想像しやすく
  p44:
  - kind: para
    text: ここまでは人間が型を付ける(書く)話
  p45:
  - kind: para
    text: /*** @param int $a* @param int $b* @return int|float*/function add($a, $b)
      {return $a + $b;}
  p46:
  - kind: para
    text: DocCommentとかいう
  - kind: para
    text: 机上の空論
  - kind: para
    text: /*** @param int $a* @param int $b* @return int|float*/function add($a, $b)
      {return $a + $b;}
  p47:
  - kind: para
    text: DocCommentとかいう
  - kind: para
    text: 机上の空論
  - kind: para
    text: コーディング時のヒントとして役に立つ…
  - kind: para
    text: かもしれない
  - kind: para
    text: /*** @param int $a* @param int $b* @return int|float*/function add($a, $b)
      {return $a + $b;}
  p48:
  - kind: para
    text: 'function add(int $a, int $b): int|float{return $a + $b;}'
  p49:
  - kind: para
    text: intしか渡されないことは
  - kind: para
    text: 実行時に保証される
  - kind: para
    text: 'function add(int $a, int $b): int|float{return $a + $b;}'
  p50:
  - kind: para
    text: intしか渡されないことは実行時に保証される
  - kind: heading
    level: 1
