  p36:
  - kind: heading
    level: 1
    text: array (配列)
  - kind: para
    text: $a = array('a', 'b', 'c');$b = range(1, 10);$c = ['name' => $n , 'age' =>
      $y];
  - kind: para
    text: ほかの言語の配列や辞書(ハッシュ, 連想配列)とか呼ばれるもの
  - kind: para
    text: 内容にほかの型の値を含められる
  p37:
  - kind: heading
    level: 1
    text: object (オブジェクト)
  - kind: para
    text: $dt = new DateTime('2112-09-03');
  - kind: para
    text: $o = (object)['name' => $n , 'age' => $y];
  - kind: para
    text: クラスを実体化したものキャストするとstdClassになる
  - kind: para
    text: 内容にほかの型の値を含められる
  p38:
  - kind: heading
    level: 1
    text: シリアライズ
  - kind: para
    text: <?php$s = serialize('string');// "s:6:"string";"$a = serialize(['apple',
      'orange']);//=> "a:2:{i:0;s:5:"apple";i:1;s:6:"orange";}"
  - kind: para
    text: $obj = new stdClass;$obj->name = 'ミク'; $obj->age = 16;
  - kind: para
    text: //=> "O:8:"stdClass":2:{s:4:"name";s:6:"ミク";s:3:"age";i:16;}"
  p39:
