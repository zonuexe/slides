    - node: text
      content: 'callable (関数っぽくできる何か)タイプヒントにcallableって書ける

        単なる文字列・配列を紛れやすい

         最近は引数で受け渡すときはcallableよりも\Closureがオススメ

         PHP 7.1〜 \Closure::fromCallable()これでcallableをClosureに変換できる'
  p47:
