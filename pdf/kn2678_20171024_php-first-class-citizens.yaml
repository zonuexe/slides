  p26:
  - node: p
    children:
    - node: text
      content: 'string (文字列)$s = "string";

        echoとかで簡単に画面に出力できる

        $a[''str''] みたいな感じでキーになれる

        あらゆるバイナリ列を格納できる

        例: 画像ファイルの中身'
  p27:
  - node: p
    children:
    - node: text
      content: 'int (整数)$i = 12345;

        echoとかで簡単に画面に出力できる

        $a[0] みたいな感じでキーになれる

         PHP_INT_MINからPHP_INT_MAXの範囲のみ扱える (CPUのアーキテクチャ32bit, 64bitに依存)'
