  p46:
  - kind: heading
    level: 1
    text: callable (関数っぽくできる何か)
  - kind: para
    text: タイプヒントにcallableって書ける
  - kind: para
    text: 単なる文字列・配列を紛れやすい
  - kind: para
    text: 最近は引数で受け渡すときはcallableよりも\Closureがオススメ
  - kind: para
    text: PHP 7.1〜 \Closure::fromCallable()これでcallableをClosureに変換できる
  p47:
  - kind: heading
    level: 1
    text: callable (関数・メソッド)
  - kind: para
    text: <?php
  - kind: para
    text: $p = 'printf';$p('%s %s!', 'Hello', $p);
  - kind: para
    text: $c = \DateTimeImmutable::class;$dt = new $c;
  - kind: para
    text: $m = [$dt, 'format'];echo $m('Y-m-d H:i:s');
  p48:
  - kind: heading
    level: 1
    text: ファイル
  - kind: para
    text: <?php
  - kind: para
    text: if (is_development()) {$fp = fopen('php://stderr');} else$fp = fopen('/path/to/log.txt');}
  - kind: para
    text: $logger = new MyLogger($fp);$logger->write($data);
  p49:
