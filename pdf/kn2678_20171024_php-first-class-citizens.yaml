        (object)[''name'' => $n , ''age'' => $y];$o =          クラスを実体化したものキャストするとstdClassになる

        内容にほかの型の値を含められる'
  p38:
  - node: p
    children:
    - node: text
      content: 'シリアライズ<?php $s = serialize(''string''); // "s:6:"string";" $a = serialize([''apple'',
        ''orange'']);         //=> "a:2:{i:0;s:5:"apple";i:1;s:6:"orange";}" $obj = new stdClass; $obj->name
        = ''ミク''; $obj->age = 16; //=> "O:8:"stdClass":2:{s:4:"name";s:6:"ミク";s:3:"age";i:16;}"'
