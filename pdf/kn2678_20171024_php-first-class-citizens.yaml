  p41:
  - kind: heading
    level: 1
    text: Closure (無名関数)
  - kind: para
    text: $x2 = function ($n){return $n*2};
  - kind: para
    text: ローカル変数として関数を作ることができる
  - kind: para
    text: グローバル関数は一度定義すると(同名で)作り直すことはできないが、これは何回でも作って捨てられる！
  p42:
  - kind: para
    text: リソース(何者である何か)
  - kind: para
    text: $c = curl_init(); $g = gmp_init();
  - kind: para
    text: リソースって一括りにされてるけど互換性はない
  - kind: para
    text: http://php.net/resource
  - kind: para
    text: resourceは型宣言に書けない
  p43:
  - kind: heading
    level: 1
    text: リソースは型宣言できない
  - kind: para
    text: <?php
  - kind: para
    text: $f = function ($r) { var_dump($r); };$g = function (resource $r) { var_dump($r);
      };
  - kind: para
    text: $x = fopen('php://temp', 'r');
  - kind: para
    text: $f($x);$g($x);
  p44:
