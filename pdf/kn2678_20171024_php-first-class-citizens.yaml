    level: 1
    text: float (浮動小数点数)
  - kind: para
    text: $f =1.1; $l = PHP_INT_MAX + 1;
  - kind: para
    text: echoとかで簡単に画面に出力できる
  - kind: para
    text: 絶対に配列のキーにしてはいけない
  - kind: para
    text: エラーにもならずintに化ける
  - kind: para
    text: 基本的に等値比較(==, ===)してはいけない
  p31:
  - kind: heading
    level: 1
    text: bool (真理値)
  - kind: para
    text: $t = true; $f = (1 == 2);
  - kind: para
    text: そのままechoなどで出力できない
  - kind: para
    text: trueは1に化ける
  - kind: para
    text: falseは何も出力されない
  - kind: para
    text: 配列キーにすると
  p32:
  - kind: heading
    level: 1
    text: 結果を一時変数に保存する
  - kind: para
    text: <?php
  - kind: para
    text: if ($i == 1) echo '$iは1です';
  - kind: para
    text: $is_success = do_something();if ($is_success) {echo "成功";} else {echo "しっぱい。。。";}
