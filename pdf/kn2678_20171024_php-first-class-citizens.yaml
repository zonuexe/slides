  p26:
  - kind: heading
    level: 1
    text: string (文字列)
  - kind: para
    text: $s = "string";
  - kind: para
    text: echoとかで簡単に画面に出力できる
  - kind: para
    text: $a['str'] みたいな感じでキーになれる
  - kind: para
    text: あらゆるバイナリ列を格納できる
  - kind: para
    text: '例: 画像ファイルの中身'
  p27:
  - kind: heading
    level: 1
    text: int (整数)
  - kind: para
    text: $i = 12345;
  - kind: para
    text: echoとかで簡単に画面に出力できる
  - kind: para
    text: $a[0] みたいな感じでキーになれる
  - kind: para
    text: PHP_INT_MINからPHP_INT_MAXの範囲のみ扱える (CPUのアーキテクチャ32bit, 64bitに依存)
