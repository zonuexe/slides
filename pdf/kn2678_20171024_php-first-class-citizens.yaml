      content: callable (関数・メソッド)<?php $p = 'printf'; $p('%s %s!', 'Hello', $p); $c
        = \DateTimeImmutable::class; $dt = new $c; $m = [$dt, 'format']; echo $m('Y-m-d
        H:i:s');
  p48:
