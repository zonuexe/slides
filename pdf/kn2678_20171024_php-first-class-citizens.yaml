      content: 'Closure (無名関数)$x2 = function ($n){return $n*2};

         ローカル変数として関数を作ることができる

         グローバル関数は一度定義すると         (同名で)作り直すことはできないが、これは何回でも作って捨てられる！'
  p42:
  - node: p
    children:
    - node: text
      content: 'リソース(何者である何か)$c = curl_init(); $g = gmp_init();

         リソースって一括りにされてるけど互換性はない

        http://php.net/resource

        resourceは型宣言に書けない'
  p43:
  - node: p
    children:
    - node: text
      content: リソースは型宣言できない<?php $f = function ($r) { var_dump($r); }; $g = function
        (resource $r) { var_dump($r); }; $x = fopen('php://temp', 'r'); $f($x); $g($x);
