text:
  p1:
  - kind: heading
    level: 1
    text: 諸君とPHPと一級市民
  - kind: para
    text: First-class citizen in PHP with you
  - kind: para
    text: '2017-10-24 PHP勉強会@東京 #phpstudy'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社技術基盤チーム (pixiv.net)
    - Emacs Lisper, PHPer
    - 入社前は自宅警備をしながらRuby書いてた
    - Emacs PHP Modeのメンテナ引き継ぎました
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: はじめに
  p4:
  - kind: para
    text: プログラムは様々な要素の組み合せで構成される
  p5:
  - kind: para
    text: 様々な要素？
  p6:
  - kind: para
    text: PHPにおいては(ざっくり)、構文(文法), 数字, 文字列, 真理値,配列, リソース, 型, クラス, 関数,オブジェクト, インターフェイス,トレイト,
      ファイル, 外部API,データベース, HTMLテンプレート…etc.
  p7:
  - kind: para
    text: われわれはいろんなものを組み合せて作る
  p8:
  - kind: para
    text: どうやって？
  p9:
  - kind: heading
    level: 1
    text: いろんなものが現れる
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s){print '<li>'; print $s->name; print ‘</li>';}print
      '</ul>';
  p10:
  - kind: para
    text: お気付きか
  p11:
  - kind: para
    text: 階級制度
  p12:
  - kind: para
    text: いろんなものがある
  p13: []
  p14:
  - kind: para
    text: “第一級オブジェクト（ファーストクラスオブジェクト、ﬁrst-class object）は、あるプログラミング言語において、たとえば生成、代入、演算、（引数・戻り値としての）受け渡しといったその言語における基本的な操作を制限なしに使用できる対象のことである。ここで「オブジェクト」とは広く対象物・客体を意味し、必ずしもオブジェクト指向プログラミングにおけるオブジェクトを意味しない。”
  - kind: para
    text: –第一級オブジェクト (最終更新 2017-04-23 19:00:11)
  - kind: para
    text: https://ja.wikipedia.org/wiki/%E7%AC%AC%E4%B8%80%E7%B4%9A%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88
