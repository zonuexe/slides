text:
  p1:
  - kind: heading
    level: 1
    text: Real World PHP in pixiv改
  - kind: para
    text: pixiv 2016 SPRING BOOT CAMP
  - kind: para
    text: 2016年3月15日
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた / tadsan
    - 2012年11月にピクシブ入社
    - 入社前は自宅警備しながらRuby書いてた
    - pixivのPHPもろもろやってます
    - WEB+DB PressにPHPの記事を書きました
    - 好きなリスプはイーマックスリスプです
  p3:
  - kind: heading
    level: 1
    text: 注意
  - kind: list
    items:
    - 時間配分は考慮してない
    - 開発楽しい！とかじゃなく淡々と羅列するだけ
    - ゆっくり話すので、「お前何言ってんだ」と
  - kind: para
    text: 感じたらつっこみを入れてください
  - kind: list
    items:
    - 資料はあとで公開します
  p4:
  - kind: heading
    level: 1
    text: アジェンダ
  - kind: list
    items:
    - 現状についてだらだら話す
    - pixivのデプロイについて
    - pixivの開発環境について
    - pixivのPHPについて
    - pixivのSQLについて
    - そのほか
  p5:
  - kind: para
    text: GitLab (2015年10月頃)
  p6:
  - kind: para
    text: GitLab (2016年3月)
  p7:
  - kind: para
    text: pixiv.git (クラスのお友達)├ accounts.pixiv.net├ admin.pixiv.net├ api.pixiv.net├
      batch├ dev-script├ embed.pixiv.net├ m.pixiv.net├ me.pixiv.net├ oauth.pixiv.net├
      pixiv-lib├ public-api.pixiv.net
  - kind: para
    text: ├ rpc.pixiv.private├ sensei.pixiv.net├ source.pixiv.net├ spapi.pixiv.net├
      spotlight.pics├ ssl.pixiv.net├ touch.pixiv.net├ util├ vendor├ web-test└ www.pixiv.net
  p8:
  - kind: heading
    level: 1
    text: 変遷
  - kind: list
    items:
    - 以前(2013年頃まで)は、サブディレクトリ
  - kind: para
    text: ごとに独立したGitリポジトリで、共通部分
  - kind: para
    text: をsubmoduleとして扱ってた
  - kind: list
    items:
    - 共通部分の抽象化もうまくなされて居らず、
  - kind: para
    text: 重複・細部が異なるコードが分散してた
  p9:
  - kind: heading
    level: 1
    text: 変遷
  - kind: list
    items:
    - submoduleは疎結合なモジュールに適する
    - 結合度が高いモジュールのリポジトリを分
  - kind: para
    text: 割すると、変更コストが極めて高い
  - kind: list
    items:
    - リポジトリを統合することで凝集度を高め
  - kind: para
    text: るリファクタリングも断行しやすくなった
  - kind: list
    items:
    - 細部が異なる重複コード問題も根絶
  p10:
  - kind: heading
    level: 1
    text: デプロイ
  - kind: list
    items:
    - 基本的にサーバー全台(xx台程度)にrsync
    - 以前(2013年)はPHPファイルの増減を伴った
  - kind: para
    text: デプロイ時には(ページにもよるが)、
  - kind: para
    text: xxx件程度のエラーが発生してしまってた
  - kind: list
    items:
    - 現在はBlue-GreenDeploymentの確立で、
  - kind: para
    text: ファイルの追加/削除も怖いものではない
  p11: []
  p12:
  - kind: heading
    level: 1
    text: デプロイ (pploy)
  - kind: list
    items:
    - 汎用的なデプロイシステム
    - /.deploy ディレクトリにファイルを配置
    - bin/deploy スクリプトが実行される
    - readme.html で画面カスタマイズ可能
    - Gitに依存するので、特定のバージョンを
  - kind: para
    text: チェックアウトして反映することも容易
  p13:
  - kind: heading
    level: 1
    text: デプロイと変遷 (ブログ記事紹介)
  - kind: list
    items:
    - 開発・デプロイ環境の変遷 2014年春版
    - 履歴を残したまま複数のgitリポジトリを統
  - kind: para
    text: 合する
  - kind: list
    items:
    - pixivのデプロイを支えるpploy
    - 'github: edvakf/pploy'
    - WEB+DB PRESS Vol. 84
  p14:
  - kind: heading
    level: 1
    text: pixivの開発環境
  - kind: list
    items:
    - DBなどの依存が多く、ローカルに環境を構
  - kind: para
    text: 築することは容易ではない(不可能でもない)
  - kind: list
    items:
    - 共有の環境にSSHでログインして開発
    - 端末のEmacsやVimで開発するひとも
    - rsyncでローカルと同期してPhpStormなど
    - '@tadsanはTRAMPを利用してる'
  p15:
  - kind: heading
    level: 1
    text: pixivの開発環境
  - kind: list
    items:
    - ApacheのVirtualHostを大胆に活用
    - /home/www/にシンボリックリンクを作成
    - 社内ネットワークでDNS名前解決できる
    - www.tadsan.example.com のような形式
    - pixiv関係なくても任意のPHPを動作可能
    - OpenStackで同じ仕様のサーバー増やせる
  p16:
  - kind: heading
    level: 1
    text: pixiv-lib
  - kind: list
    items:
    - DBの操作を抽象化する層(DAO)
    - データの入出力などをまとめて扱う層
    - 社内では「Common層」と呼ばれる
    - セッション・国際化などの基盤機能
    - その他の共通処理いろいろ！
    - むかしはextlibって呼ばれてた (懐古)
  p17:
  - kind: heading
    level: 1
    text: pixivのPHPコード
  - kind: list
    items:
    - PHP 5.5 + Apache
    - URLを見ればわかる通り、ページ=PHP
    - search.php, member_illust.php など…
    - 一部のリクエストはHHVMで捌いてる
    - ルーティングのためmod_rewriteに依存
  p18:
  - kind: heading
    level: 1
    text: pixivのPHPコード
  - kind: list
    items:
    - 既存のフレームワークに依存しない
    - 独自フレームワークを運用してる部分もある
    - 口にすると顔をしかめられがちだが、
  - kind: para
    text: 用途に合せて設計ができるのは悪くない
  - kind: list
    items:
    - 何を使ったとしても、サービス提供者として
  - kind: para
    text: セキュリティの責任は変らない！
  p19:
  - kind: heading
    level: 1
    text: pixivのPHPコード
  - kind: list
    items:
    - 動的な言語機能は必要ない限り利用しない
    - コードの把握しやすさ、
    - クラスの静的メソッドを多用する
    - 継承は排除する方向
    - トレイトもあまり利用しない
    - リファレンスは原則排除する
    - PhpStormを使ってもつらいものはつらい
  p20:
  - kind: heading
    level: 1
    text: pixivのPHPコード (昨年10月)
  - kind: list
    items:
    - include_onceってたくさん書いてた！！
    - オートローディングの利用は限定的
    - pixiv-libでは現状は利用不可 (改善してた)
    - リポジトリ内に混在する都合上、
  - kind: para
    text: Composerのautoloadは利用しにくい
  - kind: list
    items:
    - 一部ではphpabで生成してinclude
  p21:
  - kind: heading
    level: 1
    text: pixivのPHPコード (現在)
  - kind: list
    items:
    - include_onceを撲滅した！！
    - オートローディングを大幅導入
    - pixiv-libでは完全移行が完了
    - シンプルなクラスローダを手書き
    - 一部ではphpabで生成してincludeしてる
  p22:
  - kind: heading
    level: 1
    text: pixivのPHPコード
  - kind: list
    items:
    - コミットログやコード内コメントは、
  - kind: para
    text: 英語または日本語で各人の得意な方で
  - kind: list
    items:
    - 意識高く「全部英語で」など拘らない
    - 必要な文章は論理的に誤りがないように
    - コミットのルールは厳格に定めない
    - 各人のやりかたを尊重する
    - 典型的な Github Flow で運用
  p23:
  - kind: heading
    level: 1
    text: loadset.php
  - kind: list
    items:
    - 各プロジェクトの初期化ファイル
    - エラーハンドラーの設定
    - 必要なライブラリのロード
    - 定数(deﬁne)の定義
    - loadsetのみrequire_onceで読み込む
    - そのほかは全部 include_once で
  p24:
  - kind: heading
    level: 1
    text: pixivのSQL
  - kind: list
    items:
    - MySQL 5.5
    - 文字列結合によるSQL組立つらすぎ…
    - ORマッパー/自動クエリビルダーは利用せず
    - 2015年の初旬からSQLに型をつけて安全に
  - kind: para
    text: 書けるライブラリを社内で運用
  - kind: list
    items:
    - 脆弱性対策の文脈で生まれたが書きやすい
  p25: []
  p26:
  - kind: heading
    level: 1
    text: pixivのSQL
  - kind: list
    items:
    - 'Q: なぜ自動クエリビルダー利用しないの？'
    - いままでが文字列結合で組み立ててたから
    - クエリが単純ではないパターンも多い
    - '例: ブックマークなど'
  p27:
  - kind: heading
    level: 1
    text: pixivのWebAPI
  - kind: list
    items:
    - いろんな試行錯誤をしてきた
    - 一部で有名なCSVのAPI (最初期)
    - ActiveResourceで利用するためのAPI
    - 提携企業向けRESTful API
    - 社内向けのシンプルなAPI (RPC)
    - スマートフォン用API (not REST)
  p28:
  - kind: heading
    level: 1
    text: pixivのWebAPI
  - kind: list
    items:
    - なぜRESTfulか? なぜRESTじゃないのか?
    - 慎重に判断する必要がある
    - API(RPC)から実行したい処理の粒度と
  - kind: para
    text: REST/CRUDの概念が馴染むとは限らない
  - kind: list
    items:
    - 外部公開するのでなければ、
  - kind: para
    text: 綺麗なURLの価値はあまり高くない
  p29:
  - kind: heading
    level: 1
    text: pixivのWebAPI 設計
  - kind: list
    items:
    - モバイルアプリはRESTを捨てる(採用しない)
  - kind: para
    text: 決断をした
  - kind: list
    items:
    - HTTP Methodも全てPOSTで受ける
    - 社内API(RPC)は Apache Thrift を採用した
    - どんなAPIが最適かは時と場合による
  p30:
  - kind: heading
    level: 1
    text: パッケージ管理
  - kind: list
    items:
    - Composerを利用
    - composer.pharはpixiv.gitに同梱
    - 社内ネットワーク内でSatisを運用
    - Jenkinsで定期的に更新
    - GitHubの障害があっても支障なし
    - 手動でパッケージ更新もできる
  p31:
  - kind: heading
    level: 1
    text: pixivのテスト
  - kind: list
    items:
    - 基本的にPHPUnitでテストを書く
    - 2013年頃にテストを書く文化が定着した
    - GitlabのMRにpushしたら自動テスト走る
    - うっかりmasterにpushされたら即座に
  - kind: para
    text: idobataに通知される
  p32:
  - kind: heading
    level: 1
    text: pixivのレビュー体制
  - kind: list
    items:
    - 毎週pixiv.gitに携る各チームのレビュアーで
  - kind: para
    text: 設計方針や最新の情報などを共有・相談
  - kind: list
    items:
    - レビュアーが各チームに持ち帰る
    - 各自メンバーに説明したり、レビュー過程
  - kind: para
    text: で指摘することで全体のコード品質を保つ
  - kind: list
    items:
    - ガイドラインや推奨スタイルの確立
  p33:
  - kind: heading
    level: 1
    text: そのほか
  - kind: list
    items:
    - pixivのデプロイ回数は一日およそ40回
    - ディレクターが文言変更をすることが多い
    - Jenkinsをいっぱい使ってる
    - cronの代替として
    - スクリプトのWebUIとしても利用できる
    - 各種エディタの勢力は均衡してる
  p34:
  - kind: heading
    level: 1
    text: ふろく (WEB+DB PHP連載)
  - kind: list
    items:
    - 特におもしろい記事
    - 'Vol.81: テストしにくいコード対策'
    - 'Vol.83: 安全なコーディングスタイル'
    - 'Vol.84: デプロイ・Composer運用'
    - 'Vol.87: PHPDoc記法で型注釈'
    - 'Vol.88: HHVMの運用'
    - 'Vol.91: 名前空間とオートローディング'
  p35:
  - kind: heading
    level: 1
    text: 続きはWebで
  - kind: list
    items:
    - https://github.com/pixiv
    - http://inside.pixiv.net/
    - GitHub (tadsan個人で公開してるもの)
    - BaguettePHP/simple-routing
    - BaguettePHP/http-accept-language
    - BaguettePHP/TetoSQL
