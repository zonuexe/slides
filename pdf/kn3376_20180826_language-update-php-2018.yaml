text:
  p1:
  - kind: heading
    level: 1
    text: Language Update PHP 2018
  - kind: para
    text: <?php
  - kind: para
    text: 2018-08-26 Learn Languages 2018
  - kind: para
    text: '#ll2018'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: heading
    level: 1
    text: 言語的なバックグラウンド
  - kind: list
    items:
    - '2004年頃: ISO-HTML'
    - '2006年頃: JavaScript'
    - '2010年頃: Ruby, 魔法言語 リリカル☆Lisp'
    - '2011年頃: Python, shell(Bash), F#/OCaml'
    - '2013年頃: Emacs Lisp, PHP'
  - kind: para
    text: 基本はWebから始まって動的言語やってきた
  p4:
  - kind: para
    text: <?php
  p5:
  - kind: para
    text: みんな大好きPHP
  p6:
  - kind: heading
    level: 1
    text: ですよね？
  - kind: para
    text: (暗黒微笑)
  p7:
  - kind: para
    text: リアルワールドでのシェアの割にプログラミング言語として興味関心の対象としてる人は多くない印象
  p8:
  - kind: para
    text: 😇
  p9:
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told you you should be using.I
      don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p10:
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”
  - kind: para
    text: –Rasmus Lerdorf
  p11:
  - kind: para
    text: 原作者のRasmusはプログラミング言語の設計にはあまり関心がない
  p12:
  - kind: para
    text: おしながき
  p13:
  - kind: para
    text: 1. PHPの開発体制2. 言語としての特徴3. 最近の動向と「次」
  p14:
  - kind: para
    text: PHPの開発体制
  p15:
  - kind: para
    text: Rasmusは「最初の開発者」であってGuidoやMatzのようなBDFLではない
  - kind: para
    text: (Wikipediaの一覧には載ってるけど…)
  p16:
  - kind: para
    text: 機能追加や改廃はRFCにまとめられMLで議論された後にコミッターによる投票で決まるプロセス
  - kind: para
    text: https://wiki.php.net/rfc/voting
  p17:
  - kind: para
    text: PHPの行く末を知りたければRFCをウォッチすればよい
  p18:
  - kind: para
    text: https://wiki.php.net/rfc
  p19:
  - kind: para
    text: https://php-rfc-watch.beberlei.de/
  p20: []
  p21:
  - kind: para
    text: https://wiki.php.net/rfc
  p22:
  - kind: para
    text: 言語としての
  - kind: para
    text: 特徴
  p23:
  - kind: para
    text: Webアプリを最もゆるふわ簡単に構築できる言語
  p24:
  - kind: para
    text: 昔ながらのCGIと同じくレンタルサーバー借りてファイルを置けば設置完了
  p25:
  - kind: para
    text: 現在ではレン鯖にFTPで転送とかよりHerokuにgit pushした方がずっと簡単じゃね？と僕も思ってるけど、PHPが利用される界隈的にそこまで主流の選択肢とはされない感じがある
  p26:
  - kind: para
    text: PHPは様々な要素を併せ持つ
  p27:
  - kind: para
    text: 1. HTMLテンプレート2. PerlっぽいCGI 3. Javaっぽいクラス
  p28:
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”
  - kind: para
    text: –Rasmus Lerdorf
  p29:
  - kind: heading
    level: 1
    text: ほかの言語にあるよ
  - kind: heading
    level: 1
    text: うな機能は概ねある
  - kind: para
    text: 計算機科学の教授が使えと言ってるものは全部
  - kind: para
    text: 全部とは言ってない↑↑↑
  p30:
  - kind: para
    text: 抽象クラス, トレイト, インターフェイス, ジェネレータ, イテレータ, クロー
  - kind: para
    text: ジャ, 函数の動的呼び出し, 無名クラス, eval, 型宣言, 連想配列, リフレクションAPI, 自己文書化, 標準入出力の
  - kind: para
    text: 読み書き, REPL, クラスの遅延ロード
  p31:
  - kind: heading
    level: 1
    text: イテレータ・ジェネレータ
  - kind: para
    text: foreachでイテレーションできるモノをユーザー定義で作れる
  - kind: para
    text: ストリーム(遅延リスト・無限リスト)も当然扱える
  - kind: para
    text: 創意工夫でかなりの使いでがある
  p32:
  - kind: heading
    level: 1
    text: トレイト (trait)
  - kind: para
    text: 継承なしでクラスに実装追加できる
  - kind: para
    text: 複数トレイトの衝突を解決できる
  - kind: para
    text: 優先順位の定義・メソッド名変更
  - kind: para
    text: つまり「本物の」トレイトの実装
  - kind: para
    text: Nathanael Schärli, Stéphane Ducasse, Oscar Nierstrasz, Andrew P. Black(2002)
  - kind: para
    text: 'Traits: Composable Units of Behaviour'
  p33:
  - kind: heading
    level: 1
    text: クラスの遅延ロード
  - kind: para
    text: 実行時に未定義クラスが登場したときにファイルを読み込むロジックをユーザー定義できる
  - kind: para
    text: いちいちrequire_onceを書かない
  - kind: para
    text: 不必要なファイルが読み込まれない
  - kind: para
    text: AOP メタプログラミングの温床
  - kind: para
    text: Composerを利用するのが鉄板構成
  p34:
  - kind: para
    text: 最近の動向
  p35:
  - kind: para
    text: PHP7.0は12月1日前後にリリースされるスケジュールで概ね固定されてる
  p36:
  - kind: para
    text: http://php.net/supported-versions.php
  p37:
  - kind: para
    text: 2年間のメンテと1年間のセキュリティ修正
  p38:
  - kind: para
    text: 大事なお知らせです
  p39:
  - kind: para
    text: 2004年から長らくご愛顧いただいだきましたPHP5.xの公式サポートは2018年をもって完全に終了いたします。
  - kind: para
    text: (5.6のSecurity fixes終了)
  p40:
  - kind: para
    text: ついでにPHP7.0のSecurity fixesも12月3日に終了するので7.1または7.2系にアップデートしましょう。
  p41:
  - kind: para
    text: あくまでThe PHP Groupからのリリースの話なので、脆弱性が出たら各ディストリ独自のアップデートがあると思いますが。
  p42:
  - kind: para
    text: ご安全に。
  p43:
  - kind: heading
    level: 1
    text: 最近の動向
  - kind: para
    text: (言語コア)
  p44:
  - kind: para
    text: PHP 5.6→ 7.0
  p45:
  - kind: para
    text: これは内部構造の最適化と型宣言の追加が目玉
  p46:
  - kind: para
    text: http://d.hatena.ne.jp/hnw/20160828
  p47:
  - kind: para
    text: PHP 7.1以降
  p48:
  - kind: para
    text: 微妙に書きにくかった文法の修正と危険な機能の非推奨化(削除)が中心
  p49:
  - kind: heading
    level: 1
    text: PHP 7.1
  - kind: para
    text: nullableの追加
  - kind: para
    text: 函数戻り値にvoidが書けるように
  - kind: para
    text: 配列分解の短縮構文
  - kind: para
    text: クラス定数に可視性を定義可能に
  - kind: para
    text: private const
  p50:
  - kind: heading
    level: 1
    text: PHP 7.2
  - kind: para
    text: 型宣言にobjectが書けるように
  - kind: para
    text: 継承時にメソッドの型宣言を省略可
  - kind: para
    text: クラスのグループ表記ケツカンマ可
  p51:
  - kind: heading
    level: 1
    text: PHP 7.3 (12月リリース予定)
  - kind: para
    text: 7月にfeature freezeされ現在beta2
  - kind: para
    text: 函数呼び出し引数のケツカンマ可
  - kind: para
    text: ヒアドキュメント／nowdocの改善
  - kind: para
    text: 終端行判定がシビアだったのが緩和
  - kind: para
    text: 行頭空白をトリムできるように
  p52:
  - kind: para
    text: PHP 7.4?
  p53:
  - kind: heading
    level: 1
    text: PHP 7.4
  - kind: para
    text: typed propertyが入る…かも(議論中)
  - kind: para
    text: これは比較的確度高そう
  - kind: para
    text: Fiberが入る… かも(議論中)
  - kind: para
    text: PHPで非同期処理は伝統的に鬼門
  - kind: para
    text: 取り込まれるまでハードル高そう
  p54:
  - kind: heading
    level: 1
    text: PHP 8?
  - kind: para
    text: PHP5時代の負債っぽい仕様は一掃？
  - kind: para
    text: 臆測です
  - kind: para
    text: JITが入る…?
  - kind: para
    text: ほんとにうまくいくの？
  - kind: para
    text: ローカル変数の型付け？
  - kind: para
    text: typed propertyの流れで視野内
  p55:
  - kind: heading
    level: 1
    text: 最近の動向
  - kind: para
    text: (関連コミュニティ)
  p56:
  - kind: heading
    level: 1
    text: PHPカンファレンスは活発
  - kind: para
    text: 2018年はPHPコミュニティ・カンファレンスが活発化した一年だった
  - kind: para
    text: iOSDC主宰の長谷川さん(@tomzoh)がPHPカンファレンスと別にPHPer Kaigiを開催してコミュニティに火をつけた
  - kind: para
    text: 各地域のCFP応募数が倍増した
  p57:
  - kind: heading
    level: 1
    text: 2018年のPHPカンファレンス
  - kind: para
    text: 2019年は既に例年以上の開催告知
  - kind: para
    text: PHPerKaigi 2019
  - kind: para
    text: '地域: 福岡/仙台(New!)/札幌'
  - kind: para
    text: 'フレームワーク: CakePHP, Laravel'
  p58:
  - kind: heading
    level: 1
    text: PhpStormの普及
  - kind: para
    text: JetBrains社のPHP(+WEB)専用IDE
  - kind: para
    text: 静的解析機能がめっちゃ※強い(PHP比)
  - kind: para
    text: 入力補完やエラー表示が強い
  - kind: para
    text: 簡単な型推論はしてくれる
  - kind: para
    text: PHPDocの型記述を読んでくれる
  - kind: para
    text: リファクタリング機能がある
  p59:
  - kind: heading
    level: 1
    text: PHPと静的解析
  - kind: para
    text: PhpStorm登場以前は単純なコードのスタイルや複雑度を検査するものが多かった
  - kind: para
    text: PhpStorm以後は変数のスコープや静的な型検査をベースにチェックできるツールが増えた
  - kind: para
    text: Phan, PHPStan, Psalm
  p60:
  - kind: heading
    level: 1
    text: PHPDocの現状
  - kind: para
    text: ポピュラーなライブラリやフレームワークはPHPDocが整備されてるので、PhpStormを入れるだけで十分補完が機能する状態
  - kind: para
    text: 一方で仕様の標準化と実装は難航
  - kind: para
    text: PhpStormがPSR-5入れてくれない
  - kind: para
    text: IntersectionType(非標準)入りそう
  p61:
  - kind: heading
    level: 1
    text: 並列処理・非同期処理
  - kind: para
    text: PHPでは実行モデル的に鬼門↑情報科学の教授に怒られそう
  - kind: para
    text: それを解決しようとする動きがある
  - kind: para
    text: Swoole https://www.swoole.com/
  - kind: para
    text: Fiber(RFC) https://wiki.php.net/rfc/fiber
  - kind: para
    text: PHP-Promise(ext)
  - kind: para
    text: https://github.com/php-promise/promise
  p62:
  - kind: heading
    level: 1
    text: 書籍
  - kind: para
    text: あんまり景気よくなさそう
  - kind: para
    text: 初心者向けの入門書は結構出てる
  - kind: para
    text: 最新のモダンな開発事情を伝えるものはずっと出てない
  - kind: para
    text: パーフェクトPHPは2014年
  - kind: para
    text: いまがんばって企画書を書いてます
  p63:
  - kind: para
    text: まとめ
  p64:
  - kind: para
    text: PHPの活用領域は多様
  p65:
  - kind: para
    text: 言語としては従来の「負債」を解消する方向の変更が多い
  p66:
  - kind: para
    text: PHPを継続的に静的解析できる環境が既に揃ってるので既存プロジェクトの改善や新規開発の効率化の大きな武器になる
