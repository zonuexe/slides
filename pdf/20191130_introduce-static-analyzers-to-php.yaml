    - node: br
    - node: text
      content: '    volumes:'
    - node: br
    - node: text
      content: '      - ./:/var/www/html:cached'
    - node: br
    - node: text
      content: '    entrypoint: php /root/.composer/vendor/bin/phan'
    - node: br
    - node: text
      content: '    working_dir: /var/www/html         '
