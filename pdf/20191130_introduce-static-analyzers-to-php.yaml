text:
  p1:
  - kind: para
    text: PHPプロジェクトに
  - kind: para
    text: 静的解析を新規導入する
  - kind: para
    text: Introduce static analyzers to PHP project
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv事業本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5: []
  p6:
  - kind: para
    text: 本日のお題
  p7: []
  p8: []
  p9: []
  p10:
  - kind: para
    text: さて
  p11:
  - kind: para
    text: PHPカンファレンス
  - kind: para
    text: '2016'
  p12: []
  p13:
  - kind: para
    text: まだユニットテストと同
  - kind: para
    text: 様に
  - kind: para
    text: ｢
  - kind: para
    text: あって当然
  - kind: para
    text: ｣
  - kind: para
    text: のもの
  - kind: para
    text: とまでは普及できてない
  p14: []
  p15:
  - kind: para
    text: 既存のプロジェクトに
  - kind: para
    text: 導入する話は
  - kind: para
    text: あまりできてなかった
  p16: []
  p17:
  - kind: para
    text: なぜ静的解析を
  - kind: para
    text: するのか
  p18:
  - kind: para
    text: 関数がどのような引数
  - kind: para
    text: を期待しどんな値を
  - kind: para
    text: 返すのか明示したい
  p19:
  - kind: para
    text: プログラムが
  - kind: para
    text: 間違ってることを
  - kind: para
    text: 実行前に検証したい
  p20:
  - kind: para
    text: それ以上に
  p21:
  - kind: para
    text: オブジェクトのメソッド
  - kind: para
    text: やプロパティが適切に補完されると気持ち良い
  p22:
  - kind: para
    text: 補完がきちんと機能
  - kind: para
    text: するようにPHPに
  - kind: para
    text: 型をつけていこう
  p23:
  - kind: para
    text: ただし
  p24:
  - kind: para
    text: 静的解析は
  - kind: para
    text: ､
  - kind: para
    text: 現に
  - kind: para
    text: ｢
  - kind: para
    text: 動いている
  - kind: para
    text: ｣
  - kind: para
    text: 事実を
  - kind: para
    text: 覆すものではない
  p25:
  - kind: para
    text: エラーとして見えないが
  - kind: para
    text: ｢
  - kind: para
    text: たまたま動いている
  - kind: para
    text: ｣
  - kind: para
    text: 現実
  - kind: para
    text: を炙り出すことはある
  p26:
  - kind: para
    text: 変更によって動かなく
  - kind: para
    text: なってしまうことを
  - kind: para
    text: ｢
  - kind: para
    text: 動かさずに
  - kind: para
    text: ｣
  - kind: para
    text: 発見できる
  - kind: para
    text: かもしれない
  p27:
  - kind: para
    text: 静的解析基盤を整えた
  - kind: para
    text: 瞬間に致命的な問題を
  - kind: para
    text: 検出できることはまれ
  p28:
  - kind: para
    text: ということで静的
  - kind: para
    text: 解析をしましょう
  p29:
  - kind: para
    text: 静的解析
  - kind: para
    text: ツールの種類
  p30:
  - kind: para
    text: 現行の高度な静的解析ツール
  - kind: para
    text: PhpStorm (IDE)
  - kind: para
    text: Phan
  - kind: para
    text: PHPStan
  - kind: para
    text: Psalm
  p31:
  - kind: para
    text: PhpStorm
  - kind: para
    text: よいところ
  - kind: para
    text: 導入が最も簡単
  - kind: para
    text: 十分な精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: エラーの列挙ができないのでCIのフローに組み込めない
  p32:
  - kind: para
    text: Phan
  - kind: para
    text: よいところ
  - kind: para
    text: 導入は比較的簡単
  - kind: para
    text: とても高い精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: 大規模プロジェクトでは解析に時間がかかる
  p33:
  - kind: para
    text: PHPStan
  - kind: para
    text: よいところ
  - kind: para
    text: 実行時情報を使用し高速
  - kind: para
    text: 高い精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: Composer以外の依存関係があると導入にコツが要る
  p34:
  - kind: para
    text: Psalm
  - kind: para
    text: よいところ
  - kind: para
    text: 独自の引数アサーション
  - kind: para
    text: 高い精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: 大規模プロジェクトでは解析に時間がかかる
  p35:
  - kind: heading
    level: 1
    text: 静的解析の選択軸
  - kind: para
    text: Phan PHPStan
  - kind: para
    text: 定義のみ実行が必要
  - kind: para
    text: 解析方法
  - kind: para
    text: 実行しない(静的)
  - kind: para
    text: (静的と動的のmix)
  - kind: para
    text: 依存関係
  - kind: para
    text: php-ast (高速/C拡張)
  - kind: para
    text: Tolerant PHP Parser(低速)
  - kind: para
    text: PHP-Parser
  - kind: para
    text: 対象ファイルを
  - kind: para
    text: 解析単位プロジェクトおよび依存ライブラリ全体
  - kind: para
    text: 個別指定
  p36:
  - kind: para
    text: つまりどれがいいのか (CI)
  - kind: para
    text: 現時点ではそれぞれのツールで検出項目に一長一短があるため、使い分けるとよい
  - kind: para
    text: PHPStanは高速なのでGitでブランチにpushするごとに検査するようなCIと相性がよい
  p37:
  - kind: para
    text: PHPStanの制約
  - kind: para
    text: クラス/関数/定数の定義と副作用のある処理は明確に分かれていないといけない
  - kind: para
    text: つまり、PSR-1
  - kind: para
    text: Phanなら定義と処理が混在したファイルも解析できる
  p38:
  - kind: heading
    level: 1
    text: こういうコードはPHPStanで解析できない
  - kind: para
    text: <?php include __DIR__ . '/config.php';
  - kind: para
    text: $connection = new PDO(DSN);drop_table($connection);exit;
  - kind: para
    text: function drop_table($connection){$connection->exec('DROP TABLE `users`;');}
  p39:
  - kind: para
    text: 静的解析を
  - kind: para
    text: 導入しよう
  p40: []
  p41: []
  p42: []
  p43:
  - kind: para
    text: CakePHP 4.0.0では
  - kind: para
    text: PHPStanとPsalmで
  - kind: para
    text: 型定義が大幅に改善
  - kind: para
    text: (現在RC1)
  p44:
  - kind: para
    text: じゃあPhanを
  - kind: para
    text: 入れるか
  p45:
  - kind: para
    text: 基本は
  - kind: para
    text: か
  - kind: para
    text: composer require
  - kind: para
    text: Pharファイルを
  - kind: para
    text: ダウンロードするだけ
  p46:
  - kind: para
    text: forteeは
  - kind: para
    text: レガシー
  - kind: para
    text: を自称しているが
  - kind: para
    text: Docker Compose
  p47:
  - kind: para
    text: Docker Compose
  - kind: para
    text: 使ったことない僕の方が
  - kind: para
    text: レガシーなんですけど…
  p48:
  - kind: para
    text: Docker Phan
  - kind: para
    text: '[検索]'
  p49:
  - kind: heading
    level: 1
    text: 🙅
  - kind: para
    text: だめです
  p50: []
  p51: []
  p52:
  - kind: para
    text: 古すぎる！
  p53:
  - kind: para
    text: Phanはほぼ毎週
  - kind: para
    text: アップデートされて
  - kind: para
    text: さまざまな改善がある
  p54:
  - kind: para
    text: 最新のPhanだけが
  - kind: para
    text: 良いPhanだ
  p55:
  - kind: para
    text: Phanの要求環境
  - kind: para
    text: 基本的に普通のPHPイメージ
  - kind: para
    text: ext-ast (PECL ast)は必須
  - kind: para
    text: Xdebugは無効化したい
  - kind: para
    text: パフォーマンスに影響する
  - kind: para
    text: ext-pcntl, ext-iconv,ext-mbstringも推奨
  p56:
  - kind: heading
    level: 1
    text: Dockerﬁleにphp-astを足す
  - kind: para
    text: RUN pecl install ast \&& docker-php-ext-enable ast
  p57:
  - kind: heading
    level: 1
    text: astをデフォルト有効化したくなければ
  - kind: para
    text: RUN pecl install ast
  p58:
  - kind: para
    text: 別のコンテナイメー
  - kind: para
    text: ジに分割したい場合
  p59:
  - kind: heading
    level: 1
    text: docker/phan/Dockerﬁle
  - kind: para
    text: FROM php:7.3-cli RUN apt-get update -y \&& apt-get install -y --no-install-recommends
      \libicu-dev \unzip RUN docker-php-ext-install -j$(nproc) intl pcntl
  - kind: para
    text: RUN pecl install ast && docker-php-ext-enable ast
  - kind: para
    text: COPY --from=composer /usr/bin/composer \/usr/bin/composer
  - kind: para
    text: RUN composer global require phan/phan ENTRYPOINT php /root/.composer/vendor/bin/phan
      WORKDIR /var/www/html
  p60:
  - kind: heading
    level: 1
    text: docker-compose.yml
  - kind: para
    text: 'version: "3.7"services:phan:build: ./docker/phan volumes:- ./:/var/www/html:cached
      entrypoint: php /root/.composer/vendor/bin/phan working_dir: /var/www/html'
  p61:
  - kind: para
    text: 独立したコンテナに分ける
  - kind: para
    text: メリットも大きくない気がする
  - kind: para
    text: ので既存のPHP用コンテナに
  - kind: para
    text: 混ぜ込めばいいと思います
  p62:
  - kind: para
    text: composer require --devを使うべき？
  - kind: para
    text: 好みでどうぞ
  - kind: para
    text: アプリケーションと依存関係が混ざるのでメンテ難しいと思います
  - kind: para
    text: 僕はサブディレクトリにcomposer.json作ります
  - kind: para
    text: composer-bin-pluginを使ってもいいかも
  p63:
  - kind: para
    text: 以後./phan という
  - kind: para
    text: ラッパースクリプト
  - kind: para
    text: を使うことにします
  p64:
  - kind: heading
    level: 1
    text: ./phan
  - kind: para
    text: '#!/usr/bin docker-compose run --rm php-cli \.phan/vendor/bin/phan "$@"'
  - kind: para
    text: Windowsならphan.batってファイルを作って %* あたりでパラメータ展開すれば動くと思うけど、詳しいことはWindowsに詳しいひとに任せた！
  p65:
  - kind: para
    text: phan --initで初期化できる
  - kind: para
    text: .phan/config.phpが生成される
  - kind: para
    text: 自動追加されなかったdirectory_listを追加していく
  - kind: para
    text: composer requireで直接依存するパッケージだけが自動追加される
  p66:
  - kind: para
    text: 基本的な使いかた
  - kind: para
    text: ./phan
  - kind: para
    text: -o phan.log結果をphan.logに書き出す
  - kind: para
    text: -j 4並列実行数。CPUのコア数を指定するのが良い (諸説あり)
  p67:
  - kind: para
    text: baseline
  - kind: para
    text: --save-baseline=.phan/baseline.php を付けて実行するとファイルごとに検出されたIssueを保存できる
  - kind: para
    text: --load-baseline で実行すると新たに増えたものだけ報告される
  p68:
  - kind: para
    text: suppress_issue_types
  - kind: para
    text: 報告しないIssueをリストアップ
  - kind: para
    text: フレームワーク側に問題があるなら握り潰すしかない…
  - kind: para
    text: ある程度の妥協も時には必要
  - kind: para
    text: CakePHP 4.0になればおそらくほぼ消せるでしょう
  p69:
  - kind: para
    text: tadsanのよくやる手法
  - kind: para
    text: masterブランチの内容をphan-master.logに書き出す
  - kind: para
    text: リファクタリングして変更の都度解析結果をphan.logに書き出す
  - kind: para
    text: diff -u phan-master.log phan.log
  p70:
  - kind: para
    text: 実際に検出
  - kind: para
    text: されたミス
  p71:
  - kind: heading
    level: 1
    text: 未定義変数の検出
  - kind: para
    text: $part変数が未定義
  p72:
  - kind: heading
    level: 1
    text: 未定義変数の検出
  - kind: para
    text: $videoEmbedHtmlと$slideEmbedHtmlが未定義
  p73:
  - kind: heading
    level: 1
    text: deprecatedコードの検出
  - kind: para
    text: CakePHP 4.0.0でプロパティにアクセス
  - kind: para
    text: できなくなる
  p74:
  - kind: heading
    level: 1
    text: 未定義クラスの検出
  - kind: para
    text: use Exceptionがないので
  - kind: para
    text: 現在の名前空間を指してる
  p75:
  - kind: para
    text: 'おまけ: 謎のException'
  - kind: para
    text: 3箇所くらいで登場
  - kind: para
    text: どれもAuraを直接使ってない
  - kind: para
    text: たぶんPhpStormの自動挿入
  p76:
  - kind: heading
    level: 1
    text: コンストラクタで値を返す
  - kind: para
    text: 値を返せない(単にreturn;でよい)
  p77:
  - kind: para
    text: そろそろまとめ
  p78:
  - kind: para
    text: 実際稼動しているアプリ
  - kind: para
    text: なので致命的な問題は
  - kind: para
    text: なかなか見つからない
  p79:
  - kind: para
    text: リファクタリングや
  - kind: para
    text: フレームワークの
  - kind: para
    text: バージョンアップでは
  - kind: para
    text: 大きな武器になる
  p80:
  - kind: para
    text: 地味なものも
  - kind: para
    text: 目立つが地道に
  - kind: para
    text: 潰していこう
  p81:
  - kind: para
    text: おまけ
  p82:
  - kind: para
    text: 今回forteeのコードで
  - kind: para
    text: 初めてDocker Compose
  - kind: para
    text: で
  - kind: para
    text: 構築されたPHPアプリ
  - kind: para
    text: ケーションに触れた
  p83:
  - kind: heading
    level: 1
    text: 🤔
  - kind: para
    text: なるほどわからん
  p84:
  - kind: para
    text: 手持ちのレガシーPHP
  - kind: para
    text: をDocker Compose
  - kind: para
    text: に載せてみるか
  p85: []
  p86: []
  p87:
  - kind: para
    text: Vagrant →
  - kind: para
    text: Docker Compose
  p88:
  - kind: para
    text: phpdotenv
  - kind: para
    text: .env → conf/.env
  p89:
  - kind: para
    text: docker-composeを
  - kind: para
    text: 噛ませてsetupスクリプト
  - kind: para
    text: を
  - kind: para
    text: 実行できるように
  - kind: para
    text: 場所を変更
  p90:
  - kind: para
    text: php -S →
  - kind: para
    text: Apache HTTP
  p91:
  - kind: para
    text: 初めてでも
  - kind: para
    text: できちゃった
