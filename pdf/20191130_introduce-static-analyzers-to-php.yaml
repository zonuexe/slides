    - node: br
    - node: text
      content: RUN apt-get update -y \
    - node: br
    - node: text
      content: '    && apt-get install -y --no-install-recommends \'
    - node: br
    - node: text
      content: '        libicu-dev \'
    - node: br
    - node: text
      content: '        unzip'
    - node: br
    - node: text
      content: RUN docker-php-ext-install -j$(nproc) intl pcntl
  - node: p
    children:
    - node: text
      content: RUN pecl install ast && docker-php-ext-enable ast
  - node: p
    children:
    - node: text
