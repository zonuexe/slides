    text: 正規表現
  - kind: para
    text: vsパトリシアトライ
  p73: []
  p74:
  - kind: para
    text: 選ばれたのはパトリシアトライでした
  p75:
  - kind: para
    text: パトリシアトライを実装しよう
  - kind: list
    items:
    - 正規表現に比べアルゴリズムが素朴で、実装もめちゃくちゃ簡単
    - パスのリストから “/” でネストした多次元の連想配列に変換するだけ
    - 可変パラメータは数値と文字列のみ対応 (複雑なパターンも対応は可能)
    - 構築コストはルーティング数によって線形増加するが、十分許容できる
    - キャッシュも可能だが、いまのところはボトルネックになっていない
    - マッチしない場合も処理時間のペナルティがない
  p76:
