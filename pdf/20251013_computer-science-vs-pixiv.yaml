  p66:
  - kind: para
    text: 正規表現ベース実装
  - kind: list
    items:
    - 全部のルーティング対象のパスを結合したパターンを構築して、
  - kind: para
    text: リクエストされたパスをマッチさせる
  - kind: list
    items:
    - めちゃくちゃ力技っぽく見えるが… アイディアはシンプル
    - ところで… 現代の実用的な正規表現エンジンはJITコンパイルされ、速い
  p67:
  - kind: para
    text: 基数木(パトリシアトライ)
  - kind: list
    items:
    - パスを “/" で区切りってネストした連想配列を構築する
  p68:
  - kind: heading
    level: 1
    text: 基数木(パトリシアトライ)
  - kind: list
    items:
    - パスを “/" で区切りってネストした連想配列を構築する
  - kind: para
    text: 'get ''/'', to: ''index''get ''/xxx'', to: ''xxx#index''get ''/xxx/:id'',
      to: ''xxx#shoq''get ''/xxx/yyy'', to: ''yyy''get ''/xxx/zzz’, to: ''zzz'''
  p69:
  - kind: heading
    level: 1
    text: 基数木(パトリシアトライ)
  - kind: list
    items:
    - パスを “/" で区切りってネストした連想配列を構築する
  - kind: para
    text: 'get ''/'', to: ''index''get ''/xxx'', to: ''xxx#index''get ''/xxx/:id'',
      to: ''xxx#shoq''get ''/xxx/yyy'', to: ''yyy''get ''/xxx/zzz’, to: ''zzz'''
  - kind: para
    text: '{"", : {"#result": "index"}"xxx", : {"": {"#result": "xxx#index"},":id":
      {"#result": "xxx#show"},"yyy": {"#result": "yyy"},"zzz": {"#result": "zzz"},...'
  p70:
