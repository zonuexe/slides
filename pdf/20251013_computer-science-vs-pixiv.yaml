  - kind: para
    text: 'get ''/'', to: ''index'''
  - kind: para
    text: 'get ''/xxx'', to: ''xxx#index'''
  - kind: para
    text: 'get ''/xxx/:id'', to: ''xxx#shoq'''
  - kind: para
    text: 'get ''/xxx/yyy'', to: ''yyy'''
  - kind: para
    text: 'get ''/xxx/zzz’, to: ''zzz'''
  p69:
