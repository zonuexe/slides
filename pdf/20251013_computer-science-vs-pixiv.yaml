  p99:
  - kind: para
    text: Notes on Programming in C
  - kind: para
    text: 'ルール2: 計測すべし。計測する'
  - kind: para
    text: までは速度のための調整をしては
  - kind: para
    text: ならない。コードの一部が残りを
  - kind: para
    text: 圧倒しないのであれば、なおさら
  - kind: para
    text: である。
  - kind: para
    text: ̶ Rob Pike
  - kind: para
    text: https://www.lysator.liu.se/c/pikestyle.html
  - kind: para
    text: 訳語はUNIX哲学 - Wikipediaより引用
  - kind: para
    text: (2025年10日2日12:33:03版)
  p100:
  - kind: para
    text: 裏返せば、計測してみて
  - kind: para
    text: スループット悪化の主要因
  - kind: para
    text: と判断されない限り
  - kind: para
    text: 安全性と開発者体験を優先
  p101:
  - kind: para
    text: PHPには
  - kind: para
    text: 型宣言の機能がある
  p102:
  - kind: para
    text: 処理系が実行時に
  - kind: para
    text: 自動型チェックを実施
  p103:
  - kind: heading
    level: 2
    text: 実行時？遅いのでは？
  - kind: heading
    level: 1
    text: 🤔
  p104:
  - kind: heading
    level: 1
    text: かつてはそうだった
  p105:
  - kind: para
    text: 言語のホットスポットは
  - kind: para
    text: 処理系で改善されると
  - kind: para
    text: 嬉しい
  p106:
  - kind: para
    text: 現代はJITが改善され
  - kind: para
    text: 型宣言した方が
  - kind: para
    text: 最適化の恩恵を受ける
  p107:
  - kind: para
    text: 当てずっぽうで
  - kind: para
    text: 「速い」ものを選んでも
  - kind: para
    text: 問題解決にならない
  p108:
  - kind: para
    text: これからの時代こそ
  - kind: para
    text: 自我をもって
  - kind: para
    text: 問題解決しよう
