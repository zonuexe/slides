  p17:
  - kind: heading
    level: 1
    text: 'PHP: Hypertext Preprocessor'
  - kind: list
    items:
    - Web開発にしか使えない、遅い動的言語… と考えられている
    - 型がない、あるいは貧弱な言語… と、認識されている
    - ちょっぴりC言語っぽい標準関数と->
    - そこはかとなくJavaっぽいオブジェクト指向
    - とてもPerlっぽい構文 (特に変数の $ と、文末の ; )
  p18:
