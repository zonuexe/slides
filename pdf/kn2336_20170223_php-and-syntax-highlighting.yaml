  p8:
  - kind: heading
    level: 1
    text: PHPDocの型
  - kind: list
    items:
    - 基本はPHPの型かクラス名を書く
    - 複合型
    - 「intまたは文字列」 int|string
    - 値が並んだ配列
    - 「intが並んだ配列」 int[]
    - https://zonuexe.github.io/phpDocumentor2-ja/references/phpdoc/types.html
  p9:
  - kind: para
    text: ところで、PHPの開発環境(エディタ/IDE)はいろいろある
  p10:
  - kind: heading
    level: 1
    text: みなさんは何を使ってますか？
  - kind: para
    text: vi? Emacs? Vim? Spacemacs? NeoVim?
  - kind: para
    text: Sublime Text? Atom? VisualStudio Code?
  - kind: para
    text: PhpStorm? IntelliJ IDEA?
  - kind: para
    text: NetBeans? Eclipse?
  - kind: para
    text: nano? micro? 秀丸? TeraPad?
  p11:
  - kind: para
    text: Syntax highlighting!
  p12:
  - kind: para
    text: 各種エディタでPHPを強調表示するには
  - kind: para
    text: Emacs → php-mode 入れる
  - kind: para
    text: Vim → StanAngeloff/php.vim 入れる
  - kind: para
    text: Eclipse, NetBeans
  - kind: list
    items:
    - PHPが入ってるエディションを入れる
  - kind: para
    text: IntelliJ IDEA → PHPパッケージ入れる
  p13:
  - kind: para
    text: 各種最新版にアップデートすべし(PHP BLTで毎回言ってる気がする…)
