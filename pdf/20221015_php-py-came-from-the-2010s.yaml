text:
  p1:
  - node: p
    children:
    - node: text
      content: 10年前から来たphp.py
  - node: p
    children:
    - node: text
      content: '"php.py" came from the 2010''s'
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2022-10-15'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
        - node: li
          children:
          - node: text
            content: 会社ではPython使われてますが私は触ってません！！！！
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
  p3:
  - node: p
    children:
    - node: text
      content: '3週間前はPHP '
    - node: br
    - node: text
      content: カンファレンスでした (両方に携っているスタッフ
    - node: br
    - node: text
      content: おつかれさまです)
  p4:
  - node: p
    children:
    - node: text
      content: Emacs-PHP
  p5:
  - node: p
    children:
    - node: text
      content: PHPの静的解析とか 言語仕様の紹介をして
    - node: br
    - node: text
      content: 暮らしています
  p6:
  - node: p
    children:
    - node: text
      content: '普段はEmacsの '
    - node: br
    - node: text
      content: php-mode開発したり
  p7:
  - node: p
    children:
    - node: text
      content: WEB+DB PRESS総集編
  p8:
  - node: p
    children:
    - node: text
      content: Software Design 11月号
  p9:
  - node: p
    children:
    - node: text
      content: Emacsで動的言語を リアルタイム静的解析 しながら快適に開発で きるようにしています
  p10:
  - node: p
    children:
    - node: text
      content: Pythonは1行くらい 書いたことあります
  p11:
  - node: p
    children:
    - node: text
      content: nishioさんに影響されて…
  p12:
  - node: p
    children:
    - node: text
      content: PythonでRubyを 書けるようにしたり
  p13:
  - node: p
    children:
    - node: text
      content: RubyをPythonっぽく置き換える
  p14:
  - node: p
    children:
    - node: text
      content: 冗談は置いておいて
  p15:
  - node: p
    children:
    - node: text
      content: 2011年くらいに
    - node: br
    - node: text
      content: Pythonやってました
  p16:
  - node: p
    children:
    - node: text
      content: Pythonを学んだ本
  p17:
  - node: p
    children:
    - node: text
      content: 札幌で読書会をやっていた
  p18:
  - node: p
    children:
    - node: text
      content: '最初はRuby '
    - node: br
    - node: text
      content: ' 並行してPython '
    - node: br
    - node: text
      content: 就職してPHP
  p19:
  - node: p
    children:
    - node: text
      content: いわゆるLL言語を 浅く広く触っている
  p20:
  - node: p
    children:
    - node: text
      content: RubyとPHPの処理系
    - node: br
    - node: text
      content: '実装のことは '
    - node: br
    - node: text
      content: ちょっとだけわかる
  p21:
  - node: p
    children:
    - node: text
      content: PyConは初参加！
  p22:
  - node: p
    children:
    - node: text
      content: 隣の芝は青い
  p23:
  - node: p
    children:
    - node: text
      content: 専門分野じゃない カンファレンスに 飛び込むのは良い
  p24:
  - node: p
    children:
    - node: text
      content: というわけでPython ニワカなりに10年前の
    - node: br
    - node: text
      content: ことを知ってます
  p25:
  - node: p
    children:
    - node: text
      content: 'Emacsで.py書くとき '
    - node: br
    - node: text
      content: どっちのpython-mode
    - node: br
    - node: text
      content: 使ってるんです？
  p26:
  - node: p
    children:
    - node: text
      content: PyCon楽しい！！
  p27:
  - node: p
    children:
    - node: text
      content: 'とはいえ '
    - node: br
    - node: text
      content: 'Pythonコミュニティに '
    - node: br
    - node: text
      content: 影響を受けてきた
  p28:
  - node: p
    children:
    - node: text
      content: '魂に刻まれた '
    - node: br
    - node: text
      content: Pythonのヤバい機能
  p29:
  - node: p
    children:
    - node: bold
      content: codec
  p30:
  - node: p
    children:
    - node: text
      content: '文字コード変換する '
    - node: br
    - node: text
      content: やつでしょ？
  p31:
  - node: p
    children:
    - node: text
      content: '昔はスクリプトが '
    - node: br
    - node: text
      content: UTF-8以外で 書かれていた
  p32:
  - node: p
    children:
    - node: text
      content: 'Pythonは3で '
    - node: br
    - node: text
      content: '文字列=Unicodeに '
    - node: br
    - node: text
      content: '全振りした '
    - node: br
    - node: text
      content: ちなみにPHP6もやろうとしたけど失敗した
  p33:
  - node: p
    children:
    - node: text
      content: Pythonは任意のエン コーディングで書かれ たコードを実行できる
    - node: br
    - node: text
      content: 仕組みがある
  p34:
  - node: p
    children:
    - node: text
      content: LL Tiger (2010年)
  - node: p
    children:
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p35:
  - node: p
    children:
    - node: text
      content: 殺伐Python
  - node: p
    children:
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p36:
  - node: p
    children:
    - node: text
      content: 殺伐Python
  - node: p
    children:
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p37:
  - node: p
    children:
    - node: text
      content: 殺伐Python
  - node: p
    children:
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p38:
  - node: p
    children:
    - node: text
      content: codecは追加できる
  p39:
  - node: p
    children:
    - node: text
      content: なんとcodecはプリプロセッサだったのだ
  - node: p
    children:
    - node: bold
      content: 'Shibu''s Diary: LL TigerのLTでRuby on Python(仮)の発表してきました。 '
    - node: br
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p40:
  - node: p
    children:
    - node: text
      content: '!?'
  p41:
  - node: p
    children:
    - node: text
      content: バイトコンパイル前に
    - node: br
    - node: text
      content: '介入できれば '
    - node: br
    - node: text
      content: 事実上何でもできる
  p42:
  - node: p
    children:
    - node: text
      content: 殺伐Python
  - node: p
    children:
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p43:
  - node: p
    children:
    - node: text
      content: 渋川さんはガチなので
    - node: br
    - node: text
      content: Rubyのコードを
    - node: br
    - node: text
      content: Pythonに翻訳します
  p44:
  - node: p
    children:
    - node: text
      content: 殺伐Python
  - node: p
    children:
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p45:
  - node: p
    children:
    - node: text
      content: 殺伐Python
  - node: p
    children:
    - node: bold
      content: http://blog.shibu.jp/article/39920783.html より引用
  p46:
  - node: p
    children:
    - node: text
      content: 'いま読み直しても '
    - node: br
    - node: text
      content: やばい
  p47:
  - node: p
    children:
    - node: text
      content: じゃあPHPでも 動かすか(安直)
  p48:
  - node: p
    children:
    - node: text
      content: 私はガチではないので お手軽実装で済ませる
  p49:
  - node: p
    children:
    - node: text
      content: 'というわけで '
    - node: br
    - node: text
      content: Pythonを書きました
  p50:
  - node: p
    children:
    - node: text
      content: 1行くらい…
  p51:
  - node: p
    children:
    - node: text
      content: 読みにくい…
  p52:
  - node: p
    children:
    - node: text
      content: phpcodec.py
  p53:
  - node: p
    children:
    - node: text
      content: (ファイルに書かれた
    - node: br
    - node: text
      content: コードをPHPプロセス
    - node: br
    - node: text
      content: に流すだけの雑実装)
  p54:
  - node: p
    children:
    - node: text
      content: みなさまおなじみのPHP
  p55:
  - node: p
    children:
    - node: text
      content: 改行したﬁzzbuzz.py
  p56:
  - node: p
    children:
    - node: text
      content: 実行
  p57:
  - node: p
    children:
    - node: text
      content: codecを現在動かすにあたって
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 公開されていた渋川さんのコードが読めない (!!?)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: BitBucketはMercurialサポート終了 https://bitbucket.org/shibu
        - node: li
          children:
          - node: text
            content: 10年前はGitHub普及前でMercurialとBitBucket使われてましたね…
    - node: li
      children:
      - node: text
        content: 渋川さんのコードを再利用したと思しき記事を断片的に参考に
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: https://doloopwhile.hatenablog.com/entry/20100801/1280688409
  p58:
  - node: p
    children:
    - node: text
      content: codecを現在動かすにあたって
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 元コードではStreamReaderでコードを書き換えていたが動かなかった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Pythonの処理系実装を軽く読んでみたけど理由わからず、教えてください
    - node: li
      children:
      - node: text
        content: sitecustomizeとかusercustomizeで暗黙的にコーデック追加して
      - node: br
      - node: text
        content: '#coding: php なファイルをダイレクトに起動できるようにしたい… '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 仕方ないので現在は -m phpcodec で実行したらダイナミックインポート
        - node: li
          children:
          - node: text
            content: もっといい感じにしたいね！
  p59:
  - node: p
    children:
    - node: text
      content: おまけ
  p60:
  - node: p
    children:
    - node: text
      content: エンコーディング指定
  - node: p
    children:
    - node: text
      content: 'テキストエディタのエンコーディング指定に由来 '
    - node: br
    - node: text
      content: (Rubyもだいたい同じ仕様)
  p61:
  - node: p
    children:
    - node: text
      content: エンコーディング指定
  - node: p
    children:
    - node: text
      content: Emacs記法
  - node: p
    children:
    - node: text
      content: これなに
  p62:
  - node: p
    children:
    - node: text
      content: PEP 263
  - node: p
    children:
    - node: text
      content: Vim記法
  - node: p
    children:
    - node: text
      content: それっぽい指定をいい感
    - node: br
    - node: text
      content: じに読み込んでくれる
