text:
  p1:
  - node: p
    children:
    - node: bold
      content: お前はPHPの標準関数の数を知っているか
  - node: p
    children:
    - node: text
      content: Do you know the number of standard functions in PHP?
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2022-10-05'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: PHPerKaigi コアスタッフ、
  - node: p
    children:
    - node: text
      content: PHPカンファレンス実行委員は今年はお休み
  p3:
  - node: p
    children:
    - node: text
      content: このLTについて
  p4:
  - node: p
    children:
    - node: text
      content: PHPカンファレンス2022
  p5:
  - node: p
    children:
    - node: text
      content: 問題です
  p6:
  - node: p
    children:
    - node: text
      content: PHPの標準関数の数は いくつあるでしょうか
  p7:
  - node: p
    children:
    - node: text
      content: 'ヒント： '
    - node: br
    - node: text
      content: Python 3.10は71個 (型を除くと56個くらい)
  p8:
  - node: p
    children:
    - node: text
      content: '答え： '
    - node: br
    - node: text
      content: わかんない
  p9: []
  p10:
  - node: p
    children:
    - node: text
      content: ？？？
  p11:
  - node: p
    children:
    - node: text
      content: 'この状況を理解するには '
    - node: br
    - node: text
      content: 'モジュールシステムを '
    - node: br
    - node: text
      content: 理解する必要がある
  p12:
  - node: p
    children:
    - node: text
      content: '関数は '
    - node: br
    - node: text
      content: どこからくるの？
  p13:
  - node: p
    children:
    - node: text
      content: 関数定義を探しにいこう
  p14:
  - node: p
    children:
    - node: text
      content: https://github.com/php/php-src
  p15:
  - node: p
    children:
    - node: text
      content: C言語で定義されています
  p16:
  - node: p
    children:
    - node: text
      content: C言語で定義されています
  - node: p
    children:
    - node: text
      content: 'ここを抜き出せば '
    - node: br
    - node: text
      content: 関数一覧を作れる？
  p17:
  - node: p
    children:
    - node: text
      content: rg -g '*.c' -o
  - node: p
    children:
    - node: text
      content: '''^(?:ZEND|PHP)_FUNCTION\(.+\)'' | '
  - node: p
    children:
    - node: text
      content: ' cut -d: -f2 | sort -u | wc -l '
  p18:
  - node: p
    children:
    - node: text
      content: まじで？？？
  p19:
  - node: p
    children:
    - node: text
      content: 'PHPマニュアルを '
    - node: br
    - node: text
      content: 見にいこう
  p20:
  - node: p
    children:
    - node: text
      content: PHPには関数がいっぱい
  p21:
  - node: p
    children:
    - node: text
      content: PHPには関数がいっぱい
  - node: p
    children:
    - node: text
      content: これ全部読むの…?
  p22:
  - node: p
    children:
    - node: text
      content: 実は関数一覧のJSONがある
  p23:
  - node: p
    children:
    - node: text
      content: 'curl  '
  - node: p
    children:
    - node: text
      content: http://doc.php.net/downloads/json/php_manual_en.json
    - node: br
    - node: text
      content: '| jq-rs ''[ .[] | keys ] | flatten | '
  - node: p
    children:
    - node: text
      content: 'unique | .[]'' | grep -v :: | wc -l '
  p24:
  - node: p
    children:
    - node: text
      content: 増えたんですが…
  p25:
  - node: p
    children:
    - node: text
      content: PHPには関数がいっぱい
  - node: p
    children:
    - node: text
      content: ここから辿る
  p26:
  - node: p
    children:
    - node: text
      content: PHPには関数がいっぱい
  - node: p
    children:
    - node: text
      content: 'われわれの知る '
    - node: br
    - node: text
      content: 標準関数はこのへん
  p27:
  - node: p
    children:
    - node: text
      content: おなじみの関数がいっぱい
  p28:
  - node: p
    children:
    - node: text
      content: 拡張モジュール(Extension)とは
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPにコンパイル時または起動時にロードされる機能単位
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PHPスクリプトではなく動的モジュール(*.so, *.dll)で提供される
    - node: li
      children:
      - node: text
        content: コンパイル時に有効化／無効化するか、php.iniに記述する必要あり
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: オンプレで実行していたりするとシステム管理者の作業が必要な場合あり
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: レンタルサーバー(非VPS)では利用者が設定できないかもしれない
    - node: li
      children:
      - node: text
        content: ApacheやPHP-FPMでは設定変更後に再起動することで反映される
  p29:
  - node: p
    children:
    - node: text
      content: 拡張モジュールの種類
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: コア拡張 → PHPの標準機能として組み込まれており無効化できない
    - node: li
      children:
      - node: text
        content: バンドル拡張 → PHPに同梱されていてコンパイル時に有効化できる
    - node: li
      children:
      - node: text
        content: 外部拡張 → PHP以外のライブラリとリンクすることで有効になる機能
    - node: li
      children:
      - node: text
        content: PECL拡張 → pecl.php.net でインストールできるモジュール
    - node: li
      children:
      - node: text
        content: その他(野良) → コードからphpizeしてcon(cid:219)gureしてmake install
  p30:
  - node: p
    children:
    - node: text
      content: Docker
  - node: p
    children:
    - node: text
      content: (PHP Ofﬁcial Image)
  - node: p
    children:
    - node: bold
      content: mbstringはデフォルト有効
  p31:
  - node: p
    children:
    - node: text
      content: Debianではモジュールごとのapt
  - node: p
    children:
    - node: bold
      content: よく使われるモジュールも 明示的にインストールが必要
  p32:
  - node: p
    children:
    - node: text
      content: WindowsではDLL同梱
  p33:
  - node: p
    children:
    - node: text
      content: php.ini
  p34:
  - node: p
    children:
    - node: text
      content: Windowsの場合のphp.ini
  - node: p
    children:
    - node: bold
      content: 必要なところだけ ; を消す
  p35:
  - node: p
    children:
    - node: text
      content: 話を戻しましょう
  p36:
  - node: p
    children:
    - node: text
      content: '狭義の標準関数= '
    - node: br
    - node: text
      content: コア拡張に属する関数
  p37:
  - node: p
    children:
    - node: text
      content: 取材班は関数の数を 数えるためJSONに 向き合うことにした
  p38:
  - node: p
    children:
    - node: text
      content: php_manual_en.json
  p39:
  - node: p
    children:
    - node: text
      content: 区切り文字がない関数名
  p40:
  - node: p
    children:
    - node: text
      content: ていねいな正規表現でキャッチ
  p41:
  - node: p
    children:
    - node: text
      content: スクリプトはここにあります
  p42:
  - node: p
    children:
    - node: text
      content: 'ていねいな正規表現調べ '
  p43:
  - node: p
    children:
    - node: text
      content: '774個の関数を '
    - node: br
    - node: text
      content: 覚えられるか
  p44:
  - node: p
    children:
    - node: text
      content: 😇
  p45:
  - node: p
    children:
    - node: text
      content: '数が多すぎるので '
    - node: br
    - node: text
      content: 馴染みのない関数を 調べる方が筋がいい
  p46:
  - node: p
    children:
    - node: text
      content: どうやって関数を探す？
  p47:
  - node: p
    children:
    - node: text
      content: 関数名 検索
  - node: p
    children:
    - node: text
      content: php   [ ]
  p48:
  - node: p
    children:
    - node: text
      content: 🙅
  p49:
  - node: p
    children:
    - node: text
      content: php.net/json_encode
  p50:
  - node: p
    children:
    - node: text
      content: php.net/DateTime
  p51:
  - node: p
    children:
    - node: text
      content: php.net/$_SERVER
  p52:
  - node: p
    children:
    - node: text
      content: '特定の関数から '
    - node: br
    - node: text
      content: 追っていく
  p53:
  - node: p
    children:
    - node: text
      content: 'たとえば '
    - node: br
    - node: text
      content: 配列を処理したい
  p54:
  - node: p
    children:
    - node: text
      content: 適当な配列関数にアクセス
  - node: p
    children:
    - node: text
      content: ここから辿る
  p55:
  - node: p
    children:
    - node: text
      content: 日本語説明付き一覧がある
  p56:
  - node: p
    children:
    - node: text
      content: '言語を横断して関数に '
    - node: br
    - node: text
      content: '使われがちな語彙も '
    - node: br
    - node: text
      content: 身につけられる
