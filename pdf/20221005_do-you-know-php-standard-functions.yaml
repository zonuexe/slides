  p27:
  - kind: heading
    level: 1
    text: おなじみの関数がいっぱい
  p28:
  - kind: para
    text: 拡張モジュール(Extension)とは
  - kind: list
    items:
    - PHPにコンパイル時または起動時にロードされる機能単位
    - PHPスクリプトではなく動的モジュール(*.so, *.dll)で提供される
    - コンパイル時に有効化／無効化するか、php.iniに記述する必要あり
    - オンプレで実行していたりするとシステム管理者の作業が必要な場合あり
    - レンタルサーバー(非VPS)では利用者が設定できないかもしれない
    - ApacheやPHP-FPMでは設定変更後に再起動することで反映される
  p29:
  - kind: para
    text: 拡張モジュールの種類
  - kind: list
    items:
    - コア拡張 → PHPの標準機能として組み込まれており無効化できない
    - バンドル拡張 → PHPに同梱されていてコンパイル時に有効化できる
    - 外部拡張 → PHP以外のライブラリとリンクすることで有効になる機能
    - PECL拡張 → pecl.php.net でインストールできるモジュール
    - その他(野良) → コードからphpizeしてconfigureしてmake install
  p30:
  - kind: heading
    level: 1
    text: Docker(PHP Official Image)
  - kind: heading
    level: 2
    text: mbstringはデフォルト有効
  p31:
  - kind: heading
    level: 1
    text: Debianではモジュールごとのapt
  - kind: para
    text: よく使われるモジュールも明示的にインストールが必要
  p32:
  - kind: heading
    level: 1
    text: WindowsではDLL同梱
  p33:
  - kind: heading
    level: 1
    text: php.ini
  p34:
  - kind: heading
    level: 1
    text: Windowsの場合のphp.ini
  - kind: heading
    level: 2
    text: 必要なところだけ ; を消す
