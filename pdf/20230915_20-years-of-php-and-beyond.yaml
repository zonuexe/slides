  p37:
  - node: p
    children:
    - node: text
      content: '‒ PHPの今とこれから2009 '
  - node: p
    children:
    - node: text
      content: https://www.slideshare.net/hirokawa/php2009
  p38:
  - node: p
    children:
    - node: text
      content: '‒ 開発中の PHP 6、UTF-16 化に失敗。開発ブランチも 5.3 系に巻き戻し '
  - node: p
    children:
    - node: text
      content: https://srad.jp/story/10/03/19/0136250/
  p39:
  - node: p
    children:
    - node: text
      content: PHPと文字列
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: string型 = バイト列 (任意のバイナリが格納できる)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Ruby 1.8、Python 2.xと同等
    - node: li
      children:
      - node: text
        content: PHP 6.xでICUと統合してUCS正規化しようとした
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 規定路線だったので、PHP 5.2(2006年)にbinaryキャストが追加
        - node: li
          children:
          - node: text
            content: 当時期待されていたパフォーマンス要件を満たせず2010年に断念
    - node: li
      children:
      - node: text
        content: 文字列以外の機能は5.3(2009年)、5.4(2012年)でリリース
  p40:
  - node: p
    children:
    - node: text
      content: '‒ Lightweight Language Saturday プログラム '
  - node: p
    children:
    - node: text
      content: http://ll.jus.or.jp/2003/program.html
  p41:
  - node: p
    children:
    - node: text
      content: '‒ PHPにおけるオブジェクト指向「的」機能の特徴 '
  - node: p
    children:
    - node: text
      content: http://ll.jus.or.jp/2003/document/p2-php.pdf
  p42:
  - node: p
    children:
    - node: text
      content: '‒ PHPにおけるオブジェクト指向「的」機能の特徴 '
  - node: p
    children:
    - node: text
      content: http://ll.jus.or.jp/2003/document/p2-php.pdf
  p43:
  - node: p
    children:
    - node: text
      content: PHPのオブジェクト指向機能
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP 5.0
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 可視性 (public/protected/private)
        - node: li
          children:
          - node: text
            content: abstract/interfaceが導入
        - node: li
          children:
          - node: text
            content: オブジェクトが参照型に (それまではCoW)
    - node: li
      children:
      - node: text
        content: 'PHP 5.4: traitが導入'
    - node: li
      children:
      - node: text
        content: 'PHP 5.6: 定数式 (それまではリテラルしか記述できなかった)'
  p44:
  - node: p
    children:
    - node: text
      content: PHPのオブジェクト指向機能
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'PHP 7.4: 型付きプロパティ'
    - node: li
      children:
      - node: text
        content: 'PHP 8.0: コンストラクタプロモーション (PHP 8.2)'
    - node: li
      children:
      - node: text
        content: 'PHP 8.1: readonlyプロパティ'
    - node: li
      children:
      - node: text
        content: 'PHP 8.2: trait定数宣言'
    - node: li
      children:
      - node: text
        content: 'PHP 8.3: 型付き定数宣言'
  p45:
  - node: p
    children:
    - node: text
      content: '<?php  <?php '
  - node: p
    children:
    - node: text
      content: 'class Book {  class Book { '
    - node: br
    - node: text
      content: '  /**      public function __construct( '
    - node: br
    - node: text
      content: '   * @var string          public readonly string $name, '
    - node: br
    - node: text
      content: '   * @readonly      ) {    */      } '
    - node: br
    - node: text
      content: '  private $name; '
    - node: br
    - node: text
      content: '     ... '
    - node: br
    - node: text
      content: '  /** @param string $name */ '
    - node: br
    - node: text
      content: '  public function __construct($name) { '
    - node: br
    - node: text
      content: '    $this->name = $name; '
  - node: p
    children:
    - node: text
      content: '  ...'
  p46:
  - node: p
    children:
    - node: text
      content: PHPの歴史 (LLイベント以後)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: '2004: PHP 5.0'
    - node: li
      children:
      - node: text
        content: '2005: PHP 5.1'
    - node: li
      children:
      - node: text
        content: '2006: PHP 5.2 (PHP 6との互換性を見越したsyntax追加)'
    - node: li
      children:
      - node: text
        content: '2009: PHP 5.3 (PHP 6予定の機能の一部を先行マージ)'
    - node: li
      children:
      - node: text
        content: '2012: PHP 5.4 (PHP 6開発断念、文字列以外の機能をマージ)'
  p47:
  - node: p
    children:
    - node: text
      content: PHPの開発体制
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Request for Comments https://wiki.php.net/rfc
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 言語機能の改廃提案と投票プロセス、リリース周期が明文化
    - node: li
      children:
      - node: text
        content: 機能提案する人は仕様をまとめてMLで議論、実装も責任を持って用意する
    - node: li
      children:
      - node: text
        content: PHP原作者のRasmus Lardorfは開発者としての1票しか行使しない
    - node: li
      children:
      - node: text
        content: PHP 7.0(2015年)以降、11月末〜12月初頭にリリースが定着
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 品質保障のためのfeature freeze、RC版なども定められた
  p48:
  - node: p
    children:
    - node: text
      content: PHPは誰が開発しているのか
  p49: []
  p50: []
  p51: []
  p52:
  - node: p
    children:
    - node: text
      content: PHPはどこに行くのか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: おそらく、どの言語よりも利用者の幅が広い言語
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 動的なホームページを作りたい個人
        - node: li
          children:
          - node: text
            content: Web制作からのステップアップ
        - node: li
          children:
          - node: text
            content: CMSを使ったWebサイト構築
        - node: li
          children:
          - node: text
            content: 各種システム開発 (大規模Webサイト、ゲームのAPIサーバ…)
  p53:
  - node: p
    children:
    - node: text
      content: おそらく溝は広まりつつある
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPの先進的な言語機能を取り入れて使っているか
    - node: li
      children:
      - node: text
        content: PHPの品質保障(テスト・静的解析)のトレンドに乗れているか
    - node: li
      children:
      - node: text
        content: PHP 8.xへのアップデートはかなり大変
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PHP 7以前よりもエラーがかなり厳格化した
    - node: li
      children:
      - node: text
        content: レンタルサーバーやVPSを放置している人もおそらく多い
  p54: []
  p55: []
  p56: []
  p57:
  - node: p
    children:
    - node: text
      content: PHPは過去と未来を繋ぐ言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPの仕様はCGIの時代から地続き
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PerlやRubyはApache mod時代やPost WSGI時代に断絶がある
        - node: li
          children:
          - node: text
            content: PHPはpreforkなサーバ上でもCGI互換のシェアードナッシング
          - node: br
          - node: text
            content: '(すべての状態が隔離され、リクエストごとに初期化される) '
    - node: li
      children:
      - node: text
        content: 汎用プログラミング言語の能力を持ちながら根幹がテンプレートエンジンに
      - node: br
      - node: text
        content: あるので、小規模からある程度大規模なアプリケーションにもフィットする
  p58:
  - node: p
    children:
    - node: text
      content: Webの世界のトレンド
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: シェアを伸張する各言語
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Node.js, SPA
        - node: li
          children:
          - node: text
            content: パフォーマンスに優れた静的型付き言語
    - node: li
      children:
      - node: text
        content: 相対的にPHPの存在感は薄れつつある
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: このままPHPは滅びるしかないのか…？
  p59:
  - node: p
    children:
    - node: text
      content: PHPはどこでも65点がとれる言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: '「現代におけるプロダクト開発とPHPを選定するワケ #phpkansai」'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: By @potato4d (PHPカンファレンス関西2017)
    - node: li
      children:
      - node: text
        content: 小難しいことを考えずに簡単にWebアプリを書ける(HTML+α)の言語
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: なんだかんだいってWEB+DB連携がさくっとできる言語ランタイムとして
          - node: br
          - node: text
            content: 'の存在感は健在 '
    - node: li
      children:
      - node: text
        content: 求められているのは素晴らしい言語ではなく簡単に使える言語
  p60:
  - node: p
    children:
    - node: text
      content: 'PHP先生の '
    - node: br
    - node: text
      content: '雑草のような生命力に '
    - node: br
    - node: text
      content: ご期待ください！
