  p34:
  - node: p
    children:
    - node: text
      content: PHPの歴史 (LLイベント以前)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: '1994: PHP Tools 1.0   → SSI風構文のテンプレートエンジン'
    - node: li
      children:
      - node: text
        content: '1996: PHP/FI 2.0        → 汎用言語として使用できるように'
    - node: li
      children:
      - node: text
        content: '1998: PHP 3.0             → クラス構文のサポート'
    - node: li
      children:
      - node: text
        content: '1999: PHP 4.0             → Zend Engine (インタプリタVM化)'
    - node: li
      children:
      - node: text
        content: '2003: PHP 5.0(開発中) → オブジェクト指向構文の刷新'
  p35:
  - node: p
    children:
    - node: text
      content: '‒ PHPの今とこれから '
  - node: p
    children:
    - node: text
      content: http://ll.jus.or.jp/2003/document/p1-php.pdf
  p36:
  - node: p
    children:
    - node: text
      content: '‒ PHPの今とこれから2009 '
  - node: p
    children:
    - node: text
