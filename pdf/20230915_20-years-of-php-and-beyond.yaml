    - GUIもいちおう… (得意とは言ってない)
  p22:
  - kind: para
    text: みなさんの想像するPHPとは
  p23:
  - kind: heading
    level: 1
    text: A
  - kind: para
    text: '<!DOCTYPE html><html><head><title>Hello, PHP!</title></head><p><?php if
      (date(''H'') < 19): ?>こんにちは<?php else: ?>こんばんは<?php endif; ?></p><p>今は<?= htmlspecialchars(date(''H''))
      ?>時です</p>'
  p24:
  - kind: heading
    level: 1
    text: B
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s) {print '<li>'; print $s->name; print '</li>';}print
      '</ul>';
  p25:
  - kind: heading
    level: 1
    text: C
  - kind: para
    text: <?php declare(strict_types=1);namespace Foo\Http\Controller;
  - kind: para
    text: class BooksController extends BaseController {public function index() {$books
      = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));}}
  p26:
  - kind: heading
    level: 2
    text: P H P の原作者
  - kind: heading
    level: 1
    text: ラスマスかく語りき
  p27:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told you you should be using.I
      don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p28:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”
  - kind: para
    text: –Rasmus Lerdorf (tadsanによる超訳)
  p29:
  - kind: para
    text: 変数に$があってPerlっぽくて
  p30:
  - kind: para
    text: C言語っぽい関数と-> があって
  p31:
  - kind: para
    text: 雰囲気Javaっぽいオブジェクト指向で
  p32:
  - kind: heading
    level: 1
    text: PHPは見る人の心を映す
  p33:
  - kind: heading
    level: 1
    text: 改めて2003年
  p34:
  - kind: para
    text: PHPの歴史 (LLイベント以前)
  - kind: list
    items:
    - '1994: PHP Tools 1.0 → SSI風構文のテンプレートエンジン'
    - '1996: PHP/FI 2.0 → 汎用言語として使用できるように'
    - '1998: PHP 3.0 → クラス構文のサポート'
    - '1999: PHP 4.0 → Zend Engine (インタプリタVM化)'
    - '2003: PHP 5.0(開発中) → オブジェクト指向構文の刷新'
  p35:
  - kind: para
    text: ‒ PHPの今とこれからhttp://ll.jus.or.jp/2003/document/p1-php.pdf
  p36:
  - kind: para
    text: ‒ PHPの今とこれから2009 https://www.slideshare.net/hirokawa/php2009
  p37:
  - kind: para
    text: ‒ PHPの今とこれから2009 https://www.slideshare.net/hirokawa/php2009
  p38:
  - kind: para
    text: ‒ 開発中の PHP 6、UTF-16 化に失敗。開発ブランチも 5.3 系に巻き戻し
  - kind: para
    text: https://srad.jp/story/10/03/19/0136250/
  p39:
  - kind: para
    text: PHPと文字列
  - kind: list
    items:
    - string型 = バイト列 (任意のバイナリが格納できる)
    - Ruby 1.8、Python 2.xと同等
    - PHP 6.xでICUと統合してUCS正規化しようとした
    - 規定路線だったので、PHP 5.2(2006年)にbinaryキャストが追加
    - 当時期待されていたパフォーマンス要件を満たせず2010年に断念
    - 文字列以外の機能は5.3(2009年)、5.4(2012年)でリリース
  p40:
  - kind: para
    text: ‒ Lightweight Language Saturday プログラム
  - kind: para
    text: http://ll.jus.or.jp/2003/program.html
  p41:
  - kind: para
    text: ‒ PHPにおけるオブジェクト指向「的」機能の特徴http://ll.jus.or.jp/2003/document/p2-php.pdf
  p42:
  - kind: para
    text: ‒ PHPにおけるオブジェクト指向「的」機能の特徴http://ll.jus.or.jp/2003/document/p2-php.pdf
  p43:
  - kind: para
    text: PHPのオブジェクト指向機能
  - kind: list
    items:
    - PHP 5.0
    - 可視性 (public/protected/private)
    - abstract/interfaceが導入
    - オブジェクトが参照型に (それまではCoW)
    - 'PHP 5.4: traitが導入'
    - 'PHP 5.6: 定数式 (それまではリテラルしか記述できなかった)'
  p44:
  - kind: para
    text: PHPのオブジェクト指向機能
  - kind: list
    items:
    - 'PHP 7.4: 型付きプロパティ'
    - 'PHP 8.0: コンストラクタプロモーション (PHP 8.2)'
    - 'PHP 8.1: readonlyプロパティ'
    - 'PHP 8.2: trait定数宣言'
    - 'PHP 8.3: 型付き定数宣言'
  p45:
  - kind: para
    text: <?php
  - kind: para
    text: <?php
  - kind: para
    text: class Book {public function __construct(public readonly string $name,) {}
  - kind: para
    text: '...'
  - kind: para
    text: class Book {/*** @var string* @readonly*/private $name;/** @param string
      $name */public function __construct($name) {$this->name = $name;
  - kind: para
    text: '...'
  p46:
  - kind: para
    text: PHPの歴史 (LLイベント以後)
  - kind: list
    items:
    - '2004: PHP 5.0'
    - '2005: PHP 5.1'
    - '2006: PHP 5.2 (PHP 6との互換性を見越したsyntax追加)'
    - '2009: PHP 5.3 (PHP 6予定の機能の一部を先行マージ)'
    - '2012: PHP 5.4 (PHP 6開発断念、文字列以外の機能をマージ)'
  p47:
  - kind: para
    text: PHPの開発体制
  - kind: list
    items:
    - Request for Comments https://wiki.php.net/rfc
    - 言語機能の改廃提案と投票プロセス、リリース周期が明文化
    - 機能提案する人は仕様をまとめてMLで議論、実装も責任を持って用意する
    - PHP原作者のRasmus Lardorfは開発者としての1票しか行使しない
    - PHP 7.0(2015年)以降、11月末〜12月初頭にリリースが定着
    - 品質保障のためのfeature freeze、RC版なども定められた
  p48:
  - kind: heading
    level: 1
    text: PHPは誰が開発しているのか
  p49: []
  p50: []
  p51: []
  p52:
  - kind: heading
    level: 1
    text: PHPはどこに行くのか
  - kind: list
    items:
    - おそらく、どの言語よりも利用者の幅が広い言語
    - 動的なホームページを作りたい個人
    - Web制作からのステップアップ
    - CMSを使ったWebサイト構築
    - 各種システム開発 (大規模Webサイト、ゲームのAPIサーバ…)
  p53:
  - kind: para
    text: おそらく溝は広まりつつある
  - kind: list
    items:
    - PHPの先進的な言語機能を取り入れて使っているか
    - PHPの品質保障(テスト・静的解析)のトレンドに乗れているか
    - PHP 8.xへのアップデートはかなり大変
    - PHP 7以前よりもエラーがかなり厳格化した
    - レンタルサーバーやVPSを放置している人もおそらく多い
  p54: []
  p55: []
  p56: []
  p57:
  - kind: heading
    level: 1
    text: PHPは過去と未来を繋ぐ言語
  - kind: list
    items:
    - PHPの仕様はCGIの時代から地続き
    - PerlやRubyはApache mod時代やPost WSGI時代に断絶がある
    - PHPはpreforkなサーバ上でもCGI互換のシェアードナッシング
  - kind: para
    text: (すべての状態が隔離され、リクエストごとに初期化される)
  - kind: list
    items:
    - 汎用プログラミング言語の能力を持ちながら根幹がテンプレートエンジンに
  - kind: para
    text: あるので、小規模からある程度大規模なアプリケーションにもフィットする
  p58:
  - kind: heading
    level: 1
    text: Webの世界のトレンド
  - kind: list
    items:
    - シェアを伸張する各言語
    - Node.js, SPA
    - パフォーマンスに優れた静的型付き言語
    - 相対的にPHPの存在感は薄れつつある
    - このままPHPは滅びるしかないのか…？
  p59:
  - kind: para
    text: PHPはどこでも65点がとれる言語
  - kind: list
    items:
    - '「現代におけるプロダクト開発とPHPを選定するワケ #phpkansai」'
    - By @potato4d (PHPカンファレンス関西2017)
    - 小難しいことを考えずに簡単にWebアプリを書ける(HTML+α)の言語
    - なんだかんだいってWEB+DB連携がさくっとできる言語ランタイムとして
  - kind: para
    text: の存在感は健在
  - kind: list
    items:
    - 求められているのは素晴らしい言語ではなく簡単に使える言語
  p60:
  - kind: para
    text: PHP先生の雑草のような生命力にご期待ください！
