  p23:
  - node: p
    children:
    - node: text
      content: A
  - node: p
    children:
    - node: text
      content: '<!DOCTYPE html> '
    - node: br
    - node: text
      content: '<html><head><title>Hello, PHP!</title></head> '
    - node: br
    - node: text
      content: '<p> '
    - node: br
    - node: text
      content: '<?php if (date(''H'') < 19): ?> '
    - node: br
    - node: text
      content: '     こんにちは '
  - node: p
    children:
    - node: text
      content: '<?php else: ?>      こんばんは '
  - node: p
    children:
    - node: text
      content: '<?php endif; ?> '
    - node: br
    - node: text
      content: '</p> '
    - node: br
    - node: text
      content: <p>今は<?= htmlspecialchars(date('H')) ?>時です</p>
  p24:
  - node: p
    children:
    - node: text
      content: B
  - node: p
    children:
    - node: text
      content: '<?php require ''bootstrap.php''; '
  - node: p
    children:
    - node: text
      content: '$db = mysqli_connect(); '
    - node: br
    - node: text
      content: '$stmt = mysqli_prepare($db, ''SELECT * FROM books''); '
    - node: br
    - node: text
      content: 'mysqli_stmt_execute($stmt); print ''<h1>本の一覧</h1>''; '
  - node: p
    children:
    - node: text
      content: 'print ''<ul>''; '
    - node: br
    - node: text
      content: 'foreach ($stmt as $s) { '
    - node: br
    - node: text
      content: '    print ''<li>''; print $s->name; print ''</li>''; '
    - node: br
    - node: text
      content: '} '
    - node: br
    - node: text
      content: print '</ul>';
  p25:
  - node: p
    children:
    - node: text
      content: C
  - node: p
    children:
    - node: text
      content: '<?php declare(strict_types=1); '
  - node: p
    children:
    - node: text
      content: 'namespace Foo\Http\Controller; '
  - node: p
    children:
    - node: text
      content: 'class BooksController extends BaseController { '
    - node: br
    - node: text
      content: '    public function index() { '
    - node: br
    - node: text
      content: '        $books = Books::getAll(); '
  - node: p
    children:
    - node: text
      content: '        $this->render(compact("books")); '
    - node: br
    - node: text
      content: '    } '
    - node: br
    - node: text
      content: '}'
  p26:
  - node: p
    children:
    - node: bold
      content: P H P の原作者
    - node: br
    - node: text
      content: ラスマスかく語りき
  p27:
  - node: p
    children:
    - node: text
      content: 2007年 MySQL Conference
  - node: p
    children:
    - node: bold
      content: '“We have things like protected properties. We have abstract methods.
        We have all this stuff that your computer science teacher told '
    - node: br
    - node: bold
      content: 'you you should be using.  '
    - node: br
    - node: bold
      content: I don't care about this crap at all.”
  - node: p
    children:
    - node: bold
      content: '–Rasmus Lerdorf '
    - node: br
    - node: bold
      content: https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p28:
  - node: p
    children:
    - node: text
      content: 2007年 MySQL Conference
  - node: p
    children:
    - node: text
      content: には プロパティも
    - node: br
    - node: bold
      content: '“PHP protected  '
    - node: br
    - node: text
      content: 抽象メソッドもありますよ。計算機科学の
    - node: br
    - node: text
      content: 教授が「使え」と言ってるものは全部。
  - node: p
    children:
    - node: text
      content: そんなことはクソ興味ないですけど
  - node: p
    children:
    - node: bold
      content: ”
  - node: p
    children:
    - node: bold
      content: (tadsan )
  - node: p
    children:
    - node: bold
      content: '–Rasmus Lerdorf '
  - node: p
    children:
    - node: text
      content: による超訳
  p29:
  - node: p
    children:
    - node: text
