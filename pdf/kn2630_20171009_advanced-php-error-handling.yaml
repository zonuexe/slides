  - kind: para
    text: そもそもエラーって何だ
  p22:
  - kind: para
    text: PHPのコードの試しかた
  - kind: para
    text: php -r 'var_dump(1 + []);'
  - kind: para
    text: REPL (PsySH または php -a)
  - kind: para
    text: https://3v4l.org/
  - kind: para
    text: 多くのバージョンで串刺し実行
  p23:
  - kind: para
    text: エラー・例外とは
  - kind: para
    text: プログラムが正常ではないときに、
  - kind: para
    text: それを通知する仕組み
  - kind: para
    text: PHPではエラーと例外がある
  - kind: para
    text: PHP5では処理系は基本的にエラー
  - kind: para
    text: PHP7で例外を投げることが増えた
  p24:
  - kind: para
    text: 1. 例外・エラーの種類
  - kind: para
    text: 2. 本番環境でのエラー処理
  - kind: para
    text: 3. 開発環境でのエラー処理
  p25:
  - kind: para
    text: エラー
  p26:
  - kind: para
    text: エラー
  - kind: para
    text: 従来のPHPで異常状態を通知する
  - kind: para
    text: ための仕組み
  - kind: para
    text: 関数呼び出し、未定義変数の参照
  - kind: para
    text: 結構いろんなところで発生する
  - kind: para
    text: PHP7で種類が整理された
  p27:
  - kind: para
    text: 主要なエラー
  - kind: para
    text: Notice よくない処理の通知
  - kind: para
    text: Warning, Error
  - kind: para
    text: 実行時の警告・エラー
  - kind: para
    text: Deprecated, Strict
  - kind: para
    text: 非互換／廃止予定の機能
  - kind: para
    text: Fatal Error 致命的エラー
  p28:
  - kind: para
    text: Notice
  - kind: para
    text: 配列の未定義位置から値を取り出
  - kind: para
    text: そうとしたときなどに発生する
  - kind: para
    text: 信号無視みたいな軽犯罪
  - kind: para
    text: ただしバグの温床になるので、
  - kind: para
    text: 無視せずきちんと対処を強く推奨
  p29:
  - kind: heading
    level: 1
    text: Noticeの例 (一部)
  - kind: para
    text: echo $i; // 存在しない変数
  - kind: para
    text: echo $_GET['id']; // 存在しないインデクス
  - kind: para
    text: echo $o->abc; // 存在しないプロパティ
  p30:
  - kind: para
    text: Warning, Error
  - kind: para
    text: 何かが「間違ってる」ときに発生
  - kind: para
    text: デフォルトの挙動ではWarningで
  - kind: para
    text: は停止せずに進む
  - kind: para
    text: 一貫性がないが、どちらも異常状
  - kind: para
    text: 態なので無視せず直した方がよい
  p31:
  - kind: heading
    level: 1
    text: Warning, Errorの例(一部)
  - kind: para
    text: // 存在しないファイルを開く
  - kind: para
    text: $f = fopen("/hoge.txt", "r");
  - kind: para
    text: foo($i); // 引数が足りない、PHP5のみ
  - kind: para
    text: // PHP7ではArgumentErrorに変更
  - kind: para
    text: function foo($i, $j) { echo $i, $j; }
  p32:
  - kind: para
    text: Deprecated, Strict
  - kind: para
    text: 廃止予定や互換性の怪しい機能
  - kind: para
    text: '例: split() 関数 (explode()とは別物)'
  - kind: para
    text: 5.3でdeprecated、7.0で削除
  - kind: para
    text: Strictは7.0で廃止(再分類)された
  - kind: para
    text: https://wiki.php.net/rfc/reclassify_e_strict
  p33:
  - kind: heading
    level: 1
    text: Deprecated, Strictの例(一部)
  - kind: para
    text: class Hoge {
  - kind: para
    text: /** 古いスタイルのコンストラクタ */
  - kind: para
    text: function Hoge() {
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p34:
  - kind: heading
    level: 1
    text: Deprecatedの例(一部)
  - kind: para
    text: //** PHP5.3でDeprecatedエラー、7で削除
  - kind: para
    text: $a = split(',', '1,2,3');
  - kind: para
    text: // エラー抑制演算子、通称なると
  - kind: para
    text: // エラーを握り潰せるべんりで危険なやつ
  - kind: para
    text: $a = @split(',', '1,2,3');
  p35:
  - kind: para
    text: Fatal Error (致命的エラー)
  - kind: para
    text: これ以上は続行できないエラー
  - kind: para
    text: 同名のクラスや関数を
  - kind: para
    text: 多重定義しようとしたとき
  - kind: para
    text: ファイルをrequireできなかったとき
  - kind: para
    text: 明らかに不正な式
  p36:
  - kind: heading
    level: 1
    text: Fatal Errorの例(一部)
  - kind: para
    text: // PHP5系とPHP7系でエラーになる
  - kind: para
    text: // タイミングが異なるコード
  - kind: para
    text: $i = mt_rand(1, 2);
  - kind: para
    text: echo $i;
  - kind: para
    text: if ($i === 1) {
  - kind: para
    text: // 数値と配列は加算できない
  - kind: para
    text: $x = 1 + [];
  - kind: para
    text: '}'
  p37:
  - kind: heading
    level: 1
    text: Fatal Errorの例(一部)
  - kind: para
    text: // PHP5系とPHP7系でエラーになる
  - kind: para
    text: // タイミングが異なるコード
  - kind: para
    text: 'PHP7: 何も出力されずFatal'
  - kind: para
    text: 'それ以外: 「1」とFatal'
  - kind: para
    text: または「2」のみ
  - kind: para
    text: $i = mt_rand(1, 2);
  - kind: para
    text: echo $i;
  - kind: para
    text: if ($i === 1) {
  - kind: para
    text: $x = 1 + [];
  - kind: para
    text: '}'
  p38:
  - kind: para
    text: PHP7は賢いので、実際に
  - kind: para
    text: 実行されることがなくても
  - kind: para
    text: (絶対実行されないifの中だろうと)
  - kind: para
    text: コンパイル時に検出してくれる
  p39:
  - kind: para
    text: 例外
  p40:
  - kind: para
    text: 例外 (Exception, Throwable)
  - kind: para
    text: PHP5で追加された言語機能
  - kind: para
    text: 異常状態のときにthrowで投げる
  - kind: para
    text: たいいき(Non-local)
  - kind: para
    text: 大域脱出と呼ばれる機能
  - kind: para
    text: catch文で捕捉できる
  p41:
  - kind: para
    text: 例外オブジェクト
  - kind: para
    text: PHP5ではExceptionまたは、
  - kind: para
    text: Exceptionを継承したクラス
  - kind: para
    text: PHP7ではThrowableインターフェ
  - kind: para
    text: イスと、Exceptionを継承しない
  - kind: para
    text: Errorとその派生クラスが追加
  - kind: para
    text: 便宜上まとめて「例外」と呼ぶ
  p42:
  - kind: para
    text: ErrorとエラーとE_ERROR
  - kind: para
    text: PHP5系でエラーが発生したものが、
  - kind: para
    text: 7系では例外(Errorクラス)を
  - kind: para
    text: throwするように徐々に移行
  - kind: para
    text: すべての移行されたわけではなく、
  - kind: para
    text: まだエラーと例外の概念を両方
  - kind: para
    text: 知っておく必要がある
  - kind: para
    text: E_ERRORレベルのエラー…ややこしい
  p43:
  - kind: para
    text: エラー
  - kind: para
    text: ハンドリング
  p44:
  - kind: heading
    level: 1
    text: 伝統的なエラー処理手法
  - kind: para
    text: // MySQLに接続失敗したら異常終了
  - kind: para
    text: $db = mysql_connect() or die("接続に失敗しまし
  - kind: para
    text: た");
  - kind: heading
    level: 2
    text: die() は exit() と同じ意味
  - kind: heading
    level: 2
    text: ここでいきなり強制終了する
  - kind: heading
    level: 2
    text: そのあと処理はほとんどできない
  p45:
  - kind: para
    text: せめて例外に
  - kind: para
    text: if (do_something() === false) {
  - kind: para
    text: throw new FooException('do_something() が失敗した');
  - kind: para
    text: '}'
  - kind: para
    text: 現在実行中の処理を中断して、
  - kind: para
    text: try…catch まで遡る
  - kind: para
    text: catchできなかったら、そこで
  - kind: para
    text: おとなしく野垂れ死ぬしかない…?
  - kind: para
    text: ただちに終了されないので、
  - kind: para
    text: まだ挽回の余地がある
  p46:
  - kind: para
    text: エラーハンドリング
  - kind: para
    text: 発生したエラーをなんとかする
  p47:
  - kind: para
    text: エラーハンドリング
  - kind: para
    text: 発生したエラーをなんとかする
  - kind: para
    text: 'A: どうにか続行を試みる'
  - kind: para
    text: 'B: どうにもならないので諦める'
  p48:
  - kind: para
    text: エラーハンドリング
  - kind: para
    text: 発生したエラーをなんとかする
  - kind: para
    text: 'A: どうにか続行を試みる'
  - kind: para
    text: 'B: どうにもならないので諦める'
  - kind: para
    text: せめてログだけでも…
  - kind: para
    text: なんとか共通ナビゲーションと
  - kind: para
    text: ロゴだけは表示してほしい…
  p49:
  - kind: para
    text: 我々に三回のチャンスがある
  - kind: para
    text: set_error_handler()
  - kind: para
    text: set_exception_handler()
  - kind: para
    text: register_shutdown_function()
  p50:
  - kind: para
    text: error_reporting()
  - kind: para
    text: 「出力するエラーの種類を設定する」
  - kind: para
    text: どのエラーレベルに対応するか
  - kind: para
    text: ビットフラグで設定する
  - kind: para
    text: 引数なしで呼ぶと現在の値を返す
  - kind: para
    text: error_reporting(E_ALL & ~E_NOTICE)
  p51:
  - kind: heading
    level: 1
    text: error_reporting() 設定方法
  - kind: para
    text: // 無視できるもの全部無視
  - kind: para
    text: error_reporting(0);
  - kind: para
    text: // 全部のエラーを捕捉する
  - kind: para
    text: error_reporting(E_ALL);
  - kind: para
    text: error_reporting(E_ALL | E_STRICT); // PHP 5.3以下
  - kind: para
    text: // Noticeのみ無視
  - kind: para
    text: error_reporting(E_ALL & ~E_NOTICE);
  - kind: para
    text: // NoticeとDeprecatedを無視
  - kind: para
    text: error_reporting(E_ALL & ~E_NOTICE & ~E_DEPRECATED);
  p52:
  - kind: para
    text: set_error_handler()
  - kind: para
    text: エラーが発生したときに、
  - kind: para
    text: set_error_hanlder() に登録した
  - kind: para
    text: 関数が呼ばれる
  - kind: para
    text: エラーに応じて処理を続行させる
  - kind: para
    text: こともできるし終了させてもいい
  - kind: para
    text: Fatal errorは捕捉できない！
  p53:
  - kind: para
    text: set_exception_handler()
  - kind: para
    text: 例外がtry-catchでも捕捉されな
  - kind: para
    text: かったときに、
  - kind: para
    text: set_exception_hanlder() に
  - kind: para
    text: 登録した関数が呼ばれる
  - kind: para
    text: 関数が実行された後は停止する
  - kind: para
    text: 登録できる関数はひとつだけ
  p54:
  - kind: para
    text: register_shutdown_function()
  - kind: para
    text: PHPスクリプト終了時に必ず
  - kind: para
    text: 呼ばれる関数を登録する
  - kind: para
    text: set_error_handler()に来ない
  - kind: para
    text: Fatal Error(致命的エラー)を
  - kind: para
    text: 捕捉してロギングできるチャンス
  - kind: para
    text: 最後のエメラルドスプラッシュ
  p55:
  - kind: para
    text: 定石
  p56:
  - kind: para
    text: エラー処理の定石
  - kind: para
    text: デフォルトのエラー出力を切る
  - kind: para
    text: エラーは例外に変換して、
  - kind: para
    text: 未捕捉の例外とまとめて処理する
  - kind: para
    text: 処理すべきエラーかどうかの判定
  - kind: para
    text: にerror_reporting()を利用する
  p57:
  - kind: para
    text: デフォルトのエラー出力
  p58:
  - kind: heading
    level: 1
    text: デフォルトのエラー出力
  - kind: para
    text: // 必ず読まれるPHPファイルで設定する
  - kind: para
    text: // 少なくとも本番環境では絶対offにする
  - kind: para
    text: ini_set('display_errors', 'off');
  p59:
  - kind: para
    text: set_exception_handler() 設定方法
  - kind: para
    text: // 例外をハンドリング
  - kind: para
    text: set_exception_handler(function ($e){
  - kind: para
    text: // 例外をログに記録
  - kind: para
    text: YourApp::logException($e);
  - kind: para
    text: // エラー時の画面を表示
  - kind: para
    text: YourApp::displayErrorPage($e);
  - kind: para
    text: '});'
  p60:
  - kind: para
    text: エラー抑制とerror_reporting
  - kind: para
    text: ＠(エラー抑制演算子)は一時的に
  - kind: para
    text: error_reporting(0)に設定して
  - kind: para
    text: 処理を実行するだけ
  - kind: para
    text: 独自設定したエラーハンドラが
  - kind: para
    text: error_reporting()を考慮してくれ
  - kind: para
    text: ないと、エラーが握り潰されない
  p61:
  - kind: heading
    level: 1
    text: set_error_handler() 設定方法
  - kind: para
    text: set_error_handler('my_error_handler');
  - kind: para
    text: function my_error_handler (
  - kind: para
    text: $level, $message, $file = null, $line = null) {
  - kind: para
    text: // エラーレベルのAND(ビット積)をとる
  - kind: para
    text: if (error_reporting() & $level > 0) {
  - kind: para
    text: throw new ErrorException(
  - kind: para
    text: $message, 0, $level, $file, $line);
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p62:
  - kind: para
    text: error_reporting()
  - kind: para
    text: error_reporting()で設定した
  - kind: para
    text: エラーレベルはデフォルトの
  - kind: para
    text: エラーハンドラで利用される
  - kind: para
    text: 自作のエラーハンドラを設定する
  - kind: para
    text: ときは、error_reporting()を
  - kind: para
    text: 考慮して実装しなければならない
  - kind: para
    text: 実際グローバル変数みたいなもの
  p63:
  - kind: heading
    level: 1
    text: register_shutdown_function() 設定方法
  - kind: para
    text: register_shutdown_function(function(){
  - kind: para
    text: if (empty($error = error_get_last())) return;
  - kind: para
    text: // エラーハンドラーで捕捉できないエラーを判定
  - kind: para
    text: $fatal = E_ERROR | E_PARSE | E_COMPILE_WARNING
  - kind: para
    text: '| E_CORE_ERROR|E_CORE_WARNING|E_COMPILE_ERROR;'
  - kind: para
    text: if (($error['level'] & $fatal_errors) > 0) {
  - kind: para
    text: $e = new ErrorException($error['message'], 0,
  - kind: para
    text: $error['type'], $error['file'], $error['line']);
  - kind: para
    text: my_error_handler($e);
  - kind: para
    text: '}'
  - kind: para
    text: '})；'
  p64:
  - kind: para
    text: 例外のロギング
  - kind: para
    text: PHPの標準機能error_log()は、
  - kind: para
    text: ちょっと弱い
  - kind: para
    text: rollbar, faultlineなどに送る
  - kind: para
    text: pixivの場合は例外情報をバックト
  - kind: para
    text: レースも含めてJSONエンコードし
  - kind: para
    text: てファイルに追記、Fluentdで収集
  p65:
  - kind: para
    text: http://k1low.hatenablog.com/entry/2017/06/13/083000
  p66:
  - kind: para
    text: 開発時の原則
  p67:
  - kind: para
    text: error_reporting()
  - kind: para
    text: 可能な限り無視しない
  - kind: para
    text: '例: 本番ではDeprecatedを無視'
  - kind: para
    text: ただしプロジェクト全体にNotice
  - kind: para
    text: 発生箇所が多い場合は無理しない
  - kind: para
    text: 一気にリファクタリングしようと
  - kind: para
    text: してエンバグする方がずっと怖い
  p68:
  - kind: para
    text: エラー設定は初期化処理で実行する
  - kind: para
    text: error_reportingはphp.iniでも
  - kind: para
    text: 設定可能だが、PHPで明示的に
  - kind: para
    text: 設定すれば環境依存がなくなる
  - kind: para
    text: 深いところで仕方なく変更する
  - kind: para
    text: 必要に迫られたときは、小さな
  - kind: para
    text: スコープで変更してすぐに戻す
  p69:
  - kind: para
    text: 段階的にエラーレベルを上げる
  - kind: para
    text: pixivの開発時にもまだNoticeが
  - kind: para
    text: 発生する箇所が残ってる…
  - kind: para
    text: やむを得ず変更する際は浅い位置
  - kind: para
    text: (例:コントローラ)で設定する
  - kind: para
    text: Deprecatedはユニットテストで
  - kind: para
    text: 追い詰めていく
  p70:
  - kind: heading
    level: 1
    text: pixivの設定
  - kind: para
    text: // 全体設定
  - kind: para
    text: error_reporting(E_ALL & ~E_NOTICE & ~E_DEPRECATED);
  - kind: para
    text: // ユニットテスト
  - kind: para
    text: error_reporting(E_ALL);
  - kind: para
    text: // 新規ファイルや動作確認できたページ
  - kind: para
    text: // (コントローラー)単位でレベルを上げる
  - kind: para
    text: setErrorReportingAll();
  p71:
  - kind: heading
    level: 1
    text: べんりヘルパー関数
  - kind: para
    text: /**
  - kind: para
    text: '* 開発時のみエラーレベルを最大に上げる'
  - kind: para
    text: '*'
  - kind: para
    text: '* 本番(運用環境)には影響しない'
  - kind: para
    text: '*/'
  - kind: para
    text: function setErrorReportingAll() {
  - kind: para
    text: if (is_development()) {
  - kind: para
    text: error_reporting(E_ALL);
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p72:
  - kind: heading
    level: 1
    text: 深いところで一時的にエラーレベルを変更
  - kind: para
    text: /** mcryptは7.1で非推奨、7.2で削除予定 */
  - kind: para
    text: function mcrypt_wrapper($text) {
  - kind: para
    text: $err = error_reporting();
  - kind: para
    text: error_reporting(E_ALL & ~E_DEPRECATED);
  - kind: para
    text: try {
  - kind: para
    text: // mcryptを使った処理
  - kind: para
    text: '} finally {'
  - kind: para
    text: error_reporting($err);
  - kind: para
    text: '}'
  - kind: para
    text: return $result;
  - kind: para
    text: '}'
  p73:
  - kind: heading
    level: 1
    text: 手を出せないライブラリ/SDK
  - kind: para
    text: /** なんかエラー吐きまくる古いSDKのラッパー */
  - kind: para
    text: function hoge_legacy_wrapper($text) {
  - kind: para
    text: $err = error_reporting();
  - kind: para
    text: error_reporting(E_ALL &~E_NOTICE & ~E_DEPRECATED);
  - kind: para
    text: try {
  - kind: para
    text: $result = \Hoge\Legacy\SDK::proc();
  - kind: para
    text: '} finally {'
  - kind: para
    text: error_reporting($err);
  - kind: para
    text: '}'
  - kind: para
    text: return $result;
  - kind: para
    text: '}'
  p74:
  - kind: para
    text: whoops!
  p75:
  - kind: para
    text: whoops!
  - kind: para
    text: “PHP errors for cool kids”
  - kind: para
    text: エラー処理用フレームワーク
  - kind: para
    text: set_exception_handler()は
  - kind: para
    text: ひとつしかハンドラを登録できな
  - kind: para
    text: いが、whoopsは複数登録できる
  p76: []
  p77:
  - kind: para
    text: whoops! ハンドラー
  - kind: para
    text: ハンドラー(関数)は複数登録できる
  - kind: para
    text: スタック (FIFO, 後入れ先出し)
  - kind: para
    text: ロギング・デバッグだけでなく
  - kind: para
    text: エラー画面の表示にも利用できる
  - kind: para
    text: WEB+DB Press Vol.96サンプルに
  - kind: para
    text: whoopsを使った設定例書きました
  - kind: para
    text: http://gihyo.jp/magazine/wdpress/archive/2017/vol96
  p78:
  - kind: para
    text: whoops! 注意点
  - kind: para
    text: PrettyPageHandlerはべんりだが
  - kind: para
    text: もし本番環境で有効化されてしま
  - kind: para
    text: うと脆弱性や情報漏洩の原因にす
  - kind: para
    text: らなりかねない
  - kind: para
    text: 設定に自信がなければ、単に
  - kind: para
    text: 開発環境用のカッコイイエラー
  - kind: para
    text: 画面として割り切るのが安全
  p79:
  - kind: heading
    level: 1
    text: whoopsの有効化
  - kind: para
    text: // 開発時のみWhoopsを有効化する場合
  - kind: para
    text: if (is_development()) {
  - kind: para
    text: $handler = (PHP_SAPI === 'cli')
  - kind: para
    text: '? new \Whoops\Handler\PlainTextHandler'
  - kind: para
    text: ': new \Whoops\Handler\PrettyPageHandler;'
  - kind: para
    text: $whoops = new \Whoops\Run;
  - kind: para
    text: $whoops->register();
  - kind: para
    text: '}'
  p80:
  - kind: para
    text: 落穂
  p81:
  - kind: para
    text: エラーレベルとビットフラグ
  - kind: para
    text: エラー発生時のレベルと
  - kind: para
    text: error_reporting()はビットフラグ
  - kind: para
    text: E_ALLは全種類のエラーの
  - kind: para
    text: フラグを立てた状態
  - kind: para
    text: E_ALL & ~E_NOTICEのように
  - kind: para
    text: 反転してビット積をとるのが簡単
  p82:
  - kind: heading
    level: 1
    text: ビットフラグの確認方法
  - kind: para
    text: printf('%015b', E_ALL);
  - kind: para
    text: // => "111111111111111"
  - kind: para
    text: printf('%015b', E_DEPRECATED);
  - kind: para
    text: // => "010000000000000"
  - kind: para
    text: printf('%015b', E_ALL & ~E_DEPRECATED);
  - kind: para
    text: // => "101111111111111"
  p83:
  - kind: para
    text: trigger_error()
  - kind: para
    text: エラーを意図的に発生させる
  - kind: para
    text: ただし全てのエラーを発生させら
  - kind: para
    text: れるわけではなくE_USER_系のみ
  - kind: para
    text: 今日エラーはあまり考慮されてな
  - kind: para
    text: いので、役立たないかも…
  - kind: para
    text: USERの有無は別のエラーなので
  p84:
  - kind: heading
    level: 1
    text: trigger_error利用例
  - kind: para
    text: // 関数をリネームしたいとき
  - kind: para
    text: /**
  - kind: para
    text: '* @deprecated {@see grant()} を使ってください'
  - kind: para
    text: '*/'
  - kind: para
    text: function credential(array $data){
  - kind: para
    text: $msg = 'credential() is obsolete function. Use
  - kind: para
    text: grant() instead.';
  - kind: para
    text: trigger_error($msg, E_USER_DEPRECATED);
  - kind: para
    text: return grant($data);
  - kind: para
    text: '}'
  p85:
  - kind: para
    text: もうひとつのエラーハンドリング
  - kind: para
    text: set_exception_handler()を使った
  - kind: para
    text: ハンドリングは…実際(説明)難しい
  - kind: para
    text: 細かなエラーハンドリングは
  - kind: para
    text: try-catchを使った方がやりやすい
  - kind: para
    text: エラーの仕組み(このセッションで説明
  - kind: para
    text: した内容！)よりは把握しやすい
  - kind: para
    text: https://gist.github.com/zonuexe/577d089815e241d5da26
  p86:
  - kind: para
    text: pixivの場合 (AppRunnerパターン)
  - kind: para
    text: アプリケーション(PC版, スマートフォン版,
  - kind: para
    text: etc...)ごとにAppRunner(社内用語)と
  - kind: para
    text: 呼ばれるクラスを定義する
  - kind: para
    text: 例外の種類ごとにcatchして、
  - kind: para
    text: 適切な処理(ロギング・エラー表示)
  - kind: para
    text: などをする
  - kind: para
    text: http://inside.pixiv.net/entry/2015/12/18/210721
  p87:
  - kind: para
    text: pixivの場合 (なぜこのパターンか)
  - kind: para
    text: 例外にも種類がある
  - kind: para
    text: アプリケーションのバグ
  - kind: para
    text: クエリパラメータの異常入力
  - kind: para
    text: それらのアプリケーションの
  - kind: para
    text: 事情に沿ってロギングする
