text:
  p1:
  - kind: heading
    level: 1
    text: ここで差がつくエラー処理
  - kind: para
    text: By Error Handling your application will be completed
  - kind: heading
    level: 2
    text: ެ։༻׬શ൛
  - kind: para
    text: PHP Conference Japan 2017, 8th Oct
  - kind: para
    text: 'Kamata Tokyo, PiO #phpcon2017'
  p2:
  - kind: para
    text: 2017年10月8日に開催されたPHPカンファレンスで発表した「ここで差がつくエラー処理」の発表資料を補訂した完全版です
  p3:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社技術基盤チーム (pixiv.net)
    - Emacs Lisper, PHPer
    - 入社前は自宅警備をしながらRuby書いてた
    - Emacs PHP Modeのメンテナ引き継ぎました
    - Qiitaに記事を書いたり変なコメントしてるよ
  p4: []
  p5:
  - kind: para
    text: We are hiring!
  p6:
  - kind: para
    text: はじめに
  p7:
  - kind: para
    text: みなさん困ってませんか
  p8: []
  p9:
  - kind: para
    text: こんな画面を見せてしまってませんか
  p10: []
  p11:
  - kind: para
    text: 本番サービスで見せちゃってませんか
  p12: []
  p13:
  - kind: para
    text: HTML 出力途中で落ちたりしませんか
  p14: []
  p15:
  - kind: para
    text: エラーになってもWebサイトの体裁はなんとか保ちたい……ですよね？
  p16:
  - kind: para
    text: 画面はpixivの実在のバグではなく故意に例外を発生させたものです
  p17:
  - kind: para
    text: アジェンダ
  p18:
  - kind: para
    text: 1. 例外・エラーの種類2. 本番環境でのエラー処理3. 開発環境でのエラー処理
  p19:
  - kind: para
    text: 具体的にはこんな話をします
  - kind: para
    text: エラーと例外の基本概念
  - kind: para
    text: それらを制御するやりかた
  - kind: para
    text: 開発環境でうんざりしない方法
  p20:
  - kind: heading
    level: 1
    text: 参考資料
  - kind: heading
    level: 2
    text: だいたいPHPマニュアルに載ってる
  - kind: para
    text: http://php.net/language.operators.errorcontrol
  - kind: para
    text: http://php.net/set_error_handler
  - kind: para
    text: http://php.net/set_exception_handler
  - kind: para
    text: http://php.net/register_shutdown_function
  - kind: para
    text: http://php.net/ErrorException
  - kind: para
    text: http://php.net/display-errors
  - kind: heading
    level: 2
    text: whoops! https://github.com/filp/whoops
  p21:
  - kind: para
    text: やらない話
  - kind: para
    text: エラー監視
  - kind: para
    text: 例外設計
  - kind: para
    text: そもそもエラーって何だ
  p22:
  - kind: para
    text: PHPのコードの試しかた
  - kind: para
    text: php -r 'var_dump(1 + []);'
  - kind: para
    text: REPL (PsySH または php -a)
  - kind: para
    text: https://3v4l.org/
  - kind: para
    text: 多くのバージョンで串刺し実行
  p23:
  - kind: para
    text: エラー・例外とは
  - kind: para
    text: プログラムが正常ではないときに、それを通知する仕組み
  - kind: para
    text: PHPではエラーと例外がある
  - kind: para
    text: PHP5では処理系は基本的にエラー
  - kind: para
    text: PHP7で例外を投げることが増えた
  p24:
  - kind: para
    text: 1. 例外・エラーの種類2. 本番環境でのエラー処理3. 開発環境でのエラー処理
  p25:
  - kind: para
    text: エラー
  p26:
  - kind: para
    text: エラー
  - kind: para
    text: 従来のPHPで異常状態を通知するための仕組み
  - kind: para
    text: 関数呼び出し、未定義変数の参照結構いろんなところで発生する
  - kind: para
    text: PHP7で種類が整理された
  p27:
  - kind: para
    text: 主要なエラー
  - kind: para
    text: Notice よくない処理の通知
  - kind: para
    text: Warning, Error
  - kind: para
    text: 実行時の警告・エラー
  - kind: para
    text: Deprecated, Strict
  - kind: para
    text: 非互換／廃止予定の機能
  - kind: para
    text: Fatal Error 致命的エラー
  p28:
  - kind: para
    text: Notice
  - kind: para
    text: 配列の未定義位置から値を取り出そうとしたときなどに発生する
  - kind: para
    text: 信号無視みたいな軽犯罪
  - kind: para
    text: ただしバグの温床になるので、無視せずきちんと対処を強く推奨
  p29:
  - kind: heading
    level: 1
    text: Noticeの例 (一部)
  - kind: para
    text: echo $i; // 存在しない変数
  - kind: para
    text: echo $_GET['id']; // 存在しないインデクス
  - kind: para
    text: echo $o->abc; // 存在しないプロパティ
  p30:
  - kind: para
    text: Warning, Error
  - kind: para
    text: 何かが「間違ってる」ときに発生
  - kind: para
    text: デフォルトの挙動ではWarningでは停止せずに進む
  - kind: para
    text: 一貫性がないが、どちらも異常状態なので無視せず直した方がよい
  p31:
  - kind: heading
    level: 1
    text: Warning, Errorの例(一部)
  - kind: para
    text: // 存在しないファイルを開く
  - kind: para
    text: $f = fopen("/hoge.txt", "r");
  - kind: para
    text: foo($i); // 引数が足りない、PHP5のみ
  - kind: para
    text: // PHP7ではArgumentErrorに変更
  - kind: para
    text: function foo($i, $j) { echo $i, $j; }
  p32:
  - kind: para
    text: Deprecated, Strict
  - kind: para
    text: 廃止予定や互換性の怪しい機能
  - kind: para
    text: '例: split() 関数 (explode()とは別物)'
  - kind: para
    text: 5.3でdeprecated、7.0で削除
  - kind: para
    text: Strictは7.0で廃止(再分類)された
  - kind: para
    text: https://wiki.php.net/rfc/reclassify_e_strict
  p33:
  - kind: heading
    level: 1
    text: Deprecated, Strictの例(一部)
  - kind: para
    text: class Hoge {/** 古いスタイルのコンストラクタ */
  - kind: para
    text: function Hoge() {}}
  p34:
  - kind: heading
    level: 1
    text: Deprecatedの例(一部)
  - kind: para
    text: //** PHP5.3でDeprecatedエラー、7で削除
  - kind: para
    text: $a = split(',', '1,2,3');// エラー抑制演算子、通称なると
  - kind: para
    text: // エラーを握り潰せるべんりで危険なやつ
  - kind: para
    text: $a = @split(',', '1,2,3');
  p35:
  - kind: para
    text: Fatal Error (致命的エラー)
  - kind: para
    text: これ以上は続行できないエラー
  - kind: para
    text: 同名のクラスや関数を多重定義しようとしたとき
  - kind: para
    text: ファイルをrequireできなかったとき
  - kind: para
    text: 明らかに不正な式
  p36:
  - kind: heading
    level: 1
    text: Fatal Errorの例(一部)
  - kind: para
    text: // PHP5系とPHP7系でエラーになる
  - kind: para
    text: // タイミングが異なるコード
  - kind: para
    text: $i = mt_rand(1, 2);echo $i;if ($i === 1) {// 数値と配列は加算できない
  - kind: para
    text: $x = 1 + [];}
  p37:
  - kind: heading
    level: 1
    text: Fatal Errorの例(一部)
  - kind: para
    text: // PHP5系とPHP7系でエラーになる
  - kind: para
    text: // タイミングが異なるコード
  - kind: para
    text: 'PHP7: 何も出力されずFatal'
  - kind: para
    text: 'それ以外: 「1」とFatalまたは「2」のみ'
  - kind: para
    text: $i = mt_rand(1, 2);echo $i;if ($i === 1) {$x = 1 + [];}
  p38:
  - kind: para
    text: PHP7は賢いので、実際に実行されることがなくても(絶対実行されないifの中だろうと)コンパイル時に検出してくれる
  p39:
  - kind: para
    text: 例外
  p40:
  - kind: para
    text: 例外 (Exception, Throwable)
  - kind: para
    text: PHP5で追加された言語機能
  - kind: para
    text: 異常状態のときにthrowで投げる
  - kind: para
    text: たいいき(Non-local)
  - kind: para
    text: 大域脱出と呼ばれる機能
  - kind: para
    text: catch文で捕捉できる
  p41:
  - kind: para
    text: 例外オブジェクト
  - kind: para
    text: PHP5ではExceptionまたは、Exceptionを継承したクラスPHP7ではThrowableインターフェイスと、Exceptionを継承しないErrorとその派生クラスが追加
  - kind: para
    text: 便宜上まとめて「例外」と呼ぶ
  p42:
  - kind: para
    text: ErrorとエラーとE_ERROR
  - kind: para
    text: PHP5系でエラーが発生したものが、7系では例外(Errorクラス)をthrowするように徐々に移行すべての移行されたわけではなく、まだエラーと例外の概念を両方知っておく必要がある
  - kind: para
    text: E_ERRORレベルのエラー…ややこしい
  p43:
  - kind: para
    text: エラーハンドリング
  p44:
  - kind: heading
    level: 1
    text: 伝統的なエラー処理手法
  - kind: para
    text: // MySQLに接続失敗したら異常終了$db = mysql_connect() or die("接続に失敗しました");
  - kind: heading
    level: 2
    text: die() は exit() と同じ意味
  - kind: heading
    level: 2
    text: ここでいきなり強制終了する
  - kind: heading
    level: 2
    text: そのあと処理はほとんどできない
  p45:
  - kind: para
    text: せめて例外に
  - kind: para
    text: if (do_something() === false) {throw new FooException('do_something() が失敗した');}
  - kind: para
    text: 現在実行中の処理を中断して、try…catch まで遡る
  - kind: para
    text: catchできなかったら、そこでおとなしく野垂れ死ぬしかない…?
  - kind: para
    text: ただちに終了されないので、まだ挽回の余地がある
  p46:
  - kind: para
    text: エラーハンドリング
  - kind: para
    text: 発生したエラーをなんとかする
  p47:
  - kind: para
    text: エラーハンドリング
  - kind: para
    text: 発生したエラーをなんとかする
  - kind: para
    text: 'A: どうにか続行を試みる'
  - kind: para
    text: 'B: どうにもならないので諦める'
  p48:
  - kind: para
    text: エラーハンドリング
  - kind: para
    text: 発生したエラーをなんとかする
  - kind: para
    text: 'A: どうにか続行を試みる'
  - kind: para
    text: 'B: どうにもならないので諦める'
  - kind: para
    text: せめてログだけでも…
  - kind: para
    text: なんとか共通ナビゲーションとロゴだけは表示してほしい…
  p49:
  - kind: para
    text: 我々に三回のチャンスがある
  - kind: para
    text: set_error_handler()
  - kind: para
    text: set_exception_handler()
  - kind: para
    text: register_shutdown_function()
  p50:
  - kind: para
    text: error_reporting()
  - kind: para
    text: 「出力するエラーの種類を設定する」
  - kind: para
    text: どのエラーレベルに対応するかビットフラグで設定する
  - kind: para
    text: 引数なしで呼ぶと現在の値を返す
  - kind: para
    text: error_reporting(E_ALL & ~E_NOTICE)
  p51:
  - kind: heading
    level: 1
    text: error_reporting() 設定方法
  - kind: para
    text: // 無視できるもの全部無視error_reporting(0);// 全部のエラーを捕捉する
  - kind: para
    text: error_reporting(E_ALL);error_reporting(E_ALL | E_STRICT); // PHP 5.3以下//
      Noticeのみ無視
  - kind: para
    text: error_reporting(E_ALL & ~E_NOTICE);// NoticeとDeprecatedを無視error_reporting(E_ALL
      & ~E_NOTICE & ~E_DEPRECATED);
  p52:
  - kind: para
    text: set_error_handler()
  - kind: para
    text: エラーが発生したときに、set_error_hanlder() に登録した関数が呼ばれる
  - kind: para
    text: エラーに応じて処理を続行させることもできるし終了させてもいい
  - kind: para
    text: Fatal errorは捕捉できない！
  p53:
  - kind: para
    text: set_exception_handler()
  - kind: para
    text: 例外がtry-catchでも捕捉されなかったときに、set_exception_hanlder() に登録した関数が呼ばれる
  - kind: para
    text: 関数が実行された後は停止する
  - kind: para
    text: 登録できる関数はひとつだけ
  p54:
  - kind: para
    text: register_shutdown_function()
  - kind: para
    text: PHPスクリプト終了時に必ず呼ばれる関数を登録する
  - kind: para
    text: set_error_handler()に来ないFatal Error(致命的エラー)を捕捉してロギングできるチャンス
  - kind: para
    text: 最後のエメラルドスプラッシュ
  p55:
  - kind: para
    text: 定石
  p56:
  - kind: para
    text: エラー処理の定石
  - kind: para
    text: デフォルトのエラー出力を切る
  - kind: para
    text: エラーは例外に変換して、未捕捉の例外とまとめて処理する
  - kind: para
    text: 処理すべきエラーかどうかの判定にerror_reporting()を利用する
  p57:
  - kind: para
    text: デフォルトのエラー出力
  p58:
  - kind: heading
    level: 1
    text: デフォルトのエラー出力
  - kind: para
    text: // 必ず読まれるPHPファイルで設定する
  - kind: para
    text: // 少なくとも本番環境では絶対offにする
  - kind: para
    text: ini_set('display_errors', 'off');
  p59:
  - kind: para
    text: set_exception_handler() 設定方法
  - kind: para
    text: // 例外をハンドリング
  - kind: para
    text: set_exception_handler(function ($e){// 例外をログに記録
  - kind: para
    text: YourApp::logException($e);// エラー時の画面を表示
  - kind: para
    text: YourApp::displayErrorPage($e);});
  p60:
  - kind: para
    text: エラー抑制とerror_reporting
  - kind: para
    text: ＠(エラー抑制演算子)は一時的にerror_reporting(0)に設定して処理を実行するだけ独自設定したエラーハンドラがerror_reporting()を考慮してくれないと、エラーが握り潰されない
  p61:
  - kind: heading
    level: 1
    text: set_error_handler() 設定方法
  - kind: para
    text: set_error_handler('my_error_handler');function my_error_handler ($level,
      $message, $file = null, $line = null) {// エラーレベルのAND(ビット積)をとる
  - kind: para
    text: if (error_reporting() & $level > 0) {throw new ErrorException($message,
      0, $level, $file, $line);}}
  p62:
  - kind: para
    text: error_reporting()
  - kind: para
    text: error_reporting()で設定したエラーレベルはデフォルトのエラーハンドラで利用される自作のエラーハンドラを設定するときは、error_reporting()を考慮して実装しなければならない
  - kind: para
    text: 実際グローバル変数みたいなもの
  p63:
  - kind: heading
    level: 1
    text: register_shutdown_function() 設定方法
  - kind: para
    text: register_shutdown_function(function(){if (empty($error = error_get_last()))
      return;// エラーハンドラーで捕捉できないエラーを判定
  - kind: para
    text: $fatal = E_ERROR | E_PARSE | E_COMPILE_WARNING
  - kind: para
    text: '| E_CORE_ERROR|E_CORE_WARNING|E_COMPILE_ERROR;if (($error[''level''] &
      $fatal_errors) > 0) {$e = new ErrorException($error[''message''], 0,$error[''type''],
      $error[''file''], $error[''line'']);my_error_handler($e);}'
  - kind: para
    text: '})；'
  p64:
  - kind: para
    text: 例外のロギング
  - kind: para
    text: PHPの標準機能error_log()は、ちょっと弱い
  - kind: para
    text: rollbar, faultlineなどに送るpixivの場合は例外情報をバックトレースも含めてJSONエンコードしてファイルに追記、Fluentdで収集
  p65:
  - kind: para
    text: http://k1low.hatenablog.com/entry/2017/06/13/083000
  p66:
  - kind: para
    text: 開発時の原則
  p67:
  - kind: para
    text: error_reporting()
  - kind: para
    text: 可能な限り無視しない
  - kind: para
    text: '例: 本番ではDeprecatedを無視'
  - kind: para
    text: ただしプロジェクト全体にNotice発生箇所が多い場合は無理しない
  - kind: para
    text: 一気にリファクタリングしようとしてエンバグする方がずっと怖い
  p68:
  - kind: para
    text: エラー設定は初期化処理で実行する
  - kind: para
    text: error_reportingはphp.iniでも設定可能だが、PHPで明示的に設定すれば環境依存がなくなる
  - kind: para
    text: 深いところで仕方なく変更する必要に迫られたときは、小さなスコープで変更してすぐに戻す
  p69:
  - kind: para
    text: 段階的にエラーレベルを上げる
  - kind: para
    text: pixivの開発時にもまだNoticeが発生する箇所が残ってる…
  - kind: para
    text: やむを得ず変更する際は浅い位置(例:コントローラ)で設定する
  - kind: para
    text: Deprecatedはユニットテストで追い詰めていく
  p70:
  - kind: heading
    level: 1
    text: pixivの設定
  - kind: para
    text: // 全体設定
  - kind: para
    text: error_reporting(E_ALL & ~E_NOTICE & ~E_DEPRECATED);
  - kind: para
    text: // ユニットテスト
  - kind: para
    text: error_reporting(E_ALL);
  - kind: para
    text: // 新規ファイルや動作確認できたページ
  - kind: para
    text: // (コントローラー)単位でレベルを上げる
  - kind: para
    text: setErrorReportingAll();
  p71:
  - kind: heading
    level: 1
    text: べんりヘルパー関数
  - kind: para
    text: /*** 開発時のみエラーレベルを最大に上げる
  - kind: para
    text: '** 本番(運用環境)には影響しない*/'
  - kind: para
    text: function setErrorReportingAll() {if (is_development()) {error_reporting(E_ALL);}}
  p72:
  - kind: heading
    level: 1
    text: 深いところで一時的にエラーレベルを変更
  - kind: para
    text: /** mcryptは7.1で非推奨、7.2で削除予定 */function mcrypt_wrapper($text) {$err = error_reporting();error_reporting(E_ALL
      & ~E_DEPRECATED);try {// mcryptを使った処理
  - kind: para
    text: '} finally {error_reporting($err);}return $result;}'
  p73:
  - kind: heading
    level: 1
    text: 手を出せないライブラリ/SDK
  - kind: para
    text: /** なんかエラー吐きまくる古いSDKのラッパー */
  - kind: para
    text: function hoge_legacy_wrapper($text) {$err = error_reporting();error_reporting(E_ALL
      &~E_NOTICE & ~E_DEPRECATED);try {$result = \Hoge\Legacy\SDK::proc();} finally
      {error_reporting($err);}return $result;}
  p74:
  - kind: para
    text: whoops!
  p75:
  - kind: para
    text: whoops!“PHP errors for cool kids”
  - kind: para
    text: エラー処理用フレームワーク
  - kind: para
    text: set_exception_handler()はひとつしかハンドラを登録できないが、whoopsは複数登録できる
  p76: []
  p77:
  - kind: para
    text: whoops! ハンドラーハンドラー(関数)は複数登録できるスタック (FIFO, 後入れ先出し)
  - kind: para
    text: ロギング・デバッグだけでなくエラー画面の表示にも利用できる
  - kind: para
    text: WEB+DB Press Vol.96サンプルにwhoopsを使った設定例書きました
  - kind: para
    text: http://gihyo.jp/magazine/wdpress/archive/2017/vol96
  p78:
  - kind: para
    text: whoops! 注意点PrettyPageHandlerはべんりだがもし本番環境で有効化されてしまうと脆弱性や情報漏洩の原因にすらなりかねない
  - kind: para
    text: 設定に自信がなければ、単に開発環境用のカッコイイエラー画面として割り切るのが安全
  p79:
  - kind: heading
    level: 1
    text: whoopsの有効化
  - kind: para
    text: // 開発時のみWhoopsを有効化する場合
  - kind: para
    text: 'if (is_development()) {$handler = (PHP_SAPI === ''cli'')? new \Whoops\Handler\PlainTextHandler:
      new \Whoops\Handler\PrettyPageHandler;$whoops = new \Whoops\Run;$whoops->register();}'
  p80:
  - kind: para
    text: 落穂
  p81:
  - kind: para
    text: エラーレベルとビットフラグ
  - kind: para
    text: エラー発生時のレベルとerror_reporting()はビットフラグ
  - kind: para
    text: E_ALLは全種類のエラーのフラグを立てた状態
  - kind: para
    text: E_ALL & ~E_NOTICEのように反転してビット積をとるのが簡単
  p82:
  - kind: heading
    level: 1
    text: ビットフラグの確認方法
  - kind: para
    text: printf('%015b', E_ALL);// => "111111111111111"printf('%015b', E_DEPRECATED);//
      => "010000000000000"printf('%015b', E_ALL & ~E_DEPRECATED);// => "101111111111111"
  p83:
  - kind: para
    text: trigger_error()
  - kind: para
    text: エラーを意図的に発生させる
  - kind: para
    text: ただし全てのエラーを発生させられるわけではなくE_USER_系のみ
  - kind: para
    text: 今日エラーはあまり考慮されてないので、役立たないかも…
  - kind: para
    text: USERの有無は別のエラーなので
  p84:
  - kind: heading
    level: 1
    text: trigger_error利用例
  - kind: para
    text: // 関数をリネームしたいとき/*** @deprecated {@see grant()} を使ってください*/function credential(array
      $data){$msg = 'credential() is obsolete function. Use grant() instead.';trigger_error($msg,
      E_USER_DEPRECATED);return grant($data);}
  p85:
  - kind: para
    text: もうひとつのエラーハンドリング
  - kind: para
    text: set_exception_handler()を使ったハンドリングは…実際(説明)難しい細かなエラーハンドリングはtry-catchを使った方がやりやすい
  - kind: para
    text: エラーの仕組み(このセッションで説明した内容！)よりは把握しやすい
  - kind: para
    text: https://gist.github.com/zonuexe/577d089815e241d5da26
  p86:
  - kind: para
    text: pixivの場合 (AppRunnerパターン)
  - kind: para
    text: アプリケーション(PC版, スマートフォン版,etc...)ごとにAppRunner(社内用語)と呼ばれるクラスを定義する例外の種類ごとにcatchして、適切な処理(ロギング・エラー表示)などをする
  - kind: para
    text: http://inside.pixiv.net/entry/2015/12/18/210721
  p87:
  - kind: para
    text: pixivの場合 (なぜこのパターンか)
  - kind: para
    text: 例外にも種類がある
  - kind: para
    text: アプリケーションのバグ
  - kind: para
    text: クエリパラメータの異常入力
  - kind: para
    text: それらのアプリケーションの事情に沿ってロギングする
