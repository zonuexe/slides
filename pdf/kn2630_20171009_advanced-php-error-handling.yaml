  - kind: para
    text: 知っておくとためにはなる…かも
  - kind: para
    text: でも完全に理解してないといけないわけではないとは言っても社内で誰かが知っておかないと困ることではある
  - kind: para
    text: 「Noticeを潰せ」だけ周知したい
