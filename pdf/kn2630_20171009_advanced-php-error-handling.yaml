text:
  p1:
  - node: p
    children:
    - node: text
      content: ここで差がつくエラー処理
    - node: bold
      content: By Error Handling your application will be completed(cid:1964)(cid:1417)(cid:3899)(cid:1516)(cid:2742)(cid:3419)
    - node: text
      content: '         , 8th OctPHP Conference Japan 2017#phpcon2017Kamata Tokyo, PiO '
  p2:
  - node: p
    children:
    - node: text
      content: '         2017年10月8日に開催された         PHPカンファレンスで発表した         「ここで差がつくエラー処理」の完全版発表資料を補訂したです'
  p3:
  - node: p
    children:
    - node: text
      content: 'お前誰ようさみけんた (@tadsan) / Zonu.EXE

        '
    - node: text
      content: 'GitHub/Packagistでは id: zonuexe

        •ピクシブ株式会社技術基盤チーム (pixiv.net)

        •Emacs Lisper, PHPer

        •入社前は自宅警備をしながらRuby書いてた

        •Emacs PHP Modeのメンテナ引き継ぎました

        •Qiitaに記事を書いたり変なコメントしてるよ•'
  p5:
  - node: p
    children:
    - node: text
      content: We are hiring!
  p6:
  - node: p
    children:
    - node: text
      content: はじめに
  p7:
  - node: p
    children:
    - node: text
      content: みなさん困ってませんか
  p9:
  - node: p
    children:
    - node: text
      content: こんな画面を見せてしまってませんか
  p11:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 本番サービスで見せちゃってませんか
  p13:
  - node: p
    children:
    - node: text
      content: HTML 出力途中で落ちたりしませんか
  p15:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: エラーになってもWebサイトの体裁は
    - node: bold
      content: '         '
    - node: text
      content: なんとか保ちたい……ですよね？
  p16:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 画面はpixivの実在のバグではなく故意に例外を発生させたものです
  p17:
  - node: p
    children:
    - node: text
      content: アジェンダ
  p18:
  - node: p
    children:
    - node: text
      content: '1. 例外・エラーの種類

        2. 本番環境でのエラー処理

        3. 開発環境でのエラー処理'
  p19:
  - node: p
    children:
    - node: text
      content: '具体的にはこんな話をしますエラーと例外の基本概念

        それらを制御するやりかた

        開発環境でうんざりしない方法'
  p20:
  - node: p
    children:
    - node: text
      content: '参考資料だいたいPHPマニュアルに載ってる

        http://php.net/language.operators.errorcontrol

        http://php.net/set_error_handler

        http://php.net/set_exception_handler

        http://php.net/register_shutdown_function

        http://php.net/ErrorException

        http://php.net/display-errors

        whoops! https://github.com/filp/whoops'
  p21:
  - node: p
    children:
    - node: text
      content: 'やらない話エラー監視

        例外設計

        そもそもエラーって何だ'
  p22:
  - node: p
    children:
    - node: text
      content: 'PHPのコードの試しかたphp -r ''var_dump(1 + []);'' php -aREPL (PsySH または )

        https://3v4l.org/

        多くのバージョンで串刺し実行'
  p23:
  - node: p
    children:
    - node: text
      content: 'エラー・例外とはプログラムが正常ではないときに、それを通知する仕組み

        PHPではエラーと例外がある

        PHP5では処理系は基本的にエラー

        PHP7で例外を投げることが増えた'
  p24:
  - node: p
    children:
    - node: text
      content: '1. 例外・エラーの種類

        2. 本番環境でのエラー処理

        3. 開発環境でのエラー処理'
  p25:
  - node: p
    children:
    - node: text
      content: エラー
  p26:
  - node: p
    children:
    - node: text
      content: 'エラー         従来のPHPで異常状態を通知するための仕組み

        関数呼び出し未定義変数の参照、結構いろんなところで発生する

        PHPで種類が整理された7'
  p27:
  - node: p
    children:
    - node: text
      content: '主要なエラーNotice よくない処理の通知

        Warning, Error

        実行時の警告・エラー

        Deprecated, Strict

        非互換／廃止予定の機能

        Fatal Error 致命的エラー'
  p28:
  - node: p
    children:
    - node: text
      content: 'Notice配列の未定義位置から値を取り出そうとしたときなどに発生する

        信号無視みたいな軽犯罪

         ただしバグの温床になるので、無視せずきちんと対処を強く推奨'
  p29:
  - node: p
    children:
    - node: text
      content: 'Noticeの例 (一部)echo $i;          // 存在しない変数         echo $_GET[''id'']; // 存在しないインデクス

        echo $o->abc;     // 存在しないプロパティ'
  p30:
  - node: p
    children:
    - node: text
      content: 'Warning, Error何かが「間違ってる」ときに発生

        デフォルトの挙動ではWarningでは停止せずに進む

        一貫性がないが、どちらも異常状態なので無視せず直した方がよい'
  p31:
  - node: p
    children:
    - node: text
      content: 'Warning, Errorの例(一部)// 存在しないファイルを開く

        $f = fopen("/hoge.txt", "r");          foo($i); // 引数が足りない、PHP5のみ// ArgumentError PHP7ではに変更function foo($i, $j) {
        echo $i, $j; }         '
  p32:
  - node: p
    children:
    - node: text
      content: 'Deprecated, Strict廃止予定や互換性の怪しい機能

        split()例:  関数 

        explode()(とは別物)5.3でdeprecated、7.0で削除

         Strictは7.0で廃止(再分類)されたhttps://wiki.php.net/rfc/reclassify_e_strict'
  p33:
  - node: p
    children:
    - node: text
      content: 'Deprecated, Strictの例(一部)class Hoge {             /**  */古いスタイルのコンストラクタ             function Hoge() {             }         } '
  p34:
  - node: p
    children:
    - node: text
      content: 'Deprecatedの例(一部)//** PHP5.3でDeprecatedエラー、7で削除         $a = split('','', ''1,2,3'');

          // エラー抑制演算子、通称なると// エラーを握り潰せるべんりで危険なやつ         $a = @split('','', ''1,2,3'');

        '
  p35:
  - node: p
    children:
    - node: text
      content: 'Fatal Error (致命的エラー)これ以上は続行できないエラー

         同名のクラスや関数を多重定義しようとしたとき

        requireファイルをできなかったとき

        明らかに不正な式'
  p36:
  - node: p
    children:
    - node: text
      content: 'Fatal Errorの例(一部)// PHP5系とPHP7系でエラーになる

        // タイミングが異なるコード         $i = mt_rand(1, 2); echo $i;         if ($i === 1) {             // 数値と配列は加算できない             $x = 1 + [];         }'
  p37:
  - node: p
    children:
    - node: text
      content: 'Fatal Errorの例(一部)// PHP5系とPHP7系でエラーになる

        // タイミングが異なるコード         $i = mt_rand(1, 2); echo $i;          : 何も出力されずFatalPHP7if ($i === 1) {          : 「1」とFatalそれ以外　  または「2」のみ    $x = 1 + [];         }'
  p38:
  - node: p
    children:
    - node: text
      content: '         PHP7は賢いので、実際に         実行されることがなくても(絶対実行されないifの中だろうと)'
    - node: bold
      content: '         '
    - node: text
      content: コンパイル時に検出してくれる
  p39:
  - node: p
    children:
    - node: text
      content: 例外
  p40:
  - node: p
    children:
    - node: text
      content: 'ExceptionThrowable例外 (, )PHP5で追加された言語機能

        throw異常状態のときにで投げる

        たいいき(Non-local)大域脱出と呼ばれる機能

        catch文で捕捉できる'
  p41:
  - node: p
    children:
    - node: text
      content: '例外オブジェクトPHP5ではExceptionまたは、Exceptionを継承したクラス

        PHP7ではThrowableインターフェ         イスと、Exceptionを継承しないErrorとその派生クラスが追加

        便宜上まとめて「例外」と呼ぶ'
  p42:
  - node: p
    children:
    - node: text
      content: 'ErrorとエラーとE_ERRORPHP5系でエラーが発生したものが、7系では例外(Errorクラス)をthrowするように徐々に移行

        すべての移行されたわけではなく、         まだエラーと例外の概念を両方知っておく必要がある

        E_ERRORレベルのエラー…ややこしい'
  p43:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: エラーハンドリング
  p44:
  - node: p
    children:
    - node: text
      content: '伝統的なエラー処理手法// MySQLに接続失敗したら異常終了

        $db = mysql_connect() or die("接続に失敗しました");die() は exit() と同じ意味

        ここでいきなり強制終了する

        そのあと処理はほとんどできない'
  p45:
  - node: p
    children:
    - node: text
      content: 'せめて例外にif (do_something() === false) {             throw new FooException(''do_something() が失敗した'');         }         現在実行中の処理を中断して、try…catch まで遡る

         catchできなかったら、そこでおとなしく野垂れ死ぬしかない…?

         ただちに終了されないので、まだ挽回の余地がある'
  p46:
  - node: p
    children:
    - node: text
      content: エラーハンドリング発生したエラーをなんとかする
  p47:
  - node: p
    children:
    - node: text
      content: 'エラーハンドリング発生したエラーをなんとかする

        A: どうにか続行を試みる

        B: どうにもならないので諦める'
  p48:
  - node: p
    children:
    - node: text
      content: 'エラーハンドリング発生したエラーをなんとかする

        A: どうにか続行を試みる

        B: どうにもならないので諦める

        せめてログだけでも…

         なんとか共通ナビゲーションとロゴだけは表示してほしい…'
  p49:
  - node: p
    children:
    - node: text
      content: 我々に三回のチャンスがあるset_error_handler() set_exception_handler() register_shutdown_function()
  p50:
  - node: p
    children:
    - node: text
      content: 'error_reporting()「出力するエラーの種類を設定する」

         どのエラーレベルに対応するかビットフラグで設定する

        引数なしで呼ぶと現在の値を返す

        error_reporting(E_ALL & ~E_NOTICE)'
  p51:
  - node: p
    children:
    - node: text
      content: 'error_reporting() 設定方法         // 無視できるもの全部無視error_reporting(0);         // 全部のエラーを捕捉する         error_reporting(E_ALL);         error_reporting(E_ALL | E_STRICT); // PHP 5.3以下         // Noticeのみ無視         error_reporting(E_ALL & ~E_NOTICE);         // NoticeとDeprecatedを無視         error_reporting(E_ALL & ~E_NOTICE & ~E_DEPRECATED); '
  p52:
  - node: p
    children:
    - node: text
      content: 'set_error_handler()         エラーが発生したときに、         set_error_hanlder() に登録した関数が呼ばれる

        エラーに応じて処理を続行させることもできるし終了させてもいい

        Fatal errorは捕捉できない！'
  p53:
  - node: p
    children:
    - node: text
      content: 'set_exception_handler()例外がtry-catchでも捕捉されな         かったときに、         set_exception_hanlder() に登録した関数が呼ばれる

        関数が実行された後は停止する

        登録できる関数はひとつだけ'
  p54:
  - node: p
    children:
    - node: text
      content: 'register_shutdown_function()         PHPスクリプト終了時に必ず呼ばれる関数を登録する

         set_error_handler()に来ない         Fatal Error(致命的エラー)を捕捉してロギングできるチャンス

        最後のエメラルドスプラッシュ'
  p55:
  - node: p
    children:
    - node: text
      content: 定石
  p56:
  - node: p
    children:
    - node: text
      content: 'エラー処理の定石デフォルトのエラー出力を切る

         エラーは例外に変換して、未捕捉の例外とまとめて処理する

        処理すべきエラーかどうかの判定error_reporting()にを利用する'
  p57:
  - node: p
    children:
    - node: text
      content: デフォルトのエラー出力
  p58:
  - node: p
    children:
    - node: text
      content: 'デフォルトのエラー出力         // 必ず読まれるPHPファイルで設定する// 少なくとも本番環境では絶対offにするini_set(''display_errors'', ''off'');         '
  p59:
  - node: p
    children:
    - node: text
      content: 'set_exception_handler() 設定方法         // 例外をハンドリングset_exception_handler(function ($e){             // 例外をログに記録             YourApp::logException($e);             // エラー時の画面を表示             YourApp::displayErrorPage($e);         });'
  p60:
  - node: p
    children:
    - node: text
      content: 'エラー抑制とerror_reporting＠は一時的に(エラー抑制演算子)         error_reporting(0)に設定して処理を実行するだけ

        独自設定したエラーハンドラがerror_reporting()を考慮してくれないと、エラーが握り潰されない'
  p61:
  - node: p
    children:
    - node: text
      content: 'set_error_handler() 設定方法set_error_handler(''my_error_handler'');         function my_error_handler (             $level, $message, $file = null, $line = null) {             // エラーレベルのAND(ビット積)をとる             if (error_reporting() & $level > 0) {                throw new ErrorException(                    $message, 0, $level, $file, $line);             }         }'
  p62:
  - node: p
    children:
    - node: text
      content: 'error_reporting()          error_reporting()で設定した         エラーレベルはデフォルトのエラーハンドラで利用される

        自作のエラーハンドラを設定する         ときは、error_reporting()を考慮して実装しなければならない

        実際グローバル変数みたいなもの'
  p63:
  - node: p
    children:
    - node: text
      content: 'register_shutdown_function() 設定方法register_shutdown_function(function(){             if (empty($error = error_get_last())) return;             //  エラーハンドラーで捕捉できないエラーを判定             $fatal = E_ERROR | E_PARSE | E_COMPILE_WARNING          | E_CORE_ERROR|E_CORE_WARNING|E_COMPILE_ERROR;     if
        (($error[''level''] & $fatal_errors) > 0) {                 $e = new ErrorException($error[''message''], 0,                    $error[''type''], $error[''file''], $error[''line'']);                 my_error_handler($e);             }          })；'
  p64:
  - node: p
    children:
    - node: text
      content: '例外のロギングPHPの標準機能error_log()は、ちょっと弱い

        rollbar, faultlineなどに送る

        pixivの場合は例外情報をバックトレースも含めてJSONエンコードしてファイルに追記、Fluentdで収集'
  p65:
  - node: p
    children:
    - node: text
      content: http://k1low.hatenablog.com/entry/2017/06/13/083000
  p66:
  - node: p
    children:
    - node: text
      content: 開発時の原則
  p67:
  - node: p
    children:
    - node: text
      content: 'error_reporting()可能な限り無視しない

        例: 本番ではDeprecatedを無視

        ただしプロジェクト全体にNotice発生箇所が多い場合は無理しない

        一気にリファクタリングしようとしてエンバグする方がずっと怖い'
  p68:
  - node: p
    children:
    - node: text
      content: 'エラー設定は初期化処理で実行する         error_reportingはphp.iniでも         設定可能だが、PHPで明示的に設定すれば環境依存がなくなる

         深いところで仕方なく変更する         必要に迫られたときは、小さなスコープで変更してすぐに戻す'
  p69:
  - node: p
    children:
    - node: text
      content: '段階的にエラーレベルを上げる         pixivの開発時にもまだNoticeが発生する箇所が残ってる…

         やむを得ず変更する際は浅い位置で設定する

        (例:コントローラ)         Deprecatedはユニットテストで追い詰めていく'
  p70:
  - node: p
    children:
    - node: text
      content: 'pixivの設定         // 全体設定 error_reporting(E_ALL & ~E_NOTICE & ~E_DEPRECATED);//  ユニットテストerror_reporting(E_ALL);          // 新規ファイルや動作確認できたページ//  (コントローラー)単位でレベルを上げるsetErrorReportingAll(); '
  p71:
  - node: p
    children:
    - node: text
      content: 'べんりヘルパー関数/**           * 開発時のみエラーレベルを最大に上げる *           * 本番(運用環境)には影響しない          */function setErrorReportingAll() {             if (is_development()) {                 error_reporting(E_ALL);             }         } '
  p72:
  - node: p
    children:
    - node: text
      content: '深いところで一時的にエラーレベルを変更         /** mcrypt*/は7.1で非推奨、7.2で削除予定 function mcrypt_wrapper($text) {             $err = error_reporting();             error_reporting(E_ALL & ~E_DEPRECATED);     try {         // mcryptを使った処理             } finally {                 error_reporting($err);     }             return $result;         }'
  p73:
  - node: p
    children:
    - node: text
      content: '手を出せないライブラリ/SDK         /** */なんかエラー吐きまくる古いSDKのラッパー function hoge_legacy_wrapper($text) {             $err = error_reporting();             error_reporting(E_ALL &~E_NOTICE & ~E_DEPRECATED);     try {         $result
        = \Hoge\Legacy\SDK::proc();             } finally {                 error_reporting($err);     }             return $result;         }'
  p74:
  - node: p
    children:
    - node: text
      content: whoops!
  p75:
  - node: p
    children:
    - node: text
      content: 'whoops!“PHP errors for cool kids” エラー処理用フレームワーク

         set_exception_handler()はひとつしかハンドラを登録できないが、whoopsは複数登録できる'
  p77:
  - node: p
    children:
    - node: text
      content: 'whoops! ハンドラー         ハンドラーは複数登録できる(関数)スタック

         (FIFO, 後入れ先出し)         ロギング・デバッグだけでなくエラー画面の表示にも利用できる

        WEB+DB Press Vol.96サンプルに         whoopsを使った設定例書きましたhttp://gihyo.jp/magazine/wdpress/archive/2017/vol96'
  p78:
  - node: p
    children:
    - node: text
      content: 'whoops! 注意点         PrettyPageHandlerはべんりだがもし本番環境で有効化されてしまうと脆弱性や情報漏洩の原因にすらなりかねない

         設定に自信がなければ、単に         開発環境用のカッコイイエラー画面として割り切るのが安全'
  p79:
  - node: p
    children:
    - node: text
      content: 'whoopsの有効化         // 開発時のみWhoopsを有効化する場合if (is_development()) {     $handler = (PHP_SAPI ===
        ''cli'')                ? new \Whoops\Handler\PlainTextHandler                : new \Whoops\Handler\PrettyPageHandler;    $whoops = new \Whoops\Run;    $whoops->register();         }'
  p80:
  - node: p
    children:
    - node: text
      content: 落穂
  p81:
  - node: p
    children:
    - node: text
      content: 'エラーレベルとビットフラグエラー発生時のレベルとerror_reporting()はビットフラグ

         E_ALLは全種類のエラーのフラグを立てた状態

         E_ALL & ~E_NOTICEのように反転してビット積をとるのが簡単'
  p82:
  - node: p
    children:
    - node: text
      content: ビットフラグの確認方法printf('%015b', E_ALL); // => "111111111111111" printf('%015b',
        E_DEPRECATED); // => "010000000000000" printf('%015b', E_ALL & ~E_DEPRECATED);
        // => "101111111111111"
  p83:
  - node: p
    children:
    - node: text
      content: 'trigger_error()エラーを意図的に発生させる

        ただし全てのエラーを発生させられるわけではなくE_USER_系のみ

        今日エラーはあまり考慮されてないので、役立たないかも…

        USERの有無は別のエラーなので'
  p84:
  - node: p
    children:
    - node: text
      content: 'trigger_error利用例         // 関数をリネームしたいとき/**  * @deprecated {@see grant()} を使ってください  */ function credential(array
        $data){             $msg = ''credential() is obsolete function.  Use grant() instead.'';     trigger_error($msg,
        E_USER_DEPRECATED);     return grant($data); } '
  p85:
  - node: p
    children:
    - node: text
      content: 'もうひとつのエラーハンドリングset_exception_handler()を使ったハンドリングは…実際(説明)難しい

         細かなエラーハンドリングはtry-catchを使った方がやりやすい

        エラーの仕組み(このセッションで説明よりは把握しやすい

        した内容！)https://gist.github.com/zonuexe/577d089815e241d5da26'
