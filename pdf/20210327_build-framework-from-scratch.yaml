text:
  p1:
  - node: p
    children:
    - node: text
      content: '[初心者向け]フレームワークを '
    - node: br
    - node: text
      content: 　一から作るところを見せる
  - node: p
    children:
    - node: text
      content: 'Let''s build PHP web application framework '
  - node: p
    children:
    - node: text
      content: from scratch
  - node: p
    children:
    - node: text
      content: ' 2021-03-27 Zoom '
  - node: p
    children:
    - node: text
      content: 'PHPerKaigi 2021 アンカンファレンス '
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
    - node: br
    - node: text
      content: 'うさみけんた (@tadsan)  '
  - node: p
    children:
    - node: text
      content: ' / Zonu.EXE'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'GitHub/Packagistでは id: zonuexe'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ピクシブ株式会社 pixiv運営本部
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer, Rubyist
    - node: li
      children:
      - node: text
        content: 2018年からEmacs PHP Modeのメンテナ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 好きなリスプはEmacs Lispです
        - node: li
          children:
          - node: text
            content: Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - node: p
    children:
    - node: text
      content: 注意
  - node: p
    children:
    - node: text
      content: '簡単なフレームワークは '
    - node: br
    - node: text
      content: '簡単に作れます '
    - node: br
    - node: text
      content: 'でも安全なものを作るには '
    - node: br
    - node: text
      content: '知識が必要です '
    - node: br
    - node: text
      content: 使われているフレームワーク
    - node: br
    - node: text
      content: は偉大
  p4:
  - node: p
    children:
    - node: text
      content: '初心者向けに作った '
    - node: br
    - node: text
      content: フレームワークを5分で騙る
  - node: p
    children:
    - node: text
      content: '5 minutes to explain the framework '
    - node: br
    - node: text
      content: I made for beginners.
  - node: p
    children:
    - node: text
      content: ' 2021-03-27 Zoom '
  - node: p
    children:
    - node: text
      content: 'PHPerKaigi 2021 アンカンファレンス '
  p5:
  - node: p
    children:
    - node: text
      content: 'フレームワークとは '
    - node: br
    - node: text
      content: 何か？
  p6: []
  p7:
  - node: p
    children:
    - node: text
      content: 'できる！ '
    - node: br
    - node: text
      content: フレームワーク
  p8:
  - node: p
    children:
    - node: text
      content: フレームワーク
    - node: br
    - node: text
      content: とは
  p9:
  - node: p
    children:
    - node: text
      content: ソフトウェアフレームワーク
  - node: p
    children:
    - node: text
      content: https://ja.wikipedia.org/wiki/
  p10:
  - node: p
    children:
    - node: text
      content: 制御の反転
  - node: p
    children:
    - node: text
      content: 'が '
  - node: p
    children:
    - node: text
      content: ソフトウェアフレームワークの
    - node: br
    - node: text
      content: 特徴
  p11:
  - node: p
    children:
    - node: text
      content: 'ふつうのライブラリは '
    - node: br
    - node: text
      content: 'あなたが書いたコードから '
    - node: br
    - node: text
      content: 呼び出される
  p12:
  - node: p
    children:
    - node: text
      content: 'フレームワークは '
    - node: br
    - node: text
      content: あなたが書いたコードを
    - node: br
    - node: text
      content: 呼び出す
  p13:
  - node: p
    children:
    - node: text
      content: 'これが '
    - node: br
    - node: text
      content: 制御の反転
  p14:
  - node: p
    children:
    - node: text
      content: うるせえ
  p15:
  - node: p
    children:
    - node: text
      content: '＿人人人人人人人人人＿ ＞　レールに乗って　＜ ＞　 コードを書く　＜ '
    - node: br
    - node: text
      content: ￣Y^Y^Y^Y^Y^Y^Y^￣
  p16:
  - node: p
    children:
    - node: text
      content: ＿人人人人人人人人人人＿ ＞ Webアプリがうごく＜ ￣Y^Y^Y^Y^Y^Y^Y^￣
  p17:
  - node: p
    children:
    - node: text
      content: '＿人人人人人人＿ ＞　  すごい！　＜ ＞　  楽しい！　＜ '
    - node: br
    - node: text
      content: ￣Y^Y^Y^Y^￣
  p18:
  - node: p
    children:
    - node: text
      content: よし
  p19:
  - node: p
    children:
    - node: text
      content: 'つくろう '
    - node: br
    - node: text
      content: レール
  p20:
  - node: p
    children:
    - node: text
      content: '関数定義を '
    - node: br
    - node: text
      content: 読み込むだけ
  - node: p
    children:
    - node: text
      content: 'ページの '
    - node: br
    - node: text
      content: ディレクトリ
  - node: p
    children:
    - node: text
      content: 'それ以外のパターンは '
    - node: br
    - node: text
      content: 配列で渡す
  p21:
  - node: p
    children:
    - node: text
      content: 'ここにファイルを置いたら '
    - node: br
    - node: text
      content: 勝手にページが増える
  - node: p
    children:
    - node: text
      content: 起動スクリプト
  - node: p
    children:
    - node: text
      content: フレームワーク
  p22:
  - node: p
    children:
    - node: text
      content: REQUEST_URI queryを分ける
size:
  max_width: 1024
  max_height: 768
links:
  p2:
  - url: https://github.com/emacs-php/php-mode
    title: 'GitHub - emacs-php/php-mode: A powerful and flexible Emacs major mode
      for editing PHP scripts'
  p9:
  - url: https://ja.wikipedia.org/wiki/%E3%82%BD%E3%83%95%E3%83%88%E3%82%A6%E3%82%A7%E3%82%A2%E3%83%95%E3%83%AC%E3%83%BC%E3%83%A0%E3%83%AF%E3%83%BC%E3%82%AF
    title: ソフトウェアフレームワーク - Wikipedia
