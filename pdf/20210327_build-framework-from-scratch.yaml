text:
  p1:
  - kind: heading
    level: 1
    text: '[初心者向け]フレームワークを'
  - kind: heading
    level: 1
    text: 一から作るところを見せる
  - kind: para
    text: Let's build PHP web application framework from scratch
  - kind: para
    text: 2021-03-27 Zoom PHPerKaigi 2021 アンカンファレンス
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer, Rubyist
    - 2018年からEmacs PHP Modeのメンテナ
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: 注意
  - kind: para
    text: 簡単なフレームワークは簡単に作れます
  - kind: para
    text: でも安全なものを作るには知識が必要です
  - kind: para
    text: 使われているフレームワークは偉大
  p4:
  - kind: heading
    level: 1
    text: 初心者向けに作った
  - kind: heading
    level: 1
    text: フレームワークを
  - kind: heading
    level: 1
    text: 5分
  - kind: heading
    level: 1
    text: で騙る
  - kind: para
    text: 5 minutes to explain the framework I made for beginners.
  - kind: para
    text: 2021-03-27 Zoom PHPerKaigi 2021 アンカンファレンス
  p5:
  - kind: para
    text: フレームワークとは何か？
  p6: []
  p7:
  - kind: para
    text: できる！フレームワーク
  p8:
  - kind: para
    text: フレームワークとは
  p9:
  - kind: para
    text: https://ja.wikipedia.org/wiki/ソフトウェアフレームワーク
  p10:
  - kind: para
    text: 制御の反転がソフトウェアフレームワークの特徴
  p11:
  - kind: para
    text: ふつうのライブラリはあなたが書いたコードから呼び出される
  p12:
  - kind: para
    text: フレームワークはあなたが書いたコードを呼び出す
  p13:
  - kind: para
    text: これが制御の反転
  p14:
  - kind: para
    text: うるせえ
  p15:
  - kind: para
    text: ＿人人人人人人人人人＿
  - kind: para
    text: ＞ レールに乗って ＜
  - kind: para
    text: ＞ コードを書く ＜
  - kind: para
    text: ‾Y^Y^Y^Y^Y^Y^Y^‾
  p16:
  - kind: para
    text: ＿人人人人人人人人人人＿
  - kind: para
    text: ＞ Webアプリがうごく＜
  - kind: para
    text: ‾Y^Y^Y^Y^Y^Y^Y^‾
  p17:
  - kind: para
    text: ＿人人人人人人＿
  - kind: para
    text: ＞ すごい！ ＜
  - kind: para
    text: ＞ 楽しい！ ＜
  - kind: para
    text: ‾Y^Y^Y^Y^‾
  p18:
  - kind: para
    text: よし
  p19:
  - kind: para
    text: つくろうレール
  p20:
  - kind: para
    text: 関数定義を読み込むだけ
  - kind: para
    text: ページのディレクトリ
  - kind: para
    text: それ以外のパターンは
  - kind: para
    text: 配列で渡す
  p21:
  - kind: para
    text: ここにファイルを置いたら
  - kind: para
    text: 勝手にページが増える
  - kind: para
    text: 起動スクリプト
  - kind: para
    text: フレームワーク
  p22:
  - kind: para
    text: REQUEST_URI
  - kind: para
    text: queryを分ける
