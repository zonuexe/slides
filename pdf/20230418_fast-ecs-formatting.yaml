    text: WPHPerKaigi 2023 - PHPerのためのゆるいLT会 -
  - kind: para
    text: '2022-04-18'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人
  p3:
  - kind: para
    text: ふだんはEmacsとか
  - kind: para
    text: PHPとかやってます
  p4:
  - kind: heading
    level: 1
    text: さて
  p5:
  - kind: para
    text: 綺麗なコード
  - kind: para
    text: 書いてますか？
  p6:
  - kind: para
    text: コードの乱れは
  - kind: para
    text: 心の乱れ
  p7:
  - kind: para
    text: 正しいプログラムは
  - kind: para
    text: 綺麗なコードに宿る
  p8:
  - kind: para
    text: 綺麗なコードが
  - kind: para
    text: モダーンなコード
  p9:
  - kind: para
    text: 美しいコードを書くのは
  - kind: para
    text: 靴を脱いで揃えるのと同じ
  p10:
  - kind: para
    text: きたないコードは
  - kind: para
    text: 争いを生む
  p11:
  - kind: para
    text: さあ美しいコードを
  - kind: para
    text: 書きましょう…
  p12:
  - kind: heading
    level: 1
    text: そう思いませんか？
  p13:
  - kind: heading
    level: 1
    text: どうやってコードをインデントする？
  - kind: para
    text: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png より
  p14:
  - kind: para
    text: 均整でないソースコードの弊害
  - kind: list
    items:
    - チーム内での認知的な摩擦
    - 同じリポジトリ内でも「ナワバリ」によってフォーマットの慣習が違う(!)
    - コードレビューで「ここにスペースを入れてください」「ここで改行してくださ
  - kind: para
    text: い」などの不毛すぎる指摘をする羽目に…
  - kind: list
    items:
    - 「レビュー対応」というコードスタイルを直すだけの最悪のコミットが履歴に積
  - kind: para
    text: まれる (そういう些細な変更はfixupで直して…という意見はある)
  p15:
  - kind: para
    text: 誰がコードを書いても
  - kind: para
    text: 同じスタイルにしたい
  p16:
  - kind: para
    text: Code Formatter
  - kind: para
    text: コードスタイルを整形
  - kind: para
    text: するツールの総称
  p17:
  - kind: para
    text: フォーマッター導入
  - kind: para
    text: 待ったなし
  p18: []
  p19: []
  p20:
  - kind: para
    text: 退屈なことは機械にやらせよう
  - kind: list
    items:
    - ツールを呼び出すとフォーマッタが全てのコードを整形してくれる
    - 人間が細かいところに気をつけながらコーディングしなくていい
    - 最悪、人間がコードフォーマットをまったく把握してなくてもいい
    - コミットする前にフォーマッターをかけてくれることだけ徹底してくれれば
  p21:
  - kind: heading
    level: 1
    text: それでだ
  p22:
  - kind: heading
    level: 1
    text: モダーンな言語の定義
  p23:
  - kind: para
    text: 言語標準の
  - kind: para
    text: フォーマッターがある
  p24:
  - kind: para
    text: go fmt
  - kind: para
    text: dart format
  - kind: para
    text: rustfmt
  p25:
  - kind: para
    text: われらが最新最高言語
  - kind: para
    text: PHPはどうだ
  p26: []
  p27:
  - kind: para
    text: ただ普及してる
  - kind: para
    text: フォーマッターはある
  p28:
  - kind: para
    text: PHP-CS-Fixer
  - kind: para
    text: PHP_CodeSiffer
  p29:
  - kind: para
    text: ＿人人人人人人＿
  - kind: para
    text: ＞ 二つある ＜
  - kind: para
    text: ‾Y^Y^Y^Y^Y‾
  p30:
  - kind: para
    text: 語ると長いが…
  - kind: para
    text: 設計思想の違いがある
  p31:
  - kind: para
    text: (設定ファイル名も
  - kind: para
    text: ややこしかった…)
  - kind: para
    text: phpcs.xml vs .php_cs
  p32:
  - kind: para
    text: まじめなプロジェクトでは
  - kind: para
    text: どちらかを選んで使う
  p33:
  - kind: para
    text: 二つのツールで同じような
  - kind: para
    text: 設定をしても結果が
  - kind: para
    text: 一致しなかったりする
  p34:
  - kind: para
    text: ≒ 似た設定をしても
  - kind: para
    text: フォーマット結果が
  - kind: para
    text: 競合しかねない
  p35:
  - kind: para
    text: プロジェクト内で
  - kind: para
    text: フォーマットツールを
  - kind: para
    text: 統一する必要がある
  p36:
  - kind: para
    text: で、あんたは
  - kind: para
    text: どっち派？
  p37:
  - kind: heading
    level: 1
    text: どうやってコードをインデントする？
  - kind: para
    text: CS-Fixer
  - kind: para
    text: CodeSniffer
  - kind: para
    text: 両方
  - kind: para
    text: もちつけ
  - kind: para
    text: tadsan
  - kind: para
    text: https://www.emacswiki.org/pics/static/TabsSpacesBoth.png より
  p38:
  - kind: heading
    level: 1
    text: そこで出てくるのが
  p39: []
  p40:
  - kind: heading
    level: 1
    text: ということで
  p41:
  - kind: heading
    level: 1
    text: ECS！
  p42:
  - kind: heading
    level: 2
    text: 最速最強コードフォーマッター
  - kind: heading
    level: 1
    text: Easy Coding Standard
  - kind: heading
    level: 3
    text: ECS - The fastest and strongest code formatter
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: WPHPerKaigi 2023 - PHPerのためのゆるいLT会 -
  - kind: para
    text: '2022-04-18'
  p43: []
  p44:
  - kind: para
    text: ECSってなあに?
  - kind: list
    items:
    - Tomas Votruba氏が開発しているスタイルチェック/フォーマットツール
    - RectorというPHPStanベースのリファクタリングツールも作っている
    - 内部的にPHP-CS-FixerとPHP_CodeSnifferを使っている
    - 両方のツールに内蔵されたルールが使える！
    - 並列実行してくれて爆速！ 一度実行したらキャッシュされるので待たせない
    - ひとつのツール内で両方のルールを合せてくれるのでツール間で喧嘩しない
  p45:
  - kind: heading
    level: 1
    text: インストール方法
  - kind: list
    items:
    - 非常に簡単！
    - composer require --dev symplify/easy-coding-standard:"^11.2"
    - バージョン指定しないとインストール時にかなり待たされるので注意
    - ./vendor/bin/ecs で実行できる
    - 初回実行時に勝手に設定ファイル(ecs.php)が作成される
    - PHP-CS-FixerやPHP_CodeSnifferのルールを指定する
  p46: []
  p47:
  - kind: para
    text: 清浄なコードベースを
  - kind: para
    text: 保つには
  p48:
  - kind: para
    text: こきたないコードをマージさせない
  - kind: list
    items:
    - コードベース全体を (勇気をもって) 全フォーマットする
    - メンバー全員に「コミットする直前に」必ずフォーマットすることを根付かせる
    - CIでECSを呼び出してスタイルが合ってないファイルがあれば失敗させる
    - 僕は編集中にテキストエディタから非同期フォーマットを実行するようにする
  - kind: para
    text: 拡張を書きました
  p49:
  - kind: para
    text: 完璧主義の
  - kind: para
    text: みなさんにも
  - kind: para
    text: 安心！
  p50:
  - kind: para
    text: おまえら
  - kind: heading
    level: 1
    text: pixivは
  - kind: heading
    level: 1
    text: どうなのかって？
  p51:
  - kind: para
    text: 俺たちの戦いは
  - kind: para
    text: これからだ！！
  p52:
  - kind: heading
    level: 1
    text: 続きはWebで
