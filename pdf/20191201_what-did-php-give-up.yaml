  p40:
  - kind: para
    text: RFC?
  p41:
  - kind: para
    text: (Request for Comment)
  - kind: para
    text: RFC
  - kind: para
    text: 新バージョンへの変更提案
  - kind: para
    text: PHPの機能の改廃の提案は
  - kind: para
    text: RFCを通じて行われる
  - kind: para
    text: 提案はメーリングリストで議論
  - kind: para
    text: されPHP.net VCSアカウント
  - kind: para
    text: の所持者が議決する
  p42:
  - kind: para
    text: の歴史
  - kind: para
    text: PHP RFC
  - kind: para
    text: 2008年頃から機能提案のため
  - kind: para
    text: に運用されはじめた
  - kind: para
    text: 2011年(5.4alpha1)から正式な
  - kind: para
    text: リリースプロセスになった
  p43:
  - kind: para
    text: “PHP releases have always been
  - kind: para
    text: done spontaneously, in a somehow
  - kind: para
    text: chaotic way. Individual(s) decided
  - kind: para
    text: when a release will happen and
  - kind: para
    text: what could or could ﬁt in. Release
  - kind: para
    text: managers role are unclear and the
  - kind: para
    text: way to nominate them is not
  - kind: para
    text: clearly deﬁned either.”
  - kind: para
    text: '‒ Request for Comments: Release Process'
  - kind: para
    text: https://wiki.php.net/rfc/releaseprocess
  p44:
  - kind: para
    text: “PHPのリリースは常に無秩序な方法で自
  - kind: para
    text: 発的に行われてきました。個々人がいつリ
  - kind: para
    text: リースされるか、何が起こるか、そして何
  - kind: para
    text: が収まるかを決定しています。リリースマ
  - kind: para
    text: ネージャの役割は不明瞭で、指名の手続き
  - kind: para
    text: も明確に定義されていません。”
  - kind: para
    text: '‒ Request for Comments: Release Process'
  - kind: para
    text: https://wiki.php.net/rfc/releaseprocess
  p45:
  - kind: para
    text: (2008～2010年)
  - kind: para
