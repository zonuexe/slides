  p67:
  - kind: para
    text: 遅延静的束縛
  - kind: para
    text: static::method();
  - kind: para
    text: 親クラスの静的メソッドから継承さ
  - kind: para
    text: れたクラスのメソッドを呼び出す
  - kind: para
    text: ちなみにforward_static_call()関
  - kind: para
    text: 数のマニュアルには「静的メソッド
  - kind: para
    text: をコールする」と書いてるが、この
  - kind: para
    text: 説明は間違い (翻訳の問題ではない)
  p68:
  - kind: para
    text: Dynamic static call
  - kind: para
    text: Hoge::fuga()の代りに
  - kind: para
    text: $class="Hoge"; $class::fuga();
  - kind: para
    text: で呼べるようになった
  - kind: para
    text: 静的メソッド版可変関数
  p69:
  - kind: para
    text: 名前空間
  - kind: para
    text: クラスや関数を階層化できる
  - kind: para
    text: 名前空間違いの同名のクラス
  - kind: para
    text: が作れるようになった
  - kind: para
    text: フルネームをFQSENと呼ぶ
  - kind: para
    text: useでファイルローカルな別名
  - kind: para
    text: を付けることもできる
  p70:
  - kind: para
    text: useの誤解されがちなところ
  - kind: para
    text: include/requireのようにファ
  - kind: para
    text: イルを読み込む機能ではない
  - kind: para
    text: ファイル内で呼べるよう
  - kind: para
    text: ローカルな名前を付けるだけ
  - kind: para
    text: 存在しないクラスをuseして
  - kind: para
    text: もエラーにはならない
  p71:
  - kind: para
    text: クロージャ (関数式・ラムダ式)
  - kind: para
    text: ローカルな関数が作れる
  - kind: para
    text: ただの関数を作れるだけでは
  - kind: para
    text: なく、外側の変数を引き込め
  - kind: para
    text: るのが重要 (関数閉包)
  - kind: para
    text: 普通の関数やメソッドにその
  - kind: para
    text: 機能はない
  p72:
  - kind: para
    text: クロージャ以前の無名関数
  - kind: para
    text: create_function()という関
  - kind: para
    text: 数で関数式っぽいことはできた
  - kind: para
    text: その実態はevalで lambda_1
  - kind: para
    text: のような関数を動的に定義する
  - kind: para
    text: この関数はリスキーなので
  - kind: para
    text: PHP7.2からdeprecated
  p73:
  - kind: para
    text: PHPのクロージャ
  - kind: para
    text: 構文上はJavaScriptのものに
  - kind: para
    text: 似ているが、useで列挙しない
  - kind: para
    text: と外側の変数を捕捉できない
  - kind: para
    text: この仕様にはPHPの変数の
  - kind: para
    text: 説明しにくい挙動が関わって
  - kind: para
    text: いる…
  p74:
  - kind: para
    text: PHPの変数
  - kind: para
    text: PHPで変数の値を再代入した
  - kind: para
    text: り引数に渡したりすると、
  - kind: para
    text: (意味論として)値がコピーされる
  - kind: para
    text: クロージャでuseしたときも
  - kind: para
    text: PHPでは引数と同じ動きになる
  - kind: para
    text: '&を付けると変数の参照をとる'
  p75:
  - kind: heading
    level: 1
    text: JavaScriptのクロージャ
  - kind: para
    text: make_counter = function() {
  - kind: para
    text: i = 0;
  - kind: para
    text: return function () {
  - kind: para
    text: return i++;
  - kind: para
    text: '};'
  - kind: para
    text: '};'
  - kind: para
    text: c1 = make_counter();
  - kind: para
    text: console.log(c1());
  - kind: para
    text: console.log(c1());
  - kind: para
    text: console.log(c1());
  p76:
  - kind: heading
    level: 1
    text: PHPのクロージャ
  - kind: para
    text: この記述だと$i=0のコピーさ
  - kind: para
    text: れるだけ。 &を付けると変数リファ
  - kind: para
    text: レンスで値を更新できる
  - kind: para
    text: <?php
  - kind: para
    text: $make_counter = function() {
  - kind: para
    text: $i = 0;
  - kind: para
    text: return function () use ($i) {
  - kind: para
    text: return $i++;
  - kind: para
    text: '};'
  - kind: para
    text: '};'
  - kind: para
    text: $c1 = $make_counter();
  - kind: para
    text: var_dump($c1()); //=> 0
  - kind: para
    text: var_dump($c1()); //=> 0
  - kind: para
    text: var_dump($c1()); //=> 0
