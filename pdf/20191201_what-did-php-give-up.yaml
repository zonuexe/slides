    - node: br
    - node: text
      content: '(意味論として)値がコピーされる '
    - node: br
    - node: text
      content: クロージャでuseしたときも
    - node: br
    - node: text
      content: PHPでは引数と同じ動きになる &を付けると変数の参照をとる
  p75:
  - node: p
    children:
    - node: text
      content: JavaScriptのクロージャ
  - node: p
