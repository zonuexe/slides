  p109:
  - kind: para
    text: まとめ
  p110:
  - kind: para
    text: PHPは力を手に入れようとして失敗してきた経験が結構ある
  p111:
  - kind: para
    text: 現在のPHPは静的解析できる環境が年々強まって往年のざっくりさは息をひそめつつある
