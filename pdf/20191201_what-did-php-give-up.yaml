    - node: br
    - node: text
      content: '    $i = 0;'
    - node: br
    - node: text
      content: '    return function () use ($i) {'
    - node: br
    - node: text
      content: '        return $i++;'
    - node: br
    - node: text
      content: '    };'
    - node: br
    - node: text
      content: '};'
