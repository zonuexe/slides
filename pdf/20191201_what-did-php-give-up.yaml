    - node: text
      content: make_counter = function() {
    - node: br
    - node: text
      content: '    i = 0;'
    - node: br
    - node: text
      content: '    return function () {'
    - node: br
    - node: text
      content: '        return i++;'
    - node: br
    - node: text
      content: '    };'
    - node: br
    - node: text
      content: '};'
