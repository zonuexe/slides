    - node: text
      content: console.log(c1()); console.log(c1()); console.log(c1());
  p76:
  - node: p
    children:
    - node: text
      content: PHPのクロージャ
  - node: p
    children:
    - node: text
      content: この記述だと$i=0のコピーさ
    - node: br
    - node: text
      content: れるだけ。 &を付けると変数リファ
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: レンスで値を更新できる
  - node: p
    children:
    - node: text
