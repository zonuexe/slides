text:
  p1:
  - kind: heading
    level: 1
    text: PHPは何を捨て、
  - kind: heading
    level: 1
    text: どんな力を手に入れてきたのか
  - kind: para
    text: What did PHP give up and what power did it get?
  - kind: para
    text: PHP Conference Japan
  - kind: para
    text: '2019-12-01 #phpcon'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv事業本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5: []
  p6:
  - kind: para
    text: これまでのあらすじ
  p7:
  - kind: para
    text: 昨日
  p8: []
  p9: []
  p10:
  - kind: para
    text: そもそもPHP自体がレガシーと言われがち
  p11:
  - kind: para
    text: PHPカンファレンス
  - kind: para
    text: '2016'
  p12: []
  p13:
  - kind: para
    text: 本日のお題
  p14: []
  p15:
  - kind: para
    text: そもそもPHPというプログラミング言語はどんな機能を持っているのか
  p16:
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told you you should be using.I
      don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p17:
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”
  - kind: para
    text: –Rasmus Lerdorf
  p18:
  - kind: para
    text: 僕が思いつくPHPの機能をざっと挙げてみると…
  p19:
  - kind: para
    text: 抽象クラス, トレイト, インターフェイス, ジェネレータ, イテレータ, クロージャ, 函数の動的呼び出し, 無名クラス, eval, 型宣言,
      連想配列, リフレクションAPI, 自己文書化, 標準入出力の読み書き,REPL, クラスの遅延ロード
  p20:
  - kind: para
    text: 改めてPHPの言語仕様が追加された時系列を見てみよう
  p21:
  - kind: heading
    level: 1
    text: PHP 7.4
  - kind: para
    text: Arrow functions 2.0
  - kind: para
    text: JavaScriptなど
  - kind: para
    text: Typed Property
  - kind: para
    text: Javaなどの静的型付き言語
  - kind: para
    text: Numeric Literal Separator
  - kind: para
    text: Ada, Ruby, JavaScriptなど
  p22:
  - kind: heading
    level: 1
    text: PHP 7.3
  - kind: para
    text: Flexible Heredoc and Nowdoc
  - kind: para
    text: Rubyにも似た記法はある
  - kind: para
    text: list() Reference Assignment
  - kind: para
    text: これはPHP独自に近い
  p23:
  - kind: heading
    level: 1
    text: PHP 7.2
  - kind: para
    text: Trailing Commas In List Syntax
  - kind: para
    text: カンマ(,)を並べて書く記法のほぼ全てで余分につけてもよくなった
  - kind: para
    text: Parameter Type Widening
  - kind: para
    text: 継承したクラスで引数の型省略
  p24:
  - kind: heading
    level: 1
    text: PHP 7.1
  - kind: para
    text: Nullable Types
  - kind: para
    text: Void Return Type
  - kind: para
    text: Multi catch
  - kind: para
    text: Allow specifying keys in list()
  p25:
  - kind: heading
    level: 1
    text: PHP 7.0
  - kind: para
    text: Anonymous Class
  - kind: para
    text: Generator Delegation(yield from)
  - kind: para
    text: Return Type Declaration
  - kind: para
    text: Null Coalesce Operator
  - kind: para
    text: Scalar type hints
  p26:
  - kind: heading
    level: 1
    text: PHP 5.6
  - kind: para
    text: Exponential Operator(pow**)
  - kind: para
    text: Importing named function
  - kind: para
    text: Variadic function argument (...)
  - kind: para
    text: 配列を引数として展開
  - kind: para
    text: Argument unpacking(...)
  - kind: para
    text: 可変長引数を配列として取得
  p27:
  - kind: heading
    level: 1
    text: PHP 5.5
  - kind: para
    text: Generator
  - kind: para
    text: ﬁnally keyword (try-catch-...)
  - kind: para
    text: Const array/string dereference
  - kind: para
    text: Allow non-scalar keys in foreach
  p28:
  - kind: heading
    level: 1
    text: PHP 5.4
  - kind: para
    text: Traits
  - kind: para
    text: Short array syntax
  - kind: para
    text: callable type hint
  p29:
  - kind: heading
    level: 1
    text: PHP 5.3
  - kind: para
    text: Closures (function expression)
  - kind: para
    text: 関数式、クロージャ、またはラムダ式
  - kind: para
    text: JavaScriptのfunctionに似てるが、レキシカルスコープ(変数の捕捉)のためにuseキーワードが必要
  p30:
  - kind: para
    text: ひとつひとつの機能の話を語ったら20分では全然足りない
  p31:
  - kind: para
    text: なので本日はPHPがどう変わっていったかというエピソードを交えてPHPの言語機能を紹介していきます
  p32:
  - kind: para
    text: さて
  p33:
  - kind: para
    text: PHP 7.4.0がリリースされましたね
  p34:
  - kind: para
    text: 12月1日は本日何の日でしょう？
  p35: []
  p36: []
  p37:
  - kind: heading
    level: 1
    text: '27'
  - kind: para
    text: この数は何でしょう
  p38: []
  p39:
  - kind: heading
    level: 1
    text: せいかい
  - kind: para
    text: PHP7.4に向けて受理されたRFCの数
  p40:
  - kind: para
    text: RFC?
  p41:
  - kind: para
    text: (Request for Comment)RFC
  - kind: para
    text: 新バージョンへの変更提案
  - kind: para
    text: PHPの機能の改廃の提案はRFCを通じて行われる
  - kind: para
    text: 提案はメーリングリストで議論されPHP.net VCSアカウントの所持者が議決する
  p42:
  - kind: para
    text: の歴史PHP RFC
  - kind: para
    text: 2008年頃から機能提案のために運用されはじめた
  - kind: para
    text: 2011年(5.4alpha1)から正式なリリースプロセスになった
  p43:
  - kind: para
    text: “PHP releases have always been done spontaneously, in a somehow chaotic
      way. Individual(s) decided when a release will happen and what could or could
      ﬁt in. Release managers role are unclear and the way to nominate them is not
      clearly deﬁned either.”
  - kind: para
    text: '‒ Request for Comments: Release Process'
  - kind: para
    text: https://wiki.php.net/rfc/releaseprocess
  p44:
  - kind: para
    text: “PHPのリリースは常に無秩序な方法で自発的に行われてきました。個々人がいつリリースされるか、何が起こるか、そして何が収まるかを決定しています。リリースマネージャの役割は不明瞭で、指名の手続きも明確に定義されていません。”
  - kind: para
    text: '‒ Request for Comments: Release Process'
  - kind: para
    text: https://wiki.php.net/rfc/releaseprocess
  p45:
  - kind: para
    text: (2008～2010年)この時期のPHPには何があったでしょう
  p46:
  - kind: para
    text: この当時のPHP情勢
  p47:
  - kind: para
    text: 廣川さんの｢PHPの今とこれから｣が当時の事情の貴重な資料
  p48:
  - kind: para
    text: ‒ PHPの今とこれから2009 https://www.slideshare.net/hirokawa/php2009
  p49:
  - kind: para
    text: ‒ PHPの今とこれから2009 https://www.slideshare.net/hirokawa/php2009
  p50:
  - kind: para
    text: ‒ PHPの今とこれから2009 https://www.slideshare.net/hirokawa/php2009
  p51:
  - kind: para
    text: Unicode化とはどういうことか？
  p52:
  - kind: para
    text: 言語処理系の文字列実装
  - kind: para
    text: CSI方式(Code Set Independent)
  - kind: para
    text: 特定のコードセットに依存しない
  - kind: para
    text: UCS正規化方式(Universal Character Set)
  - kind: para
    text: 内部的に文字コードを統一してから処理する
  - kind: para
    text: https://magazine.rubyist.net/articles/0025/0025-Ruby19_m17n.html
  p53:
  - kind: para
    text: 言語ごとの文字列実装
  - kind: para
    text: CSI方式
  - kind: para
    text: Ruby, Python 2, PHP
  - kind: para
    text: UCS正規化方式
  - kind: para
    text: Java, JavaScript, Perl,Python 3, PHP6
  p54:
  - kind: para
    text: ざっくりCSI方式
  - kind: para
    text: 文字列変換をしないので、オーバーヘッドは最小限
  - kind: para
    text: サポートする文字コードごとに文字列処理の実装が要る
  p55:
  - kind: para
    text: ざっくりUCS正規化方式
  - kind: para
    text: 文字列を変換するので入出力で変換オーバーヘッドがある
  - kind: para
    text: 文字列処理は内部文字コード用のものだけ用意すればいい
  p56:
  - kind: para
    text: PHP6はUTF-16を目指した
  - kind: para
    text: UCS正規化方式への移行
  - kind: para
    text: 従来のPHP文字列はバイト列
  - kind: para
    text: PHP 5.2で(binary)キャストと b"string" が追加された
  - kind: para
    text: 結局Unicode化しなかったので、ただのエイリアス
  p57:
  - kind: para
    text: 重要なこと
  - kind: para
    text: UCS正規化しないとUnicodeサポートできないわけではない
  - kind: para
    text: UTF-16にしても1コードポイント＝1文字になるわけではない (サロゲートペア)
  p58:
  - kind: para
    text: PHP6.0の顛末
  - kind: para
    text: 実装は難航し、文字列以外の6.0向け機能は5.3, 5.4系でそれぞれリリースされた
  - kind: para
    text: 2010年3月にリポジトリのtrunk(master)が5.3にロールバックした
  p59: []
  p60:
  - kind: para
    text: 開発が頓挫したPHP6は欠番としてスキップされPHP5.6の次は7.0になったというのは有名な話
  p61: []
  p62:
  - kind: para
    text: (私はこの時代にPHPに触れておらず議論を詳しくは追ってないので想像の域は出ないが)
  p63:
  - kind: para
    text: この時代にPHPはカウボーイによる開発スタイルを捨て、明文化されたスケジュールとプロセスによる開発体制に移行した
  p64:
  - kind: para
    text: PHPのリリース計画やメンテナンス期間が定められたのもこのRFCから
  p65:
  - kind: para
    text: PHP5.3ではPHP6を待たず重要な機能がマージされた
  p66:
  - kind: para
    text: ‒ PHPの今とこれから2009 https://www.slideshare.net/hirokawa/php2009
  p67:
  - kind: para
    text: 遅延静的束縛
  - kind: para
    text: static::method();
  - kind: para
    text: 親クラスの静的メソッドから継承されたクラスのメソッドを呼び出す
  - kind: para
    text: ちなみにforward_static_call()関数のマニュアルには「静的メソッドをコールする」と書いてるが、この説明は間違い (翻訳の問題ではない)
  p68:
  - kind: para
    text: Dynamic static call
  - kind: para
    text: Hoge::fuga()の代りに
  - kind: para
    text: $class="Hoge"; $class::fuga();
  - kind: para
    text: で呼べるようになった
  - kind: para
    text: 静的メソッド版可変関数
  p69:
  - kind: para
    text: 名前空間
  - kind: para
    text: クラスや関数を階層化できる
  - kind: para
    text: 名前空間違いの同名のクラスが作れるようになった
  - kind: para
    text: フルネームをFQSENと呼ぶ
  - kind: para
    text: useでファイルローカルな別名を付けることもできる
  p70:
  - kind: para
    text: useの誤解されがちなところ
  - kind: para
    text: include/requireのようにファイルを読み込む機能ではない
  - kind: para
    text: ファイル内で呼べるようローカルな名前を付けるだけ
  - kind: para
    text: 存在しないクラスをuseしてもエラーにはならない
  p71:
  - kind: para
    text: クロージャ (関数式・ラムダ式)
  - kind: para
    text: ローカルな関数が作れる
  - kind: para
    text: ただの関数を作れるだけではなく、外側の変数を引き込めるのが重要 (関数閉包)
  - kind: para
    text: 普通の関数やメソッドにその機能はない
  p72:
  - kind: para
    text: クロージャ以前の無名関数
  - kind: para
    text: create_function()という関数で関数式っぽいことはできた
  - kind: para
    text: その実態はevalで lambda_1のような関数を動的に定義する
  - kind: para
    text: この関数はリスキーなのでPHP7.2からdeprecated
  p73:
  - kind: para
    text: PHPのクロージャ
  - kind: para
    text: 構文上はJavaScriptのものに似ているが、useで列挙しないと外側の変数を捕捉できない
  - kind: para
    text: この仕様にはPHPの変数の説明しにくい挙動が関わっている…
  p74:
  - kind: para
    text: PHPの変数
  - kind: para
    text: PHPで変数の値を再代入したり引数に渡したりすると、(意味論として)値がコピーされる
  - kind: para
    text: クロージャでuseしたときもPHPでは引数と同じ動きになる
  - kind: para
    text: '&を付けると変数の参照をとる'
  p75:
  - kind: heading
    level: 1
    text: JavaScriptのクロージャ
  - kind: para
    text: make_counter = function() {i = 0;return function () {return i++;};};
  - kind: para
    text: c1 = make_counter();
  - kind: para
    text: console.log(c1());console.log(c1());console.log(c1());
  p76:
  - kind: heading
    level: 1
    text: PHPのクロージャ
  - kind: para
    text: この記述だと$i=0のコピーされるだけ。 &を付けると変数リファレンスで値を更新できる
  - kind: para
    text: <?php$make_counter = function() {$i = 0;return function () use ($i) {return
      $i++;};};
  - kind: para
    text: $c1 = $make_counter();
  - kind: para
    text: var_dump($c1()); //=> 0 var_dump($c1()); //=> 0 var_dump($c1()); //=> 0
  p77:
  - kind: para
    text: 最初のRFCクロージャ
  - kind: para
    text: 実はJavaScript風クロージャよりも前に短いクロージャが提案されてた (2008年3月)
  - kind: para
    text: 'RFC: Short syntax for anonymous functions'
  - kind: para
    text: ただしDraft止まり
  p78:
  - kind: para
    text: '‒ PHP: rfc:short-syntax-for-anonymous-functions https://wiki.php.net/rfc/short-syntax-for-anonymous-functions'
  p79:
  - kind: para
    text: '‒ PHP: rfc:short-syntax-for-anonymous-functions https://wiki.php.net/rfc/short-syntax-for-anonymous-functions'
  p80:
  - kind: para
    text: 時は流れて2019年
  p81:
  - kind: para
    text: 'PHP: rfc:arrow_functions_v2 https://wiki.php.net/rfc/arrow_functions_v2'
  p82:
  - kind: para
    text: 'PHP: rfc:arrow_functions_v2 https://wiki.php.net/rfc/arrow_functions_v2'
  p83:
  - kind: para
    text: 姿形は違うが幾度もの議論の末に短い記法の関数式が導入された
  p84:
  - kind: para
    text: ところで
  p85:
  - kind: para
    text: 'PHP: rfc:arrow_functions_v2 https://wiki.php.net/rfc/arrow_functions_v2'
  p86:
  - kind: para
    text: 私たちはこの提案者の名前を見たことがある！
  p87:
  - kind: para
    text: ‒ PHPの今とこれから2012 https://www.slideshare.net/hirokawa/php-now-and-then-2012-at-php-conference-2012-tokyo-japan
  p88:
  - kind: para
    text: ジェネレータ
  - kind: para
    text: (古典的な)コルーチン
  - kind: para
    text: 「何度も繰り返す」構造を関数(メソッド)を使って簡単に作れる
  p89:
  - kind: heading
    level: 1
    text: Nikita Popov
  - kind: para
    text: 近年のPHPの中核的な開発者
  - kind: para
    text: PHP5.5以降､非常に多数の言語機能を実装してPHPに取り入れてきた
  - kind: para
    text: PHP-Parserなどの作者
  - kind: para
    text: 去年の大学院を卒業し今年JetBrainsに入社してPhpStormチームに参加
  p90:
  - kind: para
    text: とてもざっくり言うとレガシー仕様を消し､不条理な挙動は是正し､他言語にあるようなカッコイイ機能を追加提案してきた
  p91:
  - kind: para
    text: 不条理な挙動って？
  p92:
  - kind: para
    text: '例: 未定義定数はその文字列になる'
  - kind: para
    text: echo PHP;
  - kind: para
    text: => 文字列 "PHP" が出力
  - kind: para
    text: E_NOTICE/E_WARNING
  - kind: para
    text: error_reportingが低い環境でさりげなく生き残ってた可能性が高い
  p93:
  - kind: para
    text: 歴史的経緯で残ったレガシー仕様はさくっと消しまくっていこうぜ
  p94:
  - kind: para
    text: いいじゃん
  - kind: para
    text: いいじゃん
  p95:
  - kind: para
    text: 📛
  p96:
  - kind: para
    text: 🔥
  p97:
  - kind: para
    text: 🔥
  - kind: para
    text: 🔥
  - kind: para
    text: 🔥
  p98:
  - kind: para
    text: 燃えた
  p99: []
  p100:
  - kind: para
    text: Deprecate PHP's short open tags, again
  - kind: para
    text: 一般的なPHPタグは<?php ... ?>または<?= ... ?> だが、<? ... ?>という形式もある
  - kind: para
    text: php.iniで有効無効を切替られる環境によってOnだったりOffだったり
  p101:
  - kind: para
    text: Deprecate PHP's short open tags, again
  - kind: para
    text: XML宣言との相性がとても悪い
  - kind: para
    text: そんな半端モンは引導を渡してやろうぜ！ ということで提案された
  - kind: para
    text: 構文がシンプルになるし、機械的に変換もできるから良いだろ、という主旨
  p102:
  - kind: para
    text: Zeevによる反論
  p103: []
  p104:
  - kind: heading
    level: 1
    text: Zeev Suraski
  - kind: para
    text: PHP3・4の開発者
  - kind: para
    text: 相方のAndi Gutmansとともに
  - kind: para
