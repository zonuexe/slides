  p51:
  - kind: para
    text: Unicode
  - kind: para
    text: 化とは
  - kind: para
    text: どういうことか？
  p52:
  - kind: para
    text: 言語処理系の文字列実装
  - kind: para
    text: CSI方式(Code Set Independent)
  - kind: para
    text: 特定のコードセットに依存しない
  - kind: para
    text: UCS正規化方式(Universal Character Set)
  - kind: para
    text: 内部的に文字コードを統一し
  - kind: para
    text: てから処理する
  - kind: para
    text: https://magazine.rubyist.net/articles/0025/0025-Ruby19_m17n.html
  p53:
  - kind: para
    text: 言語ごとの文字列実装
  - kind: para
    text: CSI方式
  - kind: para
    text: Ruby, Python 2, PHP
  - kind: para
    text: UCS正規化方式
  - kind: para
    text: Java, JavaScript, Perl,
  - kind: para
    text: Python 3, PHP6
  p54:
  - kind: para
    text: ざっくりCSI方式
  - kind: para
    text: 文字列変換をしないので、
  - kind: para
    text: オーバーヘッドは最小限
  - kind: para
    text: サポートする文字コードごと
  - kind: para
    text: に文字列処理の実装が要る
  p55:
  - kind: para
    text: ざっくりUCS正規化方式
  - kind: para
    text: 文字列を変換するので入出力
  - kind: para
    text: で変換オーバーヘッドがある
  - kind: para
    text: 文字列処理は内部文字コード
  - kind: para
    text: 用のものだけ用意すればいい
  p56:
  - kind: para
    text: PHP6はUTF-16を目指した
  - kind: para
    text: UCS正規化方式への移行
  - kind: para
    text: 従来のPHP文字列はバイト列
  - kind: para
    text: PHP 5.2で(binary)キャスト
  - kind: para
    text: と b"string" が追加された
  - kind: para
    text: 結局Unicode化しなかった
  - kind: para
    text: ので、ただのエイリアス
  p57:
  - kind: para
    text: 重要なこと
  - kind: para
    text: UCS正規化しないとUnicode
  - kind: para
    text: サポートできないわけではない
  - kind: para
    text: UTF-16にしても1コードポイ
  - kind: para
    text: ント＝1文字になるわけではな
  - kind: para
    text: い (サロゲートペア)
  p58:
  - kind: para
    text: PHP6.0の顛末
  - kind: para
    text: 実装は難航し、文字列以外の
  - kind: para
    text: 6.0向け機能は5.3, 5.4系で
  - kind: para
    text: それぞれリリースされた
  - kind: para
    text: 2010年3月にリポジトリの
  - kind: para
    text: trunk(master)が5.3に
  - kind: para
    text: ロールバックした
  p59: []
  p60:
  - kind: para
    text: 開発が頓挫したPHP6は
  - kind: para
    text: 欠番としてスキップされ
  - kind: para
    text: PHP5.6の次は7.0になっ
  - kind: para
    text: たというのは有名な話
  p61: []
  p62:
  - kind: para
    text: (私はこの時代にPHPに
  - kind: para
    text: 触れておらず議論を詳し
  - kind: para
    text: くは追ってないので
  - kind: para
    text: 想像の域は出ないが)
  p63:
  - kind: para
    text: この時代にPHPはカウボーイ
  - kind: para
    text: による開発スタイルを捨て、明
  - kind: para
    text: 文化されたスケジュールとプロ
  - kind: para
    text: セスによる開発体制に移行した
  p64:
  - kind: para
    text: PHPのリリース計画や
  - kind: para
    text: メンテナンス期間が定め
  - kind: para
    text: られたのもこのRFCから
  p65:
