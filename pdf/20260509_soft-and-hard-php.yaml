  p97:
  - kind: para
    text: 得意不得意がはっきりしている
  p98:
  - kind: para
    text: 決定論的な処理は苦手だし圧倒的に非効率
  p99:
  - kind: para
    text: 決定論的=入力に対して答えが定められる問題
  p100:
  - kind: para
    text: 計算はAIに直接返答させるのではなくコード生成させて実行
  p101:
  - kind: para
    text: 生成AIにスペースや改行位置を細かく指示するのは圧倒的非効率
  p102:
  - kind: para
    text: フォーマッターを実行して常に同じスタイルに整形されるようにする
  p103:
  - kind: para
    text: 非決定的な問題を決定的な土俵に持ち込む
  p104:
  - kind: para
    text: 型推論規則に従ってすべての項に矛盾なく型が割り当てられた状態…ですが何か？
  p105:
  - kind: para
    text: 型推論は典型的な決定論的な計算
  p106:
