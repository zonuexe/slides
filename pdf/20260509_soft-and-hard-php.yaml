    text: 型理論計算機科学の結晶
  p81:
  - kind: para
    text: 型は「ありうる」状態を記述する言語
  p82:
  - kind: para
    text: 適切に推論できればテストを書くまでもなく変なコードが炙りだせる
  p83:
