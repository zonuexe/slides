    text: 型はコードの規模が長大になると効く
  p87:
  - kind: para
    text: 「型なんていらない」のサイズの閾値が大きく変わってしまった
  p88:
  - kind: para
    text: コード生成ベンチマークは仕様と受け入れテストが最初からゴールまで明確
  p89:
  - kind: para
    text: 型なしRubyの生成コストが低いのは非常に理にかなっている
  p90:
  - kind: para
    text: 生成する段階では型はいらないというのは非常に理にかなってる
  p91:
  - kind: para
    text: 最近ふわっと考えてる仮説生成されたコードにガードレールとして追加で型を敷設する方が効率がいい？
  p92:
  - kind: para
    text: さらなる仮説コード上に書く型は型宣言だけに留めた方がトークン効率が良いのでは…？
  p93:
  - kind: para
    text: このあたりの話題はもうちょっと探究したいので、そのうちどこかで
  p94:
  - kind: para
    text: ともあれ普通にコードを書けば自然に型がついている状況が理想
