text:
  p1:
  - kind: heading
    level: 1
    text: 技術発信の信頼性を高める
  - kind: heading
    level: 1
    text: 10のポイント
  - kind: heading
    level: 2
    text: 10 things to improve the credibility of your article
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2022-08-25'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - PHPerKaigi コアスタッフ、(昨年)PHPカンファレンス実行委員
  p3:
  - kind: heading
    level: 1
    text: 今回のお題
  p4:
  - kind: heading
    level: 1
    text: プロポーザル
  p5:
  - kind: heading
    level: 1
    text: 10という数は適当です
  - kind: para
    text: (任意の進数での10(n)ということにしてください)
  p6:
  - kind: para
    text: 個人的な遍歴
  - kind: list
    items:
    - 2003年頃〜 フリーソフトウェア／OSSの概念を知る(プログラミングできない)
    - 2005年頃〜 Vectorに簡単な設定ファイルなど公開(プログラミングできない)
    - 2008年頃〜 簡単なスクリプトをWeb日記とかに載せはじめる
    - 2010年頃〜 Lispを知ってプログラミング言語にのめりこむ、Rubyはじめる
    - 2012年頃〜 定職に就く、Emacs Lispはじめる、Qiita/GitHubはじめる
    - 2014年頃〜 QiitaにPHPの記事を書きはじめる
    - 2016年頃〜 WEB†DB PRESS(雑誌)に初めて寄稿、PHPカンファレンス
  p7:
  - kind: para
    text: 初めて技術記事(っぽいもの)
  - kind: para
    text: 書いてから紙の雑誌に寄稿するまで8年くらい
  p8:
  - kind: para
    text: 2000年代中旬からいろんなブログをつまみ
  - kind: para
    text: 食いして技術を学んだ
  p9:
  - kind: para
    text: わからないなりに濫読したブログの(一見無駄な)知識が
  - kind: para
    text: 数年後に結びつく経験
  p10:
  - kind: para
    text: 初期の発信の原動力
  - kind: list
    items:
    - 環境構築やカスタマイズなど、自分で工夫したことについてのメモ
    - リアルで教えてもらった技術知識についてのノート
    - Webに断片的な情報しかない技術を体系的にまとめたかった
    - 誤情報や中途半端な情報への憤り → 自分でやるしかない
  p11:
  - kind: heading
    level: 1
    text: 誤情報への憤り
  p12:
  - kind: para
    text: 問題を解決したいときに間違った情報が出てくる
  - kind: para
    text: とムカつく
  p13:
  - kind: para
    text: 自分の記事を自分で読んでムカつかないように
  p14:
  - kind: heading
    level: 1
    text: 誤情報への憤り
  - kind: list
    items:
    - 何か問題を解決したいときに間違った情報が出てくるとムカつく
    - こちらは読者として一方的に発信の成果を得ているだけなのだが、
  - kind: para
    text: 不条理にも憤りの感情を発信者(ブログの著者)に向けてしまう
  - kind: list
    items:
    - さまざまな事情により適切ではない内容についても「嘘」とすら感じてしまう
    - 誤った情報の伝播は自分でより適切な発信をすることでしか止められない
  p15:
  - kind: para
    text: 誤情報とは何か、読者にできること
  - kind: list
    items:
    - 単純な誤記・タイプミス・リンクミスなど
    - 誰でも気付けるもの、著者と同等以上の知見がないと指摘できないのもある
    - Qiitaなら編集リクエストを送るとよい
    - 記述対象への著者の事実誤認に基いた記述
    - コメント欄やSNSなどで指摘するといいかもしれない
    - 時間的な変化によって事情が変わってしまったもの
  p16:
  - kind: heading
    level: 1
    text: 間違った情報にしないための工夫
  - kind: list
    items:
    - 単純な誤記・タイプミス・リンクミスなど
    - 記事の公開前に自分で気をつける
    - 公開前に誰かにチェックしてもらう
    - '[宣伝] 昔からの友達がShodoというAI校正ツールを開発しています'
  - kind: para
    text: https://shodo.ink/
  p17:
  - kind: heading
    level: 1
    text: 間違った情報にしないための工夫
  - kind: list
    items:
    - 記述対象への著者の事実誤認に基いた記述
    - 「対象の知識についてマスターする」は完全な対策にはならない
    - 全知全能の神ではないので無謬の技術記事にはならない
    - 普遍的な正しさを語るのではなく、局所的にする
    - 「このコードは私の環境のPHP 5.4ではこう動く」
  p18:
  - kind: heading
    level: 1
    text: 信頼できる情報源
  - kind: list
    items:
    - 公式マニュアル・標準仕様など
    - 'MDN Web Docs: HTML/JavaScript/CSS'
    - 検索キーワードに「mdn」を付ける癖をつけると簡単にアクセスできます
    - PHPマニュアル、Pythonドキュメント、Rubyリファレンスマニュアル
    - そのほか日本のコミュニティ有志が独自に公開しているものもある
    - その実装がGitHubなどで読めればソースコードを直接参照する
  p19:
  - kind: para
    text: 間違った情報にしないための工夫
  - kind: list
    items:
    - 記述対象への著者の事実誤認に基いた記述
    - 極力、信頼できる情報源を直接参照するようにする
    - 曖昧な理解のブログをソースにしても誤解に誤解が増幅される
    - 基本的と思えること(標準関数など)に関しても信頼できる情報源をあたり、
  - kind: para
    text: 読者も参照できるようにリンクする
  p20:
  - kind: heading
    level: 1
    text: 固有名詞や言葉の使いかたに気を配る
  - kind: list
    items:
    - PHP, Ruby, JavaScriptなどの大文字小文字の使いかた
    - 専門用語の使いかた
    - 言葉使い
    - かしこまった文体 (です・ます)
    - 論文のような文体 (だ・である)
    - カジュアルなくだけた文体
    - 関西型言語
  p21:
  - kind: heading
    level: 1
    text: コードが動くことをどう保証するか
  - kind: list
    items:
    - 手元にいろんなOSや複数の言語処理系のインストールをするのは難しい
    - オンラインのサンドボックスサイトを使う
    - https://wandbox.org/ 多くの言語・バージョンをサポート
    - https://3v4l.org/ PHP特化・非常に多くのバージョンをサポート
    - URL共有できるので、第三者が見られ動作確認のソースにする
    - 最近はDockerでの環境構築できるようになった
  p22:
  - kind: heading
    level: 1
    text: 初心者のおすすめの発信
  - kind: list
    items:
    - そもそも正しい／間違いという枠に収まらない発信から始める
    - インストールや作業などのログ
    - 勉強会イベント・カンファレンスに参加した感想
    - 自分なりのカスタマイズやこだわりについてまとめる
  p23:
  - kind: heading
    level: 1
    text: 書きたいネタがない…
  - kind: list
    items:
    - 書きたいと思ったことは既に誰かが書いてる
    - 個人的意見： 大事なことは誰が何回書いてもいい
    - 既存の記事に関して、自分なりの意見や経験を付け加えるだけで
  - kind: para
    text: 価値のあるアウトプットになる
size:
  max_width: 1920
  max_height: 1080
links:
  p16:
  - url: https://shodo.ink/
    title: Shodo（ショドー）：さあ、書こう。生成AIによる日本語の校正・校閲クラウド
  p18:
  - url: https://www.php.net/manual/ja/index.php
    title: 'PHP: PHP マニュアル - Manual'
  - url: https://docs.python.org/ja/3/index.html
    title: 3.14.0 Documentation
  - url: https://docs.ruby-lang.org/ja/latest/doc/index.html
    title: オブジェクト指向スクリプト言語 Ruby リファレンスマニュアル (Ruby 3.4 リファレンスマニュアル)
  p21:
  - url: https://wandbox.org/
    title: Wandbox
  - url: https://3v4l.org/
    title: Online PHP editor | Test code in 250+ PHP versions
