text:
  p1:
  - node: p
    children:
    - node: bold
      content: 技術発信の信頼性を高める10のポイント
  - node: p
    children:
    - node: text
      content: 10 things to improve the credibility of your article
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: text
      content: '2022-08-25'
  p2:
  - node: p
    children:
    - node: bold
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: PHPerKaigi コアスタッフ、(昨年)PHPカンファレンス実行委員
  p3:
  - node: p
    children:
    - node: text
      content: 今回のお題
  p4:
  - node: p
    children:
    - node: text
      content: プロポーザル
  p5:
  - node: p
    children:
    - node: text
      content: '10という数は適当です '
    - node: br
    - node: text
      content: '(任意の進数での10(n)ということにしてください)'
  p6:
  - node: p
    children:
    - node: text
      content: 個人的な遍歴
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2003年頃〜 フリーソフトウェア／OSSの概念を知る
      - node: br
      - node: text
        content: (プログラミングできない)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2005年頃〜 Vectorに簡単な設定ファイルなど公開
      - node: br
      - node: text
        content: (プログラミングできない)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2008年頃〜 簡単なスクリプトをWeb日記とかに載せはじめる
    - node: li
      children:
      - node: text
        content: 2010年頃〜 Lispを知ってプログラミング言語にのめりこむ、Rubyはじめる
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2012年頃〜 定職に就く、Emacs Lispはじめる、Qiita/GitHubはじめる
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2014年頃〜 QiitaにPHPの記事を書きはじめる
    - node: li
      children:
      - node: bold
        content: 2016年頃〜 WEB†DB PRESS(雑誌)に初めて寄稿、PHPカンファレンス
  p7:
  - node: p
    children:
    - node: text
      content: 初めて技術記事(っぽいもの)
    - node: br
    - node: text
      content: 書いてから紙の雑誌に 寄稿するまで8年くらい
  p8:
  - node: p
    children:
    - node: text
      content: 2000年代中旬からいろんなブログをつまみ食いして技術を学んだ
  p9:
  - node: p
    children:
    - node: text
      content: わからないなりに濫読したブログの(一見無駄な)知識が数年後に結びつく経験
  p10:
  - node: p
    children:
    - node: bold
      content: 初期の発信の原動力
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 環境構築やカスタマイズなど、自分で工夫したことについてのメモ
    - node: li
      children:
      - node: text
        content: リアルで教えてもらった技術知識についてのノート
    - node: li
      children:
      - node: text
        content: Webに断片的な情報しかない技術を体系的にまとめたかった
    - node: li
      children:
      - node: text
        content: 誤情報や中途半端な情報への憤り → 自分でやるしかない
  p11:
  - node: p
    children:
    - node: text
      content: 誤情報への憤り
  p12:
  - node: p
    children:
    - node: text
      content: 問題を解決したいときに 間違った情報が出てくる
    - node: br
    - node: text
      content: とムカつく
  p13:
  - node: p
    children:
    - node: text
      content: '自分の記事を 自分で読んで '
    - node: br
    - node: text
      content: ムカつかないように
  p14:
  - node: p
    children:
    - node: text
      content: 誤情報への憤り
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 何か問題を解決したいときに間違った情報が出てくるとムカつく
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: こちらは読者として一方的に発信の成果を得ているだけなのだが、
          - node: br
          - node: text
            content: '不条理にも憤りの感情を発信者(ブログの著者)に向けてしまう '
        - node: li
          children:
          - node: text
            content: さまざまな事情により適切ではない内容についても「嘘」とすら感じてしまう
    - node: li
      children:
      - node: text
        content: 誤った情報の伝播は自分でより適切な発信をすることでしか止められない
  p15:
  - node: p
    children:
    - node: text
      content: 誤情報とは何か、読者にできること
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 単純な誤記・タイプミス・リンクミスなど
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 誰でも気付けるもの、著者と同等以上の知見がないと指摘できないのもある
        - node: li
          children:
          - node: text
            content: Qiitaなら編集リクエストを送るとよい
    - node: li
      children:
      - node: text
        content: 記述対象への著者の事実誤認に基いた記述
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: コメント欄やSNSなどで指摘するといいかもしれない
    - node: li
      children:
      - node: text
        content: 時間的な変化によって事情が変わってしまったもの
  p16:
  - node: p
    children:
    - node: text
      content: 間違った情報にしないための工夫
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 単純な誤記・タイプミス・リンクミスなど
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 記事の公開前に自分で気をつける
        - node: li
          children:
          - node: text
            content: 公開前に誰かにチェックしてもらう
        - node: li
          children:
          - node: text
            content: '[宣伝] 昔からの友達がShodoというAI校正ツールを開発しています'
          - node: br
          - node: text
            content: https://shodo.ink/
  p17:
  - node: p
    children:
    - node: text
      content: 間違った情報にしないための工夫
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 記述対象への著者の事実誤認に基いた記述
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 「対象の知識についてマスターする」は完全な対策にはならない
        - node: li
          children:
          - node: text
            content: 全知全能の神ではないので無謬の技術記事にはならない
    - node: li
      children:
      - node: text
        content: 普遍的な正しさを語るのではなく、局所的にする
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 「このコードは私の環境のPHP 5.4ではこう動く」
  p18:
  - node: p
    children:
    - node: text
      content: 信頼できる情報源
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 公式マニュアル・標準仕様など
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 'MDN Web Docs: HTML/JavaScript/CSS'
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: 検索キーワードに「mdn」を付ける癖をつけると簡単にアクセスできます
        - node: li
          children:
          - node: text
            content: PHPマニュアル、Pythonドキュメント、Rubyリファレンスマニュアル
        - node: li
          children:
          - node: text
            content: そのほか日本のコミュニティ有志が独自に公開しているものもある
    - node: li
      children:
      - node: text
        content: その実装がGitHubなどで読めればソースコードを直接参照する
  p19:
  - node: p
    children:
    - node: text
      content: 間違った情報にしないための工夫
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 記述対象への著者の事実誤認に基いた記述
    - node: li
      children:
      - node: text
        content: 極力、信頼できる情報源を直接参照するようにする
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 曖昧な理解のブログをソースにしても誤解に誤解が増幅される
    - node: li
      children:
      - node: text
        content: 基本的と思えること(標準関数など)に関しても信頼できる情報源をあたり、
      - node: br
      - node: text
        content: 読者も参照できるようにリンクする
  p20:
  - node: p
    children:
    - node: text
      content: 固有名詞や言葉の使いかたに気を配る
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP, Ruby, JavaScriptなどの大文字小文字の使いかた
    - node: li
      children:
      - node: text
        content: 専門用語の使いかた
    - node: li
      children:
      - node: text
        content: 言葉使い
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: かしこまった文体 (です・ます)
        - node: li
          children:
          - node: text
            content: 論文のような文体 (だ・である)
        - node: li
          children:
          - node: text
            content: カジュアルなくだけた文体
        - node: li
          children:
          - node: text
            content: 関西型言語
  p21:
  - node: p
    children:
    - node: text
      content: コードが動くことをどう保証するか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 手元にいろんなOSや複数の言語処理系のインストールをするのは難しい
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: オンラインのサンドボックスサイトを使う
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: https://wandbox.org/ 多くの言語・バージョンをサポート
            - node: li
              children:
              - node: text
                content: https://3v4l.org/ PHP特化・非常に多くのバージョンをサポート
            - node: li
              children:
              - node: text
                content: URL共有できるので、第三者が見られ動作確認のソースにする
    - node: li
      children:
      - node: text
        content: 最近はDockerでの環境構築できるようになった
  p22:
  - node: p
    children:
    - node: text
      content: 初心者のおすすめの発信
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: そもそも正しい／間違いという枠に収まらない発信から始める
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: インストールや作業などのログ
        - node: li
          children:
          - node: text
            content: 勉強会イベント・カンファレンスに参加した感想
        - node: li
          children:
          - node: text
            content: 自分なりのカスタマイズやこだわりについてまとめる
  p23:
  - node: p
    children:
    - node: text
      content: 書きたいネタがない…
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 書きたいと思ったことは既に誰かが書いてる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 個人的意見： 大事なことは誰が何回書いてもいい
        - node: li
          children:
          - node: text
            content: 既存の記事に関して、自分なりの意見や経験を付け加えるだけで
          - node: br
          - node: text
            content: 価値のあるアウトプットになる
size:
  max_width: 1920
  max_height: 1080
links:
  p16:
  - url: https://shodo.ink/
    title: Shodo（ショドー）：さあ、書こう。生成AIによる日本語の校正・校閲クラウド
  p18:
  - url: https://www.php.net/manual/ja/index.php
    title: 'PHP: PHP マニュアル - Manual'
  - url: https://docs.python.org/ja/3/index.html
    title: 3.14.0 Documentation
  - url: https://docs.ruby-lang.org/ja/latest/doc/index.html
    title: オブジェクト指向スクリプト言語 Ruby リファレンスマニュアル (Ruby 3.4 リファレンスマニュアル)
  p21:
  - url: https://wandbox.org/
    title: Wandbox
  - url: https://3v4l.org/
    title: Online PHP editor | Test code in 250+ PHP versions
