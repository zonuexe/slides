    - node: text
      content: PHPの基本構文
  p40:
  - node: p
    children:
    - node: text
      content: 'データ型・リテラル<?php         // 全ての変数は $ から始まる $string = ''string'' . "value"; $array  = [1, 2, 3]; $bool   =
        true; $int    = 56789; $float  = 1.234; $obj1   = new stdClass; $obj2   =
        (object)["name" => "Miku", "age" => 16];'
  p41:
  - node: p
    children:
    - node: text
      content: '関数定義<?php         namespace zonuexe; function triangle_area(float $h, float $b) :float {     return
        $h * $b / 2; } function triangle_area($h, $b) {     return $h * $b / 2; }'
  p42:
  - node: p
    children:
    - node: text
      content: 関数・クラス定義の注意
    - node: bold
      content: '         '
    - node: text
      content: 'RubyやPythonでは関数(メソッド)を再定義したり、定義済みクラスに定義を追加できる

        (オープンクラス、モンキーパッチング)その代り特定のクラスが複数ファイルに分割されることがないのでわかりやすい'
  p43:
  - node: p
    children:
    - node: text
      content: 'クロージャ<?php         $h = function($s) {     return htmlspecialchars($s, ENT_QUOTES, ''UTF-8'');
        }; $array = array_map($h, getNames());'
