      content: どこでPHPを動かせばいいか
    - node: bold
      content: '         '
    - node: text
      content: '何も考えずにレンタルサーバ借りて、ファイルを適当に転送すれば動く

        HerokuとかPaaSでも簡単に動く

        オンプレとかVPSとかでアプリケーションサーバーを実行する方法もある'
