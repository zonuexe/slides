        $tadsan = [     "name" => "めぐりねるか",     "age"  => 28,     "from" => "北海道",
        ];
  p46:
  - node: p
    children:
    - node: text
      content: foreach<?php $fruits = ["りんご", "ばなな", "みかん"]; for ($i = 0; $i < count($fruits);
        $i++) {     printf("%s\n", $fruits[$i]); } foreach ($fruits as $fruit) {     printf("%s\n",
        $fruit); }
  p47:
  - node: p
    children:
    - node: text
      content: 'ジェネレータ<?php function fizzbuzz ($to) {     for ($i = 1; $i <= $to;
        $i++) {         $s = "";         if ($i % 3 == 0) { $s .= "Fizz"; }         if
        ($i % 5 == 0) { $s .= "Buzz"; }         yield ($s === "") ? $i : $s;    }
        }'
  p48:
  - node: p
    children:
    - node: text
      content: 'ジェネレータ + foreach//  フィボナッチ数列を順に出力するforeach (fizzbuzz(100) as $f) {     echo
        $f, PHP_EOL; } // これを応用すれば、函数型プログラミングの         //  遅延リスト(無限リスト)を簡単に実装できる！'
  p49:
  - node: p
    children:
    - node: text
      content: callable (文字列)<?php $func= "strlen"; echo $func("abcde"); //=> 5 $ary
        = ["a", "bc", "desc", "hello"]; $bry = array_map("strlen", $ary); //=> [1,
        2, 3, 4, 5]
  p50:
  - node: p
    children:
    - node: text
      content: 'callable (そのほか)<?php $dt = new DateTime; $method = [$dt, "getTimeStamp"];
        echo $method(); // 1503115455 echo $dt->getTimeStamp();         // 1503115455 '
  p51:
  - node: p
    children:
    - node: text
      content: Reflection<?php function sampleFnc($a, $b, $c = null){} $ref = new
        ReflectionFunction("sampleFnc"); echo $ref->getNumberOfParameters(); //=>
        3 echo $ref->getNumberOfRequiredParameters(); //=> 2
