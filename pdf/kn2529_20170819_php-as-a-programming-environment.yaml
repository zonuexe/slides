text:
  p1:
  - kind: heading
    level: 1
    text: プログラミング環境としての
  - kind: para
    text: Introducing PHP as a Programming Environment
  - kind: para
    text: '2017-08-19 NEEC Kamata #opendevcon Open Developers Conference 2017 Tokyo'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社でひたすらPHPやってる p(ixi)v
    - フレームワークなき道にフレームを作るおしごと
    - Qiitaに記事を書いたり変なコメントしてるよ
    - 最近やってること
    - 万難が排されつつあるのでPHP7 移行
    - えいやえいやとテスト書いたり直したりしてる
  p3:
  - kind: para
    text: 最初に覚えてほしいこと
  p4:
  - kind: para
    text: 現在の安定版は7.1系です
  p5:
  - kind: para
    text: 質問です
  p6:
  - kind: para
    text: あなたの想像するPHPコードはどれ？
  p7:
  - kind: heading
    level: 1
    text: A
  - kind: para
    text: '<!DOCTYPE html><html><head><title>Hello, PHP!</title></head><p><?php if
      (date(''H'') < 19): ?>こんにちは<?php else: ?>こんばんは<?php endif; ?></p><p>今は<?= htmlspecialchars(date(''H''))
      ?>時です</p>'
  p8:
  - kind: heading
    level: 1
    text: B
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s) {print '<li>'; print $s->name; print '</li>';}print
      '</ul>';
  p9:
  - kind: heading
    level: 1
    text: C
  - kind: para
    text: <?php namespace Hoge\Http\Controller;class BooksController extends BaseController
      {public function index() {$books = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));}}
  p10:
  - kind: para
    text: いろいろある
  p11:
  - kind: heading
    level: 1
    text: よくあるPHPのコード分類
  - kind: para
    text: 'A: HTMLの条件分岐と値の出力'
  - kind: para
    text: 'B: DBの内容をHTMLとして出力'
  - kind: para
    text: 'C: クラス定義だけ書かれたコード'
  p12:
  - kind: heading
    level: 1
    text: よくあるPHPのコード分類
  - kind: para
    text: 'A: HTMLの条件分岐と値の出力↑ SSI的PHP'
  - kind: para
    text: 'B: DBの内容をHTMLとして出力↑ CGI的PHP'
  - kind: para
    text: 'C: クラス定義だけ書かれたコード↑ フレームワーク的PHP'
  p13:
  - kind: para
    text: 割とどうとでも書けるのがPHP
  p14:
  - kind: heading
    level: 1
    text: PHPの実行手順のイメージ
  - kind: para
    text: コードを書く (or 既製コードを準備)
  - kind: para
    text: レンタルサーバーを借ります
  - kind: para
    text: (S)FTPで.phpファイルを転送します
  - kind: para
    text: デプロイ完了 ＼(^o^)／
  p15:
  - kind: para
    text: PHPで書くとURLに.phpって付くのでは??
  p16:
  - kind: heading
    level: 1
    text: そんなことはない
  - kind: para
    text: (そんなこともある)
  p17:
  - kind: heading
    level: 2
    text: ディレクトリ配置のイメージ
  - kind: heading
    level: 1
    text: これをな
  - kind: para
    text: php-project/├── inc│ └── bootstrap.php└── public (ドキュメントルート)├── index.php├──
      login.php├── logout.php└── terms.html
  p18:
  - kind: heading
    level: 2
    text: ディレクトリ配置のイメージ
  - kind: heading
    level: 1
    text: こうじゃ
  - kind: para
    text: php-project/├── inc│ ├── bootstrap.php│ └── routes.php└── public (ドキュメントルート)├──
      .htaccess (Apacheの場合)└── index.php
  p19:
  - kind: para
    text: このPHPを動かすにはどうすればいいの
  p20:
  - kind: heading
    level: 1
    text: PHPの動作方法にはいろいろある
  - kind: para
    text: Server API (SAPI) と呼ばれる
  - kind: para
    text: コマンドライン (cli, cli-server)
  - kind: para
    text: Apache+mod_php (apache)
  - kind: para
    text: CGI (cgi-fcgi)
  - kind: para
    text: PHP-FPM (fpm-fcgi)
  p21:
  - kind: heading
    level: 1
    text: どこでPHPを動かせばいいか
  - kind: para
    text: 何も考えずにレンタルサーバ借りて、
  - kind: para
    text: ファイルを適当に転送すれば動く
  - kind: para
    text: HerokuとかPaaSでも簡単に動く
  - kind: para
    text: オンプレとかVPSとかでアプリケー
  - kind: para
    text: ションサーバーを実行する方法もある
  p22:
  - kind: para
    text: テストするだけならPHPだけあればok
  p23:
  - kind: para
    text: php -S localhost:8989 index.php
  p24:
  - kind: para
    text: ビルトインサーバー(php -S) PHP5.4以降
  - kind: para
    text: 開発用の簡易HTTP鯖
  p25:
  - kind: heading
    level: 1
    text: よくある.htaccess (Apache HTTPd)
  - kind: para
    text: '# ファイルがあったら、それを返す(.phpなら実行)# 存在しなかったら、index.phpを実行RewriteCond %{REQUEST_FILENAME}
      !-f RewriteRule ^ index.php [QSA,L]'
  p26:
  - kind: heading
    level: 1
    text: 愚直な routes.php
  - kind: para
    text: <?php$path = substr(explode('?', $_SERVER['REQUEST_URI'], 2)[0], 1);$is_post
      = $_SERVER['REQUEST_METHOD'] === 'POST';
  - kind: para
    text: 'if ($is_get && $path === ''/'') {show_index(); return;} elseif ($path ===
      ''/login'') {$is_post ? post_login() : show_login(); return;}'
  - kind: para
    text: http_response_code(404);echo "ないよー";
  p27:
  - kind: para
    text: これを毎回自分で書くのはちょっぴり大変なので、フレームワークを利用する
  p28:
  - kind: para
    text: PHP micro framework
  - kind: para
    text: Slim, Lumen など
  p29:
  - kind: para
    text: シンプルなルーティ
  - kind: para
    text: ングがしたかった
  - kind: para
    text: https://qiita.zonu.me/simple-routing
  p30:
  - kind: para
    text: そろそろ言語の話
  p31:
  - kind: para
    text: PHPには「protected属性」も「仮想メソッド」もありますよ。情報学科の教官が「重要だ」っていうやつは何でもね。僕自身は、こんなものどうでもいいと思ってますけど。–Rasmus
      Lerdorf
  - kind: para
    text: 伝説のPHP作者「Rasmus Lerdorf」名言集を聞くと嫌PHP厨がファビョる
  - kind: para
    text: https://anond.hatelabo.jp/20100427231539 の訳を抜萃
  p32:
  - kind: para
    text: 実際ふつうの言語にある機能はだいたいある
  p33:
  - kind: para
    text: Linux, *BSD,macOS, Windows
  p34:
  - kind: para
    text: RubyやPythonで書けることは概ねできると思ってよい(異常に苦手なことはある)
  p35:
  - kind: para
    text: Cっぽさ、Perlっぽさ、そこはかとないJavaっぽさ(結果としてどれでもない雑然とした感じ)
  p36:
  - kind: heading
    level: 1
    text: Cっぽいコード
  - kind: para
    text: <?php
  - kind: para
    text: $fp = fopen('input.txt', 'r');$i = 0;
  - kind: para
    text: 'while (($line = fgets($fp, 4096)) !== false) {printf("%d: %s", ++$i, $line);}'
  p37:
  - kind: heading
    level: 1
    text: Perlっぽいコード
  - kind: para
    text: <?php
  - kind: para
    text: $con = mysqli_connect() or die(1);# ただし、現在は例外を利用すべき# テストもしにくくなるので非推奨
  p38:
  - kind: heading
    level: 1
    text: Javaっぽいコード
  - kind: para
    text: <?php abstract class Foo {abstract function sample($n);}final class Bar
      extends Foo implements Hoge {public function sample($n) {if (!is_numeric($n))
      {throw new InvalidArgumentException("errorMsg");}}}
  - kind: para
    text: $bar = new Bar(); $bar->sampleCode(128);
  p39:
  - kind: para
    text: PHPの基本構文
  p40:
  - kind: heading
    level: 1
    text: データ型・リテラル
  - kind: para
    text: <?php// 全ての変数は $ から始まる$string = 'string' . "value";$array = [1, 2, 3];$bool
      = true;$int = 56789;$float = 1.234;$obj1 = new stdClass;$obj2 = (object)["name"
      => "Miku", "age" => 16];
  p41:
  - kind: heading
    level: 1
    text: 関数定義
  - kind: para
    text: <?php namespace zonuexe;
  - kind: para
    text: function triangle_area(float $h, float $b) :float {return $h * $b / 2;}
  - kind: para
    text: function triangle_area($h, $b) {return $h * $b / 2;}
  p42:
  - kind: heading
    level: 1
    text: 関数・クラス定義の注意
  - kind: para
    text: RubyやPythonでは関数(メソッド)を再定義したり、定義済みクラスに定義を追加できる(オープンクラス、モンキーパッチング)
  - kind: para
    text: その代り特定のクラスが複数ファイルに分割されることがないのでわかりやすい
  p43:
  - kind: heading
    level: 1
    text: クロージャ
  - kind: para
    text: <?php
  - kind: para
    text: $h = function($s) {return htmlspecialchars($s, ENT_QUOTES, 'UTF-8');};
  - kind: para
    text: $array = array_map($h, getNames());
  p44:
  - kind: para
    text: PHPの良い言語機能
  p45:
  - kind: heading
    level: 1
    text: array
  - kind: para
    text: <?php$old_num = array(1, 2, 3);$fruits = ["りんご", "ばなな", "みかん"];
  - kind: para
    text: $tadsan = ["name" => "めぐりねるか","age" => 28,"from" => "北海道",];
  p46:
  - kind: heading
    level: 1
    text: foreach
  - kind: para
    text: <?php$fruits = ["りんご", "ばなな", "みかん"];
  - kind: para
    text: for ($i = 0; $i < count($fruits); $i++) {printf("%s\n", $fruits[$i]);}
  - kind: para
    text: foreach ($fruits as $fruit) {printf("%s\n", $fruit);}
  p47:
  - kind: heading
    level: 1
    text: ジェネレータ
  - kind: para
    text: '<?php function fizzbuzz ($to) {for ($i = 1; $i <= $to; $i++) {$s = "";if
      ($i % 3 == 0) { $s .= "Fizz"; }if ($i % 5 == 0) { $s .= "Buzz"; }yield ($s ===
      "") ? $i : $s;}}'
  p48:
  - kind: heading
    level: 1
    text: ジェネレータ + foreach
  - kind: para
    text: // フィボナッチ数列を順に出力するforeach (fizzbuzz(100) as $f) {echo $f, PHP_EOL;}
  - kind: para
    text: // これを応用すれば、函数型プログラミングの// 遅延リスト(無限リスト)を簡単に実装できる！
  p49:
  - kind: heading
    level: 1
    text: callable (文字列)
  - kind: para
    text: <?php
  - kind: para
    text: $func= "strlen";echo $func("abcde"); //=> 5
  - kind: para
    text: $ary = ["a", "bc", "desc", "hello"];$bry = array_map("strlen", $ary);//=>
      [1, 2, 3, 4, 5]
  p50:
  - kind: heading
    level: 1
    text: callable (そのほか)
  - kind: para
    text: <?php
  - kind: para
    text: $dt = new DateTime;$method = [$dt, "getTimeStamp"];
  - kind: para
    text: echo $method();// 1503115455 echo $dt->getTimeStamp();// 1503115455
  p51:
  - kind: heading
    level: 1
    text: Reflection
  - kind: para
    text: <?php
  - kind: para
    text: function sampleFnc($a, $b, $c = null){}
  - kind: para
    text: $ref = new ReflectionFunction("sampleFnc");echo $ref->getNumberOfParameters();//=>
      3 echo $ref->getNumberOfRequiredParameters();//=> 2
  p52:
  - kind: para
    text: Webプログラミングに適した機能
  p53:
  - kind: para
    text: 実はPHPのWebはCGIの世界観HTMLを print したりすると出力される
  p54:
  - kind: heading
    level: 1
    text: テンプレート
  - kind: para
    text: '<?php// HTTPヘッダはボディよりも先に出力するheader("Content-Type: text/plain;");echo "apple\n";?>orange
      banana<?= getMelon() ?><?php function getMelon(){ return "melon"; }'
  p55:
  - kind: para
    text: 実は ?>ほげ<?php はecho "ほげ"; と同じ
  p56:
  - kind: heading
    level: 1
    text: テンプレート
  - kind: para
    text: <?php $n = trim(fgets(fopen('php://stdin', 'r')));for ($i = 1; $i <= $n;
      $i++) {if ($i % 3 === 0) { ?>Fizz<?php }if ($i % 5 === 0) { ?>Buzz<?php }elseif
      ($i % 3 !== 0) echo $i;?><?php }
  p57:
  - kind: heading
    level: 1
    text: 出力バッファリング
  - kind: para
    text: <?php
  - kind: para
    text: ob_start();var_dump(new DateTime);$str = ob_get_clean();
  - kind: para
    text: var_dump($str);
  p58:
  - kind: heading
    level: 1
    text: $_SERVER
  - kind: para
    text: <?php// http://php.net/$_SERVER を読む
  - kind: para
    text: // ユーザーのリクエスト情報echo htmlspecialchars($_SERVER['REQUEST_METHOD']);echo htmlspecialchars($_SERVER['REQUEST_URI']);echo
      htmlspecialchars($_SERVER['HTTP_ACCEPT_LANGUAGE']);
  p59:
  - kind: heading
    level: 1
    text: HTTPのための機能
  - kind: para
    text: <?php$img = base64_decode('R0lGODlhAQABAIABAP///wAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==');
  - kind: para
    text: 'http_response_code(404);header("Content-Type: image/gif");header("Content-Length:".strlen($img));'
  - kind: para
    text: echo $img;
  p60:
  - kind: heading
    level: 1
    text: セッション機能
  - kind: para
    text: <?php // logout.php session_start();
  - kind: para
    text: $ls_logged_in = isset($_SESSION['user_id']);
  - kind: para
    text: if ($is_logged_in) {$_SESSION = [];session_regenerate_id();}
  p61:
  - kind: para
    text: まとめ
  p62:
  - kind: heading
    level: 1
    text: まとめ
  - kind: para
    text: PHPは7.1系(2017年現在安定版)にしよう
  - kind: para
    text: PHPは多様なスタイルがあるよ
  - kind: para
    text: レンタルサーバーとかに適当に置けばまあなんとなく動くよ
  - kind: para
    text: PHPはふつうの文法とWeb向きの機能があるプログラミング言語だよ
