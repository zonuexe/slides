  p42:
  - kind: heading
    level: 1
    text: 関数・クラス定義の注意
  - kind: para
    text: RubyやPythonでは関数(メソッド)を
  - kind: para
    text: 再定義したり、定義済みクラスに定義を
  - kind: para
    text: 追加できる(オープンクラス、モンキーパッチング)
  - kind: para
    text: その代り特定のクラスが複数ファイルに
  - kind: para
    text: 分割されることがないのでわかりやすい
