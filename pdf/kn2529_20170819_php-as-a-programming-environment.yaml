  p19:
  - kind: para
    text: このPHPを動かすに
  - kind: para
    text: はどうすればいいの
  p20:
  - kind: heading
    level: 1
    text: PHPの動作方法にはいろいろある
  - kind: para
    text: Server API (SAPI) と呼ばれる
  - kind: para
    text: コマンドライン (cli, cli-server)
  - kind: para
    text: Apache+mod_php (apache)
  - kind: para
    text: CGI (cgi-fcgi)
  - kind: para
    text: PHP-FPM (fpm-fcgi)
  p21:
  - kind: heading
    level: 1
    text: どこでPHPを動かせばいいか
  - kind: para
    text: 何も考えずにレンタルサーバ借りて、
  - kind: para
    text: ファイルを適当に転送すれば動く
  - kind: para
    text: HerokuとかPaaSでも簡単に動く
  - kind: para
    text: オンプレとかVPSとかでアプリケー
  - kind: para
    text: ションサーバーを実行する方法もある
  p22:
  - kind: para
    text: テストするだけなら
  - kind: para
    text: PHPだけあればok
  p23:
  - kind: para
    text: php -S
  - kind: para
    text: localhost:8989 index.php
  p24:
  - kind: para
    text: ビルトインサーバー
  - kind: para
    text: (php -S) PHP5.4以降
  - kind: para
    text: 開発用の簡易HTTP鯖
  p25:
  - kind: heading
    level: 1
    text: よくある.htaccess (Apache HTTPd)
  - kind: para
    text: '# ファイルがあったら、それを返す(.phpなら実行)'
  - kind: para
    text: '# 存在しなかったら、index.phpを実行'
  - kind: para
    text: RewriteCond %{REQUEST_FILENAME} !-f
  - kind: para
    text: RewriteRule ^ index.php [QSA,L]
  p26:
  - kind: heading
    level: 1
    text: 愚直な routes.php
  - kind: para
    text: <?php
  - kind: para
    text: $path = substr(explode('?', $_SERVER['REQUEST_URI'], 2)[0], 1);
  - kind: para
    text: $is_post = $_SERVER['REQUEST_METHOD'] === 'POST';
  - kind: para
    text: if ($is_get && $path === '/') {
  - kind: para
    text: show_index(); return;
  - kind: para
    text: '} elseif ($path === ''/login'') {'
  - kind: para
    text: '$is_post ? post_login() : show_login(); return;'
  - kind: para
    text: '}'
  - kind: para
    text: http_response_code(404);
  - kind: para
    text: echo "ないよー";
  p27:
  - kind: para
    text: これを毎回自分で書くのは
  - kind: para
    text: ちょっぴり大変なので、
  - kind: para
    text: フレームワークを利用する
  p28:
  - kind: para
