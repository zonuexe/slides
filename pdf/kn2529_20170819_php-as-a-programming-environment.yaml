  p47:
  - kind: heading
    level: 1
    text: ジェネレータ
  - kind: para
    text: <?php
  - kind: para
    text: function fizzbuzz ($to) {
  - kind: para
    text: for ($i = 1; $i <= $to; $i++) {
  - kind: para
    text: $s = "";
  - kind: para
    text: if ($i % 3 == 0) { $s .= "Fizz"; }
  - kind: para
    text: if ($i % 5 == 0) { $s .= "Buzz"; }
  - kind: para
    text: 'yield ($s === "") ? $i : $s;'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p48:
  - kind: heading
    level: 1
    text: ジェネレータ + foreach
  - kind: para
    text: // フィボナッチ数列を順に出力する
  - kind: para
