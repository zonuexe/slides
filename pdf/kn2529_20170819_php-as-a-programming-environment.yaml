  p14:
  - kind: heading
    level: 1
    text: PHPの実行手順のイメージ
  - kind: para
    text: コードを書く (or 既製コードを準備)
  - kind: para
    text: レンタルサーバーを借ります
  - kind: para
    text: (S)FTPで.phpファイルを転送します
  - kind: para
    text: デプロイ完了 ＼(^o^)／
  p15:
  - kind: para
    text: PHPで書くとURLに
  - kind: para
    text: .phpって付くのでは??
