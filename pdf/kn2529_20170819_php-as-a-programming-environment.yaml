  p17:
  - node: p
    children:
    - node: text
      content: ディレクトリ配置のイメージこれをなphp-project/ ├── inc │   └── bootstrap.php └── public  (ドキュメントルート)    ├──
        index.php     ├── login.php     ├── logout.php     └── terms.html
  p18:
  - node: p
    children:
    - node: text
      content: ディレクトリ配置のイメージこうじゃphp-project/ ├── inc │   ├── bootstrap.php │   └──
        routes.php └── public  (ドキュメントルート)    ├── .htaccess  (Apacheの場合)    └── index.php
  p19:
  - node: p
    children:
    - node: text
      content: このPHPを動かすにはどうすればいいの
  p20:
  - node: p
    children:
    - node: text
      content: 'PHPの動作方法にはいろいろあるServer API (SAPI) と呼ばれる

