  p30:
  - kind: para
    text: そろそろ言語の話
  p31:
  - kind: para
    text: PHPには「protected属性」も「仮想メソッ
  - kind: para
    text: ド」もありますよ。情報学科の教官が「重
  - kind: para
    text: 要だ」っていうやつは何でもね。僕自身は、
  - kind: para
    text: こんなものどうでもいいと思ってますけど。
  - kind: para
    text: –Rasmus Lerdorf
  - kind: para
    text: 伝説のPHP作者「Rasmus Lerdorf」名言集を聞くと嫌PHP厨がファビョる
  - kind: para
    text: https://anond.hatelabo.jp/20100427231539 の訳を抜萃
