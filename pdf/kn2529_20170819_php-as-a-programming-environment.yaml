  p10:
  - kind: para
    text: いろいろある
  p11:
  - kind: heading
    level: 1
    text: よくあるPHPのコード分類
  - kind: para
    text: 'A: HTMLの条件分岐と値の出力'
  - kind: para
    text: 'B: DBの内容をHTMLとして出力'
  - kind: para
    text: 'C: クラス定義だけ書かれたコード'
  p12:
  - kind: heading
    level: 1
    text: よくあるPHPのコード分類
