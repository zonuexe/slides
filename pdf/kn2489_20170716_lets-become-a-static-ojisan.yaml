text:
  p1:
  - kind: heading
    level: 2
    text: 公開版
  - kind: heading
    level: 1
    text: staticおじさんになろう
  - kind: para
    text: War on Dynamics
  - kind: para
    text: 2017-07-15 PHPカンファレンス関西2017 LT
  p2:
  - kind: para
    text: このスライドは2017年7月15日に開催されたPHPカンファレンス関西2017で当日募集された本篇LTにて話したスライドに調整および加筆を施したものです。口頭で補足したもの、文字だけではわかりにくいものを補ったほか、後半部分に文章の追加があります。
  p3:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - GitHub/Packagistでは id:zonuexe
    - ピクシブ株式会社でひたすらPHPやってる p(ixi)v
    - フレームワークなき道にフレームを作るおしごと
    - Qiitaに記事を書いたり変なコメントしてるよ
    - 最近やってること
    - 万難が排されつつあるのでPHP7 移行
    - えいやえいやとテスト書いたり直したりしてる
  p4:
  - kind: para
    text: そろそろ10年になるWebサービスを開発
  p5:
  - kind: para
    text: 注意
  p6:
  - kind: para
    text: このLTは特定のアーキテクチャの導入を勧誘するものではなく、その是非については自分で判断してください。
  p7:
  - kind: para
    text: 対処が難しかった事例を寄せ集めただけで、特定の実装の話ではない
  p8:
  - kind: para
    text: オチは特にない
  p9:
  - kind: para
    text: あと特定の会社の回し者ではない
  p10:
  - kind: para
    text: さて
  p11:
  - kind: para
    text: あるメソッドのAPI(引数・返り値)を変更したいとします
  p12:
  - kind: para
    text: リファクタリング
  - kind: para
    text: できますか？
  p13:
  - kind: para
    text: そのメソッドの呼び出し箇所を列挙できますか？
  p14:
  - kind: para
    text: そうですね
  p15:
  - kind: para
    text: git grep '\->setName('
  p16:
  - kind: para
    text: 本当にそれで全部ですか？
  p17:
  - kind: para
    text: $obj = new FugaClass;$f = [$obj, 'setName'];call_user_func($f, $n);
  p18:
  - kind: para
    text: 🙃
  p19:
  - kind: para
    text: $obj = new FugaClass;$obj->setName($v);// ↑探したいのはこっち$obj2 = new HogeClass;$obj->setName($x,
      $y);// ↑同名の関係ないメソッド
  p20:
  - kind: para
    text: 誤爆
  p21:
  - kind: para
    text: 結果を絞ろう
  p22:
  - kind: para
    text: '# newの次行にsetNameがある前提git grep -a1 ''new FugaClass'' |'
  - kind: para
    text: grep '\->setName('
  p23:
  - kind: para
    text: これで完璧
  p24:
  - kind: para
    text: // DIコンテナ$app['fuga']->setName($n);
  p25:
  - kind: para
    text: 🙃
  p26:
  - kind: para
    text: こんなことが続くと人間は無気力になる(学習性無力感)
  p27:
  - kind: para
    text: (そのあとも動的な性質による悩みは絶えない)
  p28:
  - kind: para
    text: ソリューション
  p29:
  - kind: heading
    level: 1
    text: new staticおじさんedition
  - kind: para
    text: class FugaClass {private $name;private function __construct(){}
  - kind: para
    text: public static function setName(FugaClass $that, $name) {
  - kind: para
    text: $that->name = $name;}// ...
  p30:
  - kind: para
    text: git grep'FugaClass::setName'
  p31:
  - kind: para
    text: これでいいのか
  p32:
  - kind: para
    text: 😇
  p33:
  - kind: para
    text: 書きにくくなっただけでは…
  p34:
  - kind: heading
    level: 1
    text: staticおじさんをやめよう
  - kind: para
    text: Beat “evil” static methods
  - kind: para
    text: 2017-07-15 PHPカンファレンス関西2017 LT
  p35:
  - kind: para
    text: 特効薬
  p36:
  - kind: para
    text: Photoshop
  p37:
  - kind: para
    text: PhpStorm
  p38:
  - kind: para
    text: FindUsageとRefactor機能最強説
  p39:
  - kind: para
    text: 型
  p40:
  - kind: para
    text: 型が推測できなくなるような複雑な書き方をしない
  p41:
  - kind: para
    text: 型を確定できないところは地道にPHPDocで型をつけていく
  p42:
  - kind: para
    text: http://nico.ms/kn1774
  p43:
  - kind: heading
    level: 1
    text: これだけ覚えて帰ってね
  - kind: para
    text: タグ名
  - kind: para
    text: 意味
  - kind: para
    text: 例
  - kind: para
    text: '@param引数を定義@param int $n1'
  - kind: para
    text: '@return返り値を定義@return int[]'
  - kind: para
    text: '@var変数/プロパティを定義@var int'
  - kind: para
    text: '@propertyマジックプロパティを定義@property int $id'
  p44:
  - kind: para
    text: DI/IoCコンテナは？
  p45:
  - kind: para
    text: (日本語での説明、ただしサンプルコードが旧形式)PhpStorm の PHPSTORM_META でサービスロケーターとかを入力補完 - ngyukiの日記
  - kind: para
    text: http://ngyuki.hatenablog.com/entry/2015/02/20/134239
  - kind: para
    text: (公式資料・新形式のコード例が載ってる)PhpStorm Advanced Metadata
  - kind: para
    text: https://confluence.jetbrains.com/display/PhpStorm/
  - kind: para
    text: PhpStorm+Advanced+Metadata#PhpStormAdvancedMetadata-Factorymethods
  p46:
  - kind: para
    text: 某社の回し者ではないので、PhpStorm以外に良いツールあれば知りたい！
  p47:
  - kind: para
    text: そもそもstaticおじさんになった理由はコレジャナイ
  p48:
  - kind: heading
    level: 1
    text: なれる！staticおじさん
  - kind: para
    text: I wanna be a clever static uncle
  - kind: para
    text: 2017-07-15 PHPカンファレンス関西2017 LT
  p49:
  - kind: para
    text: Webサービスを作る人間＝オブジェクト指向の達人
  p50:
  - kind: para
    text: ではない
  p51:
  - kind: para
    text: 素朴に作られたクラスは余計な状態を抱えこんで渾沌が肥大化する
  p52:
  - kind: para
    text: 多すぎる引数…謎のメソッド…不要なプロパティ…
  p53:
  - kind: para
    text: それでもコードは動き、今の自分たちを生かしてくれてる (=収益源)
  p54:
  - kind: para
    text: 作られた当時は
  - kind: para
    text: 理由があった
  - kind: para
    text: (たぶん)
  p55:
  - kind: para
    text: 動いてきたコードへのリスペクトを見失ってはならない
  p56:
  - kind: para
    text: それでもサービスを成長させる足枷にならないようにリファクタリングしていく
  p57:
  - kind: para
    text: 混沌としたクラスからstaticおじさんに身を堕としたのはカオスを収束させるため
  p58:
  - kind: para
    text: カオスを収束させた後ならば、未来に向かって「あるべき姿」を再定義することができる
  p59:
  - kind: para
    text: カオスを収束させずに夢を見てアーキテクチャの再設計を試みると理想と現実のギャップと物量に圧し潰されて氏ぬ
  p60:
  - kind: para
    text: 重要な事実：オブジェクト指向を多少かじった程度では、ベターなOO設計ができる大先生にはなれない
  p61:
  - kind: para
    text: 設計のエキスパートではなくても多くのパタンに触れていけば現在の身のたけに合ったものを選びとることはできる
  p62:
  - kind: para
    text: オブジェクト指向プログラミングに基いたリファクタリングが常に最適解ではなくて、手続き型なら手続き型としてのやりかたはある。(staticおじさんの再肯定)
  p63:
  - kind: para
    text: 設計に失敗したらやり直しが利くように疎結合にしていくことも大事。
  p64:
  - kind: para
    text: (疎結合にする試みそのものが負債を生むこと往々にしてある。一足飛ばしで変更しすぎるのもよくない)
  p65:
  - kind: para
    text: 現実を直視して分析し、自分たちに合った現実解を地道に適用していく
  p66:
  - kind: para
    text: どんなことにも長所と短所がある。世の中ではオブジェクト指向が先進的、手続き型はレガシーのような風潮もあるが、手続き型がベターと結論することもある。
  p67:
  - kind: para
    text: しかし｢オブジェクト指向はわかりにくい｣｢インスタンスを作るとリファクタリングしにくい｣といった風評はPhpStormなどのIDEで解決できる。ツールを知ることでサービスの成長改善につなげられる。
  p68:
  - kind: para
    text: 良いツールを知らないと「リファクタリング対象をリストアップするときにgrepコマンドでテキスト検索するしかない」といった事態に陥る。(最初の問題提起)
  p69:
  - kind: para
    text: スタートアップ期のコードでは設計に悩み留まって製品をリリースできないことは賢明ではない。リリースされた後も機能追加に注力すべきだが、機能追加と既存機能の安定性を両立しようとすると、どこかで決断の時は来る。
  p70:
  - kind: para
    text: きちんと設計して未来に行こう
