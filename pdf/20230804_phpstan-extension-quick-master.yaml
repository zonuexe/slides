  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - kind: heading
    level: 1
    text: emacs-php
  p4:
  - kind: heading
    level: 1
    text: PHPカンファレンス沖縄2023
  p5:
  - kind: heading
    level: 1
    text: LLイベント
  p6:
  - kind: heading
    level: 1
    text: LLイベント
  p7:
  - kind: heading
    level: 1
    text: LLイベント
  p8:
  - kind: para
    text: PHPってどんな言語？
  p9:
  - kind: para
    text: PHPの型にどのような印象を持っていますか？
  p10:
  - kind: heading
    level: 2
    text: P H P の原作者
  - kind: heading
    level: 1
    text: ラスマスかく語りき
  p11:
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told you you should be using.I
      don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p12:
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”
  - kind: para
    text: –Rasmus Lerdorf
  p13:
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  - kind: para
    text: PHPについてのパブリックイメージ
  p14:
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  - kind: para
    text: PHPについての認識は概ね間違い
  p15:
  - kind: para
    text: PHPの進化は型宣言の進化
  p16:
  - kind: heading
    level: 1
    text: 型がついていない関数(PHP5)
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p17:
  - kind: heading
    level: 1
    text: スカラー型宣言(PHP7)
  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p18:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にfloat
  - kind: para
    text: を強制するのか
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p19:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p20:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p21:
  - kind: para
    text: PHPは強く実行時に保証される型
  - kind: list
    items:
    - PHPはいわゆる動的言語
    - 構文で型宣言された言語要素(関数パラメータ、戻り値、プロパティ)は、
  - kind: para
    text: 実行時にその型の値であることが絶対に保証される
  - kind: list
    items:
    - null安全 (明示的にnullableとして宣言しない限りnullは受け入れない)
    - declare(strict_types=1) で実行時の振る舞いが少し変わるが、
  - kind: para
    text: 型安全性という意味ではあまり変わらないので今回は話しません
  p22:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: intとfloat以外は
  - kind: para
    text: 絶対にありえない
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p23:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: ランタイムにとっては
  - kind: para
    text: ただのコメント
  - kind: para
    text: (口約束)
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p24:
  - kind: para
    text: 201X年、PHPは型の炎に包まれた!!
  p25:
  - kind: para
    text: いまやPHPは静的型付きと言っても過言ではない(本当か…？)
  p26:
  - kind: para
    text: だが型なしは滅びていなかった
  p27:
  - kind: para
    text: 型宣言では配列要素の型を表現できない
  p28:
  - kind: para
    text: PHP組み込み型の限界
  - kind: list
    items:
    - array型やArrayObjectのような汎用的な型の要素の型がわからない
    - evalやjson_decode()などデシリアライズ結果の型がわからない
    - ……これらの事情によりPHPコードをいくら静的解析しても、
  - kind: para
    text: 型が一意に決定されることはない
  - kind: list
    items:
    - 型宣言されてない既存コード、動的プロパティや動的メソッドが宣言できる
    - 静的解析でも型推論ではない別のアプローチが必要
  p29:
  - kind: heading
    level: 1
    text: Bookクラスは複数の著者を持つ
  - kind: para
    text: arrayにすることで
  - kind: para
    text: 複数であることを表現
  - kind: para
    text: class Book{function __construct(private array $authors) {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: Authorクラスの情報が減ってる…
  - kind: para
    text: '}}'
  p30:
  - kind: heading
    level: 1
    text: arrayには無限の可能性
  p31:
  - kind: heading
    level: 1
    text: PHPDocの帰還
  - kind: para
    text: 配列の形状はコメントで書く
  - kind: para
    text: class Book{function __construct(/** @var list<Authors> */private array $authors)
      {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: '}}'
  p32:
  - kind: heading
    level: 1
    text: PHPと型の現在地点
  - kind: list
    items:
    - PHPがランタイムに保証する型と静的解析で検査できる型に分かれる
    - 'function f(int $n): int のような型宣言は実行時安全'
    - 'function g(array $a): array のような型宣言はarrayの要素が不明'
    - PHPDocの型注釈はコメントなので自由に記述できる
    - 標準的な型のほかに静的解析ツールの間で実験的な型も実装されている
    - PHPStanやPsalmの間ではある程度の相互運用が考慮されている
  p33:
  - kind: heading
    level: 1
    text: PHPStan
  p34:
  - kind: heading
    level: 1
    text: PHP Static Analysis Tool
  p35:
  - kind: para
    text: PHPStanとは
  - kind: list
    items:
    - 2016年から開発されているPHPの静的解析ツール
    - Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
  - kind: para
    text: 高速な解析を実現していた
  - kind: list
    items:
    - 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p36:
  - kind: heading
    level: 1
    text: PHPStan拡張
  - kind: list
    items:
    - PHPStanの機能は組み込みのもの含めextensionとして実装されてる
    - 独自拡張をしたいというときも組み込みの拡張が非常に参考になる
    - PHPでよく使われるパッケージ管理ツールのComposerから追加可能
    - よく使われるのは「Rule拡張」と「Type-Specifying拡張」の二種
    - 今回はクイックマスターなので、この話をします
  p37:
  - kind: para
    text: PHPStanの基礎
  - kind: list
    items:
    - PHPStanは構文木はPHP-Parserのノードを利用している
    - いろいろ困ったらPHPStanの本体コードを見にいくことになる
    - https://github.com/phpstan/phpstan-src
    - (-srcがついてるリポジトリを見ないとコードが読めないので注意)
    - PHP組み込み以外の型システムを用意している
    - いわゆる述語メソッドがboolではなく三値(yes/no/maybe)を返す
  p38:
  - kind: heading
    level: 1
    text: PHPStanの型システム
  - kind: list
    items:
    - 型はオブジェクトとして表現されているので実態はコードを読む
    - https://github.com/phpstan/phpstan-src/tree/1.10.x/src/Type
    - PHPの組み込み型、Union/Intersectionなどの複合的な型、
  - kind: para
    text: 組み込み型を継承した定数型、これらの型とintersectionで組み合わせて複合的な型を表現するAccessory型などがある
  - kind: list
    items:
    - たとえばリスト(連番の配列) ArrayType&AccessoryArrayListType
    - これだけで一時間くらい話せるネタ
  p39:
  - kind: heading
    level: 1
    text: Rule拡張でできること
  - kind: list
    items:
    - 構文木から判断できること全部！
    - 渡されてきたScopeオブジェクトから型がとれる
    - コード上に直接書かれた値や具体的に絞り込まれた型には
  - kind: para
    text: 実際の値もとれる
  p40:
  - kind: para
    text: 実装するルールが対象とする構文木の
  - kind: heading
    level: 1
    text: Rule拡張
  - kind: para
    text: ノードクラス名
  - kind: para
    text: 構文木を受け取って
  - kind: para
    text: エラーを配列として返す
  p41:
  - kind: heading
    level: 1
    text: StaticMockRule拡張
  p42:
  - kind: para
    text: メソッド呼び出しのクラス名
  - kind: heading
    level: 1
    text: Type-Specifying拡張
  - kind: para
    text: 実装する拡張が
  - kind: para
    text: 対象のメソッド呼び出しかどうか
  - kind: para
    text: 構文木を受け取って型を返す
  p43:
  - kind: para
    text: Type-Specifying拡張でできること
  - kind: list
    items:
    - 関数呼び出しやメソッド呼び出し、プロパティなどに、
  - kind: para
    text: 型宣言やPHPDocで記述されていない型をつけることができる
  - kind: list
    items:
    - バリデーション関数で実行時に絞り込まれたときに型をつける
  p44:
  - kind: para
    text: メソッド呼び出しのクラス名
  - kind: heading
    level: 1
    text: ReverseRouteReturnTypeExtension
  - kind: para
    text: クラスに属するメソッド全部が対象
  p45:
  - kind: heading
    level: 1
    text: ReverseRouteReturnTypeExtension
  - kind: para
    text: 新しい型string&non-emptyを返す
  p46:
  - kind: heading
    level: 1
    text: ParamHelperTypeSpecifyingExtension
