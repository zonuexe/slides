text:
  p1:
  - node: p
    children:
    - node: text
      content: 'PHPStan拡張 '
    - node: br
    - node: text
      content: クイックマスター
  - node: p
    children:
    - node: text
      content: Fast-learning PHPStan extension
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2023-08-04 Lint Night #2 '
  - node: p
    children:
    - node: bold
      content: '#dena_lint_night '
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - node: p
    children:
    - node: text
      content: emacs-php
  p4:
  - node: p
    children:
    - node: text
      content: PHPカンファレンス沖縄2023
  p5:
  - node: p
    children:
    - node: text
      content: LLイベント
  p6:
  - node: p
    children:
    - node: text
      content: LLイベント
  p7:
  - node: p
    children:
    - node: text
      content: LLイベント
  p8:
  - node: p
    children:
    - node: text
      content: 'PHPって '
    - node: br
    - node: text
      content: どんな言語？
  p9:
  - node: p
    children:
    - node: text
      content: PHPの型にどのような 印象を持っていますか？
  p10:
  - node: p
    children:
    - node: bold
      content: P H P の原作者
    - node: br
    - node: text
      content: ラスマスかく語りき
  p11:
  - node: p
    children:
    - node: bold
      content: '“We have things like protected properties. We have abstract methods.
        We have all this stuff that your computer science teacher told '
    - node: br
    - node: bold
      content: 'you you should be using.  '
    - node: br
    - node: bold
      content: I don't care about this crap at all.”
  - node: p
    children:
    - node: bold
      content: '–Rasmus Lerdorf '
    - node: br
    - node: bold
      content: https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p12:
  - node: p
    children:
    - node: text
      content: には プロパティも
    - node: br
    - node: bold
      content: '“PHP protected  '
    - node: br
    - node: text
      content: 抽象メソッドもありますよ。計算機科学の
    - node: br
    - node: text
      content: 教授が「使え」と言ってるものは全部。
  - node: p
    children:
    - node: text
      content: そんなことはクソ興味ないですけど
  - node: p
    children:
    - node: bold
      content: ”
  - node: p
    children:
    - node: bold
      content: –Rasmus Lerdorf
  p13:
  - node: p
    children:
    - node: text
      content: '脆弱性 ゆるふわ 弱い型 動的         '
    - node: br
    - node: text
      content: クソザコ 型なし 意味不明 弱い 自動変換 貧弱 Perlっぽい 適当
    - node: br
    - node: text
      content: PHPについてのパブリックイメージ
  p14:
  - node: p
    children:
    - node: text
      content: '脆弱性 ゆるふわ 弱い型 動的         '
    - node: br
    - node: text
      content: クソザコ 型なし 意味不明 弱い 自動変換 貧弱 Perlっぽい 適当
    - node: br
    - node: text
      content: PHPについての認識は概ね間違い
  p15:
  - node: p
    children:
    - node: text
      content: PHPの進化は 型宣言の進化
  p16:
  - node: p
    children:
    - node: text
      content: 型がついていない関数(PHP5)
  - node: p
    children:
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p17:
  - node: p
    children:
    - node: text
      content: スカラー型宣言(PHP7)
  - node: p
    children:
    - node: text
      content: 'int + intって '
    - node: br
    - node: text
      content: 本当にintなの？
  - node: p
    children:
    - node: text
      content: 'function add(int $a, int $b): int {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p18:
  - node: p
    children:
    - node: text
      content: 広い値をとるにはﬂoatが必要
  - node: p
    children:
    - node: text
      content: 'ひとつの解決策では '
    - node: br
    - node: text
      content: あるが… 不必要に(cid:152)oat
    - node: br
    - node: text
      content: を強制するのか
  - node: p
    children:
    - node: text
      content: 'function add(float $a, float $b): float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p19:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈
  - node: p
    children:
    - node: text
      content: (アノテーション)
  - node: p
    children:
    - node: text
      content: /**
    - node: br
    - node: text
      content: ' * @param int|float $a'
  - node: p
    children:
    - node: text
      content: あえて型宣言を省略する
  - node: p
    children:
    - node: text
      content: ' * @param int|float $b'
    - node: br
    - node: text
      content: ' * @return int|float'
    - node: br
    - node: text
      content: ' */         '
    - node: br
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p20:
  - node: p
    children:
    - node: text
      content: ユニオン型宣言 (PHP8.0)
  - node: p
    children:
    - node: text
      content: 'function add(int|float $a, int|float $b): int|float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p21:
  - node: p
    children:
    - node: text
      content: PHPは強く実行時に保証される型
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPはいわゆる動的言語
    - node: li
      children:
      - node: text
        content: 構文で型宣言された言語要素(関数パラメータ、戻り値、プロパティ)は、
      - node: br
      - node: text
        content: '実行時にその型の値であることが絶対に保証される '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: null安全 (明示的にnullableとして宣言しない限りnullは受け入れない)
    - node: li
      children:
      - node: text
        content: declare(strict_types=1) で実行時の振る舞いが少し変わるが、
      - node: br
      - node: text
        content: 型安全性という意味ではあまり変わらないので今回は話しません
  p22:
  - node: p
    children:
    - node: text
      content: ユニオン型宣言 (PHP8.0)
  - node: p
    children:
    - node: text
      content: intと(cid:152)oat以外は 絶対にありえない
  - node: p
    children:
    - node: text
      content: 'function add(int|float $a, int|float $b): int|float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p23:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈
  - node: p
    children:
    - node: text
      content: (アノテーション)
  - node: p
    children:
    - node: text
      content: /**
  - node: p
    children:
    - node: text
      content: 'ランタイムにとっては '
  - node: p
    children:
    - node: text
      content: ' * @param int|float $a'
  - node: p
    children:
    - node: text
      content: 'ただのコメント '
    - node: br
    - node: text
      content: (口約束)
  - node: p
    children:
    - node: text
      content: ' * @param int|float $b'
    - node: br
    - node: text
      content: ' * @return int|float'
    - node: br
    - node: text
      content: ' */         '
    - node: br
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p24:
  - node: p
    children:
    - node: text
      content: 201X年､PHPは 型の炎に包まれた!!
  p25:
  - node: p
    children:
    - node: text
      content: 'いまやPHPは '
    - node: br
    - node: text
      content: 静的型付きと言っても
    - node: br
    - node: text
      content: '過言ではない '
    - node: br
    - node: text
      content: (本当か…？)
  p26:
  - node: p
    children:
    - node: text
      content: 'だが型なしは '
    - node: br
    - node: text
      content: 滅びていなかった
  p27:
  - node: p
    children:
    - node: text
      content: '型宣言では配列要素の '
    - node: br
    - node: text
      content: 型を表現できない
  p28:
  - node: p
    children:
    - node: text
      content: PHP組み込み型の限界
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: array型やArrayObjectのような汎用的な型の要素の型がわからない
    - node: li
      children:
      - node: text
        content: evalやjson_decode()などデシリアライズ結果の型がわからない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ……これらの事情によりPHPコードをいくら静的解析しても、
          - node: br
          - node: text
            content: '型が一意に決定されることはない '
    - node: li
      children:
      - node: text
        content: 型宣言されてない既存コード、動的プロパティや動的メソッドが宣言できる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 静的解析でも型推論ではない別のアプローチが必要
  p29:
  - node: p
    children:
    - node: text
      content: Bookクラスは複数の著者を持つ
  - node: p
    children:
    - node: text
      content: 'arrayにすることで '
  - node: p
    children:
    - node: text
      content: 'class Book         '
  - node: p
    children:
    - node: text
      content: 複数であることを表現
  - node: p
    children:
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
  - node: p
    children:
    - node: text
      content: 'Authorクラスの '
  - node: p
    children:
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: 情報が減ってる…
  - node: p
    children:
    - node: text
      content: '}         '
  p30:
  - node: p
    children:
    - node: text
      content: arrayには無限の可能性
  p31:
  - node: p
    children:
    - node: text
      content: PHPDocの帰還
  - node: p
    children:
    - node: text
      content: 配列の形状はコメントで書く
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct(         '
    - node: br
    - node: text
      content: '        /** @var list<Authors> */'
    - node: br
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p32:
  - node: p
    children:
    - node: text
      content: PHPと型の現在地点
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPがランタイムに保証する型と静的解析で検査できる型に分かれる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 'function f(int $n): int のような型宣言は実行時安全'
        - node: li
          children:
          - node: text
            content: 'function g(array $a): array のような型宣言はarrayの要素が不明'
    - node: li
      children:
      - node: text
        content: PHPDocの型注釈はコメントなので自由に記述できる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 標準的な型のほかに静的解析ツールの間で実験的な型も実装されている
        - node: li
          children:
          - node: text
            content: PHPStanやPsalmの間ではある程度の相互運用が考慮されている
  p33:
  - node: p
    children:
    - node: text
      content: PHPStan
  p34:
  - node: p
    children:
    - node: text
      content: PHP Static Analysis Tool
  p35:
  - node: p
    children:
    - node: text
      content: PHPStanとは
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2016年から開発されているPHPの静的解析ツール
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - node: li
      children:
      - node: text
        content: 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
      - node: br
      - node: text
        content: '高速な解析を実現していた '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - node: li
      children:
      - node: text
        content: その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p36:
  - node: p
    children:
    - node: text
      content: PHPStan拡張
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPStanの機能は組み込みのもの含めextensionとして実装されてる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 独自拡張をしたいというときも組み込みの拡張が非常に参考になる
        - node: li
          children:
          - node: text
            content: PHPでよく使われるパッケージ管理ツールのComposerから追加可能
    - node: li
      children:
      - node: text
        content: よく使われるのは「Rule拡張」と「Type-Specifying拡張」の二種
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 今回はクイックマスターなので、この話をします
  p37:
  - node: p
    children:
    - node: text
      content: PHPStanの基礎
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPStanは構文木はPHP-Parserのノードを利用している
    - node: li
      children:
      - node: text
        content: いろいろ困ったらPHPStanの本体コードを見にいくことになる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: https://github.com/phpstan/phpstan-src
        - node: li
          children:
          - node: text
            content: (-srcがついてるリポジトリを見ないとコードが読めないので注意)
    - node: li
      children:
      - node: text
        content: PHP組み込み以外の型システムを用意している
    - node: li
      children:
      - node: text
        content: いわゆる述語メソッドがboolではなく三値(yes/no/maybe)を返す
  p38:
  - node: p
    children:
    - node: text
      content: PHPStanの型システム
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 型はオブジェクトとして表現されているので実態はコードを読む
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: https://github.com/phpstan/phpstan-src/tree/1.10.x/src/Type
    - node: li
      children:
      - node: text
        content: PHPの組み込み型、Union/Intersectionなどの複合的な型、
      - node: br
      - node: text
        content: 組み込み型を継承した定数型、これらの型とintersectionで組み合わせて
      - node: br
      - node: text
        content: '複合的な型を表現するAccessory型などがある '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: たとえばリスト(連番の配列) ArrayType&AccessoryArrayListType
        - node: li
          children:
          - node: text
            content: これだけで一時間くらい話せるネタ
  p39:
  - node: p
    children:
    - node: text
      content: Rule拡張でできること
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 構文木から判断できること全部！
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 渡されてきたScopeオブジェクトから型がとれる
        - node: li
          children:
          - node: text
            content: コード上に直接書かれた値や具体的に絞り込まれた型には
          - node: br
          - node: text
            content: 実際の値もとれる
  p40:
  - node: p
    children:
    - node: text
      content: '実装するルールが '
  - node: p
    children:
    - node: text
      content: Rule拡張
  - node: p
    children:
    - node: text
      content: '対象とする構文木の '
    - node: br
    - node: text
      content: ノードクラス名
  - node: p
    children:
    - node: text
      content: '構文木を受け取って '
    - node: br
    - node: text
      content: エラーを配列として返す
  p41:
  - node: p
    children:
    - node: text
      content: StaticMockRule拡張
  p42:
  - node: p
    children:
    - node: text
      content: Type-Specifying拡張
  - node: p
    children:
    - node: text
      content: メソッド呼び出しのクラス名
  - node: p
    children:
    - node: text
      content: '実装する拡張が '
    - node: br
    - node: text
      content: 対象のメソッド呼び出しかどうか
  - node: p
    children:
    - node: text
      content: 構文木を受け取って型を返す
  p43:
  - node: p
    children:
    - node: text
      content: Type-Specifying拡張でできること
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 関数呼び出しやメソッド呼び出し、プロパティなどに、
      - node: br
      - node: text
        content: '型宣言やPHPDocで記述されていない型をつけることができる '
    - node: li
      children:
      - node: text
        content: バリデーション関数で実行時に絞り込まれたときに型をつける
  p44:
  - node: p
    children:
    - node: text
      content: ReverseRouteReturnTypeExtension
  - node: p
    children:
    - node: text
      content: メソッド呼び出しのクラス名
  - node: p
    children:
    - node: text
      content: 'クラスに属する '
    - node: br
    - node: text
      content: メソッド全部が対象
  p45:
  - node: p
    children:
    - node: text
      content: ReverseRouteReturnTypeExtension
  - node: p
    children:
    - node: text
      content: '新しい型 '
    - node: br
    - node: text
      content: string&non-emptyを返す
  p46:
  - node: p
    children:
    - node: text
      content: ParamHelperTypeSpecifyingExtension
size:
