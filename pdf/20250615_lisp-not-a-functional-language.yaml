  - node: p
    children:
    - node: text
      content: λ-calculus
    - node: br
    - node: text
      content: ラムダ計算 (1930年代-)
  p60:
  - node: p
    children:
    - node: text
      content: 'LISPは '
    - node: br
    - node: text
      content: ラムダ計算の 実装ではない
  p61:
  - node: p
    children:
    - node: text
      content: (すくなくとも初期は)
  p62: []
  p63: []
  p64: []
  p65: []
  p66:
  - node: p
    children:
    - node: text
      content: LISPと変数スコープ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 初期のLISP(LISP1〜MACLISP)は変数スコープの概念が未確立
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: レキシカルスコープかダイナミックスコープかが定かではない(!)
          - node: br
          - node: text
            content: 'FUNARG問題 '
    - node: li
      children:
      - node: text
        content: 1975年に登場したSchemeではクロージャ(レキシカルスコープ)が導入
    - node: li
      children:
      - node: text
        content: 1984年に登場したCommon Lispはレキシカルスコープが基本だが、
      - node: br
      - node: text
        content: スペシャル変数として定義することでダイナミックスコープも使える
  p67: []
  p68:
  - node: p
    children:
    - node: text
      content: (PHP)
  - node: p
    children:
    - node: text
      content: 'λx.λy.x '
    - node: br
    - node: text
      content: fn($x) => fn($y) => $x
