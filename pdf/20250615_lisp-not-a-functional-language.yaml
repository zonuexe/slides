  p51:
  - kind: para
    text: 単純型なしλ計算はチューリング完全であることが知られている
  p52:
  - kind: para
    text: 関数と適用しかないが工夫して制御構造もデータ構造も作れる
  p53:
  - kind: para
    text: こういう積み重ねで現代の関数型っぽい要素が整理された
  p54:
  - kind: para
    text: レキシカルスコープとか不変性とかカリー化とか型推論とか代数的データ型とか遅延評価とかモナドとか関数合成とか参照透過とか
  p55:
  - kind: para
    text: で、Lispはどういう関数型言語なの？
  p56:
