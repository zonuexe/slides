  - node: p
    children:
    - node: text
      content: 'λx.λy.x '
    - node: br
    - node: text
      content: \x -> \y => \x
    - node: br
    - node: text
      content: (const)
  p48:
  - node: p
    children:
    - node: text
      content: (JavaScript)
  - node: p
    children:
    - node: text
      content: 'λx.λy.x '
    - node: br
    - node: text
      content: x => y => x
  p49:
  - node: p
    children:
    - node: text
      content: λx.λy.x
  - node: p
    children:
    - node: text
      content: (太古のJavaScript)
  - node: p
    children:
    - node: text
      content: 'function (x) { '
    - node: br
    - node: text
      content: '    return function (y) { '
    - node: br
    - node: text
      content: '        return x; '
    - node: br
    - node: text
      content: '    }; '
    - node: br
    - node: text
      content: '};'
  p50:
  - node: p
    children:
    - node: text
      content: (PHP)
  - node: p
    children:
    - node: text
      content: 'λx.λy.x '
    - node: br
    - node: text
      content: fn($x) => fn($y) => $x
