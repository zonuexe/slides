    children:
    - node: text
      content: 'TAO/ELISの '
    - node: br
    - node: text
      content: 特徴は現代Lispには 受け継がれていない
  p103:
  - node: p
    children:
    - node: text
      content: 'どのLispも多かれ '
    - node: br
    - node: text
      content: '少なかれ '
    - node: br
    - node: text
      content: マルチパラダイム
  p104:
  - node: p
    children:
    - node: text
      content: 'Lispは '
    - node: br
    - node: text
      content: '関数型の枠に '
    - node: br
    - node: text
      content: 留まっていない
  p105:
  - node: p
    children:
    - node: text
      content: 'Lispのパワーの根源は '
    - node: br
    - node: text
      content: S式・マクロ
