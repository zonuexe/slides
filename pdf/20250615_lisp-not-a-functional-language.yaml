    children:
    - node: text
      content: 'Emacs Lisp '
    - node: br
    - node: text
      content: 広く普及したLispでありながら Lispらしくないと敬遠された
  p85:
  - node: p
    children:
    - node: text
      content: 歴史的経緯の塊
  p86: []
  p87:
  - node: p
    children:
    - node: text
      content: Emacs Lispの弱点
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: クロージャと真正のレキシカルスコープがなかった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: マクロで擬似的に再現したレキシカルスコープはあった
    - node: li
      children:
      - node: text
        content: 末尾再帰最適化がない
    - node: li
      children:
      - node: text
        content: カジュアルに副作用がある
    - node: li
      children:
      - node: text
        content: 名前空間 (パッケージ) がない
    - node: li
      children:
      - node: text
        content: リーダーマクロがない
    - node: li
      children:
      - node: text
        content: Emacsと密結合している
  p88:
  - node: p
    children:
    - node: text
      content: Emacs Lisp
  - node: p
    children:
    - node: text
      content: ' (elisp)'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Richard Stallman (RMS)のこだわりのLisp方言
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: RMSが最近も機能追加しようとしている
    - node: li
      children:
      - node: text
        content: 現存するメジャーな方言ではCommon Lisp寄りではあるが結構違う
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Lisp Machine LispやGosling MLispの影響がある
        - node: li
          children:
          - node: text
            content: Common Lisp風の機能はcl-libという標準ライブラリで同梱
  p89:
  - node: p
    children:
    - node: text
      content: Emacs
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Lispを内蔵したエディタというべきか、
      - node: br
      - node: text
        content: '言語処理系にエディタ機能がついているべきか '
    - node: li
      children:
      - node: text
        content: init.el というファイルにLispで設定を書くが、
      - node: br
      - node: text
        content: '初期化設定とEmacsで動かす機能の開発には境目がまったくない '
    - node: li
      children:
      - node: text
        content: Lispが動く仮想的なLispマシンそのもの
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Evilという互換性が極めて高いVimインターフェイスが実装されている
  p90:
  - node: p
    children:
    - node: text
      content: Emacs Lispの弱点
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: クロージャと真正のレキシカルスコープがなかった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: マクロで擬似的に再現したレキシカルスコープはあった
    - node: li
      children:
      - node: text
        content: 末尾再帰最適化がない
    - node: li
      children:
      - node: text
        content: カジュアルに副作用がある
    - node: li
      children:
      - node: text
        content: 名前空間 (パッケージ) がない
    - node: li
      children:
      - node: text
        content: リーダーマクロがない
    - node: li
      children:
      - node: text
        content: Emacsと密結合している
  p91: []
  p92:
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Emacsの検索には副作用があるが -p のついた述語関数で避けられる
    - node: li
      children:
      - node: text
        content: (declare (side-effect-free t)) で純粋関数としてマークできる
  p93:
  - node: p
    children:
    - node: text
      content: 'Emacs Lisp '
    - node: br
    - node: text
      content: かつては不出来な末っ子扱い 現在は必死に追い上げている
  p94:
  - node: p
    children:
    - node: text
      content: 'Lispは '
    - node: br
    - node: text
      content: マルチパラダイム
  p95:
  - node: p
    children:
    - node: text
      content: 'Lisp Machine '
  - node: p
    children:
    - node: text
      content: AIブームを牽引した専用機
    - node: br
    - node: text
      content: (1970年代後半-)
  p96:
  - node: p
    children:
    - node: text
      content: 'そういう機械が '
    - node: br
    - node: text
      content: 40年以上前にあった
  p97:
  - node: p
    children:
    - node: bold
      content: '「Multi-Paradigm Language TAO」より引用 '
  - node: p
    children:
    - node: bold
      content: ' https://www.nue.org/nue/tao/bitao/s001.html'
  p98:
  - node: p
    children:
    - node: text
      content: この写真は国産LISPマシンのELIS なので本家Emacsの開発経緯とは直 接関係ないのだが内蔵されたZENと いうEmacs風独自エディタの日本語
        入力メソッドKanzenが後のSKKに 繋がりIME史に影響を及ぼしている
  p99: []
  p100: []
  p101: []
