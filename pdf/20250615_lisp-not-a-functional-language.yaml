  p77:
  - node: p
    children:
    - node: text
      content: '機能的には '
    - node: br
    - node: text
      content: 'どのLispでも '
    - node: br
    - node: text
      content: 他のスタイルで書ける
  p78: []
  p79: []
  p80: []
  p81:
  - node: p
    children:
    - node: text
      content: 「
    - node: bold
      content: 初めての人のためのLISP [増補改訂版]
    - node: text
