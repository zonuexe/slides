  - node: p
    children:
    - node: text
      content: 関数型言語
  - node: p
    children:
    - node: text
      content: (じゃないの！？？)
  p39:
  - node: p
    children:
    - node: text
      content: 話をきいてください
  p40:
  - node: p
    children:
    - node: text
      content: 'そもそも '
    - node: br
    - node: text
      content: '関数型って '
    - node: br
    - node: text
      content: なんだ
  p41:
  - node: p
    children:
    - node: text
      content: '｢関数型｣と呼んだのは '
    - node: br
    - node: text
      content: 'ジョンバッカス '
    - node: br
    - node: text
      content: (1977年)
  p42:
  - node: p
    children:
    - node: bold
      content: '“Can programming be liberated from the von Neumann style?: a functional
        style '
    - node: br
    - node: bold
      content: 'and its algebra of programs: Communications of the ACM: Vol 21, No
        8”'
    - node: text
      content: より引用
  p43:
  - node: p
    children:
    - node: text
