text:
  p1:
  - node: p
    children:
    - node: text
      content: 'Lispは関数型言語 '
    - node: br
    - node: text
      content: (ではない)
  - node: p
    children:
    - node: text
      content: Lisp is (not) a functional language
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2025-06-15  #fp_matsuri '
  - node: p
    children:
    - node: bold
      content: 関数型まつり 2025
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3: []
  p4: []
  p5: []
  p6:
  - node: p
    children:
    - node: text
      content: 私とλ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: プログラミング苦手なのでいろんな言語をつまみぐいしてきました
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2010年… 魔法言語 リリカル☆Lispに出会う
        - node: li
          children:
          - node: text
            content: 2011年… 「β簡約！λカ娘」(同人誌)を読む
          - node: br
          - node: text
            content: '　　　　　　　 アルバイト先のF#マスターに単純型なしラムダ計算を教わる '
        - node: li
          children:
          - node: text
            content: 2012年… SICPを解いてSchemeをちょっとかじる
        - node: li
          children:
          - node: text
            content: 2013年… Emacs Lispパッケージをごりごり書きはじめる
  p7:
  - node: p
    children:
    - node: text
      content: 楽しみましたか？
  p8:
  - node: p
    children:
    - node: text
      content: ' Scott Wlaschinさんの招待講演、最高でしたね…'
  p9:
  - node: p
    children:
    - node: text
      content: '関数型言語 '
    - node: br
    - node: text
      content: 使ってますか？
  p10:
  - node: p
    children:
    - node: text
      content: '関数型プログラミング '
    - node: br
    - node: text
      content: してますか？
  p11:
  - node: p
    children:
    - node: text
      content: 'みなさまそれぞれの '
    - node: br
    - node: text
      content: 「関数型」観が あると思います
  p12:
  - node: p
    children:
    - node: text
      content: map/reduceが 使えたら関数型？
  p13:
  - node: p
    children:
    - node: text
      content: λ関数型言語とはλ
  - node: p
    children:
    - node: text
      content: ' (私の偏見に基く認識)'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: C言語
      - node: br
      - node: text
        content: '関数定義ができれば関数型言語だよ派 '
    - node: li
      children:
      - node: text
        content: Python
      - node: br
      - node: text
        content: 'ファーストクラスの関数抽象があれば関数型言語だよ派 '
    - node: li
      children:
      - node: text
        content: Lisp
      - node: br
      - node: text
        content: '標準ライブラリで高階関数(map/reduce)が扱えればいいよ派 '
    - node: li
      children:
      - node: text
        content: 動的／静的の壁
      - node: br
      - node: text
        content: '代数的データ型が扱えない言語は関数型言語じゃないよ派 '
    - node: li
      children:
      - node: text
        content: 型推論の完全性がある静的型付き言語が関数型だよ派
  - node: p
    children:
    - node: bold
      content: ML系
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 関数型というのは純粋関数型のことだよ派
  - node: p
    children:
    - node: bold
      content: Haskell
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: モナディックな表示的意味論を持つ言語だよ派
  p14:
  - node: p
    children:
    - node: text
      content: 日本人も漢字使ってるし 中国語読めるでしょ？
  p15:
  - node: p
    children:
    - node: text
      content: '関数型得意だし '
    - node: br
    - node: text
      content: Lisp書けるでしょ？
  p16:
  - node: p
    children:
    - node: text
      content: 'いやいや… '
    - node: br
    - node: text
      content: 厳しい…
  p17:
  - node: p
    children:
    - node: text
      content: 'それくらい 「関数型」 '
    - node: br
    - node: text
      content: アプローチは多様
  p18:
  - node: p
    children:
    - node: text
      content: 'Lispで '
    - node: br
    - node: text
      content: '｢関数プログラミング｣ '
    - node: br
    - node: text
      content: してますか？
  p19:
  - node: p
    children:
    - node: text
      content: 'Lisp族の中ですら '
    - node: br
    - node: text
      content: '言語 ごとに '
    - node: br
    - node: text
      content: (方言)
    - node: br
    - node: text
      content: 文化が違う
  p20:
  - node: p
    children:
    - node: text
      content: 'みなさんは '
    - node: br
    - node: text
      content: 'Lispを '
    - node: br
    - node: text
      content: ご存じですか
  p21:
  - node: p
    children:
    - node: bold
