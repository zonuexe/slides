  p66:
  - kind: para
    text: LISPと変数スコープ
  - kind: list
    items:
    - 初期のLISP(LISP1〜MACLISP)は変数スコープの概念が未確立
    - レキシカルスコープかダイナミックスコープかが定かではない(!)
  - kind: para
    text: FUNARG問題
  - kind: list
    items:
    - 1975年に登場したSchemeではクロージャ(レキシカルスコープ)が導入
    - 1984年に登場したCommon Lispはレキシカルスコープが基本だが、
  - kind: para
    text: スペシャル変数として定義することでダイナミックスコープも使える
  p67: []
  p68:
  - kind: para
    text: (PHP)
  - kind: heading
    level: 1
    text: λx.λy.x
  - kind: para
    text: fn($x) => fn($y) => $x
  p69:
  - kind: para
    text: (Scheme)
  - kind: heading
    level: 1
    text: λx.λy.x
  - kind: para
    text: (lambda (x)
  - kind: para
    text: (lambda (y)
  - kind: para
    text: x))
  p70:
  - kind: para
    text: (Racket)
  - kind: heading
    level: 1
    text: λx.λy.x
  - kind: heading
    level: 2
    text: (λ (x) (λ(y) x))
  p71:
  - kind: para
    text: Lispでもラムダ計算できるが書きやすくはない
  p72:
  - kind: para
    text: 関数の純粋性を担保する仕組みが不足している
  p73:
  - kind: para
    text: とはいえ関数プログラミングの道具は揃っている
  p74:
  - kind: para
    text: その道具をどう使うかによってLispの文化がある
  p75:
  - kind: heading
    level: 1
    text: LISPとLisp系言語
  - kind: list
    items:
    - 「方言」と呼ばれるが、C言語とC#とJavaとJavaScriptくらい違う
    - 'Scheme:'
  - kind: para
    text: 比較的シンプルな言語仕様と衛生的マクロ
  - kind: list
    items:
    - 'Common Lisp: 機能豊富で処理系も多い'
    - Clojure：
  - kind: para
    text: 関数型重視でJVMで動く。Rich Hickeyの哲学
  - kind: list
    items:
    - 'Emacs Lisp:'
  - kind: para
    text: GNU Emacsで動く。Emacsそのもの
  p76: []
  p77:
  - kind: para
    text: 機能的にはどのLispでも他のスタイルで書ける
  p78: []
  p79: []
  p80: []
  p81:
  - kind: para
    text: 「初めての人のためのLISP [増補改訂版]」 より引用竹内郁雄著, 2010年3月9日 初版第1刷発行, 翔泳社刊(電子書籍版を底本とする)
  p82:
  - kind: para
    text: Lispは関数型言語ではないが能力と文化によって実現している
  p83:
  - kind: para
    text: ＿人人人人人人人＿＞ Lispは雑草 ＜‾Y^Y^Y^Y^Y^‾
  p84:
  - kind: heading
    level: 1
    text: Emacs Lisp
  - kind: para
    text: 広く普及したLispでありながらLispらしくないと敬遠された
  p85: []
  p86: []
  p87:
  - kind: para
    text: Emacs Lispの弱点
  - kind: list
    items:
    - クロージャと真正のレキシカルスコープがなかった
    - マクロで擬似的に再現したレキシカルスコープはあった
    - 末尾再帰最適化がない
    - カジュアルに副作用がある
    - 名前空間 (パッケージ) がない
    - リーダーマクロがない
    - Emacsと密結合している
  p88:
  - kind: heading
    level: 1
    text: Emacs Lisp (elisp)
  - kind: list
    items:
    - Richard Stallman (RMS)のこだわりのLisp方言
    - RMSが最近も機能追加しようとしている
    - 現存するメジャーな方言ではCommon Lisp寄りではあるが結構違う
    - Lisp Machine LispやGosling MLispの影響がある
    - Common Lisp風の機能はcl-libという標準ライブラリで同梱
  p89:
  - kind: para
    text: Emacs
  - kind: list
    items:
    - Lispを内蔵したエディタというべきか、
  - kind: para
    text: 言語処理系にエディタ機能がついているべきか
  - kind: list
    items:
    - init.el というファイルにLispで設定を書くが、
  - kind: para
    text: 初期化設定とEmacsで動かす機能の開発には境目がまったくない
  - kind: list
    items:
    - Lispが動く仮想的なLispマシンそのもの
    - Evilという互換性が極めて高いVimインターフェイスが実装されている
  p90:
  - kind: para
    text: Emacs Lispの弱点
  - kind: list
    items:
    - クロージャと真正のレキシカルスコープがなかった
    - マクロで擬似的に再現したレキシカルスコープはあった
    - 末尾再帰最適化がない
    - カジュアルに副作用がある
    - 名前空間 (パッケージ) がない
    - リーダーマクロがない
    - Emacsと密結合している
  p91: []
  p92:
  - kind: list
    items:
    - Emacsの検索には副作用があるが -p のついた述語関数で避けられる
    - (declare (side-effect-free t)) で純粋関数としてマークできる
  p93:
  - kind: heading
    level: 1
    text: Emacs Lisp
  - kind: para
    text: かつては不出来な末っ子扱い現在は必死に追い上げている
  p94:
  - kind: para
    text: Lispはマルチパラダイム
  p95:
  - kind: heading
    level: 1
    text: Lisp Machine
  - kind: para
    text: AIブームを牽引した専用機(1970年代後半-)
  p96:
  - kind: para
    text: そういう機械が40年以上前にあった
  p97:
  - kind: para
    text: 「Multi-Paradigm Language TAO」より引用https://www.nue.org/nue/tao/bitao/s001.html
  p98:
  - kind: para
    text: この写真は国産LISPマシンのELISなので本家Emacsの開発経緯とは直接関係ないのだが内蔵されたZENというEmacs風独自エディタの日本語入力メソッドKanzenが後のSKKに繋がりIME史に影響を及ぼしている
  p99: []
  p100: []
  p101: []
  p102:
  - kind: para
    text: TAO/ELISの特徴は現代Lispには受け継がれていない
  p103:
  - kind: para
    text: どのLispも多かれ少なかれマルチパラダイム
  p104:
  - kind: para
    text: Lispは関数型の枠に留まっていない
  p105:
  - kind: para
    text: Lispのパワーの根源はS式・マクロ
  p106: []
  p107: []
  p108: []
  p109:
  - kind: para
    text: Lisp一族の雑草のような生命力にご期待ください！
