  p28:
  - kind: para
    text: カッコだらけの構文 (S式)
  - kind: list
    items:
    - (a b c) のように並べたリストを構文の基本単位とする
    - 式と文の区別はない。全てが式。
    - このリストによるコードをS-expressionと呼ぶ
    - 日本語ではS式 (またはS表現とも)
    - Lisp族の言語の構文に基礎であるほか、
  - kind: para
    text: WebAssembly テキスト形式 (.wat) でも採用されている
  p29:
  - kind: para
    text: 結構ひとによって印象が違う言語だと思う
