  - node: p
    children:
    - node: text
      content: 'Lispでも '
    - node: br
    - node: text
      content: 'ラムダ計算できるが '
    - node: br
    - node: text
      content: 書きやすくはない
  p72:
  - node: p
    children:
    - node: text
