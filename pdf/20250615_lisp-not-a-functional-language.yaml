  - node: p
    children:
    - node: text
      content: '単純型なしλ計算は チューリング完全で '
    - node: br
    - node: text
      content: あることが知られている
  p52:
  - node: p
    children:
    - node: text
      content: '関数と適用しかないが '
    - node: br
    - node: text
      content: 工夫して制御構造も データ構造も作れる
  p53:
  - node: p
    children:
    - node: text
      content: 'こういう積み重ねで 現代の関数型っぽい '
    - node: br
    - node: text
      content: 要素が整理された
  p54:
  - node: p
    children:
    - node: text
      content: 'レキシカルスコープとか 不変性とかカリー化とか '
    - node: br
    - node: text
      content: 型推論とか代数的データ型
    - node: br
    - node: text
      content: 'とか遅延評価とかモナドとか '
    - node: br
    - node: text
      content: 関数合成とか参照透過とか
  p55:
  - node: p
    children:
    - node: text
      content: 'で、Lispはどういう '
    - node: br
    - node: text
      content: 関数型言語なの？
