  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3: []
  p4: []
  p5: []
  p6:
  - kind: heading
    level: 1
    text: 私とλ
  - kind: list
    items:
    - プログラミング苦手なのでいろんな言語をつまみぐいしてきました
    - 2010年… 魔法言語 リリカル☆Lispに出会う
    - 2011年… 「β簡約！λカ娘」(同人誌)を読む
  - kind: para
    text: アルバイト先のF#マスターに単純型なしラムダ計算を教わる
  - kind: list
    items:
    - 2012年… SICPを解いてSchemeをちょっとかじる
    - 2013年… Emacs Lispパッケージをごりごり書きはじめる
  p7:
  - kind: heading
    level: 1
    text: 楽しみましたか？
  p8:
  - kind: heading
    level: 1
    text: Scott Wlaschinさんの招待講演、最高でしたね…
  p9:
  - kind: para
    text: 関数型言語使ってますか？
  p10:
  - kind: para
    text: 関数型プログラミングしてますか？
  p11:
  - kind: para
    text: みなさまそれぞれの「関数型」観があると思います
  p12:
  - kind: para
    text: map/reduceが使えたら関数型？
  p13:
  - kind: heading
    level: 1
    text: λ関数型言語とはλ (私の偏見に基く認識)
  - kind: para
    text: C言語
  - kind: para
    text: Python
  - kind: para
    text: Lisp
  - kind: para
    text: 動的／静的の壁
  - kind: para
    text: ML系
  - kind: para
    text: Haskell
  - kind: list
    items:
    - 関数定義ができれば関数型言語だよ派
    - ファーストクラスの関数抽象があれば関数型言語だよ派
    - 標準ライブラリで高階関数(map/reduce)が扱えればいいよ派
    - 代数的データ型が扱えない言語は関数型言語じゃないよ派
    - 型推論の完全性がある静的型付き言語が関数型だよ派
    - 関数型というのは純粋関数型のことだよ派
    - モナディックな表示的意味論を持つ言語だよ派
  p14:
  - kind: para
    text: 日本人も漢字使ってるし中国語読めるでしょ？
  p15:
  - kind: para
    text: 関数型得意だしLisp書けるでしょ？
  p16:
  - kind: para
    text: いやいや…
  - kind: para
    text: 厳しい…
  p17:
  - kind: para
    text: それくらい「関数型」アプローチは多様
  p18:
  - kind: para
    text: Lispで「関数プログラミング」してますか？
  p19:
