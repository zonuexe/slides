  - kind: list
    items:
    - 関数定義ができれば関数型言語だよ派
    - ファーストクラスの関数抽象があれば関数型言語だよ派
    - 標準ライブラリで高階関数(map/reduce)が扱えればいいよ派
    - 代数的データ型が扱えない言語は関数型言語じゃないよ派
    - 型推論の完全性がある静的型付き言語が関数型だよ派
    - 関数型というのは純粋関数型のことだよ派
    - モナディックな表示的意味論を持つ言語だよ派
  p57:
