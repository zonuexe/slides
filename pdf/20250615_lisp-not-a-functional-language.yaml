    - node: text
      content: より引用
  p22:
  - node: p
    children:
    - node: text
      content: '1958年登場の言語 '
    - node: br
    - node: text
      content: (現役では最古級)
  p23:
  - node: p
    children:
    - node: text
      content: C言語
  - node: p
    children:
    - node: text
      content: puts("foo")
  p24:
  - node: p
    children:
    - node: text
      content: Ruby
  - node: p
    children:
    - node: text
      content: puts "foo"
  p25:
  - node: p
    children:
    - node: text
      content: Lisp
  - node: p
    children:
    - node: text
      content: (puts "foo")
  p26:
  - node: p
    children:
    - node: text
      content: (imaginary)
  - node: p
    children:
    - node: text
      content: (((((LISP)))))
  p27:
  - node: p
    children:
    - node: text
      content: (((カッコが多い)))
  p28:
  - node: p
    children:
    - node: text
      content: カッコだらけの構文
  - node: p
    children:
    - node: text
      content: ' (S式)'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: (a b c) のように並べたリストを構文の基本単位とする
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 式と文の区別はない。全てが式。
    - node: li
      children:
      - node: text
        content: このリストによるコードをS-expressionと呼ぶ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 日本語ではS式 (またはS表現とも)
    - node: li
      children:
      - node: text
        content: Lisp族の言語の構文に基礎であるほか、
      - node: br
      - node: text
        content: WebAssembly テキスト形式 (.wat) でも採用されている
  p29:
  - node: p
    children:
    - node: text
      content: '結構ひとによって '
    - node: br
    - node: text
      content: '印象が違う '
    - node: br
    - node: text
      content: 言語だと思う
  p30: []
  p31: []
  p32: []
  p33: []
  p34:
  - node: p
    children:
    - node: bold
