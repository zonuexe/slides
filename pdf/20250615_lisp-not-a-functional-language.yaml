  - node: p
    children:
    - node: text
      content: 'λx.λy.x '
    - node: br
    - node: text
      content: '(lambda (x)    (lambda (y) '
    - node: br
    - node: text
      content: '    x))'
  p70:
  - node: p
    children:
    - node: text
      content: (Racket)
  - node: p
    children:
    - node: text
      content: 'λx.λy.x '
    - node: br
    - node: text
      content: (λ (x) (λ(y) x))
