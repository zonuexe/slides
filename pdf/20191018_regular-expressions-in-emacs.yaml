text:
  p1:
  - kind: heading
    level: 1
    text: Emacsと正規表現
  - kind: para
    text: Regular expressions in Emacs
  - kind: para
    text: 'Regex Festa 2019-10-18 #regexfesta'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv事業本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: せっかくなので
  - kind: para
    text: PHPの話を先に
  p6:
  - kind: para
    text: PHPには複数の
  - kind: para
    text: 正規表現エンジンが
  - kind: para
    text: あります
  p7:
  - kind: para
    text: ereg
  - kind: para
    text: (POSIX ERE)
  - kind: para
    text: preg
  - kind: para
    text: (PCRE)
  - kind: para
    text: mb_ereg
  - kind: para
    text: (鬼車)
  p8:
  - kind: para
    text: PHP5系で廃止
  - kind: para
    text: ereg
  - kind: para
    text: (POSIX ERE)
  - kind: para
    text: preg
  - kind: para
    text: (PCRE)
  - kind: para
    text: mb_ereg
  - kind: para
    text: (鬼車)
  p9:
  - kind: para
    text: 現代のPHPでは
  - kind: para
    text: preg関数(PCRE)
  - kind: para
    text: が一般的
  p10:
  - kind: para
    text: PHPには正規表現
  - kind: para
    text: リテラルがない
  p11:
  - kind: para
    text: (そもそも複数エンジン
  - kind: para
    text: があるのでリテラルで
  - kind: para
    text: 特権扱いされると困る)
  p12:
  - kind: heading
    level: 1
    text: バックスラッシュのエスケープ
  - kind: para
    text: <?php
  - kind: para
    text: $subject = 'a\b';preg_match('/(?<bs>\\\\)/', $subject, $m);
  - kind: para
    text: var_dump($m['bs']);// string(1) "\"
  p13:
  - kind: heading
    level: 1
    text: デリミタの変更
  - kind: para
    text: <?php
  - kind: para
    text: $subject = 'https://example.com/';// Bad pattern preg_match('/^https:\/\/([.+])/i',
      $subject);
  - kind: para
    text: preg_match('@^https://([.+])@i', $subject);preg_match('#^https://([.+])#i',
      $subject);
  p14:
  - kind: para
    text: 関数形式だがコンパ
  - kind: para
    text: イル結果は内部的に
  - kind: para
    text: 保持されている
  p15:
  - kind: para
    text: PCRE関数はリクエ
  - kind: para
    text: ストをまたいでコンパ
  - kind: para
    text: イル結果が保持される
  p16:
  - kind: para
    text: PHPの話ここまで
  p17:
  - kind: para
    text: Emacs
  p18:
  - kind: para
    text: Emacsは正規表現
  - kind: para
    text: でできている
  p19:
  - kind: para
    text: 1. エディタの
  - kind: para
    text: 検索機能として
  p20:
  - kind: para
    text: 2. 構文ハイライト
  p21:
  - kind: para
    text: '出典: フリー百科事典『ウィキペディア（Wikipedia）』'
  - kind: para
    text: https://ja.wikipedia.org/wiki/正規表現
  - kind: para
    text: 最終更新 2019年7月9日 12:45 版
  p22:
  - kind: para
    text: '出典: フリー百科事典『ウィキペディア（Wikipedia）』'
  - kind: para
    text: https://ja.wikipedia.org/wiki/正規表現
  - kind: para
    text: 最終更新 2019年7月9日 12:45 版
  p23:
  - kind: para
    text: '出典: フリー百科事典『ウィキペディア（Wikipedia）』'
  - kind: para
    text: https://ja.wikipedia.org/wiki/正規表現
  - kind: para
    text: 最終更新 2019年7月9日 12:45 版
  p24:
  - kind: para
    text: これしか書いてない
  p25:
  - kind: para
    text: 基本正規表現とも
  - kind: para
    text: 拡張正規表現とも
  - kind: para
    text: 違う
  p26:
  - kind: para
    text: Emacsの正規表現は
  - kind: para
    text: NFAに分類される
  - kind: para
    text: (最小量指定子がある)
  p27:
  - kind: para
    text: 基本拡張Emacs
  - kind: para
    text: グループ\(regexp\)(regexp)\(regexp\)
  - kind: para
    text: 繰り返し\{n,m}{n,m}\{n,m}
  - kind: para
    text: 文字クラス[abc][abc][abc]
  - kind: para
    text: 1回以上++
  - kind: para
    text: 選言|\|
  p28:
  - kind: para
    text: Perl Emacs
  - kind: para
    text: 先頭・末尾\A \z\` \'
  - kind: para
    text: 単語構成文字
  - kind: para
    text: ／単語境界\w \b\w \b
  - kind: para
    text: 空白文字\s[[:space:]]
  - kind: para
    text: \s-
  p29:
  - kind: para
    text: 僕の知ってる
  - kind: para
    text: 正規表現と違う！
  p30:
  - kind: para
    text: シンタックス
  - kind: para
    text: テーブル
  p31:
  - kind: para
    text: メジャーモードごと
  - kind: para
    text: に文字の意味を
  - kind: para
    text: 定義できる機能
  p32:
  - kind: para
    text: 言語ごとにシンボル
  - kind: para
    text: 構成文字は異なる
  p33:
  - kind: para
    text: Lispでは foo-bar
  - kind: para
    text: は一つのシンボル
  - kind: para
    text: (変数名や関数名になる)
  p34:
  - kind: para
    text: Cなどの言語では
  - kind: para
    text: foo-barは別シンボル
  - kind: para
    text: (foo - bar)
  p35:
  - kind: para
    text: その構文情報
  - kind: para
    text: (syntax table)
  - kind: para
    text: を
  - kind: para
    text: 正規表現から使える
  p36:
  - kind: para
    text: 逆に言うと正規表現の
  - kind: para
    text: マッチ結果はシンタック
  - kind: para
    text: ステーブルに依存する
  p37: []
  p38:
  - kind: para
    text: で、実際どうなの
  p39:
  - kind: para
    text: 文脈によって
  - kind: para
    text: エスケープが
  - kind: para
    text: (ように見える)
  - kind: para
    text: 変わってる
  p40: []
  p41: []
  p42:
  - kind: para
    text: Emacsのメジャー
  - kind: para
    text: モード(言語モード)の
  - kind: para
    text: 実装には大量の正規表
  - kind: para
    text: 現を書く必要がある
  p43: []
  p44:
  - kind: para
    text: これは読みにくい
  p45:
  - kind: para
    text: でもご安心ください
  p46:
  - kind: para
    text: rxという正規表現
  - kind: para
    text: 組み立てDSLがある
  p47:
  - kind: para
    text: 文字列rx
  - kind: para
    text: グループ\(regexp\)(group "regexp")
  - kind: para
    text: 繰り返し\{n,m}(repeat n m pattern)
  - kind: para
    text: 文字クラス[abc](in "abc")
  - kind: para
    text: 1回以上+(+ pattern)
  - kind: para
    text: 選言\|(or a b)
  p48:
  - kind: para
    text: 文字列rx
  - kind: para
    text: 先頭・末尾\` \'string-start
  - kind: para
    text: string-end
  - kind: para
    text: 単語構成文字
  - kind: para
    text: ／単語境界\w \b wordchar word-boundary
  - kind: para
    text: 空白文字[[:space:]]
  - kind: para
    text: \s-
  - kind: para
    text: space(syntax whitespace)
  p49: []
  p50:
  - kind: para
    text: ツールはいろいろ
  - kind: para
    text: 揃ってる
