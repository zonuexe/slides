text:
  p1:
  - kind: heading
    level: 1
    text: 5分でわかるPHPの型システム
  - kind: heading
    level: 2
    text: Introducing PHP's type system in 5 minutes
  - kind: heading
    level: 3
    text: にゃんだーすわん @tadsan / USAMI Kenta うさみけんた
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: para
    text: ヾ(〃＞＜)ﾉﾞ
  - kind: list
    items:
    - ピクシブ株式会社 pixiv事業本部 (2012～)
    - pixivやピクシブ百科事典などを担当
    - TechFeed公認エキスパートNo.27
    - PHPカンファレンス / PHPerKaigi スタッフ
    - Emacs PHP Modeメンテナ
    - phpusers-ja/Emacs JPなどのコミュニティ
    - spcamp 2010 プログラミング言語組
  p3:
  - kind: para
    text: PHPは簡単な言語だから上級テクニックなんてないよ笑
  p4:
  - kind: heading
    level: 1
    text: PHPは簡単な言語だから
  - kind: heading
    level: 1
    text: 上級テクニックなんてないよ笑
  - kind: para
    text: 言語が簡単なので素朴に書くとエントロピーが無限に増大する
  p5:
  - kind: para
    text: PHPの型にどのような印象を持っていますか？
  p6:
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  - kind: para
    text: PHPについてのパブリックイメージ
  p7:
  - kind: para
    text: ？
  - kind: para
    text: 脆弱性 ゆるふわ 弱い型 動的クソザコ 型なし 意味不明 弱い自動変換 貧弱 Perlっぽい 適当
  - kind: para
    text: PHPについての認識は概ね間違い
  p8:
  - kind: para
    text: PHPの値は型タグと共用体の組に過ぎませんが何か？
  p9:
  - kind: heading
    level: 1
    text: https://github.com/php/php-src/blob/php-8.1.0/Zend/zend_types.h
  p10:
  - kind: heading
    level: 1
    text: https://github.com/php/php-src/blob/php-8.1.0/Zend/zend_types.h
  p11:
  - kind: heading
    level: 1
    text: PHPの値は型タグと共用体の
  - kind: heading
    level: 1
    text: 組に過ぎませんが何か？
  - kind: para
    text: 過言です
  p12:
  - kind: para
    text: 極論はさておいてPHPランタイムの型はこれだけ
  p13:
  - kind: para
    text: 言語処理系の内部実装について「Rubyソースコード完全解説」が参考になる
  p14:
  - kind: para
    text: bool int float string
  - kind: para
    text: array object null resource (callable iterable mixed)
  - kind: para
    text: JSONで扱える型 + 特殊な型がある
  p15:
  - kind: heading
    level: 1
    text: 無限の可能性を持つ
  - kind: heading
    level: 1
    text: array
  - kind: para
    text: Pythonでのlist/dict RubyのArray/Hashを併せ持つ
  p16:
  - kind: heading
    level: 1
    text: ユニオン型
  - kind: heading
    level: 1
    text: A|B
  - kind: para
    text: AまたはB(複雑な式は書けない)
  p17:
  - kind: heading
    level: 1
    text: 交叉型
  - kind: heading
    level: 1
    text: A&B
  - kind: para
    text: AおよびB(複雑な式は書けない)
  p18:
  - kind: heading
    level: 1
    text: null許容型
  - kind: heading
    level: 1
    text: ?A
  - kind: para
    text: Aまたはnullデフォルトで許容しない
  p19:
  - kind: heading
    level: 1
    text: 謎のPHP用語
  - kind: heading
    level: 1
    text: mixed
  - kind: para
    text: いわゆるany(PHPマニュアルの記述に由来)
  p20:
  - kind: heading
    level: 1
    text: 型宣言できない特殊型
  - kind: heading
    level: 1
    text: resource
  - kind: para
    text: ファイルポインタなど(徐々にobjectに置き換え)
  p21:
  - kind: para
    text: 型はランタイムに確実に保証される
  p22:
  - kind: para
    text: 整数ではない文字列は型宣言通りに変換
  p23:
  - kind: para
    text: 整数ではない文字列はTypeErrorになる
  p24:
  - kind: para
    text: ファイル単位でstrict_types=1指定で自動変換を抑制
  p25:
  - kind: para
    text: どちらにせよ受け取った関数の側ではintであることが保証される
  p26:
  - kind: para
    text: PHPでは実行時に型情報がとれる
  p27:
  - kind: para
    text: ユニオン型宣言で適切に変換される
  p28:
  - kind: para
    text: classとinterfaceをユーザー定義型として利用可能
  p29:
  - kind: heading
    level: 1
    text: 型宣言にクラス名を指定できる
  p30:
  - kind: heading
    level: 1
    text: インターフェイスも指定できる
  p31:
  - kind: para
    text: void型宣言で戻り値を返さないことを明示できる= その関数には副作用がある
  p32:
  - kind: para
    text: never型宣言でメソッドが正常終了しないことを宣言= 異常状態が後続に漏れない
  p33:
  - kind: para
    text: WSGI/Rack/PSGI相当のWebアプリケーションのI/Fも型宣言ベースで定義されている
  p34:
  - kind: para
    text: MIT License - Copyright (c) 2018 PHP-FIG https://github.com/php-fig/http-factory/blob/1.0.1/src/ResponseFactoryInterface.php
  p35:
  - kind: heading
    level: 1
    text: 型はランタイムに
  - kind: heading
    level: 1
    text: 確実に保証される
  - kind: para
    text: それはわかった
  p36:
  - kind: para
    text: 型が実行時に保証される点でPHPは他の動的言語とは一線を画しているといえる
  p37:
  - kind: heading
    level: 1
    text: 要するにPHPは
  - kind: para
    text: statically typed
  - kind: heading
    level: 1
    text: 静的型付き…ってコト！？
  p38:
  - kind: heading
    level: 1
    text: 型なしはどこから来るの？
  p39:
  - kind: para
    text: 動的言語を型なしと呼ぶのも別に誹謗中傷というわけではない
  p40:
  - kind: para
    text: PHPではURLクエリをグローバル変数から取り出せる
  p41:
  - kind: para
    text: いろんなところから湧き出す型の特定できないデータ
  p42:
  - kind: para
    text: arrayは無限の可能性を秘める(悪い意味で)
  p43:
  - kind: para
    text: 扱う対象が複数になったのに型に反映されない
  p44:
  - kind: para
    text: PHPの組み込みの型機能ではどんなに型推論しても静的に型が定まらない
  p45:
  - kind: heading
    level: 1
    text: arrayの中に何が
  - kind: heading
    level: 1
    text: 入ってるのかわからん
  - kind: para
    text: https://www.php.net/array_map
  p46:
  - kind: para
    text: 几帳面に型宣言だけを追うと人間にはわかる型も機械は理解できない
  p47:
  - kind: para
    text: 無限の可能性を秘めたarrayを放置するとコード全体のエントロピーが増大しプロジェクトは熱的死を迎える
  p48:
  - kind: para
    text: ランタイムに保証されない型を書こう
  p49:
  - kind: heading
    level: 1
    text: https://phpstan.org/
  p50:
  - kind: heading
    level: 1
    text: http://psalm.dev/
  p51:
  - kind: heading
    level: 1
    text: https://www.jetbrains.com/ja-jp/phpstorm/
  p52:
  - kind: para
    text: '/** */ のブロックに型を書くarray{key: type} で構造体のような型を記述できる'
  - kind: heading
    level: 1
    text: array-shapes
  p53:
  - kind: para
    text: array<key, value>list<value> のように型を書ける
  - kind: heading
    level: 1
    text: array<T>
  p54:
  - kind: para
    text: 型パラメータで戻り値を可変にできる
  - kind: heading
    level: 1
    text: '@template'
  p55:
  - kind: para
    text: ツール互換性のために@phpstan- を付けてもよい
  - kind: heading
    level: 1
    text: '@template'
  p56:
  - kind: para
    text: アプリケーションのエントロピーを減少させて快適に開発しよう
