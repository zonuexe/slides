  p17:
  - node: p
    children:
    - node: text
      content: PHPと型
  - node: p
    children:
    - node: text
      content: 'いわゆる「動的型」の言語 '
  - node: p
    children:
    - node: text
      content: 'PHP処理系は変数に型がない '
  - node: p
    children:
    - node: text
      content: '変数にはどんな値も代入可能 '
  - node: p
    children:
    - node: text
      content: PHP7の型には二種類の
  - node: p
    children:
    - node: text
      content: モード(strict_types)がある
  p18:
  - node: p
    children:
    - node: text
      content: PHPの型の種類
  - node: p
    children:
    - node: text
      content: 'スカラー型 '
  - node: p
    children:
    - node: text
      content: '複合型 '
  - node: p
    children:
    - node: text
      content: '特殊型 '
  - node: p
    children:
    - node: text
      content: ドキュメント上の擬似型
  p19:
  - node: p
    children:
    - node: text
      content: スカラー型
  - node: p
    children:
    - node: text
      content: '論理型  true, false '
  - node: p
    children:
    - node: text
      content: ' (bool)'
  - node: p
    children:
    - node: text
      content: '整数型  1, 2, 3... '
  - node: p
    children:
    - node: text
      content: ' (int)'
  - node: p
    children:
    - node: text
      content: '浮動小数点数  1.0,... '
    - node: br
    - node: text
      content: ' (ﬂoat)'
  - node: p
    children:
    - node: text
      content: 文字列型  "abc"
  - node: p
    children:
    - node: text
      content: ' (string)'
  p20:
  - node: p
    children:
    - node: text
      content: 複合型
  - node: p
    children:
    - node: text
      content: '配列型 (array) '
  - node: p
    children:
    - node: text
      content: 'オブジェクト型 (object) '
  - node: p
    children:
    - node: text
      content: '呼び出し可能型 (callable) '
  - node: p
    children:
    - node: text
      content: 反復型 (iterable)
  p21:
  - node: p
    children:
    - node: text
      content: 特殊型
  - node: p
    children:
    - node: text
      content: 'ヌル型 (null) '
  - node: p
    children:
    - node: text
      content: 'リソース型 (resource) '
  - node: p
    children:
    - node: text
      content: '型ではないが返り値に書ける '
  - node: p
    children:
    - node: text
      content: void 返り値がないこと
  p22:
  - node: p
    children:
    - node: text
      content: ドキュメント上の擬似型
  - node: p
    children:
    - node: text
      content: 'mixed 多様な型(複数) '
  - node: p
    children:
    - node: text
      content: 'number int|false '
  - node: p
    children:
    - node: text
      content: その他ツール固有の型表記
  p23:
  - node: p
    children:
    - node: text
      content: declare(strict_types)
  - node: p
    children:
    - node: text
      content: 'ブロック(ファイル)単位でディレ クティブを設定するための構文 '
    - node: br
    - node: text
      content: デフォルト(無指定時)は
  - node: p
    children:
    - node: text
      content: 'strict_types=0 '
    - node: br
    - node: text
      content: 引数と返り値についてキャス トとエラーの振舞に影響(後述)
  p24:
  - node: p
    children:
    - node: text
      content: declare(strict_types=0)
  - node: p
    children:
    - node: text
      content: 引数や返り値のスカラー型宣 言と実際の値が一致しなかっ たとき、変換可能な値なら暗
    - node: br
    - node: text
      content: '黙的に型変換 '
    - node: br
    - node: text
      content: オブジェクトが暗黙的にキャ
    - node: br
    - node: text
      content: ストされることはない
  p25:
  - node: p
    children:
    - node: text
      content: declare(strict_types=1)
  - node: p
    children:
    - node: text
      content: 引数や返り値の宣言と実際の
    - node: br
    - node: text
      content: 値が一致しなかったとき
    - node: br
    - node: text
      content: 'TypeErrorが発生 '
    - node: br
    - node: text
      content: スカラー型・その他の型・
  - node: p
    children:
    - node: text
      content: クラス/インターフェイスで
    - node: br
    - node: text
      content: 挙動に違いはない
  p26:
  - node: p
    children:
    - node: text
      content: PHPのどこに型を書けるか
  - node: p
    children:
    - node: text
      content: '引数の型宣言 '
  - node: p
    children:
    - node: text
      content: '返り値の型宣言 '
  - node: p
    children:
    - node: text
      content: PHPDoc
  p27:
  - node: p
    children:
    - node: text
      content: 引数の型宣言
  - node: p
    children:
    - node: text
      content: '関数/メソッドの仮引数リスト '
  - node: p
    children:
    - node: bold
      content: function x(string $s, array $a)
    - node: br
    - node: text
      content: 'のように書ける '
  - node: p
    children:
    - node: text
      content: 書けるのは一部の型・擬似型 とクラス・インターフェイス
  p28:
  - node: p
    children:
    - node: text
      content: 返り値の型宣言
  - node: p
    children:
    - node: text
      content: '仮引数リストの後に書ける '
  - node: p
    children:
    - node: text
      content: 'のように書ける '
  - node: p
    children:
    - node: bold
      content: function y():int
    - node: br
    - node: text
      content: '基本は引数と同様 '
    - node: br
    - node: text
      content: '値を返さない場合に : void と'
    - node: br
    - node: text
      content: 書ける
  p29:
  - node: p
    children:
    - node: text
      content: 型宣言のわかりにくい仕様
  - node: p
    children:
    - node: text
      content: '書ける型と書けない型がある '
  - node: p
    children:
    - node: text
      content: 'self, array, callable, bool, '
    - node: br
    - node: text
      content: 'ﬂoat, int, string, '
    - node: br
    - node: text
      content: 'iterable , object  '
  - node: p
    children:
    - node: text
      content: (7.1+) (7.2+)
  - node: p
    children:
    - node: text
      content: 'だけが特別な意味を持つ '
    - node: br
    - node: text
      content: それ以外はクラス/インターフェイス
  p30:
  - node: p
    children:
    - node: text
      content: 型宣言に書けない型
  - node: p
    children:
    - node: text
      content: integer, boolean, double
  - node: p
    children:
    - node: text
      content: 'などの型の別名は記述不可 '
    - node: br
    - node: text
      content: ちなみにstrはstringの別名… ではないので覚えておいてく
    - node: br
    - node: text
      content: 'ださい (型宣言に限らず) '
    - node: br
    - node: text
      content: resourceは型宣言に書けない mixedやnumberも書けない
  p31:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈記法
  - node: p
    children:
    - node: text
      content: クラスやメソッドの上にDoc Commentを書くことで型を
    - node: br
    - node: text
      content: '記述できる '
    - node: br
    - node: text
      content: あくまでコメントなのでコー ドの実行に影響を及ぼさず、 IDEやツールの解析材料となる
  p32:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈記法
  - node: p
    children:
    - node: text
      content: 型宣言では実現できない型が
    - node: br
    - node: text
      content: '付けられる '
    - node: br
    - node: text
      content: 'マジックメソッド/プロパティ '
    - node: br
    - node: text
      content: ユニオン型 Hoge|Fuga 配列要素の型付け int[]
  p33:
  - node: p
    children:
    - node: text
      content: PSR-5 (Draft)
  - node: p
    children:
    - node: text
      content: array<string>や
  - node: p
    children:
    - node: text
      content: ArrayObject<int,string>と
    - node: br
    - node: text
      content: '書ける '
    - node: br
    - node: text
      content: ……が、PhpStormは対応し
    - node: br
    - node: text
      content: 'てない '
    - node: br
    - node: text
      content: ArrayObject|string[]で代用
  p34:
  - node: p
    children:
    - node: text
      content: ここまでは
  - node: p
    children:
    - node: text
      content: 基本的な話
  p35:
  - node: p
    children:
    - node: text
      content: 型付けと型解析の
  - node: p
    children:
    - node: text
      content: 考えかた
  p36:
  - node: p
    children:
    - node: text
      content: 関数がどのような引数
    - node: br
    - node: text
      content: を期待しどんな値を
  - node: p
    children:
    - node: text
      content: 返すのか明示したい
  p37:
  - node: p
    children:
    - node: text
      content: オブジェクトのメソッド
    - node: br
    - node: text
      content: やプロパティが適切に
  - node: p
    children:
    - node: text
      content: 補完されると気持ち良い
  p38:
  - node: p
    children:
    - node: text
      content: プログラムが
  - node: p
    children:
    - node: text
      content: 間違ってることを
  - node: p
    children:
    - node: text
      content: 実行前に検証したい
  p39:
  - node: p
    children:
    - node: text
      content: ツールを
  - node: p
    children:
    - node: text
      content: 導入しよう
  p40:
  - node: p
    children:
    - node: text
      content: 現行の高度な静的解析ツール
  - node: p
    children:
    - node: text
      content: 'PhpStorm (IDE) '
  - node: p
    children:
    - node: text
      content: 'Phan '
  - node: p
    children:
    - node: text
      content: 'PHPStan '
  - node: p
    children:
    - node: text
      content: Psalm
  p41: []
  p42: []
  p43: []
  p44:
  - node: p
    children:
    - node: text
      content: PhpStorm
  - node: p
    children:
    - node: text
      content: 'よいところ '
    - node: br
    - node: text
      content: '導入が最も簡単 '
    - node: br
    - node: text
      content: '十分な精度のエラー検出 '
    - node: br
    - node: text
      content: 'よくないところ '
    - node: br
    - node: text
      content: エラーの列挙ができないので CIのフローに組み込めない
  p45:
  - node: p
    children:
    - node: text
      content: Phan
  - node: p
    children:
    - node: text
      content: 'よいところ '
    - node: br
    - node: text
      content: '導入は比較的簡単 '
    - node: br
    - node: text
      content: 'とても高い精度のエラー検出 '
    - node: br
    - node: text
      content: 'よくないところ '
    - node: br
    - node: text
      content: 大規模プロジェクトでは解析
    - node: br
    - node: text
      content: に時間がかかる
  p46:
  - node: p
    children:
    - node: text
      content: Phanのすごいところ
  - node: p
    children:
    - node: text
      content: '連想配列にも型が付けられる '
    - node: br
    - node: text
      content: 'array-shapes記法 '
    - node: br
    - node: text
      content: 自動で型推論もしてくれるが 解析がすごすぎてレガシーで 長大な関数から恐ろしい型が
    - node: br
    - node: text
      content: 吐かれたりする
  p47:
  - node: p
    children:
    - node: text
      content: PHPStan
  - node: p
    children:
    - node: text
      content: 'よいところ '
    - node: br
    - node: text
      content: '実行時情報を使用し高速 高い精度のエラー検出 '
    - node: br
    - node: text
      content: 'よくないところ '
    - node: br
    - node: text
      content: Composer以外の依存関係 があると導入にコツが要る
  p48:
  - node: p
    children:
    - node: text
      content: Psalm
  - node: p
    children:
    - node: text
      content: 'よいところ '
    - node: br
    - node: text
      content: '独自の引数アサーション 高い精度のエラー検出 '
    - node: br
    - node: text
      content: 'よくないところ '
    - node: br
    - node: text
