text:
  p1:
  - kind: heading
    level: 2
    text: PHP
  - kind: heading
    level: 1
    text: 型検査･夢と理想と現実
  - kind: heading
    level: 3
    text: 'PHP typing: the gap between ideal and reality.'
  - kind: heading
    level: 3
    text: 補訂公開版
  - kind: para
    text: '[2019-06-29]PHPCon Fukuoka 2019'
  - kind: para
    text: 'FFBHall #phpconfuk'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv事業本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4:
  - kind: para
    text: おしながき
  p5:
  - kind: para
    text: おしながき
  - kind: para
    text: 【はやわかり】 PHPと型
  - kind: para
    text: 型付けと型解析の考えかた
  - kind: para
    text: 型と実装上の問題
  p6:
  - kind: para
    text: 最初から結論
  p7:
  - kind: para
    text: PHPの型付けは難しい
  p8:
  - kind: para
    text: PHPのスカラー型宣言は難しい
  p9:
  - kind: para
    text: PHP7だからと言って
  - kind: para
    text: ､
  - kind: para
    text: やみくもにstringやint
  - kind: para
    text: などの型宣言を書くのは
  - kind: para
    text: おすすめできない
  p10:
  - kind: para
    text: 思考停止での
  - kind: para
    text: strict_types=1
  - kind: para
    text: 指定
  - kind: para
    text: もおすすめできない
  p11:
  - kind: para
    text: コーディングには
  - kind: para
    text: PhpStormやPHPStan
  - kind: para
    text: を活用しましょう
  p12:
  - kind: para
    text: 静的解析で
  - kind: para
    text: CIしましょう
  p13:
  - kind: para
    text: 型宣言だけではなく
  - kind: para
    text: PHPDoc/PSR-5
  - kind: para
    text: の型も活用しよう
  p14:
  - kind: para
    text: 型の記法だけでは解決できないことがあるので実装を工夫しよう
  p15:
  - kind: para
    text: そんな話を
  - kind: para
    text: します
  p16:
  - kind: para
    text: 【はやわかり】
  - kind: para
    text: PHPと型
  p17:
  - kind: para
    text: PHPと型
  - kind: para
    text: いわゆる「動的型」の言語
  - kind: para
    text: PHP処理系は変数に型がない
  - kind: para
    text: 変数にはどんな値も代入可能
  - kind: para
    text: PHP7の型には二種類のモード(strict_types)がある
  p18:
  - kind: para
    text: PHPの型の種類
  - kind: para
    text: スカラー型
  - kind: para
    text: 複合型
  - kind: para
    text: 特殊型
  - kind: para
    text: ドキュメント上の擬似型
  p19:
  - kind: para
    text: スカラー型
  - kind: para
    text: 論理型 (bool) true, false
  - kind: para
    text: 整数型 (int) 1, 2, 3...
  - kind: para
    text: 浮動小数点数 (ﬂoat) 1.0,...
  - kind: para
    text: 文字列型 (string) "abc"
  p20:
  - kind: para
    text: 複合型
  - kind: para
    text: 配列型 (array)
  - kind: para
    text: オブジェクト型 (object)
  - kind: para
    text: 呼び出し可能型 (callable)
  - kind: para
    text: 反復型 (iterable)
  p21:
  - kind: para
    text: 特殊型
  - kind: para
    text: ヌル型 (null)
  - kind: para
    text: リソース型 (resource)
  - kind: para
    text: 型ではないが返り値に書ける
  - kind: para
    text: void 返り値がないこと
  p22:
  - kind: para
    text: ドキュメント上の擬似型
  - kind: para
    text: mixed 多様な型(複数)
  - kind: para
    text: number int|false
  - kind: para
    text: その他ツール固有の型表記
  p23:
  - kind: para
    text: declare(strict_types)
  - kind: para
    text: ブロック(ファイル)単位でディレクティブを設定するための構文
  - kind: para
    text: デフォルト(無指定時)はstrict_types=0
  - kind: para
    text: 引数と返り値についてキャストとエラーの振舞に影響(後述)
  p24:
  - kind: para
    text: declare(strict_types=0)
  - kind: para
    text: 引数や返り値のスカラー型宣言と実際の値が一致しなかったとき、変換可能な値なら暗黙的に型変換
  - kind: para
    text: オブジェクトが暗黙的にキャストされることはない
  p25:
  - kind: para
    text: declare(strict_types=1)
  - kind: para
    text: 引数や返り値の宣言と実際の値が一致しなかったときTypeErrorが発生
  - kind: para
    text: スカラー型・その他の型・クラス/インターフェイスで挙動に違いはない
  p26:
  - kind: para
    text: PHPのどこに型を書けるか
  - kind: para
    text: 引数の型宣言
  - kind: para
    text: 返り値の型宣言
  - kind: para
    text: PHPDoc
  p27:
  - kind: para
    text: 引数の型宣言
  - kind: para
    text: 関数/メソッドの仮引数リスト
  - kind: para
    text: function x(string $s, array $a)
  - kind: para
    text: のように書ける
  - kind: para
    text: 書けるのは一部の型・擬似型とクラス・インターフェイス
  p28:
  - kind: para
    text: 返り値の型宣言
  - kind: para
    text: 仮引数リストの後に書ける
  - kind: para
    text: function y():intのように書ける
  - kind: para
    text: 基本は引数と同様
  - kind: para
    text: '値を返さない場合に : void と書ける'
  p29:
  - kind: para
    text: 型宣言のわかりにくい仕様
  - kind: para
    text: 書ける型と書けない型がある
  - kind: para
    text: self, array, callable, bool,ﬂoat, int, string,iterable(7.1+), object(7.2+)だけが特別な意味を持つ
  - kind: para
    text: それ以外はクラス/インターフェイス
  p30:
  - kind: para
    text: 型宣言に書けない型
  - kind: para
    text: integer, boolean, doubleなどの型の別名は記述不可
  - kind: para
    text: ちなみにstrはstringの別名…ではないので覚えておいてください (型宣言に限らず)
  - kind: para
    text: resourceは型宣言に書けない
  - kind: para
    text: mixedやnumberも書けない
  p31:
  - kind: para
    text: PHPDocの型注釈記法
  - kind: para
    text: クラスやメソッドの上にDoc Commentを書くことで型を記述できる
  - kind: para
    text: あくまでコメントなのでコードの実行に影響を及ぼさず、IDEやツールの解析材料となる
  p32:
  - kind: para
    text: PHPDocの型注釈記法
  - kind: para
    text: 型宣言では実現できない型が付けられる
  - kind: para
    text: マジックメソッド/プロパティ
  - kind: para
    text: ユニオン型 Hoge|Fuga
  - kind: para
    text: 配列要素の型付け int[]
  p33:
  - kind: para
    text: PSR-5 (Draft)
  - kind: para
    text: array<string>やArrayObject<int,string>と書ける
  - kind: para
    text: ……が、PhpStormは対応してない
  - kind: para
    text: ArrayObject|string[]で代用
  p34:
  - kind: para
    text: ここまでは基本的な話
  p35:
  - kind: para
    text: 型付けと型解析の考えかた
  p36:
  - kind: para
    text: 関数がどのような引数を期待しどんな値を返すのか明示したい
  p37:
  - kind: para
    text: オブジェクトのメソッドやプロパティが適切に補完されると気持ち良い
  p38:
  - kind: para
    text: プログラムが間違ってることを実行前に検証したい
  p39:
  - kind: para
    text: ツールを
  - kind: para
    text: 導入しよう
  p40:
  - kind: para
    text: 現行の高度な静的解析ツール
  - kind: para
    text: PhpStorm (IDE)
  - kind: para
    text: Phan
  - kind: para
    text: PHPStan
  - kind: para
    text: Psalm
  p41: []
  p42: []
  p43: []
  p44:
  - kind: para
    text: PhpStorm
  - kind: para
    text: よいところ
  - kind: para
    text: 導入が最も簡単
  - kind: para
    text: 十分な精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: エラーの列挙ができないのでCIのフローに組み込めない
  p45:
  - kind: para
    text: Phan
  - kind: para
    text: よいところ
  - kind: para
    text: 導入は比較的簡単
  - kind: para
    text: とても高い精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: 大規模プロジェクトでは解析に時間がかかる
  p46:
  - kind: para
    text: Phanのすごいところ
  - kind: para
    text: 連想配列にも型が付けられる
  - kind: para
    text: array-shapes記法
  - kind: para
    text: 自動で型推論もしてくれるが解析がすごすぎてレガシーで長大な関数から恐ろしい型が吐かれたりする
  p47:
  - kind: para
    text: PHPStan
  - kind: para
    text: よいところ
  - kind: para
    text: 実行時情報を使用し高速
  - kind: para
    text: 高い精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: Composer以外の依存関係があると導入にコツが要る
  p48:
  - kind: para
    text: Psalm
  - kind: para
    text: よいところ
  - kind: para
    text: 独自の引数アサーション
  - kind: para
    text: 高い精度のエラー検出
  - kind: para
    text: よくないところ
  - kind: para
    text: 大規模プロジェクトでは解析に時間がかかる
  p49:
  - kind: para
    text: つまりどれがいいのか (CI)
  - kind: para
    text: 現時点ではそれぞれのツールで検出項目に一長一短があるため、使い分けるとよい
  - kind: para
    text: PHPStanは高速なのでGitでブランチにpushするごとに検査するようなCIと相性がよい
  p50:
  - kind: para
    text: (エディタ)
  - kind: para
    text: つまりどれがいいのか
  - kind: para
    text: PhpStormは総合的に見て簡単に導入できて強力
  - kind: para
    text: 自分で自由にハックしたいとか、どうしても予算が出ないなどの事情があればエディタとPHPStanがおすすめ
  p51: []
  p52:
  - kind: para
    text: プログラムが間違ってることを実行前に検証したい
  p53:
  - kind: para
    text: “Phan is a static analyzer for PHP that prefers to minimize false-positives.
      Phan attempts to
  - kind: para
    text: prove incorrectness rather than
  - kind: para
    text: correctness.”
  - kind: para
    text: ‒ https://github.com/phan/phan
  p54:
  - kind: para
    text: 型解析の基本的な考え
  p55:
  - kind: para
    text: これから説明する解析プロセスは便宜的に単純化したもので、実際のツールが報告する警告とは異なります
  p56:
  - kind: heading
    level: 2
    text: 単純なコードで考える
  - kind: para
    text: 'strlen(string $s): int'
  - kind: heading
    level: 1
    text: $length = strlen($a);
  - kind: para
    text: $aには string が代入
  - kind: para
    text: $lengthは int が
  - kind: para
    text: されてるはず
  - kind: para
    text: 代入される
  p57:
  - kind: heading
    level: 2
    text: 単純なコードで考える
  - kind: para
    text: $aは array が
  - kind: para
    text: 代入される
  - kind: para
    text: なんでstrlenに array を
  - kind: para
    text: 渡してるの？
  - kind: para
    text: $lengthは int が
  - kind: para
    text: 'strlen(string $s): int'
  - kind: para
    text: 代入される
  - kind: para
    text: なんでintと array を
  - kind: para
    text: 足してるの？
  - kind: heading
    level: 1
    text: $a = explode('/', 'a/b');
  - kind: heading
    level: 1
    text: $length = strlen($a);
  - kind: heading
    level: 1
    text: $b = $length + [];
  - kind: heading
    level: 3
    text: このコードに矛盾があるのは｢実行しなくても｣わかる
  p58:
  - kind: heading
    level: 1
    text: 関数の型付けを考える
  - kind: para
    text: $aと$bって何を指定すればいいの？
  - kind: heading
    level: 2
    text: <?php
  - kind: para
    text: '?'
  - kind: para
    text: '?'
  - kind: para
    text: '?'
  - kind: para
    text: string
  - kind: para
    text: string
  - kind: para
    text: string
  - kind: para
    text: 結果の型は何？
  - kind: heading
    level: 2
    text: function x($a, $b) {
  - kind: heading
    level: 2
    text: return $a . $b;
  - kind: heading
    level: 2
    text: '}'
  - kind: para
    text: 文字列結合なので両辺の値はstring
  p59:
  - kind: heading
    level: 1
    text: 単純に解決できない関数
  - kind: para
    text: $aと$bって何を指定すればいいの？
  - kind: heading
    level: 3
    text: '(number $x, number $b): number'
  - kind: heading
    level: 2
    text: <?php
  - kind: para
    text: '?'
  - kind: para
    text: '?'
  - kind: para
    text: '?'
  - kind: heading
    level: 3
    text: '(array $x, array $b): array'
  - kind: heading
    level: 2
    text: で、どっち？
  - kind: para
    text: 結果の型は何？
  - kind: heading
    level: 2
    text: function x($a, $b) {
  - kind: heading
    level: 2
    text: return $a + $b;
  - kind: heading
    level: 2
    text: '}'
  - kind: heading
    level: 3
    text: PHPの + 演算子は
  - kind: heading
    level: 3
    text: number + number
  - kind: heading
    level: 3
    text: array + array
  - kind: heading
    level: 3
    text: のどちらか
  p60:
  - kind: para
    text: PHPの型推論の限界
  - kind: para
    text: 原理上コードの解析だけでは完全な静的検査は不可能
  - kind: para
    text: 変数やプロパティの動的性
  - kind: para
    text: 関数や演算子の多態性
  - kind: para
    text: インピーダンスミスマッチ
  p61:
  - kind: para
    text: PHPの現実と向き合う
  p62:
  - kind: para
    text: PHPDocで地道に型をつける
  - kind: para
    text: 歴史あるコードは引数の仕様が形式化されたPHPDocで書かれてなかったり、崩れた形で書かれてたりする
  - kind: para
    text: CIやIDEに磨かれてないと高確率で誤りを含んでる
  p63:
  - kind: heading
    level: 1
    text: PHPDocに則ってない
  - kind: para
    text: //===========================// @params str $a// @return true または false//===========================function
      x($a, $b) {
  p64:
  - kind: heading
    level: 1
    text: PHPDocに則るように修正
  - kind: para
    text: /*** @param string $a* @return bool*/function x($a, $b) {
  p65:
  - kind: para
    text: 多態な関数設計を避ける
  - kind: para
    text: 引数によって返り値の構造(型)が変化するような関数は避ける
  - kind: para
    text: '例: parse_url()'
  - kind: para
    text: 引数一つなら連想配列を返す
  - kind: para
    text: 第二引数に定数を渡すと文字列を返す
  p66:
  - kind: para
    text: mixed を避ける
  - kind: para
    text: 引数や返り値が実装を見ないとわからなくなる
  - kind: para
    text: json_encodeやvar_dumpみたいに多様なものを受け付ける関数以外はmixedと書くべき箇所は少ない
  p67:
  - kind: para
    text: arrayも極力控える
  - kind: para
    text: 単にarrayとだけ書くと、配列の中身はmixed状態
  - kind: para
    text: ｢文字列が並ぶ配列｣はstring[]
  - kind: para
    text: ｢決まったキーを持つ配列｣の記法は標準化されてない
  p68:
  - kind: para
    text: '@phan-param, @phan-return'
  - kind: para
    text: Phanのarray-shapes記法ではarray{name:string,age:int}のように記述できる
  p69:
  - kind: para
    text: 数値とインピーダンスミスマッチ
  - kind: para
    text: 何かにつけて鬼門
  - kind: para
    text: クエリパラメータやルーターの動的パラメータから数字列を取得する処理
  - kind: para
    text: PDOから取得してきた数値
  p70:
  - kind: heading
    level: 1
    text: クエリパラメータ
  - kind: para
    text: // 正の整数だけを期待if (!is_numeric($_GET['user_id'])) {throw new BadRequest;}
  - kind: para
    text: $user_id = (int)$_GET['user_id'];
  p71:
  - kind: heading
    level: 1
    text: URL動的パラメータ
  - kind: para
    text: /user/000001 とか /user/0000000001とか受け付けちゃって本当に大丈夫…?
  p72:
  - kind: para
    text: ﬁlter_var/ﬁlter_inputで安心？
  - kind: para
    text: filter_var(' 123', FILTER_VALIDATE_INT)
  - kind: para
    text: // int(123)
  p73:
  - kind: para
    text: PHPの整数の範囲
  - kind: para
    text: ビット数はアーキテクチャ依存の符号付き整数値
  - kind: para
    text: 外部入力やDBのUNSIGNED BIGINTなカラムの値を(int)キャストして化ける
  p74:
  - kind: para
    text: スカラー型宣言とstrict_types
  - kind: para
    text: キャストとつきあっていく覚悟が必要
  - kind: para
    text: 通常のキャストとも別のルールで暗黙変換されることを認識しないと想定しない変換が走ることがある
  p75:
  - kind: para
    text: strict_typesの範囲
  - kind: para
    text: declare(strict_types)はファイルごとに指定される
  - kind: para
    text: 引数の型チェックは呼び出す側の指定が、返り値の型チェックは定義側の指定が反映される
  p76:
  - kind: para
    text: レガシーコードとスカラー型
  - kind: para
    text: 引数リストにむやみにstringやintと書かない
  - kind: para
    text: PHPDocならキャストは起こらないので動作に影響はしない
  p77:
  - kind: para
    text: 静的解析結果とどうやって向き合っていくか
  p78:
  - kind: para
    text: 既存プロジェクトを検査すると
  - kind: para
    text: 数千行にも及ぶおびただしい警告が出力されることもざら
  - kind: para
    text: しかしそれよりも、そのコードが「たしかに動いている」事実が重要
  p79:
  - kind: para
    text: 大事なのは傷口を広げないこと
  - kind: para
    text: 警告が出てるから間違ったコードではない
  - kind: para
    text: 警告の量が減ればメンテしやすい状況に近付くのだと捉える
  p80:
  - kind: para
    text: 差分を重要視する
  - kind: para
    text: リファクタリングの前後でPhanの出力ログのdiffをとり、行が増えなければ、間違った書き換えはしてない可能性は高い
  - kind: para
    text: ロジックの正しさは保障できないのでテストなどは別途必要
size:
  max_width: 1024
  max_height: 768
links:
  p2:
  - url: https://github.com/emacs-php/php-mode
    title: 'GitHub - emacs-php/php-mode: A powerful and flexible Emacs major mode
      for editing PHP scripts'
  p53:
  - url: https://github.com/phan/phan
    title: 'GitHub - phan/phan: Phan is a static analyzer for PHP. Phan prefers to
      avoid false-positives and attempts to prove incorrectness rather than correctness.'
