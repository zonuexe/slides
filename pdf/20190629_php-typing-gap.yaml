    - node: br
    - node: text
      content: 'ため、使い分けるとよい '
    - node: br
    - node: text
      content: PHPStanは高速なのでGitで ブランチにpushするごとに検 査するようなCIと相性がよい
  p50:
  - node: p
    children:
    - node: text
      content: つまりどれがいいのか
  - node: p
    children:
    - node: text
      content: ' (エディタ)'
  - node: p
    children:
    - node: text
      content: PhpStormは総合的に見て
  - node: p
    children:
    - node: text
      content: '簡単に導入できて強力 '
    - node: br
    - node: text
      content: 自分で自由にハックしたいと か、どうしても予算が出ない などの事情があればエディタ
    - node: br
    - node: text
      content: とPHPStanがおすすめ
  p51: []
  p52:
  - node: p
    children:
    - node: text
      content: プログラムが
  - node: p
    children:
    - node: text
      content: 間違ってることを
  - node: p
    children:
    - node: text
      content: 実行前に検証したい
  p53:
  - node: p
    children:
    - node: text
      content: '“Phan is a static analyzer for PHP that prefers to minimize '
    - node: br
    - node: text
      content: 'false-positives. Phan attempts to prove incorrectness rather than '
    - node: br
    - node: text
      content: correctness.”
  - node: p
    children:
    - node: text
      content: ‒ https://github.com/phan/phan
  p54:
  - node: p
    children:
    - node: text
      content: 型解析の
  - node: p
    children:
    - node: text
      content: 基本的な考え
  p55:
  - node: p
    children:
    - node: text
      content: これから説明する解析プロ セスは便宜的に単純化した もので、実際のツールが報 告する警告とは異なります
  p56:
  - node: p
    children:
    - node: text
      content: 単純なコードで考える
  - node: p
    children:
    - node: text
      content: 'strlen(string $s): int'
  - node: p
    children:
    - node: text
      content: '$length = strlen($a); '
  - node: p
    children:
    - node: text
      content: $aには string が代入
  - node: p
    children:
    - node: text
      content: $lengthは int が
  - node: p
    children:
    - node: text
      content: されてるはず
  - node: p
    children:
    - node: text
      content: 代入される
  p57:
  - node: p
    children:
    - node: text
      content: 単純なコードで考える
    - node: br
    - node: text
      content: $aは array が
  - node: p
    children:
    - node: text
      content: 代入される
  - node: p
    children:
    - node: text
      content: 'なんで '
    - node: br
    - node: text
      content: strlenに array を
  - node: p
    children:
    - node: text
      content: 渡してるの？
  - node: p
    children:
    - node: text
      content: $lengthは int が
  - node: p
    children:
    - node: text
      content: 'strlen(string $s): int'
    - node: br
    - node: text
      content: 'なんで '
  - node: p
    children:
    - node: text
      content: 代入される
  - node: p
    children:
    - node: text
      content: intと array を
  - node: p
    children:
    - node: text
      content: $a = explode('/', 'a/b');
  - node: p
    children:
    - node: text
      content: 足してるの？
