  p13:
  - kind: para
    text: メタプログラミング(metaprogramming)と
  - kind: para
    text: はプログラミング技法の一種で、ロジックを
  - kind: para
    text: 直接コーディングするのではなく、あるパター
  - kind: para
    text: ンをもったロジックを生成する高位ロジック
  - kind: para
    text: によってプログラミングを行う方法、またそ
  - kind: para
    text: の高位ロジックを定義する方法のこと。
  - kind: para
    text: https://ja.wikipedia.org/wiki/メタプログラミング
  p14:
  - kind: heading
    level: 1
    text: 直接コーディングするのではなく
  - kind: para
    text: https://ja.wikipedia.org/wiki/メタプログラミング
  p15:
  - kind: para
    text: 突き詰めていくと
  - kind: para
    text: 関数呼び出しすら
  - kind: para
    text: 「直接コーディング」
  - kind: para
    text: しないと解釈できる
  p16:
  - kind: para
    text: それよりはちょっと
  - kind: para
    text: 複雑なものが
  - kind: para
    text: メタプログラミング
  p17:
  - kind: para
    text: PHPは、所謂LLと
  - kind: para
    text: しては遊びが少ない
  p18:
  - kind: para
    text: 例) 原則として関数や
  - kind: para
