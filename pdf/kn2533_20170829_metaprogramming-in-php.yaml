  - node: p
    children:
    - node: text
      content: if (file_exists($path)) {
  - node: p
    children:
    - node: text
      content: '    $evil_path = evil_path($path);     if (file_exists($evil_path))
        { '
    - node: br
    - node: text
      content: '        $src = file_get_contents($path); '
    - node: br
    - node: text
      content: '        // ファイルを魔改造'
    - node: br
    - node: text
      content: '        $evil_src = evil_customize($src);'
    - node: br
    - node: text
      content: '        file_put_contents($evil_path, $evil_src);'
    - node: br
    - node: text
      content: '   } '
    - node: br
    - node: text
      content: '   require $evil_path;'
    - node: br
    - node: text
      content: '}'
