    - node: bold
      content: '         '
    - node: text
      content: 変数テーブルから取り出して配列にする
  p25:
  - node: p
    children:
    - node: text
      content: compact()$foo = foo(); $bar = bar();hoge([ hoge(compact('foo','bar'));    'foo'
        => $foo,     'bar' => $bar ]);
  p26:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
