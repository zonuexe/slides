  p20:
  - node: p
    children:
    - node: text
      content: 'callable//  //  BeforeAfterif ($cond) { $f = $cond ? ''foo'' : ''bar'';     foo($var);
        call_user_func($f, $var); } else {     bar($var); //  こうやって書いてもいい}$f($var);'
  p21:
  - node: p
    children:
    - node: text
      content: 'map$ary = ["apple", "orange", "banana"]; //=> ["Apple", "Orange",
        "Banana"]$bry = []; $cry =          foreach ($ary as $i => $a) { array_map(''ucfirst'', $ary);     $bry[$i]=>
        ucfirst($a); } '
  p22:
  - node: p
    children:
    - node: text
      content: 'compact()         extract()'
  p23:
  - node: p
    children:
    - node: text
      content: 変数テーブルにアクセスできる関数
  p24:
  - node: p
    children:
    - node: bold
      content: '         '
