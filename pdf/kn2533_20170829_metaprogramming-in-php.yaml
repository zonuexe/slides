text:
  p1:
  - kind: heading
    level: 1
    text: における
  - kind: heading
    level: 1
    text: メタプログラミングの温床
  - kind: para
    text: Meta programming for PHP
  - kind: para
    text: '2017-08-20 NEEC Kamata #ll2017jp ODC 2017 Tokyo/ Learn Languages (LL2017)'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - Emacs Lisper, PHPer
    - Qiitaに記事を書いたり変なコメントしてるよ
    - 動的言語はコンピューティングの真髄
  p3:
  - kind: para
    text: 世の中にはいろんなクールな言語がある
  p4:
  - kind: para
    text: PHPには毛ほども興味のなさそうな皆さまにPHPの動的な言語機能を紹介します
  p5:
  - kind: para
    text: サンプルコードは言語機能を簡易に紹介するためのものです
  p6:
  - kind: para
    text: 利用の際は必要性と利便性を慎重に判断すること。
  - kind: para
    text: (メタプログラミングって基本的にそーゆーものですけど…)
  p7:
  - kind: para
    text: アジェンダ
  p8:
  - kind: para
    text: 0. 前提1. 初級篇2. 中級篇3. 上級篇
  p9:
  - kind: para
    text: 前提
  p10:
  - kind: para
    text: PHPは、所謂LLとしては遊びが少ない
  p11:
  - kind: para
    text: 例) 原則として関数やクラスを再定義できない(致命的エラーが発生)
  p12:
  - kind: para
    text: RubyやPythonと違ってオープンクラスではない(モンキーパッチができない)
  p13:
  - kind: para
    text: 謎なタイミングでクラス定義が変更されることが(基本的には)ない
  p14:
  - kind: para
    text: ＝静的解析しやすい条件が揃ってる
  p15:
  - kind: para
    text: その和を乱す邪悪な動的メタプログラミングテクニックが存在する
  p16:
  - kind: para
    text: 😇
  p17:
  - kind: para
    text: 初級編
  p18:
  - kind: para
    text: callable
  p19:
  - kind: para
    text: 関数として呼出し可能な値を表す擬似型
  p20:
  - kind: heading
    level: 1
    text: callable
  - kind: para
    text: '// After$f = $cond ? ''foo'' : ''bar'';call_user_func($f, $var);'
  - kind: para
    text: // Before if ($cond) {foo($var);} else {bar($var);}
  - kind: para
    text: // こうやって書いてもいい$f($var);
  p21:
  - kind: heading
    level: 1
    text: map
  - kind: para
    text: $ary = ["apple", "orange", "banana"];//=> ["Apple", "Orange", "Banana"]
  - kind: para
    text: $bry = [];foreach ($ary as $i => $a) {
  - kind: para
    text: $cry =array_map('ucfirst', $ary);
  - kind: para
    text: $bry[$i] => ucfirst($a);}
  p22:
  - kind: para
    text: compact()extract()
  p23:
  - kind: para
    text: 変数テーブルにアクセスできる関数
  p24:
  - kind: para
    text: compact()変数テーブルから取り出して配列にする
  p25:
  - kind: heading
    level: 1
    text: compact()
  - kind: para
    text: $foo = foo();$bar = bar();
  - kind: para
    text: hoge(compact('foo','bar'));
  - kind: para
    text: hoge(['foo' => $foo,'bar' => $bar]);
  p26:
  - kind: para
    text: extract()変数テーブルから取り出して配列に
  p27:
  - kind: heading
    level: 1
    text: extract()
  - kind: para
    text: function (array $vs){
  - kind: para
    text: extract($vs,
  - kind: para
    text: EXTR_PREFIX_ALL,
  - kind: para
    text: $hoge_foo = $vs['foo'];$hoge_bar = $vs['bar'];
  - kind: para
    text: '''hoge'');'
  - kind: heading
    level: 2
    text: 本当はissetでチェックすべき
  p28:
  - kind: para
    text: extract()未使用変数の検出できない
  - kind: para
    text: 読みにくくなるので邪悪
  - kind: para
    text: バグの温床であるばかりか、ふつうに脆弱性の温床になる
  p29:
  - kind: para
    text: $$var
  p30:
  - kind: para
    text: $$var可変変数(variable variables)
  p31:
  - kind: heading
    level: 1
    text: 可変変数
  - kind: para
    text: $world = "こんにちは世界";$hello = "world";$v = "hello";
  - kind: para
    text: var_dump($v); //=> "hello"var_dump($$v); //=> "world"var_dump($$$v); //=>
      "こんにちは世界"// $$ はいくつ付けてもよい！！
  p32:
  - kind: para
    text: debug_backtrace()
  p33:
  - kind: para
    text: スタックトレースを全部取得できる(ファイル・引数含む)
  p34:
  - kind: para
    text: (これを悪用すればどんな邪悪なことができるかは明白なので省略)
  p35:
  - kind: para
    text: 中級編
  p36:
  - kind: para
    text: マジックメソッド
  p37:
  - kind: para
    text: __get($name)__set($name, $value)
  p38:
  - kind: para
    text: __get()アクセス不可プロパティを読み出そうとしたときに呼ばれる
  p39:
  - kind: para
    text: __set()アクセス不可プロパティを書き込もうとしたときに呼ばれる
  p40:
  - kind: heading
    level: 1
    text: __get(), __set()
  - kind: para
    text: class Hoge {private $values = [];public function __set($name, $value) {$values[$name]
      = $value;}public function __get($name) {return $values[$name];}}
  p41:
  - kind: para
    text: 「アクセス不可」は未定義プロパティだけはなくprivate, protected含む
  p42:
  - kind: heading
    level: 1
    text: 読み出し専用プロパティ
  - kind: para
    text: /*** @property-read string $name*/class Hoge {private $name;public function
      __construct($name) {$this->name = $name;}public function __get($name) {return
      $values[$name];}
  p43:
  - kind: heading
    level: 1
    text: 書き込み禁止プロパティ
  - kind: para
    text: public function __set($name) {throw new OutOfRangeException();}}
  p44:
  - kind: para
    text: __call($name, $args)
  p45:
  - kind: para
    text: __call()アクセス不可メソッドを起動しようとしたときに呼ばれる
  p46:
  - kind: heading
    level: 1
    text: Proxyパターン
  - kind: para
    text: class HogeProxy {private $hoge;public function __construct(Hoge $hoge) {$this->hoge
      = $hoge;}public function __call($name, $args) {return call_user_func_array($name,
      $args);}}
  p47:
  - kind: heading
    level: 1
    text: Proxyパターン (PHPDoc)
  - kind: para
    text: /*** @method Foo getFoo()* @method string format(string $tpl)* @method void
      close()*/class HogeProxy {/** @var Hoge */private $hoge;public function __construct(Hoge
      $hoge) {$this->hoge = $hoge;}public function __call($name, $args) {
  p48:
  - kind: para
    text: 上級編
  p49:
  - kind: para
    text: spl_autoload_register()
  p50:
  - kind: para
    text: クラスが定義されたファイルを自動ロードするための仕組み
  p51:
  - kind: para
    text: (ふつうはComposerがやってくれるので自分で定義する必要ない)
  p52:
  - kind: heading
    level: 1
    text: ふつうのクラスローダー
  - kind: para
    text: spl_autoload_register(function ($class) {$file = strtr($class, '\\', '/')
      . '.php';$path = __DIR__ . '/' . $file;if (file_exists($path)) {require $path;}});
  p53:
  - kind: para
    text: クラスが読み込まれる前に介入できる
  p54:
  - kind: heading
    level: 1
    text: 邪悪クラスローダー
  - kind: para
    text: if (file_exists($path)) {$evil_path = evil_path($path);if (file_exists($evil_path))
      {$src = file_get_contents($path);// ファイルを魔改造$evil_src = evil_customize($src);file_put_contents($evil_path,
      $evil_src);}require $evil_path;}
  p55:
  - kind: para
    text: まとめ
  p56:
  - kind: para
    text: PHPは制限の大い言語のようだが、遊べるポイントはいろいろある
  p57:
  - kind: para
    text: 大いなる力には大いなる責任がry
  p58:
  - kind: para
    text: PHPUnit, PsySH, そのほか一部のフレームワークなどはメタプログラミングのテクニックを活用してる
  p59:
  - kind: para
    text: それ用のライブラリもある。
  - kind: para
    text: (Go! AOP https://github.com/goaop/framework)
  p60:
  - kind: para
    text: 実用知識！
  p61:
  - kind: para
    text: そなえよう
