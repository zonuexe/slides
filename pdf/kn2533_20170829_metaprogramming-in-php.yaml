    - node: text
      content: '__get($name)         __set($name, $value)'
  p38:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: __get()アクセス不可プロパティを読み出そうとしたときに呼ばれる
  p39:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: __set()アクセス不可プロパティを書き込もうとしたときに呼ばれる
  p40:
  - node: p
    children:
    - node: text
      content: '__get(), __set()class Hoge {             private $values = [];     public function __set($name, $value) {                 $values[$name] = $value;             }     public function __get($name) {                 return $values[$name];             }         }'
  p41:
  - node: p
    children:
    - node: text
      content: '「アクセス不可」は未定         義プロパティだけはなくprivateprotected, 含む'
  p42:
  - node: p
    children:
    - node: text
      content: '読み出し専用プロパティ/**          * @property-read string $name          */ class Hoge {             private $name;     public function __construct($name) {                 $this->name = $name;             }     public function __get($name) {                 return $values[$name];             }'
  p43:
  - node: p
    children:
    - node: text
      content: '書き込み禁止プロパティ    public function __set($name) {                throw new OutOfRangeException();             }         }'
  p44:
  - node: p
    children:
    - node: text
      content: __call($name, $args)
  p45:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: __call()アクセス不可メソッドを起動しようとしたときに呼ばれる
  p46:
  - node: p
    children:
    - node: text
      content: 'Proxyパターンclass HogeProxy {             private $hoge;     public function __construct(Hoge $hoge) {                 $this->hoge = $hoge;             }     public function __call($name, $args) {                 return call_user_func_array($name, $args);             }         }'
  p47:
  - node: p
    children:
    - node: text
      content: 'Proxyパターン (PHPDoc)/**          * @method Foo getFoo()          * @method string format(string $tpl)          * @method void close()          */ class HogeProxy {     /** @var Hoge */             private $hoge;     public function __construct(Hoge $hoge) {                 $this->hoge = $hoge;             }     public function __call($name, $args) {'
  p48:
  - node: p
    children:
    - node: text
      content: 上級編
  p49:
  - node: p
    children:
    - node: text
      content: spl_autoload_register()
  p50:
  - node: p
    children:
    - node: text
      content: クラスが定義されたファイルを自動ロードするための仕組み
  p51:
  - node: p
    children:
    - node: text
      content: (ふつうはComposerがやってくれるので自分で定義する必要ない)
  p52:
  - node: p
    children:
    - node: text
      content: 'ふつうのクラスローダーspl_autoload_register(function ($class) {             $file = strtr($class, ''\\'', ''/'') . ''.php'';     $path = __DIR__ .
        ''/'' . $file;     if (file_exists($path)) {                 require $path;             }         });'
  p53:
  - node: p
    children:
    - node: text
      content: クラスが読み込まれる前に介入できる
  p54:
  - node: p
    children:
    - node: text
      content: '邪悪クラスローダーif (file_exists($path)) {             $evil_path = evil_path($path);     if (file_exists($evil_path)) {         $src
        = file_get_contents($path);         //  ファイルを魔改造        $evil_src = evil_customize($src);                 file_put_contents($evil_path, $evil_src);            }    require $evil_path;         }'
