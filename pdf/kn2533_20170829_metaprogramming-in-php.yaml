    - node: bold
      content: '         '
    - node: text
      content: 変数テーブルから取り出して配列に
  p27:
  - node: p
    children:
    - node: text
      content: 'extract()function (array $vs) {$hoge_foo = $vs[''foo''];extract($vs,
                       EXTR_PREFIX_ALL, $hoge_bar = $vs[''bar''];''hoge'');本当はissetでチェックすべき'
  p28:
  - node: p
    children:
    - node: text
      content: 'extract() 未使用変数の検出できない

        読みにくくなるので邪悪

        バグの温床であるばかりか、ふつうに脆弱性の温床になる'
