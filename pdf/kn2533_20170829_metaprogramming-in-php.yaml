  - node: p
    children:
    - node: text
      content: /**
  - node: p
    children:
    - node: text
      content: ' * @method Foo getFoo()'
  - node: p
    children:
    - node: text
      content: ' * @method string format(string $tpl)'
  - node: p
    children:
    - node: text
      content: ' * @method void close()'
  - node: p
    children:
    - node: text
      content: ' */ '
    - node: br
    - node: text
      content: class HogeProxy {     /** @var Hoge */
  - node: p
    children:
    - node: text
      content: '    private $hoge; '
    - node: br
    - node: text
      content: '    public function __construct(Hoge $hoge) {'
  - node: p
    children:
    - node: text
      content: '        $this->hoge = $hoge;'
  - node: p
    children:
    - node: text
      content: '    } '
    - node: br
    - node: text
      content: '    public function __call($name, $args) {'
