      content: __get(), __set()
  - node: p
    children:
    - node: text
      content: class Hoge {
  - node: p
    children:
    - node: text
      content: '    private $values = []; '
    - node: br
    - node: text
      content: '    public function __set($name, $value) {'
  - node: p
    children:
    - node: text
      content: '        $values[$name] = $value;'
  - node: p
    children:
    - node: text
      content: '    } '
    - node: br
    - node: text
      content: '    public function __get($name) {'
  - node: p
    children:
    - node: text
      content: '        return $values[$name];'
  - node: p
    children:
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: '}'
  p41:
  - node: p
    children:
    - node: text
      content: 「アクセス不可」は未定義プロパティだけはなくprivate, protected含む
  p42:
  - node: p
    children:
    - node: bold
      content: 読み出し専用プロパティ
  - node: p
    children:
    - node: text
      content: /**
    - node: br
    - node: text
      content: ' * @property-read string $name'
    - node: br
      content: ' */ '
    - node: br
    - node: text
      content: class Hoge {
    - node: br
    - node: text
      content: '    private $name; '
    - node: br
    - node: text
      content: '    public function __construct($name) {'
    - node: br
    - node: text
      content: '        $this->name = $name;'
    - node: br
    - node: text
      content: '    } '
    - node: br
    - node: text
      content: '    public function __get($name) {'
    - node: br
    - node: text
      content: '        return $values[$name];'
    - node: br
    - node: text
      content: '    }'
  p43:
  - node: p
    children:
    - node: bold
      content: 書き込み禁止プロパティ
  - node: p
    children:
    - node: text
