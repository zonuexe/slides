  - node: p
    children:
    - node: text
      content: '    private $hoge; '
    - node: br
    - node: text
      content: '    public function __construct(Hoge $hoge) {'
  - node: p
    children:
    - node: text
      content: '        $this->hoge = $hoge;'
  - node: p
    children:
    - node: text
      content: '    } '
    - node: br
    - node: text
      content: '    public function __call($name, $args) {'
  - node: p
    children:
    - node: text
      content: '        return call_user_func_array($name, $args);'
  - node: p
    children:
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: '}'
  p47:
  - node: p
    children:
    - node: bold
