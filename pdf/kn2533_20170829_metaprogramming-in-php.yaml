  p31:
  - node: p
    children:
    - node: text
      content: '可変変数$world = "こんにちは世界"; $hello = "world"; $v = "hello"; var_dump($v);    //=>
        "hello" var_dump($$v);   //=> "world"         var_dump($$$v);  //=> "こんにちは世界" // $$ はいくつ付けてもよい！！'
