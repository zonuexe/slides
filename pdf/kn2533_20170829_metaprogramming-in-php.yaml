    - node: bold
      content: ふつうのクラスローダー
  - node: p
    children:
    - node: text
      content: spl_autoload_register(function ($class) {
    - node: br
    - node: text
      content: '    $file = strtr($class, ''\\'', ''/'') . ''.php''; '
    - node: br
    - node: text
      content: '    $path = __DIR__ . ''/'' . $file; '
    - node: br
    - node: text
      content: '    if (file_exists($path)) {'
    - node: br
    - node: text
      content: '        require $path;'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '});'
  p53:
  - node: p
    children:
    - node: bold
