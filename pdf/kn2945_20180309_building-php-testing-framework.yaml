  p99:
  - kind: heading
    level: 1
    text: define.php
  - kind: para
    text: <?php
  - kind: para
    text: const collect_vars = 'return v(get_defined_vars()+["this"=>isset($this)?$this:null]);';
  - kind: para
    text: 'function v(array $variables): string{// $GLOBALSは長大なので消しとくunset($variables[''GLOBALS'']);return
      \serialize($variables);}'
  p100:
  - kind: para
    text: 次のパターンに行きましょう
  p101:
  - kind: heading
    level: 1
    text: '仕様2: 関数を実行'
  - kind: para
    text: テストファイルは xxx_test.phpの形式
  - kind: para
    text: その中に test_xxxx() 関数が定義する
  - kind: para
    text: Hamcrestを使ってテストしてみる
  - kind: para
    text: スクリプトを実行すると実行
  p102:
  - kind: para
    text: http://hamcrest.org/
  p103:
  - kind: heading
    level: 1
    text: Hamcrest (hamcrest-php)
  - kind: para
    text: マッチャー (値がマッチするか比較)
  - kind: para
    text: もともとはJavaのライブラリ
  - kind: para
    text: assertXXX()みたいなのが定義されてる
  - kind: para
    text: \Hamcrest\Util::registerGlobalFunctions()
  - kind: para
    text: を呼ぶとグローバル関数として定義される
  p104:
  - kind: heading
    level: 1
    text: assert_tests/run (1/3)
  - kind: para
    text: '#!/usr/bin/env php<?php require __DIR__ . ''/../vendor/autoload.php'';'
  - kind: para
    text: \Hamcrest\Util::registerGlobalFunctions();
  - kind: para
    text: chdir(__DIR__);foreach (glob('*_test.php') as $file) {require_once $file;}
  - kind: para
    text: $failures = [];$errors = [];
  p105:
  - kind: heading
    level: 1
    text: assert_tests/run (2/3)
  - kind: para
    text: foreach (get_defined_functions(true)['user'] as $func) {if (strpos($func,
      'test_') === 0) {try {$func();echo '.';} catch (\Hamcrest\AssertionError $e)
      {$failures[] = $e;echo 'F';}catch (\Throwable $e) {$errors[] = $e;echo 'E';}}}echo
      PHP_EOL;
  p106:
  - kind: heading
    level: 1
    text: assert_tests/run (3/3)
  - kind: para
    text: if ($failures) {echo "Failures:", PHP_EOL;
  - kind: para
    text: 'foreach ($failures as $f) {echo PHP_EOL;echo "FILE: {$f->getFile()} ({$f->getLine()})",
      PHP_EOL;echo "DESC: {$f->getMessage()})", PHP_EOL;}}'
  - kind: para
    text: if ($errors) {echo "Errors:", PHP_EOL;dump($errors);}
  p107:
  - kind: para
    text: また完成してしまった…
