  p77:
  - kind: heading
    level: 1
    text: bootstrap.php
  - kind: para
    text: <?php
  - kind: para
    text: require_once __DIR__ . '/define.php';
  - kind: para
    text: ini_set('zend.assertions', 1);
  - kind: para
    text: ini_set('assert.exception', 0);
  - kind: para
    text: assert_options(ASSERT_ACTIVE, 1);
  - kind: para
    text: assert_options(ASSERT_BAIL, 0);
  - kind: para
    text: assert_options(ASSERT_QUIET_EVAL, 0);
  - kind: para
    text: assert_options(ASSERT_WARNING, 0);
  - kind: para
    text: $testing = new Testing();
  - kind: para
    text: assert_options(ASSERT_CALLBACK, [$testing, 'handler']);
  - kind: para
    text: return $testing;
  p78:
  - kind: heading
    level: 1
    text: Testing.php
  - kind: para
    text: <?php
  - kind: para
    text: class Testing {
  - kind: para
    text: /** @var bool テスト失敗停止するか */
  - kind: para
    text: private $stop_on_failure = false;
  - kind: para
    text: /** @var array[] 実行結果 */
  - kind: para
    text: private $result = [];
  - kind: para
    text: public function __construct(array $options) {
  - kind: para
    text: $this->stop_on_failure = $options['stop_on_failure'] ?? false;
  - kind: para
    text: '}'
  - kind: para
    text: /** assert()の失敗時にこいつが呼ばれるように設定 */
  - kind: para
    text: public function handler($file, $line, $code, $desc = null) {
  - kind: para
    text: $this->result[] = [$file, $line, $desc];
  - kind: para
    text: if ($this->stop_on_failure) $this->finalize();
  - kind: para
    text: '}'
  p79:
  - kind: heading
    level: 1
    text: Testing.php
  - kind: para
    text: /** いままで失敗したテストをまとめて結果表示 */
  - kind: para
    text: 'public function finalize(): void'
  - kind: para
    text: '{'
  - kind: para
    text: if ($this->result) {
  - kind: para
    text: foreach ($this->result as [$file, $line, $desc])
  - kind: para
    text: '{'
  - kind: para
    text: $this->output($file, $line, $desc);
  - kind: para
    text: '}'
  - kind: para
    text: exit(1); // エラー終了
  - kind: para
    text: '}'
  - kind: para
    text: $this->result = [];
  - kind: para
    text: echo 'ok.', PHP_EOL;
  - kind: para
    text: exit(0);
  - kind: para
    text: '}'
  p80:
  - kind: heading
