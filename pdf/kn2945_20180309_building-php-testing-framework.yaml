  p27:
  - node: p
    children:
    - node: text
      content: '         PHPUnitとかphpspecとか巨大な依存関係入れたくない'
  p28:
  - node: p
    children:
    - node: text
      content: せやな
  p29:
  - node: p
    children:
    - node: text
      content: '         懸念の妥当性はともかく         依存パッケージの数がそれなりに多いのはたしか'
  p30:
  - node: p
    children:
    - node: text
      content: '         「簡単なテストだけ　できればいいよ」'
  p31:
  - node: p
    children:
    - node: text
      content: おう
  p32:
  - node: p
    children:
    - node: text
      content: じゃ、作るか
  p33:
  - node: p
    children:
    - node: text
      content: その前に
  p34:
  - node: p
    children:
    - node: text
      content: ところでPHP標準のテスティングフレームワークがある
  p35:
  - node: p
    children:
    - node: text
      content: http://qa.php.net/write-test.php
  p36:
  - node: p
    children:
    - node: text
      content: '         PHP本体のテストコード'
  p37:
  - node: p
    children:
    - node: text
      content: '         php-srcに入ってる         run-tests.phpで実行できる'
  p38:
  - node: p
    children:
    - node: text
      content: 実はPHPUnitでもおまけ機能としてテスト実行できる
  p39:
  - node: p
    children:
    - node: text
      content: バッファの出力をテストする--TEST-- --TEST-- GET $_ENV test Compute 1 + 1 test --ENV--
        --FILE-- return <<<END <?= 1 + 1 ?> a=AAA --EXPECT-- b=BBB 2 END; --FILE--
        <?php echo getenv('a'), "\n"; echo getenv('b'), "\n"; ?> --EXPECT-- AAA BBB
  p40:
  - node: p
    children:
    - node: text
      content: '         ただし(意図的なのか)         仕様を完全にはサポートしてません'
  p41:
  - node: p
    children:
    - node: text
      content: もしphptを採用するrun-tests.phpならを使った方がいい
  p42:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: テストスクリプト
  p43:
  - node: p
    children:
    - node: text
      content: '         なぜ人はテストを書くのか'
  p44:
  - node: p
    children:
    - node: text
      content: 実装前に入出力の例を明示したい
  p45:
  - node: p
    children:
    - node: text
      content: '         機能追加や         リファクタリングで意図した挙動が壊れないことを保障したい'
  p46:
  - node: p
    children:
    - node: text
      content: テストを書こう
  p47:
  - node: p
    children:
    - node: text
      content: そうすると
  p48:
  - node: p
    children:
    - node: text
      content: '         関心がどうとかって話になってくる'
  p49:
  - node: p
    children:
    - node: text
      content: うるせえ
  p50:
  - node: p
    children:
    - node: text
      content: やりたいことは動作確認
  p51:
  - node: p
    children:
    - node: text
      content: それだけ
  p52:
  - node: p
    children:
    - node: text
      content: '         テストスクリプトを書こう'
  p53:
  - node: p
    children:
    - node: text
      content: 'test.php<?php require_once __DIR__ . ''/vendor/autoload.php''; (2
        === 1 + 1) or die("LINE: ". __LINE__); (3 === 1.5 + 1.5) or die("LINE: ".
        __LINE__);         $date = date(''Y-m-d'',4502304000); ("2112-09-13" === $date) or die("LINE:
        ". __LINE__); $a = [1, 2, 3]; (1 == array_shift($a)) or die("LINE: ". __LINE__);
        echo ''ok.'', PHP_EOL;'
  p54:
  - node: p
    children:
    - node: text
      content: 失敗すると行が出力されて終了
  p55:
  - node: p
    children:
    - node: text
      content: '         or die()書くのだるい'
  p56:
  - node: p
    children:
    - node: text
      content: '         もうちょっとわかりやすく'
  p57:
  - node: p
    children:
    - node: text
      content: assert()
  p58:
  - node: p
    children:
    - node: text
      content: 'test.php#!/usr/bin/env php <?php require_once __DIR__ . ''/vendor/autoload.php'';
                 assert(2 === 1 + 1); assert(3 === 1.5 + 1.5); assert("2112-09-13" === date(''Y-m-d'',
        4503168000)); $a = [1, 2, 3]; assert(1 == array_shift($a));'
  p59:
  - node: p
    children:
    - node: text
      content: '出力PHP Warning:  assert(): assert(3 === 1.5 + 1.5) failed in /Users/megurine/repo/php/phperkaigi-test/assert-test.php
