    - node: bold
      content: '         '
    - node: text
      content: できる！フレームワーク
  p66:
  - node: p
    children:
    - node: text
      content: フレームワークとは
  p67:
  - node: p
    children:
    - node: text
      content: https://ja.wikipedia.org/wiki/ソフトウェアフレームワーク
  p68:
  - node: p
    children:
    - node: text
      content: '         制御の反転がソフトウェアフレームワークの特徴'
  p69:
  - node: p
    children:
    - node: text
      content: '         ふつうのライブラリは         あなたが書いたコードから呼び出される'
  p70:
  - node: p
    children:
    - node: text
      content: '         フレームワークはあなたが書いたコードを呼び出す'
  p71:
  - node: p
    children:
    - node: text
      content: '         これが制御の反転'
  p72:
  - node: p
    children:
    - node: text
      content: '         ここからはどんどんいきます'
  p73:
  - node: p
    children:
    - node: text
      content: '仕様1: コードをべたに実行テストファイルは xxx_test.phpの形式

        assert()を使ってテストする

        スクリプトを実行すると実行'
  p74:
  - node: p
    children:
    - node: text
      content: assert_tests/run#!/usr/bin/env php <?php require __DIR__ . '/../vendor/autoload.php';
        $testing = include __DIR__ . '/bootstrap.php'; chdir(__DIR__); foreach (glob('*_test.php')
        as $file) {     try {         include $file;     } catch (\Throwable $e) {         dump($e);     }
        } $testing->finalize();
  p75:
  - node: p
    children:
    - node: text
      content: '         assert()に失敗した         ときの結果はカスタマイズできる'
  p76:
  - node: p
    children:
    - node: text
      content: '         (実はPHP5方式とPHP7方式で異なる)

        今回はPHP5方式'
  p77:
  - node: p
    children:
    - node: text
      content: 'bootstrap.php<?php require_once __DIR__ . ''/define.php''; ini_set(''zend.assertions'',
        1); ini_set(''assert.exception'', 0); assert_options(ASSERT_ACTIVE, 1); assert_options(ASSERT_BAIL,
        0); assert_options(ASSERT_QUIET_EVAL, 0); assert_options(ASSERT_WARNING, 0);         $testing = new Testing(); assert_options(ASSERT_CALLBACK, [$testing, ''handler'']);
        return $testing;'
  p78:
  - node: p
    children:
    - node: text
      content: 'Testing.php<?php class Testing {     /** @var bool テスト失敗停止するか */     private
        $stop_on_failure = false;     /** @var array[] 実行結果 */     private $result
        = [];             public function __construct(array $options) {         $this->stop_on_failure
        = $options[''stop_on_failure''] ?? false;     }              /** assert()の失敗時にこいつが呼ばれるように設定 */     public function handler($file, $line,
        $code, $desc = null) {         $this->result[] = [$file, $line, $desc];         if
        ($this->stop_on_failure) $this->finalize();     }'
  p79:
  - node: p
    children:
    - node: text
      content: 'Testing.php    /** いままで失敗したテストをまとめて結果表示 */             public function finalize(): void     {         if ($this->result) {             foreach
        ($this->result as [$file, $line, $desc]) {                 $this->output($file,
        $line, $desc);             }             exit(1); // エラー終了         }         $this->result
        = [];         echo ''ok.'', PHP_EOL;         exit(0);     }'
  p80:
  - node: p
    children:
    - node: text
      content: 'Testing.php    private function output($file, $line, $desc): void     {         //
        ソースコードの該当行を取得         $code = trim(file($file)[$line-1]);         echo "FILE:
        {$file} ({$line})", PHP_EOL;         echo "CODE: {$code}", PHP_EOL;                 echo "DESC: {$desc}", PHP_EOL;     } '
  p81:
  - node: p
    children:
    - node: text
      content: 完成！
  p82:
  - node: p
    children:
    - node: text
      content: テストを記述
  p83:
  - node: p
    children:
    - node: text
      content: 'fizzbuzz_test.php<?php // to_fizzbuzz() 関数は別に定義済みの想定          assert("1"    === $actual = to_fizzbuzz(1)); assert("Fizz" === $actual = to_fizzbuzz(3));
        assert("Buzz" === $actual = to_fizzbuzz(5)); assert("Buzz" === $actual = to_fizzbuzz(10));
        assert("FizzBuzz" === $actual = to_fizzbuzz(15)); '
  p85:
  - node: p
    children:
    - node: text
      content: '         完璧では(ただしassertは一行で書かれるものとする)'
  p86:
  - node: p
    children:
    - node: text
      content: 😊
  p87:
  - node: p
    children:
    - node: text
      content: '         さらにパワーアップ'
  p88:
  - node: p
    children:
    - node: text
      content: '         PowerAssert(のようなもの)'
  p89:
  - node: p
    children:
    - node: text
      content: '         Groovyのテストで一躍知られた'
  p90:
  - node: p
    children:
    - node: text
      content: '         t-wadaさんのpower-assert.jsが有名'
  p91:
  - node: p
    children:
    - node: text
      content: http://hamcrest.org/
  p92:
  - node: p
    children:
    - node: text
      content: '         PHPでちゃんと作ろうとすると大変'
  p93:
  - node: p
    children:
    - node: text
      content: それっぽいものなら作れる！
  p95:
  - node: p
    children:
    - node: text
      content: 欠点
  p96:
  - node: p
    children:
    - node: text
      content: assert()では失敗しかフックできないから、「98/100成功」のようなカウントができない
  p97:
  - node: p
    children:
    - node: text
      content: '         PowerAssert(もどき)書くのがめんどい'
  p99:
  - node: p
    children:
    - node: text
      content: 'define.php<?php const collect_vars = ''return v(get_defined_vars()+["this"=>isset($this)?$this:null]);'';
        function v(array $variables): string {             // $GLOBALSは長大なので消しとく     unset($variables[''GLOBALS'']);     return \serialize($variables);
        } '
  p100:
  - node: p
    children:
    - node: text
      content: 次のパターンに行きましょう
  p101:
  - node: p
    children:
    - node: text
      content: '仕様2: 関数を実行テストファイルは xxx_test.phpの形式

        その中に test_xxxx() 関数が定義する

        Hamcrestを使ってテストしてみる

        スクリプトを実行すると実行'
  p102:
  - node: p
    children:
    - node: text
      content: http://hamcrest.org/
  p103:
  - node: p
    children:
    - node: text
      content: 'Hamcrest (hamcrest-php)マッチャー

         (値がマッチするか比較)もともとはJavaのライブラリ

        assertXXX()みたいなのが定義されてる

         \Hamcrest\Util::registerGlobalFunctions()         を呼ぶとグローバル関数として定義される'
  p104:
  - node: p
    children:
    - node: text
      content: assert_tests/run (1/3)#!/usr/bin/env php <?php require __DIR__ . '/../vendor/autoload.php';
        \Hamcrest\Util::registerGlobalFunctions(); chdir(__DIR__); foreach (glob('*_test.php')
        as $file) {     require_once $file; } $failures = []; $errors   = [];
  p105:
  - node: p
    children:
    - node: text
      content: assert_tests/run (2/3)foreach (get_defined_functions(true)['user']
        as $func) {     if (strpos($func, 'test_') === 0) {         try {             $func();             echo
        '.';         } catch (\Hamcrest\AssertionError $e) {             $failures[]
        = $e;             echo 'F';         }catch (\Throwable $e) {             $errors[]
        = $e;             echo 'E';         }     } } echo PHP_EOL;
  p106:
  - node: p
    children:
    - node: text
      content: 'assert_tests/run (3/3)if ($failures) {     echo "Failures:", PHP_EOL;     foreach
        ($failures as $f) {         echo PHP_EOL;         echo "FILE: {$f->getFile()}
        ({$f->getLine()})", PHP_EOL;         echo "DESC: {$f->getMessage()})", PHP_EOL;     }
        } if ($errors) {     echo "Errors:", PHP_EOL;     dump($errors); }'
  p107:
  - node: p
    children:
    - node: text
      content: '         また完成してしまった…'
  p108:
  - node: p
    children:
    - node: text
      content: テストを記述
  p109:
  - node: p
    children:
    - node: text
      content: 'fizzbuzz_test.php<?php function test_fizzbuzz() {     assertThat(to_fizzbuzz(1),
        equalTo("1"));     assertThat(to_fizzbuzz(3), equalTo("Fizz"));     assertThat(to_fizzbuzz(5),
        equalTo("Buzz"));     assertThat(to_fizzbuzz(10), equalTo("Buzz"));     assertThat(to_fizzbuzz(15),
        equalTo("FizzBuzz")); } '
  p111:
  - node: p
    children:
    - node: text
      content: 🤔
  p112:
  - node: p
    children:
    - node: text
      content: '         出力差分はわかるけどいまいちわかりにくい'
  p113:
  - node: p
    children:
    - node: text
      content: '         そうだ         パラメタライズテストをしよう'
  p114:
  - node: p
    children:
    - node: text
      content: 引数だけを変更して同じテストをする
  p115:
  - node: p
    children:
    - node: text
      content: 'PHPUnitでの

        @dataProvider'
