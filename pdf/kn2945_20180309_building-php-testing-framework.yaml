  - kind: para
    text: 'private function output($file, $line, $desc): void'
  - kind: para
    text: '{'
  - kind: para
    text: // ソースコードの該当行を取得
  - kind: para
    text: $code = trim(file($file)[$line-1]);
  - kind: para
    text: 'echo "FILE: {$file} ({$line})", PHP_EOL;'
  - kind: para
    text: 'echo "CODE: {$code}", PHP_EOL;'
  - kind: para
    text: 'echo "DESC: {$desc}", PHP_EOL;'
  - kind: para
    text: '}'
  p81:
