  p53:
  - kind: heading
    level: 1
    text: test.php
  - kind: para
    text: <?php require_once __DIR__ . '/vendor/autoload.php';
  - kind: para
    text: '(2 === 1 + 1) or die("LINE: ". __LINE__);(3 === 1.5 + 1.5) or die("LINE:
      ". __LINE__);$date = date(''Y-m-d'',4502304000);("2112-09-13" === $date) or
      die("LINE: ". __LINE__);'
  - kind: para
    text: '$a = [1, 2, 3];(1 == array_shift($a)) or die("LINE: ". __LINE__);'
  - kind: para
    text: echo 'ok.', PHP_EOL;
  p54:
