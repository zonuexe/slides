  p73:
  - kind: heading
    level: 1
    text: '仕様1: コードをべたに実行'
  - kind: para
    text: テストファイルは xxx_test.phpの形式
  - kind: para
    text: assert()を使ってテストする
  - kind: para
    text: スクリプトを実行すると実行
  p74:
  - kind: heading
    level: 1
    text: assert_tests/run
  - kind: para
    text: '#!/usr/bin/env php<?php require __DIR__ . ''/../vendor/autoload.php'';$testing
      = include __DIR__ . ''/bootstrap.php'';chdir(__DIR__);foreach (glob(''*_test.php'')
      as $file) {try {include $file;} catch (\Throwable $e) {dump($e);}}$testing->finalize();'
  p75:
  - kind: para
    text: assert()に失敗したときの結果はカスタマイズできる
  p76:
  - kind: para
    text: (実はPHP5方式とPHP7方式で異なる)
  - kind: heading
    level: 1
    text: 今回はPHP5方式
  p77:
  - kind: heading
    level: 1
    text: bootstrap.php
  - kind: para
    text: <?php require_once __DIR__ . '/define.php';ini_set('zend.assertions', 1);ini_set('assert.exception',
      0);assert_options(ASSERT_ACTIVE, 1);assert_options(ASSERT_BAIL, 0);assert_options(ASSERT_QUIET_EVAL,
      0);assert_options(ASSERT_WARNING, 0);
  - kind: para
    text: $testing = new Testing();assert_options(ASSERT_CALLBACK, [$testing, 'handler']);return
      $testing;
  p78:
  - kind: heading
    level: 1
    text: Testing.php
  - kind: para
    text: <?php
  - kind: para
    text: class Testing {/** @var bool テスト失敗停止するか */
  - kind: para
    text: private $stop_on_failure = false;/** @var array[] 実行結果 */
  - kind: para
    text: private $result = [];
  - kind: para
    text: public function __construct(array $options) {$this->stop_on_failure = $options['stop_on_failure']
      ?? false;
  - kind: para
    text: '}'
  - kind: para
    text: /** assert()の失敗時にこいつが呼ばれるように設定 */public function handler($file, $line, $code,
      $desc = null) {
  - kind: para
    text: $this->result[] = [$file, $line, $desc];if ($this->stop_on_failure) $this->finalize();
  - kind: para
    text: '}'
  p79:
  - kind: heading
    level: 1
    text: Testing.php
  - kind: para
    text: '/** いままで失敗したテストをまとめて結果表示 */public function finalize(): void{if ($this->result)
      {foreach ($this->result as [$file, $line, $desc]){$this->output($file, $line,
      $desc);}exit(1); // エラー終了}$this->result = [];echo ''ok.'', PHP_EOL;exit(0);}'
  p80:
  - kind: heading
    level: 1
    text: Testing.php
  - kind: para
    text: 'private function output($file, $line, $desc): void{// ソースコードの該当行を取得$code
      = trim(file($file)[$line-1]);'
  - kind: para
    text: 'echo "FILE: {$file} ({$line})", PHP_EOL;echo "CODE: {$code}", PHP_EOL;echo
      "DESC: {$desc}", PHP_EOL;}'
  p81:
  - kind: para
    text: 完成！
  p82:
  - kind: para
    text: テストを記述
