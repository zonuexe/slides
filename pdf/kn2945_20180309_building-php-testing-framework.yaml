  p39:
  - kind: heading
    level: 1
    text: バッファの出力をテストする
  - kind: para
    text: --TEST--Compute 1 + 1 test--FILE--<?= 1 + 1 ?>--EXPECT--2
  - kind: para
    text: --TEST--GET $_ENV test--ENV--return <<<END a=AAA b=BBB END;--FILE--<?php
      echo getenv('a'), "\n";echo getenv('b'), "\n";?>--EXPECT--AAA BBB
  p40:
