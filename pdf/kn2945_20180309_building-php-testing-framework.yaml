  p115:
  - kind: para
    text: PHPUnitでの@dataProvider
  p116:
  - kind: para
    text: 名前も拝借していきましょう
  p117:
  - kind: heading
    level: 1
    text: fizzbuzz_test.php (Before)
  - kind: para
    text: <?php
  - kind: para
    text: function test_fizzbuzz(){assertThat(to_fizzbuzz(1), equalTo("1"));assertThat(to_fizzbuzz(3),
      equalTo("Fizz"));assertThat(to_fizzbuzz(5), equalTo("Buzz"));assertThat(to_fizzbuzz(10),
      equalTo("Buzz"));assertThat(to_fizzbuzz(15), equalTo("FizzBuzz"));}
  p118:
  - kind: heading
    level: 1
    text: fizzbuzz_test.php (After)
  - kind: para
    text: <?php/*** @dataProvider fizzbuzz_number_provider*/function test_fizzbuzz2($expected,
      $input){assertThat(to_fizzbuzz($input), equalTo($expected));}
  - kind: para
    text: function fizzbuzz_number_provider(){return [["1", 1],["Fizz", 3],["Buzz",
      5],["Buzz", 10],["FizzBuzz", 15],];}
  p119:
  - kind: para
    text: 実行側も書き換えていきます
  p120:
  - kind: heading
    level: 1
    text: assert_tests/run (2/3)
  - kind: para
    text: foreach (get_defined_functions(true)['user'] as $func) {if (strpos($func,
      'test_') === 0) {try {$func();echo '.';} catch (\Hamcrest\AssertionError $e)
      {$failures[] = $e;echo 'F';}catch (\Throwable $e) {$errors[] = $e;echo 'E';}}}echo
      PHP_EOL;
  p121:
  - kind: heading
    level: 1
    text: assert_tests/run After
  - kind: para
    text: foreach (get_defined_functions(true)['user'] as $func) {
  - kind: para
    text: 'if (strpos($func, ''test_'') === 0) {$provider = get_provider($func) ?:
      function (){ yield []; };'
  - kind: para
    text: foreach ($provider() as $args) {try {
  - kind: para
    text: $func(...$args);echo '.';} catch (\Hamcrest\AssertionError $e) {
  - kind: para
    text: $failures[] = ['error' => $e, 'args' => $args];echo 'F';
  - kind: para
    text: '}catch (\Throwable $e) {$errors[] = $e;echo ''E'';'
  - kind: para
    text: '}'
  p122:
  - kind: heading
    level: 1
    text: assert_tests/run getProvider
  - kind: para
    text: 'function get_provider(string $func_name): ?string{$ref = new \ReflectionFunction($func_name);'
  - kind: para
    text: // @dataProvider hogehoge を取り出すif (preg_match('/@dataProvider +(?<provider>\S+)/',$ref->getDocComment(),
      $m)) {return trim($m['provider']);}
  - kind: para
    text: return null;}
