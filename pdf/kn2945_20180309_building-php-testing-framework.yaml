      content: '% cd ~/pixiv/tests         % git ls-files ''*Test.php'' | wc -l         1606         % git ls-files ''*Test.php'' | xargs cat | wc -l 191890'
  p23:
  - node: p
    children:
    - node: text
      content: 'どうすれば書きやすく         メンテできるテストが書けるか悩み'
  p24:
  - node: p
    children:
    - node: text
      content: 本題の前に
  p25:
  - node: p
    children:
    - node: text
      content: さて
