  p26:
  - kind: para
    text: もっと強い混沌の力を手に入れたくはないか？
  p27: []
  p28:
  - kind: para
    text: ‒TextbringerでつくるTextbringer https://github.com/shugo/heiseirk01/blob/master/README.md
  p29:
  - kind: para
    text: Textbringerのあらゆる機能はRubyで実装されている
  p30:
  - kind: para
    text: Emacsのあらゆる機能はLispで実装されている
  p31:
  - kind: para
    text: Textbringerの機能開発時はeval_bufferで編集中のコードを評価して動かしながら開発できる
  p32:
  - kind: para
    text: Emacsの機能開発時はeval-bufferで編集中のコードを評価して動かしながら開発できる
  p33:
  - kind: para
    text: ためしにTextbringerのコードをEmacs Lispで書いてみよう
  p34: []
  p35: []
  p36:
  - kind: para
    text: ねっ､そっくり[要出典]でしょ？
  p37:
  - kind: para
    text: 🤔
  p38:
  - kind: para
    text: たぶん皆様が感じたよりはそっくりなのですが､RubyとLispの構文レベルの相似性というよりもTextbringerがEmacsを参考にしたAPIを提供していることが大きい
  p39:
  - kind: para
    text: ところで
