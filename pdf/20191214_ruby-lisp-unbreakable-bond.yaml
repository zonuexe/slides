    text: '平成Ruby会議01 2019-12-14 #heiseirubykaigi'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer, Rubyist
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5: []
  p6:
  - kind: para
    text: いちおう2010年頃にparse.yを弄って遊んでたり闇ルビヰ會議2011で初めて人前でしゃべったり2012年くらいまでRuby札幌方面に居たりしたルビーストです
  p7: []
  p8:
  - kind: para
    text: これは重要なことですが
  p9:
  - kind: para
    text: 平成元年1月生まれです
  p10: []
  p11:
  - kind: para
    text: ちなみにスライドの本文書体はゲームプラットフォーム様でenza絶賛運営されているアイドルマスター シャイニーカラーズというゲームで採用されているFOT-ハミング
      Stdです
  p12:
  - kind: para
    text: 事前知識
  p13:
  - kind: para
    text: この話で言及している“Lisp”は複数の言語の総称です
  p14:
  - kind: para
    text: C言語
  - kind: heading
    level: 1
    text: puts("foo")
  p15:
  - kind: para
    text: Ruby(
  - kind: heading
    level: 1
    text: puts "foo"
  p16:
  - kind: para
    text: Lisp(
  - kind: heading
    level: 1
    text: (puts "foo")
  p17:
  - kind: para
    text: (imaginary)
  - kind: heading
    level: 1
    text: (((((LISP)))))
  p18:
  - kind: para
    text: Common Lisp,Scheme, Clojure,Emacs Lisp
  p19:
  - kind: para
    text: それぞれの言語はC#とJavaくらい離れている
  p20:
  - kind: para
    text: あとLTなのでかっとばしてきます
  p21:
