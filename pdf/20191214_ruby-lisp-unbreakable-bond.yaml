text:
  p1:
  - node: p
    children:
    - node: bold
      content: RubyとLispの切っても切れない関係
  - node: p
    children:
    - node: text
      content: Why Emacs Lisp is an acceptable Ruby?
  - node: p
    children:
    - node: text
      content: '平成Ruby会議01 '
  - node: p
    children:
    - node: text
      content: '2019-12-14 #heiseirubykaigi'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
    - node: br
    - node: text
      content: 'うさみけんた (@tadsan)  '
  - node: p
    children:
    - node: text
      content: ' / Zonu.EXE'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'GitHub/Packagistでは id: zonuexe'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ピクシブ株式会社 pixiv運営本部
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer, Rubyist
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeのメンテナ引き継ぎました
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 好きなリスプはEmacs Lispです
        - node: li
          children:
          - node: text
            content: Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5: []
  p6:
  - node: p
    children:
    - node: text
      content: いちおう2010年頃にparse.yを 弄って遊んでたり闇ルビヰ會議
    - node: br
    - node: text
      content: 2011で初めて人前でしゃべった り2012年くらいまでRuby札幌 方面に居たりしたルビーストです
  p7: []
  p8:
  - node: p
    children:
    - node: text
      content: これは重要な
    - node: br
    - node: text
      content: ことですが
  p9:
  - node: p
    children:
    - node: text
      content: 平成元年1月 生まれです
  p10: []
  p11:
  - node: p
    children:
    - node: text
      content: ちなみにスライドの本文書体はゲームプラットフォームenza様で絶賛運営されているアイドルマスター シャイニーカラーズというゲームで採用されている FOT-ハミング Stdです
  p12:
  - node: p
    children:
    - node: text
      content: 事前知識
  p13:
  - node: p
    children:
    - node: text
      content: この話で言及して いる“Lisp”は複数 の言語の総称です
  p14:
  - node: p
    children:
    - node: text
      content: C言語
  - node: p
    children:
    - node: text
      content: puts("foo")
  p15:
  - node: p
    children:
    - node: text
      content: Ruby
  - node: p
    children:
    - node: text
      content: puts "foo"
  p16:
  - node: p
    children:
    - node: text
      content: Lisp
  - node: p
    children:
    - node: text
      content: (puts "foo")
  p17:
  - node: p
    children:
    - node: text
      content: (imaginary)
  - node: p
    children:
    - node: text
      content: (((((LISP)))))
  p18:
  - node: p
    children:
    - node: text
      content: 'Common Lisp, '
    - node: br
    - node: text
      content: 'Scheme, Clojure, '
    - node: br
    - node: text
      content: Emacs Lisp
  p19:
  - node: p
    children:
    - node: text
      content: それぞれの言語は C#とJavaくらい
    - node: br
    - node: text
      content: 離れている
  p20:
  - node: p
    children:
    - node: text
      content: あとLTなのでかっ
    - node: br
    - node: text
      content: とばしてきます
  p21:
  - node: p
    children:
    - node: text
      content: さて
  p22:
  - node: p
    children:
    - node: text
      content: '‒TextbringerでつくるTextbringer '
  - node: p
    children:
    - node: text
      content: https://github.com/shugo/heiseirk01/blob/master/README.md
  p23:
  - node: p
    children:
    - node: text
      content: shugoさんの発表 楽しかったですね
  p24: []
  p25:
  - node: p
    children:
    - node: text
      content: '‒TextbringerでつくるTextbringer '
  - node: p
    children:
    - node: text
      content: https://github.com/shugo/heiseirk01/blob/master/README.md
  p26:
  - node: p
    children:
    - node: text
      content: もっと強い混沌の 力を手に入れたく
    - node: br
    - node: text
      content: はないか？
  p27: []
  p28:
  - node: p
    children:
    - node: text
      content: '‒TextbringerでつくるTextbringer '
  - node: p
    children:
    - node: text
      content: https://github.com/shugo/heiseirk01/blob/master/README.md
  p29:
  - node: p
    children:
    - node: text
      content: 'Textbringerの '
    - node: br
    - node: text
      content: あらゆる機能はRuby
    - node: br
    - node: text
      content: で実装されている
  p30:
  - node: p
    children:
    - node: text
      content: 'Emacsの '
    - node: br
    - node: text
      content: あらゆる機能はLisp
    - node: br
    - node: text
      content: で実装されている
  p31:
  - node: p
    children:
    - node: text
      content: Textbringerの機能開発 時はeval_bufferで編集
    - node: br
    - node: text
      content: '中のコードを評価して '
    - node: br
    - node: text
      content: 動かしながら開発できる
  p32:
  - node: p
    children:
    - node: text
      content: Emacsの機能開発時は eval-bufferで編集中の
    - node: br
    - node: text
      content: 'コードを評価して '
    - node: br
    - node: text
      content: 動かしながら開発できる
  p33:
  - node: p
    children:
    - node: text
      content: ためしにTextbringer
    - node: br
    - node: text
      content: 'のコードをEmacs '
    - node: br
    - node: text
      content: Lispで書いてみよう
  p34: []
  p35: []
  p36:
  - node: p
    children:
    - node: text
      content: 'ねっ､そっくり '
  - node: p
    children:
    - node: text
      content: '[要出典]'
  - node: p
    children:
    - node: text
      content: でしょ？
  p37:
  - node: p
    children:
    - node: text
      content: 🤔
  p38:
  - node: p
    children:
    - node: text
      content: たぶん皆様が感じたよりはそっくり
    - node: br
    - node: text
      content: 'なのですが､RubyとLispの '
    - node: br
    - node: text
      content: 構文レベルの相似性というよりも TextbringerがEmacsを参考にし たAPIを提供していることが大きい
  p39:
  - node: p
    children:
    - node: text
      content: ところで
  p40:
  - node: p
    children:
    - node: text
      content: Ruby作者のMatz
    - node: br
    - node: text
      content: が言語おたくである
    - node: br
    - node: text
      content: ことは比較的有名
  p41:
  - node: p
    children:
    - node: text
      content: 'Rubyist Magazine - Rubyist Hotlinks 第1回 まつもとゆきひろ '
  - node: p
    children:
    - node: text
      content: https://magazine.rubyist.net/articles/0001/0001-Hotlinks.html
  p42:
  - node: p
    children:
    - node: text
      content: 'Gihyo.jp RubyKaigi 2013レポート '
  - node: p
    children:
    - node: text
      content: https://gihyo.jp/news/report/01/rubykaigi2013/0001
