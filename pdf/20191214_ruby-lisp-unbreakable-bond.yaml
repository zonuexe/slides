  - node: p
    children:
    - node: text
      content: 'amazon.co.jp - まつもとゆきひろ 言語のしくみ '
  - node: p
    children:
    - node: text
      content: https://www.amazon.co.jp/dp/B01N7JZXMD/
  p44:
  - node: p
    children:
    - node: text
      content: '時計の針は '
    - node: br
    - node: text
      content: 平成6年に戻る
  p45: []
  p46:
  - node: p
    children:
    - node: text
      content: '‒「まつもとゆきひろ 言語のしくみ」 2016 まつもとゆきひろ, 日経BP '
  - node: p
    children:
    - node: text
      content: https://books.google.co.jp/books?id=h9KjDwAAQBAJ&pg=PT67
  p47:
  - node: p
    children:
    - node: text
      content: RubyにSymbolとか when/unless文とか
    - node: br
    - node: text
      content: Kernel.#requireがあるのは (Emacs)Lispの影響だと思う
  p48:
  - node: p
    children:
    - node: text
      content: 'Matzから '
    - node: br
    - node: text
      content: 離れて
  p49:
  - node: p
    children:
    - node: text
      content: RuboCop
