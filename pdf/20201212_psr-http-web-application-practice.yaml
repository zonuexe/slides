  p29:
  - kind: heading
    level: 1
    text: HTTPリクエスト (ソケット読み書き)
  - kind: para
    text: 名前解決
  - kind: para
    text: ソケット接続
  - kind: para
    text: $ip = dns_get_record('httpbin.org', DNS_A)[0]['ip'];
  - kind: para
    text: $sock = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);
  - kind: para
    text: socket_connect($sock, $ip, 80) or
  - kind: para
    text: die(socket_strerror(socket_last_error()));
  - kind: para
    text: ソケット書込(リクエスト)
  - kind: para
    text: socket_write($sock, $request);
  - kind: para
    text: ソケット読込(レスポンス)
  - kind: para
    text: $response = '';
  - kind: para
    text: do {
  - kind: para
    text: $responses .= ($buf = socket_read($sock, 2048));
  - kind: para
    text: '} while ($buf !== '''');'
