  p25:
  - kind: heading
    level: 1
    text: http://httpbin.org/post
  - kind: para
    text: 'POST /post HTTP/1.1 Host: httpbin.org Accept: application/json Content-Type:
      application/json Connection: close'
  - kind: para
    text: '{"foo":"bar"}'
  p26:
  - kind: para
    text: ソケットが使える
  - kind: heading
    level: 1
    text: このルール通りにテキストを組み立てて
  - kind: heading
    level: 1
    text: TCPでいい感じに送ればHTTP通信できる
  p27:
  - kind: list
    items:
    - httpbin.org
    - HTTPリクエストに対してさまざまな返
  - kind: para
    text: 答してくれるWebサービス
  - kind: list
    items:
    - ブラウザ上からもテストできる
  p28:
  - kind: heading
    level: 1
    text: HTTPリクエスト (リクエスト組み立て)
  - kind: para
    text: リクエスト行
  - kind: para
    text: <?php
  - kind: para
    text: ヘッダフィールド
  - kind: para
    text: リクエストボディ
  - kind: para
    text: リクエスト行・ヘッダ
  - kind: para
    text: の区切りはCR+LF
  - kind: para
    text: '$request = implode("\r\n", [''POST /post HTTP/1.1'',''Host: httpbin.org'',''Accept:
      application/json'',''Content-Type: application/json'',''Connection: close'','''',json_encode([''foo''
      => ''bar'']),]);'
  - kind: para
    text: (\r\n)
  p29:
  - kind: heading
    level: 1
    text: HTTPリクエスト (ソケット読み書き)
  - kind: para
    text: 名前解決
  - kind: para
    text: ソケット接続
  - kind: para
    text: $ip = dns_get_record('httpbin.org', DNS_A)[0]['ip'];$sock = socket_create(AF_INET,
      SOCK_STREAM, SOL_TCP);socket_connect($sock, $ip, 80) or die(socket_strerror(socket_last_error()));
  - kind: para
    text: ソケット書込(リクエスト)
  - kind: para
    text: socket_write($sock, $request);
  - kind: para
    text: ソケット読込(レスポンス)
  - kind: para
    text: $response = '';do {$responses .= ($buf = socket_read($sock, 2048));} while
      ($buf !== '');
  p30:
  - kind: para
    text: ご安心ください
  - kind: para
    text: ところで、この方法で簡単に通信できるのはHTTP/1.1以下だけ。
  - kind: para
    text: HTTPSやHTTP/2では困難。
  p31:
  - kind: para
    text: HTTPSだろうとブラウザからは通信は簡単に見れる
  p32:
  - kind: para
    text: Webブラウザの開発者ツール
  p33:
  - kind: heading
    level: 1
    text: さて
  p34:
  - kind: para
    text: リクエストを送る人が居ればリクエストを受け取る人も居る
  p35:
