  p79:
  - kind: para
    text: 3. PSR-7/15/17ベースの実装と勘所
  p80:
  - kind: para
    text: お待たせしましたここからWebアプリを作りはじめましょう
  p81:
  - kind: list
    items:
    - 実装を選ぶ
    - PSRは飽くまでインターフェイス
    - オブジェクトは別に必要
  p82:
  - kind: list
    items:
    - PSR-7/PSR-17
    - Guzzleもいいがnyholm/psr7を使う
    - SAPIとの入出力
    - nyholm/psr7-server
    - narrowspark/http-emitter
  p83:
  - kind: list
    items:
    - ServerRequestInterface
    - Requestにスーパーグローバル
  - kind: para
    text: ($_GETなど)相当+Attributeを付与して引き回せる
  p84:
  - kind: list
    items:
    - Emitter
    - Responseオブジェクトを出力
  - kind: para
    text: (echo)
  - kind: list
    items:
    - HTTPヘッダに合わせてheader()関数
  - kind: para
    text: を呼ぶ
  p85:
  - kind: heading
    level: 1
    text: プロジェクト初期化
  - kind: heading
    level: 2
    text: https://github.com/zonuexe/phpcon-psr-app
  - kind: para
    text: '% composer require nyholm/psr7 nyholm/psr7-server% composer require narrowspark/http-emitter'
  - kind: para
    text: '# サーバー起動% php -S localhost:3939 -t public/ ./public/index.php'
  p86:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: <?php declare(strict_types=1);use Narrowspark\HttpEmitter\SapiEmitter;use
      Nyholm\Psr7\Factory\Psr17Factory;use Nyholm\Psr7Server\ServerRequestCreator;require
      __DIR__ . '/../vendor/autoload.php';
  - kind: para
    text: $psr17Factory = new Psr17Factory();$creator = new ServerRequestCreator($psr17Factory,
      // ServerRequestFactory$psr17Factory, // UriFactory$psr17Factory, // UploadedFileFactory$psr17Factory
      // StreamFactory);
  p87:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: $serverRequest = $creator->fromGlobals();
  - kind: para
    text: $response = $psr17Factory->createResponse()；->withHeader('Content-Type',
      'text/plain')->withBody($psr17Factory->createStream('Hello!'));
  - kind: para
    text: $emitter = new SapiEmitter();$emitter->emit($response);
  p88:
  - kind: list
    items:
    - ControllerでResponseを返してみる
    - RequestHandlerで実装するとLaravel
  - kind: para
    text: のSingle Action Controllerっぽくなる
  - kind: list
    items:
    - __invoke()ではなくhandle()に
  p89:
  - kind: list
    items:
    - '注意: 今回はControllerを'
  - kind: para
    text: RequestHandlerにしているが、別の方法で安全に起動できる手段があれば他の方法でもよい
  p90:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/Hello.php
  - kind: para
    text: final class Hello implements RequestHandlerInterface{private StreamFactory
      $stream_factory;private ResponseFactory $response_factory;
  - kind: para
    text: public function __construct(ResponseFactory $response_factory,StreamFactory
      $stream_factory) {$this->response_factory = $response_factory;$this->stream_factory
      = $stream_factory;}
  p91:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/Hello.php
  - kind: para
    text: 'public function handle(Request $request): Response{return $this->response_factory->createResponse()->withHeader(''Content-Type'',
      ''text/plain'')->withBody($this->stream_factory->createStream(''Hello!''));}}'
  p92:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: $serverRequest = $creator->fromGlobals();
  - kind: para
    text: $hello = new Hello($psr17Factory, $psr17Factory);$response = $hello->handle($serverRequest);
  - kind: para
    text: $emitter = new SapiEmitter();$emitter->emit($response);
  p93:
  - kind: list
    items:
    - せっかくなので、超簡単な
  - kind: para
    text: ルーターも作っていきましょう
  p94:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: $router = new StaticRouter(['/' => ['GET'=>fn() => new Index($psr17, $psr17)],'/hello'
      => ['GET'=>fn()=> new Hello($psr17, $psr17)],], fn() => new ErrorPage($psr17Factory,
      $psr17Factory));
  - kind: para
    text: $response = $router->handle($serverRequest);
  - kind: para
    text: $emitter = new SapiEmitter();$emitter->emit($response);
  p95:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/StaticRouter.php
  - kind: para
    text: final class StaticRouter implements RequestHandlerInterface{private array
      $routes;private Closure $error_page;
  - kind: para
    text: public function __construct(array $routes, Closure$error_page){$this->routes
      = $routes;$this->error_page = $error_page;}
  p96:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/StaticRouter.php
  - kind: para
    text: 'public function handle(Request $request): Response{$path = $request->getUri()->getPath();$method
      = $request->getMethod();'
  - kind: para
    text: return ($this->routes[$path][$method]?? $this->error_page)()->handle($request);}}
  p97:
  - kind: list
    items:
    - 既存のミドルウェアを導入していく
    - https://github.com/middlewares/psr15-middle
  - kind: para
    text: wares のプロジェクトがさまざまなミドルウェアを既に実装している
  p98:
  - kind: list
    items:
    - オブジェクトの生成をどうするか
    - 今回は数が少ないのですべて
    - https://github.com/phppg/phperkaigi-golf では
  - kind: para
    text: PHP-DIにオブジェクトの生成とディスパッチを任せている
  p99:
  - kind: list
    items:
    - ServerRequestと型付けの問題
    - ServerRequest::getParsedBody()や
  - kind: para
    text: getQueryParams()から値を取り出すのは$_GETと大差ない
  - kind: list
    items:
    - getAttributeの値も現状
  - kind: para
    text: '@varなどで明示的に型付けが必要'
