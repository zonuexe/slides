  p24:
  - kind: heading
    level: 1
    text: HTTPリクエスト
  - kind: para
    text: リクエスト行
  - kind: para
    text: ヘッダフィールド
  - kind: para
    text: 'POST /post HTTP/1.1 Host: httpbin.org Accept: application/json Content-Type:
      application/json Connection: close'
  - kind: para
    text: リクエストボディ
  - kind: para
    text: '{"foo":"bar"}'
  - kind: para
    text: リクエスト行・ヘッダ
  - kind: para
