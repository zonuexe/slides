  - kind: heading
    level: 1
    text: 2013年にはこういう
  - kind: heading
    level: 1
    text: のもあった
  - kind: para
    text: https://stackphp.com/ より引用
  p72:
  - kind: heading
    level: 1
    text: https://stackphp.com/ より引用
  p73:
  - kind: heading
    level: 1
    text: https://stackphp.com/ より引用
  p74:
  - kind: para
    text: そこで出てくるのが
  - kind: para
    text: PHP-FIGとPSR
  p75:
  - kind: list
    items:
    - PHP-FIG
    - PHP Framework Interop Group
  - kind: para
    text: (フレームワーク相互運用グループ)
  - kind: list
    items:
    - PSR
    - PHP Standard Recommendation
  - kind: para
    text: (PHP標準勧告)
  p76:
  - kind: para
    text: 経緯はsasezakiさんの
  - kind: para
    text: 「憂鬱な希望としての PSR-7」を参照
  p77:
  - kind: heading
    level: 1
    text: 時は流れて2018年
  - kind: para
    text: 'PSR-15: HTTP Server Request Handlers'
  - kind: para
    text: 'PSR-17: HTTP Factories'
  - kind: heading
    level: 1
    text: が受理
  p78:
  - kind: para
    text: これで晴れて具象への依存を避けつつPSR
  - kind: para
    text: ベースのWebアプリを書けるようになったとい
  - kind: para
    text: う話は、田中ひさてるさんの
  - kind: para
    text: PHP-FIGのHTTP処理標準の設計はなぜ
  - kind: para
    text: PSR-7/15/17になったのか
  - kind: para
    text: を参照ください
  p79:
  - kind: para
    text: 3. PSR-7/15/17ベー
  - kind: para
    text: スの実装と勘所
  p80:
  - kind: para
    text: お待たせしました
  - kind: para
    text: ここからWebアプリを
  - kind: para
    text: 作りはじめましょう
  p81:
  - kind: list
    items:
    - 実装を選ぶ
    - PSRは飽くまでインターフェイス
    - オブジェクトは別に必要
  p82:
  - kind: list
    items:
    - PSR-7/PSR-17
    - Guzzleもいいがnyholm/psr7を使う
    - SAPIとの入出力
    - nyholm/psr7-server
    - narrowspark/http-emitter
  p83:
  - kind: list
    items:
    - ServerRequestInterface
    - Requestにスーパーグローバル
  - kind: para
    text: ($_GETなど)相当+Attributeを
  - kind: para
    text: 付与して引き回せる
  p84:
  - kind: list
    items:
    - Emitter
    - Responseオブジェクトを出力
  - kind: para
    text: (echo)
  - kind: list
    items:
    - HTTPヘッダに合わせてheader()関数
  - kind: para
    text: を呼ぶ
  p85:
  - kind: heading
    level: 1
    text: プロジェクト初期化
  - kind: heading
    level: 2
    text: https://github.com/zonuexe/phpcon-psr-app
  - kind: para
    text: '% composer require nyholm/psr7 nyholm/psr7-server'
  - kind: para
    text: '% composer require narrowspark/http-emitter'
  - kind: para
    text: '# サーバー起動'
  - kind: para
    text: '% php -S localhost:3939 -t public/ ./public/index.php'
  p86:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: <?php declare(strict_types=1);
  - kind: para
    text: use Narrowspark\HttpEmitter\SapiEmitter;
  - kind: para
    text: use Nyholm\Psr7\Factory\Psr17Factory;
  - kind: para
    text: use Nyholm\Psr7Server\ServerRequestCreator;
  - kind: para
    text: require __DIR__ . '/../vendor/autoload.php';
  - kind: para
    text: $psr17Factory = new Psr17Factory();
  - kind: para
    text: $creator = new ServerRequestCreator(
  - kind: para
    text: $psr17Factory, // ServerRequestFactory
  - kind: para
    text: $psr17Factory, // UriFactory
  - kind: para
    text: $psr17Factory, // UploadedFileFactory
  - kind: para
    text: $psr17Factory // StreamFactory
  - kind: para
    text: );
  p87:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: $serverRequest = $creator->fromGlobals();
  - kind: para
    text: $response = $psr17Factory->createResponse()；
  - kind: para
    text: ->withHeader('Content-Type', 'text/plain')
  - kind: para
    text: ->withBody($psr17Factory->createStream('Hello!'));
  - kind: para
    text: $emitter = new SapiEmitter();
  - kind: para
    text: $emitter->emit($response);
  p88:
  - kind: list
    items:
    - ControllerでResponseを返してみる
    - RequestHandlerで実装するとLaravel
  - kind: para
    text: のSingle Action Controllerっぽくなる
  - kind: list
    items:
    - __invoke()ではなくhandle()に
  p89:
  - kind: list
    items:
    - '注意: 今回はControllerを'
  - kind: para
    text: RequestHandlerにしているが、
  - kind: para
    text: 別の方法で安全に起動できる手段が
  - kind: para
    text: あれば他の方法でもよい
  p90:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/Hello.php
  - kind: para
    text: final class Hello implements RequestHandlerInterface
  - kind: para
    text: '{'
  - kind: para
    text: private StreamFactory $stream_factory;
  - kind: para
    text: private ResponseFactory $response_factory;
  - kind: para
    text: public function __construct(
  - kind: para
    text: ResponseFactory $response_factory,
  - kind: para
    text: StreamFactory $stream_factory
  - kind: para
    text: ) {
  - kind: para
    text: $this->response_factory = $response_factory;
  - kind: para
    text: $this->stream_factory = $stream_factory;
  - kind: para
    text: '}'
  p91:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/Hello.php
  - kind: para
    text: 'public function handle(Request $request): Response'
  - kind: para
    text: '{'
  - kind: para
    text: return $this->response_factory->createResponse()
  - kind: para
    text: ->withHeader('Content-Type', 'text/plain')
  - kind: para
    text: ->withBody(
  - kind: para
    text: $this->stream_factory->createStream('Hello!')
  - kind: para
    text: );
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p92:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: $serverRequest = $creator->fromGlobals();
  - kind: para
    text: $hello = new Hello($psr17Factory, $psr17Factory);
  - kind: para
    text: $response = $hello->handle($serverRequest);
  - kind: para
    text: $emitter = new SapiEmitter();
  - kind: para
    text: $emitter->emit($response);
  p93:
  - kind: list
    items:
    - せっかくなので、超簡単な
  - kind: para
    text: ルーターも作っていきましょう
  p94:
  - kind: heading
    level: 1
    text: public/index.php
  - kind: para
    text: $router = new StaticRouter([
  - kind: para
    text: '''/'' => [''GET''=>fn() => new Index($psr17, $psr17)],'
  - kind: para
    text: '''/hello'' => [''GET''=>fn()=> new Hello($psr17, $psr17)],'
  - kind: para
    text: '], fn() => new ErrorPage($psr17Factory, $psr17Factory));'
  - kind: para
    text: $response = $router->handle($serverRequest);
  - kind: para
    text: $emitter = new SapiEmitter();
  - kind: para
    text: $emitter->emit($response);
  p95:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/StaticRouter.php
  - kind: para
    text: final class StaticRouter implements
  - kind: para
    text: RequestHandlerInterface
  - kind: para
    text: '{'
  - kind: para
    text: private array $routes;
  - kind: para
    text: private Closure $error_page;
  - kind: para
    text: public function __construct(array $routes, Closure
  - kind: para
    text: $error_page)
  - kind: para
    text: '{'
  - kind: para
    text: $this->routes = $routes;
  - kind: para
    text: $this->error_page = $error_page;
  - kind: para
    text: '}'
  p96:
  - kind: heading
    level: 1
    text: src/Http/RequestHandler/StaticRouter.php
  - kind: para
    text: 'public function handle(Request $request): Response'
  - kind: para
    text: '{'
  - kind: para
    text: $path = $request->getUri()->getPath();
  - kind: para
    text: $method = $request->getMethod();
  - kind: para
    text: return (
  - kind: para
    text: $this->routes[$path][$method]
  - kind: para
    text: ?? $this->error_page
  - kind: para
    text: )()->handle($request);
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p97:
  - kind: list
    items:
    - 既存のミドルウェアを導入していく
    - https://github.com/middlewares/psr15-middle
  - kind: para
    text: wares のプロジェクトがさまざまなミド
  - kind: para
    text: ルウェアを既に実装している
  p98:
  - kind: list
    items:
    - オブジェクトの生成をどうするか
    - 今回は数が少ないのですべて
    - https://github.com/phppg/phperkaigi-golf では
  - kind: para
    text: PHP-DIにオブジェクトの生成とディス
  - kind: para
    text: パッチを任せている
  p99:
  - kind: list
    items:
    - ServerRequestと型付けの問題
    - ServerRequest::getParsedBody()や
  - kind: para
    text: getQueryParams()から値を取り出す
  - kind: para
    text: のは$_GETと大差ない
  - kind: list
    items:
    - getAttributeの値も現状
  - kind: para
    text: '@varなどで明示的に型付けが必要'
