    - ヘッダを全て大文字 - を_に変換
    - Content-Type ⇒
  - kind: para
    text: $_SERVER['HTTP_CONTENT_TYPE']
  p42:
  - kind: list
    items:
    - PHPとSAPI (ServerAPI)
