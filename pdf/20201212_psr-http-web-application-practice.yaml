  p43:
  - kind: heading
    level: 1
    text: HTTPレスポンス
  p44:
  - kind: heading
    level: 1
    text: HTTPレスポンス
  - kind: para
    text: バージョン/ステータス
  - kind: para
    text: ヘッダフィールド
  - kind: para
    text: 'HTTP/1.1 200 OK Date: Fri, 11 Dec 2020 16:20:18 GMT Content-Type: application/json
      Content-Length: 339 Connection: close Server: gunicorn/19.9.0 Access-Control-Allow-Origin:
      *Access-Control-Allow-Credentials: true'
  - kind: para
    text: レスポンスボディ
  - kind: para
    text: '{"json":"response..."}'
  p45:
  - kind: heading
    level: 1
    text: HTTPレスポンス
  - kind: para
    text: バージョン/ステータス
  - kind: para
    text: ヘッダフィールド
  - kind: para
    text: 'HTTP/1.1 200 OK Date: Fri, 11 Dec 2020 16:20:18 GMT Content-Type: text/html
      Content-Length: 339 Connection: close Access-Control-Allow-Origin: *Access-Control-Allow-Credentials:
      true'
  - kind: para
    text: レスポンスボディ
  - kind: para
    text: <!DOCTYPE html><html><head>
  p46:
  - kind: para
    text: PHPではechoなどで出力したものはそのままレスポンスボディになる
  - kind: para
    text: (レスポンスヘッダは、ボディをechoする前にheader()を呼んでおく)
  p47:
  - kind: heading
    level: 1
    text: PHPでは基本的にこれだけ
  - kind: para
    text: '<?php header(''Content-Type: application/json'');header(''Access-Control-Allow-Origin:
      *'');header(''Access-Control-Allow-Credentials: true'');'
  - kind: para
    text: echo json_encode($data);
  p48:
  - kind: heading
    level: 1
    text: PHPでは基本的にこれだけ
  - kind: para
    text: '<?php header(''Content-Type: text/html'');header(''Access-Control-Allow-Origin:
      *'');header(''Access-Control-Allow-Credentials: true'');?><!DOCTYPE html><html><head>...'
  p49:
  - kind: heading
    level: 1
    text: PHPでは基本的にこれだけ
  - kind: para
    text: '<?php header(''Content-Type: image/png'');header(''Access-Control-Allow-Origin:
      *'');header(''Access-Control-Allow-Credentials: true'');'
  - kind: para
    text: // 画像ファイルをそのまま返すこともできるreadfile(__DIR__ . '/../storage/flower.png');
  p50:
  - kind: list
    items:
    - PerlやRubyなどの言語のCGI機能はあ
  - kind: para
    text: くまでもライブラリだが、PHPはServer APIとしてHTTP処理が言語処理系と統合されている
  p51:
  - kind: list
    items:
    - スーパーグローバル変数
    - $_GET, $_POST, $_REQUEST
  - kind: para
    text: $_SERVER, $_COOKIE, $FILES
  - kind: list
    items:
    - グローバル関数
    - header(), setcookie(), session
  p52:
  - kind: para
    text: ならPHPの基本機能をそのまま使うのが一番自然でいいのでは
  p53:
  - kind: heading
    level: 1
    text: そうともいかない事情がある
  p54:
  - kind: para
    text: グローバルはテストとひたすら相性が悪い
  - kind: list
    items:
    - スーパーグローバル変数
    - $_GET, $_POST, $_REQUEST
  - kind: para
    text: $_SERVER, $_COOKIE, $FILES
  - kind: list
    items:
    - グローバル関数
    - header(), setcookie(), session
  p55:
  - kind: list
    items:
    - なぜテストと相性が悪いのか
    - 一般的なユニットテストはテスト対象
  - kind: para
    text: に引数を与えて、その返り値をアサーションする
  - kind: list
    items:
    - 実装が引数以外のものに依存すると
  - kind: para
    text: テストしにくい
  p56:
  - kind: list
    items:
    - とはいえグローバル変数はどうにかな
  - kind: para
    text: る
  - kind: list
    items:
    - PHPUnitならテストケース実行前の
  - kind: para
    text: setUp()で確実にリセットしておけばいい
  p57:
  - kind: list
    items:
    - header()/setcookieとCLIの相性
    - PHPUnitのテスト対象で呼ばれると
  - kind: para
    text: Warningで止まる
  - kind: list
    items:
    - 'Warning: Cannot modify header'
  - kind: para
    text: information
  p58:
  - kind: list
    items:
    - header()/setcookieとCLIの相性
    - 「特定の場合にヘッダ／Cookieが送
  - kind: para
    text: 信されること」のようなアサーションは書けない
  - kind: list
    items:
    - ラッパー関数などの工夫で可能
    - 弊社ではStaticMockで対応
  p59:
  - kind: para
    text: 2. HTTPとフレームワークとPSR
  p60:
  - kind: para
    text: ここまでの問題点を整理しよう
  p61:
  - kind: list
    items:
    - PHPのHTTP機能はグローバルな
  - kind: para
    text: 状態と密結合している
  - kind: list
    items:
    - 操作できないグローバルな状態が
  - kind: para
    text: 存在すると引数と返り値によるアサーションに落とし込めない
  p62:
  - kind: para
    text: それならHTTPを引数と返り値で扱える場所に持ってくればいい
  p63:
  - kind: para
    text: HTTPの構造は決まってるわけじゃないですか
  p64:
  - kind: heading
    level: 1
    text: HTTPリクエスト
  - kind: para
    text: リクエスト行
  - kind: para
    text: ヘッダフィールド
  - kind: para
    text: 'POST /post HTTP/1.1 Host: httpbin.org Accept: application/json Content-Type:
      application/json Connection: close'
  - kind: para
    text: リクエストボディ
  - kind: para
    text: '{"foo":"bar"}'
