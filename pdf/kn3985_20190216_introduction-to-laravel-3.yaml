    - node: br
    - node: text
      content: after=v3.0.1
  p24:
  - node: p
    children:
    - node: text
      content: '＿人人人人人人人人＿ '
    - node: br
    - node: text
      content: 3.0以前がない
    - node: br
    - node: text
      content: ＞　 　＜ ￣Y^Y^Y^Y^Y^Y^Y^Y^￣
  p25:
  - node: p
    children:
    - node: text
      content: じゃあ3.2.14で
  p26:
  - node: p
    children:
    - node: text
      content: Laravel3に入門してみる
  - node: p
    children:
    - node: text
      content: Let's begin with Laravel 3
  - node: p
    children:
    - node: text
      content: 2019-02-16 Laravel JP Conference
  - node: p
    children:
    - node: text
