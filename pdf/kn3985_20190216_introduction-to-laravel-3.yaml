  p7:
  - node: p
    children:
    - node: text
      content: 経歴上PHPのフレー ムワークを深く使う ことは全然なかった
  p8:
  - node: p
    children:
    - node: text
      content: PHP界隈でのLTデビュー戦(2015年11月)
  p9:
  - node: p
    children:
    - node: text
      content: フレームワーク
    - node: br
    - node: text
      content: を作るのは
  - node: p
    children:
    - node: text
      content: 難しいのか？
  p10:
  - node: p
    children:
    - node: text
      content: Laravelのように多くの
  - node: p
    children:
    - node: text
      content: 局面で受け入れられる
  - node: p
    children:
    - node: text
      content: フレームワークを
  - node: p
    children:
    - node: text
      content: 設計するのは難しい
  p11:
  - node: p
    children:
    - node: text
      content: 自分の問題を解決する
    - node: br
    - node: text
      content: 小さなフレームワークを 作るのはそれほどでもない
  p12:
  - node: p
    children:
    - node: text
      content: Create your own PHP Framework
  p13:
  - node: p
    children:
    - node: text
      content: PHPer人生、一度はフレームワークを作っておこう
  p14:
  - node: p
    children:
    - node: text
      content: 実運用する上での数々の リスクは一旦置いておいて
  - node: p
    children:
    - node: text
      content: (セキュリティとか)
  p15:
  - node: p
    children:
    - node: text
      content: 理解＞作る
    - node: br
    - node: text
      content: (自分で動かすだけなら)
  p16:
  - node: p
    children:
    - node: text
      content: それからまあまあ
  - node: p
    children:
    - node: text
      content: 経験を積んで
  - node: p
    children:
    - node: text
      content: 2019年
  p17:
  - node: p
    children:
    - node: text
      content: 'そういえばLaravel JP '
    - node: br
    - node: text
      content: Conferenceのスタッフに
  - node: p
    children:
    - node: text
      content: なったけど人生でLaravelを
  - node: p
    children:
    - node: text
      content: 10行くらいしか書いてない
  p18:
  - node: p
    children:
    - node: text
      content: '　 　　　　 | '
    - node: br
    - node: text
