text:
  p1:
  - kind: heading
    level: 1
    text: Laravel3に入門してみる
  - kind: para
    text: Let's begin with Laravel 3
  - kind: para
    text: 2019-02-16 Laravel JP Conference
  - kind: para
    text: 'Shibaura, Tokyo, Japan #laraveljpcon'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: さて
  p6:
  - kind: para
    text: PHP界隈でのLTデビュー戦(2015年11月)
  p7:
  - kind: para
    text: 経歴上PHPのフレー
  - kind: para
    text: ムワークを深く使う
  - kind: para
    text: ことは全然なかった
  p8:
  - kind: para
    text: PHP界隈でのLTデビュー戦(2015年11月)
  p9:
  - kind: para
    text: フレームワーク
  - kind: para
    text: を作るのは
  - kind: para
    text: 難しいのか？
  p10:
  - kind: para
    text: Laravelのように多くの
  - kind: para
    text: 局面で受け入れられる
  - kind: para
    text: フレームワークを
  - kind: para
    text: 設計するのは難しい
  p11:
  - kind: para
    text: 自分の問題を解決する
  - kind: para
    text: 小さなフレームワークを
  - kind: para
    text: 作るのはそれほどでもない
  p12:
  - kind: para
    text: Create your own PHP Framework
  p13:
  - kind: para
    text: PHPer人生、一度はフレームワークを作っておこう
  p14:
  - kind: para
    text: 実運用する上での数々の
  - kind: para
    text: リスクは一旦置いておいて
  - kind: para
    text: (セキュリティとか)
  p15:
  - kind: heading
    level: 1
    text: 理解＞作る
  - kind: para
    text: (自分で動かすだけなら)
  p16:
  - kind: para
    text: それからまあまあ
  - kind: para
    text: 経験を積んで
  - kind: para
    text: 2019年
  p17:
  - kind: para
    text: そういえばLaravel JP
  - kind: para
    text: Conferenceのスタッフに
  - kind: para
    text: なったけど人生でLaravelを
  - kind: para
    text: 10行くらいしか書いてない
  p18:
  - kind: heading
    level: 1
    text: そうだLaravelやろう
  - kind: para
    text: '|'
  - kind: para
    text: ＼ __ ／
  - kind: para
    text: ＿ （ｍ） ＿ ﾋﾟｺｰﾝ
  - kind: para
    text: '|ミ|'
  - kind: para
    text: ／ ｀´ ＼
  - kind: para
    text: ('A`)
  - kind: para
    text: ノヽノヽ
  - kind: para
    text: くく
  p19:
  - kind: para
    text: しかし良い解説書は既にあ
  - kind: para
    text: るし、ここはLaravel JP
  - kind: para
    text: Conferenceなんだから
  - kind: para
    text: 大多数は体験済み
  p20:
  - kind: heading
    level: 1
    text: そうだ、Laravel 1.0
  - kind: para
    text: '|'
  - kind: para
    text: ＼ __ ／
  - kind: para
    text: ＿ （ｍ） ＿ ﾋﾟｺｰﾝ
  - kind: para
    text: '|ミ|'
  - kind: para
    text: ／ ｀´ ＼
  - kind: para
    text: ('A`)
  - kind: para
    text: ノヽノヽ
  - kind: para
    text: くく
  p21:
  - kind: para
    text: 元ねた：Rails 1.0のコードを読む
  p22:
  - kind: para
    text: そうして我々は
  - kind: para
    text: GitHubの奥地へと
  - kind: para
    text: 旅立った
  p23:
  - kind: para
    text: https://github.com/laravel/laravel/releases?
  - kind: para
    text: after=v3.0.1
  p24:
  - kind: para
    text: ＿人人人人人人人人＿
  - kind: para
    text: ＞ 3.0以前がない ＜
  - kind: para
    text: ￣Y^Y^Y^Y^Y^Y^Y^Y^￣
  p25:
  - kind: para
    text: じゃあ3.2.14で
  p26:
  - kind: heading
    level: 1
    text: Laravel3に入門してみる
  - kind: para
    text: Let's begin with Laravel 3
  - kind: para
    text: 2019-02-16 Laravel JP Conference
  - kind: para
    text: 'Shibaura, Tokyo, Japan #laraveljpcon'
  p27:
  - kind: para
    text: このバージョン
  - kind: para
    text: を選んだ理由
  p28:
  - kind: para
    text: https://github.com/laravel/laravel/releases/tag/v3.2.14
  p29:
  - kind: para
    text: たぶん1.xとか2.x
  - kind: para
    text: のコードも漁れば
  - kind: para
    text: あるとは思うけど
  p30:
  - kind: para
    text: Laravel 3.2.14の特徴
  - kind: para
    text: 2013年3月22日リリース
  - kind: para
    text: 3.x系の最終バージョン
  - kind: para
    text: 新しい方が些細なバグも解消
  - kind: para
    text: されてるだろ、という日和
  - kind: para
    text: 古いPHPフレームワークの特徴
  - kind: para
    text: が色濃く残っている
  p31:
  - kind: para
    text: 古いフレームワークの特徴？
  - kind: para
    text: 依存パッケージ(Symfony)の
  - kind: para
    text: コピーも直接コミットされてる
  - kind: para
    text: Symfonyのcomposer.jsonは
  - kind: para
    text: 同梱されてるが、Laravel自体
  - kind: para
    text: はComposer未採用
  - kind: para
    text: 全コードが1リポジトリにある
  p32:
  - kind: para
    text: ということで
  - kind: para
    text: コードリーディングを
  - kind: para
    text: 始めました
  p33:
  - kind: para
    text: この時点で
  - kind: para
    text: 14時くらい
  - kind: para
    text: (当日スタッフのシフト後)
  p34:
  - kind: para
    text: やったこと
  p35:
  - kind: para
    text: Phanを
  - kind: para
    text: 使いましょう
  p36:
  - kind: para
    text: 理由
  - kind: para
    text: PHP7の非互換を早めに潰す
  - kind: para
    text: Laravelの特徴的なメタプログ
  - kind: para
    text: ラミングを炙りだす
  - kind: para
    text: Phanで静的にわからない＝
  - kind: para
    text: 妖怪のしわざメタプログラミング
  p37:
  - kind: para
    text: yield関数 (5.5以降SyntaxError)
  p38:
  - kind: para
    text: SyntaxErrorに
  - kind: para
    text: なるような
  - kind: para
    text: 非互換はこれだけ
  p39:
  - kind: para
    text: 改行位置 (C#っぽい)
  p40:
  - kind: para
    text: PHPDocはかなり書かれてる
  p41:
  - kind: heading
    level: 1
    text: namespaceの位置が独特
  - kind: para
    text: ファイル名が
  - kind: para
    text: 小文字
  p42:
  - kind: para
    text: 表層的な
  - kind: para
    text: ことはもういい
  p43:
  - kind: para
    text: 動かそう
  p44:
  - kind: para
    text: PHP 7.3で
  p45:
  - kind: para
    text: mcryptに依存してる
  p46:
  - kind: para
    text: キー長のパディング
  p47:
  - kind: para
    text: めんどくさいのでビルトインWebサーバ
  - kind: para
    text: php -S localhost:3939 public/index.php
  p48:
  - kind: para
    text: 動いた！
  p49:
  - kind: para
    text: 見ためがプレーン
  - kind: para
    text: だけど実はHTML5
  p50:
  - kind: para
    text: localhostでドキュメントも読める
  p51:
  - kind: para
    text: 2013年時点で
  - kind: para
    text: ホスピタリティ
  - kind: para
    text: すごい
  p52:
  - kind: para
    text: 動いたので
  - kind: para
    text: 雑に実装していく
  p53:
  - kind: para
    text: ルーティング追加は(表面的に)大差ない
  p54:
  - kind: para
    text: フォームの受け取りがわからなかった
  - kind: para
    text: (Symfony\HttpFoundation依存)
  p55:
  - kind: para
    text: Bladeは
  - kind: para
    text: Laravel3で導入
  p56:
  - kind: para
    text: いま気付いたけどBlade
  - kind: para
    text: ってASP.netのRazorの
  - kind: para
    text: オマージュじゃん
  p57:
  - kind: para
    text: オチはないけど
  - kind: para
    text: まとめ
  p58:
  - kind: para
    text: 雑にWebアプリっ
  - kind: para
    text: ぽいものを作る
  - kind: para
    text: ことはできた
  p59:
  - kind: para
    text: 癖がわかれば
  - kind: para
    text: コードは読み
  - kind: para
    text: やすかった
  p60:
  - kind: para
    text: 依存関係がリポジト
  - kind: para
    text: リ内に全部あるので
  - kind: para
    text: 追いやすかった
  p61:
  - kind: para
    text: コードは90000行くらい
  - kind: para
    text: (コメント/空行含む)
  - kind: para
    text: 当然全部は読んでない
  p62:
  - kind: para
    text: doc消し忘れた
  - kind: para
    text: Laravelアプリとか
  - kind: para
    text: この世にありそう
  p63:
  - kind: para
    text: 内部実装的なエッセン
  - kind: para
    text: スがどの程度Laravel4以
  - kind: para
    text: 降に引き継がれてるか
  - kind: para
    text: はわからない
  p64:
  - kind: para
    text: 表面的には同じだと
  - kind: para
    text: 言ったが細かいAPI
  - kind: para
    text: は「かなり」異なる
