  p27:
  - node: p
    children:
    - node: text
      content: このバージョン
    - node: br
    - node: text
      content: を選んだ理由
  p28:
  - node: p
    children:
    - node: text
      content: https://github.com/laravel/laravel/releases/tag/v3.2.14
  p29:
  - node: p
    children:
    - node: text
      content: たぶん1.xとか2.x のコードも漁れば あるとは思うけど
  p30:
  - node: p
    children:
    - node: text
      content: Laravel 3.2.14の特徴
  - node: p
    children:
    - node: text
      content: 2013年3月22日リリース 3.x系の最終バージョン
    - node: br
    - node: text
      content: 新しい方が些細なバグも解消 されてるだろ、という日和
    - node: br
    - node: text
      content: 古いPHPフレームワークの特徴
    - node: br
    - node: text
      content: が色濃く残っている
  p31:
  - node: p
    children:
    - node: text
      content: 古いフレームワークの特徴？
  - node: p
    children:
    - node: text
      content: 依存パッケージ(Symfony)の コピーも直接コミットされてる Symfonyのcomposer.jsonは 同梱されてるが、Laravel自体
    - node: br
    - node: text
      content: はComposer未採用
    - node: br
    - node: text
      content: 全コードが1リポジトリにある
  p32:
  - node: p
    children:
    - node: text
      content: ということで
  - node: p
    children:
    - node: text
      content: コードリーディングを
  - node: p
    children:
    - node: text
      content: 始めました
  p33:
  - node: p
    children:
    - node: text
      content: この時点で
  - node: p
    children:
    - node: text
      content: 14時くらい
  - node: p
    children:
    - node: text
      content: (当日スタッフのシフト後)
  p34:
  - node: p
    children:
    - node: text
      content: やったこと
  p35:
  - node: p
    children:
    - node: text
      content: Phanを
  - node: p
    children:
    - node: text
      content: 使いましょう
  p36:
  - node: p
    children:
    - node: text
      content: 理由
  - node: p
    children:
    - node: text
      content: PHP7の非互換を早めに潰す
    - node: br
    - node: text
      content: Laravelの特徴的なメタプログ
    - node: br
    - node: text
      content: ラミングを炙りだす
    - node: br
    - node: text
      content: Phanで静的にわからない＝
  - node: p
    children:
    - node: text
      content: メタプログラミング
  - node: p
    children:
    - node: text
      content: 妖怪のしわざ
  p37:
  - node: p
    children:
    - node: text
      content: yield関数 (5.5以降SyntaxError)
  p38:
  - node: p
    children:
    - node: text
      content: SyntaxErrorに
  - node: p
    children:
    - node: text
      content: なるような
  - node: p
    children:
    - node: text
      content: 非互換はこれだけ
  p39:
  - node: p
    children:
    - node: text
      content: 改行位置 (C#っぽい)
  p40:
  - node: p
    children:
    - node: text
      content: PHPDocはかなり書かれてる
  p41:
  - node: p
    children:
    - node: text
      content: namespaceの位置が独特
  - node: p
    children:
    - node: text
      content: ファイル名が
  - node: p
    children:
    - node: text
      content: 小文字
  p42:
  - node: p
    children:
    - node: text
      content: 表層的な
  - node: p
    children:
    - node: text
      content: ことはもういい
  p43:
  - node: p
    children:
    - node: text
      content: 動かそう
  p44:
  - node: p
    children:
    - node: text
      content: PHP 7.3で
  p45:
  - node: p
    children:
    - node: text
      content: mcryptに依存してる
  p46:
  - node: p
    children:
    - node: text
      content: キー長のパディング
  p47:
  - node: p
    children:
    - node: text
      content: めんどくさいのでビルトインWebサーバ
  - node: p
    children:
    - node: bold
      content: php -S localhost:3939 public/index.php
  p48:
  - node: p
    children:
    - node: text
      content: 動いた！
  p49:
  - node: p
    children:
    - node: text
      content: 見ためがプレーン
  - node: p
    children:
    - node: text
      content: だけど実はHTML5
  p50:
  - node: p
    children:
    - node: text
      content: localhostでドキュメントも読める
  p51:
  - node: p
    children:
    - node: text
      content: 2013年時点で
  - node: p
    children:
    - node: text
      content: ホスピタリティ
    - node: br
    - node: text
      content: すごい
  p52:
  - node: p
    children:
    - node: text
      content: 動いたので
  - node: p
    children:
    - node: text
      content: 雑に実装していく
  p53:
  - node: p
    children:
    - node: text
      content: ルーティング追加は(表面的に)大差ない
  p54:
  - node: p
    children:
    - node: text
      content: フォームの受け取りがわからなかった
  - node: p
    children:
    - node: text
      content: ( )
    - node: br
    - node: bold
      content: Symfony\HttpFoundation依存
  p55:
  - node: p
    children:
    - node: text
      content: Bladeは
    - node: br
    - node: text
      content: Laravel3で導入
  p56:
  - node: p
    children:
    - node: text
      content: いま気付いたけどBlade
  - node: p
    children:
    - node: text
      content: ってASP.netのRazorの
  - node: p
    children:
    - node: text
      content: オマージュじゃん
  p57:
  - node: p
    children:
    - node: text
      content: オチはないけど
    - node: br
    - node: text
      content: まとめ
  p58:
  - node: p
    children:
    - node: text
      content: 雑にWebアプリっ
    - node: br
    - node: text
      content: ぽいものを作る
    - node: br
    - node: text
      content: ことはできた
  p59:
  - node: p
    children:
    - node: text
      content: 癖がわかれば
  - node: p
    children:
    - node: text
      content: コードは読み
  - node: p
    children:
    - node: text
      content: やすかった
  p60:
  - node: p
    children:
    - node: text
      content: 依存関係がリポジト リ内に全部あるので
    - node: br
    - node: text
      content: 追いやすかった
  p61:
  - node: p
    children:
    - node: text
      content: コードは90000行くらい
  - node: p
    children:
    - node: text
      content: (コメント/空行含む)
    - node: br
    - node: text
      content: 当然全部は読んでない
  p62:
  - node: p
    children:
    - node: text
      content: doc消し忘れた
    - node: br
    - node: text
      content: Laravelアプリとか この世にありそう
  p63:
  - node: p
    children:
    - node: text
      content: 内部実装的なエッセン
    - node: br
    - node: text
      content: スがどの程度Laravel4以
    - node: br
    - node: text
      content: 降に引き継がれてるか
    - node: br
    - node: text
      content: はわからない
  p64:
  - node: p
    children:
    - node: text
      content: 表面的には同じだと 言ったが細かいAPI は「かなり」異なる
