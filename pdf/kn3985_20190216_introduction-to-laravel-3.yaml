    - node: text
      content: '　 　　　　|ミ| '
  - node: p
    children:
    - node: text
      content: そうだ、Laravel 1.0
  - node: p
    children:
    - node: text
      content: '　 　 ／ 　｀´　 ＼ '
    - node: br
    - node: text
      content: '　　　　　(''A`) '
    - node: br
    - node: text
