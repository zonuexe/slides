text:
  p1:
  - node: p
    children:
    - node: text
      content: Laravel3に入門してみるLet's begin with Laravel 32019-02-16 Laravel JP Conference
    - node: bold
      content: '         '
    - node: text
      content: 'Shibaura, Tokyo, Japan '
    - node: bold
      content: '#laraveljpcon '
  p2:
  - node: p
    children:
    - node: text
      content: 'お前誰ようさみけんた (@tadsan) / Zonu.EXE

        '
    - node: text
      content: 'GitHub/Packagistでは id: zonuexe

        •ピクシブ株式会社 pixiv運営本部

        •Emacs Lisper, PHPer

        •Emacs PHP Modeのメンテナ引き継ぎました

        •好きなリスプはEmacs Lispです

        •Qiitaに記事を書いたり変なコメントしてるよ•'
  p5:
  - node: p
    children:
    - node: text
      content: さて
  p6:
  - node: p
    children:
    - node: text
      content: PHP界隈でのLTデビュー戦(2015年11月)
  p7:
  - node: p
    children:
    - node: text
      content: 経歴上PHPのフレームワークを深く使うことは全然なかった
  p8:
  - node: p
    children:
    - node: text
      content: PHP界隈でのLTデビュー戦(2015年11月)
  p9:
  - node: p
    children:
    - node: text
      content: 'フレームワークを作るのは         難しいのか？'
  p10:
  - node: p
    children:
    - node: text
      content: 'Laravelのように多くの         局面で受け入れられる         フレームワークを         設計するのは難しい'
  p11:
  - node: p
    children:
    - node: text
      content: 自分の問題を解決する小さなフレームワークを作るのはそれほどでもない
  p12:
  - node: p
    children:
    - node: text
      content: Create your own PHP Framework
  p13:
  - node: p
    children:
    - node: text
      content: PHPer人生、一度はフレームワークを作っておこう
  p14:
  - node: p
    children:
    - node: text
      content: '実運用する上での数々のリスクは一旦置いておいて         (セキュリティとか)'
  p15:
  - node: p
    children:
    - node: text
      content: 理解＞作る(自分で動かすだけなら)
  p16:
  - node: p
    children:
    - node: text
      content: 'それからまあまあ         経験を積んで         2019年'
  p17:
  - node: p
    children:
    - node: text
      content: 'そういえばLaravel JP Conferenceのスタッフに         なったけど人生でLaravelを         10行くらいしか書いてない'
  p18:
  - node: p
    children:
    - node: text
      content: 　 　　　　 | 　 　＼　　__　　／ 　 　＿　（ｍ）　＿ ﾋﾟｺｰﾝ 　 　　　　|ミ| そうだLaravelやろう　 　 ／
        　｀´　 ＼ 　　　　　('A`) 　　　　　ノヽノヽ 　　　　　　　くく
  p19:
  - node: p
    children:
    - node: text
      content: 'しかし良い解説書は既にあるし、ここはLaravel JP Conferenceなんだから         大多数は体験済み'
  p20:
  - node: p
    children:
    - node: text
      content: 　 　　　　 | 　 　＼　　__　　／ 　 　＿　（ｍ）　＿ ﾋﾟｺｰﾝ 　 　　　　|ミ| そうだ、Laravel 1.0　 　
        ／ 　｀´　 ＼ 　　　　　('A`) 　　　　　ノヽノヽ 　　　　　　　くく
  p21:
  - node: p
    children:
    - node: text
      content: 元ねた：Rails 1.0のコードを読む
  p22:
  - node: p
    children:
    - node: text
      content: そうして我々はGitHubの奥地へと旅立った
  p23:
  - node: p
    children:
    - node: text
      content: https://github.com/laravel/laravel/releases?after=v3.0.1
  p24:
  - node: p
    children:
    - node: text
      content: ＿人人人人人人人人＿ 3.0以前がない＞　　＜ ￣Y^Y^Y^Y^Y^Y^Y^Y^￣
  p25:
  - node: p
    children:
    - node: text
      content: じゃあ3.2.14で
  p26:
  - node: p
    children:
    - node: text
      content: Laravel3に入門してみるLet's begin with Laravel 32019-02-16 Laravel JP Conference
    - node: bold
      content: '         '
    - node: text
      content: 'Shibaura, Tokyo, Japan '
    - node: bold
      content: '#laraveljpcon '
  p27:
  - node: p
    children:
    - node: text
      content: このバージョンを選んだ理由
  p28:
  - node: p
    children:
    - node: text
      content: https://github.com/laravel/laravel/releases/tag/v3.2.14
  p29:
  - node: p
    children:
    - node: text
      content: たぶん1.xとか2.xのコードも漁ればあるとは思うけど
  p30:
  - node: p
    children:
    - node: text
      content: Laravel 3.2.14の特徴2013年3月22日リリース3.x系の最終バージョン新しい方が些細なバグも解消されてるだろ、という日和古いPHPフレームワークの特徴が色濃く残っている
  p31:
  - node: p
    children:
    - node: text
      content: 古いフレームワークの特徴？依存パッケージ(Symfony)のコピーも直接コミットされてるSymfonyのcomposer.jsonは同梱されてるが、Laravel自体はComposer未採用全コードが1リポジトリにある
  p32:
  - node: p
    children:
    - node: text
      content: 'ということで         コードリーディングを         始めました'
  p33:
  - node: p
    children:
    - node: text
      content: 'この時点で         14時くらい         (当日スタッフのシフト後)'
  p34:
  - node: p
    children:
    - node: text
      content: やったこと
  p35:
  - node: p
    children:
    - node: text
      content: 'Phanを         使いましょう'
  p36:
  - node: p
    children:
    - node: text
      content: 理由PHP7の非互換を早めに潰すLaravelの特徴的なメタプログラミングを炙りだすPhanで静的にわからない＝
    - node: bold
      content: '         '
    - node: text
      content: メタプログラミング妖怪のしわざ
  p37:
  - node: p
    children:
    - node: text
      content: yield関数 (5.5以降SyntaxError)
  p38:
  - node: p
    children:
    - node: text
      content: 'SyntaxErrorに         なるような         非互換はこれだけ'
  p39:
  - node: p
    children:
    - node: text
      content: 改行位置 (C#っぽい)
  p40:
  - node: p
    children:
    - node: text
      content: PHPDocはかなり書かれてる
  p41:
  - node: p
    children:
    - node: text
      content: 'namespaceの位置が独特ファイル名が         小文字'
  p42:
  - node: p
    children:
    - node: text
      content: '表層的な         ことはもういい'
  p43:
  - node: p
    children:
    - node: text
      content: 動かそう
  p44:
  - node: p
    children:
    - node: text
      content: PHP 7.3で
  p45:
  - node: p
    children:
    - node: text
      content: mcryptに依存してる
  p46:
  - node: p
    children:
    - node: text
      content: キー長のパディング
  p47:
  - node: p
    children:
    - node: text
      content: めんどくさいのでビルトインWebサーバ
    - node: bold
      content: php -S localhost:3939 public/index.php
  p48:
  - node: p
    children:
    - node: text
      content: 動いた！
  p49:
  - node: p
    children:
    - node: text
      content: '見ためがプレーン         だけど実はHTML5'
  p50:
  - node: p
    children:
    - node: text
      content: localhostでドキュメントも読める
  p51:
  - node: p
    children:
    - node: text
      content: '2013年時点で         ホスピタリティすごい'
  p52:
  - node: p
    children:
    - node: text
      content: '動いたので         雑に実装していく'
  p53:
  - node: p
    children:
    - node: text
      content: ルーティング追加は(表面的に)大差ない
  p54:
  - node: p
    children:
    - node: text
      content: フォームの受け取りがわからなかった
    - node: bold
      content: '         '
    - node: text
      content: ()Symfony\HttpFoundation依存
  p55:
  - node: p
    children:
    - node: text
      content: BladeはLaravel3で導入
  p56:
  - node: p
    children:
    - node: text
      content: 'いま気付いたけどBlade         ってASP.netのRazorの         オマージュじゃん'
  p57:
  - node: p
    children:
    - node: text
      content: オチはないけどまとめ
  p58:
  - node: p
    children:
    - node: text
      content: 雑にWebアプリっぽいものを作ることはできた
  p59:
  - node: p
    children:
    - node: text
      content: '癖がわかれば         コードは読み         やすかった'
  p60:
  - node: p
    children:
    - node: text
      content: 依存関係がリポジトリ内に全部あるので追いやすかった
  p61:
  - node: p
    children:
    - node: text
      content: 'コードは90000行くらい         '
  - node: p
    children:
    - node: text
      content: (コメント/空行含む)当然全部は読んでない
  p62:
  - node: p
    children:
    - node: text
      content: doc消し忘れたLaravelアプリとかこの世にありそう
  p63:
  - node: p
    children:
    - node: text
      content: 内部実装的なエッセンスがどの程度Laravel4以降に引き継がれてるかはわからない
  p64:
  - node: p
    children:
    - node: text
      content: 表面的には同じだと言ったが細かいAPI は「かなり」異なる
