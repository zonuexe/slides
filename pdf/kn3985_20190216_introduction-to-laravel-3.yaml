text:
  p1:
  - kind: heading
    level: 1
    text: Laravel3に入門してみる
  - kind: para
    text: Let's begin with Laravel 3
  - kind: para
    text: '2019-02-16 Laravel JP Conference Shibaura, Tokyo, Japan #laraveljpcon'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: さて
  p6:
  - kind: para
    text: PHP界隈でのLTデビュー戦(2015年11月)
  p7:
  - kind: para
    text: 経歴上PHPのフレームワークを深く使うことは全然なかった
  p8:
  - kind: para
    text: PHP界隈でのLTデビュー戦(2015年11月)
  p9:
  - kind: para
    text: フレームワークを作るのは難しいのか？
  p10:
  - kind: para
    text: Laravelのように多くの局面で受け入れられるフレームワークを設計するのは難しい
  p11:
  - kind: para
    text: 自分の問題を解決する小さなフレームワークを作るのはそれほどでもない
  p12:
  - kind: para
    text: Create your own PHP Framework
  p13:
  - kind: para
    text: PHPer人生、一度はフレームワークを作っておこう
  p14:
  - kind: para
    text: 実運用する上での数々のリスクは一旦置いておいて(セキュリティとか)
  p15:
  - kind: heading
    level: 1
    text: 理解＞作る
  - kind: para
    text: (自分で動かすだけなら)
  p16:
  - kind: para
    text: それからまあまあ経験を積んで
  - kind: para
    text: 2019年
  p17:
  - kind: para
    text: そういえばLaravel JP Conferenceのスタッフになったけど人生でLaravelを10行くらいしか書いてない
  p18:
  - kind: heading
    level: 1
    text: そうだLaravelやろう
  - kind: para
    text: '|＼ __ ／＿ （ｍ） ＿ ﾋﾟｺｰﾝ|ミ|／ ｀´ ＼(''A`)ノヽノヽくく'
  p19:
  - kind: para
    text: しかし良い解説書は既にあるし、ここはLaravel JP Conferenceなんだから
  - kind: para
    text: 大多数は体験済み
  p20:
  - kind: heading
    level: 1
    text: そうだ、Laravel 1.0
  - kind: para
    text: '|＼ __ ／＿ （ｍ） ＿ ﾋﾟｺｰﾝ|ミ|／ ｀´ ＼(''A`)ノヽノヽくく'
  p21:
  - kind: para
    text: 元ねた：Rails 1.0のコードを読む
  p22:
  - kind: para
    text: そうして我々はGitHubの奥地へと旅立った
  p23:
  - kind: para
    text: https://github.com/laravel/laravel/releases?after=v3.0.1
  p24:
  - kind: para
    text: ＿人人人人人人人人＿＞ 3.0以前がない ＜￣Y^Y^Y^Y^Y^Y^Y^Y^￣
  p25:
  - kind: para
    text: じゃあ3.2.14で
  p26:
  - kind: heading
    level: 1
    text: Laravel3に入門してみる
  - kind: para
    text: Let's begin with Laravel 3
  - kind: para
    text: '2019-02-16 Laravel JP Conference Shibaura, Tokyo, Japan #laraveljpcon'
  p27:
  - kind: para
    text: このバージョンを選んだ理由
  p28:
  - kind: para
    text: https://github.com/laravel/laravel/releases/tag/v3.2.14
  p29:
  - kind: para
    text: たぶん1.xとか2.xのコードも漁ればあるとは思うけど
  p30:
  - kind: para
    text: Laravel 3.2.14の特徴
  - kind: para
    text: 2013年3月22日リリース
  - kind: para
    text: 3.x系の最終バージョン
  - kind: para
    text: 新しい方が些細なバグも解消されてるだろ、という日和
  - kind: para
    text: 古いPHPフレームワークの特徴が色濃く残っている
  p31:
  - kind: para
    text: 古いフレームワークの特徴？
  - kind: para
    text: 依存パッケージ(Symfony)のコピーも直接コミットされてる
  - kind: para
    text: Symfonyのcomposer.jsonは同梱されてるが、Laravel自体はComposer未採用
  - kind: para
    text: 全コードが1リポジトリにある
  p32:
  - kind: para
    text: ということでコードリーディングを始めました
  p33:
  - kind: para
    text: この時点で14時くらい
  - kind: para
    text: (当日スタッフのシフト後)
  p34:
  - kind: para
    text: やったこと
  p35:
  - kind: para
    text: Phanを使いましょう
  p36:
  - kind: para
    text: 理由
  - kind: para
    text: PHP7の非互換を早めに潰す
  - kind: para
    text: Laravelの特徴的なメタプログラミングを炙りだす
  - kind: para
    text: Phanで静的にわからない＝妖怪のしわざメタプログラミング
  p37:
  - kind: para
    text: yield関数 (5.5以降SyntaxError)
  p38:
  - kind: para
    text: SyntaxErrorになるような非互換はこれだけ
  p39:
  - kind: para
    text: 改行位置 (C#っぽい)
  p40:
  - kind: para
    text: PHPDocはかなり書かれてる
  p41:
  - kind: heading
    level: 1
    text: namespaceの位置が独特
  - kind: para
    text: ファイル名が小文字
  p42:
  - kind: para
    text: 表層的なことはもういい
  p43:
  - kind: para
    text: 動かそう
  p44:
  - kind: para
    text: PHP 7.3で
  p45:
  - kind: para
    text: mcryptに依存してる
  p46:
  - kind: para
    text: キー長のパディング
  p47:
  - kind: para
    text: めんどくさいのでビルトインWebサーバphp -S localhost:3939 public/index.php
  p48:
  - kind: para
    text: 動いた！
  p49:
  - kind: para
    text: 見ためがプレーンだけど実はHTML5
  p50:
  - kind: para
    text: localhostでドキュメントも読める
  p51:
  - kind: para
    text: 2013年時点でホスピタリティすごい
  p52:
  - kind: para
    text: 動いたので雑に実装していく
  p53:
  - kind: para
    text: ルーティング追加は(表面的に)大差ない
  p54:
  - kind: para
    text: フォームの受け取りがわからなかった(Symfony\HttpFoundation依存)
  p55:
  - kind: para
    text: BladeはLaravel3で導入
  p56:
  - kind: para
    text: いま気付いたけどBladeってASP.netのRazorのオマージュじゃん
  p57:
  - kind: para
    text: オチはないけどまとめ
  p58:
  - kind: para
    text: 雑にWebアプリっぽいものを作ることはできた
  p59:
  - kind: para
    text: 癖がわかればコードは読みやすかった
  p60:
  - kind: para
    text: 依存関係がリポジトリ内に全部あるので追いやすかった
  p61:
  - kind: para
    text: コードは90000行くらい(コメント/空行含む)
  - kind: para
    text: 当然全部は読んでない
  p62:
  - kind: para
    text: doc消し忘れたLaravelアプリとかこの世にありそう
  p63:
  - kind: para
    text: 内部実装的なエッセンスがどの程度Laravel4以降に引き継がれてるかはわからない
  p64:
  - kind: para
    text: 表面的には同じだと言ったが細かいAPIは「かなり」異なる
size:
  max_width: 1024
  max_height: 768
