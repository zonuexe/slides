    - node: text
      content: '　 　　　　|ミ| '
  - node: p
    children:
    - node: text
      content: そうだLaravelやろう
  - node: p
    children:
    - node: text
      content: '　 　 ／ 　｀´　 ＼ '
    - node: br
    - node: text
      content: '　　　　　(''A`) '
    - node: br
    - node: text
      content: 　　　　　ノヽノヽ 　　　　　　　くく
  p19:
  - node: p
    children:
    - node: text
      content: しかし良い解説書は既にあ るし、ここはLaravel JP Conferenceなんだから
  - node: p
    children:
    - node: text
      content: 大多数は体験済み
  p20:
  - node: p
    children:
    - node: text
      content: '　 　　　　 | '
    - node: br
    - node: text
      content: '　 　＼　　__　　／ '
    - node: br
