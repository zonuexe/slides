      content: 社長が訊く『ポケットモンスター ハートゴールド・ソウルシルバー』 より引用 (2025年1月28日閲覧)
  p43:
  - node: p
    children:
    - node: text
      content: 今や文字コードを独自設計し たり､フォントをビット単位 で押し込めるような時代では
    - node: br
    - node: text
      content: なくなった
  p44:
  - node: p
    children:
    - node: text
      content: サイズ削減のためバンドルするフォント
