  - node: p
    children:
    - node: text
      content: 'ドラゴンクエストV '
  - node: p
    children:
    - node: text
      content: (スーパーファミコン)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 1992年9月27日発売
    - node: li
      children:
      - node: text
        content: 12MBitロムカセット (1.5MBytes)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: DQ1の時代から考えれば無限に広く見えるが…
        - node: li
          children:
          - node: text
            content: プログラム・テキスト・グラフィック・音楽などあらゆる要素がリッチに
        - node: li
          children:
          - node: text
            content: テキストデータはハフマン符号による可変長ビット(!)
          - node: br
          - node: text
            content: ドラクエ命 第 II 部 解析 第 3 章 SFC 版ドラクエ 5 (1992) 3.6. テキスト解析
  p40:
  - node: p
    children:
    - node: text
      content: ポケットモンスター
  - node: p
    children:
    - node: text
      content: (ゲームボーイ)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 1996年2月27日発売 (DQのほぼ10年後)
    - node: li
      children:
      - node: text
        content: 8Mbitロムカセット (1MBytes)：DQの16倍
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 'DQ1の時代から考えれば無限に広く見えるが… 151匹のポケモンを押し込むには明らかに大変 '
        - node: li
          children:
          - node: text
