text:
  p1:
  - kind: heading
    level: 1
    text: 文字コードへの道
  - kind: heading
    level: 2
    text: The Road to Character Encodings
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2024-01-28 #retro_games_any'
  - kind: para
    text: 'レトロゲームから得た学びの発表 #01'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
    - ゲーム開発経験は学生時代にDXLibとか一瞬使ったくらい
    - 好きなゲームはスーパーロボット大戦シリーズ
  p3:
  - kind: heading
    level: 1
    text: 今回の発表の背景 (phpcon2024)
  p4:
  - kind: heading
    level: 1
    text: さて
  p5:
  - kind: para
    text: コンピュータ内のデータのイメージ
  p6:
  - kind: heading
    level: 1
    text: 非常に大雑把なイメージ
  - kind: heading
    level: 2
    text: コンピュータのメモリ
  - kind: heading
    level: 2
    text: = データを格納する箱が並んでいる
  - kind: para
    text: …1,073,741,824
  - kind: heading
    level: 3
    text: (1GBメモリ)
  p7:
  - kind: heading
    level: 1
    text: データを整列して見る
  - kind: heading
    level: 2
    text: 1列で表示するとわかりにくいので
  - kind: heading
    level: 2
    text: 16個単位で折り返すことがよくある
  - kind: para
    text: A B C D E F
  - kind: para
    text: 1x
  - kind: para
    text: 2x
  - kind: para
    text: 3x
  - kind: para
    text: 4x
  - kind: heading
    level: 3
    text: 列 = 下1桁
  - kind: para
    text: 5x
  - kind: para
    text: 6x
  - kind: para
    text: 7x
  - kind: para
    text: 8x
  p8:
  - kind: para
    text: 非常に大雑把なイメージ
  - kind: para
    text: 四角い箱
  - kind: para
    text: = メモリ
  - kind: heading
    level: 1
    text: 文字列 "Abc12"
  - kind: para
    text: A b c
  p9:
  - kind: para
    text: ところでコンピュータって
  - kind: para
    text: 0と1の世界なのでは…？
  p10:
  - kind: heading
    level: 1
    text: 0と1の世界
  p11:
  - kind: para
    text: 0と1の世界= binary (2進法)
  p12:
  - kind: para
    text: 0と1の世界= binary (2進法)
  - kind: para
    text: = bit (2値データ)
  p13:
  - kind: heading
    level: 1
    text: 粒度が細かすぎる
  p14:
  - kind: para
    text: 粒度が細かすぎる
  - kind: list
    items:
    - まとめて扱おう
  p15:
  - kind: para
    text: 粒度が細かすぎる
  - kind: list
    items:
    - まとめて扱おう
  - kind: para
    text: = bytes (バイト)
  p16:
  - kind: para
    text: 非常に大雑把なイメージ (再掲)
  - kind: para
    text: 四角い箱
  - kind: para
    text: 箱に入るのは
  - kind: para
    text: 0～256の数字だけ
  - kind: para
    text: = メモリ
  - kind: heading
    level: 1
    text: 文字列 "Abc12"
  - kind: para
    text: A b c
  - kind: para
    text: 数字に置き換えて箱に入れる
  p17:
  - kind: para
    text: データをまとめて扱う
  - kind: list
    items:
    - コンピュータ上のデータを0と1だけで表現するのはわかりにくい
    - 現代では「1バイト=8個のビット」の塊として扱うのが標準的
    - 歴史的には、1バイト=7個のビットで扱う流れもあった
    - この「7」という数は現在までひっそりと影響を残している…
    - 8バイトの場合、0〜28(=256)までの数を格納できる
  p18:
  - kind: para
    text: 日本語文字列をメモリに入れよう
  - kind: para
    text: あいうえお
  - kind: para
    text: 数字に置き換える方法を…
  - kind: heading
    level: 2
    text: 文字列 "あいうえお"
  - kind: heading
    level: 1
    text: ×
  p19:
  - kind: para
    text: 文字をデータに
  - kind: para
    text: してみよう
  p20:
  - kind: heading
    level: 1
    text: 英語の文字をデータにしてみよう
  - kind: para
    text: 2進数10進数文字
  - kind: para
    text: 00000 A
  - kind: para
    text: 00001 B
  - kind: para
    text: 00010 C
  - kind: list
    items:
    - A, B, C, ... Z までのアルファベットだけを扱う
    - アルファベット26種類なので、
  - kind: heading
    level: 2
    text: 5bit = 25 =32(種類)で表現できる
  - kind: para
    text: 00011 D
  - kind: para
    text: 00100 E
  - kind: para
    text: 00101 F
  - kind: para
    text: 00110 G
  - kind: para
    text: 00111 H
  - kind: para
    text: ……
  - kind: para
    text: 11001 Z
  p21:
  - kind: heading
    level: 1
    text: ひらがなをデータにしてみよう
  - kind: para
    text: 2進数10進数文字
  - kind: para
    text: 000000あ
  - kind: para
    text: 000001い
  - kind: list
    items:
    - あいうえお… わ を ん までの五十音を扱えるように
    - 6bit = 26 =64(種類)に収まる
  - kind: para
    text: 000010う
  - kind: para
    text: 000011え
  - kind: para
    text: 000100お
  - kind: para
    text: ………
  - kind: para
    text: 101100わ
  - kind: para
    text: 101101を
  - kind: para
    text: 101110ん
  p22:
  - kind: heading
    level: 1
    text: ひらがなをデータにしてみよう
  - kind: para
    text: 2進数10進数文字
  - kind: para
    text: 000000あ
  - kind: para
    text: 000001い
  - kind: para
    text: 000010う
  - kind: list
    items:
    - あいうえお… わ を ん までの五十音を扱えるように
    - 6bit = 26 =64(種類)に収まる
    - カタカナや濁点を扱うには… どうすれば？
  - kind: para
    text: 000011え
  - kind: para
    text: 000100お
  - kind: para
    text: ………
  - kind: para
    text: 101100わ
  - kind: para
    text: 101101を
  - kind: para
    text: 101110ん
  p23:
  - kind: heading
    level: 1
    text: ひらがなをデータにしてみよう
  - kind: para
    text: 2進数10進数文字
  - kind: para
    text: 000000あ
  - kind: para
    text: 000001い
  - kind: para
    text: 000010う
  - kind: list
    items:
    - あいうえお… わ を ん までの五十音を扱えるように
    - 6bit = 26 =64(種類)に収まる
    - カタカナや濁点を扱うには… どうすれば？
  - kind: para
    text: 000011え
  - kind: heading
    level: 2
    text: 💡 ＼ﾋﾟｺｰｿ／ そうだ、先頭ビットを濁点とカタカナに
  - kind: list
    items:
    - '000100'
  - kind: para
    text: お
  - kind: para
    text: ………
  - kind: para
    text: 101100わ
  - kind: para
    text: 101101を
  - kind: para
    text: 101110ん
  p24:
  - kind: heading
    level: 1
    text: ひらがなをデータにしてみよう
  - kind: para
    text: 2進数10進数文字
  - kind: para
    text: 000000あ
  - kind: para
    text: 000001い
  - kind: para
    text: 000010う
  - kind: list
    items:
    - あいうえお… わ を ん までの五十音を扱えるように
    - 6bit = 26 =64(種類)に収まる
    - カタカナや濁点を扱うには… どうすれば？
  - kind: para
    text: 000011え
  - kind: heading
    level: 2
    text: 💡 ＼ﾋﾟｺｰｿ／ そうだ、先頭ビットを濁点とカタカナに
  - kind: list
    items:
    - '000100'
  - kind: para
    text: お
  - kind: para
    text: ………
  - kind: list
    items:
    - ↑ 小文字とか半濁点のこと考えてないよね…
  - kind: para
    text: 101100わ
  - kind: para
    text: 101101を
  - kind: para
    text: 101110ん
  p25:
  - kind: heading
    level: 1
    text: 16進数表
  - kind: list
    items:
    - 文字エンコーディングとかバイナリファイルを向き合っていると
  - kind: para
    text: ちょくちょくこの形式の表を見ることになるかと思います
  - kind: list
    items:
    - メモリやディスク上のデータの表示 (バイナリエディタ)
    - エンコーディングのバイトデータと文字の対応表
  p26:
  - kind: para
    text: そういうことを考えると文字コードを設計できる
  p27:
  - kind: para
    text: 現在のコンピュータはどうやって文字を扱うか
  p28:
  - kind: para
    text: ASCII (アスキー)
  - kind: list
    items:
    - American Standard Code for Information Interchange
    - ↑ 正式名称は覚えなくていい
    - いわゆる「半角文字」「半角英数」とか呼ばれる文字コード
    - アメリカ英語で使用されるアルファベット(ラテン文字)をカバー
    - 0〜127までの7bitだけを使うので、1バイト=8bitとして扱うと
  - kind: para
    text: 必ず先頭が0になる
  p29:
  - kind: heading
    level: 1
    text: Unicode
  - kind: list
    items:
    - 大統一文字コード
    - 世界中の文字を統合して一個の表にしようぜ！ プロジェクト
    - 表に割り当てられた文字を「コードポイント」と呼ぶ
    - U+1234 のように書く
    - 最初は16bit = 216 = 65536種類の空間あれば十分じゃね？と
  - kind: para
    text: 思われていたらしい
  p30:
  - kind: heading
    level: 1
    text: UTF-8
  - kind: list
    items:
    - 8bit固定で1〜4バイトの可変長エンコーディング
    - ASCIIの文字(いわゆる半角文字)は1バイトで扱える
    - そのほかの文字は可変長
    - 典型的な日本語の文字は3バイト
    - 半角カナは4バイト
  p31:
  - kind: para
    text: 制御文字
  p32:
  - kind: para
    text: 21世紀の環境でUnicode以外を採用する動機は激減
  p33:
  - kind: para
    text: かつてはそうでは
  - kind: para
    text: なかった
  - kind: para
    text: (と伝え聞く)
  p34:
  - kind: heading
    level: 1
    text: 歴史的な事例
  p35:
  - kind: heading
    level: 1
    text: 有名な逸話
  - kind: para
    text: 『しんでしまうとは なにごとだ!』 堀井雄二(編集・執筆)株式会社スクウェア・エニックスデジタル版 Ver.1.00 2018年9月1日(Kindle)p11より引用
  p36:
  - kind: heading
    level: 1
    text: ドラゴンクエスト(ファミリーコンピュータ)
  - kind: list
    items:
    - 1986年5月27日発売
    - 512Kbitロムカセット (64KBytes)
    - プログラムROMとキャラクタROMがそれぞれ32キロバイト
    - モンスターやキャラクターなどの画像とフォントなどを
  - kind: para
    text: 全部この32キロバイトに押し込める必要がある
  - kind: list
    items:
    - プログラムとテキストデータが残り32キロバイト
  p37:
  - kind: heading
    level: 1
    text: ドラゴンクエスト (FC) 解析資料 - 文字コード より引用 (2025年1月28日閲覧)
  p38:
  - kind: para
    text: ドラゴンクエスト (FC) 解析資料 - 文字コード より引用 (2025年1月28日閲覧)
  - kind: heading
    level: 1
    text: 第三章 自分だけのオリジナルマップを作ろう (kuwatan.jp) より引用
  - kind: heading
    level: 1
    text: (2025年1月28日閲覧)
  p39:
  - kind: heading
    level: 1
    text: ドラゴンクエストV (スーパーファミコン)
  - kind: list
    items:
    - 1992年9月27日発売
    - 12MBitロムカセット (1.5MBytes)
    - DQ1の時代から考えれば無限に広く見えるが…
    - プログラム・テキスト・グラフィック・音楽などあらゆる要素がリッチに
    - テキストデータはハフマン符号による可変長ビット(!)
  - kind: para
    text: ドラクエ命 第 II 部 解析 第 3 章 SFC 版ドラクエ 5 (1992) 3.6. テキスト解析
  p40:
  - kind: heading
    level: 1
    text: ポケットモンスター(ゲームボーイ)
  - kind: list
    items:
    - 1996年2月27日発売 (DQのほぼ10年後)
    - 8Mbitロムカセット (1MBytes)：DQの16倍
    - DQ1の時代から考えれば無限に広く見えるが…
  - kind: para
    text: 151匹のポケモンを押し込むには明らかに大変
  - kind: list
    items:
    - 文字列は独自の2バイトコードを定義している
    - アルファベットは13文字しか含まれていない(!)
  p41:
  - kind: para
    text: 文字コード対応表 - pokemonbug @ ウィキ - atwiki より引用 (2024年12月22日閲覧)
  p42:
  - kind: para
    text: 社長が訊く『ポケットモンスター ハートゴールド・ソウルシルバー』 より引用 (2025年1月28日閲覧)
  p43:
  - kind: para
    text: 今や文字コードを独自設計し
  - kind: para
    text: たり、フォントをビット単位で押し込めるような時代では
  - kind: para
    text: なくなった
  p44:
  - kind: para
    text: サイズ削減のためバンドルするフォント
  - kind: para
    text: ファイルの文字種を削ったり、独自の文字を表示するためにUnicodeの
  - kind: para
    text: 私用領域を使うことはあると思う
