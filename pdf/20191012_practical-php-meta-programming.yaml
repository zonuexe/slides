    - node: text
      content: (ただしPHP用語)
  p64:
  - node: p
    children:
    - node: text
      content: '出典: PHP: オーバーロード - Manual '
  - node: p
    children:
    - node: text
      content: https://www.php.net/manual/ja/language.oop5.overloading.php
    - node: br
    - node: text
      content: Copyright © 2001-2019 The PHP Group
  p65:
  - node: p
    children:
    - node: text
      content: 一般的なプログラミング 用語「オーバーロード」 とは全然別物なので注意
  p66:
  - node: p
    children:
    - node: text
      content: 未定義のメソッド呼び出しを捕捉
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: class C {
    - node: br
    - node: text
      content: '    public function __call($name, $args)'
    - node: br
    - node: text
      content: '    {'
  - node: p
    children:
    - node: text
      content: が呼ばれた
  - node: p
    children:
    - node: text
      content: '        echo __CLASS__."::{$name}() \n";'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}'
  p67:
  - node: p
    children:
    - node: text
      content: Proxyパターンを簡単に実現
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: /**
    - node: br
    - node: text
      content: ' * @mixin Foo'
    - node: br
    - node: text
      content: ' */'
    - node: br
    - node: text
      content: class D {
    - node: br
    - node: text
      content: '    private $foo;'
    - node: br
    - node: text
      content: '    public function (Foo $class) {'
    - node: br
    - node: text
      content: '        $this->foo = $class;'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '    public function __call($name, $args)'
    - node: br
    - node: text
      content: '    {'
    - node: br
    - node: text
      content: '       return $this->foo->$name(...$args);'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}'
  p68:
  - node: p
    children:
    - node: text
      content: リフレクション
  p69:
  - node: p
    children:
    - node: text
      content: 実行時に情報を取得
  - node: p
    children:
    - node: text
      content: できるAPI
  - node: p
    children:
    - node: text
      content: (一部上書き)
  p70:
  - node: p
    children:
    - node: text
      content: 関数・クラス・オブジェクト・
    - node: br
    - node: text
      content: メソッド・プロパティ・パラメー タ(引数)・返値の型・クラス定数
    - node: br
    - node: text
      content: 'など '
  - node: p
    children:
    - node: text
      content: https://www.php.net/manual/ja/book.reflection.php
  p71:
  - node: p
    children:
    - node: text
      content: PHPUnitの
  - node: p
    children:
    - node: text
      content: 'dataProvider '
    - node: br
    - node: text
      content: '(パラメタライズテスト) '
    - node: br
    - node: text
      content: とも組み合わせられる
  p72:
  - node: p
    children:
    - node: text
      content: 未定義のメソッド呼び出しを捕捉
  - node: p
