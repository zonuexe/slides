    - node: br
    - node: text
      content: '    public function __call($name, $args)'
    - node: br
    - node: text
      content: '    {'
  - node: p
    children:
    - node: text
      content: が呼ばれた
  - node: p
    children:
    - node: text
      content: '        echo __CLASS__."::{$name}() \n";'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}'
  p73:
  - node: p
    children:
    - node: text
      content: まとめ
  p74:
  - node: p
    children:
    - node: text
      content: メタプログラミングの技術を
    - node: br
    - node: text
      content: '使うと '
    - node: br
    - node: text
      content: 「コードに書いてある通りで
    - node: br
    - node: text
      content: はない」動きをさせられる
  p75:
  - node: p
    children:
    - node: text
      content: 代償としてPhpStorm などの支援を受けにく
    - node: br
    - node: text
      content: くなることがある
  p76:
  - node: p
    children:
    - node: text
      content: '大いなる力には '
    - node: br
    - node: text
      content: 大いなる責任が伴う
