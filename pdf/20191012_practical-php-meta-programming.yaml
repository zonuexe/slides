  - node: p
    children:
    - node: text
      content: <?php
    - node: br
    - node: text
      content: $fizzbuzz = [];
    - node: br
    - node: text
      content: foreach (range(1, 100) as $n) {
    - node: br
    - node: text
      content: '    $s = '''';'
    - node: br
    - node: text
      content: '    if ($n % 3 === 0) $s .= ''Fizz'';     if ($n % 5 === 0) $s .=
        ''Buzz'';'
    - node: br
    - node: text
      content: '    $s = ($s === '''') ? (string)$n : $s;'
  - node: p
    children:
    - node: text
      content: '    $fizzbuzz[$n] = function () use ($s) {'
    - node: br
    - node: text
      content: '       return $s;'
    - node: br
    - node: text
      content: '    };'
    - node: br
    - node: text
      content: '}'
