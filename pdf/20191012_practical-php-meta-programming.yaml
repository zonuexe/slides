    children:
    - node: text
      content: アクセス不能プロパティを乗っ取る
  - node: p
    children:
    - node: text
      content: <?php
    - node: br
    - node: text
      content: class A {
    - node: br
    - node: text
      content: '    private $data = [];'
  - node: p
    children:
    - node: text
      content: '    public function __get($name) {'
    - node: br
    - node: text
      content: '        $this->data[$name];'
    - node: br
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: '    public function __set($name, $value) {'
    - node: br
    - node: text
      content: '        $this->data[$name] = $value;'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}'
  - node: p
    children:
    - node: text
