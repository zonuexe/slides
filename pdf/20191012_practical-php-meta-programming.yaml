    - node: br
    - node: text
      content: '    if ($n % 3 === 0) $s .= ''Fizz'';     if ($n % 5 === 0) $s .=
        ''Buzz'';'
    - node: br
    - node: text
      content: '    return ($s === '''') ? $n : $s;'
  - node: p
    children:
    - node: text
      content: '}'
  - node: p
    children:
    - node: text
