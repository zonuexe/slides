    - node: br
    - node: text
      content: trait PrivateRead {
    - node: br
    - node: text
      content: '    public function __get($name) {'
    - node: br
    - node: text
      content: '        $this->$name;'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}'
  - node: p
    children:
    - node: text
      content: /**
    - node: br
    - node: text
      content: ' * @property-read int $id'
    - node: br
    - node: text
      content: ' * @property-read int $name'
    - node: br
    - node: text
      content: ' */'
    - node: br
    - node: text
      content: class A {
    - node: br
    - node: text
      content: '    use PrivateRead;'
    - node: br
    - node: text
      content: '    private $id;'
    - node: br
    - node: text
