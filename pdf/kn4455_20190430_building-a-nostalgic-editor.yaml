  p21:
  - kind: heading
    level: 1
    text: 平成時代に憧れてた
  - kind: heading
    level: 1
    text: あのエディタを実装してみる
  - kind: para
    text: Implement a text editor I admired in Heisei era
  - kind: para
    text: 新元号決定！平成最後のLT大会＆PARTY
  - kind: para
    text: '2019年4月30日 #engineers_lt'
  p22:
  - kind: para
    text: そうだ、PHPでエディタ作ろう
  - kind: para
    text: '|＼ __ ／ ﾋﾟｺｰﾝ＿ （ｍ） ＿|ミ|／ ｀´ ＼(''A`)ノヽノヽくく'
  p23:
  - kind: para
    text: ということで今朝起きてから実装を始めました
  p24:
  - kind: para
    text: そもそもテキストエディタとは何か
  p25:
  - kind: para
    text: 歴史的にはed, ex,MS-DOSのEDLINのようなラインエディタがあった
  p26:
  - kind: para
    text: ファイルを部分的にプリントして編集していくスタイル
  p27:
  - kind: para
    text: (今日「プリント」は画面上に文字を出力することを意味するが、1970年代前半ではテレタイプ端末で本当に印刷されてたらしい)
  p28:
  - kind: para
    text: 話がそれた
  p29:
  - kind: para
    text: 本質的な仕事
  p30:
  - kind: para
    text: (ファイルを読み込む)↓ユーザにごにょごにょさせる↓ファイルに書き戻す
  p31:
  - kind: para
    text: 僕にもできそう
  p32:
  - kind: para
    text: どうやって「ごにょごにょ」させるかが問題
  p33:
  - kind: para
    text: 方針
  p34:
  - kind: para
    text: PHPでやる
  p35:
  - kind: para
    text: 端末でやる
  p36:
  - kind: para
    text: 定石
  - kind: para
    text: '||ncursesを使う'
  p37:
  - kind: heading
    level: 1
    text: 
  - kind: para
    text: やったことない
  p38:
  - kind: para
    text: 簡単な方法
  p39:
  - kind: para
    text: 画面を全部消す↓内容を全部出力↓無限に繰り返し…
  p40:
  - kind: heading
    level: 1
    text: 
  - kind: para
    text: 簡単じゃん
  p41:
  - kind: para
    text: PHPでやるにはどうすればいいか
  p42:
  - kind: para
    text: 概ねいい感じにできる
  p43:
  - kind: para
    text: 基本はWebアプリケーションフレームワークの実装と同じ
  p44:
  - kind: para
    text: HTTPじゃなくて端末の入力に対して処理していく
  p45: []
  p46:
  - kind: para
    text: 画面を消す
  - kind: para
    text: '||'
  - kind: para
    text: Hoa\Console\Console::clear()
  p47:
  - kind: para
    text: 文字列を貯めるバッファの実装はとことん楽をする
  p48:
  - kind: para
    text: 余談:エディタはテキストファイルの途中に文字を消したり追加したりするので、文字列(＝文字の配列)と相性が悪い(途中挿入・削除コスト高)
  p49:
  - kind: para
    text: そんなわけで実装していきましょう
  p50: []
  p51: []
  p52: []
  p53: []
  p54: []
  p55: []
  p56:
  - kind: para
    text: 実装しなかったけど面倒くさかったところ
  p57:
  - kind: para
    text: カーソル
  p58:
  - kind: para
    text: UTF-8は可変長
  p59:
  - kind: para
    text: カーソルを移動させるためには一文字づつ表示幅を調べないといけない
  p60:
  - kind: para
    text: 「カーソル」位置を文字数で持つかバイト数で持つか
  p61:
  - kind: para
    text: 文字列をUTF-32で持てば固定長になるのでは？？？
  p62:
  - kind: heading
    level: 1
    text: 🙃
  - kind: para
    text: だめです
  p63:
  - kind: para
    text: Unicodeの書記素クラスタ
  p64:
  - kind: para
    text: 
  p65:
  - kind: para
    text: この絵文字のバイト数
  - kind: para
    text: strlen('
  - kind: para
    text: ');
  p66:
  - kind: para
    text: この絵文字のバイト数
  - kind: para
    text: strlen('
  - kind: para
    text: ');// => 25
  p67:
  - kind: para
    text: この絵文字のUTF-8文字数
  - kind: para
    text: mb_strlen('
  - kind: para
    text: ', 'UTF-8');
  p68:
  - kind: para
    text: この絵文字のUTF-8文字数
  - kind: para
    text: mb_strlen('
  - kind: para
    text: ', 'UTF-8');// => 7
  p69:
  - kind: para
    text: 
  p70:
  - kind: para
    text: 👨|
  - kind: para
    text: 👩|
  - kind: para
    text: 👦|
  - kind: para
    text: 👦
  p71:
  - kind: para
    text: Zero Width Joiner
  p72:
  - kind: para
    text: Unicodeにおいて、1バイト1コードポイント人間に見える文字
  p73:
  - kind: para
    text: まったく一致しません
  p74:
  - kind: para
    text: エディタは完成してないです！！
  p75:
  - kind: para
    text: でも行きあたりばったりで設計しながら実装していくのは楽しい
  p76:
  - kind: para
    text: 私からは異常です
