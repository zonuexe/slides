  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 サービスプラットフォーム事業部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: 時は遡る
  p4:
  - kind: para
    text: Laravel JP Conference直後
  p5: []
  p6:
  - kind: para
    text: 何か話さないと…
  p7: []
  p8:
  - kind: para
    text: そうだ、テキストエディタ作ろう
  - kind: para
    text: '|＼ __ ／ ﾋﾟｺｰﾝ＿ （ｍ） ＿|ミ|／ ｀´ ＼(''A`)ノヽノヽくく'
  p9:
  - kind: para
    text: 最初に考えてた内容
  p10:
  - kind: para
    text: 秀丸上にEmacsを実現しよう
  p11:
  - kind: para
    text: 先行実装
  p12: []
  p13: []
  p14:
  - kind: para
    text: 昨晩手をつけてみた
  p15:
  - kind: para
    text: もう20年アップデートされてないし、現代風に書き直してみたら楽しいのでは？？？
  p16:
  - kind: para
    text: めちゃくちゃ手間がかかるし予想以上におもしろくない
  p17:
  - kind: para
    text: 🤔
  p18:
  - kind: para
    text: はてさてどうしよう
  p19:
  - kind: heading
    level: 1
    text: 第2案発動
  - kind: para
    text: (本当に手をつけるつもりはなかった)
  p20:
  - kind: heading
    level: 1
    text: 平成時代に憧れてた
  - kind: heading
    level: 1
    text: あのエディタを実装してみる
  - kind: para
    text: Implement the text editor I admired in Heisei era
  - kind: para
