  p32:
  - kind: para
    text: DocCommentは自由帳
  - kind: list
    items:
    - 事実上、なんでも書ける
    - なにを書いても怒られないが、@hogeのような形式が一般的
    - phpDocumenterスタイルの「タグ」
    - '@param int $foo (スペース区切り)'
    - Doctrineスタイルの「アノテーション」
    - '@Annotation("arg", 1, 2, 3)'
  p33:
