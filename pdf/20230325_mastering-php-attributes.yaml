    children:
    - node: text
      content: 実際に見てみましょう
  p67: []
  p68:
  - node: p
    children:
    - node: text
      content: ReﬂectionAttribute
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: getAttributes() メソッドでとれるクラス
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: $ref = new Re:ectionClass(Target::class);
        - node: li
          children:
          - node: text
            content: $ref->getArguments() で値だけ取れる
        - node: li
          children:
          - node: text
            content: $ref->newInstance() でアトリビュートをインスタンス化できる
  p69:
  - node: p
    children:
    - node: text
      content: 何が変わったのか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 明示的にRe:ectionしないと何も起こらないのはDocコメントと同じ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Attributeを書くだけなら、ただのコメントと同じ
    - node: li
      children:
      - node: text
        content: 引数の区切りがとても簡単
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Docコメントでは自前で構文解析しないといけない
    - node: li
      children:
      - node: text
        content: 静的解析ツールが自然にサポートしてくれている
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Docコメントでは変な記述をしても気付きにくい
  p70:
  - node: p
    children:
    - node: text
      content: 'これでAttributeの '
    - node: br
    - node: text
      content: 機能は全部です！
  p71:
  - node: p
    children:
    - node: text
      content: 完全マスター
  - node: p
    children:
    - node: text
      content: 🎉
  p72:
  - node: p
    children:
    - node: text
      content: '機能はめっちゃ '
    - node: br
    - node: text
      content: シンプル
  p73:
  - node: p
    children:
    - node: text
      content: 'あとはどういう '
    - node: br
    - node: text
      content: ｢想い｣を載せるか
  p74:
  - node: p
    children:
    - node: text
      content: 創意工夫が大事
  p75:
  - node: p
    children:
    - node: text
      content: とはいえ定石はある
  p76: []
  p77:
  - node: p
    children:
    - node: text
      content: DI vs Attribute
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 山岡さんの2021年の発表で紹介された事例
    - node: li
      children:
      - node: text
        content: 依存性注入したいデータを明示するために使う
  p78: []
  p79:
  - node: p
    children:
    - node: text
