    - Reflection::getComment() で文字列で取得できる
    - 実行時とかにいい感じに情報を読み取って処理をしてやるとメタプログラミ
  - kind: para
    text: ングが実現できる
  p63:
  - kind: heading
    level: 1
    text: 実行時に読める不思議なXXXX
  - kind: para
    text: リフレクション
  - kind: list
    items:
    - '関数やクラスなどの直前に #[Attr()] のような形式のコードを書くと、'
  - kind: para
    text: Reflectionという機能を使って読み取れる
  - kind: list
    items:
    - Reflection::getAttributes() でReflectionAttributeを取得できる
    - 実行時とかにいい感じに情報を読み取って処理をしてやるとメタプログラミ
  - kind: para
    text: ングが実現できる
  p64:
  - kind: heading
    level: 1
    text: Q. 何が違うの？
  p65:
  - kind: heading
    level: 1
    text: A. 違うよ、全然違うよ
  p66:
  - kind: heading
    level: 1
    text: 実際に見てみましょう
  p67: []
  p68:
  - kind: heading
    level: 1
    text: ReflectionAttribute
  - kind: list
    items:
    - getAttributes() メソッドでとれるクラス
    - $ref = new ReflectionClass(Target::class);
    - $ref->getArguments() で値だけ取れる
    - $ref->newInstance() でアトリビュートをインスタンス化できる
  p69:
  - kind: para
    text: 何が変わったのか
  - kind: list
    items:
    - 明示的にReflectionしないと何も起こらないのはDocコメントと同じ
    - Attributeを書くだけなら、ただのコメントと同じ
    - 引数の区切りがとても簡単
    - Docコメントでは自前で構文解析しないといけない
    - 静的解析ツールが自然にサポートしてくれている
    - Docコメントでは変な記述をしても気付きにくい
  p70:
  - kind: para
    text: これでAttributeの
  - kind: para
    text: 機能は全部です！
  p71:
  - kind: para
    text: 完全マスター
  - kind: para
    text: 🎉
  p72:
  - kind: para
    text: 機能はめっちゃ
  - kind: para
    text: シンプル
  p73:
  - kind: para
    text: あとはどういう「想い」を載せるか
  p74:
  - kind: heading
    level: 1
    text: 創意工夫が大事
  p75:
  - kind: heading
    level: 1
    text: とはいえ定石はある
  p76: []
  p77:
  - kind: para
    text: DI vs Attribute
  - kind: list
    items:
    - 山岡さんの2021年の発表で紹介された事例
    - 依存性注入したいデータを明示するために使う
  p78: []
  p79:
  - kind: para
    text: DB vs Attribute
  - kind: list
    items:
    - おかしょいさんの2022年の発表で紹介された事例
    - データベースとPHPのクラスのプロパティを紐付けるために使う
  p80:
  - kind: para
    text: バリデーション vs Attribute
  - kind: list
    items:
    - 2022年11月に私が書いた記事
    - アトリビュートは自然に発火しないので明示的に呼び出す必要がある
  p81:
  - kind: heading
    level: 1
    text: PHPUnit vs Docコメント
  - kind: list
    items:
    - PHPUnitはこれまでDocコメントによってテストの実行を制御できた
    - '@dataProvider, @testWith … パラメタライズドテスト'
    - '@runInSeparateProcess, @runTestsInSeparateProcess'
  - kind: para
    text: … プロセスを隔離して実行
  - kind: list
    items:
    - '@covers … カバレッジターゲットの制御'
    - '@group … テストグループの宣言'
    - Doctrine式のAnnotationではなくスペース区切りが多かった
  p82:
  - kind: para
    text: PHPUnit 10 vs Attribute
  - kind: list
    items:
    - PHPUnit 10でAttributeに移行、11で非推奨化、12で削除予定
    - 超大量の移行リスト… sebastianbergmann/phpunit#4502
    - その他の変更は02氏の
  - kind: para
    text: 発表を参照のこと
  p83:
  - kind: heading
    level: 1
    text: 明示 vs 黙示
  p84:
  - kind: para
    text: 「こっそりやる」vs「堂々とやる」
  - kind: list
    items:
    - PHPにはマクロやプリプロセッサがないので、明示的が基本ではある
    - しかし、クラスローダーを悪用してソースコードを書き換えてしまう荒技も
    - Go! AOPなどのAOPフレームワークはクラスローダーでフックする
  p85:
  - kind: para
    text: PHPの後方互換性 vs Attribute
  - kind: list
    items:
    - PHPでは継承するときに型宣言を厳密に合わせないといけない
    - PHP 8ではPHPの組み込みクラスにも型宣言が追加された
    - そうするとPHP 7/8両対応のライブラリで非常に困る
    - '#[ReturnTypeWillChange] と書くと局所的に無視できるようになった'
    - 問題の先送りができてうれしい！
  p86:
  - kind: para
    text: ひっそり佇むAttribute
  - kind: list
    items:
    - そこにあるだけでは何も起こさないというのは重要な性質
    - '# はPHPのコメント行なので、PHP 7以下のコードに書いても問題ない'
    - ということは… PHP 7以下でもパフォーマンスを気にしなければ
  - kind: para
    text: Attributeを使える
  - kind: list
    items:
    - spiral/attributes というライブラリがある
    - 開発用途やデプロイスクリプトなどで使う分には問題にならない
  p87:
  - kind: heading
    level: 1
    text: doctrine/annotations
  - kind: list
    items:
    - Docコメントのアノテーションを読み取るライブラリ
    - Attributeとだいたい同じ使い方できるが仕様が微妙に異なる
    - デフォルトでは引数は __construct(array $values) として
  - kind: para
    text: 一個の配列にまとめて渡されてしまう
  - kind: list
    items:
    - クラスに @Annotation @namedArgumentConstructor と書くと
  - kind: para
    text: Attributeと同様に個別のパラメータで受け取れるようになる
  p88:
  - kind: heading
    level: 1
    text: spiral/attributesの互換性
  - kind: list
    items:
    - PHP 7で利用できるAttributeを読み取るライブラリ
    - AnnotationとAttributeを相互運用できる
    - doctorine/annotationsのラッパーとしてPHPDocも読める
    - Annotationとの相互運用のためか、デフォルトでは引数がまとめて
  - kind: para
    text: __construct(array $values) に渡されてしまう
  - kind: list
    items:
    - 'クラスに #[Spiral\Attributes\NamedArgumentConstructor]と'
  - kind: para
    text: 書くと通常のAttributeと同じ仕様で使える
  p89:
  - kind: para
    text: ピクシブ百科事典 vs Attribute
  - kind: list
    items:
    - コントローラにルーティング情報が書ける
    - これは実行時に読まず、スクリプトでファイルに書き出す方式
  p90:
  - kind: para
    text: キミだけの最高の
  - kind: para
    text: ユースケースを
  - kind: para
    text: 見付けだせ
