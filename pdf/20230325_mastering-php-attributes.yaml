    items:
    - 関数やクラスなどの直前に /** ... */ のような形式でコメントを書くと、
  - kind: para
    text: Reflectionという機能を使って読み取れる
  - kind: list
    items:
    - Reflection::getComment() で文字列で取得できる
    - 実行時とかにいい感じに情報を読み取って処理をしてやるとメタプログラミ
