    items:
    - 人間に意図を伝えるためのドキュメント(コメント)
    - 静的解析ツールが情報を読み取ってコードを検査するための情報
    - フレームワークなどが情報を読み取って振る舞いを制御する
    - プログラミング処理系(PHP)に特別な処理をさせるための指定
  - kind: para
