  - kind: para
    text: プログラムについての
  - kind: para
    text: プログラミング
  p48:
  - kind: heading
    level: 1
    text: メタプログラミングってつまり何
  - kind: para
    text: ブラックマジック
  - kind: list
    items:
    - プログラムそのものを対象にするプログラミング
    - クラスや関数などを動的に呼び出したり
    - ある処理をしたいとき、コードに直接的に書かなくても実現したりできる
    - 明示的に定義してなくてもなんか動いてたりするやつ
    - フレームワークのようなコードは大なり小なりメタプロ的な要素がある
    - 理窟がよくわからんけど動いてたりするのはこれ (魔法とか黒魔術とか…)
  p49:
  - kind: para
    text: メタプロするならコードから情報を読み取れるとうれしい
  p50:
  - kind: heading
    level: 1
    text: (それが全てではない)
  p51:
  - kind: heading
    level: 1
    text: ということで
  p52: []
  p53: []
  p54:
  - kind: para
    text: 基本的な定義方法
  - kind: para
    text: use Attribute;#[Attribute(Attribute::TARGET_CLASS| Attribute::IS_REPEATABLE)]class
      MyAttr {
  p55:
  - kind: para
    text: 基本的な使いかた
  - kind: para
    text: use MyAttr;#[MyAttr('foo', 'bar', 'buz')]class Book{
  p56:
  - kind: para
    text: 名前付きの呼び出しも可能
  - kind: para
    text: 'use MyAttr;#[MyAttr(a: ''foo'', b: ''bar'', c: ''buz'')]class Book{'
  p57:
  - kind: heading
    level: 1
    text: Attributeはどこに書けるの？
  - kind: para
    text: 宣伝
  - kind: list
    items:
    - 現在Reflectionから読み取れるのは6箇所
    - クラス
    - 関数
    - メソッド
    - プロパティ
    - パラメータ (仮引数)
  p58:
  - kind: para
    text: これでみなさまはAttributeを定義でき
  - kind: para
    text: るようになりました
  p59:
  - kind: heading
    level: 1
    text: ね、簡単でしょ？
  p60:
