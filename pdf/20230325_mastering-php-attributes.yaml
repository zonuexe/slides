  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: おかしょいさんの2022年の発表で紹介された事例
    - node: li
      children:
      - node: text
        content: データベースとPHPのクラスのプロパティを紐付けるために使う
  p80:
  - node: p
    children:
    - node: text
      content: バリデーション vs Attribute
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2022年11月に私が書いた記事
    - node: li
      children:
      - node: text
        content: アトリビュートは自然に発火しないので明示的に呼び出す必要がある
  p81:
  - node: p
    children:
    - node: text
      content: PHPUnit vs Docコメント
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPUnitはこれまでDocコメントによってテストの実行を制御できた
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: '@dataProvider, @testWith … パラメタライズドテスト'
        - node: li
          children:
          - node: text
            content: '@runInSeparateProcess, @runTestsInSeparateProcess'
          - node: br
          - node: text
            content: '… プロセスを隔離して実行 '
        - node: li
          children:
          - node: text
            content: '@covers … カバレッジターゲットの制御'
        - node: li
          children:
          - node: text
            content: '@group … テストグループの宣言'
    - node: li
      children:
      - node: text
        content: Doctrine式のAnnotationではなくスペース区切りが多かった
  p82:
  - node: p
    children:
    - node: text
      content: PHPUnit 10 vs Attribute
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPUnit 10でAttributeに移行、11で非推奨化、12で削除予定
    - node: li
      children:
      - node: text
        content: 超大量の移行リスト… sebastianbergmann/phpunit#4502
    - node: li
      children:
      - node: text
        content: その他の変更は02氏の
      - node: br
      - node: text
        content: 発表を参照のこと
  p83:
  - node: p
    children:
    - node: text
      content: 明示 vs 黙示
  p84:
  - node: p
    children:
    - node: text
      content: 「こっそりやる」vs「堂々とやる」
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPにはマクロやプリプロセッサがないので、明示的が基本ではある
    - node: li
      children:
      - node: text
        content: しかし、クラスローダーを悪用してソースコードを書き換えてしまう荒技も
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Go! AOPなどのAOPフレームワークはクラスローダーでフックする
  p85:
  - node: p
    children:
    - node: text
      content: PHPの後方互換性 vs Attribute
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPでは継承するときに型宣言を厳密に合わせないといけない
    - node: li
      children:
      - node: text
        content: PHP 8ではPHPの組み込みクラスにも型宣言が追加された
    - node: li
      children:
      - node: text
        content: そうするとPHP 7/8両対応のライブラリで非常に困る
    - node: li
      children:
      - node: text
        content: '#[ReturnTypeWillChange] と書くと局所的に無視できるようになった'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 問題の先送りができてうれしい！
  p86:
  - node: p
    children:
    - node: text
      content: ひっそり佇むAttribute
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: そこにあるだけでは何も起こさないというのは重要な性質
    - node: li
      children:
      - node: text
        content: '# はPHPのコメント行なので、PHP 7以下のコードに書いても問題ない'
    - node: li
      children:
      - node: text
        content: ということは… PHP 7以下でもパフォーマンスを気にしなければ
      - node: br
      - node: text
        content: 'Attributeを使える '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: spiral/attributes というライブラリがある
        - node: li
          children:
          - node: text
            content: 開発用途やデプロイスクリプトなどで使う分には問題にならない
  p87:
  - node: p
    children:
    - node: text
      content: doctrine/annotations
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Docコメントのアノテーションを読み取るライブラリ
    - node: li
      children:
      - node: text
        content: Attributeとだいたい同じ使い方できるが仕様が微妙に異なる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: デフォルトでは引数は __construct(array $values) として
          - node: br
          - node: text
            content: '一個の配列にまとめて渡されてしまう '
        - node: li
          children:
          - node: text
            content: クラスに @Annotation @namedArgumentConstructor と書くと
          - node: br
          - node: text
            content: Attributeと同様に個別のパラメータで受け取れるようになる
  p88:
  - node: p
    children:
    - node: text
      content: spiral/attributesの互換性
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP 7で利用できるAttributeを読み取るライブラリ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: AnnotationとAttributeを相互運用できる
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: doctorine/annotationsのラッパーとしてPHPDocも読める
        - node: li
          children:
          - node: text
            content: Annotationとの相互運用のためか、デフォルトでは引数がまとめて
          - node: br
          - node: text
            content: '__construct(array $values) に渡されてしまう '
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: 'クラスに #[Spiral Attributes NamedArgumentConstructor]と'
  - node: p
    children:
    - node: text
      content: \ \
  - node: p
    children:
    - node: text
      content: '書くと通常のAttributeと同じ仕様で使える '
  p89:
  - node: p
    children:
    - node: text
      content: ピクシブ百科事典 vs Attribute
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: コントローラにルーティング情報が書ける
    - node: li
      children:
      - node: text
        content: これは実行時に読まず、スクリプトでファイルに書き出す方式
  p90:
  - node: p
