  p8:
  - kind: para
    text: ジェネリクスの話をしよう
  p9:
  - kind: heading
    level: 1
    text: ジェネリックプログラミング - Wikipedia(2022-05-02T17:30:09の版)より引用
  p10:
  - kind: para
    text: データ型に依存しない…？
  p11:
  - kind: para
    text: 抽象的かつ汎用的…？
  p12: []
  p13:
  - kind: para
    text: まず基本的な静的型の話
  p14:
  - kind: heading
    level: 1
    text: 静的型付け (statically typing)
  - kind: list
    items:
    - 静的 = 実行しなくても型がわかる状態 (反対語は動的 = プログラム実行)
    - 型宣言 (コードに型を書く)
    - 現状のPHPではパラメータとプロパティに型宣言できる
    - PHPは処理系が実行時の型を保障してくれる (口約束ではない！)
    - 型推論 (文字で型を書かなくても空気を読んでくれる)
    - $a = count($array) のとき $a の型は常に int
    - $b = 1 + 2 の結果は int(3)
  p15:
  - kind: para
    text: 型付けの具体例を見ていきましょう
  p16:
  - kind: para
    text: まずはジェネリクスとあまり関係ない例
  p17:
  - kind: heading
    level: 1
    text: 型がついていない関数(PHP5)
  - kind: para
    text: 型宣言なし
  - kind: para
    text: ＝ mixed
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p18:
  - kind: heading
    level: 1
    text: スカラー型宣言(PHP7)
  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p19:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にfloatを強制するのか
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p20:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p21:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p22:
  - kind: heading
    level: 1
    text: 基本的な型宣言
  - kind: list
    items:
    - PHPの言語として記述できる静的な型宣言は大まかに3種類
    - 具体的な型
    - int, float, string, bool, array, DateTimeInterface, ...
    - 複合的な型
    - A|B, int|false, ?DateTime, ArrayAccess&Traversable ...
    - 型定義をしない (または mixed)
  p23:
  - kind: para
    text: かくして世界は型の炎に包まれた
  p24:
  - kind: para
    text: だが型なしは死滅していなかった
  p25:
  - kind: para
    text: 別の例を考えてみましょう
  p26:
  - kind: heading
    level: 1
    text: 配列の先頭要素を返す関数
  - kind: para
    text: 'function first(array $a, mixed $default): mixed {return $a[0] ?? $default;}'
  - kind: para
    text: $vの型は何？
  - kind: para
    text: $v = first([0, 1, 2], 'default');
  p27:
  - kind: heading
    level: 1
    text: int専用関数をつくろう
  - kind: para
    text: 'function first_int(array $a): ?int {return $a[0] ?? null;}'
  - kind: para
    text: $v = first_int([0, 1, 2]) ?? 'default';
  p28:
  - kind: heading
    level: 1
    text: string専用関数をつくろう
  - kind: para
    text: 'function first_string(array $a): ?string return $a[0] ?? null;}'
  - kind: para
    text: $v = first_string(['a', 'b', 'c']) ?? 'default';
  p29:
  - kind: heading
    level: 1
    text: DateTime専用関数をつくろう
  - kind: para
    text: 'function first_DateTime(array $a): ?DateTime return $a[0] ?? null;}'
  - kind: para
    text: $v = first_DataTime([]) ?? 'default';
  p30:
  - kind: para
    text: 関数量産はめんどくさい
  p31:
  - kind: heading
    level: 1
    text: ユニオン型は問題解決しない
  - kind: para
    text: なんでDateTimeとか
  - kind: para
    text: 'function first(array $a): int|string|DateTime|null {return $a[0] ?? $default;}'
  - kind: para
    text: 出てくるの？
  - kind: para
    text: $v = first([0, 1, 2], 'default');
  p32:
  - kind: para
    text: ?DateTimeとかint|falseくらいなら問題ない
  p33:
  - kind: para
    text: それを補うのがPHPDoc
  p34:
  - kind: para
    text: PHPDocタグいくついえるかな
  p35:
  - kind: heading
    level: 1
    text: '@param'
  p36:
  - kind: heading
    level: 1
    text: '@return'
  p37:
  - kind: heading
    level: 1
    text: '@var'
  p38:
  - kind: heading
    level: 1
    text: '@template'
  p39:
  - kind: heading
    level: 1
    text: …なにそれ？
  p40:
  - kind: heading
    level: 1
    text: '@template は型変数'
  - kind: para
    text: /*** @template TValue* @template TDefault* @param array<TValue> $a* @param
      TDefault $default* @return TValue|TDefault*/function first(array $a, mixed $default)
      {
  p41: []
  p42: []
  p43:
  - kind: heading
    level: 1
    text: やっていきましょう
  p44: []
  p45: []
  p46:
  - kind: para
    text: いまは内部型表現の制約でシンプルな型しか付かないが
  p47:
  - kind: para
    text: そのうち万病に効くようになる
  p48: []
  p49: []
  p50:
  - kind: para
    text: テンプレートはクラスにも書ける
  p51: []
  p52:
  - kind: para
    text: ジェネレータでも使える
  p53: []
  p54:
  - kind: para
    text: コレクションも簡単に定義できる
  p55: []
