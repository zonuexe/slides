    text: モナド
  p59: []
  p60:
  - kind: para
    text: 実際難しいことは(そんなに)やってない
  p61:
  - kind: para
    text: 試行錯誤したことがない技術が難しいのはあたりまえ
  p62:
  - kind: para
    text: PHPStanはWebでこねこね試行錯誤がやりやすい
  p63:
  - kind: para
    text: PHPStan完全にマスターしよう
  p64: []
  p65:
  - kind: para
    text: 今回はひたすら実例を詰め込んで話しました
  p66:
  - kind: para
    text: ジェネリクスの知識はなくてもPHPStanは使える
