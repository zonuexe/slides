  - node: p
    children:
    - node: text
      content: Web application implementation pattern based on PSR-7 and15
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2022-04-11 '
  - node: p
    children:
    - node: bold
      content: PHPerKaigi Day 2
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: PHPerKaigi コアスタッフ、PHPカンファレンス実行委員
  p3:
  - node: p
    children:
    - node: text
      content: tadsanのあれこれが読める場所
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: https://tadsan.fanbox.cc/
    - node: li
      children:
      - node: text
        content: https://scrapbox.io/php/
    - node: li
      children:
      - node: text
        content: https://www.phper.ninja/
    - node: li
      children:
      - node: text
        content: https://zenn.dev/tadsan
    - node: li
      children:
      - node: text
        content: https://qiita.com/tadsan
    - node: li
      children:
      - node: text
        content: https://github.com/bag2php
  p4:
  - node: p
    children:
    - node: text
      content: 前回のPHPerKaigi
  p5:
  - node: p
    children:
    - node: text
      content: 去年のPHPカンファレンス
  p6:
  - node: p
    children:
    - node: text
      content: 一昨年のPHPカンファレンス
  p7:
  - node: p
    children:
    - node: text
      content: Software Design 11月号
  p8:
  - node: p
    children:
    - node: text
      content: WEB+DB PRESS総集編
  p9:
  - node: p
    children:
    - node: text
      content: WEB+DB PRESS Vol.96
  - node: p
    children:
    - node: text
      content: (2016年)
  p10:
  - node: p
    children:
    - node: text
      content: WEB+DB PRESS Vol.96
  - node: p
    children:
    - node: text
      content: (2017年)
  p11:
  - node: p
    children:
    - node: text
      content: 仕事の話
  p12:
  - node: p
    children:
    - node: text
      content: Powered by PSR-15
  p13:
  - node: p
    children:
    - node: text
      content: PIXIV SPRING BOOT CAMP
  p14:
  - node: p
    children:
    - node: text
      content: たぶん近日中に夏インターンも募集
  p15:
  - node: p
    children:
    - node: text
      content: それそろフレームワークとしての
  - node: p
    children:
    - node: text
      content: '改善ポイントが '
  - node: p
    children:
    - node: text
      content: 突っ込みどころ
    - node: br
    - node: text
      content: '枯渇しつつあるので '
    - node: br
    - node: text
      content: 参加したい学生はお早めに
  p16:
  - node: p
    children:
    - node: text
      content: 今回のお題
  p17:
  - node: p
    children:
    - node: text
      content: プロポーザル
  p18:
  - node: p
    children:
    - node: text
      content: 日本語のPSR-HTTP関連資料集
  p19:
  - node: p
    children:
    - node: text
      content: Webフレームワークを 作りたい人や内部構造
    - node: br
    - node: text
      content: を理解したい人向け
  p20:
  - node: p
    children:
    - node: text
      content: 前半はフレームワーク
    - node: br
    - node: text
      content: 一般 概念 話
  - node: p
    children:
    - node: text
      content: の の もします
  p21:
  - node: p
    children:
    - node: text
      content: 後半もPSR-15入門 とテスト方法みたいな
    - node: br
    - node: text
      content: 話に終始します
  p22:
  - node: p
    children:
    - node: text
      content: '最後のスライド '
    - node: br
    - node: text
      content: (予告)
  p23:
  - node: p
    children:
    - node: text
      content: 俺たちのPSR-15道は
    - node: br
    - node: text
      content: 'これからだ！ '
    - node: br
    - node: text
      content: (ご静聴ありがとうございました。 tadsanの次回作にご期待ください)
  p24:
  - node: p
    children:
    - node: text
      content: さて
  p25:
  - node: p
    children:
    - node: text
      content: 誰がPSR-15を使うのか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSR標準に準拠したフレームワークを開発したい人
    - node: li
      children:
      - node: text
        content: CakePHPのようなPSR-15準拠フレームワークでミドルウェアを書く必要
      - node: br
      - node: text
        content: 'に迫られた人 '
    - node: li
      children:
      - node: text
        content: シンプルなライブラリを組み合わせだけで、
      - node: br
      - node: text
        content: リーンでクリーンなWebアプリを開発したい人
  p26:
  - node: p
    children:
    - node: text
      content: PSRとは
  p27:
  - node: p
    children:
    - node: text
      content: PHP-FIG
  p28:
  - node: p
    children:
    - node: text
      content: PSRs
  p29:
  - node: p
    children:
    - node: text
      content: PSR
  - node: p
    children:
    - node: text
      content: (PHP Standard Recommendation)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP-FIG(PHP相互運用グループ)という団体が策定する標準勧告
    - node: li
      children:
      - node: text
        content: コーディング規約やインターフェイス定義などが定められている
    - node: li
      children:
      - node: text
        content: フレームワークやCMSの開発団体間で共通仕様を策定して
      - node: br
      - node: text
        content: 'コンポーネントを相互運用できるようにすることが目的 '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 本来はメンバー間での相互運用が目的なのだが、
          - node: br
          - node: text
            content: われわれ下々の一般PHPerもその成果物の恩恵に与っている恰好
  p30:
  - node: p
    children:
    - node: text
      content: よく知られたPSR
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSR-4 オートローディング
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 名前空間とディレクトリをマッピングするルール。Composerで利用可能
    - node: li
      children:
      - node: text
        content: PSR-1 基本コーディング標準
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ファイル名はUTF-8で、定義とスクリプトのファイル分離など基本ルール
    - node: li
      children:
      - node: text
        content: PSR-12 拡張コーディングスタイルガイド
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 改行やスペース位置などのスタイル策定のベースになるガイド
  p31:
  - node: p
    children:
    - node: text
      content: PSR interfaces
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSR-3 ロガー
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: syslog風の汎用ロギングインターフェイス
    - node: li
      children:
      - node: text
        content: PSR-11 コンテナ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: DIコンテナと例外送出のインターフェイス
    - node: li
      children:
      - node: text
        content: PSR-6 キャッシュ / PSR-16 単純なキャッシュ(SimpleCache)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: TTL(寿命)付きで値を保持するクラスのインターフェイス
  p32:
  - node: p
    children:
    - node: text
      content: インターフェイス 概要
  - node: p
    children:
    - node: text
      content: '(interface) '
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: class定義に似ているが、クラスが備えるべきメソッドの型だけ宣言したもの
    - node: li
      children:
      - node: text
        content: interface名は型宣言(パラメータや戻り値、プロパティなど)に利用できる
    - node: li
      children:
      - node: text
        content: クラスは複数のインターフェイスを実装(implements)できる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PHPのクラスは一つだけ継承(extends)できるのと対照的
    - node: li
      children:
      - node: text
        content: class定義と分けることで、具体的な実装と抽象を分離できる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 同じインターフェイスを実装したクラスに交換可能になる
  p33:
  - node: p
    children:
    - node: text
      content: 余談：PSRへの誤解
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSRは全PHP開発者が守らなければいけない標準という性質ではない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PHP-FIG参加メンバーも勧告に従うかどうかは任意
    - node: li
      children:
      - node: text
        content: PSR-2/PSR-12(スタイルガイド)は規約ではなく、
      - node: br
      - node: text
        content: 'プロジェクトごとにスタイルを策定するためのガイドラインです '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: カスタマイズする場合でも、PHP-CS-FixerやPHP_CodeSnifferのよう
          - node: br
          - node: text
            content: 'なツールでPSR-12からの差分で定義できるというのがメリット '
  p34:
  - node: p
    children:
    - node: text
      content: PSR vs HTTP
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSRではHTTPに関連するオブジェクトのインターフェイスを定義している
    - node: li
      children:
      - node: text
        content: PSR-7 HTTPメッセージ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: リクエスト、レスポンス、URI、ストリームなどのインターフェイスを定義
        - node: li
          children:
          - node: text
            content: PSR-17でこれらメッセージオブジェクトのファクトリが定義されている
    - node: li
      children:
      - node: text
        content: PSR-15 HTTPハンドラ(ミドルウェア)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: リクエストハンドラとミドルウェアのインターフェイスを定義
  p35:
  - node: p
    children:
    - node: text
      content: PSRのコンセプトについて最重要資料
  p36:
  - node: p
    children:
    - node: text
      content: PSR-7のおさらい
  p37:
  - node: p
    children:
    - node: text
      content: PSR-7 HTTP Messages
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 不変(イミュータブル)が基本 (Streamを除く)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: setXXXのようなメソッドは存在しない
    - node: li
      children:
      - node: text
        content: 継承関係がある
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Psr Http MessageInterface (レスポンスとリクエストの共通集合)
          - node: br
          - node: text
            content: \ \
          - node: br
          - node: text
            content: ├─ RequestInterface       (HTTPリクエスト) │ 　└─ ServerRequestInterface
              (↑+追加情報) └─ ResponseInterface      (HTTPレスポンス)
  p38:
  - node: p
    children:
    - node: text
      content: 不変性
  - node: p
    children:
    - node: text
      content: (immutability)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 一度作ったオブジェクト内部の状態が変わることはない
    - node: li
      children:
      - node: text
        content: 状態を付加したいときは $res->setHeader()のような操作はできず、
      - node: br
      - node: text
        content: '$res = $res->withHeader() のように追記する '
    - node: li
      children:
      - node: text
        content: この性質により、一度作ったインスタンスオブジェクトが別の場所で
      - node: br
      - node: text
        content: 意図せず書き換えられる可能性を避けられるので非常に安全
  p39:
  - node: p
    children:
    - node: text
      content: PSR-7 Packages
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSR-7を実装するパッケージは複数あり、基本的には交換可能
  - node: p
    children:
    - node: text
      content: https://packagist.org/providers/psr/http-message-implementation
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 基本的にはWebフレームワークとHTTPクライアントどちらでも使える
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: guzzlehttp/psr7, nyholm/psr7,
          - node: br
          - node: text
            content: 'laminas/laminas-diactoros, slim/psr7などがある '
        - node: li
          children:
          - node: text
            content: Guzzleのstreamは機能豊富、Nyholmは軽量などの特徴がある
  p40:
  - node: p
    children:
    - node: text
      content: ServerRequestInterface
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: RequestInterfaceを継承したインターフェイス
    - node: li
      children:
      - node: text
        content: $_SERVER, $_GET, $_POST, $_COOKIE, $_FILES相当の
      - node: br
      - node: text
        content: 'データを扱うメソッドが追加されている '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: withCookieParams()などは$_COOKIE相当のデータを付加するが、 内部で保持するHTTPヘッダを書き換えてはならない(MUST
              NOT)と仕
          - node: br
          - node: text
            content: '様で明言されている '
        - node: li
          children:
          - node: text
            content: withAttribute()/getAttribute()という、事実上なんでも入れていい
          - node: br
          - node: text
            content: 収納スペースがある
  p41:
  - node: p
    children:
    - node: text
      content: ServerRequest::withAttribute()
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'アトリビュート(属性)という名前が付いているが、PHP 8で追加された #[Attributes] とは何の関係もなく、単に付加的な情報を持たせる '
    - node: li
      children:
      - node: text
        content: 型的には文字列をキーにして、本当にあらゆるものが付与できてしまう
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 原則何を入れてもいいのだが、ユーザーのリクエストと関連のあるものに
          - node: br
          - node: text
            content: '限って含めた方がとり回しがよくなるはず '
        - node: li
          children:
          - node: text
            content: キーにも任意の値をセットできるが、クラス名文字列を活用すると明示的
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: $req->withAttribute(Session::class, new ConcreteSession())
            - node: li
              children:
              - node: text
                content: 個人的には単なるスカラー値よりオブジェクトで統一するのが安全と思う
  p42:
  - node: p
    children:
    - node: text
      content: ResponseInterface
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: RequestInterfaceとは異なり、Server…版は存在しない
    - node: li
      children:
      - node: text
        content: レスポンスボディは文字列ではなく、StreamInterfaceを実装した
      - node: br
      - node: text
        content: 'オブジェクトで表現する '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ボディをセットするには $response->withBody()を使う方法と
          - node: br
          - node: text
            content: '$response->getBody()->write()する方法がある '
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: 後者は追記になってしまうので、前者の方が確実
  p43:
  - node: p
    children:
    - node: text
      content: PSR-17 HTTP Factories
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSR-7オブジェクトを生成する役割のインターフェイス
    - node: li
      children:
      - node: text
        content: $res = new GuzzleHttp Psr7 Response()と書く代りに
  - node: p
    children:
    - node: text
      content: \ \
  - node: p
    children:
    - node: text
