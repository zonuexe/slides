  - kind: para
    text: header()ob_start()echo echoset_cookie() ob_end_flush()
  - kind: para
    text: $_SERVER
  p60:
  - kind: heading
    level: 1
    text: よくある従来のPHPスクリプト(CGI型)
  - kind: list
    items:
    - どこでもユーザー入力をグローバル変数から参照する
  - kind: para
    text: ($_GET, $_SERVER, $_COOKIEなど)
  - kind: list
    items:
    - どこでもheader()関数でHTTPヘッダを設定したり、
  - kind: para
    text: どこでもechoしてHTMLを出力したりすることができる
  - kind: list
    items:
    - 呼ばれた関数の処理の奥底で何気なくheader()や
  - kind: para
    text: setcookie()関数を呼んでセットされてたりするやつ
  - kind: list
    items:
    - 処理を全部追わないと最終的な出力 (レスポンスヘッダ・ボディ)がわからん
  p61:
  - kind: para
    text: こういう世界とどうやって整合性を合わせるのか
  p62:
  - kind: para
    text: PSR-7の出力 (emit)
  - kind: list
    items:
    - ResponseInterfaceを出力する役割 (PSR-7の仕様外)
    - ApacheやPHP-FPMで動かしているなら自作することも
  - kind: para
    text: 割と簡単にできるが、できればライブラリに任せた方がいい
  - kind: list
    items:
    - 従来型環境での定番は laminas/laminas-httphandlerrunner
    - SapiEmitterとSapiStreamEmitterの2種類がある
    - 一回で出力するか、リソースから読み込めた都度出力するかの違い
  p63:
  - kind: heading
    level: 1
    text: PSR-7の出力 (emit)
  - kind: para
    text: // 概念的なざっくり実装。ほんとはもうちょっと考慮事項がある
  - kind: para
    text: 'function emitResponse(ResponseInterface $response): void{http_response_code($response->getStatusCode());foreach
      ($response->getHeaders() as $name => $values) {foreach ((array)$values as $value)
      {header("{$name}: {$value}");}}'
  - kind: para
    text: echo $response->getBody();}
  p64:
  - kind: para
    text: PSR-7の入力 (ServerRequestの錬成)
  - kind: list
    items:
    - ServerRequestはどこから来るの？
    - 各PSR-7ライブラリとかがグローバル変数から情報をひっこぬいて
  - kind: para
    text: ServerRequestを作ってくれる便利クラスを提供してる(fromGlobals)
  - kind: list
    items:
    - Guzzleの場合はServerRequest::fromGlobals()と呼ぶだけ
    - Nyholmはnyholm/psr7-serverという別パッケージに分離されてる
    - 基本的に一箇所で一回だけ生成するようにした方がいい
