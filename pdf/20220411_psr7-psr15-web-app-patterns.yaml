  p123:
  - kind: heading
    level: 1
    text: テストの準備 (HttpFactoryTrait)
  - kind: para
    text: use Nyholm\Psr7\Factory\Psr17Factory;
  - kind: para
    text: 'trait HttpFactoryTrait{private function psr17factory(): Psr17Factory{return
      new Psr17Factory();}'
  p124:
  - kind: heading
    level: 1
    text: テストの準備 (HttpFactoryTrait)
  - kind: para
    text: 'public function getRequestFactory(): RequestFactoryInterface{return $this->psr17factory();}'
  - kind: para
    text: 'public function getResponseFactory(): ResponseFactoryInterface{return $this->psr17factory();}'
  - kind: para
    text: 'public function getServerRequestFactory(): ServerRequestFactoryInterface{'
  p125:
  - kind: heading
    level: 1
    text: テストの準備 (HttpFactoryTrait)
  - kind: para
    text: '/*** Create a new stream from a string.** The stream SHOULD be created
      with a temporary resource.** @param string $content String content with which
      to populate the stream.*/public function createStream(string $contents): StreamInterface{return
      $this->getStreamFactory()->createStream($contents);}'
  p126:
  - kind: heading
    level: 1
    text: HttpFactoryTraitの特徴
  - kind: list
    items:
    - 特定のPSR-7ライブラリにあえて強く依存している
    - Nyholm Psr17Factoryは状態を持たないのでオブジェクトをキャッシュ
  - kind: para
    text: してもいいが、そもそも状態をまったく持たない軽量なオブジェクトなので必要な都度新しいインスタンスを作ってもボトルネックにならない
  - kind: list
    items:
    - 正攻法であればsetUpやsetUpBeforeClassで注入する形をとるが、
  - kind: para
    text: dataProviderから依存できるようにあえて割り切っている
  p127:
  - kind: heading
    level: 1
    text: テストしてみよう (setup)
  - kind: para
    text: class HelloJsonHandlerTest extends \PHPUnit\Framework\TestCase{use Helper\HttpFactoryTrait;
  - kind: para
    text: private HelloJsonHandler $subject;
  - kind: para
    text: 'public function setUp(): void {parent::setUp();'
  - kind: para
    text: $this->subject = new HelloJsonHandler($this->getStreamFactory(), $this->getResponseFactory());}
  p128:
  - kind: heading
    level: 1
    text: テスト
  - kind: para
    text: '/*** @dataProvider requestProvider*/public function test(ServerRequest
      $request, array $expected): void{$actual = $this->subject->handle($request);'
  - kind: para
    text: $this->assertSame($expected['status_code'], $actual->getStatusCode());$this->assertEquals($expected['headers'],
      $actual->getHeaders());$this->assertSame($expected['body'], (string)$actual->getBody());}
  p129:
  - kind: heading
    level: 1
    text: テスト (dataProvider)
  - kind: para
    text: 'public function requestProvider(): iterable{yield ''GET'' => [$this->createServerRequest(''GET'',
      ''/dummy''),[''status_code'' => 200,''headers'' => [''Content-Type'' => [''application/json''],],''body''
      => ''{"Hello":"World"}'',],];'
  p130:
  - kind: heading
    level: 1
    text: テスト (再掲)
  - kind: para
    text: '/*** @dataProvider requestProvider*/public function test(ServerRequest
      $request, array $expected): void{$actual = $this->subject->handle($request);'
  - kind: para
    text: $this->assertSame($expected['status_code'], $actual->getStatusCode());$this->assertEquals($expected['headers'],
      $actual->getHeaders());$this->assertSame($expected['body'], (string)$actual->getBody());}
  p131:
  - kind: heading
    level: 1
    text: テスト (dataProviderを追加)
  - kind: para
    text: $default_expected = ['status_code' => 404, 'headers' => [], 'body' => ''];
  - kind: para
    text: $http_methods = ['POST', 'PUT', 'DELETE'];
  - kind: para
    text: foreach ($http_methods as $method) {yield $method => [$this->createServerRequest($method,
      '/dummy'),$default_expected,];}
  p132:
  - kind: heading
    level: 1
    text: テスト (dataProviderを追加)
  - kind: para
    text: $default_expected = ['status_code' => 404, 'headers' => [], 'body' => ''];
  - kind: para
    text: $http_methods = ['POST', 'PUT', 'DELETE'];
  - kind: heading
    level: 2
    text: GET以外のメソッドは
  - kind: heading
    level: 2
    text: すべて結果は同じになる
  - kind: para
    text: foreach ($http_methods as $method) {yield $method => [$this->createServerRequest($method,
      '/dummy'),$default_expected,];}
  p133:
  - kind: heading
    level: 1
    text: PHPUnit実行結果
  p134:
  - kind: para
    text: RequestHandlerテストの要点
  - kind: list
    items:
    - テストケースの内容はごく薄くする
    - 「この値を渡したときに必ずこの値を返す」という構造に落とし込む
    - そうなっていないなら依存の分離がうまくいっていない
    - 戻り値となるResponseオブジェクトからは、特に
  - kind: para
    text: getStatusCode(), getHeaders(), getBody()に注目する
  - kind: list
    items:
    - bodyが巨大な場合は必ずしもassertSame()で比較する必要はない
