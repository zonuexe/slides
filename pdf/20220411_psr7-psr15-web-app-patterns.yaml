      content: class HttpsRedirectMiddleware implements MiddlewareInterface
    - node: br
    - node: text
      content: '{'
    - node: br
    - node: text
      content: '  public function process(         '
    - node: br
    - node: text
      content: '    ServerRequest $request, RequestHandler $handler): Response         '
    - node: br
    - node: text
      content: '  {'
    - node: br
    - node: text
      content: '    $uri = $request->getUri();'
    - node: br
    - node: text
      content: '    if (strtolower($uri->getScheme()) !== ''https'') {'
    - node: br
    - node: text
      content: '      return $this->response_factory->createResponse(302)'
    - node: br
    - node: text
      content: '        ->withHeader(''Location'', [(string)$uri->withScheme(''https'')]);'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '    return $handler->handle($request);'
    - node: br
    - node: text
