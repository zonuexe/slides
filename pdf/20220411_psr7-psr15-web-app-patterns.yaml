    - PHPにとってのWebフレームワークには二つの性質がある
    - PHP標準ではめんどくさい機能を実現する便利ライブラリの集合体
    - フリーダムにどこでもなんでも書けてしまうPHPの機能に規則を
  - kind: para
    text: 与えることで秩序をもたらす拘束具
  - kind: list
    items:
    - PSR-7/15は従来型のPHPにとって縛りプレイのための異物に過ぎない
  p75:
  - kind: heading
    level: 1
    text: 縛ることによって得られるもの
  - kind: list
    items:
    - $_GETのようなグローバル変数やheader()のような関数を排斥することで
  - kind: para
    text: 入出力が明確に分離されてコードの見通しがよくなり、テストしやすくなる
  - kind: list
    items:
    - Long-livingなPHPとの親和性
    - 従来のPHPはリクエストごとに全ての状態がリセットされるのに対して、
  - kind: para
    text: RoadRunnerやSwooleでHTTPサーバを立てると毎回リセットされない
  - kind: list
    items:
    - そのような環境ではCLI SAPIで動作するので、$_GETや関数からリクエス
  - kind: para
    text: ト情報が得られないし、echoしてもHTTPレスポンスにならない
  p76:
  - kind: heading
    level: 1
    text: Long-living PHPとの互換性
  - kind: list
    items:
    - 入口と出口、つまりServerRequestを作る部分とエミッタを差し替えれば
  - kind: para
    text: ApacheやPHP-FPMなど従来型のPHP環境でも動かせるようになる
  - kind: list
    items:
    - 最近はフレームワークが実行環境の差異を吸収してくれるようになった
    - Symfony Runtime + https://github.com/php-runtime
    - Laravel Octane
  p77:
  - kind: heading
    level: 1
    text: CyberAgent白井さんの発表
  p78:
  - kind: para
    text: Long-living PHPの世界
  - kind: list
    items:
    - 従来環境とはオブジェクトの初期化や生存期間の概念が変わるので注意
    - $_SERVER, $_GETのようなグローバル変数や
  - kind: para
    text: header()、setcookie()のような関数が今まで通りの動きをしない
  - kind: list
    items:
    - Laravelでもこれらの機能を使うことはできたが、動かなくなる
    - 定数、グローバル変数、静的プロパティなどもリセットされなくなる
    - グローバルな状態を持たず引数と戻り値に閉じていれば問題ない
