  p25:
  - kind: para
    text: 誰がPSR-15を使うのか
  - kind: list
    items:
    - PSR標準に準拠したフレームワークを開発したい人
    - CakePHPのようなPSR-15準拠フレームワークでミドルウェアを書く必要
  - kind: para
    text: に迫られた人
  - kind: list
    items:
    - シンプルなライブラリを組み合わせだけで、
  - kind: para
    text: リーンでクリーンなWebアプリを開発したい人
  p26:
  - kind: heading
    level: 1
    text: PSRとは
  p27:
  - kind: heading
    level: 1
    text: PHP-FIG
  p28:
  - kind: heading
    level: 1
    text: PSRs
  p29:
  - kind: para
    text: PSR (PHP Standard Recommendation)
  - kind: list
    items:
    - PHP-FIG(PHP相互運用グループ)という団体が策定する標準勧告
    - コーディング規約やインターフェイス定義などが定められている
    - フレームワークやCMSの開発団体間で共通仕様を策定して
  - kind: para
    text: コンポーネントを相互運用できるようにすることが目的
  - kind: list
    items:
    - 本来はメンバー間での相互運用が目的なのだが、
  - kind: para
    text: われわれ下々の一般PHPerもその成果物の恩恵に与っている恰好
  p30:
  - kind: para
    text: よく知られたPSR
  - kind: list
    items:
    - PSR-4 オートローディング
    - 名前空間とディレクトリをマッピングするルール。Composerで利用可能
    - PSR-1 基本コーディング標準
    - ファイル名はUTF-8で、定義とスクリプトのファイル分離など基本ルール
    - PSR-12 拡張コーディングスタイルガイド
    - 改行やスペース位置などのスタイル策定のベースになるガイド
  p31:
  - kind: para
    text: PSR interfaces
  - kind: list
    items:
    - PSR-3 ロガー
    - syslog風の汎用ロギングインターフェイス
    - PSR-11 コンテナ
    - DIコンテナと例外送出のインターフェイス
    - PSR-6 キャッシュ / PSR-16 単純なキャッシュ(SimpleCache)
    - TTL(寿命)付きで値を保持するクラスのインターフェイス
  p32:
  - kind: para
    text: インターフェイス(interface) 概要
  - kind: list
    items:
    - class定義に似ているが、クラスが備えるべきメソッドの型だけ宣言したもの
    - interface名は型宣言(パラメータや戻り値、プロパティなど)に利用できる
    - クラスは複数のインターフェイスを実装(implements)できる
    - PHPのクラスは一つだけ継承(extends)できるのと対照的
    - class定義と分けることで、具体的な実装と抽象を分離できる
    - 同じインターフェイスを実装したクラスに交換可能になる
  p33:
  - kind: heading
    level: 1
    text: 余談：PSRへの誤解
  - kind: list
    items:
    - PSRは全PHP開発者が守らなければいけない標準という性質ではない
    - PHP-FIG参加メンバーも勧告に従うかどうかは任意
    - PSR-2/PSR-12(スタイルガイド)は規約ではなく、
  - kind: para
    text: プロジェクトごとにスタイルを策定するためのガイドラインです
  - kind: list
    items:
    - カスタマイズする場合でも、PHP-CS-FixerやPHP_CodeSnifferのよう
  - kind: para
    text: なツールでPSR-12からの差分で定義できるというのがメリット
  p34:
  - kind: para
    text: PSR vs HTTP
  - kind: list
    items:
    - PSRではHTTPに関連するオブジェクトのインターフェイスを定義している
    - PSR-7 HTTPメッセージ
    - リクエスト、レスポンス、URI、ストリームなどのインターフェイスを定義
    - PSR-17でこれらメッセージオブジェクトのファクトリが定義されている
    - PSR-15 HTTPハンドラ(ミドルウェア)
    - リクエストハンドラとミドルウェアのインターフェイスを定義
  p35:
  - kind: heading
    level: 1
    text: PSRのコンセプトについて最重要資料
  p36:
  - kind: heading
    level: 1
    text: PSR-7のおさらい
  p37:
  - kind: heading
    level: 1
    text: PSR-7 HTTP Messages
  - kind: list
    items:
    - 不変(イミュータブル)が基本 (Streamを除く)
    - setXXXのようなメソッドは存在しない
    - 継承関係がある
    - Psr\Http\MessageInterface (レスポンスとリクエストの共通集合)
  - kind: para
    text: ├─ RequestInterface(HTTPリクエスト)│ └─ ServerRequestInterface (↑+追加情報)└─ ResponseInterface(HTTPレスポンス)
  p38:
  - kind: para
    text: 不変性(immutability)
  - kind: list
    items:
    - 一度作ったオブジェクト内部の状態が変わることはない
    - 状態を付加したいときは $res->setHeader()のような操作はできず、
  - kind: para
    text: $res = $res->withHeader() のように追記する
  - kind: list
    items:
    - この性質により、一度作ったインスタンスオブジェクトが別の場所で
  - kind: para
    text: 意図せず書き換えられる可能性を避けられるので非常に安全
  p39:
  - kind: heading
    level: 1
    text: PSR-7 Packages
  - kind: list
    items:
    - PSR-7を実装するパッケージは複数あり、基本的には交換可能
  - kind: para
    text: https://packagist.org/providers/psr/http-message-implementation
  - kind: list
    items:
    - 基本的にはWebフレームワークとHTTPクライアントどちらでも使える
    - guzzlehttp/psr7, nyholm/psr7,
  - kind: para
    text: laminas/laminas-diactoros, slim/psr7などがある
  - kind: list
    items:
    - Guzzleのstreamは機能豊富、Nyholmは軽量などの特徴がある
  p40:
  - kind: heading
    level: 1
    text: ServerRequestInterface
  - kind: list
    items:
    - RequestInterfaceを継承したインターフェイス
    - $_SERVER, $_GET, $_POST, $_COOKIE, $_FILES相当の
  - kind: para
    text: データを扱うメソッドが追加されている
  - kind: list
    items:
    - withCookieParams()などは$_COOKIE相当のデータを付加するが、
  - kind: para
    text: 内部で保持するHTTPヘッダを書き換えてはならない(MUST NOT)と仕様で明言されている
  - kind: list
    items:
    - withAttribute()/getAttribute()という、事実上なんでも入れていい
  - kind: para
    text: 収納スペースがある
  p41:
  - kind: heading
    level: 1
    text: ServerRequest::withAttribute()
  - kind: list
    items:
    - アトリビュート(属性)という名前が付いているが、PHP 8で追加された
  - kind: para
    text: '#[Attributes] とは何の関係もなく、単に付加的な情報を持たせる'
  - kind: list
    items:
    - 型的には文字列をキーにして、本当にあらゆるものが付与できてしまう
    - 原則何を入れてもいいのだが、ユーザーのリクエストと関連のあるものに
  - kind: para
    text: 限って含めた方がとり回しがよくなるはず
  - kind: list
    items:
    - キーにも任意の値をセットできるが、クラス名文字列を活用すると明示的
    - $req->withAttribute(Session::class, new ConcreteSession())
    - 個人的には単なるスカラー値よりオブジェクトで統一するのが安全と思う
  p42:
  - kind: heading
    level: 1
    text: ResponseInterface
  - kind: list
    items:
    - RequestInterfaceとは異なり、Server…版は存在しない
    - レスポンスボディは文字列ではなく、StreamInterfaceを実装した
  - kind: para
    text: オブジェクトで表現する
  - kind: list
    items:
    - ボディをセットするには $response->withBody()を使う方法と
  - kind: para
    text: $response->getBody()->write()する方法がある
  - kind: list
    items:
    - 後者は追記になってしまうので、前者の方が確実
  p43:
  - kind: para
    text: PSR-17 HTTP Factories
  - kind: list
    items:
    - PSR-7オブジェクトを生成する役割のインターフェイス
    - $res = new GuzzleHttp\Psr7\Response()と書く代りに
  - kind: para
    text: $res = $response_factory->createResponse()でオブジェクトを生成できる
  - kind: list
    items:
    - これがなぜ重要なのかは田中ひさてるさんの発表を見てください
    - 個別の実装が具体的なライブラリに依存しなくなるようにできます
  p44:
  - kind: para
    text: 不変性(immutability)
  - kind: list
    items:
    - 一度作ったオブジェクト内部の状態が変わることはない
    - 状態を付加したいときは $res->setHeader()のような操作はできず、
  - kind: para
    text: $res = $res->withHeader() のように追記する
  - kind: list
    items:
    - この性質により、一度作ったインスタンスオブジェクトが別の場所で
  - kind: para
    text: 意図せず書き換えられる可能性を避けられるので非常に安全
  p45:
  - kind: para
    text: Nyholm Psr17Factory
  - kind: list
    items:
    - PSR-7オブジェクトを生成する役割のインターフェイス
    - PSR-17の全部のinterfaceをオールインワンにまとめている
    - なんちゃらインターフェイスを要求する引数にこのオブジェクト渡せばいい
  p46:
  - kind: heading
    level: 1
    text: Nyholm/psr7のREADMEより
  p47:
  - kind: para
    text: PSR-7とフレームワークの関係
  - kind: list
    items:
    - PHP-FIGメンバーだからと言って全て従うわけではない
    - SlimやLaminas mezzioはPSR-7を採用している
    - CakePHP 4.xのHTTPメッセージ(cakephp/http)は
  - kind: para
    text: PSR-7とCakePHP 3互換のインターフェイス両方を持っている
  - kind: list
    items:
    - symfony/http-foundationはPSR-7ではないが、symfony/psr-
  - kind: para
    text: http-message-bridgeというアダプターを噛ますとLaravelでも使える
  p48:
  - kind: heading
    level: 1
    text: PHPの実行環境
  p49:
  - kind: heading
    level: 1
    text: 従来型のPHP実行環境
  - kind: list
    items:
    - HTTPリクエストを受け付けるたびに全てがリセットされる ⇒ 超短命
    - クラス定義・関数定義・変数・定数… あらゆるものがまっさらになる
    - Apache(mod_php), PHP-FPM, ビルトインサーバ(php -S), CGIなど、
  - kind: para
    text: 既存のPHPが動いてきた環境のほとんどがこの動作をする
  - kind: list
    items:
    - どんな環境でもCGIと互換性のあるスクリプトが動いてきたのが
  - kind: para
    text: PHPが長年しぶとく生きのびた秘訣。
  - kind: list
    items:
    - Perl、RubyやPythonはCGIとの断絶を経験している
  p50:
  - kind: heading
    level: 1
    text: フレームワークを使わないPHP
  - kind: list
    items:
    - ユーザーからのHTTPリクエスト情報はスーパーグローバル変数に格納
    - 宣言なしでどこからでもアクセスできる特殊なグローバル変数
    - $_SERVER $_GET $_POST $_COOKIE $_FILES $_SESSION
    - リクエストボディはfile_get_contents('php://input')で取得可能
    - header()関数などでセットしたものがHTTPレスポンスヘッダとして、
  - kind: para
    text: echoしたものがHTTPレスポンスボディとして出力される
  p51:
  - kind: heading
    level: 1
    text: フレームワークを使わないPHP
  - kind: para
    text: '<?php$name = $_GET[''name''];$title = "Hello, {$name}!";header(''Content-Type:
      application/html; charset=UTF-8'');?><title><?= htmlspecialchars($title) ?></title><h1><?=
      htmlspecialchars($title) ?></h1>'
  - kind: para
    text: <p>現在は
  - kind: para
    text: <time><?= htmlspecialchars(date('Y年m月d日 H時i分s秒')) ?></time>
  - kind: para
    text: です</p>
  p52:
  - kind: heading
    level: 1
    text: Good old PHP
  - kind: para
    text: /var/www/example.com/public/index.php
  - kind: para
    text: なんかいろんな関数を呼んだりファイルをincludeしたりする
  - kind: para
    text: $_SERVER
  p53:
  - kind: heading
    level: 1
    text: Good old PHP
  - kind: para
    text: /var/www/example.com/public/index.php
  - kind: heading
    level: 2
    text: $_SERVER
  p54:
