  p104:
  - kind: heading
    level: 1
    text: PSR-15
  p105:
  - kind: para
    text: PSR-15 HTTP Handlers
  - kind: list
    items:
    - Psr\Http\Server\名前空間に2種類のインターフェイスが定義されている
    - RequestHandlerInterface
    - レスポンスを生成する (例外送出するかもしれない)
    - MiddlewareInterface
    - リクエストハンドラを呼び出すか、呼び出さずにレスポンスを生成してもよい
  p106:
  - kind: heading
    level: 1
    text: 「ミドルウェア」という語について
  - kind: list
    items:
    - コンピュータ用語の中でも意味が一貫していないことで有名
    - なんかの中間で何かを処理するという非常に漠然としたニュアンス
    - OSでもハードウェアでもない、ソフトウェアとやりとりする何者かが
  - kind: para
    text: ミドルウェアと呼ばれることがある(Webサーバとかファイルシステムとか)
  - kind: list
    items:
    - Webフレームワークでは最終的に呼び出されるやつ(RequestHandler)
  - kind: para
    text: の間に入って何か処理するものをミドルウェアと呼ぶ
  p107:
  - kind: para
    text: ほかの世界のミドルウェア
  - kind: list
    items:
    - 結構いろんな言語のHTTP仕様に入っている
    - Ruby(Rails含む)ではRack、PythonではWSGIなど
    - PHPでもStackPHPという仕様が提案されていたこともあった
    - CakePHP 3では独自インターフェイスのミドルウェアがあったが、
  - kind: para
    text: CakePHP 4でPSR-15互換に移行された
  p108:
  - kind: heading
    level: 1
    text: RequestHandlerInterface
  - kind: para
    text: <?php
  - kind: para
    text: namespace Psr\Http\Server;
  - kind: para
    text: use Psr\Http\Message\ResponseInterface;use Psr\Http\Message\ServerRequestInterface;
  - kind: para
    text: 'interface RequestHandlerInterface{public function handle(ServerRequestInterface
      $request): ResponseInterface;}'
  p109:
  - kind: heading
    level: 1
    text: MiddlewareInterface
  - kind: para
    text: <?php
  - kind: para
    text: namespace Psr\Http\Server;
  - kind: para
    text: use Psr\Http\Message\ResponseInterface;use Psr\Http\Message\ServerRequestInterface;
  - kind: para
    text: 'interface MiddlewareInterface{public function process(ServerRequestInterface
      $request,RequestHandlerInterface $handler): ResponseInterface;}'
  p110:
  - kind: heading
    level: 1
    text: PSR Middlewares
  - kind: list
    items:
    - GitHubのmiddlewares Organizationに実装済みのミドルウェアがある
    - https://github.com/middlewares/psr15-middlewares
    - https://github.com/middlewares/awesome-psr15-middlewares
    - 私は音楽性の合わない部分があるので使ってませんが便利だと思います
    - PSR-17に対応してないからです
  p111:
  - kind: heading
    level: 1
    text: 簡単なRequestHandlerを作ってみる
  - kind: list
    items:
    - 以後、スライド上に出すコードは簡潔にするために適宜省略しています
    - namespaceやuseは省略しています
    - RequestFactoryInterfaceなどの末尾もasで省略します
    - 完全なソースコードはGitHub上で確認してください
    - https://github.com/zonuexe/phperkaigi-psr15
  p112:
  - kind: heading
    level: 1
    text: HelloWorldっぽいレスポンスを返す
  - kind: para
    text: class HelloJsonHandler implements RequestHandlerInterface {public function
      __construct(private StreamFactory $stream_factory,private ResponseFactory $response_factory){}
  - kind: para
    text: 'public function handle(ServerRequest $request): Response {$body = $this->stream_factory->createStream(json_encode([''Hello''
      => ''World'']);return $this->response_factory->createResponse(200)->withHeader(''Content-Type'',
      [''application/json''])->withBody($body);}}'
  p113:
  - kind: heading
    level: 1
    text: GETのときにHelloWorldを返す
  - kind: para
    text: // 前略
  - kind: para
    text: 'public function handle(ServerRequestInterface $request): ResponseInterface
      {if ($request->getMethod() !== ''GET'') {return $this->response_factory->createResponse(404);}'
  - kind: para
    text: // 後はさっきと同じ
  - kind: para
    text: $body = $this->stream_factory->createStream(json_encode(['Hello' => 'World']);return
      $this->response_factory->createResponse(200)->withHeader('Content-Type', ['application/json'])->withBody($body);}
