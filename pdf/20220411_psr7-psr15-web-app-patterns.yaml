  p177:
  - kind: heading
    level: 1
    text: 複数のミドルウェアを扱う
  - kind: list
    items:
    - MiddlewareはServerRequestとRequestHandlerを受け取り、
  - kind: para
    text: $request_handler->handle($request)のように呼び出す
  - kind: list
    items:
    - このままではミドルウェア1個ハンドラ1個しか受け付けない…?
    - 「次のMiddleware」をラップしたRequestHandlerを用意する
    - PSR-15のメタドキュメントでは「キュー」と「デコレータ」の2種類が紹介
    - 特に理由がなければRelayというやつを選ぶといい感じ
    - 自作しても全然よい
  p178:
  - kind: heading
    level: 1
    text: セッションってどうするの？
  - kind: list
    items:
    - SessionMiddleware的なものを作る
    - RequestのCookieなどのセッションIDからDBなどを引く
    - session_start()や$_SESSIONのようなグローバルを参照する部分は
  - kind: para
    text: さらに別のクラスに分けるとテストしやすくできる
  - kind: list
    items:
    - $request->withAttribute()で付加することで後続のMiddlewareや
  - kind: para
    text: RequestHandlerで $request->getAttribute()で取り出せる
  p179:
  - kind: heading
    level: 1
    text: セッションを参照する
  - kind: para
    text: // 前略
  - kind: para
    text: 'public function handle(ServerRequestInterface $request): ResponseInterface
      {$session = $request->getAttribute(Session::class);assert($session instanceof
      Session);'
  - kind: para
    text: // $session を使った処理を書く
  - kind: para
    text: if ($session instanceof LoggedIn) {// ...}}
