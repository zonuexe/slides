    text: Middlewareテストの要点
  - kind: list
    items:
    - 基本はRequestHandlerと同様にシンプルかつ明瞭にする
    - どのようなハンドラを渡せばMiddlewareが正常に動作しているか
  - kind: para
    text: 判断できるかを見極める
  - kind: list
    items:
    - テスト用ハンドラはこだわらなくてもパターン化しやすい
    - リクエストに影響を及ぼすハンドラならリクエストの内容もチェックする
    - 実アプリケーションで呼ばれる他のハンドラに依存すると
  - kind: para
    text: 何をテストしたいのかぶれるので基本的には避ける
  p163:
  - kind: heading
    level: 1
    text: その他のハンドラ (関数のラッパー)
  - kind: para
    text: class CallbackHandler implements RequestHandlerInterface {/*** @psalm-var
      list<ServerRequest>* @psalm-readonly-allow-private-mutation*/public $received_server_requests
      = [];public function __construct(private Closure $callback) {}
  - kind: para
    text: 'public function handle(ServerRequest $request): Response {$this->received_server_requests[]
      = $request;return ($this->callback)($request);}'
  p164:
  - kind: heading
    level: 1
    text: その他のハンドラ (例外を投げる君)
  - kind: para
    text: class ThrowingHandler implements RequestHandlerInterface {/*** @psalm-var
      list<ServerRequest>* @psalm-readonly-allow-private-mutation*/Public $received_server_requests
      = [];public function __construct(private Throwable $e) {}
  - kind: para
    text: 'public function handle(ServerRequest $request): Response {$this->received_server_requests[]
      = $request;throw $this->e;}'
