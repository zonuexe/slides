  p141:
  - kind: heading
    level: 1
    text: HTTPSにリダイレクト
  - kind: para
    text: 'class HttpsRedirectMiddleware implements MiddlewareInterface{public function
      process(ServerRequest $request, RequestHandler $handler): Response{$uri = $request->getUri();if
      (strtolower($uri->getScheme()) !== ''https'') {return $this->response_factory->createResponse(302)->withHeader(''Location'',
      [(string)$uri->withScheme(''https'')]);}return $handler->handle($request);}}'
  p142:
