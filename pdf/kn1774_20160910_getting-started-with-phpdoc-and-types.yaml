text:
  p1:
  - kind: heading
    level: 1
    text: はじめてのPHPDocと型
  - kind: para
    text: My first PHPDoc and Type
  - kind: para
    text: 2016-09-09 ピクシブ社内勉強会
  p2:
  - kind: para
    text: 型とは何か
  p3:
  - kind: heading
    level: 1
    text: 型… 型…
  - kind: list
    items:
    - 一言で誤解を恐れずに表現すると
  - kind: para
    text: プログラミング言語が
  - kind: para
    text: 1 + [] (数字と配列のたしざん)みたいなのを叱れるようにする基盤
  - kind: list
    items:
    - コンパイルするときに型を付けるか
  - kind: para
    text: 動かすとき(runtime)に調べるかが、静的型付きと動的型検査の大きな差
  p4:
  - kind: heading
    level: 1
    text: 動的型検査
  - kind: list
    items:
    - プログラムを動かしながら
  - kind: para
    text: 手さぐりで型を調べる
  - kind: list
    items:
    - 「$aの型はintだな、$bの型はstring…
  - kind: para
    text: だけど数字だから足しざんできるね！」みたいな茶番を毎回やってる
  p5:
  - kind: para
    text: 静的検査
  p6:
  - kind: heading
    level: 1
    text: 動かす前に把握する
  - kind: list
    items:
    - 実際に動かさなくても人間は整合性
  - kind: para
    text: をとりながらPHPを書ける
  - kind: list
    items:
    - 人間がわかるってことは、機械にも
  - kind: para
    text: やってれないことはない
  p7:
  - kind: heading
    level: 1
    text: 型を推測してみよう（型推論）
  - kind: para
    text: // 絶対int返すマンfunction x() { return 1; }// 絶対array返すマンfunction y() { return
      []; }// たしざん// $n1, $n2 は数字っぽい値が欲しいfunction add($n1, $n2) { return $n1 + $2;
      }$a = x(); // x()がintを返すからたぶんintのはず$b = y(); // y()がarrayを返すからたぶんarrayのはず$c
      = add($a, $b);// 数字っぽい値以外を渡すとエラーが発生することは// 理窟の上では動かさなくても明らか
  p8:
  - kind: heading
    level: 1
    text: 型がない関数の問題
  - kind: list
    items:
    - 引数に何渡せばいいの… 何返ってくるの
    - 時間は有限なので、既存コードを読む
  - kind: para
    text: 時間は最小限にできるとウレシイ
  - kind: list
    items:
    - ほんとに「見ればわかる」シンプルさなら
  - kind: para
    text: いいけど、現実は甘くない
  - kind: list
    items:
    - 型が特定できないことも多い
  p9:
  - kind: heading
    level: 1
    text: 適当なコメント（Before）
  - kind: para
    text: // 絶対int返すマンfunction x() { return 1; }// 絶対array返すマンfunction y() { return
      []; }// たしざん// $n1, $n2 は数字っぽい値が欲しいfunction add($n1, $n2) { return $n1 + $2;
      }$a = x(); // x()がintを返すからたぶんintのはず$b = y(); // y()がarrayを返すからたぶんarrayのはず$c
      = add($a, $b);// 数字っぽい値以外を渡すとエラーが発生することは// 理窟の上では動かさなくても明らか
  p10:
  - kind: heading
    level: 1
    text: PHPDocで型を付ける（After）
  - kind: para
    text: /** @return int */function x() { return 1; }/** @return array */function
      y() { return []; }/*** @param int $n1* @param int $n2*/function add($n1, $n2)
      { return $n1 + $2; }
  p11:
  - kind: para
    text: PHPDoc
  p12:
  - kind: heading
    level: 1
    text: DocComment
  - kind: list
    items:
    - PHPのリフレクションで実行時に
  - kind: para
    text: 取得できる特別な形式のコメント
  - kind: list
    items:
    - メソッドとかクラスの定義に
  - kind: para
    text: /** 〜 */ って書くと文字列になる
  - kind: list
    items:
    - 開始記号は必ず /** にすること
  - kind: para
    text: (/* では無効なので注意！！！！)
  p13:
  - kind: heading
    level: 1
    text: DocCommentを取得する
  - kind: para
    text: <?php/** こんにちは〜〜〜〜 */function hello() { throw new \Exception(); }$ref =
      new \ReflectionFunction('hello');echo $ref->getDocComment(), PHP_EOL;exit;
  p14:
  - kind: heading
    level: 1
    text: APIドキュメントを生成する
  - kind: list
    items:
    - ソースコード中のコメントを基に、
  - kind: para
    text: HTMLドキュメントを生成できる
  - kind: list
    items:
    - JavaDocにインスパイヤされた
  - kind: para
    text: PHPDocって形式がある
  - kind: list
    items:
    - phpDocumentorプロジェクトが
  - kind: para
    text: デファクト https://phpdoc.org/docs/latest/index.html
  p15:
  - kind: heading
    level: 1
    text: PHPDocの型
  - kind: list
    items:
    - 基本はPHPの型かクラス名を書く
    - 複合型
    - 「intまたは文字列」 int|string
    - 値が並んだ配列
    - 「intが並んだ配列」 int[]
    - https://zonuexe.github.io/phpDocumentor2-ja/references/phpdoc/
  - kind: para
    text: types.html
  p16:
  - kind: heading
    level: 1
    text: これだけ覚えて帰ってね
  - kind: para
    text: タグ名
  - kind: para
    text: 意味
  - kind: para
    text: 例
  - kind: para
    text: '@param引数を定義@param int $n1'
  - kind: para
    text: '@return返り値を定義@return int[]'
  - kind: para
    text: '@var変数/プロパティを定義@var int'
  - kind: para
    text: '@propertyマジックプロパティを定義@property int $id'
  p17:
  - kind: heading
    level: 1
    text: '型: arrayについて'
  - kind: list
    items:
    - array と mixed[] は意味が同じなのでは
    - PHPのarrayは
  - kind: para
    text: リストでもあり連想配列でもある
  - kind: list
    items:
    - 標準化された用例ではないが、
  - kind: para
    text: tadsanは連想配列をarrayと書く
  - kind: list
    items:
    - 0はじまりの連番の配列は
  - kind: para
    text: mixed[] とか User[] みたいに書く
  p18:
  - kind: heading
    level: 1
    text: 標準化について
  - kind: list
    items:
    - 前述の通り、デファクトは
  - kind: para
    text: phpDocumentor2の仕様 (phpdoc.org)
  - kind: list
    items:
    - 日本語 https://zonuexe.github.io/phpDocumentor2-ja/
    - 使ってるツールはいろいろある
    - PhpStorm, Phan, ApiGen, phpDox…
    - PSR-5で提案されてるけど… どうなる?
  p19:
  - kind: para
    text: PHPの型宣言
  p20:
  - kind: heading
    level: 1
    text: タイプヒント改め「型宣言」
  - kind: list
    items:
    - PHP5では「タイプヒント」と呼ばれ、
  - kind: para
    text: 引数に特定のキーワードかクラス名を書くことができた
  - kind: list
    items:
    - function getWorksByUser(UserModel $user)
  - kind: para
    text: みたいな
  - kind: list
    items:
    - array, callable, resource
    - PHP7では「型宣言」になって返り値の型が
  - kind: para
    text: 書ける
  p21:
  - kind: heading
    level: 1
    text: 型宣言の難しさ
  - kind: list
    items:
    - PHP5はstringとかintとか書けなかった
    - そんなの簡単だろさっさと実装しろや…
  - kind: para
    text: みたいな単純な問題ではない
  - kind: list
    items:
    - function hoge(int $n) を hoge("12")
  - kind: para
    text: で呼び出したときにどうするの…?
  - kind: list
    items:
    - パンドラの箱を開けてしまった感
    - declare(strict_types=1) って書く
  p22:
  - kind: heading
    level: 1
    text: キャストの難しさ
  - kind: para
    text: '<?php declare(strict_types=0);function myint(int $v) { return $v;}myint(1.1);
      // => 1 myint(true); // => 1 myint("1"); // => 1 myint(floatval(PHP_INT_MAX
      - 512)); // int(9223372036854774784)myint(12345678901234567890.0);// PHP Fatal
      error: Uncaught TypeError: Argument 1// passed to myint() must be of the type
      integer, float given myint("12345678901234567890");// PHP Fatal error: Uncaught
      TypeError: Argument 1// passed to myint() must be of the type integer, string
      given'
  p23:
  - kind: para
    text: Phan
  p24:
  - kind: heading
    level: 1
    text: etsy/phan (次回豫告)
  - kind: list
    items:
    - 静的解析ツール
    - PHPDocの定義を手がかりに、
  - kind: para
    text: 型が違ってるところを指摘してくれる
  - kind: list
    items:
    - 11/3にPHPカンファレンスで
  - kind: para
    text: 詳しくしゃべってきます (30分枠)
