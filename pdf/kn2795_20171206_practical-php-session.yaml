text:
  p1:
  - kind: heading
    level: 1
    text: PHPセッション入門
  - kind: para
    text: Introduction to PHP Session
  - kind: para
    text: 2017-12-01 ピクシブ社内勉強会
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた、@tadsan、Zonu.EXE
    - Emacs PHP Modeメンテナ
    - 省略
  p3:
  - kind: para
    text: 注意
  p4:
  - kind: para
    text: この発表は新規のWebサイトWebアプリケーションフレームワークに依存しないPHP開発を推奨する目的ではない
  p5:
  - kind: para
    text: ※今回ログインの話はしません
  p6:
  - kind: para
    text: セッション
  - kind: para
    text: とは何か
  p7:
  - kind: para
    text: この用語(セッション)が意味するところはいろいろあるけど
  p8:
  - kind: para
    text: ここではWebで、ユーザーと継続的に通信する機構
  p9:
  - kind: para
    text: 継続的？
  p10:
  - kind: heading
    level: 1
    text: はじめて訪問したとき
  - kind: para
    text: こんにちは「ゲスト」さん！
  - kind: para
    text: あなたは誰ですか？
  - kind: para
    text: Webサイト
  p11:
  - kind: heading
    level: 1
    text: ここに名前をいれてね
  - kind: heading
    level: 2
    text: 私は「tadsan」だよ
  - kind: para
    text: Webサイト
  p12:
  - kind: heading
    level: 1
    text: 次に訪問したとき
  - kind: para
    text: こんにちは「tadsan」さん！
  - kind: para
    text: また来ましたね！
  - kind: para
    text: Webサイト
  p13:
  - kind: para
    text: Webブラウザでセッションを実現するには、一般的にはCookie(クッキー)が利用される
  p14:
  - kind: para
    text: あとで話すよ
  p15:
  - kind: para
    text: 注意
  p16:
  - kind: para
    text: セッションの実装はWebサイトのプライバシーポリシーと密接に関連する
  p17:
  - kind: para
    text: pixivのプライバシーポリシー
  p18:
  - kind: para
    text: TIPS
  - kind: para
    text: Cookieを使ったセッションを利用するときはプライバシーポリシーを明記しよう
  p19:
  - kind: para
    text: PHPでセッション
  p20:
  - kind: para
    text: 超かんたん
  p21:
  - kind: heading
    level: 1
    text: name.php
  - kind: para
    text: <?php
  - kind: para
    text: session_start();
  - kind: para
    text: '// これで別ページでも session_start() すれば// $_SESSION[''name''] として参照できるようになる$_SESSION[''name'']
      = ''太郎'';header(''Location: /betsu.php'');'
  p22:
  - kind: heading
    level: 1
    text: betsu.php
  - kind: para
    text: <?php session_start() ?>
  - kind: para
    text: <p>こんにちは<?= htmlspecialchars($_SESSION['name']) ?>さん</p>
  p23:
  - kind: heading
    level: 1
    text: TIPS
  - kind: para
    text: PHPのフレームワークはセッション機構がいい感じに統合されてることがある。ただし、マイクロフレームワークではオミットされてることが多くPHPデフォルトのセッションを気にする必要がある。
  p24:
  - kind: para
    text: TIPS
  - kind: para
    text: session_start()および後述するセッション設定は個別のページで呼ぶのではなく、共通初期化スクリプトに記述すること
  p25:
  - kind: para
    text: まあとりあえずsession_start()で簡単にできる
  p26:
  - kind: para
    text: ね、かんたん
  - kind: para
    text: でしょ？
  p27:
  - kind: para
    text: 完
  p28:
  - kind: para
    text: 🙃
  p29:
  - kind: para
    text: だと思ったか
  p30:
  - kind: para
    text: どうしてセッションは
  - kind: para
    text: 動くのか
  p31:
  - kind: heading
    level: 1
    text: よし、Webサイトを見よう
  - kind: para
    text: 'GET /index HTTP/1.1 Host: example.com'
  - kind: para
    text: Webサイト
  p32:
  - kind: heading
    level: 1
    text: はじめて訪問したとき
  - kind: para
    text: こいつはCookie持ってないな…
  - kind: para
    text: ちっ、新参か。
  - kind: para
    text: セッションIDを発行するか
  - kind: heading
    level: 2
    text: GET /index HTTP/1.1
  - kind: heading
    level: 2
    text: 'Host: example.com'
  - kind: para
    text: 「こんにちはゲストさーん」
  - kind: para
    text: Webサイト
  p33:
  - kind: heading
    level: 1
    text: はじめて訪問したとき
  - kind: para
    text: こいつはCookie持ってないな…
  - kind: para
    text: ちっ、新参か。
  - kind: para
    text: セッションIDを発行するか
  - kind: para
    text: 「こんにちはゲストさーん」
  - kind: heading
    level: 2
    text: 200 OK
  - kind: heading
    level: 2
    text: 'Set-Cookie:'
  - kind: heading
    level: 3
    text: PHPSESSID=xxxxx;expires=...
  - kind: heading
    level: 3
    text: <!DOCTYPE html><html>...
  - kind: para
    text: Webサイト
  p34:
  - kind: heading
    level: 2
    text: はじめて訪問したとき
  - kind: para
    text: こいつはCookie持ってないな…
  - kind: para
    text: ちっ、新参か。
  - kind: para
    text: セッションIDを発行するか
  - kind: para
    text: 「こんにちはゲストさーん」
  - kind: heading
    level: 3
    text: 200 OK
  - kind: heading
    level: 3
    text: 'Set-Cookie:'
  - kind: heading
    level: 3
    text: PHPSESSID=xxxxx;expires=...
  - kind: heading
    level: 3
    text: <!DOCTYPE html><html>...
  - kind: heading
    level: 1
    text: Set-Cookie!
  - kind: para
    text: Webサイト
  p35:
  - kind: para
    text: RFC 6265 HTTP State Management Mechanism
  p36:
  - kind: para
    text: HTTP上でWebサイトとUA(ブラウザ)が状態を共有するためのしくみ
  p37:
  - kind: para
    text: 状態？
  p38:
  - kind: para
    text: 話は長くなる
  p39:
  - kind: para
    text: Cookieに対応したユーザーエージェント(Webブラウザ)がSet-Cookieを受け取ると、次からそのサイトにリクエストするときにCookieヘッダを付加する
  p40:
  - kind: heading
    level: 1
    text: 次回に訪問するとき
  - kind: para
    text: 'GET /index HTTP/1.1 Host: example.com Cookie:'
  - kind: para
    text: PHPSESSID=xxxxx
  - kind: para
    text: Webサイト
  p41:
  - kind: heading
    level: 1
    text: 次回に訪問するとき
  - kind: para
    text: おっこいつは前も来たxxxxだな
  - kind: para
    text: 「こんちわー またきたね」
  - kind: para
    text: 'GET /index HTTP/1.1 Host: example.com Cookie:'
  - kind: para
    text: PHPSESSID=xxxxx
  - kind: para
    text: Webサイト
  p42:
  - kind: heading
    level: 1
    text: 次回に訪問するとき
  - kind: para
    text: おっこいつは前も来たxxxxだな
  - kind: para
    text: 「こんちわー またきたね」
  - kind: heading
    level: 2
    text: 200 OK
  - kind: para
    text: <!DOCTYPE html><html>...
  - kind: para
    text: Webサイト
  p43:
  - kind: para
    text: どうしてセッションは
  - kind: para
    text: 動くのか
  p44:
  - kind: para
    text: Ｑ.どうしてセッションは特に設定しなくても動くのはなぜ？
  p45:
  - kind: para
    text: Ａ.PHPはきみのことをファイルに保存して覚えてるからだよ
  p46:
  - kind: para
    text: ファイルっすか
  p47:
  - kind: para
    text: 😅
  p48:
  - kind: para
    text: ファイルです
  p49:
  - kind: para
    text: 😇
  p50:
  - kind: para
    text: session_save_path()保存するディレクトリを設定できる
  p51:
  - kind: para
    text: http://php.net/manual/ja/function.session-save-path.php
  p52:
  - kind: para
    text: 🙃
  p53:
  - kind: para
    text: Ｑ.ファイルの問題点とは何か？
  p54:
  - kind: para
    text: 🤔
  p55:
  - kind: para
    text: Ａ.サーバーまたいでセッションを共有できない！
  p56:
  - kind: para
    text: 🙃
  p57:
  - kind: para
    text: Ｑ.具体的に何が起こる？
  p58:
  - kind: para
    text: Ａ.サーバーを増やして分散させた瞬間に、セッションが消えたりする
  p59:
  - kind: para
    text: ／(^o^)＼
  p60:
  - kind: para
    text: 実用PHPセッション
  p61:
  - kind: para
    text: 本題はここから
  p62:
  - kind: para
    text: SessionHandlerInterface
  p63:
  - kind: para
    text: http://php.net/manual/ja/class.sessionhandlerinterface.php
  p64:
  - kind: para
    text: これを実装して
  p65:
  - kind: heading
    level: 1
    text: MySessHandler.php
  - kind: para
    text: <?php
  - kind: para
    text: class MySessHandler implements SessionHandlerInterface{// 実装…}
  p66:
  - kind: heading
    level: 1
    text: bootstrap.php
  - kind: para
    text: <?php
  - kind: para
    text: $handler = new MySessHandler();session_set_save_handler($handler, true);
  - kind: para
    text: session_start();
  p67:
  - kind: para
    text: 登録できる
  p68:
  - kind: para
    text: 実装って何をすればいいの？
  p69:
  - kind: para
    text: Redis/Memcached/
  - kind: para
    text: SQLなどに保存する
  p70:
  - kind: para
    text: 極端な話、データベースじゃなくてもいい
  p71:
  - kind: heading
    level: 1
    text: 例)Cookie
  - kind: para
    text: (セキュリティの面で面倒なのでおすすめはしない)
  p72:
  - kind: para
    text: 設定
  p73:
  - kind: para
    text: デフォルト設定の問題
  p74:
  - kind: para
    text: デフォルトでは、CookieにSecure,httpOnly属性がついてない
  p75:
  - kind: para
    text: 現代においては
  - kind: para
    text: ありえない
  p76:
  - kind: para
    text: http://php.net/manual/ja/function.session-set-cookie-params.php
  p77:
  - kind: para
    text: 絶対設定しよう
  p78:
  - kind: para
    text: PHPSESSIDださい
  p79:
  - kind: heading
    level: 1
    text: bootstrap.php
  - kind: para
    text: <?php
  - kind: para
    text: session_name('hoge_session_id');
  - kind: para
    text: $handler = new MySessHandler();session_set_save_handler($handler, true);
  - kind: para
    text: session_start();
  p80:
  - kind: para
    text: php.ini VS PHP関数
  p81:
  - kind: para
    text: セッション系の設定設定ファイル(*.ini)とPHP両方で設定できる
  p82:
  - kind: para
    text: 環境によってphp.iniは手を入れにくいので、実行時にPHPスクリプトで設定関数を呼ぶようにする方がおすすめ
  p83:
  - kind: para
    text: 関数で書いてやれば(同じコードである限り)事故が起きにくい
  p84:
  - kind: para
    text: 今回しなかった話
  p85:
  - kind: para
    text: ログインの実装方法
  p86:
  - kind: para
    text: ログイン処理を実装するためにはセキュリティ的に考慮すべき事柄がいろいろあるよ
  p87:
  - kind: para
    text: この発表の反響があったら続きを書くよ！
