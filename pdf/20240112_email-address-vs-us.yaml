text:
  p1:
  - kind: heading
    level: 1
    text: メールアドレス vs 俺たち
  - kind: heading
    level: 2
    text: Our stand against the challenges posed by E-mail addresses
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2024-01-12 Sapporo Community Plaza
  - kind: para
    text: PHPカンファレンス北海道2024 前夜祭
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職でPHPを書いているWebプログラマ
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
    - 2011年頃にPython札幌というコミュニティをやっていました
  p3:
  - kind: heading
    level: 1
    text: 今回のお題
  p4:
  - kind: para
    text: '出典: Wikipedia： ID (2023-07-09T09:38:16版)'
  p5:
  - kind: para
    text: '出典: Wikipedia： デジタルアイデンティティ ( 2023-10-20T14:01:45版)'
  p6:
  - kind: para
    text: 今回はIDとは何か
  - kind: para
    text: (本質)
  - kind: para
    text: の話には深入りしません
  p7:
  - kind: heading
    level: 1
    text: おことわり
  - kind: para
    text: 発表者は現時点において現職のID設計判断や実装に
  - kind: para
    text: 関わっていません！
  p8:
  - kind: para
    text: ID、Auth、アカウント基盤など
  - kind: para
    text: AAA(Authentication,Authorization, Accounting)
  - kind: para
    text: は高度な専門技術領域
  p9:
  - kind: heading
    level: 1
    text: 発表のねらい
  p10:
  - kind: heading
    level: 1
    text: 今回のゴール
  - kind: list
    items:
    - ただメールアドレスを扱うだけのよくある仕組みだとしても、
  - kind: para
    text: 考慮事項がいくつもあってシンプルな実装では済まない(こともある)こと
  - kind: list
    items:
    - これらの考慮事項には唯一の正解はなく、ビジネス要件や
  - kind: para
    text: ユーザーのニーズに応じて取捨選択する必要があるということを理解し、必要十分なものを設計・実装できること
  p11:
  - kind: para
    text: ゴールではないこと
  - kind: list
    items:
    - メールアドレスに関係しないアカウント設計の考慮事項
    - こう実装すれば間違いないという指針を提示すること
    - デジタルアイデンティティを完全理解してIDエキスパートになること
    - オブジェクト指向設計についてマスターすること
    - 今回提示することをそのまま実装するとユニットテストしにくい構造になる
  - kind: para
    text: 場合があるので、適切に依存を分割・注入することは読者への課題とする
  p12:
  - kind: para
    text: 今回は専門職ではない我々が実装するための
  - kind: para
    text: お話をします
  p13:
  - kind: para
    text: 初心者の方も
  - kind: para
    text: 怖がらずにお聞きください
  p14:
  - kind: heading
    level: 1
    text: さて
  p15:
  - kind: para
    text: 難しいことは置いておいてユーザーからメールアドレスを
  - kind: para
    text: 収集したい(せざるを得ない)
  - kind: para
    text: ことは現代でも多い
  p16:
  - kind: heading
    level: 1
    text: メールアドレスを何に使うか
  - kind: list
    items:
    - マーケティング (メールによる告知など)
    - Webサービスのログイン機能のIDとして
    - Laravelのようなフレームワークは基本機能として持っていて、
  - kind: para
    text: スキャッフォールド(コードの自動生成)で最低限のものは簡単に作れる(生成されるので実装の必要すらない)
  - kind: list
    items:
    - ログイン通知 (心あたりのないログインでないかユーザ自身に知らせる)
  p17:
  - kind: heading
    level: 1
    text: メールアドレスを何に使うか
  - kind: list
    items:
    - アカウント登録させてマーケティングに活用…
    - 利用規約に同意させた上なら問題はないが、やりすぎは嫌われるので要注意
    - メールマガジンなど送りすぎてフィルタリングされてしまっては、本当に大事
  - kind: para
    text: な連絡が届かなくなるのはよくない
  - kind: list
    items:
    - 個人的な意見では、私信のような体裁や「あなただけ特別に…」のような
  - kind: para
    text: 文言のキャンペーンメールは非常にストレスが大きい
  p18:
  - kind: para
    text: 個人的感情は
  - kind: para
    text: おいといて
  p19:
  - kind: para
    text: DBに入れるだけだしフレームワークとか要らん
  p20:
  - kind: heading
    level: 1
    text: ですよね？[要出典]
  p21:
  - kind: para
    text: すごくシンプルなログインシステムを作っていきましょう
  p22:
  - kind: para
    text: '[要件1]変な形式の文字列が'
  - kind: para
    text: 登録できないこと
  p23:
  - kind: heading
    level: 1
    text: aaa@example,com
  p24:
  - kind: heading
    level: 1
    text: example.com
  p25: []
  p26:
  - kind: para
    text: ググったら最適解が出てくる良い時代…
  p27:
  - kind: heading
    level: 1
    text: 良くなかった時代とは
  p28: []
  p29: []
  p30:
  - kind: heading
    level: 1
    text: どういうこと？
  p31:
  - kind: para
    text: そもそもメールアドレスとは
  p32:
  - kind: heading
    level: 1
    text: tadsan@pixiv.com
  p33:
  - kind: heading
    level: 1
    text: '"tadsan"@pixiv.com'
  p34:
  - kind: heading
    level: 1
    text: <tadsan@pixiv.com>
  p35:
  - kind: heading
    level: 1
    text: USAMI Kenta <tadsan@pixiv.com>
  p36:
  - kind: heading
    level: 1
    text: どれも「メールアドレス」
  p37:
  - kind: para
    text: '出典: Wikipedia： メールアドレス (2023-11-07T03:00:31版)'
  p38:
  - kind: heading
    level: 1
    text: メールアドレスとは
  - kind: list
    items:
    - 特に断りがなければ tadsan@pixiv.com のような文字列を指す
    - RFC 5322ではaddr-specと呼ばれるもの
    - USAMI Kenta <tadsan@pixiv.com> のような、
  - kind: para
    text: 名前や <> を含んだものもメールアドレス
  - kind: list
    items:
    - 先述のブログで「正規表現でマッチできない」と言われているのはこれを
  - kind: para
    text: 含めたメールアドレスのこと
  p39:
  - kind: para
    text: '出典: Wikipedia： メールアドレス (2023-11-07T03:00:31版)'
  p40:
  - kind: para
    text: 一般的なメールアドレス
  - kind: para
    text: を収集する用途でaddr-spec以外が必要になることはない
  p41:
  - kind: para
    text: 基本的にaddr-spec
  - kind: para
    text: だけを相手にすれば
  - kind: para
    text: いいとわかった
  p42:
  - kind: heading
    level: 1
    text: 改めて
  p43:
  - kind: para
    text: ローカルパートドメイン名
  - kind: heading
    level: 1
    text: tadsan@pixiv.com
  p44:
  - kind: heading
    level: 1
    text: ローカルパートの制約
  - kind: list
    items:
    - dot-atom形式 (いわゆる普通のメールアドレス)
    - ASCIIの英数文字 [a-zA-Z0-9]
    - 'ASCIIの記号 ! # $ % & '' * + - / = ? ^ _ ` { | } ~'
    - . (ドット)は先頭と末尾以外に使用できるが、2個以上連続できない
    - 大文字小文字は区別する… が… 現実には区別せずに扱うサービスも
    - むしろ多数
  p45: []
  p46:
  - kind: para
    text: RFC違反メールアドレス
  - kind: list
    items:
    - 2009年頃まで一部の携帯キャリアで発行できていたメールアドレス
    - good..by..@example.com のようなアドレスが発行できた
    - 仕様違反のメールアドレスでも動作するサービスが存在していたが…
    - 2020年にiOS 14、2021年にSendGridで利用不可能に
    - quoted-string形式 "good..by.."@example.com に変換すれば合法
  - kind: para
    text: だが、残念なことに受信側のメールサービスが対応している必要がある
  p47: []
  p48: []
  p49: []
  p50:
  - kind: para
    text: PHPではこれを使えば
  - kind: para
    text: 安全！
  p51:
  - kind: para
    text: …ここまでに説明した
  - kind: para
    text: 範囲では
  p52:
  - kind: para
    text: '[要件2]存在しないドメインのメールアドレス登録を'
  - kind: para
    text: 弾きたい
  p53:
  - kind: heading
    level: 1
    text: a@b.c
  p54:
  - kind: para
    text: filter_var('a@b.c',FILTER_VALIDATE_EMAIL)
  p55:
  - kind: para
    text: filter_var('a@b.c',FILTER_VALIDATE_EMAIL)// => "a@b.c"
  p56:
  - kind: para
    text: 定石：入力されたアドレスに送信してメール内のコードを入力させる
  p57:
  - kind: para
    text: 実メール送る前にどうしても確認したい
  - kind: para
    text: のだとしましょう
  p58: []
  p59:
  - kind: heading
    level: 1
    text: DNSをチェックしよう
  p60: []
  p61:
  - kind: para
    text: この方法で良いといえば良いだめといえばだめ
  p62:
  - kind: heading
    level: 1
    text: (非常に言葉を濁す)
  p63:
  - kind: para
    text: メールはどうやって届くのか
  - kind: list
    items:
    - 白ヤギさんと黒ヤギさんが… という話から始めると15分では無理
    - メールに関係するDNSレコードにはAとMXがある
    - メール配送の仕組みとしてはAレコードがあればいいのだが、
  - kind: para
    text: 今日の多くはメールアドレスのドメイン部分に対応したMXレコードがある
  - kind: list
    items:
    - Aレコードしかないメールアドレスは個人や小規模なメールサーバの
  - kind: para
    text: 独自運用されている傾向にあるのでAレコードもサポートするかは各自判断
  p64:
  - kind: para
    text: DNSではなくSMTPでチェックする別解も
  - kind: para
    text: あるが…
  p65:
  - kind: para
    text: (僕は運用経験がない
  - kind: para
    text: ので言葉を濁す)
  p66:
  - kind: para
    text: ついでにメールアドレス
  p67:
  - kind: heading
    level: 2
    text: IPアドレス
  - kind: heading
    level: 1
    text: a@0.0.0.0
  p68:
  - kind: para
    text: filter_var('a@0.0.0.0',FILTER_VALIDATE_EMAIL)
  p69:
  - kind: para
    text: filter_var('a@0.0.0.0',FILTER_VALIDATE_EMAIL)// => "a@0.0.0.0"
  p70:
  - kind: heading
    level: 1
    text: ドメインがIP
  p71:
  - kind: para
    text: '[要件3]メールアドレスの重複登録を弾きたい！'
  p72:
  - kind: heading
    level: 1
    text: DBに登録
  p73:
  - kind: heading
    level: 1
    text: ユニークキー制約
  p74:
  - kind: heading
    level: 1
    text: 大勝利
  p75:
  - kind: heading
    level: 1
    text: かと思いましたか？
  p76:
  - kind: heading
    level: 1
    text: ローカルパートの制約
  - kind: list
    items:
    - dot-atom形式 (いわゆる普通のメールアドレス)
    - ASCIIの英数文字 [a-zA-Z0-9]
    - 'ASCIIの記号 ! # $ % & '' * + - / = ? ^ _ ` { | } ~'
    - . (ドット)は先頭と末尾以外に使用できるが、2個以上連続できない
    - 大文字小文字は区別する… が… 現実には区別せずに扱うサービスも
    - むしろ多数
  p77:
  - kind: heading
    level: 1
    text: a@example.com
  p78:
  - kind: heading
    level: 1
    text: A@example.com
  p79:
  - kind: para
    text: 同一かもしれないし
  - kind: para
    text: 別人かもしれない
  p80: []
  p81:
  - kind: para
    text: unicode_ciは大文字小文字を
  - kind: para
    text: 同一視する
  p82:
  - kind: para
    text: utf8mb4_binで厳密チェックすれば
  - kind: para
    text: いいのか？
  p83:
  - kind: para
    text: もっとひどい穴を簡単に作れるのでbinで比較はやめた
  - kind: para
    text: 方がいいと思う
  p84:
  - kind: para
    text: Laravelは全部小文字の
  - kind: para
    text: アドレスのみ許可
  - kind: para
    text: (これが無難)
  p85:
  - kind: para
    text: この問題を騙り尽すには15分枠はあまりに短い…
  p86:
  - kind: para
    text: Gmailエイリアス沼
  - kind: list
    items:
    - 同じメールアカウントに対応するアドレスはたくさんある
    - fafnir127@gmail.com, fafnir127+alias@gmail.com
    - f.a.f.n.i.r.1.2.7@gmail.com, fafnir127@googlemail.com
    - これらはGoogle Workspaceを使った独自ドメインのメールでも有効
  p87: []
  p88:
  - kind: para
    text: ご静聴ありがとう
  - kind: para
    text: ございました
