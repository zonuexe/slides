text:
  p1:
  - node: p
    children:
    - node: text
      content: 'スライドをシェアできる '
    - node: br
    - node: text
      content: サービスを作る
  - node: p
    children:
    - node: text
      content: Build your own slide deck
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2025-08-27 #phpstudy '
  - node: p
    children:
    - node: bold
      content: 第178回PHP勉強会@東京
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 Platform Div > WebTechnology Team PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
        - node: li
          children:
          - node: text
            content: 最近チームが再編されてインフラっぽい仕事もしてます
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - node: p
    children:
    - node: text
      content: '私事ですが '
    - node: br
    - node: text
      content: わりと発表しています
  p4:
  - node: p
    children:
    - node: text
      content: 'みなさんは発表した '
    - node: br
    - node: text
      content: 'スライドを '
    - node: br
    - node: text
      content: どうしていますか？
  p5:
  - node: p
    children:
    - node: text
      content: 'スライド投稿サイトに '
    - node: br
    - node: text
      content: アップロード？
  p6:
  - node: p
    children:
    - node: text
      content: '私も以前は '
    - node: br
    - node: text
      content: そうしていました…
  p7:
  - node: p
    children:
    - node: text
      content: 2010〜2016年頃
  - node: p
    children:
    - node: text
      content: ' (24スライド)'
  p8:
  - node: p
    children:
    - node: text
      content: 2014年頃
  - node: p
    children:
    - node: text
      content: ' (2スライド)'
  p9:
  - node: p
    children:
    - node: text
      content: '2015年に '
    - node: br
    - node: text
      content: 新サービスが登場
  p10: []
  p11:
  - node: p
    children:
    - node: text
      content: '手触りもいいし '
    - node: br
    - node: text
      content: 最高のサービスでは？
  p12:
  - node: p
    children:
    - node: text
      content: 2015〜2019年頃
  - node: p
    children:
    - node: text
      content: ' (35スライド)'
  p13:
  - node: p
    children:
    - node: text
      content: 2019年2月
  - node: p
    children:
    - node: text
      content: ' (リニューアル)'
  p14:
  - node: p
    children:
    - node: text
      content: 2019年3月
  - node: p
    children:
    - node: text
      content: ' (サ終のお知らせ)'
  p15:
  - node: p
    children:
    - node: text
      content: 2019年3月
  - node: p
    children:
    - node: text
      content: ' (サ終のお知らせ)'
  p16:
  - node: p
    children:
    - node: text
      content: もう誰も信じない…
  p17: []
  p18:
  - node: p
    children:
    - node: text
      content: 自社サービス始まったし ドッグフーディングしよ
  p19:
  - node: p
    children:
    - node: text
      content: 'サービス終ったら '
    - node: br
    - node: text
      content: 怒りの矛先は自社に 向ければいいからね
  p20:
  - node: p
    children:
    - node: text
      content: 2019年〜現在
  - node: p
    children:
    - node: text
      content: ' (たぶん60回超)'
  p21:
  - node: p
    children:
    - node: text
      content: スライド投稿サービスの問題点
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 収益性・持続可能性が低い
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: スライドを読むコストは誰が支払うべきか
    - node: li
      children:
      - node: text
        content: 読者
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 広告モデル (うまく出さないと採算がとれない) モラルが低い
    - node: li
      children:
      - node: text
        content: 投稿者
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: プレミアムモデル (投稿に量や時間の制限をつける)
  p22:
  - node: p
    children:
    - node: text
      content: スライド投稿サービス各社の動向
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: SlideShare
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2020年にScribd社に買収された
        - node: li
          children:
          - node: text
            content: 電子書籍・オーディオブックのサブスク
    - node: li
      children:
      - node: text
        content: SpeakerDeck
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2011年にGitHubが買収→停滞→2018年にスピンアウト
  p23:
  - node: p
    children:
    - node: text
      content: スライド投稿サービス各社の動向
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ニコナレ (niconare)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: サービスとしての手触りはよかったが… 2019年終了
    - node: li
      children:
      - node: text
        content: ドクセル (Docswell)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: がんばってるらしい (サ終の恐怖で触っていない)
    - node: li
      children:
      - node: text
        content: pixivFANBOX
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: スライド投稿サービスではない… (PDFのアップロードが可能)
  p24:
  - node: p
    children:
    - node: text
      content: 'まあこれでいいか '
    - node: br
    - node: text
      content: という停滞の気持ち
  p25:
  - node: p
    children:
    - node: text
      content: PDFを直接配る方式
  p26:
  - node: p
    children:
    - node: text
      content: それではいけないという 気持ちもくすぶっていた
  p27:
  - node: p
    children:
    - node: text
      content: 2019年4月
  p28: []
  p29:
  - node: p
    children:
    - node: text
      content: PDFを表示するための技術スタック
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: mozilla/pdf.js
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: FirefoxでPDFを表示するのに使われている
    - node: li
      children:
      - node: text
        content: azu/slide-pdf.js
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: スライドっぽく表示するためのHTML+JSで構築されたアプリケーション
        - node: li
          children:
          - node: text
            content: クエリパラメータでPDFをURLで指定
  p30:
  - node: p
    children:
    - node: text
      content: 'iframeで表示すれば '
    - node: br
    - node: text
      content: '自分専用の '
    - node: br
    - node: text
      content: スライドをホストできる
  p31:
  - node: p
    children:
    - node: text
      content: いつかやるぞと誓って幾星霜
  p32:
  - node: p
    children:
    - node: text
      content: Twilogの事故が契機
  p33:
  - node: p
    children:
    - node: text
      content: やった
  p34:
  - node: p
    children:
    - node: text
      content: どうやって実現するか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: あくまで静的サイトで実現したい
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ファイルがあれば最悪いつでも移動できる
    - node: li
      children:
      - node: text
        content: ローカルでも実現できるがGitHub Actionsで楽をしたい
    - node: li
      children:
      - node: text
        content: せっかくなのでHonoとか使ったことない技術スタックでやってみたい
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Honoxとか使えば静的サイトジェネレータできるらしい？？？
  p35:
  - node: p
    children:
    - node: text
      content: できた
  p36:
  - node: p
    children:
    - node: text
      content: 作業の流れ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: だいたいCursorのエージェントモードにやらせた
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: HTML/JavaScript/CSS だいたい要求通りに作ってくれる
        - node: li
          children:
          - node: text
            content: 要求さえまとめれば全部やってくれる
    - node: li
      children:
      - node: text
        content: Honoxとして載せるのはうまくいかなかった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 当てずっぽうで問題解決しようとしてくる ← LLMの限界
  p37:
  - node: p
    children:
    - node: text
      content: 感想
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 意思を持って「こう作ってくれ」と具体的にオーダーするのが必要
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: エージェントが雑に作ってくるものに流されてはいけない
        - node: li
          children:
          - node: text
            content: AIごときより自分の方がアイディアがあると確信する
  p38:
  - node: p
    children:
    - node: text
      content: 実装した機能
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: スライド一覧
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: メタデータはYAMLに自分で書いておくことにする
    - node: li
      children:
      - node: text
        content: スライド画面
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: <iframe>でPDFを埋め込み表示 (slide-pdf.jsをカスタマイズ)
        - node: li
          children:
          - node: text
            content: PDFファイルダウンロード、拡大表示、Full screen API
        - node: li
          children:
          - node: text
            content: 表示中のスライド画像のダウンロードとクリップボードへのコピペ
