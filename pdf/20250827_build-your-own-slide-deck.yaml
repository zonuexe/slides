text:
  p1:
  - kind: heading
    level: 1
    text: スライドをシェアできる
  - kind: heading
    level: 1
    text: サービスを作る
  - kind: heading
    level: 2
    text: Build your own slide deck
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2025-08-27 #phpstudy'
  - kind: para
    text: 第178回PHP勉強会@東京
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 Platform Div > WebTechnology Team PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近チームが再編されてインフラっぽい仕事もしてます
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - kind: para
    text: 私事ですがわりと発表しています
  p4:
  - kind: para
    text: みなさんは発表した
  - kind: para
    text: スライドをどうしていますか？
  p5:
  - kind: para
    text: スライド投稿サイトに
  - kind: para
    text: アップロード？
  p6:
  - kind: para
    text: 私も以前はそうしていました…
  p7:
  - kind: heading
    level: 1
    text: 2010～2016年頃 (24スライド)
  p8:
  - kind: heading
    level: 1
    text: 2014年頃 (2スライド)
  p9:
  - kind: para
    text: 2015年に新サービスが登場
  p10: []
  p11:
  - kind: para
    text: 手触りもいいし最高のサービスでは？
  p12:
  - kind: heading
    level: 1
    text: 2015～2019年頃 (35スライド)
  p13:
  - kind: heading
    level: 1
    text: 2019年2月 (リニューアル)
  p14:
  - kind: heading
    level: 1
    text: 2019年3月 (サ終のお知らせ)
  p15:
  - kind: heading
    level: 1
    text: 2019年3月 (サ終のお知らせ)
  p16:
  - kind: heading
    level: 1
    text: もう誰も信じない…
  p17: []
  p18:
  - kind: para
    text: 自社サービス始まったしドッグフーディングしよ
  p19:
  - kind: para
    text: サービス終ったら怒りの矛先は自社に向ければいいからね
  p20:
  - kind: heading
    level: 1
    text: 2019年～現在 (たぶん60回超)
  p21:
  - kind: para
    text: スライド投稿サービスの問題点
  - kind: list
    items:
    - 収益性・持続可能性が低い
    - スライドを読むコストは誰が支払うべきか
    - 読者
    - 広告モデル (うまく出さないと採算がとれない) モラルが低い
    - 投稿者
    - プレミアムモデル (投稿に量や時間の制限をつける)
  p22:
  - kind: heading
    level: 1
    text: スライド投稿サービス各社の動向
  - kind: list
    items:
    - SlideShare
    - 2020年にScribd社に買収された
    - 電子書籍・オーディオブックのサブスク
    - SpeakerDeck
    - 2011年にGitHubが買収→停滞→2018年にスピンアウト
  p23:
  - kind: para
    text: スライド投稿サービス各社の動向
  - kind: list
    items:
    - ニコナレ (niconare)
    - サービスとしての手触りはよかったが… 2019年終了
    - ドクセル (Docswell)
    - がんばってるらしい (サ終の恐怖で触っていない)
    - pixivFANBOX
    - スライド投稿サービスではない… (PDFのアップロードが可能)
  p24:
  - kind: para
    text: まあこれでいいかという停滞の気持ち
  p25:
  - kind: heading
    level: 1
    text: PDFを直接配る方式
  p26:
  - kind: para
    text: それではいけないという気持ちもくすぶっていた
  p27:
  - kind: heading
    level: 1
    text: 2019年4月
  p28: []
  p29:
  - kind: heading
    level: 1
    text: PDFを表示するための技術スタック
  - kind: list
    items:
    - mozilla/pdf.js
    - FirefoxでPDFを表示するのに使われている
    - azu/slide-pdf.js
    - スライドっぽく表示するためのHTML+JSで構築されたアプリケーション
    - クエリパラメータでPDFをURLで指定
  p30:
  - kind: para
    text: iframeで表示すれば
  - kind: para
    text: 自分専用のスライドをホストできる
  p31:
  - kind: heading
    level: 1
    text: いつかやるぞと誓って幾星霜
  p32:
  - kind: heading
    level: 1
    text: Twilogの事故が契機
  p33:
  - kind: heading
    level: 1
    text: やった
  p34:
  - kind: para
    text: どうやって実現するか
  - kind: list
    items:
    - あくまで静的サイトで実現したい
    - ファイルがあれば最悪いつでも移動できる
    - ローカルでも実現できるがGitHub Actionsで楽をしたい
    - せっかくなのでHonoとか使ったことない技術スタックでやってみたい
    - Honoxとか使えば静的サイトジェネレータできるらしい？？？
  p35:
  - kind: heading
    level: 1
    text: できた
  p36:
  - kind: heading
    level: 1
    text: 作業の流れ
  - kind: list
    items:
    - だいたいCursorのエージェントモードにやらせた
    - HTML/JavaScript/CSS だいたい要求通りに作ってくれる
    - 要求さえまとめれば全部やってくれる
    - Honoxとして載せるのはうまくいかなかった
    - 当てずっぽうで問題解決しようとしてくる ← LLMの限界
  p37:
  - kind: heading
    level: 1
    text: 感想
  - kind: list
    items:
    - 意思を持って「こう作ってくれ」と具体的にオーダーするのが必要
    - エージェントが雑に作ってくるものに流されてはいけない
    - AIごときより自分の方がアイディアがあると確信する
  p38:
  - kind: heading
    level: 1
    text: 実装した機能
  - kind: list
    items:
    - スライド一覧
    - メタデータはYAMLに自分で書いておくことにする
    - スライド画面
    - <iframe>でPDFを埋め込み表示 (slide-pdf.jsをカスタマイズ)
    - PDFファイルダウンロード、拡大表示、Full screen API
    - 表示中のスライド画像のダウンロードとクリップボードへのコピペ
