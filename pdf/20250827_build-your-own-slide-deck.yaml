text:
  p1:
  - node: p
    children:
    - node: text
      content: スライドをシェアできる サービスを作るBuild your own slide deckpixiv Inc. USAMI Kenta
    - node: bold
      content: '2025-08-27 #phpstudy 1第178回PHP勉強会@東京'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ•
    - node: bold
      content: うさみけんた
    - node: text
      content: ' (@tadsan) / '
    - node: bold
      content: Zonu.EXE
    - node: text
      content: ' / '
    - node: bold
      content: にゃんだーすわん
    - node: text
      content: ' •'
    - node: bold
      content: ピクシブ株式会社
    - node: text
      content: ' Platform Div > WebTechnology Team '
    - node: bold
      content: PHPer
    - node: text
      content: ' •2012年末から現職、APIとかCIとかいろいろなところを見つめてきました •最近チームが再編されてインフラっぽい仕事もしてます
        •Emacs PHP Modeを開発しています (2017年-) •プログラミング言語にちょっとこだわりのある素人 (spcamp2010)'
  p3:
  - node: p
    children:
    - node: text
      content: 私事ですが わりと発表しています
  p4:
  - node: p
    children:
    - node: text
      content: みなさんは発表した スライドを どうしていますか？
  p5:
  - node: p
    children:
    - node: text
      content: スライド投稿サイトに アップロード？
  p6:
  - node: p
    children:
    - node: text
      content: 私も以前は そうしていました…
  p7:
  - node: p
    children:
    - node: text
      content: 2010〜2016年頃 (24スライド)
  p8:
  - node: p
    children:
    - node: text
      content: 2014年頃 (2スライド)
  p9:
  - node: p
    children:
    - node: text
      content: 2015年に 新サービスが登場
  p11:
  - node: p
    children:
    - node: text
      content: 手触りもいいし 最高のサービスでは？
  p12:
  - node: p
    children:
    - node: text
      content: 2015〜2019年頃 (35スライド)
  p13:
  - node: p
    children:
    - node: text
      content: 2019年2月 (リニューアル)
  p14:
  - node: p
    children:
    - node: text
      content: 2019年3月 (サ終のお知らせ)
  p15:
  - node: p
    children:
    - node: text
      content: 2019年3月 (サ終のお知らせ)
    - node: bold
      content: '14'
  p16:
  - node: p
    children:
    - node: text
      content: もう誰も信じない…
  p18:
  - node: p
    children:
    - node: text
      content: 自社サービス始まったし ドッグフーディングしよ
  p19:
  - node: p
    children:
    - node: text
      content: サービス終ったら 怒りの矛先は自社に 向ければいいからね
  p20:
  - node: p
    children:
    - node: text
      content: 2019年〜現在 (たぶん60回超)
  p21:
  - node: ul
    children:
    - node: li
      children:
      - node: bold
        content: 収益性・持続可能性が低い
    - node: li
      children:
      - node: bold
        content: スライドを読むコストは誰が支払うべきか
    - node: li
      children:
      - node: bold
        content: 読者
    - node: li
      children:
      - node: bold
        content: 広告モデル
    - node: li
      children:
      - node: bold
        content: 投稿者
    - node: li
      children:
      - node: bold
        content: プレミアムモデル
  - node: p
    children:
    - node: text
      content: スライド投稿サービスの問題点
    - node: text
      content: ' (うまく出さないと採算がとれない) モラルが低い '
    - node: text
      content: ' (投稿に量や時間の制限をつける)'
  p22:
  - node: ul
    children:
    - node: li
      children:
      - node: bold
        content: SlideShare
    - node: li
      children:
      - node: text
        content: 2020年にScribd社に買収された
    - node: li
      children:
      - node: text
        content: 電子書籍・オーディオブックのサブスク
    - node: li
      children:
      - node: bold
        content: SpeakerDeck
    - node: li
      children:
      - node: text
        content: 2011年にGitHubが買収→停滞→2018年にスピンアウト
  - node: p
    children:
    - node: text
      content: スライド投稿サービス各社の動向
  p23:
  - node: ul
    children:
    - node: li
      children:
      - node: bold
        content: ニコナレ (niconare)
    - node: li
      children:
      - node: text
        content: サービスとしての手触りはよかったが… 2019年終了
    - node: li
      children:
      - node: bold
        content: ドクセル (Docswell)
    - node: li
      children:
      - node: text
        content: がんばってるらしい (サ終の恐怖で触っていない)
    - node: li
      children:
      - node: bold
        content: pixivFANBOX
    - node: li
      children:
      - node: text
        content: スライド投稿サービスではない… (PDFのアップロードが可能)
  - node: p
    children:
    - node: text
      content: スライド投稿サービス各社の動向
  p24:
  - node: p
    children:
    - node: text
      content: まあこれでいいか という停滞の気持ち
  p25:
  - node: p
    children:
    - node: text
      content: PDFを直接配る方式
  p26:
  - node: p
    children:
    - node: text
      content: それではいけないという 気持ちもくすぶっていた
  p27:
  - node: p
    children:
    - node: text
      content: 2019年4月
  p29:
  - node: ul
    children:
    - node: li
      children:
      - node: bold
        content: mozilla/pdf.js
    - node: li
      children:
      - node: text
        content: FirefoxでPDFを表示するのに使われている
    - node: li
      children:
      - node: bold
        content: azu/slide-pdf.js
    - node: li
      children:
      - node: text
        content: スライドっぽく表示するためのHTML+JSで構築されたアプリケーション
    - node: li
      children:
      - node: text
        content: クエリパラメータでPDFをURLで指定
  - node: p
    children:
    - node: text
      content: PDFを表示するための技術スタック
  p30:
  - node: p
    children:
    - node: text
      content: iframeで表示すれば 自分専用の スライドをホストできる
  p31:
  - node: p
    children:
    - node: text
      content: いつかやるぞと誓って幾星霜
  p32:
  - node: p
    children:
    - node: text
      content: Twilogの事故が契機
  p33:
  - node: p
    children:
    - node: text
      content: やった
  p34:
  - node: ul
    children:
    - node: li
      children:
      - node: bold
        content: あくまで静的サイトで実現したい
    - node: li
      children:
      - node: text
        content: ファイルがあれば最悪いつでも移動できる
    - node: li
      children:
      - node: bold
        content: ローカルでも実現できるがGitHub Actionsで楽をしたい
    - node: li
      children:
      - node: bold
        content: せっかくなのでHonoとか使ったことない技術スタックでやってみたい
    - node: li
      children:
      - node: bold
        content: Honox
  - node: p
    children:
    - node: text
      content: どうやって実現するか
    - node: text
      content: とか使えば静的サイトジェネレータできるらしい？？？
  p35:
  - node: p
    children:
    - node: text
      content: できた
  p36:
  - node: ul
    children:
    - node: li
      children:
      - node: bold
        content: だいたいCursorのエージェントモードにやらせた
    - node: li
      children:
      - node: text
        content: HTML/JavaScript/CSS だいたい要求通りに作ってくれる
    - node: li
      children:
      - node: text
        content: 要求さえまとめれば全部やってくれる
    - node: li
      children:
      - node: bold
        content: Honox
  - node: p
    children:
    - node: text
      content: 作業の流れ
    - node: text
      content: 'として載せるのはうまくいかなかった '
    - node: text
      content: 当てずっぽうで問題解決しようとしてくる ← LLMの限界
  p37:
  - node: ul
    children:
    - node: li
      children:
      - node: bold
        content: 意思を持って「こう作ってくれ」と具体的にオーダーするのが必要
    - node: li
      children:
      - node: text
        content: エージェントが雑に作ってくるものに流されてはいけない
    - node: li
      children:
      - node: text
        content: AIごときより自分の方がアイディアがあると確信する
  - node: p
    children:
    - node: text
      content: 感想
  p38:
  - node: p
    children:
    - node: text
      content: 実装した機能•スライド一覧 •メタデータはYAMLに自分で書いておくことにする •スライド画面 •<iframe>でPDFを埋め込み表示
        (slide-pdf.jsをカスタマイズ) •PDFファイルダウンロード、拡大表示、Full screen API •表示中のスライド画像のダウンロードとクリップボードへのコピペ
