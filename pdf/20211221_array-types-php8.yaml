  p10:
  - node: p
    children:
    - node: text
      content: なんかいろいろ 話してきました
  p11:
  - node: p
    children:
    - node: text
      content: PHPの進化は 型宣言の進化
  p12:
  - node: p
    children:
    - node: text
      content: 型がついていない関数(PHP5)
  - node: p
    children:
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p13:
  - node: p
    children:
    - node: text
      content: スカラー型宣言(PHP7)
  - node: p
    children:
    - node: text
      content: 'int + intって '
    - node: br
    - node: text
      content: 本当にintなの？
  - node: p
    children:
    - node: text
      content: 'function add(int $a, int $b): int {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p14:
  - node: p
    children:
    - node: text
      content: 広い値をとるにはﬂoatが必要
  - node: p
    children:
    - node: text
      content: 'ひとつの解決策では '
    - node: br
    - node: text
      content: あるが… 不必要にfloat
    - node: br
    - node: text
      content: を強制するのか
  - node: p
    children:
    - node: text
      content: 'function add(float $a, float $b): float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p15:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈
  - node: p
    children:
    - node: text
      content: (アノテーション)
  - node: p
    children:
    - node: text
      content: /**
    - node: br
    - node: text
      content: ' * @param int|float $a'
  - node: p
    children:
    - node: text
      content: あえて型宣言を省略する
  - node: p
    children:
    - node: text
      content: ' * @param int|float $b'
    - node: br
    - node: text
      content: ' * @return int|float'
    - node: br
    - node: text
      content: ' */         '
    - node: br
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p16:
  - node: p
    children:
    - node: text
      content: ユニオン型宣言 (PHP8.0)
  - node: p
    children:
    - node: text
      content: 'function add(int|float $a, int|float $b): int|float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p17:
  - node: p
    children:
    - node: text
      content: 'クラスの型も '
    - node: br
    - node: text
      content: PHP7→8で進化
  p18:
  - node: p
    children:
    - node: text
      content: 著者を持つBookクラス
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    /** @var Author */         '
    - node: br
    - node: text
      content: '    private $author         '
    - node: br
    - node: text
      content: '    public function __construct(Author $author) {         '
    - node: br
    - node: text
      content: '        $this->author = $author;'
    - node: br
    - node: text
      content: '   }'
    - node: br
    - node: text
      content: '}         '
  p19:
  - node: p
    children:
    - node: text
      content: PHP 7.4でプロパティ型宣言
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    /** @var Author */         '
    - node: br
    - node: text
      content: '    private Author $author         '
    - node: br
    - node: text
      content: '    public function __construct(Author $author) {         '
    - node: br
    - node: text
      content: '        $this->author = $author;'
    - node: br
    - node: text
      content: '   }'
    - node: br
    - node: text
      content: '}         '
  p20:
  - node: p
    children:
    - node: text
      content: コンストラクタプロモーション
  - node: p
    children:
    - node: text
      content: (PHP8)
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        private Author $author         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p21:
  - node: p
    children:
    - node: text
      content: readonlyプロパティ
  - node: p
    children:
    - node: text
      content: (PHP8.1)
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        public readonly Author $author         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p22:
  - node: p
    children:
    - node: text
      content: 'かくしてPHP '
    - node: br
    - node: text
      content: 'PHPDocの型が '
    - node: br
    - node: text
      content: 不要な世界に
  p23:
  - node: p
    children:
    - node: text
      content: Bookクラスは著者を持つ
  - node: p
    children:
    - node: text
      content: '上司 '
  - node: p
    children:
    - node: text
      content: 'class Book         '
  - node: p
    children:
    - node: text
      content: 「共著を想定できてる？」
  - node: p
    children:
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        private Author $author         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p24:
  - node: p
    children:
    - node: text
      content: Bookクラスは複数の著者を持つ
  - node: p
    children:
    - node: text
      content: 'arrayにすることで '
  - node: p
    children:
    - node: text
      content: 'class Book         '
  - node: p
    children:
    - node: text
      content: 複数であることを表現
  - node: p
    children:
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
  - node: p
    children:
    - node: text
      content: 'Authorクラスの '
  - node: p
    children:
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: 情報が減ってる…
  - node: p
    children:
    - node: text
      content: '}         '
  p25:
  - node: p
    children:
    - node: text
      content: 著者一覧を出力したい
  - node: p
    children:
    - node: text
      content: 'Book::$authors : array 中身が何かわからない！'
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function printAuthors($fp): void {'
    - node: br
    - node: text
      content: '       foreach ($this->authors as $author) {                     fwrite($fp, $author->getName());         '
    - node: br
    - node: text
      content: '       }         '
  - node: p
    children:
    - node: text
      content: 'Authorクラスの '
  - node: p
    children:
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: メソッドを補完できない
  - node: p
    children:
    - node: text
      content: '}         '
  p26:
  - node: p
    children:
    - node: text
      content: '何か大事なものを '
    - node: br
    - node: text
      content: '失ってしまった '
    - node: br
    - node: text
      content: 気がする
  p27:
  - node: p
    children:
    - node: text
      content: '今回は配列に絞って '
    - node: br
    - node: text
      content: 話します
  p28:
  - node: p
    children:
    - node: text
      content: PHPの配列は万能
  p29:
  - node: p
    children:
    - node: text
      content: PHPの配列はなんでもできる
  p30:
  - node: p
    children:
    - node: text
      content: PHPマニュアルより引用
  p31:
  - node: p
    children:
    - node: text
      content: 'PHPの配列は '
    - node: br
    - node: text
      content: ハッシュテーブル
  p32:
  - node: p
    children:
    - node: text
      content: JavaScript/Rubyの場合
  p33:
  - node: p
    children:
    - node: text
      content: PHPの場合
  p34:
  - node: p
    children:
    - node: text
      content: 何が違うのか
  p35:
  - node: p
    children:
    - node: text
      content: 他の言語における配列(array)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: C言語における配列はメモリ上の連続した領域に並べたもの
      - node: br
      - node: text
        content: '(ポインタとかアドレスとかの概念が絡んでくる) '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: インデックスは0が始点、長さ(値の数)は最初に決める
    - node: li
      children:
      - node: text
        content: JavaScriptやRubyでの配列は複数の値を格納できるオブジェクト
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: インデックスは0が始点、動的に拡張される
        - node: li
          children:
          - node: text
            content: 長さ以上のインデックスに代入されると、間の値はnull的な値で埋められる
  p36:
  - node: p
    children:
    - node: text
      content: PHPの配列はハッシュテーブル
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPの配列は基本的にハッシュテーブルというデータ構造
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 任意の int または string の値をキーにできる
        - node: li
          children:
          - node: text
            content: 長さ以上に代入しても間がnullで埋められることはない
    - node: li
      children:
      - node: text
        content: 連続していない前提の配列を特に「連想配列」と呼ぶ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 英語ではassociative array (略してassoc)などと呼ばれる
    - node: li
      children:
      - node: text
        content: PHPだけではなくLuaという言語も似た仕様
  p37:
  - node: p
    children:
    - node: text
      content: PHP7の内部実装から学ぶ性能改善テクニック
  p38:
  - node: p
    children:
    - node: text
      content: PHP7から内部的に「配列」が入った
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2015年リリースのPHP 7.0ではデータ構造に大きく手が入った
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: $a = [1, 2, 3] のような値は(C言語的な意味)の配列として保持される
        - node: li
          children:
          - node: text
            content: 既存の配列に $a['str'] = 'val' のように追加するとき
          - node: br
          - node: text
            content: ハッシュテーブルに詰め替えられる
  p39:
  - node: p
    children:
    - node: text
      content: 連想配列 vs リスト
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPでは区別されないが、たとえば値をjson_encode()する時など
      - node: br
      - node: text
        content: '連想配列と連続した値を厳密に比較したいことはありうる '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: JSONでは歯抜けの値があると [] ではなく {} になってしまう
        - node: li
          children:
          - node: text
            content: array_9lter() の結果など
    - node: li
      children:
      - node: text
        content: array_values() で歯抜けのない配列に変換できる
    - node: li
      children:
      - node: text
        content: PHP 8.1で array_is_list() で判定できる
  p40:
  - node: p
    children:
    - node: text
      content: array_is_list()について
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP 8.1で追加された関数
    - node: li
      children:
      - node: text
        content: 従来は 0 から順にforeachして歯抜けがないかチェックする必要があった
    - node: li
      children:
      - node: text
        content: 静的解析ツール(PHPStan, Psalmなど)ではPHPDocに
      - node: br
      - node: text
        content: 'array<int,string> の代りに list<string>と書ける '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近のPhpStormでは(検査は不十分だが)認識してくれる
        - node: li
          children:
          - node: text
            content: Intelephenseは未実装
  p41:
  - node: p
    children:
    - node: text
      content: Authorsはどうなれば
    - node: br
    - node: text
      content: よかったのか
  p42:
  - node: p
    children:
    - node: text
      content: Bookクラスは複数の著者を持つ
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct(         '
  - node: p
    children:
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p43:
  - node: p
    children:
    - node: text
      content: PHPDocの帰還
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct(         '
    - node: br
    - node: text
      content: '        /** @var list<Authors> */'
    - node: br
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 何も書かなくてもプロパティに代入される
  - node: p
    children:
    - node: text
      content: '        //           '
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p44:
  - node: p
    children:
    - node: text
      content: 配列はひとつ！じゃない！！
  - node: p
    children:
    - node: text
      content: list<int>
  - node: p
    children:
    - node: text
      content: array<int,string>
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ユーザIDがならんだリスト ［123, 456］
    - node: li
      children:
      - node: text
        content: ユーザIDと名前の対応表 [123 => '野比のび太', 234 => '源静香']
    - node: li
      children:
      - node: text
        content: ユーザを表す構造体 ['id' => 123, 'name' => '野比のび太']
    - node: li
      children:
      - node: text
        content: ユーザを表す構造体がならんだリスト
  - node: p
    children:
    - node: text
      content: array{id:int, name:string}
  - node: p
    children:
    - node: text
      content: '[ '
    - node: br
    - node: text
      content: '    [''id'' => 123, ''name'' => ''野比のび太''], '
    - node: br
    - node: text
      content: '    [''id'' => 234, ''name'' => ''源静香''], '
  - node: p
    children:
    - node: text
      content: '] '
  - node: p
    children:
    - node: text
      content: list<array{id:int, name:string}>
