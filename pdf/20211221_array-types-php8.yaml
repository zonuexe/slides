text:
  p1:
  - kind: heading
    level: 1
    text: PHP8時代に
  - kind: heading
    level: 1
    text: array型と向き合う
  - kind: heading
    level: 2
    text: Faced with array type in the PHP 8.x era
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2021-12-21 PHPerKaigi petit - PHP8.1リリース祝賀会
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています (PSR-15!)
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - PHPカンファレンス実行委員、PHPerKaigi コアスタッフ
  p3:
  - kind: para
    text: tadsanのあれこれが読める場所
  - kind: list
    items:
    - https://tadsan.fanbox.cc/
    - https://scrapbox.io/php/
    - https://www.phper.ninja/
    - https://zenn.dev/tadsan
    - https://qiita.com/tadsan
    - https://github.com/bag2php
  p4:
  - kind: heading
    level: 1
    text: WEB+DB PRESS総集編
  p5:
  - kind: heading
    level: 1
    text: Software Design 11月号
  p6:
  - kind: heading
    level: 1
    text: 前回までのあらすじ
  p7:
  - kind: heading
    level: 1
    text: 最後のPHP勉強会(2020年)
  p8:
  - kind: heading
    level: 1
    text: PHPカンファレンス沖縄2021
  p9:
  - kind: heading
    level: 1
    text: PHPカンファレンス2021
  p10:
  - kind: para
    text: なんかいろいろ話してきました
  p11:
  - kind: para
    text: PHPの進化は
  - kind: para
    text: 型宣言の進化
  p12:
  - kind: heading
    level: 1
    text: 型がついていない関数(PHP5)
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p13:
  - kind: heading
    level: 1
    text: スカラー型宣言(PHP7)
  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p14:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にfloat
  - kind: para
    text: を強制するのか
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p15:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p16:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p17:
  - kind: para
    text: クラスの型もPHP7→8で進化
  p18:
  - kind: heading
    level: 1
    text: 著者を持つBookクラス
  - kind: para
    text: class Book{/** @var Author */private $author public function __construct(Author
      $author) {$this->author = $author;}}
  p19:
  - kind: heading
    level: 1
    text: PHP 7.4でプロパティ型宣言
  - kind: para
    text: class Book{/** @var Author */private Author $author public function __construct(Author
      $author) {$this->author = $author;}}
  p20:
  - kind: heading
    level: 1
    text: コンストラクタプロモーション(PHP8)
  - kind: para
    text: class Book{function __construct(private Author $author) {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: '}}'
  p21:
  - kind: heading
    level: 1
    text: readonlyプロパティ(PHP8.1)
  - kind: para
    text: class Book{function __construct(public readonly Author $author) {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: '}}'
  p22:
  - kind: para
    text: かくしてPHP PHPDocの型が
  - kind: para
    text: 不要な世界に
  p23:
  - kind: heading
    level: 1
    text: Bookクラスは著者を持つ
  - kind: para
    text: 上司
  - kind: para
    text: 「共著を想定できてる？」
  - kind: para
    text: class Book{function __construct(private Author $author) {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: '}}'
  p24:
  - kind: heading
    level: 1
    text: Bookクラスは複数の著者を持つ
  - kind: para
    text: arrayにすることで
  - kind: para
    text: 複数であることを表現
  - kind: para
    text: class Book{function __construct(private array $authors) {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: Authorクラスの情報が減ってる…
  - kind: para
    text: '}}'
  p25:
  - kind: heading
    level: 1
    text: 著者一覧を出力したい
  - kind: para
    text: 'Book::$authors : array'
  - kind: para
    text: 中身が何かわからない！
  - kind: para
    text: Authorクラスのメソッドを補完できない
  - kind: para
    text: 'class Book{function printAuthors($fp): void {foreach ($this->authors as
      $author) {fwrite($fp, $author->getName());}}}'
  p26:
  - kind: para
    text: 何か大事なものを
  - kind: para
    text: 失ってしまった
  - kind: para
    text: 気がする
  p27:
  - kind: para
    text: 今回は配列に絞って
  - kind: para
    text: 話します
  p28:
  - kind: heading
    level: 1
    text: PHPの配列は万能
  p29:
  - kind: heading
    level: 1
    text: PHPの配列はなんでもできる
  p30:
  - kind: heading
    level: 1
    text: PHPマニュアルより引用
  p31:
  - kind: para
    text: PHPの配列はハッシュテーブル
  p32:
  - kind: heading
    level: 1
    text: JavaScript/Rubyの場合
  p33:
  - kind: heading
    level: 1
    text: PHPの場合
  p34:
  - kind: heading
    level: 1
    text: 何が違うのか
  p35:
  - kind: heading
    level: 1
    text: 他の言語における配列(array)
  - kind: list
    items:
    - C言語における配列はメモリ上の連続した領域に並べたもの
  - kind: para
    text: (ポインタとかアドレスとかの概念が絡んでくる)
  - kind: list
    items:
    - インデックスは0が始点、長さ(値の数)は最初に決める
    - JavaScriptやRubyでの配列は複数の値を格納できるオブジェクト
    - インデックスは0が始点、動的に拡張される
    - 長さ以上のインデックスに代入されると、間の値はnull的な値で埋められる
  p36:
  - kind: para
    text: PHPの配列はハッシュテーブル
  - kind: list
    items:
    - PHPの配列は基本的にハッシュテーブルというデータ構造
    - 任意の int または string の値をキーにできる
    - 長さ以上に代入しても間がnullで埋められることはない
    - 連続していない前提の配列を特に「連想配列」と呼ぶ
    - 英語ではassociative array (略してassoc)などと呼ばれる
    - PHPだけではなくLuaという言語も似た仕様
  p37:
  - kind: heading
    level: 1
    text: PHP7の内部実装から学ぶ性能改善テクニック
  p38:
  - kind: heading
    level: 1
    text: PHP7から内部的に「配列」が入った
  - kind: list
    items:
    - 2015年リリースのPHP 7.0ではデータ構造に大きく手が入った
    - $a = [1, 2, 3] のような値は(C言語的な意味)の配列として保持される
    - 既存の配列に $a['str'] = 'val' のように追加するとき
  - kind: para
    text: ハッシュテーブルに詰め替えられる
  p39:
  - kind: para
    text: 連想配列 vs リスト
  - kind: list
    items:
    - PHPでは区別されないが、たとえば値をjson_encode()する時など
  - kind: para
    text: 連想配列と連続した値を厳密に比較したいことはありうる
  - kind: list
    items:
    - JSONでは歯抜けの値があると [] ではなく {} になってしまう
    - array_filter() の結果など
    - array_values() で歯抜けのない配列に変換できる
    - PHP 8.1で array_is_list() で判定できる
  p40:
  - kind: para
    text: array_is_list()について
  - kind: list
    items:
    - PHP 8.1で追加された関数
    - 従来は 0 から順にforeachして歯抜けがないかチェックする必要があった
    - 静的解析ツール(PHPStan, Psalmなど)ではPHPDocに
  - kind: para
    text: array<int,string> の代りに list<string>と書ける
  - kind: list
    items:
    - 最近のPhpStormでは(検査は不十分だが)認識してくれる
    - Intelephenseは未実装
  p41:
  - kind: para
    text: Authorsはどうなれば
  - kind: para
    text: よかったのか
  p42:
  - kind: heading
    level: 1
    text: Bookクラスは複数の著者を持つ
  - kind: para
    text: class Book{function __construct(
  - kind: para
    text: private array $authors) {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: '}}'
  p43:
  - kind: heading
    level: 1
    text: PHPDocの帰還
  - kind: para
    text: class Book{function __construct(/** @var list<Authors> */private array $authors)
      {// 何も書かなくてもプロパティに代入される
  - kind: para
    text: '}}'
  p44:
  - kind: heading
    level: 1
    text: 配列はひとつ！じゃない！！
  - kind: para
    text: list<int>
  - kind: para
    text: array<int,string>
  - kind: para
    text: array{id:int, name:string}
  - kind: list
    items:
    - ユーザIDがならんだリスト ［123, 456］
    - ユーザIDと名前の対応表 [123 => '野比のび太', 234 => '源静香']
    - ユーザを表す構造体 ['id' => 123, 'name' => '野比のび太']
    - ユーザを表す構造体がならんだリスト
  - kind: para
    text: '[[''id'' => 123, ''name'' => ''野比のび太''],[''id'' => 234, ''name'' => ''源静香''],]'
  - kind: para
    text: list<array{id:int, name:string}>
