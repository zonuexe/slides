  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4:
  - kind: para
    text: We are hiring!
  p5:
  - kind: para
    text: 近況報告
  p6: []
  p7: []
  p8:
  - kind: para
    text: はじめに
  - kind: para
    text: お断り
  p9:
  - kind: para
    text: 私は会社ではPhpStormの利用を推進してます(当然経費で導入)
  p10:
  - kind: para
    text: 今回の発表
  - kind: para
    text: 現段階はWIP(作業中)
  p11:
  - kind: para
    text: 対象者
  p12:
  - kind: para
    text: PhpStorm以外で開発したい各位
  p13:
  - kind: para
    text: 特にVimmer Emacser
  p14:
  - kind: para
    text: それ以外のエディタ拡張開発者
  p15:
  - kind: para
    text: 改めて
  p16:
  - kind: heading
    level: 2
    text: 'WIP:'
  - kind: heading
    level: 1
    text: Emacsでインテリジェントな
  - kind: heading
    level: 1
    text: PHPコーディング2018
  - kind: para
    text: Intelligent PHP coding in Emacs.
  - kind: para
    text: '2018-06-16 #phpconfuk_rej PHPカンファレンス福岡2018前夜祭リジェクトコン'
  p17:
  - kind: para
    text: みなさん
  p18:
  - kind: para
    text: IDEでコード書いてますか？
  p19:
  - kind: para
    text: PhpStorm?
  p20:
  - kind: para
    text: Vim?Emacs?
  p21:
  - kind: para
    text: Sublime Text?Atom? VSCode?
  p22:
  - kind: para
    text: Eclipse?NetBeans?
  p23:
  - kind: para
    text: 秀丸?サクラエディタ?
  p24:
  - kind: para
    text: 私はEmacs
  - kind: para
    text: ＼(^o^)／
  p25:
  - kind: para
    text: 理由：僕がハックできるエディタがEmacsだから(PhpStormは自由にハックできない)
  p26:
  - kind: para
    text: これまでのあらすじ
  p27: []
  p28:
  - kind: para
    text: 要約：Lispパッケージを入れると、いい感じのナビゲーションができるよ
  p29: []
  p30:
  - kind: para
    text: 要約：Emacsは高性能竹槍だぞ
  p31: []
  p32:
  - kind: para
    text: 要約：PhpStorm最高！いちばん好きなStormです
  p33:
  - kind: para
    text: エディタくらい好きなの選びたい
  p34:
  - kind: para
    text: 勝つとか負けるとかの話ではない
  p35:
  - kind: para
    text: エディタ選択は専門職たるエンジニアの裁量の範疇
  p36:
  - kind: para
    text: 本当にそれでエラーを起こさない自信があるならな
  p37:
  - kind: para
    text: 僕は自信がない
  p38:
  - kind: para
    text: インテリジェントなIDEができること
  p39:
  - kind: para
    text: 定義ジャンプリファクタリングインラインエラーチェック- syntax error/ 型の不整合- 未定義変数/未定義クラス… etc.
  p40:
  - kind: para
    text: 定義ジャンプ
  p41:
  - kind: para
    text: 高速なコードリーディングには必須
  p42:
  - kind: para
    text: リファクタリング
  p43:
  - kind: para
    text: 効率よく仕様を変更するのに必須
  p44:
  - kind: para
    text: インラインエラーチェック
  p45:
  - kind: para
    text: 文法違反のチェックごときに時間をとりたくない
  p46: []
  p47:
  - kind: para
    text: あなたのエディタはできますか?
  p48:
  - kind: para
    text: 定義ジャンプ ←タグジャンプリファクタリング ← sedインラインエラーチェック- syntax error/ 型の不整合- 未定義変数/未定義クラス…
      etc. ↑ php -l
  p49:
  - kind: para
    text: タグファイルってシンボル検索してジャンプするだけじゃないの…
  p50:
  - kind: para
    text: おまいはそれで満足か?
  p51:
  - kind: para
    text: Photoshop
  p52:
  - kind: para
    text: それはそれでいい
  p53:
  - kind: para
    text: 手に馴染んだエディタvs高性能IDE
  p54:
  - kind: para
    text: エディタ選択の自由を守るには自分自信がPHPスキルを磨き、IDEを選択せずに開発することで損ねないことの証を立てねばならない。
  p55:
  - kind: para
    text: 強いIDEの生産性を凌駕するには、開発者各位がエディタスキルとコーディングスキルを磨かなければいけない！！！
  p56:
  - kind: para
    text: ほんとにそれでいいのか
  p57:
  - kind: para
    text: 精密リファクタはPhpStormの独擅場
  p58:
  - kind: para
    text: 圧倒的じゃないか、我が軍は。
  p59:
  - kind: para
    text: 戦力差を埋めよう
  p60:
  - kind: para
    text: PHPStan
  p61: []
  p62:
  - kind: para
    text: 実は、PHPStanは軽いのでインラインエラー検査に最適
  p63:
  - kind: para
    text: この検査結果をエディタでインライン表示できれば、だいたいPhpStormっぽくなる！
  p64:
  - kind: para
    text: PHPStan 0.9.2と現masterブランチは互換性がないので注意
  p65:
  - kind: para
    text: Phpactor
  p66: []
  p67:
  - kind: para
    text: リファクタリング＆ナビゲーション・補完
  p68:
  - kind: para
    text: エディタ中立な設計
  p69:
  - kind: para
    text: 公式ではVimプラグイン同梱
  p70:
  - kind: para
    text: リファクタリング機能については、まだPhpStormに匹敵するほどの能力はない(開発中・発展途上)
  p71:
  - kind: para
    text: 現状報告
  p72:
  - kind: para
    text: 自分で問題解決できる人柱向け
  p73:
  - kind: para
    text: まだ万人にEmacsを薦められる段階にはなってない
  p74:
  - kind: para
    text: 理由：プロジェクトごと設定必要インストールがめんどい
  p75:
  - kind: para
    text: インストールめんどい件：まだPharアーカイブでは配布されてないcomposer globalとかで入れるのが比較的に楽
  p76: []
  p77: []
  p78:
  - kind: para
    text: そして
  p79: []
  p80:
  - kind: para
    text: この構想については眠くない夜に書きます
  p81:
  - kind: para
    text: いますぐ利用したいEmacsユーザー向け
  p82:
  - kind: para
    text: MELPAでﬂycheck-phpstanを入れて、README通りに設定
  p83:
  - kind: para
    text: MELPAでphpactorを入れて、設定しcompany-phpactor
  p84:
  - kind: para
    text: 詳しくは直接聞いてくれ！！
  p85:
  - kind: para
    text: tadsanのやる気をアップさせる方法
  p86:
  - kind: para
    text: やらなきゃいけないことドキュメント化の必要はわかってる…
  p87:
  - kind: para
    text: 夜は眠いしやる気が出ない
  p88: []
  p89:
  - kind: para
    text: tadsan先生の次回作にご期待ください
  p90:
  - kind: para
    text: 課金は成果を約束するものではございません
  p91:
  - kind: para
    text: あるいは
  p92:
  - kind: para
    text: お前がEmacs Lisperになるんだよ
