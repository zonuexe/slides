    text: リファクタリング
  - kind: para
    text: ＆
  - kind: para
    text: ナビゲーション・補完
  p68:
  - kind: para
    text: エディタ中立な
  - kind: para
    text: 設計
  p69:
  - kind: para
    text: 公式では
  - kind: para
    text: Vimプラグイン
  - kind: para
    text: 同梱
  p70:
  - kind: para
    text: リファクタリング機能につ
  - kind: para
    text: いては、まだPhpStormに
  - kind: para
    text: 匹敵するほどの能力はない
  - kind: para
    text: (開発中・発展途上)
  p71:
  - kind: para
    text: 現状報告
  p72:
  - kind: para
    text: 自分で問題解決
  - kind: para
    text: できる人柱向け
  p73:
  - kind: para
    text: まだ万人にEmacs
  - kind: para
    text: を薦められる段階
  - kind: para
    text: にはなってない
  p74:
  - kind: para
    text: 理由：
  - kind: para
    text: プロジェクトごと設定必要
  - kind: para
    text: インストールがめんどい
  p75:
  - kind: para
    text: インストールめんどい件：
  - kind: para
    text: まだPharアーカイブでは配
  - kind: para
    text: 布されてない
  - kind: para
    text: composer globalとかで入れ
  - kind: para
    text: るのが比較的に楽
  p76: []
  p77: []
  p78:
  - kind: para
    text: そして
  p79: []
  p80:
  - kind: para
    text: この構想については
  - kind: para
    text: 眠くない夜に書きます
  p81:
  - kind: para
    text: いますぐ利用したい
  - kind: para
    text: Emacsユーザー向け
  p82:
  - kind: para
    text: MELPAで
  - kind: para
    text: ﬂycheck-phpstan
  - kind: para
    text: を入れて、
  - kind: para
    text: README通りに設定
  p83:
  - kind: para
    text: MELPAで
  - kind: para
    text: phpactor
  - kind: para
    text: を入れて、設定し
  - kind: para
    text: company-phpactor
  p84:
  - kind: para
    text: 詳しくは直接聞
  - kind: para
    text: いてくれ！！
  p85:
  - kind: para
    text: tadsanのやる気を
  - kind: para
    text: アップさせる方法
  p86:
  - kind: para
    text: やらなきゃいけない
  - kind: para
    text: ことドキュメント化
  - kind: para
    text: の必要はわかってる…
  p87:
  - kind: para
    text: 夜は眠いし
  - kind: para
    text: やる気が出ない
  p88: []
  p89:
  - kind: para
    text: tadsan先生の
  - kind: para
    text: 次回作にご期待
  - kind: para
    text: ください
  p90:
  - kind: para
    text: 課金は成果を
  - kind: para
    text: 約束するものでは
  - kind: para
    text: ございません
  p91:
