    text: NetBeans?
  p23:
  - kind: para
    text: 秀丸?
  - kind: para
    text: サクラエディタ?
  p24:
  - kind: para
    text: 私はEmacs
  - kind: para
    text: ＼(^o^)／
  p25:
  - kind: para
    text: 理由：
  - kind: para
    text: 僕がハックできるエディタ
  - kind: para
    text: がEmacsだから
  - kind: para
    text: (PhpStormは自由にハック
  - kind: para
    text: できない)
  p26:
  - kind: para
    text: これまでの
  - kind: para
    text: あらすじ
  p27: []
  p28:
  - kind: para
    text: 要約：
  - kind: para
    text: Lispパッケージを入れ
  - kind: para
    text: ると、いい感じのナビ
  - kind: para
    text: ゲーションができるよ
  p29: []
  p30:
  - kind: para
    text: 要約：
  - kind: para
    text: Emacsは高性能
  - kind: para
    text: 竹槍だぞ
  p31: []
  p32:
  - kind: para
    text: 要約：
  - kind: para
    text: PhpStorm最高！
  - kind: para
    text: いちばん好きなStorm
  - kind: para
    text: です
  p33:
  - kind: para
    text: エディタくらい
  - kind: para
    text: 好きなの選びたい
  p34:
  - kind: para
    text: 勝つとか負けると
  - kind: para
    text: かの話ではない
  p35:
  - kind: para
    text: エディタ選択は
  - kind: para
    text: 専門職たるエンジ
  - kind: para
    text: ニアの裁量の範疇
  p36:
  - kind: para
    text: 本当にそれでエラー
  - kind: para
    text: を起こさない
  - kind: para
    text: 自信があるならな
  p37:
  - kind: para
    text: 僕は自信がない
  p38:
  - kind: para
    text: インテリジェント
  - kind: para
    text: なIDEができること
  p39:
  - kind: para
    text: 定義ジャンプ
  - kind: para
    text: リファクタリング
  - kind: para
    text: インラインエラーチェック
  - kind: para
    text: '- syntax error/ 型の不整合'
  - kind: para
    text: '- 未定義変数/未定義クラス'
  - kind: para
    text: … etc.
  p40:
  - kind: para
    text: 定義ジャンプ
  p41:
  - kind: para
    text: 高速なコードリー
  - kind: para
    text: ディングには必須
  p42:
  - kind: para
    text: リファクタリング
  p43:
  - kind: para
    text: 効率よく仕様を変
  - kind: para
    text: 更するのに必須
  p44:
  - kind: para
    text: インライン
  - kind: para
    text: エラーチェック
  p45:
  - kind: para
    text: 文法違反のチェック
  - kind: para
    text: ごときに
  - kind: para
    text: 時間をとりたくない
  p46: []
  p47:
  - kind: para
    text: あなたの
  - kind: para
    text: エディタは
  - kind: para
    text: できますか?
  p48:
  - kind: para
    text: 定義ジャンプ ←タグジャンプ
  - kind: para
    text: リファクタリング ← sed
  - kind: para
    text: インラインエラーチェック
  - kind: para
    text: '- syntax error/ 型の不整合'
  - kind: para
    text: '- 未定義変数/未定義クラス'
  - kind: para
    text: … etc. ↑ php -l
  p49:
  - kind: para
    text: タグファイルってシ
  - kind: para
    text: ンボル検索してジャ
  - kind: para
    text: ンプするだけじゃな
  - kind: para
    text: いの…
  p50:
  - kind: para
    text: おまいは
  - kind: para
    text: それで
  - kind: para
    text: 満足か?
  p51:
  - kind: para
    text: Photoshop
  p52:
  - kind: para
    text: それはそれでいい
  p53:
  - kind: para
    text: 手に馴染んだエディタ
  - kind: para
    text: vs
  - kind: para
    text: 高性能IDE
  p54:
  - kind: para
    text: エディタ選択の自由を守る
  - kind: para
    text: には自分自信がPHPスキル
  - kind: para
    text: を磨き、IDEを選択せずに
  - kind: para
    text: 開発することで損ねないこ
  - kind: para
    text: との証を立てねばならない。
  p55:
  - kind: para
    text: 強いIDEの生産性を凌駕す
  - kind: para
    text: るには、開発者各位がエディ
  - kind: para
    text: タスキルとコーディングス
  - kind: para
    text: キルを磨かなければいけな
  - kind: para
    text: い！！！
  p56:
  - kind: para
    text: ほんとに
  - kind: para
    text: それでいいのか
  p57:
  - kind: para
    text: 精密リファクタは
  - kind: para
    text: PhpStormの独擅場
  p58:
  - kind: para
    text: 圧倒的じゃないか、
  - kind: para
    text: 我が軍は。
  p59:
  - kind: para
    text: 戦力差を
  - kind: para
    text: 埋めよう
  p60:
  - kind: para
    text: PHPStan
  p61: []
  p62:
  - kind: para
    text: 実は、PHPStanは
  - kind: para
    text: 軽いのでインライン
  - kind: para
    text: エラー検査に最適
  p63:
  - kind: para
    text: この検査結果をエディ
  - kind: para
    text: タでインライン表示で
  - kind: para
    text: きれば、だいたい
  - kind: para
    text: PhpStormっぽくなる！
  p64:
