text:
  p1:
  - node: p
    children:
    - node: text
      content: 'WIP:         でインテリジェントなEmacs コーディングPHP2018'
    - node: bold
      content: 'Intelligent PHP coding in Emacs.         '
    - node: text
      content: '2018-06-16 #phpconfuk_rej PHPカンファレンス福岡2018前夜祭リジェクトコン'
  p2:
  - node: p
    children:
    - node: text
      content: 'お前誰ようさみけんた (@tadsan) / Zonu.EXE

        '
    - node: text
      content: 'GitHub/Packagistでは id: zonuexe

        •ピクシブ株式会社 pixiv運営本部

        •Emacs Lisper, PHPer

        •Emacs PHP Modeのメンテナ引き継ぎました

        •好きなリスプはEmacs Lispです

        •Qiitaに記事を書いたり変なコメントしてるよ•'
  p4:
  - node: p
    children:
    - node: text
      content: We are hiring!
  p5:
  - node: p
    children:
    - node: text
      content: 近況報告
  p8:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: はじめにお断り
  p9:
  - node: p
    children:
    - node: text
      content: 私は会社では
    - node: bold
      content: '         '
    - node: text
      content: PhpStormの利用を
    - node: bold
      content: '         '
    - node: text
      content: 推進してます(当然経費で導入)
  p10:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: '今回の発表         現段階はWIP(作業中)'
  p11:
  - node: p
    children:
    - node: text
      content: 対象者
  p12:
  - node: p
    children:
    - node: text
      content: PhpStorm以外で開発したい各位
  p13:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 特に
    - node: bold
      content: '         '
    - node: text
      content: VimmerEmacser
  p14:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: それ以外の
    - node: bold
      content: '         '
    - node: text
      content: エディタ拡張開発者
  p15:
  - node: p
    children:
    - node: text
      content: 改めて
  p16:
  - node: p
    children:
    - node: text
      content: 'WIP:         でインテリジェントなEmacs コーディングPHP2018'
    - node: bold
      content: 'Intelligent PHP coding in Emacs.         '
    - node: text
      content: '2018-06-16 #phpconfuk_rej PHPカンファレンス福岡2018前夜祭リジェクトコン'
  p17:
  - node: p
    children:
    - node: text
      content: みなさん
  p18:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: IDEでコード書いてますか？
  p19:
  - node: p
    children:
    - node: text
      content: PhpStorm?
  p20:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: Vim?Emacs?
  p21:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: Sublime Text?Atom? VSCode?
  p22:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: Eclipse?NetBeans?
  p23:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 秀丸?サクラエディタ?
  p24:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 私はEmacs＼(^o^)／
  p25:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: '理由：僕がハックできるエディタ         がEmacsだから(PhpStormは自由にハックできない)'
  p26:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: これまでのあらすじ
  p28:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 要約：Lispパッケージを入れると、いい感じのナビゲーションができるよ
  p30:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 要約：Emacsは高性能竹槍だぞ
  p32:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: '要約：         PhpStorm最高！いちばん好きなStormです'
  p33:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: エディタくらい好きなの選びたい
  p34:
  - node: p
    children:
    - node: text
      content: 勝つとか負けるとかの話ではない
  p35:
  - node: p
    children:
    - node: text
      content: ' エディタ選択は専門職たるエンジニアの裁量の範疇'
  p36:
  - node: p
    children:
    - node: text
      content: '本当にそれでエラー         を起こさない自信があるならな'
  p37:
  - node: p
    children:
    - node: text
      content: 僕は自信がない
  p38:
  - node: p
    children:
    - node: text
      content: インテリジェントなIDEができること
  p39:
  - node: p
    children:
    - node: text
      content: '         定義ジャンプ         リファクタリング         インラインエラーチェック          - syntax error/ 型の不整合          - 未定義変数/未定義クラス… etc.'
  p40:
  - node: p
    children:
    - node: text
      content: 定義ジャンプ
  p41:
  - node: p
    children:
    - node: text
      content: 高速なコードリーディングには必須
  p42:
  - node: p
    children:
    - node: text
      content: リファクタリング
  p43:
  - node: p
    children:
    - node: text
      content: 効率よく仕様を変更するのに必須
  p44:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: インラインエラーチェック
  p45:
  - node: p
    children:
    - node: text
      content: '文法違反のチェック         ごときに時間をとりたくない'
  p47:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: あなたの
    - node: bold
      content: '         '
    - node: text
      content: エディタはできますか?
  p48:
  - node: p
    children:
    - node: text
      content: '         定義ジャンプ ←タグジャンプ         リファクタリング ← sed         インラインエラーチェック          - syntax error/ 型の不整合          - 未定義変数/未定義クラス… etc. ↑ php -l'
  p49:
  - node: p
    children:
    - node: text
      content: タグファイルってシンボル検索してジャンプするだけじゃないの…
  p50:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: おまいは
    - node: bold
      content: '         '
    - node: text
      content: それで満足か?
  p51:
  - node: p
    children:
    - node: text
      content: Photoshop
  p52:
  - node: p
    children:
    - node: text
      content: それはそれでいい
  p53:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: '手に馴染んだエディタvs

        高性能IDE'
  p54:
  - node: p
    children:
    - node: text
      content: エディタ選択の自由を守るには自分自信がPHPスキルを磨き、IDEを選択せずに開発することで損ねないことの証を立てねばならない。
  p55:
  - node: p
    children:
    - node: text
      content: 強いIDEの生産性を凌駕するには、開発者各位がエディタスキルとコーディングスキルを磨かなければいけない！！！
  p56:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: ほんとにそれでいいのか
  p57:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 精密リファクタはPhpStormの独擅場
  p58:
  - node: p
    children:
    - node: text
      content: 圧倒的じゃないか、我が軍は。
  p59:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 戦力差を埋めよう
  p60:
  - node: p
    children:
    - node: text
      content: PHPStan
  p62:
  - node: p
    children:
    - node: text
      content: 実は、PHPStanは軽いのでインラインエラー検査に最適
  p63:
  - node: p
    children:
    - node: text
      content: この検査結果をエディタでインライン表示できれば、だいたいPhpStormっぽくなる！
  p64:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: PHPStan 0.9.2と
    - node: bold
      content: '         '
    - node: text
      content: 現masterブランチは互換性がないので注意
  p65:
  - node: p
    children:
    - node: text
      content: Phpactor
  p67:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: リファクタリング
    - node: bold
      content: '         '
    - node: text
      content: ＆ナビゲーション・補完
  p68:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: エディタ中立な設計
  p69:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 公式では
    - node: bold
      content: '         '
    - node: text
      content: Vimプラグイン同梱
  p70:
  - node: p
    children:
    - node: text
      content: リファクタリング機能については、まだPhpStormに
    - node: bold
      content: '         '
    - node: text
      content: 匹敵するほどの能力はない(開発中・発展途上)
  p71:
  - node: p
    children:
    - node: text
      content: 現状報告
  p72:
  - node: p
    children:
    - node: text
      content: '         自分で問題解決できる人柱向け'
  p73:
  - node: p
    children:
    - node: text
      content: まだ万人にEmacsを薦められる段階にはなってない
  p74:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: '理由：         プロジェクトごと設定必要         インストールがめんどい'
  p75:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 'インストールめんどい件：まだPharアーカイブでは配         布されてないとかで入れcomposer globalるのが比較的に楽'
  p78:
  - node: p
    children:
    - node: text
      content: そして
  p80:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: この構想については眠くない夜に書きます
  p81:
  - node: p
    children:
    - node: text
      content: いますぐ利用したいEmacsユーザー向け
  p82:
  - node: p
    children:
    - node: text
      content: '         MELPAで         ﬂycheck-phpstan         を入れて、README通りに設定'
  p83:
  - node: p
    children:
    - node: text
      content: '         MELPAで         phpactor         を入れて、設定しcompany-phpactor'
  p84:
  - node: p
    children:
    - node: text
      content: 詳しくは直接聞いてくれ！！
  p85:
  - node: p
    children:
    - node: text
      content: tadsanのやる気をアップさせる方法
  p86:
  - node: p
    children:
    - node: text
      content: やらなきゃいけないことドキュメント化の必要はわかってる…
  p87:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 夜は眠いしやる気が出ない
  p89:
  - node: p
    children:
    - node: text
      content: '         tadsan先生の次回作にご期待ください'
  p90:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 課金は成果を約束するものではございません
  p91:
  - node: p
    children:
    - node: text
      content: あるいは
  p92:
  - node: p
    children:
    - node: text
      content: '         お前が         Emacs Lisperになるんだよ'
