text:
  p1:
  - kind: heading
    level: 1
    text: なぜ2018年にIDEと
  - kind: heading
    level: 1
    text: Emacsを選ぶのか
  - kind: para
    text: Why was IDE and Emacs chosen, now in 2018?
  - kind: para
    text: '2018-02-19 FJCT #techbeerbash'
  - kind: para
    text: Tech Beer Bash 2018 vol.1
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社技術基盤チーム (pixiv.net)
    - Emacs Lisper, PHPer
    - 入社前は自宅警備をしながらRuby書いてた
    - Emacs PHP Modeのメンテナ引き継ぎました
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5: []
  p6:
  - kind: para
    text: アジェンダ
  p7:
  - kind: para
    text: 1. PHPはどんな言語か
  - kind: para
    text: 2. Emacsでなにができるか
  - kind: para
    text: 3. IDEに何を期待するか
  p8:
  - kind: para
    text: はじめに
  - kind: para
    text: 言っておく
  p9:
  - kind: para
    text: 実用的なPHPの
  - kind: para
    text: Emacs環境構築
  p10: []
  p11:
  - kind: para
    text: エディタくらい
  - kind: para
    text: 好きなの選びたい
  p12:
  - kind: para
    text: 勝つとか負けると
  - kind: para
    text: かの話ではない
  p13:
  - kind: para
    text: エディタ選択は
  - kind: para
    text: 専門職たるエンジ
  - kind: para
    text: ニアの裁量の範疇
  p14:
  - kind: para
    text: 本当にそれでエラー
  - kind: para
    text: を起こさない
  - kind: para
    text: 自信があるならな
  p15:
  - kind: para
    text: 僕は自信がない
  p16:
  - kind: heading
    level: 1
    text: pixiv <3 PhpStorm
  - kind: heading
    level: 2
    text: 希望者はIDEのライセンス購入
  - kind: para
    text: (IntelliJ IDEA, RubyMine)
  p17:
  - kind: para
    text: PhpStorm先生は
  - kind: para
    text: お前の先輩よりも
  - kind: para
    text: PHPに詳しい
  p18:
  - kind: para
    text: PhpStorm先生は
  - kind: para
    text: 俺よりもずっと
  - kind: para
    text: PHPに詳しい
  p19:
  - kind: para
    text: いますぐ生産性を
  - kind: para
    text: 上げたいなら素直
  - kind: para
    text: にIDEを買っておけ
  p20:
  - kind: para
    text: IDE(IntelliJ IDEA/PhpStorm)
  - kind: para
    text: のライセンス料は
  - kind: para
    text: 人件費よりずっと安い
  p21:
  - kind: para
    text: 回し者では
  - kind: para
    text: ないので
  - kind: para
    text: 宣伝はこの辺に
  p22:
  - kind: heading
    level: 1
    text: なぜ2018年にIDEと
  - kind: heading
    level: 1
    text: Emacsを選ぶのか
  - kind: para
    text: Why was IDE and Emacs chosen, now in 2018?
  - kind: para
    text: '2018-02-19 FJCT #techbeerbash'
  - kind: para
    text: Tech Beer Bash 2018 vol.1
  p23:
  - kind: para
    text: なぜ
  p24:
  - kind: para
    text: それが僕には
  - kind: para
    text: 楽しかったから
  - kind: para
    text: (Just for Fun)
  p25:
  - kind: para
    text: ほとんど全ての機
  - kind: para
    text: 能をハックできる
  - kind: para
    text: エディタだから
  p26:
  - kind: para
    text: ほとんど全て
  p27:
  - kind: para
    text: 誇張ではない
  p28:
  - kind: para
    text: エディタ機能の
  - kind: para
    text: 多くの部分はLisp
  - kind: para
    text: で実装される
  p29:
  - kind: para
    text: C言語で実装された関
  - kind: para
    text: 数もラップできるし、
  - kind: para
    text: 動的に上書きもできる
  p30:
  - kind: para
    text: Lispの言語の
  - kind: para
    text: 強力さもある
  p31:
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p32:
  - kind: para
    text: https://cruel.org/freeware/hacker.html
  p33:
  - kind: para
    text: 職業エンジニアとして
  - kind: para
    text: の見識を広めるために、
  - kind: para
    text: 見知らぬ言語の見識を
  - kind: para
    text: 深めるのは悪くない
  p34:
  - kind: para
    text: 異質なものに触れて
  - kind: para
    text: 常用する言語を
  - kind: para
    text: 相対化することで
  - kind: para
    text: 得られるものはある
  p35:
  - kind: para
    text: 1. PHPは
  - kind: para
    text: どんな言語か
  p36:
  - kind: para
    text: PHPを書いたこ
  - kind: para
    text: とはありますか？
  p37:
  - kind: para
    text: いろいろな
  - kind: para
    text: コードが書ける
  p38:
  - kind: heading
    level: 1
    text: テンプレートエンジン
  - kind: para
    text: <!DOCTYPE html>
  - kind: para
    text: <html><head><title>Hello, PHP!</title></head>
  - kind: para
    text: <p>
  - kind: para
    text: '<?php if (date(''H'') < 19): ?>'
  - kind: para
    text: こんにちは
  - kind: para
    text: '<?php else: ?>'
  - kind: para
    text: こんばんは
  - kind: para
    text: <?php endif; ?>
  - kind: para
    text: </p>
  - kind: para
    text: <p>今は<?= htmlspecialchars(date('H')) ?>時です</p>
  p39:
  - kind: heading
    level: 1
    text: CGIっぽいスクリプト
  - kind: para
    text: <?php require 'bootstrap.php';
  - kind: para
    text: $db = mysqli_connect();
  - kind: para
    text: $stmt = mysqli_prepare($db, 'SELECT * FROM books');
  - kind: para
    text: mysqli_stmt_execute($stmt);
  - kind: para
    text: print '<h1>本の一覧</h1>';
  - kind: para
    text: print '<ul>';
  - kind: para
    text: foreach ($stmt as $s){
  - kind: para
    text: print '<li>'; print $s->name; print ‘</li>';
  - kind: para
    text: '}'
  - kind: para
    text: print '</ul>';
  p40:
  - kind: heading
    level: 1
    text: クラスベースOOP
  - kind: para
    text: <?php
  - kind: para
    text: namespace MyApp\Controller;
  - kind: para
    text: class BooksController extends BaseController{
  - kind: para
    text: public function index() {
  - kind: para
    text: $books = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p41:
  - kind: para
    text: (当然ながら)
  - kind: para
    text: Webアプリに多用
  - kind: para
    text: される言語
  p42:
  - kind: para
    text: なんとなくPerlっぽさ(変
  - kind: para
    text: 数に$)があり、PHP5では
  - kind: para
    text: ちょっとJavaっぽい
  - kind: para
    text: 見ためのOOPが入ってる
  p43:
  - kind: para
    text: むかしながらの
  - kind: para
    text: おてがるCGIっ
  - kind: para
    text: ぽいスクリプト
  p44:
  - kind: para
    text: フレームワークを
  - kind: para
    text: 利用した階層構造
  - kind: para
    text: アプリケーション
  p45:
  - kind: para
    text: どちらもできる
  - kind: para
    text: のがPHP
  p46: []
  p47:
  - kind: para
    text: ちゃんとした
  - kind: para
    text: パッケージマネー
  - kind: para
    text: ジャがある
  p48: []
  p49:
  - kind: para
    text: Composer
  - kind: para
    text: npm, Bundlerのよ
  - kind: para
    text: うなもの
  p50:
  - kind: para
    text: 動的型検査
  p51:
  - kind: para
    text: 変数の型は
  - kind: para
    text: 実行時まで
  - kind: para
    text: わからない
  p52:
  - kind: para
    text: 型宣言がある
  p53:
  - kind: heading
    level: 1
    text: 関数の型注釈 (従来から可能)
  - kind: para
    text: <?php
  - kind: para
    text: /**
  - kind: para
    text: '* @param float $height'
  - kind: para
    text: '* @param float $top'
  - kind: para
    text: '* @param float $bottom'
  - kind: para
    text: '* @return float'
  - kind: para
    text: '*/'
  - kind: para
    text: function trapezoid($height, $top, $bottom) {
  - kind: para
    text: return (($top + $bottom) / 2) * $height;
  - kind: para
    text: '}'
  p54:
  - kind: heading
    level: 1
    text: 関数の型宣言 (PHP7から可能)
  - kind: para
    text: <?php
  - kind: para
    text: function trapezoid(float $height,
  - kind: para
    text: 'float $top, float $bottom): float'
  - kind: para
    text: '{'
  - kind: para
    text: return (($top + $bottom) / 2) * $height;
  - kind: para
    text: '}'
  p55:
  - kind: para
    text: JavaScript,Python,
  - kind: para
    text: Rubyなどと並ぶ動的
  - kind: para
    text: プログラミング言語
  p56:
  - kind: para
    text: 2018年現在おそらく唯一まともに
  - kind: para
    text: PHPの型について書いてある紙(雑誌)
  p57:
  - kind: para
    text: PHPはオープンクラス(モン
  - kind: para
    text: キーパッチ)はないので、クラ
  - kind: para
    text: スが実行時に拡張されるこ
  - kind: para
    text: とはあまり考えなくてよい
  p58:
  - kind: heading
    level: 1
    text: PSR
  - kind: para
    text: PHP標準勧告
  p59:
  - kind: para
    text: 本来のPHPは
  - kind: para
    text: カオスなCGI
  p60:
  - kind: para
    text: フレームワークでオブジェ
  - kind: para
    text: クトを相互運用できる
  - kind: para
    text: ようにするための足枷
  p61:
  - kind: para
    text: 実行環境
  p62:
  - kind: para
    text: たいてい本番運用環境
  - kind: para
    text: (GNU/Linux,まれにFreeBSD)
  - kind: para
    text: と開発環境(Mac, Windows,
  - kind: para
    text: デスクトップLinux)は異なる
  p63:
  - kind: para
    text: 2. IDEに何を
  - kind: para
    text: 期待するか
  p64:
  - kind: para
    text: PhpStormはPHPのコンパイラ、
  - kind: para
    text: 黄色いやつはゆるさない
  - kind: para
    text: '@tanakahisateru said...'
  p65:
  - kind: para
    text: https://twitter.com/t_wada/status/819379053530529792
  p66:
  - kind: para
    text: 精度の高い
  - kind: para
    text: 静的解析と型推論
  p67:
  - kind: para
    text: それに裏打ちされた、
  - kind: para
    text: 入力補完(メソッド/プロパティ)、定
  - kind: para
    text: 義ジャンプ、未定義検出、型エ
  - kind: para
    text: ラー検出、リファクタリング、
  - kind: para
    text: etc, etc...
  p68:
  - kind: para
    text: 大事なことは
  p69:
  - kind: para
    text: 自分の誤ちに
  - kind: para
    text: すぐに気付ける
  - kind: para
    text: こと
  p70:
  - kind: para
    text: 黄色いやつ
  p71:
  - kind: para
    text: 黄色いやつ
  - kind: para
    text: 黄色いやつ
  p72: []
  p73:
  - kind: para
    text: 次にすることを
  - kind: para
    text: 示してくれること
  p74:
  - kind: para
    text: Guzzle(HTTPクライアント)でリクエストする
  p75:
  - kind: para
    text: レスポンス得たい
  - kind: para
    text: 次にどうする？
  p76:
  - kind: para
    text: ソースコードを読む
  - kind: para
    text: ドキュメントを探す？
  p77: []
  p78:
  - kind: para
    text: 動的言語であっても、
  - kind: para
    text: 強力な静的解析機能で
  - kind: para
    text: サポートしてくれるの
  - kind: para
    text: が理想的なIDE
  p79:
  - kind: para
    text: カオスなPHPを
  - kind: para
    text: 御するために
  - kind: para
    text: IDEは強大な助け
  p80:
  - kind: para
    text: 3. Emacsで
  - kind: para
    text: 何ができるか
  p81: []
  p82: []
  p83:
  - kind: para
    text: さて
  p84:
  - kind: para
    text: いまどき
  - kind: para
    text: Emacs？
  p85: []
  p86:
  - kind: para
    text: 要約すると
  p87:
  - kind: para
    text: Emacsの強さは拡張性
  - kind: para
    text: であり、基本機能は
  - kind: para
    text: 残念ながらそれほど強
  - kind: para
    text: くはない
  p88:
  - kind: para
    text: いまどきテキストエディ
  - kind: para
    text: タでIDEに対抗しよう
  - kind: para
    text: とすることは、竹槍で
  - kind: para
    text: 戦闘機に対抗しようと
  - kind: para
    text: することに等しい
  p89:
  - kind: para
    text: 端末でSSHでログインし
  - kind: para
    text: た先の鯖でも動作する、
  - kind: para
    text: といったメリットはある
  p90:
  - kind: para
    text: (これは開発よりはインフ
  - kind: para
    text: ラのサーバオペレーショ
  - kind: para
    text: ン寄りの需要ではある)
  p91:
  - kind: para
    text: 逆に「Emacsはターミナ
  - kind: para
    text: ルで動かすもの」と誤解
  - kind: para
    text: があるかもしれない
  p92:
  - kind: para
    text: 逆に「Emacsはターミナ
  - kind: para
    text: ルで動かすもの」と誤解
  - kind: para
    text: があるかもしれない
  p93: []
  p94: []
  p95:
  - kind: para
    text: ほかのツールを
  - kind: para
    text: 組み合せることで
  - kind: para
    text: 匹敵する機能を持たせ
  - kind: para
    text: ることはできる
  p96:
  - kind: para
    text: しかし
  p97:
  - kind: para
    text: 現時点で残念ながら
  - kind: para
    text: 選ぶ・組み合せるの
  - kind: para
    text: 概念から抜け出せない
  p98:
  - kind: para
    text: PhpStormには
  - kind: para
    text: 埋められない
  - kind: para
    text: 不満もある
  p99:
  - kind: para
    text: PhpStormユーザは
  - kind: para
    text: 「設定」しかできないが、
  - kind: para
    text: Emacsはいつでも
  - kind: para
    text: 自分で「実装」できる
  p100:
  - kind: para
    text: まとめ
  p101:
  - kind: para
    text: すぐに強力な開
  - kind: para
    text: 発環境が欲しい
  - kind: para
    text: なら商用IDE
  p102:
  - kind: para
    text: 環境をハックし
  - kind: para
    text: て自分を前進さ
  - kind: para
    text: せながらEmacs
  p103:
  - kind: para
    text: 両方使ってもいい
  p104:
  - kind: para
    text: プロとしての
  - kind: para
    text: 道具を選ぼう
  p105:
  - kind: para
    text: 残念ながらEmacs
  - kind: para
    text: は贔屓目に見て
  - kind: para
    text: 非力
  p106:
  - kind: para
    text: それはそれとして
  - kind: para
    text: Emacsをハック
  - kind: para
    text: するのは楽しい
  p107:
  - kind: para
    text: 自分といっしょに
  - kind: para
    text: 強くなれる
  p108:
  - kind: para
    text: そんなわけでいろ
  - kind: para
    text: いろ作ってきた
