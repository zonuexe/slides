text:
  p1:
  - kind: heading
    level: 1
    text: なぜ2018年にIDEと
  - kind: heading
    level: 1
    text: Emacsを選ぶのか
  - kind: para
    text: Why was IDE and Emacs chosen, now in 2018?
  - kind: para
    text: '2018-02-19 FJCT #techbeerbash'
  - kind: para
    text: Tech Beer Bash 2018 vol.1
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社技術基盤チーム (pixiv.net)
    - Emacs Lisper, PHPer
    - 入社前は自宅警備をしながらRuby書いてた
    - Emacs PHP Modeのメンテナ引き継ぎました
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5: []
  p6:
  - kind: para
    text: アジェンダ
  p7:
  - kind: para
    text: 1. PHPはどんな言語か2. Emacsでなにができるか3. IDEに何を期待するか
  p8:
  - kind: para
    text: はじめに言っておく
  p9:
  - kind: para
    text: 実用的なPHPのEmacs環境構築
  p10: []
  p11:
  - kind: para
    text: エディタくらい好きなの選びたい
  p12:
  - kind: para
    text: 勝つとか負けるとかの話ではない
  p13:
  - kind: para
    text: エディタ選択は専門職たるエンジニアの裁量の範疇
  p14:
  - kind: para
    text: 本当にそれでエラーを起こさない自信があるならな
  p15:
  - kind: para
    text: 僕は自信がない
  p16:
  - kind: heading
    level: 1
    text: pixiv <3 PhpStorm
  - kind: heading
    level: 2
    text: 希望者はIDEのライセンス購入
  - kind: para
    text: (IntelliJ IDEA, RubyMine)
  p17:
  - kind: para
    text: PhpStorm先生はお前の先輩よりもPHPに詳しい
  p18:
  - kind: para
    text: PhpStorm先生は俺よりもずっとPHPに詳しい
  p19:
  - kind: para
    text: いますぐ生産性を上げたいなら素直にIDEを買っておけ
  p20:
  - kind: para
    text: IDE(IntelliJ IDEA/PhpStorm)のライセンス料は人件費よりずっと安い
  p21:
  - kind: para
    text: 回し者ではないので宣伝はこの辺に
  p22:
  - kind: heading
    level: 1
    text: なぜ2018年にIDEと
  - kind: heading
    level: 1
    text: Emacsを選ぶのか
  - kind: para
    text: Why was IDE and Emacs chosen, now in 2018?
  - kind: para
    text: '2018-02-19 FJCT #techbeerbash'
  - kind: para
    text: Tech Beer Bash 2018 vol.1
  p23:
  - kind: para
    text: なぜ
  p24:
  - kind: para
    text: それが僕には楽しかったから
  - kind: para
    text: (Just for Fun)
  p25:
  - kind: para
    text: ほとんど全ての機能をハックできるエディタだから
  p26:
  - kind: para
    text: ほとんど全て
  p27:
  - kind: para
    text: 誇張ではない
  p28:
  - kind: para
    text: エディタ機能の多くの部分はLispで実装される
  p29:
  - kind: para
    text: C言語で実装された関数もラップできるし、動的に上書きもできる
  p30:
  - kind: para
    text: Lispの言語の強力さもある
  p31:
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p32:
  - kind: para
    text: https://cruel.org/freeware/hacker.html
  p33:
  - kind: para
    text: 職業エンジニアとしての見識を広めるために、見知らぬ言語の見識を深めるのは悪くない
  p34:
  - kind: para
    text: 異質なものに触れて常用する言語を相対化することで得られるものはある
  p35:
  - kind: para
    text: 1. PHPはどんな言語か
  p36:
  - kind: para
    text: PHPを書いたことはありますか？
  p37:
  - kind: para
    text: いろいろなコードが書ける
  p38:
  - kind: heading
    level: 1
    text: テンプレートエンジン
  - kind: para
    text: '<!DOCTYPE html><html><head><title>Hello, PHP!</title></head><p><?php if
      (date(''H'') < 19): ?>こんにちは<?php else: ?>こんばんは<?php endif; ?></p><p>今は<?= htmlspecialchars(date(''H''))
      ?>時です</p>'
  p39:
  - kind: heading
    level: 1
    text: CGIっぽいスクリプト
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s){print '<li>'; print $s->name; print ‘</li>';}print
      '</ul>';
  p40:
  - kind: heading
    level: 1
    text: クラスベースOOP
  - kind: para
    text: <?php namespace MyApp\Controller;class BooksController extends BaseController{public
      function index() {$books = Books::getAll();$this->render(compact("books"));}}
  p41:
  - kind: para
    text: (当然ながら)Webアプリに多用される言語
  p42:
  - kind: para
    text: なんとなくPerlっぽさ(変数に$)があり、PHP5ではちょっとJavaっぽい見ためのOOPが入ってる
  p43:
  - kind: para
    text: むかしながらのおてがるCGIっぽいスクリプト
  p44:
  - kind: para
    text: フレームワークを利用した階層構造アプリケーション
  p45:
  - kind: para
    text: どちらもできるのがPHP
  p46: []
  p47:
  - kind: para
    text: ちゃんとしたパッケージマネージャがある
  p48: []
  p49:
  - kind: para
    text: Composer npm, Bundlerのようなもの
  p50:
  - kind: para
    text: 動的型検査
  p51:
  - kind: para
    text: 変数の型は実行時までわからない
  p52:
  - kind: para
    text: 型宣言がある
  p53:
  - kind: heading
    level: 1
    text: 関数の型注釈 (従来から可能)
  - kind: para
    text: <?php/*** @param float $height* @param float $top* @param float $bottom*
      @return float*/function trapezoid($height, $top, $bottom) {return (($top + $bottom)
      / 2) * $height;}
  p54:
  - kind: heading
    level: 1
    text: 関数の型宣言 (PHP7から可能)
  - kind: para
    text: '<?php function trapezoid(float $height,float $top, float $bottom): float{return
      (($top + $bottom) / 2) * $height;}'
  p55:
  - kind: para
    text: JavaScript,Python,Rubyなどと並ぶ動的プログラミング言語
  p56:
  - kind: para
    text: 2018年現在おそらく唯一まともにPHPの型について書いてある紙(雑誌)
  p57:
  - kind: para
    text: PHPはオープンクラス(モンキーパッチ)はないので、クラスが実行時に拡張されることはあまり考えなくてよい
  p58:
  - kind: heading
    level: 1
    text: PSR
  - kind: para
    text: PHP標準勧告
  p59:
  - kind: para
    text: 本来のPHPはカオスなCGI
  p60:
  - kind: para
    text: フレームワークでオブジェクトを相互運用できるようにするための足枷
  p61:
  - kind: para
    text: 実行環境
  p62:
  - kind: para
    text: たいてい本番運用環境(GNU/Linux,まれにFreeBSD)と開発環境(Mac, Windows,デスクトップLinux)は異なる
  p63:
  - kind: para
    text: 2. IDEに何を
  - kind: para
    text: 期待するか
  p64:
  - kind: para
    text: PhpStormはPHPのコンパイラ、
  - kind: para
    text: 黄色いやつはゆるさない
  - kind: para
    text: '@tanakahisateru said...'
  p65:
  - kind: para
    text: https://twitter.com/t_wada/status/819379053530529792
  p66:
  - kind: para
    text: 精度の高い静的解析と型推論
  p67:
  - kind: para
    text: それに裏打ちされた、入力補完(メソッド/プロパティ)、定義ジャンプ、未定義検出、型エラー検出、リファクタリング、etc, etc...
  p68:
  - kind: para
    text: 大事なことは
  p69:
  - kind: para
    text: 自分の誤ちにすぐに気付けること
  p70:
  - kind: para
    text: 黄色いやつ
  p71:
  - kind: para
    text: 黄色いやつ
  - kind: para
    text: 黄色いやつ
  p72: []
  p73:
  - kind: para
    text: 次にすることを示してくれること
  p74:
  - kind: para
    text: Guzzle(HTTPクライアント)でリクエストする
  p75:
  - kind: para
    text: レスポンス得たい次にどうする？
  p76:
  - kind: para
    text: ソースコードを読むドキュメントを探す？
  p77: []
  p78:
  - kind: para
    text: 動的言語であっても、強力な静的解析機能でサポートしてくれるのが理想的なIDE
  p79:
  - kind: para
    text: カオスなPHPを御するためにIDEは強大な助け
  p80:
  - kind: para
    text: 3. Emacsで何ができるか
  p81: []
  p82: []
  p83:
  - kind: para
    text: さて
  p84:
  - kind: para
    text: いまどきEmacs？
  p85: []
  p86:
  - kind: para
    text: 要約すると
  p87:
  - kind: para
    text: Emacsの強さは拡張性であり、基本機能は残念ながらそれほど強くはない
  p88:
  - kind: para
    text: いまどきテキストエディタでIDEに対抗しようとすることは、竹槍で戦闘機に対抗しようとすることに等しい
  p89:
  - kind: para
    text: 端末でSSHでログインした先の鯖でも動作する、といったメリットはある
  p90:
  - kind: para
    text: (これは開発よりはインフラのサーバオペレーション寄りの需要ではある)
  p91:
  - kind: para
    text: 逆に「Emacsはターミナルで動かすもの」と誤解があるかもしれない
  p92:
  - kind: para
    text: 逆に「Emacsはターミナルで動かすもの」と誤解があるかもしれない
  p93: []
  p94: []
  p95:
  - kind: para
    text: ほかのツールを組み合せることで匹敵する機能を持たせることはできる
  p96:
  - kind: para
    text: しかし
  p97:
  - kind: para
    text: 現時点で残念ながら選ぶ・組み合せるの概念から抜け出せない
  p98:
  - kind: para
    text: PhpStormには埋められない不満もある
  p99:
  - kind: para
    text: PhpStormユーザは「設定」しかできないが、Emacsはいつでも自分で「実装」できる
  p100:
  - kind: para
    text: まとめ
  p101:
  - kind: para
    text: すぐに強力な開発環境が欲しいなら商用IDE
  p102:
  - kind: para
    text: 環境をハックして自分を前進させながらEmacs
  p103:
  - kind: para
    text: 両方使ってもいい
  p104:
  - kind: para
    text: プロとしての道具を選ぼう
  p105:
  - kind: para
    text: 残念ながらEmacsは贔屓目に見て非力
  p106:
  - kind: para
    text: それはそれとしてEmacsをハックするのは楽しい
  p107:
  - kind: para
    text: 自分といっしょに強くなれる
  p108:
  - kind: para
    text: そんなわけでいろいろ作ってきた
  p109: []
  p110: []
  p111: []
  p112: []
  p113: []
  p114:
  - kind: para
    text: tadsan先生の次回作にご期待ください
  p115:
  - kind: para
    text: お前がEmacs Lisperになるんだよ
