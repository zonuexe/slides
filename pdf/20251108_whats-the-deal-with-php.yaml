  p25:
    - node: p
      children:
        - node: text
          content: CGIとは何か
    - node: p
      children:
        - node: text
          content: •   Common Gateway Interfaceの略、1993年頃に登場
    - node: p
      children:
        - node: text
          content: • HTTPサーバを独自実装しなくても、シンプルなスクリプトを書くだけで
    - node: p
      children:
        - node: text
          content: 動的ページを実現できる
    - node: p
      children:
        - node: text
          content: • ユーザーからリクエストが来る度にプロセスを起動する
    - node: p
      children:
        - node: text
          content: • シェアードナッシング (並行して処理するリクエストと干渉しない)
    - node: p
      children:
        - node: text
          content: '25'
  p26:
    - node: p
      children:
        - node: text
          content: CGIとプログラミング言語
    - node: p
      children:
        - node: text
          content: • 仕様上、標準入出力(stdio)と環境変数が使える言語ならなんでもいい
    - node: p
      children:
        - node: text
          content: • 開発の利便性などから、Perlスクリプトが普及した
    - node: p
      children:
        - node: text
          content: • 文字列処理のしやすさ、正規表現、cgi-lib.pl、言語としての書き心地…
    - node: p
      children:
        - node: text
          content: • C言語での文字列処理は本質的に難しい
    - node: p
      children:
        - node: text
          content: • ラスマスが重要視したのはそこではなかった
    - node: p
      children:
        - node: text
          content: • パフォーマンス、HTMLとSQLとの統合…
    - node: p
      children:
        - node: text
          content: '26'
  p27:
    - node: p
      children:
        - node: text
          content: '27'
  p28:
    - node: p
      children:
        - node: text
          content: Rasmusは何をしたか (〜1995年くらい)
    - node: p
      children:
        - node: text
          content: • パフォーマンスのため、C言語でCGIを書いた
    - node: p
      children:
        - node: text
          content: • 自分で書いたCGIツールに「PHP」という名前をつけた
    - node: p
      children:
        - node: text
          content: • CGIをやめ、Apache HTTP Serverのモジュール化した
    - node: p
      children:
        - node: text
          content: • ソースコードごとフリーソフトウェアとして公開した
    - node: p
      children:
        - node: text
          content: • Perl, Apacheなどの先例はあるが、「オープンソース」ブーム前
    - node: p
      children:
        - node: text
          content: '28'
  p29:
    - node: p
      children:
        - node: text
          content: 1993年時点で存在したデータベースソフトウェア。
    - node: p
      children:
        - node: text
          content: フリーソフトウェアではないがソースコードが
    - node: p
      children:
        - node: text
          content: 公開されていて、MySQLなどに影響を及ぼした。
    - node: p
      children:
        - node: text
          content: '29'
