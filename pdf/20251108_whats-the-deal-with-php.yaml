  p41:
  - kind: para
    text: Q. つまりPHPって何だったの？
  p42:
  - kind: para
    text: A. 異常に行動力があるRasmusさんが自分のためにPHPを作って、何回か書き直した後に利己的な動機でソースコード公開したら世界的に開発が盛り上がっちゃった
  p43: []
  p44:
  - kind: para
    text: PHPはWebに何をもたらしたか
  - kind: list
    items:
    - HTMLテンプレート (HTML内に制御構造や変数展開)
    - JSP(Java), eRuby/ERBなどのHTMLテンプレートに影響
    - それ以前は print "<div>Hello</div>"; のようなコード
    - CGIの代替としてのサーバーモジュール組み込みと開発者体験
    - 現代ではコンパイルが必要な言語でも「ホットリロード」が普及
    - フリーソフトウェアとして公開された言語(の先行事例のひとつ)
  p45:
  - kind: para
    text: 第2部Webフレームワークの中世期断絶
  p46:
  - kind: para
    text: あるいは幼年期の終わり
  p47:
  - kind: para
    text: コードを書くと何らかの単位で抽象化したくなる
  p48:
  - kind: para
    text: コードが増えるとバグも増える
  p49:
  - kind: para
    text: コードが減ればバグも減る
  p50:
  - kind: para
    text: ライブラリ化フレームワーク化
  - kind: para
    text: レイヤー化
  p51:
  - kind: para
    text: ライブラリ化
  - kind: list
    items:
    - 処理を関数やクラスの形でまとめて呼び出せるようにする
    - ある人曰く「PHPの関数の数は、人間がWebでやりたいことの数」であると
    - 完全に同意するわけではないが、本質の一面を捉えていると思う
    - PHPの関数は外付けのライブラリに留まらず、HTTPをネイティブサポート
    - これは良し悪しあるが、セキュリティに関しては単なるCGIライブラリでは実
  - kind: para
    text: 現できないレベルでヘッダインジェクションの対策ができる
  p52:
  - kind: heading
    level: 1
    text: フレームワーク化
  - kind: list
    items:
    - ライブラリとの最も明確な違いは「制御の反転」
    - あなたはコードを書いてライブラリ関数を呼び出す
    - フレームワークはあなたの書いたコードを呼び出す
    - どのような規則でコードを実行するかはフレームワークの性質による
    - Webフレームワークはユーザーのリクエストによって対象を起動
    - テストフレームワークはディレクトリやファイル名によって対象を起動
  p53:
  - kind: heading
    level: 1
    text: レイヤー化
  - kind: list
    items:
    - 処理を「層(レイヤー)」に分けて整理する
    - これにはさまざまな観点がある：
    - MVC (Model-View-Controller)
    - 3層アーキテクチャ、Ports and Adapters(クリーンアーキテクチャ)
    - HTTPインフラとロジックの分離
  p54:
  - kind: para
    text: HTTP層のレイヤー化
  - kind: list
    items:
    - PHPはHTTP機能を言語が直接サポートする(Server API)
    - mod_php, php-fpm, cgi, cliなどがあるが、あまり意識の必要がない
    - 他言語では従来のCGIスクリプトは廃れて、サーバとアプリケーションを
  - kind: para
    text: 分離するインターフェイスを定める方向にシフトした
  - kind: list
    items:
    - Python=WSGI, Ruby=Rack, Perl=PSGI
    - GoやNode.jsも標準でHTTPサーバをバンドルしている
  p55:
  - kind: heading
    level: 1
    text: Ruby on Railsの登場
  - kind: list
    items:
    - Webフレームワーク界の風雲児・フルスタックフレームワーク
    - CoC (設定より規約)： 重厚な設定が必要なFWのアンチテーゼ
  - kind: para
    text: 設定を書かなくても慣習通りに配置すれば勝手に呼び出してくれる
  - kind: list
    items:
    - '多数の高機能な組み込みライブラリ:'
  - kind: para
    text: O/Rマッパー、ルーター/URLヘルパー、
  - kind: list
    items:
    - 積極的なコード生成(スキャフォルディング)：
  - kind: para
    text: 最初期は「15分でブログを作れる」と宣伝された (2005年)
  p56:
  - kind: heading
    level: 1
    text: RubyにとってRailsは何を変えたか
  - kind: list
    items:
    - Rails 1.0は独自のHTTPレイヤーで実装されていた
    - 現代のRails(Rack)アプリケーションをCGIで実行することは可能だが、
  - kind: para
    text: オーバーヘッドが大きい
  - kind: list
    items:
    - CGI時代のRubyスクリプトと、RailsのControllerクラスの実装は
  - kind: para
    text: 互換性がない
  - kind: list
    items:
    - 「コード書き直し」 or 「捨てる」の二択を迫られる
  p57:
  - kind: heading
    level: 1
    text: PerlとHTTPレイヤー
  - kind: list
    items:
    - 2000年代まで「WebアプリといえばPerlでCGI」という感じだった
    - SNS以前はKENT WEBの掲示板やチャットをレンタルサーバーに置いて
  - kind: para
    text: コミュニケーションをとっていた時代もあった
  - kind: list
    items:
    - CGI時代のPerlスクリプトと、業務で開発するPerlアプリケーションの
  - kind: para
    text: 世界は分たれてしまった…
  p58:
  - kind: heading
    level: 1
    text: PHP界への余波
  - kind: list
    items:
    - 2004年を画期として、「フレームワーク」というものの見方が変わった
    - CakePHPは当時の機能で再現可能な範囲で最大限Railsを模倣している
    - ルーティングすら書かなくてもコントローラーが呼ばれる(!)
    - GET /users → UserController::index()
    - さらに後発のフレームワーク(Laravelなど)は、Rails風の便利さは
  - kind: para
    text: 残しつつも明示的に設定させることでコードの追いやすさを意識
  p59:
  - kind: para
    text: /data/www/www.pixiv.net (document root)├── index.php├── novel│ └── show.php├──
      yyy.php└── zzz.php
  p60:
  - kind: para
    text: NovelController#show
  - kind: para
    text: '# routes.rb get ''/'', to: ''index''get ''/n/:id'', to: ''novel#show''get
      ''/u/:id'', to: ''user#show''get ''/yyy'', to: ''yyy''get ''/zzz'', to: ''zzz'''
  p61:
  - kind: para
    text: PHPにとってのFW
  - kind: list
    items:
    - RailsアプリケーションはControllerを書かないと、そもそも実行されない
    - PHPにとってのフレームワークは、便利ライブラリ集と見分けがつかない
    - あるいは、お行儀よいアプリケーションを書くための拘束具に過ぎない
    - Controllerで setcookie() や header() 関数も動く(!)
    - そんなことをするとユニットテストが書けなくなってしまう！
    - PHP自体は依然としてCGI時代と地続き
  p62:
  - kind: para
    text: PHP以外はCGI時代との分断・断絶を経験
  p63:
  - kind: para
    text: PHPはFWが一般化後も断絶を経験してない
  p64:
  - kind: para
    text: ここまでは過去の栄光
  p65:
