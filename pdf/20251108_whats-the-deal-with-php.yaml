  p50:
    - node: p
      children:
        - node: text
          content: ライブラリ化
    - node: p
      children:
        - node: text
          content: フレームワーク化
    - node: p
      children:
        - node: text
          content: レイヤー化
    - node: p
      children:
        - node: text
          content: '50'
  p51:
    - node: p
      children:
        - node: text
          content: ライブラリ化
    - node: p
      children:
        - node: text
          content: •   処理を関数やクラスの形でまとめて呼び出せるようにする
    - node: p
      children:
        - node: text
          content: • ある人曰く「PHPの関数の数は、人間がWebでやりたいことの数」であると
    - node: p
      children:
        - node: text
          content: • 完全に同意するわけではないが、本質の一面を捉えていると思う
    - node: p
      children:
        - node: text
          content: •   PHPの関数は外付けのライブラリに留まらず、HTTPをネイティブサポート
    - node: p
      children:
        - node: text
          content: • これは良し悪しあるが、セキュリティに関しては単なるCGIライブラリでは実
    - node: p
      children:
        - node: text
          content: 現できないレベルでヘッダインジェクションの対策ができる
    - node: p
      children:
        - node: text
          content: '51'
  p52:
    - node: p
      children:
        - node: text
          content: フレームワーク化
    - node: p
      children:
        - node: text
          content: •   ライブラリとの最も明確な違いは「制御の反転」
    - node: p
      children:
        - node: text
          content: • あなたはコードを書いてライブラリ関数を呼び出す
    - node: p
      children:
        - node: text
          content: • フレームワークはあなたの書いたコードを呼び出す
    - node: p
      children:
        - node: text
          content: •   どのような規則でコードを実行するかはフレームワークの性質による
    - node: p
      children:
        - node: text
          content: • Webフレームワークはユーザーのリクエストによって対象を起動
    - node: p
      children:
        - node: text
          content: • テストフレームワークはディレクトリやファイル名によって対象を起動
    - node: p
      children:
        - node: text
          content: '52'
  p53:
    - node: p
      children:
        - node: text
          content: レイヤー化
    - node: p
      children:
        - node: text
          content: •処理を「層(レイヤー)」に分けて整理する
    - node: p
      children:
        - node: text
          content: • これにはさまざまな観点がある：
    - node: p
      children:
        - node: text
          content: • MVC (Model-View-Controller)
    - node: p
      children:
        - node: text
          content: • 3層アーキテクチャ、Ports and Adapters(クリーンアーキテクチャ)
    - node: p
      children:
        - node: text
          content: • HTTPインフラとロジックの分離
    - node: p
      children:
        - node: text
          content: '53'
  p54:
    - node: p
      children:
        - node: text
          content: HTTP層のレイヤー化
    - node: p
      children:
        - node: text
          content: •   PHPはHTTP機能を言語が直接サポートする(Server API)
    - node: p
      children:
        - node: text
          content: • mod_php, php-fpm, cgi, cliなどがあるが、あまり意識の必要がない
    - node: p
      children:
        - node: text
          content: •   他言語では従来のCGIスクリプトは廃れて、サーバとアプリケーションを
    - node: p
      children:
        - node: text
          content: 分離するインターフェイスを定める方向にシフトした
    - node: p
      children:
        - node: text
          content: • Python=WSGI, Ruby=Rack, Perl=PSGI
    - node: p
      children:
        - node: text
          content: •   GoやNode.jsも標準でHTTPサーバをバンドルしている
    - node: p
      children:
        - node: text
          content: '54'
  p55:
    - node: p
      children:
        - node: text
          content: Ruby on Railsの登場
    - node: p
      children:
        - node: text
          content: •   Webフレームワーク界の風雲児・フルスタックフレームワーク
    - node: p
      children:
        - node: text
          content: • CoC (設定より規約)： 重厚な設定が必要なFWのアンチテーゼ
    - node: p
      children:
        - node: text
          content: 設定を書かなくても慣習通りに配置すれば勝手に呼び出してくれる
    - node: p
      children:
        - node: text
          content: '• 多数の高機能な組み込みライブラリ:'
    - node: p
      children:
        - node: text
          content: O/Rマッパー、ルーター/URLヘルパー、
    - node: p
