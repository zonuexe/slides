  p25:
  - node: p
    children:
    - node: text
      content: CGIとは何か
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Common Gateway Interfaceの略、1993年頃に登場
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: HTTPサーバを独自実装しなくても、シンプルなスクリプトを書くだけで
          - node: br
          - node: text
            content: '動的ページを実現できる '
        - node: li
          children:
          - node: text
            content: ユーザーからリクエストが来る度にプロセスを起動する
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: シェアードナッシング (並行して処理するリクエストと干渉しない)
  p26:
  - node: p
    children:
    - node: text
      content: CGIとプログラミング言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 仕様上、標準入出力(stdio)と環境変数が使える言語ならなんでもいい
    - node: li
      children:
      - node: text
        content: 開発の利便性などから、Perlスクリプトが普及した
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 文字列処理のしやすさ、正規表現、cgi-lib.pl、言語としての書き心地…
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: C言語での文字列処理は本質的に難しい
    - node: li
      children:
      - node: text
        content: ラスマスが重要視したのはそこではなかった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: パフォーマンス、HTMLとSQLとの統合…
  p27: []
  p28:
  - node: p
    children:
    - node: text
      content: Rasmusは何をしたか
  - node: p
    children:
    - node: text
      content: ' (〜1995年くらい)'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: パフォーマンスのため、C言語でCGIを書いた
    - node: li
      children:
      - node: text
        content: 自分で書いたCGIツールに「PHP」という名前をつけた
    - node: li
      children:
      - node: text
        content: CGIをやめ、Apache HTTP Serverのモジュール化した
    - node: li
      children:
      - node: text
        content: ソースコードごとフリーソフトウェアとして公開した
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Perl, Apacheなどの先例はあるが、「オープンソース」ブーム前
  p29:
  - node: p
    children:
    - node: text
      content: '1993年時点で存在したデータベースソフトウェア。 '
    - node: br
    - node: text
      content: 'フリーソフトウェアではないがソースコードが '
    - node: br
    - node: text
      content: 公開されていて、MySQLなどに影響を及ぼした。
  p30: []
  p31: []
  p32: []
  p33: []
  p34: []
  p35: []
  p36: []
  p37: []
  p38: []
  p39: []
  p40: []
  p41:
  - node: p
    children:
    - node: text
      content: 'Q. つまりPHPって '
    - node: br
    - node: text
      content: 何だったの？
  p42:
  - node: p
    children:
    - node: text
      content: 'A. '
  - node: p
    children:
    - node: text
      content: 異常に行動力があるRasmus
    - node: br
    - node: text
      content: さんが自分のためにPHPを作っ て、何回か書き直した後に利己的 な動機でソースコード公開したら 世界的に開発が盛り上がっちゃった
  p43: []
  p44:
  - node: p
    children:
    - node: text
      content: PHPはWebに何をもたらしたか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: HTMLテンプレート (HTML内に制御構造や変数展開)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: JSP(Java), eRuby/ERBなどのHTMLテンプレートに影響
        - node: li
          children:
          - node: text
            content: それ以前は print "<div>Hello</div>"; のようなコード
    - node: li
      children:
      - node: text
        content: CGIの代替としてのサーバーモジュール組み込みと開発者体験
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 現代ではコンパイルが必要な言語でも「ホットリロード」が普及
    - node: li
      children:
      - node: text
        content: フリーソフトウェアとして公開された言語(の先行事例のひとつ)
  p45:
  - node: p
    children:
    - node: text
      content: '第2部 '
    - node: br
    - node: text
      content: 'Webフレームワークの '
    - node: br
    - node: text
      content: 中世期断絶
  p46:
  - node: p
    children:
    - node: text
      content: 'あるいは '
    - node: br
    - node: text
      content: 幼年期の終わり
  p47:
  - node: p
    children:
    - node: text
      content: 'コードを書くと 何らかの単位で '
    - node: br
    - node: text
      content: 抽象化したくなる
  p48:
  - node: p
    children:
    - node: text
      content: 'コードが増えると '
    - node: br
    - node: text
      content: バグも増える
  p49:
  - node: p
    children:
    - node: text
      content: 'コードが減れば '
    - node: br
    - node: text
      content: バグも減る
  p50:
  - node: p
    children:
    - node: text
      content: 'ライブラリ化 '
    - node: br
    - node: text
      content: 'フレームワーク化 '
    - node: br
    - node: text
      content: レイヤー化
  p51:
  - node: p
    children:
    - node: text
      content: ライブラリ化
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 処理を関数やクラスの形でまとめて呼び出せるようにする
    - node: li
      children:
      - node: text
        content: ある人曰く「PHPの関数の数は、人間がWebでやりたいことの数」であると
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 完全に同意するわけではないが、本質の一面を捉えていると思う
    - node: li
      children:
      - node: text
        content: PHPの関数は外付けのライブラリに留まらず、HTTPをネイティブサポート
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: これは良し悪しあるが、セキュリティに関しては単なるCGIライブラリでは実
          - node: br
          - node: text
            content: 現できないレベルでヘッダインジェクションの対策ができる
  p52:
  - node: p
    children:
    - node: text
      content: フレームワーク化
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ライブラリとの最も明確な違いは「制御の反転」
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: あなたはコードを書いてライブラリ関数を呼び出す
        - node: li
          children:
          - node: text
            content: フレームワークはあなたの書いたコードを呼び出す
    - node: li
      children:
      - node: text
        content: どのような規則でコードを実行するかはフレームワークの性質による
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Webフレームワークはユーザーのリクエストによって対象を起動
        - node: li
          children:
          - node: text
            content: テストフレームワークはディレクトリやファイル名によって対象を起動
  p53:
  - node: p
    children:
    - node: text
      content: レイヤー化
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 処理を「層(レイヤー)」に分けて整理する
    - node: li
      children:
      - node: text
        content: これにはさまざまな観点がある：
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: MVC (Model-View-Controller)
        - node: li
          children:
          - node: text
            content: 3層アーキテクチャ、Ports and Adapters(クリーンアーキテクチャ)
        - node: li
          children:
          - node: text
            content: HTTPインフラとロジックの分離
  p54:
  - node: p
    children:
    - node: text
      content: HTTP層のレイヤー化
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPはHTTP機能を言語が直接サポートする(Server API)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: mod_php, php-fpm, cgi, cliなどがあるが、あまり意識の必要がない
    - node: li
      children:
      - node: text
        content: 他言語では従来のCGIスクリプトは廃れて、サーバとアプリケーションを
      - node: br
      - node: text
        content: '分離するインターフェイスを定める方向にシフトした '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Python=WSGI, Ruby=Rack, Perl=PSGI
    - node: li
      children:
      - node: text
        content: GoやNode.jsも標準でHTTPサーバをバンドルしている
  p55:
  - node: p
    children:
    - node: text
      content: Ruby on Railsの登場
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Webフレームワーク界の風雲児・フルスタックフレームワーク
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: CoC (設定より規約)： 重厚な設定が必要なFWのアンチテーゼ
          - node: br
          - node: text
            content: '設定を書かなくても慣習通りに配置すれば勝手に呼び出してくれる '
        - node: li
          children:
          - node: text
            content: '多数の高機能な組み込みライブラリ:'
          - node: br
          - node: text
            content: 'O/Rマッパー、ルーター/URLヘルパー、 '
        - node: li
          children:
          - node: text
            content: 積極的なコード生成(スキャフォルディング)：
          - node: br
          - node: text
            content: 最初期は「15分でブログを作れる」と宣伝された (2005年)
  p56:
  - node: p
    children:
    - node: text
      content: RubyにとってRailsは何を変えたか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Rails 1.0は独自のHTTPレイヤーで実装されていた
    - node: li
      children:
      - node: text
        content: 現代のRails(Rack)アプリケーションをCGIで実行することは可能だが、
      - node: br
      - node: text
        content: 'オーバーヘッドが大きい '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: CGI時代のRubyスクリプトと、RailsのControllerクラスの実装は
          - node: br
          - node: text
            content: '互換性がない '
        - node: li
          children:
          - node: text
            content: 「コード書き直し」 or 「捨てる」の二択を迫られる
  p57:
  - node: p
    children:
    - node: text
      content: PerlとHTTPレイヤー
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2000年代まで「WebアプリといえばPerlでCGI」という感じだった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: SNS以前はKENT WEBの掲示板やチャットをレンタルサーバーに置いて
          - node: br
          - node: text
            content: 'コミュニケーションをとっていた時代もあった '
    - node: li
      children:
      - node: text
        content: CGI時代のPerlスクリプトと、業務で開発するPerlアプリケーションの
      - node: br
      - node: text
        content: 世界は分たれてしまった…
  p58:
  - node: p
    children:
    - node: text
      content: PHP界への余波
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2004年を画期として、「フレームワーク」というものの見方が変わった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: CakePHPは当時の機能で再現可能な範囲で最大限Railsを模倣している
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: ルーティングすら書かなくてもコントローラーが呼ばれる(!)
              - node: ul
                children:
                - node: li
                  children:
                  - node: text
                    content: GET /users → UserController::index()
        - node: li
          children:
          - node: text
            content: さらに後発のフレームワーク(Laravelなど)は、Rails風の便利さは
          - node: br
          - node: text
            content: 残しつつも明示的に設定させることでコードの追いやすさを意識
  p59:
  - node: p
    children:
    - node: bold
      content: /data/www/www.pixiv.net
    - node: text
      content: ' (document root) '
