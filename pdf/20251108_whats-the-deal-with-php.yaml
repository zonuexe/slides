        - node: text
          content: Q. つまりPHPって
    - node: p
      children:
        - node: text
          content: 何だったの？
    - node: p
      children:
        - node: text
          content: '41'
  p42:
    - node: p
      children:
        - node: text
          content: A. 異常に行動力があるRasmus
    - node: p
      children:
        - node: text
          content: さんが自分のためにPHPを作っ
    - node: p
      children:
        - node: text
          content: て、何回か書き直した後に利己的
    - node: p
      children:
        - node: text
          content: な動機でソースコード公開したら
    - node: p
      children:
        - node: text
          content: 世界的に開発が盛り上がっちゃった
    - node: p
      children:
        - node: text
          content: '42'
  p43:
    - node: p
      children:
        - node: text
          content: '43'
  p44:
    - node: p
      children:
        - node: text
          content: PHPはWebに何をもたらしたか
    - node: p
      children:
        - node: text
          content: •   HTMLテンプレート (HTML内に制御構造や変数展開)
    - node: p
      children:
        - node: text
          content: • JSP(Java), eRuby/ERBなどのHTMLテンプレートに影響
    - node: p
      children:
        - node: text
          content: • それ以前は print "<div>Hello</div>"; のようなコード
    - node: p
      children:
        - node: text
          content: •   CGIの代替としてのサーバーモジュール組み込みと開発者体験
    - node: p
      children:
        - node: text
          content: • 現代ではコンパイルが必要な言語でも「ホットリロード」が普及
    - node: p
      children:
        - node: text
          content: •   フリーソフトウェアとして公開された言語(の先行事例のひとつ)
    - node: p
      children:
        - node: text
          content: '44'
  p45:
    - node: p
      children:
        - node: text
          content: 第2部
    - node: p
      children:
        - node: text
          content: Webフレームワークの
    - node: p
