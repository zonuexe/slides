  p36:
  - kind: heading
    level: 1
    text: PHPの「関数」には種類がある
  - kind: list
    items:
    - 数学っぽい関数
    - 同じ引数を渡したとき、関数の呼び出し結果(戻り値)は必ず同じになる
    - 戻り値は受け取らないと無駄になる
  p37:
  - kind: heading
    level: 1
    text: PHPの「関数」には種類がある
  - kind: list
    items:
    - 数学っぽい関数
    - 同じ引数を渡したとき、関数の呼び出し結果(戻り値)は必ず同じになる
    - 戻り値は受け取らないと無駄になる
    - 数学っぽくない関数
    - 関数の呼び出し結果(戻り値)は別に受け取らなくてもいい
  - kind: para
    text: 何かってなんだよ…
  - kind: list
    items:
    - どこかに何かの影響を及ぼす
