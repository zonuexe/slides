  p48:
  - kind: heading
    level: 1
    text: PHPの「関数」には種類がある
  - kind: list
    items:
    - 数学っぽい関数
    - 同じ引数を渡したとき、関数の呼び出し結果(戻り値)は必ず同じになる
    - 戻り値は受け取らないと無駄になる
    - 数学っぽくない関数
    - 関数の呼び出し結果(戻り値)は別に受け取らなくてもいい
  - kind: para
    text: 何かってなんだよ…
  - kind: list
    items:
    - どこかに何かの影響を及ぼす
  p49:
  - kind: para
    text: いつの間にかどこかの何かに影響を及ぼす
  p50:
  - kind: para
    text: あるいは勝手にどこかの何かの影響を受ける
  p51:
  - kind: heading
    level: 1
    text: 何かってなんだよ…
  p52:
  - kind: para
    text: PHPの「関数」には罠がいっぱい！
  - kind: list
    items:
    - 呼び出すごとに結果が変わる(かもしれない)
    - '日時関数: time(), date(), strtotime(), …etc.'
    - 'ランダム関数: rand(), random_bytes(), …etc'
    - 呼び出すごとにどこかに影響を及ぼす(かもしれない)
    - '出力関数: var_dump(), header(), ob_start(), setcookie() …etc.'
    - 両方！ DB・ファイルシステム関数・外部通信
  p53:
  - kind: heading
    level: 1
    text: 罠 = 副作用
  p54:
  - kind: heading
    level: 1
    text: 「テストしにくい」の正体
  - kind: list
    items:
    - テスト対象を実行した結果が予想しにくい
    - 外部の状態の影響を受ける・影響を受ける対象が多すぎて把握できない
    - 現在時刻・DB/ファイルの内容・外部APIの実行結果・ネットワーク… etc.
    - テスト対象を実行した結果に何が起こるか制御できない
    - ファイルに書き込まれる、DBが更新される、不必要な外部リクエスト… etc.
  p55:
  - kind: para
    text: 不規則に副作用を起こすコードは容易に制御不能になる
  p56:
  - kind: para
    text: 秩序のないコードが人間に牙を剥く
  p57:
  - kind: para
    text: 閑話休題
  p58:
  - kind: para
    text: ドラえもんご存じですか？
  p59:
  - kind: heading
    level: 1
    text: 侵略者が送り込んだ未知の技術
  - kind: heading
    level: 1
    text: の電子頭脳に対して…
  - kind: heading
    level: 1
    text: 工学的アプローチによって
  - kind: heading
    level: 1
    text: 戦力化を提案する野比のび太
  - kind: para
    text: 『大長編ドラえもん(7) のび太と鉄人兵団』著： 藤子・F・不二雄／藤子プロ1987年2月25日初版第1刷、2011年第86刷Kindle版 p97,
      p102より引用
  p60:
  - kind: para
    text: みたことのある回路になおしゃいいんだよ！
  p61:
  - kind: para
    text: のび太は技術者の鑑
  p62:
  - kind: para
    text: 制御できないものは制御できる部分にブレークダウンする
  p63:
  - kind: para
    text: ヘキサゴナルアーキテクチャ(Hexagonal architecture翻訳)Alistair Cockburn著、tai2訳2015年10月9日公開、2025年6月28日閲覧より引用
  p64:
  - kind: para
    text: クリーンアーキテクチャ(The Clean Architecture翻訳)Robert Martin著、tai2訳2015年10月9日公開、2025年6月28日閲覧より引用
  p65:
  - kind: heading
    level: 1
    text: 副作用がある部分を切り離す
  - kind: list
    items:
    - 任意の処理を純粋関数で書くということは「できない」
    - 現在時刻・DB/ファイルの内容・外部APIの実行結果・ネットワーク… etc.
    - それらに依存する部分を抽象化して切り離すことで、
  - kind: para
    text: テスト時にシンプルな偽物に差し替えてテストすることができる
  - kind: list
    items:
    - DIは純粋関数型になれないオブジェクト指向言語に許された武器
    - 時刻への依存はPSR-20、乱数への依存は組込みのRandomizerで分離
  p66: []
  p67: []
  p68: []
  p69:
  - kind: para
    text: 制御できないものは制御できる部分にブレークダウンする
  p70:
  - kind: para
    text: 「なんたらアーキテクチャ」は構造をわかりやすく図示してくれるが、必須ではない
  p71:
  - kind: para
    text: プログラム上で制御しやすい基本単位
  - kind: para
    text: '#とは'
  p72:
  - kind: heading
    level: 1
    text: そうです
  p73:
  - kind: heading
    level: 1
    text: 純粋関数
  p74:
  - kind: para
    text: 純粋の反対語は不純(impure)
  - kind: heading
    level: 1
    text: 純粋関数とは…
  - kind: list
    items:
    - 参照透過性 (referential transparency)
    - 雑に言うと「同じ入力に常に同じ結果を返す」という性質
    - 副作用を持たない (No side effects)
    - 与えられたパラメータだけに基いて戻り値を計算して返す以外に、
  - kind: para
    text: 外部から観測できる影響を与えない
  - kind: list
    items:
    - 「純粋関数型」と呼ばれる言語(Haskellなど)は、不純な性質が混ざらない
  - kind: para
    text: 基本的に…
  p75:
  - kind: para
    text: こんな関数は純粋じゃない！
  - kind: list
    items:
    - 実装の中で不純な関数を使ったり、グローバル変数を書き換える
    - time(), file(), rand(), $_GET, …etc.
    - 明示的にecho, printなどで出力している
    - 変数参照(&$var)を使っている
    - クロージャで & を使わない外部変数参照(use)はOK
  p76:
  - kind: heading
    level: 1
    text: 関数の結果を画面に表示… されない
  - kind: para
    text: 計算した結果をどこにも使わない
  - kind: para
    text: $f = fn($x) => 2 * $x;
  - kind: para
    text: 計算資源の無駄！
  - kind: para
    text: $f(2);sin(0);
  - kind: para
    text: SDGsに反する！
  p77: []
  p78:
  - kind: heading
    level: 1
    text: やるじゃん
  p79:
  - kind: heading
    level: 1
    text: 全関数を純粋と不純に分けたい…
  p80:
  - kind: heading
    level: 1
    text: PHPStanの純粋判定を支える仕組み
  - kind: list
    items:
    - functionMetadata.hasSideEffects
    - PHPの標準関数が副作用を持つかどうかを管理するメタデータ(配列)
    - いまのところ、副作用がないものだけhasSideEffects=>falseと記録
    - JetBrains/phpstorm-stubsをインポート+個別補正している
    - ImpurePoints
    - 型と同じように、コード内で副作用が発生する箇所を管理している
  p81:
  - kind: para
    text: PHPDoc @pure タグ
  - kind: list
    items:
    - DocCommentに@pureと書かれた関数は純粋として扱われる
    - その関数を呼び出した結果が無視されていると、もちろん警告
    - '@pureがついた関数の実装に副作用があると、きちんと警告してくれる'
    - ただし、それでも@pureの呼び出し側が無効化されるわけではない
  p82:
  - kind: heading
    level: 1
    text: resources/functionMetadata.php
  p83:
  - kind: heading
    level: 1
    text: JetBrains/phpstorm-stubs
  - kind: list
    items:
    - PhpStormで使用するための関数メタデータを管理しているパッケージ
    - '#[JetBrains\PhpStorm\Pure]というアトリビュートで純粋性を定義'
    - 問題点
    - '#[Pure]とマークされている関数の基準が曖昧'
    - '#[Pure(mayDependOnGlobalScope: true)] ？？？？？'
  - kind: para
    text: 「不純な純粋」というTig-HugなOxymoron
  p84: []
  p85: []
  p86: []
  p87:
  - kind: para
    text: 純粋じゃなくても戻り値が大事な関数はある
  p88: []
  p89:
  - kind: para
    text: CurlHandler/リソースは外部から観測できない内部状態に依存するので純粋と言いがたい
  p90:
  - kind: para
    text: PHP 8.5に導入される新機能
  - kind: heading
    level: 1
    text: '#[NoDiscard]'
  - kind: list
    items:
    - 'PHP RFC: Marking return values as important (#[\NoDiscard])'
    - このアトリビュートがついた関数の戻り値を無視すると、
  - kind: para
    text: PHPランタイムがE_WARNINGを発生させてくれる
  - kind: list
    items:
    - '#[NoDiscard]が導入される8.5ではビルトイン関数に対しては'
  - kind: para
    text: flock()とDateTimeImmutable::set*()のみ追加
  - kind: list
    items:
    - 現状はちゃんと確認しないと事故るやつのみ、保守的にマークされてそう
  p91:
  - kind: heading
    level: 1
    text: 関数の結果を画面に表示… されない
  - kind: para
    text: 計算した結果をどこにも使わない
  - kind: para
    text: $f = fn($x) => 2 * $x;
  - kind: para
    text: 計算資源の無駄！
  - kind: para
    text: $f(2);sin(0);
  - kind: para
    text: SDGsに反する！無駄なので除去する
  - kind: para
    text: 最適化
  p92:
  - kind: para
    text: ではこれを実装すればうまくいくのか？
  p93:
  - kind: heading
    level: 1
    text: そう上手くいかない…
  p94:
  - kind: para
    text: これは両方純粋なので警告されるべき
  p95:
  - kind: para
    text: 純粋な呼び出しなので警告されるべきではない
  p96:
  - kind: para
    text: 原因はわかっていて書きかけのPRがある
