      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 雑に言うと「同じ入力に常に同じ結果を返す」という性質
    - node: li
      children:
      - node: text
        content: 副作用を持たない (No side effects)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 与えられたパラメータだけに基いて戻り値を計算して返す以外に、
          - node: br
          - node: text
            content: '外部から観測できる影響を与えない '
    - node: li
      children:
      - node: text
        content: 「純粋関数型」と呼ばれる言語(Haskellなど)は、不純な性質が混ざらない
  - node: p
    children:
    - node: text
      content: 基本的に…
  p75:
  - node: p
