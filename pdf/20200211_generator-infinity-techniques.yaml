  p45:
  - node: p
    children:
    - node: text
      content: 計算機科学の入門 書という扱いだが､ 簡単な本ではない
  p46:
  - node: p
    children:
    - node: text
      content: 'この本の序盤 2章あたりに '
    - node: br
    - node: text
      content: 書いてあること
  p47:
  - node: p
    children:
    - node: text
      content: ペア
  - node: p
    children:
    - node: text
      content: (二値の組を持つオブ
    - node: br
    - node: text
      content: があれば様々
  - node: p
    children:
    - node: text
      content: ジェクト)
    - node: br
    - node: text
      content: なデータ構造が作れる
  p48:
  - node: p
    children:
    - node: text
      content: 'ペアの片方を関数で '
    - node: br
    - node: text
      content: '遅延させることで '
    - node: br
    - node: text
      content: ストリーム(遅延リス
    - node: br
    - node: text
      content: ト)というものが作れる
  p49:
  - node: p
    children:
    - node: text
      content: ストリーム (遅延リスト)
  - node: p
    children:
    - node: text
      content: 配列・オブジェクトのようなも のとクロージャがあれば実現で
    - node: br
    - node: text
      content: 'きる '
    - node: br
    - node: text
      content: 'PHPで実装してみた '
  - node: p
    children:
    - node: text
      content: https://github.com/zonuexe/phperkaigi-generator/blob/master/
    - node: br
    - node: text
      content: stream.php
  p50:
  - node: p
    children:
    - node: text
      content: ストリームでできる ことはジェネレータ
    - node: br
    - node: text
      content: で表現できる
  p51:
  - node: p
    children:
    - node: text
      content: foreachループで配列を反復するのは既に作成済みの データを頭から辿っていくだけのものであるのに対し
    - node: br
    - node: text
      content: て、ジェネレータは配列のキーや要素に相当するものを 計算によって生み出すことができるため、省メモリで効
    - node: br
    - node: text
      content: 率のよい計算が可能です。
  - node: p
    children:
    - node: text
      content: '‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020 '
  - node: p
    children:
    - node: text
