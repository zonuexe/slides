    level: 1
    text: ‒計算機プログラムの構造と解釈 第2版
  - kind: para
    text: https://www.amazon.co.jp/dp/4798135984
  p42:
  - kind: para
    text: Webで無料でも読めます
  p43:
  - kind: heading
    level: 1
    text: ‒計算機プログラムの構造と解釈 第2版
  - kind: para
    text: https://sicp.iijlab.net/fulltext/
