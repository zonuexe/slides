  - kind: para
    text: 無限を手玉に取る
  p11:
  - kind: para
    text: 元ねたがある
  p12: []
  p13:
  - kind: para
    text: いますぐ皆さんに函数プログラミングを学べという話ではない
  p14:
  - kind: para
    text: (個人的に)
  - kind: para
    text: 大事なのは
  - kind: para
    text: 以下のページ
  p15: []
  p16: []
  p17: []
  p18:
  - kind: para
    text: 言ってることは
  - kind: para
    text: よくわからんが
  - kind: para
    text: カッコイイ
  p19:
  - kind: para
    text: 何が言いたいのか？
  p20:
  - kind: para
    text: 遅延評価必要になるまで計算を遅らせる
  p21:
  - kind: para
    text: 関数型知識ゼロでもその神髄の一端をいとも簡単に扱える機能がPHPにはある
  p22:
  - kind: para
    text: ここまで言えばおわかりですね？
  p23:
  - kind: para
    text: ジェネレータ
  - kind: heading
    level: 1
    text: Generator
  p24:
  - kind: para
    text: ジェネレータとは何か？
  p25:
  - kind: para
    text: 「PHPでforeachで反復できるものは何でしょう？」配列、オブジェクト、Iterator、そして“ジェネレータ”です。ジェネレータは言語によってコルーチン、semicoroutineやFiberとも呼ばれるものと同等の言語機能であり、SICPのような計算機科学の教科書で説明されるストリーム・無限リストを簡潔に実現できます。foreachループで配列を反復するのは既に作成済みのデータを頭から辿っていくだけのものであるのに対して、ジェネレータは配列のキーや要素に相当するものを計算によって生み出すことができるため、省メモリで効率のよい計算が可能です。このトークではジェネレータの基礎概念と、実際に応用できるパターンについて紹介していきます。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p26:
  - kind: para
    text: この説明で全部なのですが…
  p27:
  - kind: para
    text: ざっくり説明していきます
  p28:
  - kind: para
    text: 「PHPでforeachで反復できるものは何でしょう？」配列、オブジェクト、Iterator、そして“ジェネレータ”です。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p29:
  - kind: para
    text: ジェネレータはforeachできる
  - kind: para
    text: 配列を代用できる場面がある
  - kind: para
    text: 全てを置き換えるものではない
  - kind: para
    text: あくまでforeachで順次実行するもののみ
  - kind: para
    text: その他の反復可能オブジェクトについては今回触れません
  p30:
  - kind: para
    text: iterable擬似型 (PHP 7.1)
  - kind: para
    text: 擬似型とは実態のある一種類の型ではなく同じように扱える複数の型とクラスをひとまとめにした便宜上のもの
  - kind: para
    text: iterable = foreachできる値
  p31:
  - kind: para
    text: 'おまけ: 擬似型'
  - kind: para
    text: 前述したように特定の型ではないが、型宣言(引数・戻り値)の型として記述できる
  - kind: para
    text: callable擬似型
  - kind: para
    text: 関数として呼び出せる値
  p32:
  - kind: para
    text: 'おまけ: iterableと型定義'
  - kind: para
    text: DocCommentに型を書くときキーと値の型を書ける
  - kind: para
    text: iterable<int,string>や
  - kind: para
    text: Generator<int,string>のように
  - kind: para
    text: PhpStormは未対応なので
  - kind: para
    text: iterable|string[] で代用…
  p33:
  - kind: para
    text: 'おまけ: iterableと型定義'
  - kind: para
    text: iterableの型をちゃんと書いておくとforeachの中身も静的解析できる
  - kind: para
    text: PHPStanは書かないと叱ってくれる
  - kind: para
    text: JetBrainsさん早くPhpStorm対応して(deep-assocプラグインで補完可能)
  - kind: para
    text: 詳細は｢2018年のPHPDoc事情とPSR-5｣に書きました
  p34:
  - kind: heading
    level: 1
    text: 置換できる可能性がある
  - kind: para
    text: <?php
  - kind: para
    text: // どこかから取得してきたIDリスト
  - kind: para
    text: $target_ids = [85490, 54352, 34242, 45090];
  - kind: para
    text: foreach ($target_ids as $id) {shori($id);}
  p35:
  - kind: heading
    level: 1
    text: 置換できる可能性がある
  - kind: para
    text: <?php
  - kind: para
    text: // ジェネレータのイメージ
  - kind: para
    text: $target_ids = function () { ... };
  - kind: para
    text: foreach ($target_ids as $id) {shori($id);}
  p36:
  - kind: para
    text: ジェネレータは言語によってコルーチン、semicoroutineやFiberとも呼ばれるものと同等の言語機能であり、
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p37:
  - kind: para
    text: 用語 (呼ばれかた)
  - kind: para
    text: 言語によって呼びかたや機能が若干違います
  - kind: para
    text: JavaScriptやPythonのジェネレータはPHPと似ています
  - kind: para
    text: RubyにはEnumeratorとFiberというものがあります
  p38:
  - kind: para
    text: コルーチン (coroutine)
  - kind: para
    text: ジェネレータは古典的なコルーチンと同等のものですが、現代でコルーチンと呼ばれているものは意味がかなり拡大しているので注意が必要です
  p39:
  - kind: para
    text: SICPのような計算機科学の教科書で説明されるストリーム・無限リストを簡潔に実現できます。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p40:
  - kind: heading
    level: 1
    text: SICP
  - kind: para
    text: 計算機プログラムの構造と解釈
