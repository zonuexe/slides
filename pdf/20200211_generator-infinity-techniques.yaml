  p52:
  - node: p
    children:
    - node: text
      content: 'ということで、 ジェネレータを '
    - node: br
    - node: text
      content: 説明します
  p53:
  - node: p
    children:
    - node: text
      content: ジェネレータの
    - node: br
    - node: text
      content: 書きかた
  p54:
  - node: p
    children:
    - node: text
      content: ジェネレータ=特別な関数
  - node: p
