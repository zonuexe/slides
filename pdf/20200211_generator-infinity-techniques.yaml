  - kind: heading
    level: 1
    text: ‒アスペ日記 非公式PDF版SICP・新訳
  - kind: para
    text: https://takeda25.hatenablog.jp/entry/20151030/1446174031
  p45:
  - kind: para
    text: 計算機科学の入門書という扱いだが､簡単な本ではない
  p46:
  - kind: para
    text: この本の序盤2章あたりに書いてあること
  p47:
  - kind: para
    text: (二値の組を持つオブペアジェクト)があれば様々なデータ構造が作れる
  p48:
  - kind: para
    text: ペアの片方を関数で遅延させることでストリーム(遅延リスト)というものが作れる
  p49:
  - kind: para
    text: ストリーム (遅延リスト)
  - kind: para
    text: 配列・オブジェクトのようなものとクロージャがあれば実現できる
  - kind: para
    text: PHPで実装してみた
  - kind: para
    text: https://github.com/zonuexe/phperkaigi-generator/blob/master/stream.php
  p50:
  - kind: para
    text: ストリームでできることはジェネレータで表現できる
  p51:
  - kind: para
    text: foreachループで配列を反復するのは既に作成済みのデータを頭から辿っていくだけのものであるのに対して、ジェネレータは配列のキーや要素に相当するものを計算によって生み出すことができるため、省メモリで効率のよい計算が可能です。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p52:
  - kind: para
    text: ということで、ジェネレータを説明します
  p53:
  - kind: para
    text: ジェネレータの書きかた
  p54:
  - kind: para
    text: ジェネレータ=特別な関数
  - kind: para
    text: 関数定義(メソッド・クロージャを含む)の中でyieldと書くとジェネレータになる
  - kind: para
    text: yieldに渡した値はforeachの値として受け渡される
  p55:
  - kind: para
    text: PHPUnit dataProvider
  - kind: para
    text: テストケースに必要なパラメータを生成するメソッド
  - kind: para
    text: 配列を返すように作るのが一般的だが、実はジェネレータでも作れる
  p56:
  - kind: heading
    level: 1
    text: 基本的なジェネレータ
  - kind: para
    text: <?php
  - kind: para
    text: // どこかから取得してきたIDリスト
  - kind: para
    text: f$target_ids = [85490, 54352, 34242, 45090];
  - kind: para
    text: foreach ($target_ids as $id) {shori($id);}
  p57:
  - kind: heading
    level: 1
    text: 基本的なジェネレータ
  - kind: para
    text: <?php
  - kind: para
    text: // どこかから取得してきたIDリスト
  - kind: para
    text: f$target_ids = [85490, 54352, 34242, 45090];
  - kind: para
    text: foreach ($target_ids as $id) {shori($id);}
