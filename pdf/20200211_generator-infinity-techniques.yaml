    text: 元ねたがある
  p12: []
  p13:
  - kind: para
    text: いますぐ皆さんに
  - kind: para
    text: 函数プログラミングを
  - kind: para
    text: 学べという話
  - kind: para
    text: ではない
  p14:
  - kind: para
    text: (個人的に)
  - kind: para
    text: 大事なのは
  - kind: para
    text: 以下のページ
  p15: []
