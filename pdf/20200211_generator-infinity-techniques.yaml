    text: <?php
  - kind: para
    text: // どこかから取得してきたIDリスト
  - kind: para
    text: f
  - kind: para
    text: $target_ids = [85490, 54352, 34242, 45090];
  - kind: para
    text: foreach ($target_ids as $id) {
  - kind: para
    text: shori($id);
  - kind: para
    text: '}'
