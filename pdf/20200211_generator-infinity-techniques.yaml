  p18:
  - kind: para
    text: 言ってることは
  - kind: para
    text: よくわからんが
  - kind: para
    text: カッコイイ
  p19:
  - kind: para
    text: 何が
  - kind: para
    text: 言いたいのか？
  p20:
  - kind: para
    text: 遅延評価
  - kind: para
    text: 必要になるまで
  - kind: para
    text: 計算を遅らせる
  p21:
  - kind: para
    text: 関数型知識ゼロでも
  - kind: para
    text: その神髄の一端を
  - kind: para
    text: いとも簡単に扱える
  - kind: para
    text: 機能がPHPにはある
  p22:
  - kind: para
    text: ここまで言えば
  - kind: para
    text: おわかりですね？
  p23:
  - kind: para
    text: ジェネレータ
  - kind: heading
    level: 1
    text: Generator
  p24:
  - kind: para
    text: ジェネレータ
  - kind: para
    text: とは何か？
  p25:
  - kind: para
    text: 「PHPでforeachで反復できるものは何でしょう？」配列、オ
  - kind: para
    text: ブジェクト、Iterator、そして“ジェネレータ”です。ジェネレー
  - kind: para
    text: タは言語によってコルーチン、semicoroutineやFiberとも呼
  - kind: para
    text: ばれるものと同等の言語機能であり、SICPのような計算機科学
  - kind: para
    text: の教科書で説明されるストリーム・無限リストを簡潔に実現で
  - kind: para
    text: きます。foreachループで配列を反復するのは既に作成済みの
  - kind: para
    text: データを頭から辿っていくだけのものであるのに対して、ジェ
  - kind: para
    text: ネレータは配列のキーや要素に相当するものを計算によって生
  - kind: para
    text: み出すことができるため、省メモリで効率のよい計算が可能で
  - kind: para
    text: す。このトークではジェネレータの基礎概念と、実際に応用で
  - kind: para
    text: きるパターンについて紹介していきます。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p26:
  - kind: para
    text: この説明で全部
  - kind: para
    text: なのですが…
  p27:
  - kind: para
    text: ざっくり説明
  - kind: para
    text: していきます
  p28:
  - kind: para
    text: 「PHPでforeachで反復できるものは何でしょう？」
  - kind: para
    text: 配列、オブジェクト、Iterator、そして“ジェネレータ”
  - kind: para
    text: です。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p29:
  - kind: para
    text: ジェネレータはforeachできる
  - kind: para
    text: 配列を代用できる場面がある
  - kind: para
    text: 全てを置き換えるものではない
  - kind: para
    text: あくまでforeachで順次実行
  - kind: para
    text: するもののみ
  - kind: para
    text: その他の反復可能オブジェクト
  - kind: para
    text: については今回触れません
  p30:
  - kind: para
    text: iterable擬似型 (PHP 7.1)
  - kind: para
    text: 擬似型とは実態のある一種類の
  - kind: para
    text: 型ではなく同じように扱える複
  - kind: para
    text: 数の型とクラスをひとまとめに
  - kind: para
    text: した便宜上のもの
  - kind: para
    text: iterable = foreachできる値
  p31:
  - kind: para
    text: 'おまけ: 擬似型'
  - kind: para
    text: 前述したように特定の型ではな
  - kind: para
    text: いが、型宣言(引数・戻り値)の
  - kind: para
    text: 型として記述できる
  - kind: para
    text: callable擬似型
  - kind: para
    text: 関数として呼び出せる値
  p32:
  - kind: para
    text: 'おまけ: iterableと型定義'
  - kind: para
    text: DocCommentに型を書くとき
  - kind: para
    text: キーと値の型を書ける
  - kind: para
    text: iterable<int,string>や
  - kind: para
    text: Generator<int,string>のように
  - kind: para
    text: PhpStormは未対応なので
  - kind: para
    text: iterable|string[] で代用…
  p33:
  - kind: para
    text: 'おまけ: iterableと型定義'
  - kind: para
    text: iterableの型をちゃんと書いておくと
  - kind: para
    text: foreachの中身も静的解析できる
  - kind: para
    text: PHPStanは書かないと叱ってくれる
  - kind: para
    text: JetBrainsさん早くPhpStorm対応し
  - kind: para
    text: て(deep-assocプラグインで補完可能)
  - kind: para
    text: 詳細は｢2018年のPHPDoc事情とPSR-5｣に書きました
  p34:
  - kind: heading
    level: 1
    text: 置換できる可能性がある
  - kind: para
    text: <?php
  - kind: para
    text: // どこかから取得してきたIDリスト
  - kind: para
    text: $target_ids = [85490, 54352, 34242, 45090];
  - kind: para
    text: foreach ($target_ids as $id) {
  - kind: para
    text: shori($id);
  - kind: para
    text: '}'
  p35:
  - kind: heading
    level: 1
    text: 置換できる可能性がある
  - kind: para
    text: <?php
  - kind: para
    text: // ジェネレータのイメージ
  - kind: para
    text: $target_ids = function () { ... };
  - kind: para
    text: foreach ($target_ids as $id) {
  - kind: para
    text: shori($id);
  - kind: para
    text: '}'
  p36:
  - kind: para
    text: ジェネレータは言語によってコルーチン、
  - kind: para
    text: semicoroutineやFiberとも呼ばれるものと同等の言
  - kind: para
    text: 語機能であり、
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p37:
  - kind: para
    text: 用語 (呼ばれかた)
  - kind: para
    text: 言語によって呼びかたや機能が
  - kind: para
    text: 若干違います
  - kind: para
    text: JavaScriptやPythonのジェ
  - kind: para
    text: ネレータはPHPと似ています
  - kind: para
    text: RubyにはEnumeratorと
  - kind: para
    text: Fiberというものがあります
  p38:
  - kind: para
    text: コルーチン (coroutine)
  - kind: para
    text: ジェネレータは古典的なコルー
  - kind: para
    text: チンと同等のものですが、現代
  - kind: para
    text: でコルーチンと呼ばれているも
  - kind: para
    text: のは意味がかなり拡大している
  - kind: para
    text: ので注意が必要です
  p39:
  - kind: para
    text: SICPのような計算機科学の教科書で説明されるスト
  - kind: para
    text: リーム・無限リストを簡潔に実現できます。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p40:
  - kind: heading
    level: 1
    text: SICP
  - kind: para
    text: 計算機プログラムの
  - kind: para
    text: 構造と解釈
