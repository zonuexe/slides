    children:
    - node: text
      content: 近況
  p7: []
  p8:
  - node: p
    children:
    - node: text
      content: 本日のお題
  p9:
  - node: p
    children:
    - node: text
      content: '‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020 '
  - node: p
    children:
    - node: text
      content: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p10:
  - node: p
    children:
    - node: text
      content: '無限を '
    - node: br
    - node: text
      content: 手玉に取る
  p11:
  - node: p
    children:
    - node: text
      content: 元ねたがある
  p12: []
  p13:
  - node: p
    children:
    - node: text
      content: 'いますぐ皆さんに '
    - node: br
    - node: text
      content: 函数プログラミングを 学べという話ではない
  p14:
  - node: p
    children:
    - node: text
      content: '(個人的に) 大事なのは '
    - node: br
    - node: text
      content: 以下のページ
  p15: []
  p16: []
  p17: []
  p18:
  - node: p
    children:
    - node: text
      content: 言ってることは よくわからんが
    - node: br
    - node: text
      content: カッコイイ
  p19:
  - node: p
    children:
    - node: text
      content: '何が '
    - node: br
    - node: text
      content: 言いたいのか？
  p20:
  - node: p
    children:
    - node: text
      content: '遅延評価 '
    - node: br
    - node: text
      content: 必要になるまで 計算を遅らせる
  p21:
  - node: p
    children:
    - node: text
      content: '関数型知識ゼロでも '
    - node: br
    - node: text
      content: 'その神髄の一端を '
    - node: br
    - node: text
      content: いとも簡単に扱える 機能がPHPにはある
  p22:
  - node: p
    children:
    - node: text
      content: 'ここまで言えば '
    - node: br
    - node: text
      content: おわかりですね？
  p23:
  - node: p
    children:
    - node: text
      content: ジェネレータ
  - node: p
    children:
    - node: text
      content: Generator
  p24:
  - node: p
    children:
    - node: text
      content: 'ジェネレータ '
    - node: br
    - node: text
      content: とは何か？
  p25:
  - node: p
    children:
    - node: text
      content: 「PHPでforeachで反復できるものは何でしょう？」配列、オ ブジェクト、Iterator、そして“ジェネレータ”です。ジェネレー
        タは言語によってコルーチン、semicoroutineやFiberとも呼 ばれるものと同等の言語機能であり、SICPのような計算機科学 の教科書で説明されるストリーム・無限リストを簡潔に実現で
        きます。foreachループで配列を反復するのは既に作成済みの データを頭から辿っていくだけのものであるのに対して、ジェ ネレータは配列のキーや要素に相当するものを計算によって生
        み出すことができるため、省メモリで効率のよい計算が可能で す。このトークではジェネレータの基礎概念と、実際に応用で
    - node: br
    - node: text
      content: きるパターンについて紹介していきます。
  - node: p
    children:
    - node: text
      content: '‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020 '
  - node: p
    children:
    - node: text
      content: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p26:
  - node: p
    children:
    - node: text
      content: この説明で全部
    - node: br
    - node: text
      content: なのですが…
  p27:
  - node: p
    children:
    - node: text
      content: ざっくり説明 していきます
  p28:
  - node: p
    children:
    - node: text
      content: 「PHPでforeachで反復できるものは何でしょう？」 配列、オブジェクト、Iterator、そして“ジェネレータ”
    - node: br
    - node: text
      content: です。
  - node: p
    children:
    - node: text
      content: '‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020 '
  - node: p
    children:
    - node: text
      content: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p29:
  - node: p
    children:
    - node: text
      content: ジェネレータはforeachできる
  - node: p
    children:
    - node: text
      content: '配列を代用できる場面がある '
    - node: br
    - node: text
      content: 全てを置き換えるものではない あくまでforeachで順次実行
    - node: br
    - node: text
      content: 'するもののみ '
    - node: br
    - node: text
      content: その他の反復可能オブジェクト
    - node: br
    - node: text
      content: については今回触れません
  p30:
  - node: p
    children:
    - node: text
      content: iterable擬似型 (PHP 7.1)
  - node: p
    children:
    - node: text
      content: 擬似型とは実態のある一種類の 型ではなく同じように扱える複 数の型とクラスをひとまとめに
    - node: br
    - node: text
      content: 'した便宜上のもの '
    - node: br
    - node: text
      content: iterable = foreachできる値
  p31:
  - node: p
    children:
    - node: text
      content: 'おまけ: 擬似型'
  - node: p
    children:
    - node: text
      content: 前述したように特定の型ではな いが、型宣言(引数・戻り値)の
    - node: br
    - node: text
      content: '型として記述できる '
    - node: br
    - node: text
      content: 'callable擬似型 '
    - node: br
    - node: text
      content: 関数として呼び出せる値
  p32:
  - node: p
    children:
    - node: text
      content: 'おまけ: iterableと型定義'
  - node: p
    children:
    - node: text
      content: 'DocCommentに型を書くとき '
    - node: br
    - node: text
      content: 'キーと値の型を書ける '
  - node: p
    children:
    - node: text
      content: 'や '
  - node: p
    children:
    - node: text
      content: iterable<int,string>
  - node: p
    children:
    - node: text
      content: 'のように '
  - node: p
    children:
    - node: text
      content: Generator<int,string>
    - node: br
    - node: text
      content: 'PhpStormは未対応なので '
  - node: p
    children:
    - node: text
      content: ' で代用…'
  - node: p
    children:
    - node: text
      content: iterable|string[]
  p33:
  - node: p
    children:
    - node: text
      content: 'おまけ: iterableと型定義'
  - node: p
    children:
    - node: text
      content: iterableの型をちゃんと書いておくと
    - node: br
    - node: text
      content: 'foreachの中身も静的解析できる '
    - node: br
    - node: text
      content: PHPStanは書かないと叱ってくれる JetBrainsさん早くPhpStorm対応し て(deep-assocプラグインで補完可能)
        詳細は｢2018年のPHPDoc事情とPSR-5｣に書きました
  p34:
  - node: p
    children:
    - node: text
      content: 置換できる可能性がある
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: どこかから取得してきた リスト
  - node: p
    children:
    - node: text
      content: //  ID
    - node: br
    - node: text
      content: $target_ids = [85490, 54352, 34242, 45090];
  - node: p
    children:
    - node: text
      content: foreach ($target_ids as $id) {
    - node: br
    - node: text
      content: '    shori($id);'
    - node: br
    - node: text
      content: '}'
  p35:
  - node: p
    children:
    - node: text
      content: 置換できる可能性がある
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: ジェネレータのイメージ
  - node: p
    children:
    - node: text
      content: '// '
    - node: br
    - node: text
      content: $target_ids = function () { ... };
  - node: p
    children:
    - node: text
      content: foreach ($target_ids as $id) {
    - node: br
    - node: text
      content: '    shori($id);'
    - node: br
    - node: text
      content: '}'
  p36:
  - node: p
    children:
    - node: text
      content: ジェネレータは言語によってコルーチン、
    - node: br
    - node: text
      content: semicoroutineやFiberとも呼ばれるものと同等の言
    - node: br
    - node: text
      content: 語機能であり、
  - node: p
    children:
    - node: text
      content: '‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020 '
  - node: p
    children:
    - node: text
      content: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p37:
  - node: p
    children:
    - node: text
      content: 用語 (呼ばれかた)
  - node: p
    children:
    - node: text
      content: 言語によって呼びかたや機能が
    - node: br
    - node: text
      content: '若干違います '
    - node: br
    - node: text
      content: 'JavaScriptやPythonのジェ ネレータはPHPと似ています '
    - node: br
    - node: text
      content: RubyにはEnumeratorと Fiberというものがあります
  p38:
  - node: p
    children:
    - node: text
      content: コルーチン (coroutine)
  - node: p
    children:
    - node: text
      content: ジェネレータは古典的なコルー チンと同等のものですが、現代 でコルーチンと呼ばれているも のは意味がかなり拡大している
    - node: br
    - node: text
      content: ので注意が必要です
  p39:
  - node: p
    children:
    - node: text
      content: SICPのような計算機科学の教科書で説明されるスト
    - node: br
    - node: text
      content: リーム・無限リストを簡潔に実現できます。
  - node: p
    children:
    - node: text
      content: '‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020 '
  - node: p
    children:
    - node: text
      content: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p40:
  - node: p
    children:
    - node: text
      content: 'SICP '
    - node: br
    - node: text
      content: 計算機プログラムの
    - node: br
    - node: text
      content: 構造と解釈
  p41:
  - node: p
