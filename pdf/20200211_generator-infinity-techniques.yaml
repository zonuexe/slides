  p45:
  - kind: para
    text: 計算機科学の入門
  - kind: para
    text: 書という扱いだが
  - kind: para
    text: ､
  - kind: para
    text: 簡単な本ではない
  p46:
  - kind: para
    text: この本の序盤
  - kind: para
    text: 2章あたりに
  - kind: para
    text: 書いてあること
  p47:
  - kind: para
    text: (二値の組を持つオブ
  - kind: para
    text: ペア
  - kind: para
    text: ジェクト)
  - kind: para
    text: があれば様々
  - kind: para
    text: なデータ構造が作れる
  p48:
  - kind: para
    text: ペアの片方を関数で
  - kind: para
    text: 遅延させることで
  - kind: para
    text: ストリーム(遅延リス
  - kind: para
    text: ト)というものが作れる
  p49:
  - kind: para
    text: ストリーム (遅延リスト)
  - kind: para
    text: 配列・オブジェクトのようなも
  - kind: para
    text: のとクロージャがあれば実現で
  - kind: para
    text: きる
  - kind: para
    text: PHPで実装してみた
  - kind: para
    text: https://github.com/zonuexe/phperkaigi-generator/blob/master/
  - kind: para
    text: stream.php
  p50:
  - kind: para
    text: ストリームでできる
  - kind: para
    text: ことはジェネレータ
  - kind: para
    text: で表現できる
  p51:
  - kind: para
    text: foreachループで配列を反復するのは既に作成済みの
  - kind: para
    text: データを頭から辿っていくだけのものであるのに対し
  - kind: para
    text: て、ジェネレータは配列のキーや要素に相当するものを
  - kind: para
    text: 計算によって生み出すことができるため、省メモリで効
  - kind: para
    text: 率のよい計算が可能です。
  - kind: para
    text: ‒ジェネレータで無限を手玉に取る術 PHPerKaigi 2020
  - kind: para
    text: https://fortee.jp/phperkaigi-2020/proposal/5b1651a5-0a01-4b49-b338-e332f981bf5d
  p52:
  - kind: para
    text: ということで、
  - kind: para
    text: ジェネレータを
  - kind: para
    text: 説明します
  p53:
  - kind: para
    text: ジェネレータの
  - kind: para
    text: 書きかた
  p54:
  - kind: para
    text: ジェネレータ=特別な関数
  - kind: para
    text: 関数定義(メソッド・クロー
  - kind: para
    text: ジャを含む)の中でyieldと書く
  - kind: para
    text: とジェネレータになる
  - kind: para
    text: yieldに渡した値はforeachの
  - kind: para
    text: 値として受け渡される
  p55:
  - kind: para
    text: PHPUnit dataProvider
  - kind: para
    text: テストケースに必要なパラメー
  - kind: para
    text: タを生成するメソッド
  - kind: para
    text: 配列を返すように作るのが一般
  - kind: para
    text: 的だが、実はジェネレータでも
  - kind: para
    text: 作れる
