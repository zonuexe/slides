text:
  p1:
  - kind: heading
    level: 1
    text: PhanでPHPコード静的解析2018
  - kind: para
    text: Static analysis of PHP code using Phan.
  - kind: para
    text: '2018-05-30 PHP勉強会@東京 #phpstudy'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4:
  - kind: para
    text: We are hiring!
  p5:
  - kind: para
    text: 近況報告
  p6: []
  p7: []
  p8: []
  p9:
  - kind: para
    text: そして
  p10: []
  p11:
  - kind: para
    text: Phanって何
  p12: []
  p13: []
  p14:
  - kind: para
    text: 今回は最近の
  - kind: para
    text: Phanについて
  - kind: para
    text: 軽くまとめます
  p15:
  - kind: para
    text: 最近のPhanの
  - kind: para
    text: 動向
  p16:
  - kind: para
    text: 相変らず恐しいペー
  - kind: para
    text: スで開発が進んでる
  p17: []
  p18:
  - kind: para
    text: 連想配列の
  - kind: para
    text: 静的解析の鬼
  p19:
  - kind: para
    text: LSPの実装
  p20:
  - kind: para
    text: 復讐
  p21:
  - kind: para
    text: 静的解析とは
  p22: []
  p23:
  - kind: para
    text: 実行して
  - kind: para
    text: 調べるのが
  - kind: para
    text: 動的解析
  p24:
  - kind: para
    text: 実行せず
  - kind: para
    text: 調べるのが
  - kind: para
    text: 静的解析
  p25:
  - kind: para
    text: Xdebug, phpdbg
  - kind: para
    text: などのデバッガは
  - kind: para
    text: 動的解析
  p26:
  - kind: para
    text: PHPUnitなどの
  - kind: para
    text: テスティングフレームワークも
  - kind: para
    text: 動的解析
  p27:
  - kind: para
    text: php -l は
  - kind: para
    text: 静的解析
  p28: []
  p29:
  - kind: para
    text: PHPStanは
  - kind: para
    text: 実行時情報を使って
  - kind: para
    text: 静的解析する
  p30:
  - kind: para
    text: Phanは
  - kind: para
    text: コードを実行せず
  - kind: para
    text: 静的解析する
  p31:
  - kind: para
    text: 得意なことが
  - kind: para
    text: ちょっと異なる
  p32:
  - kind: para
    text: 導入しやすさも
  - kind: para
    text: ちょっと異なる
  p33:
  - kind: para
    text: '@tadsanは'
  - kind: para
    text: PHPStanもPhanも
  - kind: para
    text: 両方使ってます
  p34:
  - kind: para
    text: 詳しいことは
  - kind: para
    text: 直接きいて
  p35:
  - kind: para
    text: (ここまで5分)
  p36:
  - kind: para
    text: Phanを使って
  - kind: para
    text: できること
  p37:
  - kind: para
    text: 説明
  p38:
  - kind: para
    text: “Phan is a static analyzer for PHP that
  - kind: para
    text: prefers to minimize false-positives.
  - kind: para
    text: Phan attempts to prove incorrectness rather
  - kind: para
    text: than correctness.”
  - kind: para
    text: https://github.com/phan/phan
  p39:
  - kind: para
    text: “Phanは偽陽性を最小化することを
  - kind: para
    text: 好むPHP静的解析器です。
  - kind: para
    text: Phanは正しいと証明することよりも
  - kind: para
    text: 誤りであることを証明しようとします。”
  - kind: para
    text: https://github.com/phan/phan
  p40:
  - kind: para
    text: Phanでエラーが
  - kind: para
    text: 検出されなければ
  - kind: para
    text: 正しく動く…
  - kind: para
    text: わけではない
  p41:
  - kind: para
    text: Phanでエラーが
  - kind: para
    text: 検出されるから
  - kind: para
    text: コードは動かない…
  - kind: para
    text: わけではない
  p42:
  - kind: para
    text: 「動かないかもしれない」
  - kind: para
    text: ちゃんとしてないコード
  - kind: para
    text: から怪しい箇所を検出する
  - kind: para
    text: のに強い
  p43:
  - kind: para
    text: で、Phanは何を
  - kind: para
    text: やってくれるの？
  p44:
  - kind: para
    text: ざっくり
  p45:
  - kind: para
    text: 要はPhpStormを
  - kind: para
    text: 使ってできるよう
  - kind: para
    text: な検査ができる
  p46:
  - kind: heading
    level: 1
    text: ざっくりとPhanのできること
  - kind: para
    text: 存在しないクラスやメソッドの使用
  - kind: para
    text: 引数の型のミスマッチや過不足
  - kind: para
    text: コードとPHPDocの不整合
  - kind: para
    text: 存在しないプロパティのアクセス
  - kind: para
    text: PHP7と非互換な文法
  - kind: para
    text: 非推奨な機能の使用 (@deprecated)
  p47:
  - kind: heading
    level: 1
    text: 比較的最近実装された機能
  - kind: para
    text: LSP (Language Server Protocol)
  - kind: para
    text: VSCなどから利用できる
  - kind: para
    text: 設定ファイルの自動生成
  - kind: para
    text: composer.jsonからの設定取り込み
  - kind: para
    text: 未使用変数・デッドコード検出機能
  p48:
  - kind: heading
    level: 1
    text: 型
  - kind: para
    text: PSR-5(abandoned) 型表記を実装
  - kind: para
    text: '@param, @return, @var, @method'
  - kind: para
    text: '@property に優先する @phan-'
  - kind: para
    text: 付きのPHPDocタグが追加
  - kind: para
    text: 独自の拡張形式で型を記述できる
  - kind: para
    text: 'Closure(int|array): (int[])'
  - kind: para
    text: '@phan-param array{field:string}'
  p49:
  - kind: para
    text: Phanを
  - kind: para
    text: 導入しよう
  p50:
  - kind: para
    text: 三択
  p51:
  - kind: heading
    level: 1
    text: A. Pharアーカイブ
  - kind: para
    text: (超おてがる)
  - kind: heading
    level: 1
    text: B. Docker
  - kind: para
    text: (ただしバージョン古すぎる)
  - kind: heading
    level: 1
    text: C. Composer
  - kind: para
    text: (依存関係の管理がだるい)
  p52:
  - kind: heading
    level: 1
    text: A. Pharアーカイブ
  - kind: para
    text: (超おてがる)
  - kind: heading
    level: 1
    text: B. Docker
  - kind: para
    text: (ただしバージョン古すぎる)
  - kind: heading
    level: 1
    text: C. Composer
  - kind: para
    text: (依存関係の管理がだるい)
  p53: []
  p54:
  - kind: heading
    level: 1
    text: Pharアーカイブのメリット
  - kind: para
    text: 導入も更新もPharファイルを
  - kind: para
    text: ダウンロードするだけ！ 超カンタン
  - kind: para
    text: ただし、PHPの実行環境は必要
  - kind: para
    text: ファイルをダウンロードして
  - kind: para
    text: mv phan.phar ~/local/bin/phan
  - kind: para
    text: chmod +x ~/local/bin/phan
  p55:
  - kind: heading
    level: 1
    text: Dockerのメリット
  - kind: para
    text: Dokcerの動く環境なら超カンタン！
  - kind: para
    text: Phan 0.9.4を最後に音沙汰がない…
  - kind: para
    text: まあPHP7.1サポートされてるし動く
  - kind: para
    text: けど…
  p56:
  - kind: heading
    level: 1
    text: Composerのメリット
  - kind: para
    text: あるかなあ… (疑問)
  - kind: para
    text: どうしてもPhanのHEADを
  - kind: para
    text: 攻めたいならComposerで入れる
  - kind: para
    text: composer require --dev でプロジェ
  - kind: para
    text: クトに入れるのはオススメしない
  - kind: para
    text: やるなら composer global require
  p57:
  - kind: para
    text: どうやって
  - kind: para
    text: 動かすの
  p58:
  - kind: heading
    level: 1
    text: Composerの初期設定
  - kind: para
    text: プロジェクトルートがある場所で
  - kind: para
    text: phan --init を実行すると
  - kind: para
    text: .phan/config.php が自動生成される
  - kind: para
    text: phan -o phan.log のように実行する
  - kind: para
    text: とphan.logに行区切りのレポートが
  - kind: para
    text: 表示される
  p59:
  - kind: para
    text: Phan以外の
  - kind: para
    text: 最近の動向
  p60:
  - kind: para
    text: PHPStan
  p61:
  - kind: heading
    level: 1
    text: PHPStan
  - kind: para
    text: Phanとキャラかぶりしてるので
  - kind: para
    text: 比較されがち
  - kind: para
    text: Phanが全体を解析するのが基本で遅
  - kind: para
    text: いけど、PHPStanはファイルごとに
  - kind: para
    text: 解析するとかに向いてる
  p62:
  - kind: heading
    level: 1
    text: PHPStan
  - kind: para
    text: PullRequestごとにテストするなら
  - kind: para
    text: PhanよりもPHPStan
  - kind: para
    text: 高速に解析できるので、作業中に
  - kind: para
    text: 常時解析しまくってもよい
  - kind: para
    text: Emacsで編集中に表示すると
  - kind: para
    text: PhpStormっぽくなるぞ！！！１
  - kind: para
    text: https://github.com/emacs-php/phpstan.el
  p63:
  - kind: para
    text: Phpactor
  p64: []
  p65:
  - kind: heading
    level: 1
    text: Phpactor
  - kind: para
    text: これも静的解析ツールだけど、
  - kind: para
    text: 補完や定義ジャンプ、定義の挿入や
  - kind: para
    text: リファクタリングなどのエディタ向
  - kind: para
    text: けのツールセットを提供
  - kind: para
    text: いままでリファクタリングは
  - kind: para
    text: PhpStorm独擅場だったが、
  - kind: para
    text: これを崩せるポテンシャルがある
  p66:
  - kind: heading
    level: 1
    text: Phpactor
  - kind: para
    text: エディタに依存しない操作
  - kind: para
    text: 標準でvimプラグインがある
  - kind: para
    text: Emacs版の実装は私が開発中
  - kind: para
    text: https://github.com/emacs-php/phpactor.el
  - kind: para
    text: オレオレ
  - kind: para
    text: 開発中感はあるけど、いちおう動く
  p67:
  - kind: para
    text: 最後に
  p68: []
