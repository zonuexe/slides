  p27:
  - node: p
    children:
    - node: bold
      content: ' '
    - node: text
      content: は
  - node: p
    children:
    - node: text
      content: php -l
    - node: br
    - node: bold
      content: 静的解析
  p28: []
  p29:
  - node: p
    children:
    - node: bold
      content: PHPStan
    - node: text
      content: は
    - node: br
    - node: bold
      content: 実行時情報を使って
    - node: br
    - node: bold
      content: 静的解析する
  p30:
  - node: p
    children:
    - node: bold
      content: Phan
    - node: text
      content: は
  - node: p
    children:
    - node: bold
      content: コードを実行せず
    - node: br
    - node: bold
      content: 静的解析する
  p31:
  - node: p
    children:
    - node: bold
      content: 得意なことが
    - node: br
    - node: bold
      content: ちょっと異なる
  p32:
  - node: p
    children:
    - node: bold
      content: 導入しやすさも
    - node: text
      content: ' '
    - node: bold
      content: ちょっと異なる
  p33:
  - node: p
    children:
    - node: bold
      content: '@tadsanは'
  - node: p
    children:
    - node: text
      content: も も
  - node: p
    children:
    - node: text
      content: PHPStan Phan
    - node: br
    - node: bold
      content: 両方使ってます
  p34:
  - node: p
    children:
    - node: bold
      content: 詳しいことは
    - node: br
    - node: bold
      content: 直接きいて
  p35:
  - node: p
    children:
    - node: bold
      content: (ここまで5分)
  p36:
  - node: p
    children:
    - node: bold
      content: Phanを使って
    - node: br
    - node: bold
      content: できること
  p37:
  - node: p
    children:
    - node: bold
      content: 説明
  p38:
  - node: p
    children:
    - node: bold
      content: '“Phan is a static analyzer for PHP that '
  - node: p
    children:
    - node: bold
      content: 'prefers to minimize false-positives. '
    - node: br
    - node: bold
      content: 'Phan attempts to prove incorrectness rather '
    - node: br
    - node: bold
      content: than correctness.”
  - node: p
    children:
    - node: bold
      content: https://github.com/phan/phan
  p39:
  - node: p
    children:
    - node: text
      content: Phanは偽陽性を最小化することを
    - node: br
    - node: bold
      content: “
  - node: p
    children:
    - node: text
      content: 好むPHP静的解析器です。
  - node: p
    children:
    - node: text
      content: Phanは正しいと証明することよりも
    - node: br
    - node: text
      content: 誤りであることを証明しようとします。
  - node: p
    children:
    - node: bold
      content: ”
  - node: p
    children:
    - node: bold
      content: https://github.com/phan/phan
  p40:
  - node: p
    children:
    - node: text
      content: Phanでエラーが
  - node: p
    children:
    - node: text
      content: 検出されなければ
  - node: p
    children:
    - node: text
      content: 正しく動く…
    - node: bold
      content: ' わけではない'
  p41:
  - node: p
    children:
    - node: text
      content: Phanでエラーが
  - node: p
    children:
    - node: text
      content: 検出されるから
  - node: p
    children:
    - node: text
      content: コードは動かない…
    - node: bold
      content: ' '
    - node: br
    - node: bold
      content: わけではない
  p42:
  - node: p
    children:
    - node: text
      content: 「動かないかもしれない」
  - node: p
    children:
    - node: text
      content: ちゃんとしてないコード
    - node: br
    - node: text
      content: から怪しい箇所を検出する
    - node: br
    - node: text
      content: のに強い
  p43:
  - node: p
    children:
    - node: bold
      content: で、Phanは何を
    - node: text
      content: ' '
    - node: bold
      content: やってくれるの？
  p44:
  - node: p
    children:
    - node: bold
      content: ざっくり
  p45:
  - node: p
    children:
    - node: bold
      content: 要はPhpStormを
    - node: text
      content: ' '
    - node: bold
      content: 使ってできるよう
    - node: br
    - node: bold
      content: な検査ができる
  p46:
  - node: p
    children:
    - node: bold
      content: ざっくりとPhanのできること
  - node: p
    children:
    - node: text
      content: '存在しないクラスやメソッドの使用 '
    - node: br
    - node: text
      content: '引数の型のミスマッチや過不足 '
    - node: br
    - node: text
      content: 'コードとPHPDocの不整合 '
    - node: br
    - node: text
      content: '存在しないプロパティのアクセス '
    - node: br
    - node: text
      content: 'PHP7と非互換な文法 '
    - node: br
    - node: text
      content: 非推奨な機能の使用 (@deprecated)
  p47:
  - node: p
    children:
    - node: bold
      content: 比較的最近実装された機能
  - node: p
    children:
    - node: text
      content: 'LSP (Language Server Protocol) '
    - node: br
    - node: text
      content: 'VSCなどから利用できる '
    - node: br
    - node: text
      content: '設定ファイルの自動生成 '
    - node: br
    - node: text
      content: 'composer.jsonからの設定取り込み '
    - node: br
    - node: text
      content: 未使用変数・デッドコード検出機能
  p48:
  - node: p
    children:
    - node: bold
      content: 型
  - node: p
    children:
    - node: text
      content: 'PSR-5(abandoned) 型表記を実装 '
    - node: br
    - node: text
      content: '@param @return @var @method'
  - node: p
    children:
    - node: text
      content: ',  ,  ,   '
  - node: p
    children:
    - node: text
      content: '@property @phan-'
  - node: p
    children:
    - node: text
      content: ' に優先する   '
  - node: p
    children:
    - node: text
      content: '付きのPHPDocタグが追加 '
    - node: br
    - node: text
      content: '独自の拡張形式で型を記述できる '
    - node: br
    - node: text
      content: 'Closure(int|array): (int[]) '
    - node: br
    - node: text
      content: '@phan-param array{field:string}'
  p49:
  - node: p
    children:
    - node: bold
      content: Phanを
    - node: br
    - node: bold
      content: 導入しよう
  p50:
  - node: p
    children:
    - node: bold
      content: 三択
  p51:
  - node: p
    children:
    - node: bold
      content: A. Phar
  - node: p
    children:
    - node: bold
      content: アーカイブ
  - node: p
    children:
    - node: bold
      content: (超おてがる)
  - node: p
    children:
    - node: bold
      content: B. Docker
    - node: br
    - node: bold
      content: '(ただしバージョン古すぎる) '
    - node: br
    - node: bold
      content: C. Composer
  - node: p
    children:
    - node: bold
      content: (依存関係の管理がだるい)
  p52:
  - node: p
    children:
    - node: bold
      content: A. Phar
  - node: p
    children:
    - node: bold
      content: アーカイブ
  - node: p
    children:
    - node: bold
      content: (超おてがる)
  - node: p
    children:
    - node: bold
      content: B. Docker
    - node: br
    - node: bold
      content: '(ただしバージョン古すぎる) '
    - node: br
    - node: bold
      content: C. Composer
  - node: p
    children:
    - node: bold
      content: (依存関係の管理がだるい)
  p53: []
  p54:
  - node: p
    children:
    - node: bold
      content: Pharアーカイブのメリット
  - node: p
    children:
    - node: text
      content: 導入も更新もPharファイルを
    - node: br
    - node: text
      content: 'ダウンロードするだけ！ '
    - node: bold
      content: 超カンタン
    - node: text
      content: ' '
  - node: p
    children:
    - node: text
      content: 'ただし、PHPの実行環境は必要 '
  - node: p
    children:
    - node: text
      content: ファイルをダウンロードして
    - node: br
    - node: text
      content: mv phan.phar ~/local/bin/phan
  - node: p
    children:
    - node: text
      content: chmod +x ~/local/bin/phan
  p55:
  - node: p
    children:
    - node: bold
      content: Dockerのメリット
  - node: p
    children:
    - node: text
      content: 'Dokcerの動く環境なら超カンタン！ '
  - node: p
    children:
    - node: text
      content: Phan 0.9.4を最後に音沙汰がない… まあPHP7.1サポートされてるし動く
    - node: br
    - node: text
      content: けど…
  p56:
  - node: p
    children:
    - node: bold
      content: Composerのメリット
  - node: p
    children:
    - node: text
      content: 'あるかなあ… (疑問) '
  - node: p
    children:
    - node: text
      content: 'どうしてもPhanのHEADを '
    - node: br
    - node: text
      content: '攻めたいならComposerで入れる '
  - node: p
    children:
    - node: text
      content: composer require --dev
  - node: p
    children:
    - node: text
      content: ' でプロジェ'
  - node: p
    children:
    - node: text
      content: クトに入れるのは
    - node: bold
      content: オススメしない
    - node: text
      content: ' '
  - node: p
    children:
    - node: text
      content: composer global require
  - node: p
    children:
    - node: text
      content: 'やるなら '
  p57:
  - node: p
    children:
    - node: bold
      content: どうやって
    - node: br
    - node: bold
      content: 動かすの
  p58:
  - node: p
    children:
    - node: bold
      content: Composerの初期設定
  - node: p
    children:
    - node: text
      content: プロジェクトルートがある場所で
  - node: p
    children:
    - node: text
      content: phan --init
  - node: p
    children:
    - node: text
      content: ' を実行すると'
  - node: p
    children:
    - node: text
      content: .phan/config.php
  - node: p
    children:
    - node: text
      content: ' が自動生成される '
  - node: p
    children:
    - node: text
      content: phan -o phan.log
  - node: p
    children:
    - node: text
      content: ' のように実行する'
  - node: p
    children:
    - node: text
      content: phan.log
    - node: br
    - node: text
      content: と に行区切りのレポートが
    - node: br
    - node: text
      content: 表示される
  p59:
  - node: p
    children:
    - node: bold
      content: Phan以外の
    - node: text
      content: ' '
    - node: bold
      content: 最近の動向
  p60:
  - node: p
    children:
    - node: bold
      content: PHPStan
  p61:
  - node: p
    children:
    - node: bold
      content: PHPStan
  - node: p
    children:
    - node: text
      content: Phanとキャラかぶりしてるので
    - node: br
    - node: text
      content: '比較されがち '
    - node: br
    - node: text
      content: Phanが全体を解析するのが基本で遅 いけど、PHPStanはファイルごとに
    - node: br
    - node: text
      content: 解析するとかに向いてる
  p62:
  - node: p
    children:
    - node: bold
      content: PHPStan
  - node: p
    children:
    - node: text
      content: PullRequestごとにテストするなら
    - node: br
    - node: text
      content: 'PhanよりもPHPStan '
  - node: p
    children:
    - node: text
      content: 高速に解析できるので、作業中に
    - node: br
    - node: text
      content: '常時解析しまくってもよい '
    - node: br
    - node: text
      content: Emacsで編集中に表示すると
  - node: p
    children:
    - node: text
      content: PhpStormっぽくなるぞ！！！１ https://github.com/emacs-php/phpstan.el
  p63:
  - node: p
    children:
    - node: bold
      content: Phpactor
  p64: []
  p65:
  - node: p
    children:
    - node: bold
      content: Phpactor
  - node: p
    children:
    - node: text
      content: これも静的解析ツールだけど、
    - node: br
    - node: text
      content: 補完や定義ジャンプ、定義の挿入や リファクタリングなどのエディタ向
    - node: br
    - node: text
      content: 'けのツールセットを提供 '
    - node: br
    - node: text
      content: いままでリファクタリングは
  - node: p
    children:
    - node: text
      content: PhpStorm独擅場だったが、
    - node: br
    - node: text
      content: これを崩せるポテンシャルがある
  p66:
  - node: p
    children:
    - node: bold
      content: Phpactor
  - node: p
    children:
    - node: text
      content: 'エディタに依存しない操作 標準でvimプラグインがある Emacs版の実装は私が開発中 '
    - node: br
    - node: text
      content: 'https://github.com/emacs-php/phpactor.el '
    - node: br
    - node: text
      content: 'オレオレ '
    - node: br
    - node: text
      content: 開発中感はあるけど、いちおう動く
  p67:
  - node: p
    children:
    - node: bold
      content: 最後に
  p68: []
