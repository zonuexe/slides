  p101:
  - kind: heading
    level: 1
    text: クラスローダの実装(1)
  - kind: para
    text: final class ClassLoader {
  - kind: para
    text: /** @var array<string,string> */
  - kind: para
    text: private $directories = [];
  - kind: para
    text: 'public function add(string $prefix, string $directory): void {'
  - kind: para
    text: $this->directories[$prefix] = $directory;
  - kind: para
    text: '}'
  - kind: para
    text: public function register(bool $prepend = false) {
  - kind: para
    text: spl_autoload_register([$this, 'autoload'], true, $prepend);
  - kind: para
    text: '}'
  - kind: para
    text: 'public function autoload(string $class): void {'
  - kind: para
    text: $path = $this->_resolve($class);
  - kind: para
    text: if ($path !== null) {
  - kind: para
    text: require_once $path;
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p102:
  - kind: heading
    level: 1
    text: クラスローダの実装(2)
  - kind: para
    text: 'private function _resolve(string $class): ?string {'
  - kind: para
    text: foreach ($this->directories as $prefix => $dir) {
  - kind: para
    text: if (strpos($class, $prefix) !== 0) {
  - kind: para
    text: continue;
  - kind: para
    text: '}'
  - kind: para
    text: $path = $this->_makePath($class, $prefix, $dir);
  - kind: para
    text: if (is_file($path)) {
  - kind: para
    text: return $path;
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  - kind: para
    text: return null;
  - kind: para
    text: '}'
  - kind: para
    text: 'private function _makePath($class, $prefix, $directory): string {'
  - kind: para
    text: $relative = substr($class, strlen($prefix));
  - kind: para
    text: $path = strtr($relative, '\\', '/') . '.php';
  - kind: para
    text: return $directory . DIRECTORY_SEPARATOR . $path;
  - kind: para
    text: '}'
  - kind: para
    text: '}'
