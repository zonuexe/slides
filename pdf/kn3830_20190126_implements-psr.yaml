  - kind: para
    text: StyleCI https://styleci.io
  p81:
  - kind: heading
    level: 1
    text: PHP-CS-Fixerの設定例
  - kind: para
    text: <?php
  - kind: para
    text: $finder = PhpCsFixer\Finder::create()
  - kind: para
    text: ->in(__DIR__ . '/src')
  - kind: para
    text: ->in(__DIR__ . '/tests');
  - kind: para
    text: 定義開始行と { を同じ行に
  - kind: para
    text: タブでインデント
  - kind: para
    text: return PhpCsFixer\Config::create()
  - kind: para
    text: ->setRules([
  - kind: para
    text: '''@PSR1'' => true,'
  - kind: para
    text: '''@PSR2'' => true,'
  - kind: para
    text: '''braces'' => ['
  - kind: para
    text: '''position_after_functions_and_oop_constructs'' => ''same'','
  - kind: para
    text: '],'
  - kind: para
    text: '])'
  - kind: para
    text: ->setFinder($finder)
