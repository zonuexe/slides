        $_min_level;  /**   * @param resource $fp   * @param ?string $min_level   */  public
        function __construct($fp, $min_level = null) {   $this->_fp = $fp;   $this->_min_level
        = $min_level ?? LogLevel::WARNING;  }  public function log($level, $message,
        array $context = []) {   if (to_num($level) <= to_num($this->_min_level))
