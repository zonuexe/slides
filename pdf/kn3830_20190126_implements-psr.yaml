  p51:
  - kind: para
    text: 前提
  - kind: para
    text: PHP 5.0からクラスのオート
  - kind: para
    text: ローディング(遅延ロード)に対応
  - kind: para
    text: =必要あるまで読み込まない
  - kind: para
    text: それ以前はinclude_pathから
  - kind: para
    text: include/require(_once)が主流
  p52:
  - kind: para
    text: ざっくりPSR-0
  - kind: para
    text: クラス名の構造の規則
  - kind: para
    text: \<Vendor Name>\(<Namespace>\)*<Class Name>
  - kind: para
    text: _ 区切りの擬似名前空間も許容
  - kind: para
    text: \<Vendor Name>_(<Namespace>_)*<Class Name>
  p53:
  - kind: heading
    level: 1
    text: ディレクトリ配置
  - kind: para
    text: .
  - kind: para
    text: '!"" Hoge'
  - kind: para
    text: '!"" Fuga'
  - kind: para
    text: '!"" Piyo.php'
  - kind: para
    text: class Hoge_Fuga_Piyo {}
  - kind: para
    text: // または
  - kind: para
    text: namespace Hoge\Fuga;
  - kind: para
