  p99:
  - kind: para
    text: PSR-0との差異
  - kind: para
    text: prefixとbase directory
  - kind: para
    text: という概念が導入された
  - kind: para
    text: \A\B\C\D というクラス
  - kind: para
    text: 'PSR-0: src/A/B/C/D.php'
  - kind: para
