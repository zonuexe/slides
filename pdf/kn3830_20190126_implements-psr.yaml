  p93:
  - kind: heading
    level: 1
    text: 行区切りJSON出力するロガー
  - kind: para
    text: final class FileLogger implements LoggerInterface {
  - kind: para
    text: use LoggerTrait;
  - kind: para
    text: /** @var resource */
  - kind: para
    text: private $_fp;
  - kind: para
    text: /** @var string */
  - kind: para
    text: private $_min_level;
  - kind: para
    text: /**
  - kind: para
    text: '* @param resource $fp'
  - kind: para
    text: '* @param ?string $min_level'
  - kind: para
    text: '*/'
  - kind: para
    text: public function __construct($fp, $min_level = null) {
  - kind: para
    text: $this->_fp = $fp;
  - kind: para
    text: $this->_min_level = $min_level ?? LogLevel::WARNING;
  - kind: para
    text: '}'
  - kind: para
    text: public function log($level, $message, array $context = []) {
  - kind: para
    text: if (to_num($level) <= to_num($this->_min_level)) {
  - kind: para
    text: $log = json_encode(['level' => $level, 'message' => $message, 'context'
      => $context],
  - kind: para
    text: 'JSON_UNESCAPED_SLASHES) ?: ''{"json_encode_error":true}}'';'
  - kind: para
    text: fputs($this->_fp, $log);
  - kind: para
    text: fputs($this->_fp, "\n");
