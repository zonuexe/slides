text:
  p1:
  - kind: heading
    level: 1
    text: PSRを実装してみる
  - kind: para
    text: Let's implement PSR(PHP Standards Recommendations)
  - kind: para
    text: '2019-01-26 PHP Conference Sendai Sendai, Miyagi, Japan #phpconsen'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: 今回の目的
  p6:
  - kind: para
    text: PSRって何のためにあるの
  p7:
  - kind: para
    text: 強い人たちと話すとPSRの不満についての愚痴を聞くけれども、なるほどわからん
  p8:
  - kind: para
    text: わかりたい
  p9:
  - kind: para
    text: それを明らかにしたいと思い、われわれ取材班は仙台へと旅立った
  p10:
  - kind: para
    text: でも、英語も仕様書を読むのも苦手だお…
  p11:
  - kind: para
    text: '|＼ __ ／ ﾋﾟｺｰﾝ＿ （ｍ） ＿ そうだ、実装しながら理解しよう|ミ|／ ｀´ ＼(''A`)ノヽノヽくく'
  p12:
  - kind: para
    text: 実装
  p13:
  - kind: para
    text: 仕様を雑に読む→よくわからないのでぐぐる→既存実装を読んでみる→雑に実装してみる→(以下ループ)
  p14:
  - kind: para
    text: 背景
  p15:
  - kind: para
    text: PHPのコンポーネントを作って提供してる組織は意外とたくさんある
  p16: []
  p17: []
  p18: []
  p19: []
  p20: []
  p21: []
  p22:
  - kind: para
    text: たくさんあるのはいいが大同小異、同じようなものが乱立してると困る
  p23:
  - kind: para
    text: 使い回せるものがあるなら折角だから相互運用したい
  p24:
  - kind: para
    text: そのような現状でPSRは何を提供しているのか、実装しながら見てみよう
  p25:
  - kind: para
    text: おしながき
  p26:
  - kind: para
    text: PHP-FIGについてPSR-0 PSR-3 PSR-1 PSR-6 PSR-2 PSR-13そのほかのPSR
  p27:
  - kind: para
    text: ここから駆け足になるので最初にまとめ
  p28:
  - kind: para
    text: PSRにナンバリングされてるからと言って高品質で優先すべき対象とは限らない
  p29:
  - kind: heading
    level: 1
    text: PHP-FIG
  - kind: para
    text: フレームワーク相互運用グループ
  p30: []
  p31:
  - kind: para
    text: PSRを策定する団体
  p32:
  - kind: para
    text: フレームワーク/CMS/そのほかPHP関連開発者の寄合所帯
  p33:
  - kind: para
    text: さっき挙げた団体の全てが加盟してるわけではない
  p34:
  - kind: para
    text: 抜けちゃったところもいろいろある
  p35:
  - kind: para
    text: Zend,CakePHP,Yii, Drupal, Slimなど多数
  p36:
  - kind: para
    text: Guzzle, Doctrine,Symfony, Laravel,The PHP Leagueは脱退済み
  p37:
  - kind: para
    text: 脱退したからと言ってPSRを尊重してないわけではない
  p38:
  - kind: heading
    level: 1
    text: PSR
  - kind: para
    text: PHP標準勧告
  p39:
  - kind: para
    text: ｢勧告｣と名前はついてるがPHP本体とは関係なく､有志による規格
  p40:
  - kind: para
    text: グループの背景にある考えは、代表者たちがプロジェクト間の共通点について話し合うことで協働する方法を探ることです。
  - kind: para
    text: グループの議論の主な観客は参加プロジェクト同士ですが、そのほかのPHPコミュニティも注目していることはよく承知しています。ほかの人々がPSRの成果物を採用することは歓迎しますが、それは目的ではありません。
  p41:
  - kind: para
    text: 投票メンバーは標準を遵守しなければいけませんか？
  - kind: para
    text: いいえ。PHP-FIGの投票メンバーになることで、すべての、あるいは任意のPSRを実装することを強制されることはありません。プロジェクトはしかるべき時にアップグレードする際に後方互換性を考慮する必要があります。ほとんどのプロジェクトで最終的に採用されると想定されますが、必須ではありません。
  p42:
  - kind: para
    text: 勧告される対象は我々下々のPHPer各位ではなくPHP-FIGに任意で参加した団体
  p43:
  - kind: para
    text: 勧告された参加団体がPSRを準拠することもまた任意
  p44:
  - kind: para
    text: 脱退したはずの団体がPSRを準拠することもまた任意
  p45:
  - kind: para
    text: PSR自体が、ベストプラクティスを標榜してたりもするけど…？
  p46:
  - kind: para
    text: それはそれこれはこれ
  p47: []
  p48:
  - kind: heading
    level: 1
    text: PSR-0
  - kind: para
    text: Autoloading Standard
  p49:
  - kind: heading
    level: 2
    text: 失効済み！！！
  - kind: heading
    level: 1
    text: PSR-0
  - kind: para
    text: Autoloading Standard
  p50:
  - kind: para
    text: オートロードに適合したクラスの命名規則とファイルの配置
  p51:
  - kind: para
    text: 前提
  - kind: para
    text: PHP 5.0からクラスのオートローディング(遅延ロード)に対応
  - kind: para
    text: =必要あるまで読み込まない
  - kind: para
    text: それ以前はinclude_pathからinclude/require(_once)が主流
  p52:
  - kind: para
    text: ざっくりPSR-0
  - kind: para
    text: クラス名の構造の規則
  - kind: para
    text: \<Vendor Name>\(<Namespace>\)*<Class Name>
  - kind: para
    text: _ 区切りの擬似名前空間も許容
  - kind: para
    text: \<Vendor Name>_(<Namespace>_)*<Class Name>
  p53:
  - kind: heading
    level: 1
    text: ディレクトリ配置
  - kind: para
    text: .!"" Hoge!"" Fuga!"" Piyo.php
  - kind: para
    text: class Hoge_Fuga_Piyo {}
  - kind: para
    text: // または
  - kind: para
    text: namespace Hoge\Fuga;class Piyo{}
  p54:
  - kind: para
    text: 実装依存になる部分
  - kind: para
    text: ファイルシステム依存
  - kind: para
    text: 大文字小文字の差異
  - kind: para
    text: Unicode NFD問題
  p55:
  - kind: para
    text: 曖昧な部分
  - kind: para
    text: 「ベンダー名」って何…？
  - kind: para
    text: 自由に決められるので、ただの紳士協定に過ぎない
  - kind: para
    text: トップレベルのクラス定義を戒める効果はある(?)
  p56:
  - kind: para
    text: 実装方式
  - kind: para
    text: 'A: クラスマップ方式'
  - kind: para
    text: 実行前にディレクトリ構造をスキャンして対応表を作成
  - kind: para
    text: 'B: 逐次確認'
  - kind: para
    text: 実行時にファイルシステムを検査
  p57:
  - kind: heading
    level: 1
    text: PSR-0準拠クラスローダー関数
  - kind: para
    text: 'function add_directory(string $base_dir): void {'
  - kind: para
    text: $directory = rtrim($base_dir, '/\\');
  - kind: para
    text: spl_autoload_register(function ($fqcn) use ($base_dir) {
  - kind: para
    text: $namespaces = explode('\\', $fqcn);$class = array_pop($namespaces);$class_file
      = strtr($class, ['_' => '/']) .'.php';
  - kind: para
    text: $ns_dir = implode('/', $namespaces);$file_path = implode(‘/',array_filter([$base_dir,
      $ns_dir, $class_file], 'strlen'));
  - kind: para
    text: if (is_file($file_path)) {
  - kind: para
    text: require_once $file_path;}});}
  p58:
  - kind: para
    text: 現状
  - kind: para
    text: 以前はライブラリごとにクラスローダーを提供してた
  - kind: para
    text: Requests::register_autoloader() など
  - kind: para
    text: 最近はComposerがオートロード機能を提供してくれるのでcomposer.jsonに書くだけ
  p59:
  - kind: para
    text: 重要
  - kind: para
    text: PSR-0はPSR-4で代替されたので廃止済み
  p60:
  - kind: para
    text: Composer以前
  - kind: para
    text: PEARでインストールする
  - kind: para
    text: zipをダウンロードして、そのディレクトリをinclude_pathに追加する
  - kind: para
    text: 同じホスト上で動作する別のPHPプロジェクトと共用されることも
  p61:
  - kind: para
    text: Composer以後
  - kind: para
    text: 依存パッケージはプロジェクト内のサブディレクトリにインストール
  - kind: para
    text: 同じホスト上で動作する別のプロジェクトと混在することは原則ない
  p62:
  - kind: heading
    level: 1
    text: PSR-1
  - kind: para
    text: Basic Coding Standard
  p63:
  - kind: para
    text: 基本的な(＝相互運用のため重要度の高い)コーディング規約
  p64:
  - kind: para
    text: 要件
  - kind: para
    text: 名前空間・クラス名はPSR-4/0に適合するように
  - kind: para
    text: 文字コードはUTF-8(BOM無)
  - kind: para
    text: クラス定義で副作用を起こしてはいけない
  p65:
  - kind: para
    text: 命名規則
  - kind: para
    text: クラス名はUpperCamelCase
  - kind: para
    text: 定数名はUPPER_SNAKE_CASE
  - kind: para
    text: メソッド名はlowerCamelCase
  - kind: para
    text: 変数・プロパティは規定しない
  p66:
  - kind: para
    text: 理由
  - kind: para
    text: ｢あるクラスがロードされた副作用として別のファイルが読み込まれる｣のような挙動はわかりにくい
  - kind: para
    text: 最低限のもの以外はinclude/requireせずに遅延ロードに任せるのが無難
  p67:
  - kind: heading
    level: 1
    text: こういうコードはだめ
  - kind: para
    text: <?php /** Foo/Bar.php */
  - kind: para
    text: // 別のファイルを読み込もうとするinclude_once __DIR__ . "/foo.php";
  - kind: para
    text: // エラーレベルを変更error_reporting(0);
  - kind: para
    text: class Foo{// ...}
  p68:
  - kind: para
    text: 「実装します」といった感じのものではないので
  - kind: heading
    level: 1
    text: 次
  p69:
  - kind: heading
    level: 1
    text: PSR-2
  - kind: para
    text: Coding Style Guide
  p70:
  - kind: para
    text: コーディングスタイルのガイドライン
  p71:
  - kind: para
    text: 要件
  - kind: para
    text: プロジェクト内で表記を一貫して意識のずれを低減する
  - kind: para
    text: PSR-1に準拠することが前提
  - kind: para
    text: さまざまなプロジェクトのコーディングスタイルを調査した上で策定
  p72:
  - kind: para
    text: ホワイトスペース・インデント
  - kind: para
    text: インデントは4スペースが基本
  - kind: para
    text: 単項演算子以外の演算子や()の前後にはスペースを入れる
  - kind: para
    text: 改行コードはLF
  - kind: para
    text: 一行あたりの文字数は80文字を推奨、120文字以上は警告
  p73:
  - kind: heading
    level: 1
    text: ざっくり
  - kind: para
    text: ← 改行する
  - kind: para
    text: ← 改行する
  - kind: para
    text: ← 改行しない
  - kind: para
    text: ← 改行しない
  - kind: para
    text: class Foo{public function bar($xs){foreach ($xs as $x) {$f = function ($a)
      use ($x) {// ...};}}}
  p74:
  - kind: para
    text: '{} と改行位置の癖'
  - kind: para
    text: 宣言文(class, function, namespaceなど)の開始行と { の間は改行する
  - kind: para
    text: それ以外の文(if, foreachなど)は改行せず、開始行に { を書く
  - kind: para
    text: 無名関数は文ではなく式なので改行せず、開始行に { を書く
  p75:
  - kind: para
    text: 重要なこと
  p76:
  - kind: para
    text: スタイルルールは、様々なプロジェクトの共通内容から生み出されています。 様々な作者が複数プロジェクトを横断して協力しあうことで、全てのプロジェクトで有用なガイドライン策定の助けとなります。
      従って、このガイド本来の利点は、ルール自体にはなくルールを共有することにあります。
  - kind: para
    text: http://www.inﬁniteloop.co.jp/docs/psr/psr-2-coding-style-guide.html
  p77:
  - kind: para
    text: 7. その他 本スタイルガイドでは、意図的に省略しているスタイルやプラクティスが多くあります。 例えば下記のような幾つかについては、ここでは明記していません。（中略）なお、本スタイルガイドは将来的に様々なスタイルやプラクティスの登場に応じて改定・拡張をできるものとします。
  - kind: para
    text: http://www.inﬁniteloop.co.jp/docs/psr/psr-2-coding-style-guide.html
  p78:
  - kind: para
    text: PSR-2はコーディングスタイル策定のガイドライン
  p79:
  - kind: para
    text: PSR-2をカスタマイズする
  - kind: para
    text: 定義文であっても { を同じ行で書くとか
  - kind: para
    text: インデントを8タブにするとか
  - kind: para
    text: 改行コードをCR+LFにするとか
  p80:
  - kind: para
    text: 策定したガイドラインを守らせる
  - kind: para
    text: PHP-CS-Fixerを導入する
  - kind: para
    text: EditorConfigを導入する
  - kind: para
    text: PhpStormの設定ファイルを共有
  - kind: para
    text: StyleCI https://styleci.io
  p81:
  - kind: heading
    level: 1
    text: PHP-CS-Fixerの設定例
  - kind: para
    text: <?php
  - kind: para
    text: $finder = PhpCsFixer\Finder::create()->in(__DIR__ . '/src')->in(__DIR__
      . '/tests');
  - kind: para
    text: 定義開始行と { を同じ行に
  - kind: para
    text: タブでインデント
  - kind: para
    text: return PhpCsFixer\Config::create()->setRules(['@PSR1' => true,'@PSR2' =>
      true,'braces' => ['position_after_functions_and_oop_constructs' => 'same',],])->setFinder($finder)->setIndent("\t")->setLineEnding("\n");
  p82:
  - kind: heading
    level: 1
    text: .editorconfig
  - kind: para
    text: '# EditorConfig is awesome: http://EditorConfig.org'
  - kind: para
    text: '# top-most EditorConfig file root = true'
  - kind: para
    text: '# Unix-style newlines with a newline ending every file[*]end_of_line =
      lf insert_final_newline = true charset = utf-8'
  - kind: para
    text: タブでインデント
  - kind: para
    text: 幅8で表示
  - kind: para
    text: '# PHP - http://php.net/[*.php]indent_style = tab indent_size = 8'
  p83:
  - kind: para
    text: PhpStormの設定ファイルを共有
  - kind: para
    text: PhpStormが生成する.ideaは一部ファイルを除き、共有した方がいいらしい
  - kind: para
    text: 'github/gitignore: JetBrains.gitignore'
  - kind: para
    text: 特に.idea/codeStyles/Project.xmlがコーディングスタイル
  p84:
  - kind: para
    text: 大事なこと
  - kind: para
    text: コーディングスタイルは人間がレビューであれこれと指図したりするよりも、機械的に変換したほうがギクシャクせずに済む
  - kind: para
    text: ｢人間が気をつける｣は破綻する
  - kind: para
    text: ｢自然にそうなる｣ 状態が理想
  p85:
  - kind: para
    text: PSR-2の現状
  - kind: para
    text: 初版が2012年6月なので、PHP7の時代には不足気味
  - kind: para
    text: 可変長引数、無名クラスとか
  - kind: para
    text: 現在、後継となるPSR-12 Extended Coding Style Guideが策定作業中
  p86:
  - kind: heading
    level: 1
    text: PSR-3
  - kind: para
    text: Logger Interface
  p87:
  - kind: para
    text: Syslog風のLoggerインターフェイス
  p88:
  - kind: para
    text: 要件
  - kind: para
    text: Syslogで定義された8種類のレベルごとにログを記録
  - kind: para
    text: 緊急度が高い順からEmergency, Alert, Critical,Error, Warning, Notice,Informational,
      Debug
  p89:
  - kind: para
    text: 実装
  - kind: para
    text: psr/logパッケージに含まれるLoggerTrait/AbstractLoggerを利用して最小限で実装可能
  - kind: para
    text: 今回実装したPSRのなかでは機能がわかりやすく実装が簡単なので初心者にオススメ
  p90:
  - kind: para
    text: 雑感
  - kind: para
    text: 普通はMonologを使えばいいので代替実装に変更するメリットが全然感じられない
  - kind: para
    text: Monologのハンドラーを実装した方が拡張しやすいので、そちらの方がオススメ
  p91:
  - kind: para
    text: さらに雑感
  - kind: para
    text: WebアプリからSyslogの8種類のレベルはミスマッチ感がある
  - kind: para
    text: 正直、Error, Debug, Infoの3レベルくらいにまとめた方が扱いやすいのでは
  p92:
  - kind: heading
    level: 1
    text: ヘルパー関数
  - kind: para
    text: <?php declare(strict_types=1);
  - kind: para
    text: namespace ZoPsr\Log3;
  - kind: para
    text: use Psr\Log\LogLevel;
  - kind: para
    text: 'function to_num(string $level): int {return [LogLevel::EMERGENCY => 0,LogLevel::ALERT
      => 1,LogLevel::CRITICAL => 2,LogLevel::ERROR => 3,LogLevel::WARNING => 4,LogLevel::NOTICE
      => 5,LogLevel::INFO => 6,LogLevel::DEBUG => 7,][$level];}'
  p93:
  - kind: heading
    level: 1
    text: 行区切りJSON出力するロガー
  - kind: para
    text: final class FileLogger implements LoggerInterface {use LoggerTrait;
  - kind: para
    text: /** @var resource */private $_fp;/** @var string */private $_min_level;
  - kind: para
    text: /*** @param resource $fp* @param ?string $min_level*/public function __construct($fp,
      $min_level = null) {$this->_fp = $fp;$this->_min_level = $min_level ?? LogLevel::WARNING;}
  - kind: para
    text: 'public function log($level, $message, array $context = []) {if (to_num($level)
      <= to_num($this->_min_level)) {$log = json_encode([''level'' => $level, ''message''
      => $message, ''context'' => $context],JSON_UNESCAPED_SLASHES) ?: ''{"json_encode_error":true}}'';fputs($this->_fp,
      $log);fputs($this->_fp, "\n");'
  p94:
  - kind: heading
    level: 1
    text: PSR-4
  - kind: para
    text: Autoloader
  p95:
  - kind: para
    text: オートロードに適合したクラスの命名規則とファイルの配置
  p96:
  - kind: para
    text: PSR-0の後釜
  p97:
  - kind: para
    text: オートロードに適合したクラスの命名規則とファイルの配置
  p98:
  - kind: para
    text: PSR-0との差異
  - kind: para
    text: _を使った擬似名前空間は許容されなくなった
  - kind: para
    text: PSR-0は名前空間に対応するディレクトリを用意しなければならなかったが、PSR-4ではディレクトリを浅くできる
  p99:
  - kind: para
    text: PSR-0との差異
  - kind: para
    text: prefixとbase directoryという概念が導入された
  - kind: para
    text: \A\B\C\D というクラス
  - kind: para
    text: 'PSR-0: src/A/B/C/D.php'
  - kind: para
    text: 'PSR-4: src/D.php'
  - kind: para
    text: Composerを使ってたらお馴染
  p100:
  - kind: heading
    level: 1
    text: ディレクトリ配置
  - kind: para
    text: .!"" src!"" Piyo.php
  - kind: para
    text: .!"" src!"" Fuga!"" Piyo.php
  - kind: para
    text: <?php
  - kind: para
    text: namespace Hoge\Fuga;
  - kind: para
    text: class Piyo{}
  p101:
  - kind: heading
    level: 1
    text: クラスローダの実装(1)
  - kind: para
    text: final class ClassLoader {/** @var array<string,string> */private $directories
      = [];
  - kind: para
    text: 'public function add(string $prefix, string $directory): void {$this->directories[$prefix]
      = $directory;}'
  - kind: para
    text: public function register(bool $prepend = false) {spl_autoload_register([$this,
      'autoload'], true, $prepend);}
  - kind: para
    text: 'public function autoload(string $class): void {$path = $this->_resolve($class);'
  - kind: para
    text: if ($path !== null) {require_once $path;}}
  p102:
  - kind: heading
    level: 1
    text: クラスローダの実装(2)
  - kind: para
    text: 'private function _resolve(string $class): ?string {foreach ($this->directories
      as $prefix => $dir) {if (strpos($class, $prefix) !== 0) {continue;}'
  - kind: para
    text: $path = $this->_makePath($class, $prefix, $dir);
  - kind: para
    text: if (is_file($path)) {return $path;}}
  - kind: para
    text: return null;}
  - kind: para
    text: 'private function _makePath($class, $prefix, $directory): string {$relative
      = substr($class, strlen($prefix));$path = strtr($relative, ''\\'', ''/'') .
      ''.php'';'
  - kind: para
    text: return $directory . DIRECTORY_SEPARATOR . $path;}}
  p103:
  - kind: heading
    level: 1
    text: ディレクトリの追加
  - kind: para
    text: <?php
  - kind: para
    text: use ZoPsr\Autoload4\ClassLoader;use function ZoPsr\TestHelper\capture;
  - kind: para
    text: require_once __DIR__ . '/../../vendor/autoload.php';
  - kind: para
    text: $loader = new ClassLoader;$loader->register(false);
  - kind: para
    text: $loader->add('Foo\\', __DIR__ . '/1');$loader->add('Hoge\\', __DIR__ . '/2');
  p104:
  - kind: para
    text: PSR-4を実装する意味はあるか
  - kind: para
    text: クラス名の規則として重要
  - kind: para
    text: クラスローダは自作せずにComposerを使った方がパフォーマンスの最適化できて便利
  - kind: para
    text: PHPのクラスロードの仕組みを学ぶ上では重要
  p105:
  - kind: heading
    level: 1
    text: PSR-13
  - kind: para
    text: Link definition interfaces
  p106:
  - kind: para
    text: 要件
  - kind: para
    text: ハイパーメディアの「リンク」を抽象化したクラス
  - kind: para
    text: HTMLのとか<link>とか
  - kind: para
    text: HTTPのLinkヘッダとか(RFC5988/8288 WebLinking)
  - kind: para
    text: ……なんだけど
  p107:
  - kind: para
    text: 仕様
  - kind: para
    text: 基本はPSR-7と同じイミュータブルなオブジェクト
  - kind: para
    text: 関連するRFCがやたらある
  - kind: para
    text: 特にRFC6570(URI Template)、それ混ぜる必要あったか…？
  - kind: para
    text: 実装として混ざってるわけではないが、isTemplated()という状態がある
  p108:
  - kind: para
    text: URI Template
  - kind: para
    text: RFC6570
  - kind: para
    text: URIに変数展開するためのテンプレート言語
  - kind: para
    text: これ自体は需要ある規格だが、Linkでテンプレートありなしのhrefを混在させて嬉しいことは……ある？
  p109:
  - kind: para
    text: 既存実装
  - kind: para
    text: crell/htmlmodel
  - kind: para
    text: PSR-13提案者の概念実証
  - kind: para
    text: php-fig/link-util
  - kind: para
    text: PHP-FIGによる実装
  - kind: para
    text: Linkクラスも実装されてる
  - kind: para
    text: あのSymfonyも独自実装してない
  p110:
  - kind: para
    text: 仕様への文句
  - kind: para
    text: isTemplated()
  - kind: para
    text: 必死にユースケースを考えてみたけど、積極的にこの分岐をしたいケースが一切見当たらない
  - kind: para
    text: Symfony\WebLinkでも事実上黙殺されてるように見える
  p111:
  - kind: para
    text: 実装への文句
  - kind: para
    text: isTemplated()
  - kind: para
    text: hrefに { か } のどちらかが含まれてたらURI Template文字列って判定してる
  - kind: para
    text: すごく怪しい
  p112:
  - kind: para
    text: URIの仕様
  - kind: para
    text: https://example.com/{ のようなURIは完全に合法
  - kind: para
    text: '{と}はreservedな文字でもunreservedな文字でもないので、パーセントエンコードされてるとは限らない'
  p113:
  - kind: para
    text: とてもバグりそうな雰囲気が
  - kind: para
    text: 文字列を場当たり的な判定して実行時に分岐するのは、どう考えてもアンチパターン
  - kind: para
    text: せめてTemplatedLinkInterfaceのような別の型で表現するなら気持ちはわかる(けど嬉しくはない)
  p114:
  - kind: para
    text: そのほかのPSR
  p115:
  - kind: para
    text: ここから実装が間に合わなかったPSRについて雑に話します
  p116:
  - kind: para
    text: PSR-7 message interface
  - kind: para
    text: HTTPのリクエスト／レスポンスを抽象化するクラス
  - kind: para
    text: GuzzleのようなHTTPクライアントライブラリには好適
  - kind: para
    text: しかしHTTPミドルウェアの媒介としては辛くないですか
  p117:
  - kind: para
    text: PSR-7とわたし
  - kind: para
    text: Guzzle使ったらPHPでめちゃんこ簡単にHTTPプロキシ鯖を実装できたので好き
  - kind: para
    text: PHPでプロキシサーバーを作る
  - kind: para
    text: PHPのプロキシサーバーを説明する
  p118:
  - kind: para
    text: PSR-6 Caching Interface
  - kind: para
    text: 実は今回は実装してみたけど、特に感情がない
  - kind: para
    text: 業務ではRedisなどのKVSをラップした独自の抽象クラスを使ってるけど、移行する気は特に湧かなかった
  p119:
  - kind: para
    text: PSR-5 PHPDoc (Draft)
  - kind: para
    text: PSRの番号が若いのに長年マージされてない代表格
  - kind: para
    text: 放棄されかけたがAPIドキュメント自動生成よりもIDEや静的解析のデファクト標準として重要なので議論復活した
  p120:
  - kind: para
    text: PSR-5とわたし
  - kind: para
    text: WEB+DB PRESS Vol.87に書いた
  - kind: para
    text: (総集編に収録されてるから買って)
  - kind: para
    text: 2018年のPHPDoc事情とPSR-5
  - kind: para
    text: PhpStorm 2018.3でPSR-5ジェネリクス記法はサポートされない
  p121:
  - kind: para
    text: PSR-5と静的解析
  - kind: para
    text: コード上の記述とPHPDocのコメントを手がかりにして、怪しい部分を高精度で検出してくれる
  - kind: para
    text: Phan, PHPStan, Psalm,PhpStormなどのツールがある
  - kind: para
    text: 今回の実装でも助けられました
  p122:
  - kind: para
    text: PSR-8 Mutually Assured Hug
  - kind: para
    text: 2014年4月1日に提案された
  - kind: para
    text: ｢この標準は､オブジェクトが互いの感謝と支持を表明するための､一般的な方法を確立します｣
  - kind: para
    text: こんなのにPSRの番号の帯域を降ってよかったの…？
  - kind: para
    text: PSR-8 Hug (日本語訳)
