  - kind: para
    text: トップレベルのクラス定義を
  - kind: para
    text: 戒める効果はある(?)
  p56:
  - kind: para
    text: 実装方式
  - kind: para
    text: 'A: クラスマップ方式'
  - kind: para
    text: 実行前にディレクトリ構造を
  - kind: para
    text: スキャンして対応表を作成
  - kind: para
    text: 'B: 逐次確認'
  - kind: para
    text: 実行時にファイルシステムを検査
  p57:
  - kind: heading
    level: 1
    text: PSR-0準拠クラスローダー関数
  - kind: para
    text: 'function add_directory(string $base_dir): void {'
  - kind: para
    text: $directory = rtrim($base_dir, '/\\');
  - kind: para
    text: spl_autoload_register(function ($fqcn) use ($base_dir) {
  - kind: para
    text: $namespaces = explode('\\', $fqcn);
  - kind: para
    text: $class = array_pop($namespaces);
  - kind: para
    text: $class_file = strtr($class, ['_' => '/']) .
  - kind: para
    text: '''.php'';'
  - kind: para
    text: $ns_dir = implode('/', $namespaces);
  - kind: para
    text: $file_path = implode(‘/',
  - kind: para
    text: array_filter([$base_dir, $ns_dir, $class_file], 'strlen'));
  - kind: para
    text: if (is_file($file_path)) {
  - kind: para
    text: require_once $file_path;
  - kind: para
    text: '}'
  - kind: para
    text: '});'
  - kind: para
    text: '}'
  p58:
  - kind: para
    text: 現状
  - kind: para
    text: 以前はライブラリごとに
  - kind: para
    text: クラスローダーを提供してた
  - kind: para
    text: Requests::register_autoloader() など
  - kind: para
    text: 最近はComposerがオートロー
  - kind: para
    text: ド機能を提供してくれるので
  - kind: para
    text: composer.jsonに書くだけ
  p59:
  - kind: para
    text: 重要
  - kind: para
    text: PSR-0はPSR-4で代替された
  - kind: para
    text: ので廃止済み
  p60:
  - kind: para
    text: Composer以前
  - kind: para
    text: PEARでインストールする
  - kind: para
    text: zipをダウンロードして、
  - kind: para
    text: そのディレクトリを
  - kind: para
    text: include_pathに追加する
  - kind: para
    text: 同じホスト上で動作する別のPHP
  - kind: para
    text: プロジェクトと共用されることも
  p61:
  - kind: para
    text: Composer以後
  - kind: para
    text: 依存パッケージはプロジェクト内
  - kind: para
    text: のサブディレクトリにインストール
  - kind: para
    text: 同じホスト上で動作する別の
  - kind: para
    text: プロジェクトと混在すること
  - kind: para
    text: は原則ない
  p62:
  - kind: heading
    level: 1
    text: PSR-1
  - kind: para
    text: Basic Coding Standard
  p63:
  - kind: para
    text: 基本的な(＝相互運用
  - kind: para
    text: のため重要度の高い)
  - kind: para
    text: コーディング規約
  p64:
  - kind: para
    text: 要件
  - kind: para
    text: 名前空間・クラス名は
  - kind: para
    text: PSR-4/0に適合するように
  - kind: para
    text: 文字コードはUTF-8(BOM無)
  - kind: para
    text: クラス定義で副作用を
  - kind: para
    text: 起こしてはいけない
  p65:
  - kind: para
    text: 命名規則
  - kind: para
    text: クラス名はUpperCamelCase
  - kind: para
    text: 定数名はUPPER_SNAKE_CASE
  - kind: para
    text: メソッド名はlowerCamelCase
  - kind: para
    text: 変数・プロパティは規定しない
  p66:
  - kind: para
    text: 理由
  - kind: para
    text: ｢あるクラスがロードされた副
  - kind: para
    text: 作用として別のファイルが読
  - kind: para
    text: み込まれる｣のような挙動は
  - kind: para
    text: わかりにくい
  - kind: para
    text: 最低限のもの以外はinclude/
  - kind: para
    text: requireせずに遅延ロードに
  - kind: para
    text: 任せるのが無難
  p67:
  - kind: heading
    level: 1
    text: こういうコードはだめ
  - kind: para
    text: <?php /** Foo/Bar.php */
  - kind: para
    text: // 別のファイルを読み込もうとする
  - kind: para
    text: include_once __DIR__ . "/foo.php";
  - kind: para
    text: // エラーレベルを変更
  - kind: para
    text: error_reporting(0);
  - kind: para
    text: class Foo
  - kind: para
    text: '{'
  - kind: para
    text: // ...
  - kind: para
    text: '}'
  p68:
  - kind: para
    text: 「実装します」
  - kind: para
    text: といった感じの
  - kind: para
    text: ものではないので
  - kind: heading
    level: 1
    text: 次
  p69:
  - kind: heading
    level: 1
    text: PSR-2
  - kind: para
    text: Coding Style Guide
  p70:
  - kind: para
    text: コーディング
  - kind: para
    text: スタイルの
  - kind: para
    text: ガイドライン
  p71:
  - kind: para
    text: 要件
  - kind: para
    text: プロジェクト内で表記を一貫
  - kind: para
    text: して意識のずれを低減する
  - kind: para
    text: PSR-1に準拠することが前提
  - kind: para
    text: さまざまなプロジェクトのコーディ
  - kind: para
    text: ングスタイルを調査した上で策定
  p72:
  - kind: para
    text: ホワイトスペース・インデント
  - kind: para
    text: インデントは4スペースが基本
  - kind: para
    text: 単項演算子以外の演算子や()
  - kind: para
    text: の前後にはスペースを入れる
  - kind: para
    text: 改行コードはLF
  - kind: para
    text: 一行あたりの文字数は80文字
  - kind: para
    text: を推奨、120文字以上は警告
  p73:
  - kind: heading
    level: 1
    text: ざっくり
  - kind: para
    text: ← 改行する
  - kind: para
    text: ← 改行する
  - kind: para
    text: ← 改行しない
  - kind: para
    text: ← 改行しない
  - kind: para
    text: class Foo
  - kind: para
    text: '{'
  - kind: para
    text: public function bar($xs)
  - kind: para
    text: '{'
  - kind: para
    text: foreach ($xs as $x) {
  - kind: para
    text: $f = function ($a) use ($x) {
  - kind: para
    text: // ...
  - kind: para
    text: '};'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p74:
  - kind: para
    text: '{} と改行位置の癖'
  - kind: para
    text: 宣言文(class, function, namespaceなど)
  - kind: para
    text: の開始行と { の間は改行する
  - kind: para
    text: それ以外の文(if, foreachなど)は
  - kind: para
    text: 改行せず、開始行に { を書く
  - kind: para
    text: 無名関数は文ではなく式なので
  - kind: para
    text: 改行せず、開始行に { を書く
  p75:
  - kind: para
    text: 重要なこと
  p76:
  - kind: para
    text: スタイルルールは、様々なプロジェクトの
  - kind: para
    text: 共通内容から生み出されています。 様々な
  - kind: para
    text: 作者が複数プロジェクトを横断して協力し
  - kind: para
    text: あうことで、全てのプロジェクトで有用な
  - kind: para
    text: ガイドライン策定の助けとなります。 従っ
  - kind: para
    text: て、このガイド本来の利点は、ルール自体
  - kind: para
    text: にはなくルールを共有することにあります。
  - kind: para
    text: http://www.inﬁniteloop.co.jp/docs/psr/psr-2-coding-style-guide.html
  p77:
  - kind: para
    text: 7. その他 本スタイルガイドでは、意図的に
  - kind: para
    text: 省略しているスタイルやプラクティスが多
  - kind: para
    text: くあります。 例えば下記のような幾つかに
  - kind: para
    text: ついては、ここでは明記していません。
  - kind: para
    text: （中略）
  - kind: para
    text: なお、本スタイルガイドは将来的に様々な
  - kind: para
    text: スタイルやプラクティスの登場に応じて改
  - kind: para
    text: 定・拡張をできるものとします。
  - kind: para
    text: http://www.inﬁniteloop.co.jp/docs/psr/psr-2-coding-style-guide.html
  p78:
  - kind: para
    text: PSR-2は
  - kind: para
    text: コーディングスタイル策定の
  - kind: para
    text: ガイドライン
  p79:
  - kind: para
    text: PSR-2をカスタマイズする
  - kind: para
    text: 定義文であっても { を同じ行
  - kind: para
    text: で書くとか
  - kind: para
    text: インデントを8タブにするとか
  - kind: para
    text: 改行コードをCR+LFにするとか
