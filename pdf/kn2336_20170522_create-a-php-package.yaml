text:
  p1:
  - kind: heading
    level: 1
    text: パッケージを作ろう！ LT
  - kind: para
    text: Create your PHP library/package!
  - kind: para
    text: '2017-05-22 PHP BLT #7'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - GitHub/Packagistでは id:zonuexe
    - ピクシブ株式会社でひたすらPHPやってる p(ixi)v
    - フレームワークなき道にフレームを作るおしごと
    - 最近やってること
    - ひたすらに要らないコードを整理したり、
  - kind: para
    text: コアの部分をぐにゃっとできるように悩んでるよ
  - kind: list
    items:
    - Mastodon API Client/SDK作ったよ
  p3:
  - kind: para
    text: Mastodon
  - kind: para
    text: たのしいんですよ
  p4:
  - kind: para
    text: PHPからMastodonの
  - kind: para
    text: APIを簡単に触れる
  - kind: para
    text: クラスを作った
  p5:
  - kind: para
    text: $composer require
  - kind: para
    text: zonuexe/mastodon-api
  p6:
  - kind: para
    text: コンポーザーを手
  - kind: para
    text: 元に入れる方法は
  - kind: para
    text: キータに書いた
  p7:
  - kind: para
    text: パッケージ作るときに決めること
  - kind: para
    text: パッケージ名 (vendor/package)
  - kind: para
    text: 対象PHPバージョン
  - kind: para
    text: ディレクトリ構成
  - kind: para
    text: ライセンス
  p8:
  - kind: heading
    level: 1
    text: パッケージ名
  - kind: para
    text: パッケージ名はvendor/package 形式
  - kind: para
    text: ([-0-9a-z]+ -と数字小文字のみ)
  - kind: para
    text: GitHubと一致させておくと親切
  - kind: para
    text: zonuexe/mastodon-api にした
  p9:
  - kind: heading
    level: 1
    text: 対象PHPバージョン
  - kind: para
    text: どこから対応するか？ HHVMは？
  - kind: para
    text: 5.3.2+ (Composer最低)
  - kind: para
    text: 5.5+ (旧安定版、サポート終了済み)
  - kind: para
    text: 7.0+ (旧安定版)
  - kind: para
    text: 5.6+, 7.1+ (現安定版)
  p10:
  - kind: heading
    level: 1
    text: ディレクトリ構成
  - kind: para
    text: 拘りがなければsrc/とtests/に置く
  - kind: para
    text: git init; mkdir src/ tests/;
  - kind: para
    text: コマンドを配布したければ bin/ に
  - kind: para
    text: docs/ にドキュメントを置くと、
  - kind: para
    text: GitHub Pagesに展開できて便利
  p11:
  - kind: heading
    level: 1
    text: オートローディング
  - kind: para
    text: モダンなPHPにrequireは最低限
  - kind: para
    text: 各クラスにincludeとか書かない
  - kind: para
    text: composer.jsonに設定を書く
  - kind: para
    text: 起動スクリプトでだけ
  - kind: para
    text: autoload.phpを読み込むようにする
  p12:
  - kind: heading
    level: 1
    text: オートローディング(PSR-4)
  - kind: para
    text: '{'
  - kind: para
    text: '"autoload": {'
  - kind: para
    text: '"psr-4": {'
  - kind: para
    text: '"Mastodon\\": "src/"'
  - kind: para
    text: '}'
  - kind: para
    text: '},'
  - kind: para
    text: 'autoload-dev": {'
  - kind: para
    text: '"psr-4": {'
  - kind: para
    text: '"Mastodon\\": "tests/"'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p13:
  - kind: heading
    level: 1
    text: オートローディング(files)
  - kind: heading
    level: 2
    text: クラスは遅延ロードできるが、
  - kind: heading
    level: 2
    text: 関数はできないので読み込む
  - kind: para
    text: '{'
  - kind: para
    text: '"autoload": {'
  - kind: para
    text: '"files": ["src/functions.php"]'
  - kind: para
    text: '},'
  - kind: para
    text: '"autoload-dev": {'
  - kind: para
    text: '"files": ["tests/helpers.php"]'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p14:
  - kind: heading
    level: 1
    text: オートローディング(classmap)
  - kind: heading
    level: 2
    text: 名前空間とディレクトリ構成が
  - kind: heading
    level: 2
    text: 一致しない雑なPHPも力強く読める
  - kind: para
    text: '{'
  - kind: para
    text: '"autoload": {'
  - kind: para
    text: '"classmap": ["src/"]'
  - kind: para
    text: '},'
  - kind: para
    text: '"autoload-dev": {'
  - kind: para
    text: '"classmap": ["tests/"]'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p15:
  - kind: heading
    level: 1
    text: ライセンス (利用許諾)
  - kind: para
    text: 二次利用させるためのガイドライン
  - kind: para
    text: 好き勝手に利用させたいなら
  - kind: para
    text: Apache-2.0かMITがオススメ
  - kind: para
    text: 他人が行なった変更を合法的に
  - kind: para
    text: 自分にも取り込みたいならGPL-3.0
  p16:
  - kind: heading
    level: 1
    text: 極論
  - kind: para
    text: ライセンス(利用許諾)を明示せずに
  - kind: para
    text: ソースコードをパブリックな場所に
  - kind: para
    text: 置いてはいけない
  - kind: para
    text: そのソースコードを見付けたひとが
  - kind: para
    text: 合法的に再利用することができない
  p17:
  - kind: para
    text: よしこれで
  - kind: para
    text: 準備が整った
  p18:
  - kind: heading
    level: 1
    text: パッケージを探す
  - kind: heading
    level: 2
    text: 定番パッケージはawesome-php
  - kind: para
    text: https://github.com/ziadoz/awesome-php
  - kind: heading
    level: 2
    text: Packagistでぐぐる
  - kind: para
    text: https://packagist.org/
  p19:
  - kind: heading
    level: 1
    text: 鉄則
  - kind: para
    text: composer.jsonのrequireは弄るな
  - kind: para
    text: composer requireはコマンドで。
  - kind: para
    text: JSONファイルはいい感じに変更される
  - kind: para
    text: バージョンはいい感じに解決される
  - kind: para
    text: $ composer require guzzlehttp/guzzle respect/validation
  - kind: para
    text: $ composer require --dev phpunit/phpunit:^4.8
  p20:
  - kind: para
    text: SDKがやること
  p21:
  - kind: heading
    level: 1
    text: SDKのおしごと
  - kind: para
    text: HTTPリクエストする
  - kind: para
    text: それをPHPにマッピングする
  - kind: para
    text: 複雑さを隠すための工夫をする
  p22:
  - kind: heading
    level: 1
    text: Entity
  - kind: heading
    level: 2
    text: Mastodon本家のAPIリファレンスを
  - kind: heading
    level: 2
    text: ひたすらひたすらひたすら写してく
  - kind: para
    text: https://github.com/tootsuite/documentation/blob/
  - kind: para
    text: master/Using-the-API/API.md#entities
  - kind: heading
    level: 2
    text: 自作のライブラリで型付け
  - kind: para
    text: https://github.com/BaguettePHP/objectsystem
  p23:
  - kind: heading
    level: 1
    text: あんまり複雑なことを見せない
  - kind: heading
    level: 2
    text: ちょーかんたんっぽく
  - kind: para
    text: <?php use Baguette\Mastodon as m;
  - kind: para
    text: $mastodon = m\session(
  - kind: para
    text: '''pawoo.net'', $client_id, $client_secret, ['
  - kind: para
    text: '''scope'' => ''read write follow'','
  - kind: para
    text: '''grant'' => [''username'' => $mail, ''password'' => $passwd],'
  - kind: para
    text: ']);'
  - kind: para
    text: $account = $mastodon->getAccount(42);
  - kind: para
    text: $mastodon->postStatus(m\toot('トゥートゥー'));
  p24:
  - kind: heading
    level: 1
    text: OOPであることには拘らない
  - kind: heading
    level: 2
    text: Requestするメソッド
  - kind: para
    text: public static function getAccount(
  - kind: para
    text: Client $client, SessionStorage $session, $id
  - kind: para
    text: ) {
  - kind: para
    text: v::intVal()->min(0)->assert($id);
  - kind: para
    text: return static::map(
  - kind: para
    text: Entity\Account::class,
  - kind: para
    text: $client->requestAPI('GET',
  - kind: para
    text: sprintf('/api/v1/accounts/%d', $id), [], $session)
  - kind: para
    text: );
  - kind: para
    text: '}'
  p25:
  - kind: heading
    level: 1
    text: 中では再帰的にクラスを生成
  - kind: heading
    level: 2
    text: APIの結果をデコードしてぶっこむ
  - kind: para
    text: public function __construct(array $properties) {
  - kind: para
    text: $this->setProperties(mapValues($properties, [
  - kind: para
    text: '''account'' => Account::class,'
  - kind: para
    text: '''reblog'' => Status::class,'
  - kind: para
    text: '''created_at'' => \DateTimeImmutable::class,'
  - kind: para
    text: '''media_attachments'' => [Attachment::class],'
  - kind: para
    text: '''mentions'' => [Mention::class],'
  - kind: para
    text: '''tags'' => [Tag::class],'
  - kind: para
    text: '''application'' => Application::class,'
  - kind: para
    text: ']));'
  - kind: para
    text: '}'
  p26:
  - kind: para
    text: テストの
  - kind: para
    text: 書きかた
  p27:
  - kind: heading
    level: 1
    text: テスト
  - kind: para
    text: がんばりすぎない
  - kind: para
    text: 踏み外したくない道をしっかり書く
  - kind: para
    text: HTTPリクエストはGuzzleで隠蔽
  p28:
  - kind: para
    text: Mastodon
  - kind: para
    text: たのしいんですよ
  p29:
  - kind: para
    text: まだ未実装なAPIは
  - kind: para
    text: たくさん／(^o^)＼
size:
  max_width: 1024
  max_height: 768
links:
  p18:
  - url: https://github.com/ziadoz/awesome-php
    title: 'GitHub - ziadoz/awesome-php: A curated list of amazingly awesome PHP libraries,
      resources and shiny things.'
  - url: https://packagist.org/
    title: Packagist
  p22:
  - url: https://github.com/tootsuite/documentation/blob/master/Using-the-API/API.md#entities
    title: github.com
  - url: https://github.com/BaguettePHP/objectsystem
    title: 'GitHub - BaguettePHP/objectsystem: Object system implementation for PHP'
