text:
  p1:
  - kind: heading
    level: 1
    text: パッケージを作ろう！ LT
  - kind: para
    text: Create your PHP library/package!
  - kind: para
    text: '2017-05-22 PHP BLT #7'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - GitHub/Packagistでは id:zonuexe
    - ピクシブ株式会社でひたすらPHPやってる p(ixi)v
    - フレームワークなき道にフレームを作るおしごと
    - 最近やってること
    - ひたすらに要らないコードを整理したり、
  - kind: para
    text: コアの部分をぐにゃっとできるように悩んでるよ
  - kind: list
    items:
    - Mastodon API Client/SDK作ったよ
  p3:
  - kind: para
    text: Mastodonたのしいんですよ
  p4:
  - kind: para
    text: PHPからMastodonの
  - kind: para
    text: APIを簡単に触れる
  - kind: para
    text: クラスを作った
  p5:
  - kind: para
    text: $composer require zonuexe/mastodon-api
  p6:
  - kind: para
    text: コンポーザーを手元に入れる方法は
  - kind: para
    text: キータに書いた
  p7:
  - kind: para
    text: パッケージ作るときに決めること
  - kind: para
    text: パッケージ名 (vendor/package)
  - kind: para
    text: 対象PHPバージョン
  - kind: para
    text: ディレクトリ構成
  - kind: para
    text: ライセンス
  p8:
  - kind: heading
    level: 1
    text: パッケージ名
  - kind: para
    text: パッケージ名はvendor/package 形式([-0-9a-z]+ -と数字小文字のみ)
  - kind: para
    text: GitHubと一致させておくと親切
  - kind: para
    text: zonuexe/mastodon-api にした
  p9:
  - kind: heading
    level: 1
    text: 対象PHPバージョン
  - kind: para
    text: どこから対応するか？ HHVMは？
  - kind: para
    text: 5.3.2+ (Composer最低)
  - kind: para
    text: 5.5+ (旧安定版、サポート終了済み)
  - kind: para
    text: 7.0+ (旧安定版)
  - kind: para
    text: 5.6+, 7.1+ (現安定版)
  p10:
  - kind: heading
    level: 1
    text: ディレクトリ構成
  - kind: para
    text: 拘りがなければsrc/とtests/に置くgit init; mkdir src/ tests/;
  - kind: para
    text: コマンドを配布したければ bin/ に
  - kind: para
    text: docs/ にドキュメントを置くと、GitHub Pagesに展開できて便利
  p11:
  - kind: heading
    level: 1
    text: オートローディング
  - kind: para
    text: モダンなPHPにrequireは最低限
  - kind: para
    text: 各クラスにincludeとか書かない
  - kind: para
    text: composer.jsonに設定を書く
  - kind: para
    text: 起動スクリプトでだけautoload.phpを読み込むようにする
  p12:
  - kind: heading
    level: 1
    text: オートローディング(PSR-4)
  - kind: para
    text: '{"autoload": {"psr-4": {"Mastodon\\": "src/"}},autoload-dev": {"psr-4":
      {"Mastodon\\": "tests/"}}}'
  p13:
  - kind: heading
    level: 1
    text: オートローディング(files)
  - kind: heading
    level: 2
    text: クラスは遅延ロードできるが、
  - kind: heading
    level: 2
    text: 関数はできないので読み込む
  - kind: para
    text: '{"autoload": {"files": ["src/functions.php"]},"autoload-dev": {"files":
      ["tests/helpers.php"]}}'
  p14:
  - kind: heading
    level: 1
    text: オートローディング(classmap)
  - kind: heading
    level: 2
    text: 名前空間とディレクトリ構成が
  - kind: heading
    level: 2
    text: 一致しない雑なPHPも力強く読める
  - kind: para
    text: '{"autoload": {"classmap": ["src/"]},"autoload-dev": {"classmap": ["tests/"]}}'
  p15:
  - kind: heading
    level: 1
    text: ライセンス (利用許諾)
  - kind: para
    text: 二次利用させるためのガイドライン
  - kind: para
    text: 好き勝手に利用させたいならApache-2.0かMITがオススメ
  - kind: para
    text: 他人が行なった変更を合法的に自分にも取り込みたいならGPL-3.0
  p16:
  - kind: heading
    level: 1
    text: 極論
  - kind: para
    text: ライセンス(利用許諾)を明示せずに
  - kind: para
    text: ソースコードをパブリックな場所に置いてはいけない
  - kind: para
    text: そのソースコードを見付けたひとが合法的に再利用することができない
  p17:
  - kind: para
    text: よしこれで準備が整った
  p18:
  - kind: heading
    level: 1
    text: パッケージを探す
  - kind: heading
    level: 2
    text: 定番パッケージはawesome-php
  - kind: para
    text: https://github.com/ziadoz/awesome-php
  - kind: heading
    level: 2
    text: Packagistでぐぐる
  - kind: para
    text: https://packagist.org/
  p19:
  - kind: heading
    level: 1
    text: 鉄則
  - kind: para
    text: composer.jsonのrequireは弄るな
  - kind: para
    text: composer requireはコマンドで。JSONファイルはいい感じに変更される
  - kind: para
    text: バージョンはいい感じに解決される
  - kind: para
    text: $ composer require guzzlehttp/guzzle respect/validation$ composer require
      --dev phpunit/phpunit:^4.8
  p20:
  - kind: para
    text: SDKがやること
  p21:
  - kind: heading
    level: 1
    text: SDKのおしごと
  - kind: para
    text: HTTPリクエストする
  - kind: para
    text: それをPHPにマッピングする
  - kind: para
    text: 複雑さを隠すための工夫をする
  p22:
  - kind: heading
    level: 1
    text: Entity
  - kind: heading
    level: 2
    text: Mastodon本家のAPIリファレンスを
  - kind: heading
    level: 2
    text: ひたすらひたすらひたすら写してく
  - kind: para
    text: https://github.com/tootsuite/documentation/blob/master/Using-the-API/API.md#entities
  - kind: heading
    level: 2
    text: 自作のライブラリで型付け
  - kind: para
    text: https://github.com/BaguettePHP/objectsystem
  p23:
  - kind: heading
    level: 1
    text: あんまり複雑なことを見せない
  - kind: heading
    level: 2
    text: ちょーかんたんっぽく
  - kind: para
    text: <?php use Baguette\Mastodon as m;$mastodon = m\session(
  - kind: para
    text: '''pawoo.net'', $client_id, $client_secret, ['
  - kind: para
    text: '''scope'' => ''read write follow'','
  - kind: para
    text: '''grant'' => [''username'' => $mail, ''password'' => $passwd],]);$account
      = $mastodon->getAccount(42);$mastodon->postStatus(m\toot(''トゥートゥー''));'
  p24:
  - kind: heading
    level: 1
    text: OOPであることには拘らない
  - kind: heading
    level: 2
    text: Requestするメソッド
  - kind: para
    text: public static function getAccount(Client $client, SessionStorage $session,
      $id) {v::intVal()->min(0)->assert($id);return static::map(Entity\Account::class,$client->requestAPI('GET',
  - kind: para
    text: sprintf('/api/v1/accounts/%d', $id), [], $session)
  - kind: para
    text: );}
  p25:
  - kind: heading
    level: 1
    text: 中では再帰的にクラスを生成
  - kind: heading
    level: 2
    text: APIの結果をデコードしてぶっこむ
  - kind: para
    text: public function __construct(array $properties) {$this->setProperties(mapValues($properties,
      ['account' => Account::class,'reblog' => Status::class,'created_at' => \DateTimeImmutable::class,'media_attachments'
      => [Attachment::class],'mentions' => [Mention::class],'tags' => [Tag::class],'application'
      => Application::class,]));}
  p26:
  - kind: para
    text: テストの書きかた
  p27:
  - kind: heading
    level: 1
    text: テスト
  - kind: para
    text: がんばりすぎない
  - kind: para
    text: 踏み外したくない道をしっかり書く
  - kind: para
    text: HTTPリクエストはGuzzleで隠蔽
  p28:
  - kind: para
    text: Mastodonたのしいんですよ
  p29:
  - kind: para
    text: まだ未実装なAPIはたくさん／(^o^)＼
size:
  max_width: 1024
  max_height: 768
links:
  p18:
