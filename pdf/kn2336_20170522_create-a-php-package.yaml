  max_width: 1024
  max_height: 768
links:
  p18:
  - url: https://github.com/ziadoz/awesome-php
    title: 'GitHub - ziadoz/awesome-php: A curated list of amazingly awesome PHP libraries,
      resources and shiny things.'
  - url: https://packagist.org/
    title: Packagist
  p22:
  - url: https://github.com/tootsuite/documentation/blob/master/Using-the-API/API.md#entities
    title: github.com
  - url: https://github.com/BaguettePHP/objectsystem
    title: 'GitHub - BaguettePHP/objectsystem: Object system implementation for PHP'
text:
  p1:
  - node: p
    children:
    - node: text
      content: 'パッケージを作ろう！ LTCreate your PHP library/package!2017-05-22 PHP BLT #7'
  p2:
  - node: p
    children:
    - node: text
      content: 'お前誰ようさみけんた (@tadsan) / Zonu.EXE

        '
    - node: text
      content: 'GitHub/Packagistでは id:zonuexe

        •ピクシブ株式会社でひたすらPHPやってる p(ixi)v

        •フレームワークなき道にフレームを作るおしごと

        •最近やってること

        •         ひたすらに要らないコードを整理したり、•コアの部分をぐにゃっとできるように悩んでるよ

        Mastodon API Client/SDK作ったよ•'
  p3:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: Mastodonたのしいんですよ
  p4:
  - node: p
    children:
    - node: text
      content: PHPからMastodonの
    - node: bold
      content: '         '
    - node: text
      content: APIを簡単に触れるクラスを作った
  p5:
  - node: p
    children:
    - node: text
      content: $composer require zonuexe/mastodon-api
  p6:
  - node: p
    children:
    - node: text
      content: コンポーザーを手元に入れる方法はキータに書いた
  p7:
  - node: p
    children:
    - node: text
      content: 'パッケージ作るときに決めることvendor/packageパッケージ名 ()

        対象PHPバージョン

        ディレクトリ構成

        ライセンス'
  p8:
  - node: p
    children:
    - node: text
      content: 'パッケージ名vendor/packageパッケージ名は 形式[-0-9a-z]+ (-と数字小文字のみ)

        GitHubと一致させておくと親切

        zonuexe/mastodon-api にした'
  p9:
  - node: p
    children:
    - node: text
      content: '対象PHPバージョンどこから対応するか？ HHVMは？

        5.3.2+

         (Composer最低)5.5+

         (旧安定版、サポート終了済み)7.0+

         (旧安定版)5.6+, 7.1+ (現安定版)'
  p10:
  - node: p
    children:
    - node: text
      content: ディレクトリ構成
    - node: bold
      content: '         '
    - node: text
      content: 'src/tests/拘りがなければとに置くgit init; mkdir src/ tests/;

        bin/コマンドを配布したければ  に

         docs/ にドキュメントを置くと、GitHub Pagesに展開できて便利'
  p11:
  - node: p
    children:
    - node: text
      content: 'オートローディングrequireモダンなPHPには最低限

        include各クラスにとか書かない

        composer.jsonに設定を書く

         起動スクリプトでだけautoload.phpを読み込むようにする'
  p12:
  - node: p
    children:
    - node: text
      content: オートローディング(PSR-4)
    - node: bold
      content: '{'
    - node: text
      content: '         '
    - node: bold
      content: '    "autoload": {'
    - node: text
      content: '         '
    - node: bold
      content: '        "psr-4": {'
    - node: text
      content: '         '
    - node: bold
      content: '            "Mastodon\\": "src/"'
    - node: text
      content: '         '
    - node: bold
      content: '        }'
    - node: text
      content: '         '
    - node: bold
      content: '    },'
    - node: text
      content: '         '
    - node: bold
      content: '    autoload-dev": {'
    - node: text
      content: '         '
    - node: bold
      content: '        "psr-4": {'
    - node: text
      content: '         '
    - node: bold
      content: '            "Mastodon\\": "tests/"'
    - node: text
      content: '         '
    - node: bold
      content: '        }'
    - node: text
      content: '         '
    - node: bold
      content: '    }'
    - node: text
      content: '         '
    - node: bold
      content: '}'
  p13:
  - node: p
    children:
    - node: text
      content: 'オートローディング(files)         クラスは遅延ロードできるが、関数はできないので読み込む'
    - node: bold
      content: '{'
    - node: text
      content: '         '
    - node: bold
      content: '    "autoload": {'
    - node: text
      content: '         '
    - node: bold
      content: '        "files": ["src/functions.php"]'
    - node: text
      content: '         '
    - node: bold
      content: '    },'
    - node: text
      content: '         '
    - node: bold
      content: '    "autoload-dev": {'
    - node: text
      content: '         '
    - node: bold
      content: '        "files": ["tests/helpers.php"]'
    - node: text
      content: '         '
    - node: bold
      content: '    }'
    - node: text
      content: '         '
    - node: bold
      content: '}'
  p14:
  - node: p
    children:
    - node: text
      content: 'オートローディング(classmap)         名前空間とディレクトリ構成が一致しない雑なPHPも力強く読める'
    - node: bold
      content: '{'
    - node: text
      content: '         '
    - node: bold
      content: '    "autoload": {'
    - node: text
      content: '         '
    - node: bold
      content: '        "classmap": ["src/"]'
    - node: text
      content: '         '
    - node: bold
      content: '    },'
    - node: text
      content: '         '
    - node: bold
      content: '    "autoload-dev": {'
    - node: text
      content: '         '
    - node: bold
      content: '        "classmap": ["tests/"]'
    - node: text
      content: '         '
    - node: bold
      content: '    }'
    - node: text
      content: '         '
    - node: bold
      content: '}'
  p15:
  - node: p
    children:
    - node: text
      content: 'ライセンス (利用許諾)二次利用させるためのガイドライン

        '
    - node: bold
      content: '         '
    - node: text
      content: '好き勝手に利用させたいならApache-2.0かMITがオススメ

         他人が行なった変更を合法的に自分にも取り込みたいならGPL-3.0'
  p16:
  - node: p
    children:
    - node: text
      content: '極論(利用許諾)         ライセンスを明示せずに         ソースコードをパブリックな場所に置いてはいけない

         そのソースコードを見付けたひとが         合法的に再利用することができない'
  p17:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: よしこれで準備が整った
  p18:
  - node: p
    children:
    - node: text
      content: パッケージを探す
    - node: bold
      content: '         '
    - node: text
      content: '定番パッケージはawesome-php

        https://github.com/ziadoz/awesome-php'
    - node: bold
      content: '         '
    - node: text
      content: Packagistでぐぐるhttps://packagist.org/
  p19:
  - node: p
    children:
    - node: text
      content: '鉄則composer.jsonrequireのは弄るな

         composer requireはコマンドで。JSONファイルはいい感じに変更される

        バージョンはいい感じに解決される'
    - node: bold
      content: $ composer require guzzlehttp/guzzle respect/validation
    - node: text
      content: '         '
    - node: bold
      content: $ composer require --dev phpunit/phpunit:^4.8
  p20:
  - node: p
    children:
    - node: text
      content: SDKがやること
  p21:
  - node: p
    children:
    - node: text
      content: 'SDKのおしごとHTTPリクエストする

        それをPHPにマッピングする

        複雑さを隠すための工夫をする'
  p22:
  - node: p
    children:
    - node: text
      content: Entity
    - node: bold
      content: '         '
    - node: text
      content: Mastodon本家のAPIリファレンスを
    - node: bold
      content: '         '
    - node: text
      content: 'ひたすらひたすらひたすら写してくhttps://github.com/tootsuite/documentation/blob/

        master/Using-the-API/API.md#entities'
    - node: bold
      content: '         '
    - node: text
      content: 自作のライブラリで型付けhttps://github.com/BaguettePHP/objectsystem
  p23:
  - node: p
    children:
    - node: text
      content: あんまり複雑なことを見せないちょーかんたんっぽく
    - node: bold
      content: <?php use Baguette\Mastodon as m;
    - node: text
      content: '         '
    - node: bold
      content: $mastodon = m\session(
    - node: text
      content: '         '
    - node: bold
      content: '''pawoo.net'', $client_id, $client_secret, ['
    - node: text
      content: '         '
    - node: bold
      content: '    ''scope'' => ''read write follow'','
    - node: text
      content: '         '
    - node: bold
      content: '        ''grant'' => ,'
    - node: text
      content: '         '
    - node: bold
      content: '[''username'' => $mail, ''password'' => $passwd]        ]);'
    - node: text
      content: '          '
    - node: bold
      content: $account = $mastodon->getAccount(42);
    - node: text
      content: '         '
    - node: bold
      content: $mastodon->postStatus(m\toot('トゥートゥー'));
  p24:
  - node: p
    children:
    - node: text
      content: OOPであることには拘らないRequestするメソッド
    - node: bold
      content: public static function getAccount(
    - node: text
      content: '         '
    - node: bold
      content: '    Client $client, SessionStorage $session, $id'
    - node: text
      content: '         '
    - node: bold
      content: ) {
    - node: text
      content: '         '
    - node: bold
      content: '    v::intVal()->min(0)->assert($id);'
    - node: text
      content: '         '
    - node: bold
      content: '    return static::map('
    - node: text
      content: '         '
    - node: bold
      content: '        Entity\Account::class,'
    - node: text
      content: '         '
    - node: bold
      content: '        $client->requestAPI(''GET'','
    - node: text
      content: '         '
    - node: bold
      content: '        '
    - node: text
      content: '         '
    - node: bold
      content: sprintf('/api/v1/accounts/%d', $id), [], $session)    );
    - node: text
      content: '         '
    - node: bold
      content: '}'
  p25:
  - node: p
    children:
    - node: text
      content: 中では再帰的にクラスを生成APIの結果をデコードしてぶっこむ
    - node: bold
      content: public function __construct(array $properties) {
    - node: text
      content: '         '
    - node: bold
      content: '    $this->setProperties(mapValues($properties, ['
    - node: text
      content: '         '
    - node: bold
      content: '        ''account''           => Account::class,'
    - node: text
      content: '         '
    - node: bold
      content: '        ''reblog''            => Status::class,'
    - node: text
      content: '         '
    - node: bold
      content: '        ''created_at''        => \DateTimeImmutable::class,'
    - node: text
      content: '         '
    - node: bold
      content: '        ''media_attachments'' => [Attachment::class],'
    - node: text
      content: '         '
    - node: bold
      content: '        ''mentions''          => [Mention::class],'
    - node: text
      content: '         '
    - node: bold
      content: '        ''tags''              => [Tag::class],'
    - node: text
      content: '         '
    - node: bold
      content: '        ''application''       => Application::class,'
    - node: text
      content: '         '
    - node: bold
      content: '    ]));'
    - node: text
      content: '         '
    - node: bold
      content: '}'
  p26:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: テストの書きかた
  p27:
  - node: p
    children:
    - node: text
      content: 'テストがんばりすぎない

        踏み外したくない道をしっかり書く

        HTTPリクエストはGuzzleで隠蔽'
  p28:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: Mastodonたのしいんですよ
  p29:
  - node: p
    children:
    - node: text
      content: まだ未実装なAPIはたくさん／(^o^)＼
