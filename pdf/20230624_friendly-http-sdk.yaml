text:
  p1:
  - node: p
    children:
    - node: text
      content: 【令和最新版】
  - node: p
    children:
    - node: text
      content: 開発者フレンドリーな HTTP SDK作るには
  - node: p
    children:
    - node: text
      content: Creating Developer-Friendly HTTP SDKs
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2022-06-24 '
  - node: p
    children:
    - node: bold
      content: PHP Conference Fukuoka
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人
  p3:
  - node: p
    children:
    - node: text
      content: さて
  p4:
  - node: p
    children:
    - node: text
      content: '内容を詰め込んでるの でメモとかは無理です '
    - node: br
    - node: text
      content: 後日詳細なフォロー アップを公開します
  p5:
  - node: p
    children:
    - node: text
      content: 今回のお題
  p6:
  - node: p
    children:
    - node: text
      content: つまり…？
  p7:
  - node: p
    children:
    - node: text
      content: そういう話です
    - node: br
    - node: text
      content: 🤖
  p8:
  - node: p
    children:
    - node: text
      content: そういう話です
    - node: br
    - node: text
      content: 🤖
  p9:
  - node: p
    children:
    - node: text
      content: 'テストの話はしますが '
    - node: br
    - node: text
      content: '主題には '
    - node: br
    - node: text
      content: なりませんでした
  p10:
  - node: p
    children:
    - node: text
      content: 'SDKを書く前に おさえておきたい '
    - node: br
    - node: text
      content: 'PHPでのHTTPの '
    - node: br
    - node: text
      content: 使いかた
  p11:
  - node: p
    children:
    - node: text
      content: '大昔に別の '
    - node: br
    - node: text
      content: 'アプローチについて '
    - node: br
    - node: text
      content: 書いたこともあります
  p12:
  - node: p
    children:
    - node: text
      content: WEB+DB PRESS Vol.96
  - node: p
    children:
    - node: text
      content: (2016年)
  p13:
  - node: p
    children:
    - node: text
      content: '関数ベースの処理は '
    - node: br
    - node: text
      content: 'イケてないから '
    - node: br
    - node: text
      content: 'Guzzle使おうぜ！ '
    - node: br
    - node: text
      content: …という内容
  p14:
  - node: p
    children:
    - node: text
      content: Zennに再掲しました
  - node: p
    children:
    - node: text
      content: (2016年版)
  p15:
  - node: p
    children:
    - node: text
      content: '今回しない話 '
  - node: p
    children:
    - node: text
      content: (発表時間15分なので)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: OpenAPI(Swagger)の定義からコードを自動生成するとか
    - node: li
      children:
      - node: text
        content: 具体的なSDKの実装方法
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: もうちょっと手前のHTTPの話が中心です
        - node: li
          children:
          - node: text
            content: 後日、私がいままで作ったSDKをいくつか紹介します
    - node: li
      children:
      - node: text
        content: 具体的なテスト手法について… 間に合いませんでした！
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: スライドじゃなくていい感じにするライブラリをちょこちょこ書いてます
  p16:
  - node: p
    children:
    - node: text
      content: '超ざっくり '
  - node: p
    children:
    - node: text
      content: PHP vs HTTP
  p17:
  - node: p
    children:
    - node: text
      content: PHPからHTTPリクエスト
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: グローバル関数を使うと超かんたんにHTTPリクエストを発行できる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Ole_get_contents($url)
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: 名前に反してPOSTなど任意のメソッドのリクエストを発行できる(!)
        - node: li
          children:
          - node: text
            content: cURL関数 [curl_init(), curl_exec(), ...]
        - node: li
          children:
          - node: text
            content: こいつらは事実上の標準関数みたいな感じで外部ライブラリも要らないし
          - node: br
          - node: text
            content: 簡単だけどリクエスト・レスポンスの組み立てがちょっとめんどい
  p18:
  - node: p
    children:
    - node: text
      content: そうだ､HTTPクライアントを使おう
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 実際にはuopzで可能
      - node: br
      - node: text
        content: '「リクエスト関数」から「クライアントオブジェクト」へ '
  - node: p
    children:
    - node: text
      content: '(例: clock-mock)'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPではグローバル関数をモックすることはちょっと大変
    - node: li
      children:
      - node: text
        content: インスタンスを外部から受け取ることで、HTTP通信が置換可能になる
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ガ ズ ル シ ン フ ォ ニ ー
      - node: br
      - node: text
        content: 'よく知られた実装: Guzzle, Symfony HTTP Client'
  p19:
  - node: p
    children:
    - node: text
      content: Guzzle
  p20:
  - node: p
    children:
    - node: text
      content: つまり…？
  p21:
  - node: p
    children:
    - node: text
      content: PSRとは何か
  p22:
  - node: p
    children:
    - node: text
      content: 'PHP-FIGとかいう '
    - node: br
    - node: text
      content: 有志の団体が勧告して
    - node: br
    - node: text
      content: いる標準仕様
  p23:
  - node: p
    children:
    - node: bold
      content: F
    - node: text
      content: ramework
    - node: bold
      content: ' '
    - node: br
    - node: bold
      content: I
    - node: text
      content: nterop
    - node: bold
      content: ' '
    - node: br
    - node: bold
      content: G
    - node: text
      content: roup
  p24:
  - node: p
    children:
    - node: text
      content: 'フレームワークを 作ってる人たちの '
    - node: br
    - node: text
      content: 寄合所帯
  p25:
  - node: p
    children:
    - node: text
      content: PSRの誤解
  p26:
  - node: p
    children:
    - node: text
      content: 'ワシのPSRは '
    - node: br
    - node: text
      content: 20式まであるぞ
  - node: p
    children:
    - node: text
      content: 一般的にはオートロードや コーディング規約が知られ
    - node: br
    - node: text
      content: 'ていると思う '
  - node: p
    children:
    - node: text
      content: (たぶん)
  p27:
  - node: p
    children:
    - node: text
      content: 'PSRではHTTPに 関連する仕様も多く '
    - node: br
    - node: text
      content: 勧告されている
  p28:
  - node: p
    children:
    - node: text
      content: 最重要資料
  p29:
  - node: p
    children:
    - node: text
      content: 'PSR-18は '
    - node: br
    - node: text
      content: HTTP Clientの インターフェイス
  p30:
  - node: p
    children:
    - node: text
      content: 'PSR-18は '
    - node: br
    - node: text
      content: 'PSR-15と似ているが '
    - node: br
    - node: text
      content: よりシンプル
  p31:
  - node: p
    children:
    - node: text
      content: PSR-15 vs PSR-18
  p32:
  - node: p
    children:
    - node: text
      content: ＿人人人人人人人人人人人人人人人人人＿ ＞　僕の知ってるHTTPClientと違う　＜ ￣Y^Y^Y^Y^Y^Y^Y^Y^Y^Y^Y^Y^￣
  p33:
  - node: p
    children:
    - node: text
      content: '僕の知ってる '
    - node: br
    - node: text
      content: HTTP Clientって？
  p34:
  - node: p
    children:
    - node: text
      content: GuzzleのREADMEに書いてる
  p35:
  - node: p
    children:
    - node: text
      content: それに引き換えなんだこのPSR-18
  - node: p
    children:
    - node: text
      content: シンプルすぎる
  p36:
  - node: p
    children:
    - node: text
      content: だがそれがいい
  p37:
  - node: p
    children:
    - node: text
      content: PSR-7/18 vs Guzzle (1)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSRはフレームワークの相互運用できる共通部品となるべく設計された
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PSR-7/18はHTTPの仕様を(PHPで扱える範囲で)そのまま表現できる
    - node: li
      children:
      - node: text
        content: Guzzleはエンドユーザーが使いやすいように設計されていて、
      - node: br
      - node: text
        content: 'ユーザーはHTTPやPSRの仕様を考えなくても簡単に使えるようになってる '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: リクエスト生成やHTTPヘッダの組み立てなどの実装も含んでいる
  p38:
  - node: p
    children:
    - node: text
      content: PSR-7/18 vs Guzzle (2)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSR-7/18は仕様がコンパクトなので気のきいた機能は定義されてない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: HTTPを理解していないと正しくリクエストを送れないこともありうる
    - node: li
      children:
      - node: text
        content: Guzzleは充実した便利機能を内包しているので、少ない記述量で
      - node: br
      - node: text
        content: '複数のHTTPリクエストを発行できる '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: なおかつPSR-18のClientInterfaceも実装している
        - node: li
          children:
          - node: text
            content: Guzzle独自の便利メソッドとPSR-18のシンプルメソッド両方使える
  p39:
  - node: p
    children:
    - node: text
      content: PSR-15 vs PSR-18
  p40:
  - node: p
    children:
    - node: text
      content: 一年前に話した
  p41:
  - node: p
    children:
    - node: text
      content: Middleware呼び出しイメージ
  - node: p
    children:
    - node: bold
      content: Middleware
  - node: p
    children:
    - node: bold
      content: RequestHandler
  - node: p
    children:
    - node: text
      content: ServerRequest
  - node: p
    children:
    - node: text
      content: Response
  p42:
  - node: p
    children:
    - node: text
      content: Middleware呼び出しイメージ
  - node: p
    children:
    - node: bold
      content: Middleware
  - node: p
    children:
    - node: bold
      content: RReeqquueessttHHaannddlleerr
  - node: p
    children:
    - node: text
      content: ServerRequest
  - node: p
    children:
    - node: text
      content: Response
  p43:
  - node: p
    children:
    - node: text
      content: '特定の場合に '
    - node: br
    - node: text
      content: '処理を横取りできると '
    - node: br
    - node: text
      content: うれしいことがある
  p44:
  - node: p
    children:
    - node: text
      content: 例：ユニットテスト
  p45:
  - node: p
    children:
    - node: text
      content: HttpClient呼び出しイメージ
  - node: p
    children:
    - node: bold
      content: 外部API
  - node: p
    children:
    - node: bold
      content: HttpClient
  - node: p
    children:
    - node: text
      content: Request
  - node: p
    children:
    - node: text
      content: Response
  p46:
  - node: p
    children:
    - node: text
      content: 外部にリクエストを送らない
  - node: p
    children:
    - node: bold
      content: 外部API
  - node: p
    children:
    - node: text
      content: リクエスト送らない
  - node: p
    children:
    - node: bold
      content: MockHttpClient
  - node: p
    children:
    - node: text
      content: Request
  - node: p
    children:
    - node: text
      content: Response
  p47:
  - node: p
    children:
    - node: text
      content: 外部にリクエストが送られないように
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PSR-18の場合、仕様がとてもシンプルなのでClientInterfaceを実装し
      - node: br
      - node: text
        content: 'たシンプルな無名クラスを作ってしまうのが簡単 '
    - node: li
      children:
      - node: text
        content: Guzzleの場合、MockHandlerというハンドラを有効化して
      - node: br
      - node: text
        content: 'テスト用に任意のレスポンスを返す関数を登録してやることができる '
    - node: li
      children:
      - node: text
        content: '重要: アプリケーション内に不用意に new Guzzle Client()とか書かない'
  - node: p
    children:
    - node: text
      content: \
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 普通の方法で処理を横取りできなくなってしまう
  p48:
  - node: p
    children:
    - node: text
      content: '依存の注入 '
  - node: p
    children:
    - node: text
      content: (Dependency Injection)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: オブジェクトはメソッド内でその都度生成するのではなく、
      - node: br
      - node: text
        content: '呼び出し側(もしくはさらに上位のモジュール)から入れ込むことで 共通のインターフェイスを持ったものに交換できることを保証する '
    - node: li
      children:
      - node: text
        content: 同一機能を持った別のライブラリに乗り換えることもできるし、
      - node: br
      - node: text
        content: 'テスト時に決まった値を返すモックオブジェクトに差し替えることも簡単 '
    - node: li
      children:
      - node: text
        content: くわしくは「ちょうぜつソフトウェア設計入門」を読んで！
  p49:
  - node: p
    children:
    - node: text
      content: 'ここまでで '
    - node: br
    - node: text
      content: 準備ができた
  p50: []
  p51:
  - node: p
    children:
    - node: text
      content: '概ねいままで '
    - node: br
    - node: text
      content: '言ってきたことをやるな '
    - node: br
    - node: text
      content: という話
  p52:
  - node: p
    children:
    - node: text
      content: Guzzle便利なのはいいんだけど
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 世の中、Guzzleを使いたいひとばかりではない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 僕はkriswallsmith/Buzzという素朴なPSR-18実装が好きです
    - node: li
      children:
      - node: text
        content: SDKとしてはpsr/http-clientとpsr/http-factoryにだけ
      - node: br
      - node: text
        content: '依存するのが理想 '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: SDKの実装としてはGuzzleの便利機能に頼れないのを不便に感じること
          - node: br
          - node: text
            content: はあるかもしれない
  p53:
  - node: p
    children:
    - node: text
      content: ユーザーの利便性 vs 依存の注入
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ユーザーがSDKを使いはじめるときに事前準備が多すぎると辟易させる
    - node: li
      children:
      - node: text
        content: プログラミングがあんまり得意じゃないユーザーにも使ってもらうことを考え
      - node: br
      - node: text
        content: 'ると、事前準備は少なければ少ないほどいい '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 一方で、依存を注入してテストで差し替えたいという
          - node: br
          - node: text
            content: 利用者の邪魔をしてはいけない
  p54:
  - node: p
    children:
    - node: text
      content: 利用者の邪魔をするパターン
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: SDKの実装の中で new Guzzle Client() って書く
  - node: p
    children:
    - node: text
      content: \
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: SDKの実装の中で file_get_contents() とか curl 関数を呼ぶ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ただしこれらのパターンはPHP-VCRというテスト用ライブラリを
          - node: br
          - node: text
            content: 活用することで通信をフックして任意のレスポンスに書き換えたりすること
          - node: br
          - node: text
            content: もできなくはない
  p55:
  - node: p
    children:
    - node: text
      content: php-http/discovery
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: php-httpという団体が提供しているライブラリ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 動作実績のとれているHTTPライブラリがハードコードされている
    - node: li
      children:
      - node: text
        content: インストール済みのPSR-HTTPライブラリを検出して自動で生成してくれる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: これはstaticに状態を持っておりDIパターンではないが、
          - node: br
          - node: text
            content: 'DIが使えない環境における強い味方 '
    - node: li
      children:
      - node: text
        content: 欠点：ドキュメントが不親切め
  p56:
  - node: p
    children:
    - node: text
      content: ユーザーを邪魔しない
    - node: br
    - node: text
      content: '使いやすいSDKを '
    - node: br
    - node: text
      content: 作ろう
  p57: []
size:
  max_width: 1920
  max_height: 1080
links:
  p18:
  - url: https://github.com/slope-it/clock-mock
    title: 'GitHub - slope-it/clock-mock: A PHP library for mocking date and time
      in tests'
  p34:
  - url: https://github.com/guzzle/guzzle
    title: 'GitHub - guzzle/guzzle: Guzzle, an extensible PHP HTTP client'
  - url: https://docs.guzzlephp.org/en/stable/quickstart.html#query-string-parameters
    title: Quickstart — Guzzle Documentation
