text:
  p1:
  - kind: heading
    level: 1
    text: 【令和最新版】
  - kind: heading
    level: 1
    text: 開発者フレンドリーな
  - kind: heading
    level: 1
    text: HTTP SDK作るには
  - kind: heading
    level: 2
    text: Creating Developer-Friendly HTTP SDKs
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2022-06-24 PHP Conference Fukuoka
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人
  p3:
  - kind: heading
    level: 1
    text: さて
  p4:
  - kind: para
    text: 内容を詰め込んでるのでメモとかは無理です
  - kind: para
    text: 後日詳細なフォローアップを公開します
  p5:
  - kind: heading
    level: 1
    text: 今回のお題
  p6:
  - kind: heading
    level: 1
    text: つまり…？
  p7:
  - kind: heading
    level: 1
    text: 🤖そういう話です
  p8:
  - kind: heading
    level: 1
    text: 🤖そういう話です
  p9:
  - kind: para
    text: テストの話はしますが
  - kind: para
    text: 主題にはなりませんでした
  p10:
  - kind: para
    text: SDKを書く前におさえておきたいPHPでのHTTPの使いかた
  p11:
  - kind: para
    text: 大昔に別のアプローチについて書いたこともあります
  p12:
  - kind: heading
    level: 1
    text: WEB+DB PRESS Vol.96(2016年)
  p13:
  - kind: para
    text: 関数ベースの処理は
  - kind: para
    text: イケてないからGuzzle使おうぜ！
  - kind: para
    text: …という内容
  p14:
  - kind: heading
    level: 1
    text: Zennに再掲しました(2016年版)
  p15:
  - kind: para
    text: 今回しない話 (発表時間15分なので)
  - kind: list
    items:
    - OpenAPI(Swagger)の定義からコードを自動生成するとか
    - 具体的なSDKの実装方法
    - もうちょっと手前のHTTPの話が中心です
    - 後日、私がいままで作ったSDKをいくつか紹介します
    - 具体的なテスト手法について… 間に合いませんでした！
    - スライドじゃなくていい感じにするライブラリをちょこちょこ書いてます
  p16:
  - kind: para
    text: 超ざっくりPHP vs HTTP
  p17:
  - kind: heading
    level: 1
    text: PHPからHTTPリクエスト
  - kind: list
    items:
    - グローバル関数を使うと超かんたんにHTTPリクエストを発行できる
    - file_get_contents($url)
    - 名前に反してPOSTなど任意のメソッドのリクエストを発行できる(!)
    - cURL関数 [curl_init(), curl_exec(), ...]
    - こいつらは事実上の標準関数みたいな感じで外部ライブラリも要らないし
  - kind: para
    text: 簡単だけどリクエスト・レスポンスの組み立てがちょっとめんどい
  p18:
  - kind: heading
    level: 1
    text: そうだ、HTTPクライアントを使おう
  - kind: heading
    level: 2
    text: 実際にはuopzで可能
  - kind: heading
    level: 3
    text: '(例: clock-mock)'
  - kind: para
    text: ガズルシンフォニー
  - kind: list
    items:
    - 「リクエスト関数」から「クライアントオブジェクト」へ
    - PHPではグローバル関数をモックすることはちょっと大変
    - インスタンスを外部から受け取ることで、HTTP通信が置換可能になる
    - 'よく知られた実装: Guzzle, Symfony HTTP Client'
  p19:
  - kind: heading
    level: 1
    text: Guzzle
  p20:
  - kind: heading
    level: 1
    text: つまり…？
  p21:
  - kind: heading
    level: 1
    text: PSRとは何か
  p22:
  - kind: para
    text: PHP-FIGとかいう有志の団体が勧告している標準仕様
  p23:
  - kind: para
    text: Framework Interop Group
  p24:
  - kind: para
    text: フレームワークを作ってる人たちの寄合所帯
  p25:
  - kind: heading
    level: 1
    text: PSRの誤解
  p26:
  - kind: para
    text: ワシのPSRは20式まであるぞ
  - kind: heading
    level: 1
    text: 一般的にはオートロードや
  - kind: heading
    level: 1
    text: コーディング規約が知られ
  - kind: heading
    level: 1
    text: ていると思う (たぶん)
  p27:
  - kind: para
    text: PSRではHTTPに関連する仕様も多く勧告されている
  p28:
  - kind: heading
    level: 1
    text: 最重要資料
  p29:
  - kind: para
    text: PSR-18はHTTP Clientのインターフェイス
  p30:
  - kind: para
    text: PSR-18はPSR-15と似ているがよりシンプル
  p31:
  - kind: heading
    level: 1
    text: PSR-15 vs PSR-18
  p32:
  - kind: para
    text: ＿人人人人人人人人人人人人人人人人人＿＞ 僕の知ってるHTTPClientと違う ＜
  - kind: para
    text: ‾Y^Y^Y^Y^Y^Y^Y^Y^Y^Y^Y^Y^‾
  p33:
  - kind: para
    text: 僕の知ってるHTTP Clientって？
  p34:
  - kind: heading
    level: 1
    text: GuzzleのREADMEに書いてる
  p35:
  - kind: heading
    level: 1
    text: それに引き換えなんだこのPSR-18
  - kind: heading
    level: 2
    text: シンプルすぎる
  p36:
  - kind: heading
    level: 1
    text: だがそれがいい
  p37:
  - kind: heading
    level: 1
    text: PSR-7/18 vs Guzzle (1)
  - kind: list
    items:
    - PSRはフレームワークの相互運用できる共通部品となるべく設計された
    - PSR-7/18はHTTPの仕様を(PHPで扱える範囲で)そのまま表現できる
    - Guzzleはエンドユーザーが使いやすいように設計されていて、
  - kind: para
    text: ユーザーはHTTPやPSRの仕様を考えなくても簡単に使えるようになってる
  - kind: list
    items:
    - リクエスト生成やHTTPヘッダの組み立てなどの実装も含んでいる
  p38:
  - kind: heading
    level: 1
    text: PSR-7/18 vs Guzzle (2)
  - kind: list
    items:
    - PSR-7/18は仕様がコンパクトなので気のきいた機能は定義されてない
    - HTTPを理解していないと正しくリクエストを送れないこともありうる
    - Guzzleは充実した便利機能を内包しているので、少ない記述量で
  - kind: para
    text: 複数のHTTPリクエストを発行できる
  - kind: list
    items:
    - なおかつPSR-18のClientInterfaceも実装している
    - Guzzle独自の便利メソッドとPSR-18のシンプルメソッド両方使える
  p39:
  - kind: heading
    level: 1
    text: PSR-15 vs PSR-18
  p40:
  - kind: heading
    level: 1
    text: 一年前に話した
  p41:
  - kind: heading
    level: 1
    text: Middleware呼び出しイメージ
  - kind: para
    text: Middleware
  - kind: para
    text: RequestHandler
  - kind: heading
    level: 2
    text: ServerRequest
  - kind: heading
    level: 2
    text: Response
  p42:
  - kind: heading
    level: 1
    text: Middleware呼び出しイメージ
  - kind: para
    text: Middleware
  - kind: para
    text: RequestHandler
  - kind: para
    text: RequestHandler
  - kind: heading
    level: 2
    text: ServerRequest
  - kind: heading
    level: 2
    text: Response
  p43:
  - kind: para
    text: 特定の場合に処理を横取りできるとうれしいことがある
  p44:
  - kind: heading
    level: 1
    text: 例：ユニットテスト
  p45:
  - kind: heading
    level: 1
    text: HttpClient呼び出しイメージ
  - kind: para
    text: 外部API
  - kind: para
    text: HttpClient
  - kind: heading
    level: 2
    text: Request
  - kind: heading
    level: 2
    text: Response
  p46:
  - kind: heading
    level: 1
    text: 外部にリクエストを送らない
  - kind: para
    text: 外部API
  - kind: heading
    level: 2
    text: リクエスト送らない
  - kind: para
    text: MockHttpClient
  - kind: heading
    level: 3
    text: Request
  - kind: heading
    level: 3
    text: Response
  p47:
  - kind: para
    text: 外部にリクエストが送られないように
  - kind: list
    items:
    - PSR-18の場合、仕様がとてもシンプルなのでClientInterfaceを実装し
  - kind: para
    text: たシンプルな無名クラスを作ってしまうのが簡単
  - kind: list
    items:
    - Guzzleの場合、MockHandlerというハンドラを有効化して
  - kind: para
    text: テスト用に任意のレスポンスを返す関数を登録してやることができる
  - kind: list
    items:
    - '重要: アプリケーション内に不用意に new Guzzle\Client()とか書かない'
    - 普通の方法で処理を横取りできなくなってしまう
  p48:
  - kind: heading
    level: 1
    text: 依存の注入 (Dependency Injection)
  - kind: list
    items:
    - オブジェクトはメソッド内でその都度生成するのではなく、
  - kind: para
    text: 呼び出し側(もしくはさらに上位のモジュール)から入れ込むことで共通のインターフェイスを持ったものに交換できることを保証する
  - kind: list
    items:
    - 同一機能を持った別のライブラリに乗り換えることもできるし、
  - kind: para
    text: テスト時に決まった値を返すモックオブジェクトに差し替えることも簡単
  - kind: list
    items:
    - くわしくは「ちょうぜつソフトウェア設計入門」を読んで！
  p49:
  - kind: para
    text: ここまでで準備ができた
  p50: []
  p51:
  - kind: para
    text: 概ねいままで言ってきたことをやるなという話
  p52:
  - kind: heading
    level: 1
    text: Guzzle便利なのはいいんだけど
  - kind: list
    items:
    - 世の中、Guzzleを使いたいひとばかりではない
    - 僕はkriswallsmith/Buzzという素朴なPSR-18実装が好きです
    - SDKとしてはpsr/http-clientとpsr/http-factoryにだけ
  - kind: para
    text: 依存するのが理想
  - kind: list
    items:
    - SDKの実装としてはGuzzleの便利機能に頼れないのを不便に感じること
  - kind: para
    text: はあるかもしれない
  p53:
  - kind: heading
    level: 1
    text: ユーザーの利便性 vs 依存の注入
  - kind: list
    items:
    - ユーザーがSDKを使いはじめるときに事前準備が多すぎると辟易させる
    - プログラミングがあんまり得意じゃないユーザーにも使ってもらうことを考え
  - kind: para
    text: ると、事前準備は少なければ少ないほどいい
  - kind: list
    items:
    - 一方で、依存を注入してテストで差し替えたいという
  - kind: para
    text: 利用者の邪魔をしてはいけない
  p54:
  - kind: heading
    level: 1
    text: 利用者の邪魔をするパターン
  - kind: list
    items:
    - SDKの実装の中で new Guzzle\Client() って書く
    - SDKの実装の中で file_get_contents() とか curl 関数を呼ぶ
    - ただしこれらのパターンはPHP-VCRというテスト用ライブラリを
  - kind: para
    text: 活用することで通信をフックして任意のレスポンスに書き換えたりすることもできなくはない
  p55:
  - kind: heading
    level: 1
    text: php-http/discovery
  - kind: list
    items:
    - php-httpという団体が提供しているライブラリ
    - 動作実績のとれているHTTPライブラリがハードコードされている
    - インストール済みのPSR-HTTPライブラリを検出して自動で生成してくれる
    - これはstaticに状態を持っておりDIパターンではないが、
  - kind: para
    text: DIが使えない環境における強い味方
  - kind: list
    items:
    - 欠点：ドキュメントが不親切め
  p56:
  - kind: para
    text: ユーザーを邪魔しない使いやすいSDKを作ろう
  p57: []
