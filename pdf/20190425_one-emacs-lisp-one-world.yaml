    level: 1
    text: 一つの(Emacs)Lisp、一つの世界
  - kind: para
    text: One Lisp in a lifetime.
  - kind: para
    text: 'Shibuya.lisp lispmeetup #75'
  - kind: para
    text: '2019年4月25日 #lispmeetup'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: 宣伝
  p4: []
  p5: []
  p6:
  - kind: para
    text: さて
  p7: []
  p8:
  - kind: para
    text: GNU Emacsを使ってる方？
  p9:
  - kind: para
    text: Emacs Lispを書いている方？
  p10:
  - kind: para
    text: Emacs Lisp
  p11:
  - kind: para
    text: シンボルの名前空間で見るとLisp-2に分類される
  p12:
  - kind: para
    text: 関数があるマクロがある
  - kind: para
    text: 汎変数がある
  p13:
  - kind: para
    text: なんでもできるのでは
  - kind: para
    text: ？？？？
  p14:
  - kind: para
    text: そうして2012年青年はSICPをEmacs Lispで解こうとした
  p15:
  - kind: para
    text: ／(^o^)＼
  p16:
  - kind: para
    text: SICP読んだ方なら
  - kind: para
    text: おわかりですね？
  p17:
  - kind: para
    text: Emacs Lispに末尾呼び出し最適化はない
  p18: []
  p19:
  - kind: para
    text: そうして青年はDr.RacketでSICPを解きはじめた…
  p20:
  - kind: para
    text: 未完
  p21:
  - kind: para
    text: (飽きっぽいので最後までは未だに解けてないです…)
  p22: []
  p23:
  - kind: para
    text: リリカル☆Lispは最後まで解きました
  p24:
  - kind: para
    text: Lispとして見たEmacs Lisp
  p25:
  - kind: para
    text: ダイナミックスコープ楽しい！
  p26:
  - kind: para
    text: クロージャがなかった
  p27:
  - kind: para
    text: (今はあります！)
  p28:
  - kind: para
    text: まとめようと思ったけど山本和彦さんが昔書いたブログがあった
  p29:
  - kind: para
    text: そうして青年はDr.RacketでSICPを解きはじめた…
