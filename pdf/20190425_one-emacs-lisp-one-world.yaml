  - kind: para
    text: バッファがファーストクラスオブジェクト
  p39:
  - kind: para
    text: 手続き的にカーソルを操作しながらバッファ内を操作できる
  p40:
  - kind: para
    text: 個人的にはとても楽しい
  p41:
  - kind: para
    text: Emacs JP Slack teamのスプラッシュメッセージ
  p42:
  - kind: para
    text: Emacsは雑草だ！！！！
  p43:
