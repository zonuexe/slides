text:
  p1:
  - node: p
    children:
    - node: text
      content: 一つの Lisp、一つの世界
  - node: p
    children:
    - node: text
      content: (Emacs)
  - node: p
    children:
    - node: text
      content: One Lisp in a lifetime.
  - node: p
    children:
    - node: text
      content: 'Shibuya.lisp lispmeetup #75'
  - node: p
    children:
    - node: text
      content: '2019年4月25日 #lispmeetup'
  p2:
  - node: p
    children:
    - node: bold
      content: お前誰よ
    - node: br
    - node: bold
      content: 'うさみけんた (@tadsan) / Zonu.EXE '
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'GitHub/Packagistでは id: zonuexe'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ピクシブ株式会社 pixiv運営本部
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeのメンテナ引き継ぎました
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 好きなリスプはEmacs Lispです
        - node: li
          children:
          - node: text
            content: Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - node: p
    children:
    - node: text
      content: 宣伝
  p4: []
  p5: []
  p6:
  - node: p
    children:
    - node: text
      content: さて
  p7: []
  p8:
  - node: p
    children:
    - node: text
      content: GNU Emacsを 使ってる方？
  p9:
  - node: p
    children:
    - node: text
      content: Emacs Lispを
  - node: p
    children:
    - node: text
      content: 書いている方？
  p10:
  - node: p
    children:
    - node: text
      content: Emacs Lisp
  p11:
  - node: p
    children:
    - node: text
      content: シンボルの
  - node: p
    children:
    - node: text
      content: 名前空間で見ると
  - node: p
    children:
    - node: text
      content: Lisp-2に分類される
  p12:
  - node: p
    children:
    - node: text
      content: 関数がある
  - node: p
    children:
    - node: text
      content: ' マクロがある'
  - node: p
    children:
    - node: text
      content: 汎変数がある
  p13:
  - node: p
    children:
    - node: text
      content: なんでも
  - node: p
    children:
    - node: text
      content: できるのでは
  - node: p
    children:
    - node: text
      content: ？？？？
  p14:
  - node: p
    children:
    - node: text
      content: そうして2012年
  - node: p
    children:
    - node: text
      content: 青年はSICPをEmacs Lispで解こうとした
  p15:
  - node: p
    children:
    - node: text
      content: ／(^o^)＼
  p16:
  - node: p
    children:
    - node: text
      content: SICP読んだ方なら おわかりですね？
  p17:
  - node: p
    children:
    - node: text
      content: Emacs Lispに
  - node: p
    children:
    - node: text
      content: 末尾呼び出し
  - node: p
    children:
    - node: text
      content: 最適化はない
  p18: []
  p19:
  - node: p
    children:
    - node: text
      content: そうして青年は
    - node: br
    - node: text
      content: Dr.RacketでSICP を解きはじめた…
  p20:
  - node: p
    children:
    - node: text
      content: 完
    - node: br
    - node: text
      content: 未
  p21:
  - node: p
    children:
    - node: text
      content: (飽きっぽいので最 後までは未だに解け
    - node: br
    - node: text
      content: てないです…)
  p22: []
  p23:
  - node: p
    children:
    - node: text
      content: リリカル☆Lispは
  - node: p
    children:
    - node: text
      content: 最後まで解きました
  p24:
  - node: p
    children:
    - node: text
      content: Lispとして見た
  - node: p
    children:
    - node: text
      content: Emacs Lisp
  p25:
  - node: p
    children:
    - node: text
      content: ダイナミック
    - node: br
    - node: text
      content: スコープ楽しい！
  p26:
  - node: p
    children:
    - node: text
      content: クロージャがなかった
  p27:
  - node: p
    children:
    - node: text
      content: (今はあります！)
  p28:
  - node: p
    children:
    - node: text
      content: まとめようと思ったけ ど山本和彦さんが昔書
    - node: br
    - node: text
      content: いたブログがあった
  p29:
  - node: p
    children:
    - node: text
      content: そうして青年は
    - node: br
    - node: text
      content: Dr.RacketでSICP を解きはじめた…
  p30: []
  p31:
  - node: p
    children:
    - node: text
      content: Emacs Lispの
  - node: p
    children:
    - node: text
      content: 文化
  p32: []
  p33: []
  p34: []
  p35: []
  p36:
  - node: p
    children:
    - node: text
      content: Emacsらしい
    - node: br
    - node: text
      content: Lispとは
  p37: []
  p38:
  - node: p
    children:
    - node: text
      content: バッファが
  - node: p
    children:
    - node: text
      content: ファーストクラス
  - node: p
    children:
    - node: text
      content: オブジェクト
  p39:
  - node: p
    children:
    - node: text
      content: 手続き的にカーソル を操作しながらバッ ファ内を操作できる
  p40:
  - node: p
    children:
    - node: text
      content: 個人的には
  - node: p
    children:
    - node: text
      content: とても楽しい
  p41:
  - node: p
    children:
    - node: text
      content: Emacs JP Slack teamの
  - node: p
    children:
    - node: text
      content: スプラッシュメッセージ
  p42:
  - node: p
    children:
    - node: text
      content: Emacsは
  - node: p
    children:
    - node: text
      content: 雑草だ
  - node: p
    children:
    - node: text
      content: ！！！！
  p43:
  - node: p
    children:
    - node: text
      content: 私からは
  - node: p
    children:
    - node: text
      content: 以上です
  p44:
  - node: p
    children:
    - node: text
      content: 補足
  p45:
  - node: p
    children:
    - node: text
      content: Emacs Lispの歴史的経緯
    - node: br
    - node: text
      content: をまじめに知りたければ
  - node: p
    children:
    - node: text
      content: Evolution of Emacs Lisp
  - node: p
    children:
    - node: text
      content: https://www-labs.iro.umontreal.ca/~monnier/
