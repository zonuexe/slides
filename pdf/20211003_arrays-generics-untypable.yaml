  p42:
  - node: p
    children:
    - node: text
      content: 著者は複数居る
  - node: p
    children:
    - node: text
      content: PHPDocの復活
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct(         '
    - node: br
    - node: text
      content: '        /** @var array<Author> */'
    - node: br
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
    - node: br
    - node: text
      content: '        // ...         '
    - node: br
    - node: text
      content: '    }'
  p43:
  - node: p
    children:
    - node: text
      content: 著者一覧を出力したい
  - node: p
    children:
    - node: text
      content: 'Book::$authors : '
    - node: br
    - node: text
      content: array<Author>
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function printAuthors($fp): void {'
    - node: br
    - node: text
      content: '       foreach ($this->authors as $author) {                     fwrite($fp, $author->getName());         '
