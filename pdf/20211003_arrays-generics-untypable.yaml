  p21:
  - node: p
    children:
    - node: text
      content: 型とPHPの歴史
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2004年 PHP 5.0で限定的ながら型宣言(type hinting)が可能に
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: arrayおよびクラス名(インターフェイス)のみ記述可能
    - node: li
      children:
      - node: text
        content: 2012年頃(?) PhpStormがPHPDocベースの静的解析を提供
    - node: li
      children:
      - node: text
        content: 2015年12月 PHP 7.0リリース、スカラー型宣言とstrict_typesが追加
    - node: li
      children:
      - node: text
        content: 2016年頃 Phan, PHPStan, Psalmが開発開始
    - node: li
      children:
      - node: text
        content: 2019年12月 PHP 7.4リリース、プロパティに型宣言が追加
  p22:
  - node: p
    children:
    - node: text
      content: 型についておさらい
  p23:
  - node: p
    children:
    - node: text
      content: 型とは何か
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 基本的には値の種類のこと
    - node: li
      children:
      - node: text
        content: PHPのデータ型は以下のように分類できる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 'スカラー型: bool / int / ¸oat / string'
        - node: li
          children:
          - node: text
            content: '複合型: array / object / callable / iterable / (mixed)'
        - node: li
          children:
          - node: text
            content: '特殊型: null / resource'
    - node: li
      children:
      - node: text
        content: クラスとインターフェイスをユーザー定義型として利用できる
  p24:
  - node: p
    children:
    - node: text
      content: PHPは動的言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 変数には型宣言がない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 基本的にどのような値でも入れることができる
        - node: li
          children:
          - node: text
            content: 値の型は実行時にいつでも確認できる
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: is_int(), is_bool(), is_array() などの関数
    - node: li
      children:
      - node: text
        content: 関数とプロパティは型宣言できるし、省略もできる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: パラメータや戻り値の型はRe¸ectionで実行時にいつでも確認できる
  p25:
  - node: p
    children:
    - node: text
      content: 型チェックは実行時まで遅延する
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: '$a : array'
  - node: p
    children:
    - node: text
      content: '$b : int'
  - node: p
    children:
    - node: text
      content: $a = [];
  - node: p
    children:
    - node: text
      content: 'そもそも '
  - node: p
    children:
    - node: text
      content: $b = 1;
  - node: p
    children:
    - node: text
      content: 計算できない
  - node: p
    children:
    - node: text
      content: echo $a + $b;
  p26:
  - node: p
    children:
    - node: text
      content: PHPの型宣言の特徴
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 実行時に型を確実にチェックされる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: スカラー型(bool, int, ¸oat, string)を宣言したとき、
          - node: br
          - node: text
            content: 'デフォルトではキャストよりも厳密に値を判定した上で型変換を行う '
        - node: li
          children:
          - node: text
            content: それ以外の型は一致しなかった場合にTypeErrorを発生する
    - node: li
      children:
      - node: text
        content: ファイル単位で declare(strict_types=1) と書くと厳密な型モードになる
    - node: li
      children:
      - node: text
        content: 関数の呼び出し側で宣言したモードが反映される
  p27:
  - node: p
    children:
    - node: text
      content: 型チェックは実行時まで遅延する
  - node: p
    children:
    - node: text
      content: '返り値でintに '
  - node: p
    children:
    - node: text
      content: 'パラメータ '
  - node: p
    children:
    - node: text
      content: 変換する
  - node: p
    children:
    - node: text
      content: mixed
  - node: p
    children:
    - node: text
      content: <?php
  - node: p
    children:
    - node: text
      content: '1 : int'
  - node: p
    children:
    - node: text
      content: '$toint = fn($n): int => $n;         '
  - node: p
    children:
    - node: text
      content: '0 : int'
  - node: p
    children:
    - node: text
      content: var_dump($toint('1'));
    - node: br
    - node: text
      content: var_dump($toint((int)''));
  - node: p
    children:
    - node: text
      content: 返り値で厳密な
  - node: p
    children:
    - node: text
      content: var_dump($toint(''));
  - node: p
    children:
    - node: text
      content: チェック
  p28:
  - node: p
    children:
    - node: text
      content: 漸進的型付けで動的言語を型検査する
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 何も型宣言されていない状態をmixed型(何でもあり)とする
    - node: li
      children:
      - node: text
        content: より詳細に状態を絞りたいポイントに型宣言やPHPDocなどを付けていく
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PhpStormやPHPStanなどのツールはPHPDocの内容を考慮してくれる
  p29:
  - node: p
    children:
    - node: text
      content: 型がついていない関数
  - node: p
    children:
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p30:
  - node: p
    children:
    - node: text
      content: 型宣言すればいい？
  - node: p
    children:
    - node: text
      content: 'int + intって '
    - node: br
    - node: text
      content: 本当にintなの？
  - node: p
    children:
    - node: text
      content: function add(int $a, int $b):int {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p31:
  - node: p
    children:
    - node: text
      content: ﬂoatにすればいい？
  - node: p
    children:
    - node: text
      content: 'ひとつの解決策では '
    - node: br
    - node: text
      content: あるが… 不必要に¸oat
    - node: br
    - node: text
      content: を強制するのか
  - node: p
    children:
    - node: text
      content: function add(float $a, float $b):float {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p32:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈
  - node: p
    children:
    - node: text
      content: (アノテーション)
  - node: p
    children:
    - node: text
      content: /**
    - node: br
    - node: text
      content: ' * @param int|float $a'
  - node: p
    children:
    - node: text
      content: あえて型宣言を省略する
  - node: p
    children:
    - node: text
      content: ' * @param int|float $b'
    - node: br
    - node: text
      content: ' * @return int|float'
    - node: br
    - node: text
      content: ' */         '
    - node: br
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p33:
  - node: p
    children:
    - node: text
      content: Union型宣言(PHP8.0)
  - node: p
    children:
    - node: text
      content: 'function add(         '
    - node: br
    - node: text
      content: '    int|float $a,              int|float $b         '
    - node: br
    - node: text
      content: '): int|float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p34:
  - node: p
    children:
    - node: text
      content: 'かくしてPHPは PHPDocなんか 書かなくても良い '
    - node: br
    - node: text
      content: 平和な世界になりました
  p35:
  - node: p
    children:
    - node: text
      content: HAPPY END?
  p36:
  - node: p
    children:
    - node: text
      content: 😇
  p37:
  - node: p
    children:
    - node: text
      content: ほんとうにそうか？
  p38:
  - node: p
    children:
    - node: text
      content: Bookクラスは著者を持つ
  - node: p
    children:
    - node: text
      content: '上司 '
    - node: br
    - node: text
      content: 「共著を想定できてる？」
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        private Author $author         '
    - node: br
    - node: text
      content: '    ) {'
    - node: br
    - node: text
      content: '        // ...         '
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p39:
  - node: p
    children:
    - node: text
      content: Bookの著者は複数居る
  - node: p
    children:
    - node: text
      content: 'arrayにすることで '
    - node: br
    - node: text
      content: 複数であることを表現
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
    children:
    - node: text
      content: 'Authorクラスの '
  - node: p
    children:
    - node: text
      content: '        // ...         '
  - node: p
    children:
    - node: text
      content: 情報が減ってる…
  - node: p
    children:
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '}         '
  p40:
  - node: p
    children:
    - node: text
      content: 著者一覧を出力したい
  - node: p
    children:
    - node: text
      content: 'Book::$authors : array 中身が何かわからない！'
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function printAuthors($fp): void {'
    - node: br
    - node: text
      content: '       foreach ($this->authors as $author) {                     fwrite($fp, $author->getName());         '
    - node: br
    - node: text
      content: '       }         '
  - node: p
    children:
    - node: text
      content: 'Authorクラスの '
  - node: p
    children:
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: メソッドを補完できない
  - node: p
    children:
    - node: text
      content: '}         '
  p41:
  - node: p
    children:
    - node: text
      content: Bookの著者は複数居る
  - node: p
    children:
    - node: text
      content: 'arrayにすることで '
    - node: br
    - node: text
      content: 複数であることを表現
  - node: p
    children:
    - node: text
      content: 'class Book         '
    - node: br
    - node: text
      content: '{         '
    - node: br
    - node: text
      content: '    function __construct('
    - node: br
    - node: text
      content: '        private array $authors         '
    - node: br
    - node: text
      content: '    ) {'
  - node: p
