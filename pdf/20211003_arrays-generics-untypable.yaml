  p44:
  - node: p
    children:
    - node: text
      content: この事例からわかること
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: arrayは独立した型だが、中に何が入っているかはわからない
    - node: li
      children:
      - node: text
        content: array型宣言されていても、どんな配列でも正常に動くわけじゃない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: むしろ「arrayなら何でも受け付ける」という関数はかなり少数派
        - node: li
