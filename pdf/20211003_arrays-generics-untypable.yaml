    text: $date = new DateTimeImmutable();id($date)->diff(
  p12:
  - kind: heading
    level: 1
    text: 値をそのまま返す関数
  - kind: para
    text: なんでも受け取ってなんでも返す
  - kind: para
    text: 'function id(mixed $value): mixed {return $value;}'
  p13:
  - kind: para
    text: 本日の目標はこういうときに怯えず型を付けることです
  p14:
  - kind: para
    text: 個々の静的解析ツール導入方法などは今回は扱いません
  p15:
  - kind: para
    text: ただし最新のPhpStorm 2021.2では静的解析ツールを導入しなくてもすんなり動くと思います
  p16:
  - kind: heading
    level: 1
    text: これまでのあらすじ
  p17:
  - kind: heading
    level: 1
    text: PHPカンファレンス2016
  p18:
  - kind: heading
    level: 1
    text: PHPカンファレンス福岡2019
  p19:
  - kind: heading
    level: 1
    text: PHP勉強会＠東京 (2020年2月)
  p20:
  - kind: heading
    level: 1
    text: PHPカンファレンス沖縄2021
  p21:
  - kind: para
    text: 型とPHPの歴史
  - kind: list
    items:
    - 2004年 PHP 5.0で限定的ながら型宣言(type hinting)が可能に
    - arrayおよびクラス名(インターフェイス)のみ記述可能
    - 2012年頃(?) PhpStormがPHPDocベースの静的解析を提供
    - 2015年12月 PHP 7.0リリース、スカラー型宣言とstrict_typesが追加
    - 2016年頃 Phan, PHPStan, Psalmが開発開始
    - 2019年12月 PHP 7.4リリース、プロパティに型宣言が追加
  p22:
  - kind: heading
    level: 1
    text: 型についておさらい
  p23:
  - kind: para
    text: 型とは何か
  - kind: list
    items:
    - 基本的には値の種類のこと
    - PHPのデータ型は以下のように分類できる
    - 'スカラー型: bool / int / Ëoat / string'
    - '複合型: array / object / callable / iterable / (mixed)'
    - '特殊型: null / resource'
    - クラスとインターフェイスをユーザー定義型として利用できる
  p24:
  - kind: heading
    level: 1
    text: PHPは動的言語
  - kind: list
    items:
    - 変数には型宣言がない
    - 基本的にどのような値でも入れることができる
    - 値の型は実行時にいつでも確認できる
    - is_int(), is_bool(), is_array() などの関数
    - 関数とプロパティは型宣言できるし、省略もできる
    - パラメータや戻り値の型はReËectionで実行時にいつでも確認できる
  p25:
  - kind: heading
    level: 1
    text: 型チェックは実行時まで遅延する
  - kind: heading
    level: 2
    text: <?php
  - kind: para
    text: '$a : array'
  - kind: para
    text: '$b : int'
  - kind: para
    text: そもそも計算できない
  - kind: heading
    level: 2
    text: $a = [];
  - kind: heading
    level: 2
    text: $b = 1;
  - kind: heading
    level: 2
    text: echo $a + $b;
  p26:
  - kind: para
    text: PHPの型宣言の特徴
  - kind: list
    items:
    - 実行時に型を確実にチェックされる
    - スカラー型(bool, int, Ëoat, string)を宣言したとき、
  - kind: para
    text: デフォルトではキャストよりも厳密に値を判定した上で型変換を行う
  - kind: list
    items:
    - それ以外の型は一致しなかった場合にTypeErrorを発生する
    - ファイル単位で declare(strict_types=1) と書くと厳密な型モードになる
    - 関数の呼び出し側で宣言したモードが反映される
  p27:
  - kind: heading
    level: 1
    text: 型チェックは実行時まで遅延する
  - kind: para
    text: 返り値でintに
  - kind: para
    text: パラメータ
  - kind: para
    text: 変換する
  - kind: para
    text: mixed
  - kind: para
    text: '1 : int'
  - kind: para
    text: '0 : int'
  - kind: para
    text: 返り値で厳密な
  - kind: heading
    level: 2
    text: <?php
  - kind: heading
    level: 2
    text: '$toint = fn($n): int => $n;'
  - kind: heading
    level: 2
    text: var_dump($toint('1'));
  - kind: heading
    level: 2
    text: var_dump($toint((int)''));
  - kind: heading
    level: 2
    text: var_dump($toint(''));
  - kind: para
    text: チェック
  p28:
  - kind: para
    text: 漸進的型付けで動的言語を型検査する
  - kind: list
    items:
    - 何も型宣言されていない状態をmixed型(何でもあり)とする
    - より詳細に状態を絞りたいポイントに型宣言やPHPDocなどを付けていく
    - PhpStormやPHPStanなどのツールはPHPDocの内容を考慮してくれる
  p29:
  - kind: heading
    level: 1
    text: 型がついていない関数
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p30:
  - kind: heading
    level: 1
    text: 型宣言すればいい？
  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: function add(int $a, int $b):int {return $a + $b;}
  p31:
  - kind: heading
    level: 1
    text: ﬂoatにすればいい？
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にËoatを強制するのか
  - kind: para
    text: function add(float $a, float $b):float {return $a + $b;}
  p32:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p33:
  - kind: heading
    level: 1
    text: Union型宣言(PHP8.0)
  - kind: para
    text: 'function add(int|float $a,int|float $b): int|float {return $a + $b;}'
  p34:
  - kind: para
    text: かくしてPHPはPHPDocなんか書かなくても良い平和な世界になりました
  p35:
  - kind: heading
    level: 1
    text: HAPPY END?
  p36:
  - kind: heading
    level: 1
    text: 😇
  p37:
  - kind: heading
    level: 1
    text: ほんとうにそうか？
  p38:
  - kind: heading
    level: 1
    text: Bookクラスは著者を持つ
  - kind: para
    text: 上司「共著を想定できてる？」
  - kind: para
    text: class Book{function __construct(private Author $author) {// ...}}
  p39:
  - kind: heading
    level: 1
    text: Bookの著者は複数居る
  - kind: para
    text: arrayにすることで複数であることを表現
  - kind: para
    text: Authorクラスの情報が減ってる…
  - kind: para
    text: class Book{function __construct(private array $authors) {// ...}}
  p40:
  - kind: heading
    level: 1
    text: 著者一覧を出力したい
  - kind: para
    text: 'Book::$authors : array'
  - kind: para
    text: 中身が何かわからない！
  - kind: para
    text: Authorクラスのメソッドを補完できない
  - kind: para
    text: 'class Book{function printAuthors($fp): void {foreach ($this->authors as
      $author) {fwrite($fp, $author->getName());}}}'
  p41:
  - kind: heading
    level: 1
    text: Bookの著者は複数居る
  - kind: para
    text: arrayにすることで複数であることを表現
  - kind: para
    text: Authorクラスの情報が減ってる…
  - kind: para
    text: class Book{function __construct(private array $authors) {// ...}}
  p42:
  - kind: heading
    level: 1
    text: 著者は複数居る
  - kind: para
    text: PHPDocの復活
  - kind: para
    text: class Book{function __construct(/** @var array<Author> */private array $authors)
      {// ...}
  p43:
  - kind: heading
    level: 1
    text: 著者一覧を出力したい
  - kind: para
    text: Book::$authors :array<Author>
  - kind: para
    text: Authorクラスのメソッドが補完できる
  - kind: para
    text: 'class Book{function printAuthors($fp): void {foreach ($this->authors as
      $author) {fwrite($fp, $author->getName());}}}'
  p44:
  - kind: heading
    level: 1
    text: この事例からわかること
  - kind: list
    items:
    - arrayは独立した型だが、中に何が入っているかはわからない
    - array型宣言されていても、どんな配列でも正常に動くわけじゃない
    - むしろ「arrayなら何でも受け付ける」という関数はかなり少数派
    - 「いったいどんな配列なのか」を詳細に説明する必要が生じる
    - 配列の内部詳細を書くための記法がある
  p45:
  - kind: heading
    level: 1
    text: 配列はひとつ！じゃない！！
  - kind: para
    text: list<int>
  - kind: para
    text: array<int,string>
  - kind: para
    text: array{id:int, name:string}
  - kind: list
    items:
    - ユーザＩＤがならんだリスト ［123, 456］
    - ユーザIDと名前の対応表 [123 => '野比のび太', 234 => '源静香']
    - ユーザを表す構造体 ['id' => 123, 'name' => '野比のび太']
    - ユーザを表す構造体がならんだリスト
  - kind: para
    text: '[[''id'' => 123, ''name'' => ''野比のび太''],[''id'' => 234, ''name'' => ''源静香''],]'
  - kind: para
    text: list<array{id:int, name:string}>
  p46:
  - kind: para
    text: 配列の記法
  - kind: list
    items:
    - 従来は Author[] とか int[] みたいに [] を後置する記法が主流だった
    - この記法では構造体のような配列の内部構造を記述できない
    - array<Author> や array<int> で要素を表現できる
    - array<int, Author> のように書くとキーも表現できる
    - array{id:int, name:string} のような値はarray-shapesと呼ばれる
  p47:
  - kind: heading
    level: 1
    text: 型パラメータ
  p48:
  - kind: heading
    level: 1
    text: array<int>
  p49:
  - kind: heading
    level: 1
    text: array<Author>
  p50:
  - kind: heading
    level: 1
    text: いろんなものが書ける
  p51:
  - kind: heading
    level: 1
    text: '再掲: 値をそのまま返す関数'
  - kind: para
    text: 'function id(mixed $value): mixed {return $value;}'
  p52:
  - kind: heading
    level: 1
    text: '再掲: 値をそのまま返す関数'
  - kind: para
    text: '/*** @template T* @phpstan-param T $value* @phpstan-return T*/function
      id(mixed $value): mixed {return $value;}'
  p53:
  - kind: heading
    level: 1
    text: 値をそのまま返す関数
  - kind: para
    text: PhpStormとかでメソッド名補完がきくようになった
  - kind: para
    text: $date = new DateTimeImmutable();id($date)->diff(
  p54:
  - kind: heading
    level: 1
    text: これを活用する
  p55:
  - kind: heading
    level: 1
    text: 配列の先頭要素をとる関数
  - kind: para
    text: '/*** @template T* @param array<T> $XS* @param T $default* @return T*/function
      first(array $xs, string $default): mixed {return $value;}'
  - kind: para
    text: 'function first(array $xs, mixed $default): mixed {foreach ($xs as $x) return
      $x;return $default;}'
  p56:
  - kind: heading
    level: 1
    text: 配列の先頭要素をとる関数
  - kind: para
    text: '/*** @template T* @param array<T> $xs* @param T $default* @return T*/function
      first(array $xs, mixed $default): mixed {foreach ($xs as $x) return $x;return
      $default;'
  p57:
  - kind: heading
    level: 1
    text: 配列の先頭要素を受け取る
  - kind: para
    text: PhpStormとかでメソッド名補完がきく
  - kind: para
    text: // list<DateTimeImmutable> を返す関数
  - kind: para
    text: $dates = get_dates();$first = first($dates, new DateTimeImmutable);$first->diff(
  p58:
  - kind: heading
    level: 1
    text: これを活用する
  p59:
  - kind: heading
    level: 1
    text: kane.php
  p60:
  - kind: heading
    level: 1
    text: フォント
