  p15:
  - kind: heading
    level: 1
    text: 'ふつうのPHP #とは'
  p16:
  - kind: heading
    level: 1
    text: pixivのPHP
  - kind: list
    items:
    - PHPはApache+mod_php (一時fpmを使ってた箇所あり)
    - フロントのnginxから、リバースプロキシしてApacheにリクエスト
    - むかしながらのDocumentRootにある .php ファイル ＝ URL
    - '例: https://www.pixiv.net/member.php?id=105589'
    - LinuxとかMySQLとか、よくあるLAMPのスタックに載ってる
  p17:
  - kind: heading
    level: 1
    text: 2012年のコードのイメージ
  - kind: para
    text: include_onceいっぱい
  - kind: para
    text: エラーハンドリング(してないページもあった)
  - kind: para
    text: <?php // www.pixiv.net/htdocs/hoge.php require_once __DIR__ . '/../inc/bootstrap.php';include_once
      INC_PATH . '/Hoge/Fuga.php';include_once INC_PATH . '/Hoge/Piyo.class.php';try
      {display()} catch (Exception $e) {error::exception_error($e);}
  - kind: para
    text: この下にもいっぱい
  - kind: para
    text: ファイルローカルな
  - kind: para
    text: function display() {// ...
  - kind: para
    text: グローバル関数
  p18:
  - kind: heading
    level: 1
    text: 2015年のコードのイメージ
  - kind: para
    text: <?php // www.pixiv.net/htdocs/hoge.php require_once __DIR__ . '/../inc/bootstrap.php';
  - kind: para
    text: include_once一個だけ
  - kind: para
    text: AppRunner::execute(new Www_HogeController);
  - kind: para
    text: このクラスは自動ロードされる
  p19:
  - kind: heading
    level: 1
    text: AppRunner (名前の由来は知らない)
  - kind: para
    text: <?php
  - kind: para
    text: whoops
  - kind: para
    text: final class PCAppRunner {public static function execute(Controller $controller)
      {try {Controller_Util::turnOnWhoops();Controller_Util::redirectToHttps();
  - kind: para
    text: パソコン版
  - kind: para
    text: $controller->main();} catch (\Throwable $exception) {PCAppRunner::setHttpStatus(500);Controller_Util::displayWhoops($exception);
  p20:
  - kind: heading
    level: 1
    text: AppRunnerとエラーハンドリング
  - kind: list
    items:
    - サービスごとの例外ハンドリングはAppRunnerが受け持つ
    - whoops! はエラー処理用のフレームワークなので、これだけを使って
  - kind: para
    text: 例外／エラー処理を完結させることも可能ではあるが、割と複雑になるので、開発環境でエラー画面を表示するだけの目的に専念してる
  - kind: list
    items:
    - エラーログはPHPの標準機能は利用せずfile_put_contents()でログファイル
  - kind: para
    text: に書き込んでる
  - kind: list
    items:
    - whoops! とエラーログの話はWEB+DB PRESS Vol.96 に書きました
  p21:
  - kind: heading
    level: 1
    text: 2018年のコードのイメージ
  - kind: para
    text: htdocs/hoge.phpは消滅
  - kind: para
    text: URLとファイルは切り離され
  - kind: para
    text: マップの一要素に
  - kind: para
    text: 全URLが1ファイルに
  - kind: para
    text: final class Controller_WwwRoutes {public static function getRoutes() {$route_map
      = ['/' => ['action' => function () {Www_IndexController::main();},],'/hoge.php'
      => ['action' => function () {Www_HogeController::main();},
  p22:
  - kind: heading
    level: 1
    text: PHPカンファレンス2017で発表
  p23:
  - kind: heading
    level: 1
    text: 命名規則
  - kind: list
    items:
    - クラス名はPSR-0的な _ を使った擬似名前空間
    - 組織内で一貫してればPSRに拘る必要がない
    - 「PSRの誤解」 https://qiita.com/tadsan/items/942a381e952e12a8fa5a
    - 基本はstaticで、クラスはインスタンス化せずに利用
    - クラスを擬似的な関数・定数置き場にしている
    - どうしてこんなことを続けてるのかは去年のLTで話した
  p24:
  - kind: heading
    level: 1
    text: 去年の当日募集LTで話した
  p25:
  - kind: para
    text: 開発しやすさのための取り組み
  p26:
  - kind: heading
    level: 1
    text: PHPで開発しにくいところ
  - kind: list
    items:
    - クエリパラメータのハンドリング
    - PDOの機能の貧弱さ
    - テンプレートエンジンとURLの問題
    - Railsにあるようなカッコイイ機能がない
    - かっこいいエラー表示
    - 対話環境 (rails console)
  p27:
  - kind: heading
    level: 1
    text: クエリパラメータの問題
  - kind: para
    text: $id = $_GET['user_id'];if (is_numeric($id)) User_Common::getById($id);else
      error("不正な入力です");
  - kind: list
    items:
    - こういうコードを書いてはいけない
    - クエリパラメータは数字ではない値が入ってくる可能性
    - 入力が空、入力が任意の文字列、入力が不正な数字列、入力が配列
    - filter_input() をかけると安全にはなるが、それでも面倒
  p28:
  - kind: list
    items:
    - ParamHelper
  - kind: para
    text: $id = ParamHelper::getPositiveInt('id');User_Common::getById($id);
  - kind: list
    items:
    - クエリパラメータ (またはform) から値を取り出すヘルパー
    - 未入力や不正な入力があると例外を投げる
    - 前述のAppRunnerでキャッチしてエラー画面を描画する
  p29:
  - kind: list
    items:
    - ParamHelper
  - kind: para
    text: $mode = ParamHelper::getEnum('mode', ['hoge', 'fuga'], ['post' => 'only']);
  - kind: list
    items:
    - ?mode=hoge または ?mode=fuga のみを期待するようなパターン
    - 不正な形式や ?mode=piyo のような期待しない入力で例外を投げる
  p30:
  - kind: heading
    level: 1
    text: テンプレートとURL生成の問題
  - kind: para
    text: <a href="{$smarty.const.SYSTEM_URL_WWW|escape}member_illust.php?id={$user.id|escape}">{$user.name|escape}</a>
  - kind: list
    items:
    - こういうコードを書くと事故が入り込みやすい
    - 純粋にtypoの危険性
    - idなどのパラメータに不正な値を入れるリスク
  p31:
  - kind: list
    items:
    - ReverseRoute
  - kind: para
    text: <a href="{reverse_route page='fullWwwMemberProfile' id=$user.id}">{$user.name|escape}</a>
  - kind: list
    items:
    - あるページに名前をつけて、reverse_route関数に page 引数で渡す
    - 生成結果は変更前と同じ
    - ルーティングの逆関数にあたるので、一部のフレームワークは
  - kind: para
    text: ReverseRoutingやURLヘルパーなどの名前でサポートしてる
  p32:
  - kind: list
    items:
    - ReverseRoute
  - kind: para
    text: '/*** @route\example https://www.pixiv.net/member.php?id=12345 {id: 12345}*
      @route\example https://www.pixiv.net/member.php?id=12345&utm_source=xxxxx{id:
      12345, utm_source: "xxxxx"}*/public static function fullWwwMemberProfile(array
      $params){Util_Assert::num($params[''id'']);'
  - kind: para
    text: return ReverseRoute::buildUrl(SYSTEM_URL_WWW, '/member.php', ['id'],$params);}
  p33:
  - kind: heading
    level: 1
    text: blogに書きました
  - kind: heading
    level: 2
    text: https://devpixiv.hatenablog.com/entry/2016/10/25/093000
  p34:
  - kind: heading
    level: 1
    text: PDOの問題
  - kind: list
    items:
    - SQLは自動生成じゃなくて手で書きたい…
  - kind: para
    text: でもPDOで複雑なクエリを書こうとすると文字列結合が避けられない…
  - kind: list
    items:
    - 'PDOで書きにくいクエリの代表例: IN'
    - もう ? を並べてインデックスをインクリメントしながらbindValueはやだお
    - PDOのクエリのplaceholderに ? を書くか :hoge で書くか問題
    - 型チェックできるように書くのもちょっとめんどう
  p35:
  - kind: heading
    level: 1
    text: PxvSql
  p36:
  - kind: heading
    level: 1
    text: PxvSql
  - kind: list
    items:
    - 文字列結合を一切やらなくてもクエリが書けるようになった
    - 実行時に型検査をするのでnullなどの不穏な値は入り込まない
    - エラーチェックのボイラープレートがｸﾞｯと減る
    - SQLi(脆弱性)のリスクなし (ただしmysqlndの実装の不備はないと信じる)
    - :hoge@int で整数の埋め込み、 :fuga_ids@int[] で複数の整数を展開する
    - '%if や %for の記法で条件分岐や複数SETなども可能'
    - 問題意識はQiitaに書いた https://qiita.com/tadsan/items/e615a779baa6eabdab47
  p37:
  - kind: heading
    level: 1
    text: PDOのラッパー
  - kind: list
    items:
    - これは、少なくとも2011年以前からあった仕組み
    - 書き込み用(master)と読み込み用(slave)の系統を明示的に分けて利用可能
    - slaveにINSERTやUPDATEなどのクエリを発行しようとすると例外
    - 全クエリにSQLのクエリ単一行にして、トレースをコメントにして埋め込む
    - スロークエリのログにどのコントローラに起因するか集計しやすい
    - スロークエリを一覧できるビューアーもある
  p38:
  - kind: heading
    level: 1
    text: 新機能をリリース時にどうする？
  - kind: list
    items:
    - 'A: 新機能が実装されたブランチをリリースするときマージする'
    - 'B: リリース前にあらかじめマージして、実行されないようにしておく'
    - よくある問題
    - Aは機能の規模が大きいとビッグバンマージを引き起こし、
  - kind: para
    text: 予期せぬ問題を引き起こすことがある
  - kind: list
    items:
    - 理想としてはBで、一般ユーザー向けに実行されないとしても
  - kind: para
    text: 鮮度のよいうちにマージしておきたい (リリース時の変更を最小限に)
  p39:
  - kind: heading
    level: 1
    text: A/Bテスト／機能の有効化／無効化
  - kind: para
    text: if ($_SERVER['REMOTE_ADDR'] === OFFICE_IP) {hogehoge();}
  - kind: list
    items:
    - 新しい機能をサービスに実装して、社内でだけ有効化したいとする。
    - 無造作にこんなコードを書かれると後から意味不明になる
    - そもそも社外と社内での挙動が別物になるので嫌な予感しかしない
  p40:
  - kind: heading
    level: 1
    text: DevToggle (A/Bテストフレームワーク)
  - kind: para
    text: if (ABTest_DevToggle::isEnabledDevToggle('hogeFunc')) {hogehoge();}
  - kind: list
    items:
    - 専用のコンソール画面でボタンを押すことで有効化／無効化される
    - 設定を一行足すだけで一般ユーザーに対してリリースできる
    - リリース後に障害などが発生しないことが確認できたらifを消す
    - 元はA/Bテストのための機構だった (一般ユーザーに対して確率で適用)
  p41:
  - kind: heading
    level: 1
    text: まとめ
  p42:
  - kind: heading
    level: 1
    text: 何もない野原に秩序をつくる
  - kind: list
    items:
    - べんり機能を導入すると、部分的に生産性が体感で数倍になったりする
    - 一からサービスを作るとしたら同じことを繰り返せるかは、悩む
    - いまだったらLaravelを入れるかもしれない
    - ただ、それは2018年のチート未来人だからできる発言
    - サービスの価値はコードではなく、その結果のユーザー体験
    - フレームワークがなかったとしても、
  - kind: para
    text: pixivが2007年からユーザーに価値を提供してきた結果は変らない
