  p5:
  - kind: heading
    level: 1
    text: イラストコミュニケーションサービス pixiv
  - kind: list
    items:
    - 2007年9月10日に開始されたイラストSNS・投稿サイト
    - 'イラスト: 約7000万作品 (IDベース、画像枚数は1億4000万枚以上)'
    - 'ユーザー: 約3000万アカウント (IDベース)'
    - 'イラストブックマーク: 約35億回'
    - 'アクセス数: 月間76億 (HTTPdログベース、一般的な意味のPVとは異なる)'
    - 'サーバー台数: 53台 (pixivのデプロイ対象になっているApache HTTPdのみ)'
  p6:
