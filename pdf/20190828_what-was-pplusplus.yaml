  p1:
  - kind: heading
    level: 1
    text: P++とは何だったのか
  - kind: heading
    level: 2
    text: Bring peace to the galaxy with P++
  - kind: para
    text: '[2019-08-28]第141回 PHP勉強会＠東京'
  - kind: para
    text: '#phpstudy'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv事業本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: P++とは何か
  p6: []
  p7:
  - kind: para
    text: 言ってることは正しい
  p8:
  - kind: para
    text: 情報は間違ってる
  p9:
  - kind: para
    text: どういうことか
  p10:
  - kind: para
    text: さて
  p11:
  - kind: para
    text: アンケート
  p12:
  - kind: para
    text: 君の想像するPHPはどんなやつ？
  p13:
  - kind: heading
    level: 1
    text: A
  - kind: para
    text: '<!DOCTYPE html><html><head><title>Hello, PHP!</title></head><p><?php if
      (date(''H'') < 19): ?>こんにちは<?php else: ?>こんばんは<?php endif; ?></p><p>今は<?= htmlspecialchars(date(''H''))
      ?>時です</p>'
  p14:
  - kind: heading
    level: 1
    text: B
  - kind: para
    text: <?php require 'bootstrap.php';
  - kind: para
    text: $db = mysqli_connect();
  - kind: para
    text: $stmt = mysqli_prepare($db, 'SELECT * FROM books');
  - kind: para
    text: mysqli_stmt_execute($stmt);
  - kind: para
    text: print '<h1>本の一覧</h1><ul>';
  - kind: para
    text: foreach ($stmt as $s) {
  - kind: para
    text: print '<li>'; print $s->name; print '</li>';
  - kind: para
    text: '}'
  p15:
  - kind: heading
    level: 1
    text: C
  - kind: para
    text: <?php namespace Hoge\Http\Controller;
  - kind: para
    text: class BooksController extends BaseController {public function index() {$books
      = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));}}
  p16:
  - kind: para
    text: A?
  - kind: para
    text: B?
  - kind: para
    text: C?
  p17:
  - kind: para
    text: PHPはどんな速度で変化してるか
  p18:
  - kind: para
    text: 速い？
  - kind: para
    text: 遅い？
  p19:
  - kind: para
    text: PHPは変わったと思う？
  p20:
  - kind: para
    text: 速くなったとしたらいつから？
  p21:
  - kind: para
    text: これ何の数かわかる？
  p22:
  - kind: para
    text: PHP7.0…
  - kind: para
    text: PHP7.1…
  - kind: para
    text: PHP7.2…
  - kind: para
    text: PHP7.3…
  - kind: para
    text: PHP7.4…
  p23:
  - kind: para
    text: お前はPHP7以降追加された機能の数を覚えているか
  p24:
  - kind: para
    text: せいかい
  - kind: para
    text: バージョンごとに
  - kind: para
    text: 受理されたRFC数
  p25:
  - kind: para
    text: RFC?
  p26: []
  p27:
  - kind: para
    text: PHP7の機能追加や改廃の提案
  p28:
  - kind: para
    text: PythonでのPEPに相当
  p29:
  - kind: para
    text: RFCの提案をもとに、PHP開発者(php.netのVCSアカウント所有者)が一人一票を投じる仕組み
  p30:
  - kind: para
    text: 単純に｢追加された数｣ではないが
  p31:
  - kind: para
    text: PHPの行く末を知りたければRFCをウォッチすればよい
  p32:
  - kind: para
    text: https://wiki.php.net/rfc
  p33:
  - kind: para
    text: https://php-rfc-watch.beberlei.de/
  p34: []
  p35:
  - kind: para
    text: https://wiki.php.net/rfc
  p36:
  - kind: para
    text: 改めて数を見てみよう
  p37:
  - kind: para
    text: PHP7.0…
  - kind: para
    text: PHP7.1…
  - kind: para
    text: PHP7.2…
  - kind: para
    text: PHP7.3…
  - kind: para
    text: PHP7.4…
  p38:
  - kind: para
    text: 意外に変わってるなって感じはする
  p39:
  - kind: para
    text: とてもざっくり言うとレガシー仕様は消え､不条理な挙動は是正され､他言語にあるようなカッコイイ機能が追加提案されてる
  p40:
  - kind: para
    text: 😇
  p41:
  - kind: para
    text: ところでRasmusはこう言った
  p42:
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told you you should be using.
  - kind: para
    text: I don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p43:
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”–Rasmus
      Lerdorf
  p44:
  - kind: para
    text: 改めてPHPの言語仕様が追加された時系列を見てみよう
  p45:
  - kind: heading
    level: 1
    text: PHP 7.4
  - kind: para
    text: Arrow functions 2.0
  - kind: para
    text: JavaScriptなど
  - kind: para
    text: Typed Property
  - kind: para
    text: Javaなどの静的型付き言語
  - kind: para
    text: Numeric Literal Separator
  - kind: para
    text: Ada, Ruby, JavaScriptなど
  p46:
  - kind: heading
    level: 1
    text: PHP 7.3
  - kind: para
    text: Flexible Heredoc and Nowdoc
  - kind: para
    text: Rubyにも似た記法はある
  - kind: para
    text: list() Reference Assignment
  - kind: para
    text: これはPHP独自に近い
  p47:
  - kind: heading
    level: 1
    text: PHP 7.2
  - kind: para
    text: Trailing Commas In List Syntax
  - kind: para
    text: カンマ(,)を並べて書く記法のほぼ全
  - kind: para
    text: てで余分につけてもよくなった
  - kind: para
    text: Parameter Type Widening
  - kind: para
    text: 継承したクラスで引数の型省略
  p48:
  - kind: heading
    level: 1
    text: PHP 7.1
  - kind: para
    text: Nullable Types
  - kind: para
    text: Void Return Type
  - kind: para
    text: Multi catch
  - kind: para
    text: Allow specifying keys in list()
  p49:
  - kind: heading
    level: 1
    text: PHP 7.0
  - kind: para
    text: Anonymous Class
  - kind: para
    text: Generator Delegation(yield from)
  - kind: para
    text: Return Type Declaration
  - kind: para
    text: Null Coalesce Operator
  - kind: para
    text: Scalar type hints
  p50:
  - kind: heading
    level: 1
    text: PHP 5.6
  - kind: para
    text: Exponential Operator(pow**)
  - kind: para
    text: Importing named function
  - kind: para
    text: Variadic function argument (...)
  - kind: para
    text: 配列を引数として展開
  - kind: para
    text: Argument unpacking(...)
  - kind: para
    text: 可変長引数を配列として取得
  p51:
  - kind: heading
    level: 1
    text: PHP 5.5
  - kind: para
    text: Generator
  - kind: para
    text: ﬁnally keyword (try-catch-...)
  - kind: para
    text: Const array/string dereference
  - kind: para
    text: Allow non-scalar keys in foreach
  p52:
  - kind: heading
    level: 1
    text: PHP 5.4
  - kind: para
    text: Traits
  - kind: para
    text: Short array syntax
  - kind: para
    text: callable type hint
  p53:
  - kind: heading
    level: 1
    text: PHP 5.3
  - kind: para
    text: Closures (function expression)
  - kind: para
    text: 関数式、クロージャ、またはラムダ式
  - kind: para
    text: JavaScriptのfunctionに似てる
  - kind: para
    text: が、レキシカルスコープ(変数の捕捉)のためにuseキーワードが必要
  p54:
  - kind: para
    text: 抽象クラス, トレイト, インターフェイス, ジェネレータ, イテレータ, クロージャ, 函数の動的呼び出し, 無名クラス, eval, 型宣言,
      連想配列, リフレクションAPI, 自己文書化, 標準入出力の読み書き,REPL, クラスの遅延ロード
  p55:
  - kind: para
    text: これらの新機能をフルに活用してコードを書いてる人はどれだけ居るの？
  p56:
  - kind: para
    text: (そういう人は居るけど､そうじゃない人たちと二極化してるのは確実)
  p57:
  - kind: para
    text: PHPの古参開発者たちは冷ややか
  p58:
  - kind: para
    text: PHP以外の言語に触れてた経験のないみんなもポカーソ
  p59:
  - kind: para
    text: そういうとこやぞ
  p60:
  - kind: para
    text: クールな新機能や静的解析しやすい仕様に興味あるひと
  p61:
  - kind: para
    text: 従来のコードが動けば十分で破壊的進化は望まないひと
  p62:
  - kind: para
    text: そのほかにもPHPユーザには様々な立場のひとたちが居る
  p63:
  - kind: para
    text: その見えない溝が可視化されたのが今回の一件
  p64:
  - kind: para
    text: さらにひきがねを引く事件があった
  p65: []
  p66:
  - kind: para
    text: Deprecate PHP's short open tags, again一般的なPHPタグは<?php ... ?>または<?= ... ?>
      だが、<? ... ?>という形式もあるphp.iniで有効無効を切替られる環境によってOnだったりOffだっ
  - kind: para
    text: たり
  p67:
  - kind: para
    text: Deprecate PHP's short open tags, again
  - kind: para
    text: XML宣言との相性がとても悪い
  - kind: para
    text: そんな半端モンは引導を渡してやろう
  - kind: para
    text: ぜ！ ということで提案された
  - kind: para
    text: 構文がシンプルになるし、機械的に変
  - kind: para
    text: 換もできるから良いだろ、という主旨
  p68:
  - kind: para
    text: Zeevによる反論
  p69: []
  p70:
  - kind: heading
    level: 1
    text: Zeev Suraski
  - kind: para
    text: PHP3・4の開発者
  - kind: para
    text: 相方のAndi Gutmansとともに
  - kind: para
    text: VM型処理系のZend Engine開発
  - kind: para
    text: PHPでよくあるZend…は
  - kind: para
    text: ZeevとAndiに由来
  - kind: para
    text: PHPコードに未だに影響を残す
  p71:
  - kind: heading
    level: 1
    text: Rasmus Lardorf
  - kind: para
    text: オリジナルのPHP(PHP/FI)作者
  - kind: para
    text: 言語の原作者は最終的な決定権を担っていることがある(BDFL:優しい終身の独裁者)が､Rasmusはそうではない
  - kind: para
    text: 必要な場面では発言するが権限はRFCの一票しか持ってない
  - kind: para
    text: 今回の一件にはあまり関与してない
  p72:
  - kind: heading
    level: 1
    text: Nikita Popov
  - kind: para
    text: 近年のPHPの中核的な開発者
  - kind: para
    text: PHP5.5以降､非常に多数の言語機能を実装してPHPに取り入れてきた
  - kind: para
    text: PHP-Parserなどの作者
  - kind: para
    text: 去年の大学院を卒業し今年JetBrainsに入社してPhpStormチームに参加
  p73:
  - kind: para
    text: 📛
  p74:
  - kind: para
    text: 🔥
  p75:
  - kind: para
    text: 燃えた
  p76:
  - kind: para
    text: めちゃくちゃ燃えた
  p77:
  - kind: para
    text: Deprecate PHP's short open tags, again<? ... ?> 使ってないひとは使ってないし、廃止したからと言って文法が簡単になるか…？この仕様を削除してもパフォーマンスは特に向上しないし、コードもちょっ
  - kind: para
    text: としか消えない
  p78:
  - kind: para
    text: Deprecate PHP's short open tags, again大山鳴動して鼠一匹大騒ぎして文法変更する割に得られるメリットが少なすぎないか…？だからと言って負債になった文法はずっと変えられないままなのか？！
  - kind: para
    text: 喧喧諤諤非難轟々
  p79:
  - kind: para
    text: 再び立ち上がった
  p80: []
  p81:
  - kind: para
    text: PHPコミュニティ内の革新vs保守の対立を解決したい
  p82:
  - kind: para
    text: ここで提案されたのがP++
  p83:
  - kind: para
    text: 概要は最初の本の虫の記事で紹介された通り
  p84: []
  p85:
  - kind: para
    text: 誰も何も決定してないことを除けば
  p86:
  - kind: para
    text: PHPの意思決定機関が開発者によるRFCの多数決であることを知っていれば誤解はしないはず
  p87:
  - kind: para
    text: 本の虫で紹介された｢ソース｣はメーリングリストでの議論のためのメモ書き
  p88:
  - kind: para
    text: 燃え拡がる
  - kind: para
    text: 誤解…！
  - kind: para
    text: 
  - kind: para
    text: 🔥
  - kind: para
    text: 🔥
  - kind: para
    text: 🔥
  p89: []
  p90:
  - kind: para
    text: その後の経緯はこの記事に書いた通り
  p91: []
  p92:
  - kind: para
    text: 理想はわかるが…現実的ではない…
  p93:
  - kind: para
    text: Zeevの予言…
  p94: []
  p95:
  - kind: para
    text: PHPの明日はどっちだ
  p96:
  - kind: para
    text: 救いとしてはそれ以降も別のRFCで建設的な議論は続いてるし、ZeevもNikitaも参加している
  p97:
  - kind: para
    text: PHP先生の次回作(PHP8)にご期待ください！
