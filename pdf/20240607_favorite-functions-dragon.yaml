      content: おなじみの関数がいっぱい
  p35:
  - node: p
    children:
    - node: text
      content: 拡張モジュール(Extension)とは
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPにコンパイル時または起動時にロードされる機能単位
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PHPスクリプトではなく動的モジュール(*.so, *.dll)で提供される
    - node: li
      children:
      - node: text
        content: コンパイル時に有効化／無効化するか、php.iniに記述する必要あり
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: オンプレで実行していたりするとシステム管理者の作業が必要な場合あり
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: レンタルサーバー(非VPS)では利用者が設定できないかもしれない
    - node: li
      children:
      - node: text
        content: ApacheやPHP-FPMでは設定変更後に再起動することで反映される
  p36:
  - node: p
    children:
    - node: text
      content: 拡張モジュールの種類
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: コア拡張 → PHPの標準機能として組み込まれており無効化できない
    - node: li
      children:
      - node: text
        content: バンドル拡張 → PHPに同梱されていてコンパイル時に有効化できる
    - node: li
      children:
      - node: text
        content: 外部拡張 → PHP以外のライブラリとリンクすることで有効になる機能
    - node: li
      children:
      - node: text
        content: PECL拡張 → pecl.php.net でインストールできるモジュール
    - node: li
      children:
      - node: text
        content: その他(野良) → コードからphpizeしてcon(cid:230)gureしてmake install
  p37:
  - node: p
    children:
    - node: text
      content: Docker
  - node: p
    children:
    - node: text
      content: (PHP Ofﬁcial Image)
  - node: p
    children:
    - node: bold
      content: mbstringはデフォルト有効
