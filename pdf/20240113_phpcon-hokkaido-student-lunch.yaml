  p12:
  - kind: para
    text: PHPは汎用プログラミング言語
  - kind: list
    items:
    - HTTP = Webサービス
  p13:
  - kind: para
    text: PHPは汎用プログラミング言語
  - kind: list
    items:
    - HTTP = Webサービス
    - それ以外の任意のあらゆること (得意とは言ってない)
  p14:
  - kind: para
    text: PHPは汎用プログラミング言語
  - kind: list
    items:
    - HTTP = Webサービス
    - それ以外の任意のあらゆること (得意とは言ってない)
    - CLI
    - GUIもいちおう… (得意とは言ってない)
  p15:
  - kind: para
    text: みなさんの想像するPHPとは
  p16:
  - kind: heading
    level: 1
    text: A
  - kind: para
    text: '<!DOCTYPE html><html><head><title>Hello, PHP!</title></head><p><?php if
      (date(''H'') < 19): ?>こんにちは<?php else: ?>こんばんは<?php endif; ?></p><p>今は<?= htmlspecialchars(date(''H''))
      ?>時です</p>'
  p17:
  - kind: heading
    level: 1
    text: B
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s) {print '<li>'; print $s->name; print '</li>';}print
      '</ul>';
  p18:
  - kind: heading
    level: 1
    text: C
  - kind: para
    text: <?php declare(strict_types=1);namespace Foo\Http\Controller;
  - kind: para
    text: class BooksController extends BaseController {public function index() {$books
      = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));}}
  p19:
  - kind: heading
    level: 2
    text: P H P の原作者
  - kind: heading
    level: 1
    text: ラスマスかく語りき
  p20:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told
  - kind: para
    text: you you should be using.I don't care about this crap at all.”
  - kind: para
    text: –Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p21:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “PHPにはprotectedプロパティも
  - kind: para
    text: 抽象メソッドもありますよ。計算機科学の
  - kind: para
    text: 教授が「使え」と言ってるものは全部。
  - kind: para
    text: そんなことはクソ興味ないですけど”
  - kind: para
    text: –Rasmus Lerdorf (tadsanによる超訳)
  p22:
  - kind: para
    text: 変数に$があってPerlっぽくて
  p23:
  - kind: para
    text: C言語っぽい関数と-> があって
  p24:
  - kind: para
    text: 雰囲気Javaっぽいオブジェクト指向で
  p25:
  - kind: heading
    level: 1
    text: PHPは見る人の心を映す
  p26:
  - kind: heading
    level: 1
    text: 整理しましょう
  p27:
  - kind: heading
    level: 1
    text: A=SSIスタイル
  - kind: para
    text: '<!DOCTYPE html><html><head><title>Hello, PHP!</title></head><p><?php if
      (date(''H'') < 19): ?>こんにちは<?php else: ?>こんばんは<?php endif; ?></p><p>今は<?= htmlspecialchars(date(''H''))
      ?>時です</p>'
  p28:
  - kind: heading
    level: 1
    text: Perl
  - kind: para
    text: use DBI;
  - kind: para
    text: $db = DBI->connect('...');$stmt = $db->prepare('SELECT * FROM books');$stmt->execute;print
      '<h1>本の一覧</h1>'; print '<ul>';for ($i = 0; $I < $sth->rows; $i++) {@row = $sth->fetchrow_array;print
      '<li>'; print $row[0]; print '</li>';}print '</ul>';
  p29:
  - kind: heading
    level: 1
    text: B=CGIスタイル
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s) {print '<li>'; print $s->name; print '</li>';}print
      '</ul>';
  p30:
  - kind: heading
    level: 1
    text: C=OOPスタイル
  - kind: para
    text: <?php declare(strict_types=1);namespace Foo\Http\Controller;
  - kind: para
    text: class BooksController extends BaseController {public function index() {$books
      = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));}}
  p31:
  - kind: heading
    level: 1
    text: PHPは汎用プログラミング言語
  - kind: list
    items:
    - PHPはHTTP(≒Webサービス)を言語レベルでサポートしている
    - ほかの言語ではCGIライブラリとしてサポートしている機能が組み込み
    - 各Webサーバとの連携はSAPI(Server API)として定義されている
    - どのサーバー上でもCGI風の動作をする
    - コマンドラインスクリプトとして実行するモード(CLI)もSAPIのひとつ
  p32:
  - kind: para
    text: PHPの歴史
  - kind: list
    items:
    - '1994: PHP Tools 1.0 → SSI風構文のテンプレートエンジン'
    - '1996: PHP/FI 2.0 → 汎用言語として使用できるように'
    - '1998: PHP 3.0 → クラス構文のサポート'
    - '1999: PHP 4.0 → Zend Engine (インタプリタVM化)'
    - '2003: PHP 5.0(開発中) → オブジェクト指向構文の刷新'
  p33:
  - kind: para
    text: PHPと文字列
  - kind: list
    items:
    - string型 = バイト列 (任意のバイナリが格納できる)
    - Ruby 1.8、Python 2.xと同等
    - PHP 6.xでICUと統合してUCS正規化しようとした
    - 規定路線だったので、PHP 5.2(2006年)にbinaryキャストが追加
    - 当時期待されていたパフォーマンス要件を満たせず2010年に断念
    - 文字列以外の機能は5.3(2009年)、5.4(2012年)でリリース
  p34:
  - kind: para
    text: PHPのオブジェクト指向機能
  - kind: list
    items:
    - PHP 5.0
    - 可視性 (public/protected/private)
    - abstract/interfaceが導入
    - オブジェクトが参照型に (それまではCoW)
    - 'PHP 5.4: traitが導入'
    - 'PHP 5.6: 定数式 (それまではリテラルしか記述できなかった)'
  p35:
  - kind: para
    text: PHPのオブジェクト指向機能
  - kind: list
    items:
    - 'PHP 7.4: 型付きプロパティ'
    - 'PHP 8.0: コンストラクタプロモーション (PHP 8.2)'
    - 'PHP 8.1: readonlyプロパティ'
    - 'PHP 8.2: trait定数宣言'
    - 'PHP 8.3: 型付き定数宣言'
  p36:
  - kind: para
    text: <?php
  - kind: para
    text: <?php
  - kind: para
    text: class Book {public function __construct(public readonly string $name,) {}
  - kind: para
    text: '...'
  - kind: para
    text: class Book {/*** @var string* @readonly*/private $name;/** @param string
      $name */public function __construct($name) {$this->name = $name;
  - kind: para
    text: '...'
  p37:
  - kind: para
    text: 静的解析しやすい特徴
  - kind: list
    items:
    - クラスや関数が再定義されることは基本的にない
    - Java風のクラス継承(class, interface)
    - 関数呼び出しは全て () がつく、文末は必ず ;
  p38:
  - kind: para
    text: PHPの進化は型宣言の進化
  p39:
  - kind: para
    text: いまやPHPは静的型付きと言っても過言ではない(本当か…？)
  p40:
  - kind: heading
    level: 1
    text: 型がついていない関数(PHP5)
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p41:
  - kind: heading
    level: 1
    text: スカラー型宣言(PHP7)
  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p42:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にfloat
  - kind: para
    text: を強制するのか
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p43:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p44:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p45:
  - kind: heading
    level: 1
    text: LL言語としてのPHP vs エディタ
  - kind: list
    items:
    - 2000年代のCGIやLL言語(Lightweight Language)という用語が
  - kind: para
    text: よく使われていた頃は「重厚鈍重なIDEが必要な言語」のアンチテーゼとしてシンプルなスクリプト言語とエディタが好まれていた (ように思う)
  - kind: list
    items:
    - 時は流れ、Webアプリケーションは巨大になり、ファイルは増え、シンプルなエ
  - kind: para
    text: ディタでは開発のオーバーヘッドが無視しがたくなってきた
  - kind: list
    items:
    - PhpStorm(JetBrains社のIDE)が静的解析とインテリジェントな編集機能
  - kind: para
    text: を提供してくれるようになった
  p46:
  - kind: para
    text: PHPと静的解析
  - kind: list
    items:
    - PHP組み込みで提供されているのは php -l (syntax check) のみ
    - 「静的解析ツール」と呼ばれうるものは2000年代からあった
    - ドキュメント生成、コーディングスタイルのチェック
    - 2010年代後半になってPhpStormの普及を呼び水にして、
  - kind: para
    text: 型システムや変数スコープを正確に扱えるツールが開発され始めた
  p47:
  - kind: heading
    level: 1
    text: PHP Static Analysis Tool
  p48:
  - kind: para
    text: PHPStanとは
  - kind: list
    items:
    - 2016年から開発されているPHPの静的解析ツール
    - Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
  - kind: para
    text: 高速な解析を実現していた
  - kind: list
    items:
    - 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p49:
  - kind: para
    text: PHPStanの提供する型
  - kind: list
    items:
    - PHPの組み込み型、クラス名、インターフェイス名
    - '修飾型: non-empty-string, non-empty-array'
    - 'ユニオン型: A|B'
    - 'ジェネリクス: array<T>, ArrayObject<T>'
    - '定数型: 123, "foo", Foo::BAR'
  p50:
  - kind: para
    text: PHP処理系
  - kind: list
    items:
    - 'ソースコード: https://github.com/php/php-src'
    - 処理系のソースコードはC言語で書かれている(一部のみC++)
    - パーサーはYacc(Bison)で記述されている
    - 基礎知識は『Rubyソースコード完全解説』の知識が役に立つ
    - 議論はメーリングリストがメインだが、GitHub issueやPull Requestも
  - kind: para
    text: 受け付けてくれる
  p51:
  - kind: para
    text: PHPの開発体制
  - kind: list
    items:
    - Request for Comments https://wiki.php.net/rfc
    - 言語機能の改廃提案と投票プロセス、リリース周期が明文化
    - 機能提案する人は仕様をまとめてMLで議論、実装も責任を持って用意する
    - PHP原作者のRasmus Lardorfは開発者としての1票しか行使しない
    - PHP 7.0(2015年)以降、11月末〜12月初頭にリリースが定着
    - 品質保障のためのfeature freeze、RC版なども定められた
  p52:
  - kind: heading
    level: 1
    text: PHPは誰が開発しているのか
  p53: []
  p54: []
  p55:
  - kind: heading
    level: 1
    text: PHPはどこに行くのか
  - kind: list
    items:
    - おそらく、どの言語よりも利用者の幅が広い言語
    - 動的なホームページを作りたい個人
    - Web制作からのステップアップ
    - CMSを使ったWebサイト構築
    - 各種システム開発 (大規模Webサイト、ゲームのAPIサーバ…)
  p56:
  - kind: heading
    level: 1
    text: PHPは過去と未来を繋ぐ言語
  - kind: list
    items:
    - PHPの仕様はCGIの時代から地続き
    - PerlやRubyはApache mod時代やPost WSGI時代に断絶がある
    - PHPはpreforkなサーバ上でもCGI互換のシェアードナッシング
  - kind: para
    text: (すべての状態が隔離され、リクエストごとに初期化される)
  - kind: list
    items:
    - 汎用プログラミング言語の能力を持ちながら根幹がテンプレートエンジンに
  - kind: para
    text: あるので、小規模からある程度大規模なアプリケーションにもフィットする
  p57:
  - kind: heading
    level: 1
    text: Webの世界のトレンド
  - kind: list
    items:
    - シェアを伸張する各言語
    - Node.js, SPA
    - パフォーマンスに優れた静的型付き言語
    - 相対的にPHPの存在感は薄れつつある
    - このままPHPは滅びるしかないのか…？
  p58:
  - kind: para
    text: PHPはどこでも65点がとれる言語
  - kind: list
    items:
    - '「現代におけるプロダクト開発とPHPを選定するワケ #phpkansai」'
    - By @potato4d (PHPカンファレンス関西2017)
    - 小難しいことを考えずに簡単にWebアプリを書ける(HTML+α)の言語
    - なんだかんだいってWEB+DB連携がさくっとできる言語ランタイムとして
  - kind: para
    text: の存在感は健在
  - kind: list
    items:
    - 求められているのは素晴らしい言語ではなく簡単に使える言語
  p59:
  - kind: para
    text: PHP先生の雑草のような生命力にご期待ください！
