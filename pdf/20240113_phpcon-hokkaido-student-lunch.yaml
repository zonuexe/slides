    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p44:
  - node: p
    children:
    - node: text
      content: ユニオン型宣言 (PHP8.0)
  - node: p
    children:
    - node: text
      content: 'function add(int|float $a, int|float $b): int|float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p45:
  - node: p
    children:
    - node: text
      content: LL言語としてのPHP vs エディタ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2000年代のCGIやLL言語(Lightweight Language)という用語が
      - node: br
      - node: text
        content: よく使われていた頃は「重厚鈍重なIDEが必要な言語」のアンチテーゼとして
      - node: br
      - node: text
        content: 'シンプルなスクリプト言語とエディタが好まれていた (ように思う) '
    - node: li
      children:
      - node: text
        content: 時は流れ、Webアプリケーションは巨大になり、ファイルは増え、シンプルなエ
      - node: br
      - node: text
        content: 'ディタでは開発のオーバーヘッドが無視しがたくなってきた '
    - node: li
      children:
      - node: text
        content: PhpStorm(JetBrains社のIDE)が静的解析とインテリジェントな編集機能
      - node: br
      - node: text
        content: を提供してくれるようになった
  p46:
  - node: p
    children:
    - node: text
      content: PHPと静的解析
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP組み込みで提供されているのは php -l (syntax check) のみ
    - node: li
      children:
      - node: text
        content: 「静的解析ツール」と呼ばれうるものは2000年代からあった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ドキュメント生成、コーディングスタイルのチェック
    - node: li
      children:
      - node: text
        content: 2010年代後半になってPhpStormの普及を呼び水にして、
      - node: br
      - node: text
        content: 型システムや変数スコープを正確に扱えるツールが開発され始めた
  p47:
  - node: p
    children:
    - node: text
      content: PHP Static Analysis Tool
  p48:
  - node: p
    children:
    - node: text
      content: PHPStanとは
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2016年から開発されているPHPの静的解析ツール
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - node: li
      children:
      - node: text
        content: 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
      - node: br
      - node: text
        content: '高速な解析を実現していた '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - node: li
      children:
      - node: text
        content: その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p49:
  - node: p
    children:
    - node: text
      content: PHPStanの提供する型
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPの組み込み型、クラス名、インターフェイス名
    - node: li
      children:
      - node: text
        content: '修飾型: non-empty-string, non-empty-array'
    - node: li
      children:
      - node: text
        content: 'ユニオン型: A|B'
    - node: li
      children:
      - node: text
        content: 'ジェネリクス: array<T>, ArrayObject<T>'
    - node: li
      children:
      - node: text
        content: '定数型: 123, "foo", Foo::BAR'
  p50:
  - node: p
    children:
    - node: text
      content: PHP処理系
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'ソースコード: https://github.com/php/php-src'
    - node: li
      children:
      - node: text
        content: 処理系のソースコードはC言語で書かれている(一部のみC++)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: パーサーはYacc(Bison)で記述されている
        - node: li
          children:
          - node: text
            content: 基礎知識は『Rubyソースコード完全解説』の知識が役に立つ
    - node: li
      children:
      - node: text
        content: 議論はメーリングリストがメインだが、GitHub issueやPull Requestも
      - node: br
      - node: text
        content: 受け付けてくれる
  p51:
  - node: p
    children:
    - node: text
      content: PHPの開発体制
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Request for Comments https://wiki.php.net/rfc
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 言語機能の改廃提案と投票プロセス、リリース周期が明文化
    - node: li
      children:
      - node: text
        content: 機能提案する人は仕様をまとめてMLで議論、実装も責任を持って用意する
    - node: li
      children:
      - node: text
        content: PHP原作者のRasmus Lardorfは開発者としての1票しか行使しない
    - node: li
      children:
      - node: text
        content: PHP 7.0(2015年)以降、11月末〜12月初頭にリリースが定着
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 品質保障のためのfeature freeze、RC版なども定められた
  p52:
  - node: p
    children:
    - node: text
      content: PHPは誰が開発しているのか
  p53: []
  p54: []
  p55:
  - node: p
    children:
    - node: text
      content: PHPはどこに行くのか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: おそらく、どの言語よりも利用者の幅が広い言語
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 動的なホームページを作りたい個人
        - node: li
          children:
          - node: text
            content: Web制作からのステップアップ
        - node: li
          children:
          - node: text
            content: CMSを使ったWebサイト構築
        - node: li
          children:
          - node: text
            content: 各種システム開発 (大規模Webサイト、ゲームのAPIサーバ…)
  p56:
  - node: p
    children:
    - node: text
      content: PHPは過去と未来を繋ぐ言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPの仕様はCGIの時代から地続き
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: PerlやRubyはApache mod時代やPost WSGI時代に断絶がある
        - node: li
          children:
          - node: text
            content: PHPはpreforkなサーバ上でもCGI互換のシェアードナッシング
          - node: br
          - node: text
            content: '(すべての状態が隔離され、リクエストごとに初期化される) '
    - node: li
      children:
      - node: text
        content: 汎用プログラミング言語の能力を持ちながら根幹がテンプレートエンジンに
      - node: br
      - node: text
        content: あるので、小規模からある程度大規模なアプリケーションにもフィットする
  p57:
  - node: p
    children:
    - node: text
      content: Webの世界のトレンド
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: シェアを伸張する各言語
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Node.js, SPA
        - node: li
          children:
          - node: text
            content: パフォーマンスに優れた静的型付き言語
    - node: li
      children:
      - node: text
        content: 相対的にPHPの存在感は薄れつつある
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: このままPHPは滅びるしかないのか…？
  p58:
  - node: p
    children:
    - node: text
      content: PHPはどこでも65点がとれる言語
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: '「現代におけるプロダクト開発とPHPを選定するワケ #phpkansai」'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: By @potato4d (PHPカンファレンス関西2017)
    - node: li
      children:
      - node: text
        content: 小難しいことを考えずに簡単にWebアプリを書ける(HTML+α)の言語
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: なんだかんだいってWEB+DB連携がさくっとできる言語ランタイムとして
          - node: br
          - node: text
            content: 'の存在感は健在 '
    - node: li
      children:
      - node: text
        content: 求められているのは素晴らしい言語ではなく簡単に使える言語
  p59:
  - node: p
    children:
    - node: text
      content: 'PHP先生の '
    - node: br
    - node: text
      content: '雑草のような生命力に '
    - node: br
    - node: text
      content: ご期待ください！
