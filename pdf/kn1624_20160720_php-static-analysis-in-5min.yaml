text:
  p1:
  - kind: heading
    level: 1
    text: 5分でわかる静的解析入門
  - kind: para
    text: Learn PHP static analysis in 5 min.
  - kind: para
    text: '2016-07-20 PHP BLT #5'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - GitHub/Packagistでは id:zonuexe
    - Ruby書いてたら、何の因果かPHPを書く仕事に
    - 好きな言葉はメタプログラミングです
  p3:
  - kind: para
    text: さて
  p4:
  - kind: heading
    level: 1
    text: 敵を知れば百戦殆ふからず
  - kind: list
    items:
    - プログラムを実際に動かさずして、
  - kind: para
    text: ソフトウェアの性質を把握する
  - kind: list
    items:
    - いろんなツールとか手法がある
    - 人間がPull Requestのdiffを見て
  - kind: para
    text: レビューするのも一種の静的解析
  - kind: list
    items:
    - ユニットテストは実際に動かすので
  - kind: para
    text: 動的検査の一種
  p5:
  - kind: para
    text: wc -l **/*.php
  p6:
  - kind: para
    text: wc -l **/*.php
  - kind: list
    items:
    - Unixの標準コマンド
    - お前は何を言ってるんだ
    - ファイルの行数を測る (-l)
    - バイト数を測る (-c)
  p7:
  - kind: para
    text: php -l a.php
  p8:
  - kind: para
    text: php -l target.php
  - kind: list
    items:
    - コードがSyntax Errorではないか
  - kind: para
    text: 検査する
  - kind: list
    items:
    - 実際に運用されるサーバーと同じ
  - kind: para
    text: バージョンを利用する
  - kind: list
    items:
    - git ls-files | grep '\.php$' |
  - kind: para
    text: xargs -IFILE -n1 php -l FILE
  p9:
  - kind: para
    text: token_get_all()
  p10:
  - kind: para
    text: token_get_all()
  - kind: list
    items:
    - PHPの標準関数 (要tokenizer)
    - スクリプトを構文要素ごとに
  - kind: para
    text: 切り分けてくれる(だけ)
  - kind: list
    items:
    - 構文解析はしてくれない… (重要)
    - 目的を集中すれば小さなパーサーは
  - kind: para
    text: 意外に書けた
  p11:
  - kind: para
    text: preg_match()
  p12:
  - kind: para
    text: preg_match()
  - kind: list
    items:
    - PHPの標準関数（最終兵器）
    - 雑な正規表現でも意外と機能する
    - 正規表現パターンなら誰でも書ける
  - kind: para
    text: ので、チームでメンテナンスできる
  p13:
  - kind: heading
    level: 1
    text: preg_match()
  - kind: list
    items:
    - こんな感じで配列にパターンを
  - kind: heading
    level: 2
    text: 並べていく
  - kind: para
    text: '[''level'' => ''error'',''desc'' => ''mt_srand() は使用禁止'',''pattern'' =>
      [''/[^a-zA-Z0-9_$:>]mt_srand *\(/i'' => false,],],'
  p14:
  - kind: para
    text: そのほか
  p15:
  - kind: heading
    level: 1
    text: よのなかにはたくさん実装ある
  - kind: list
    items:
    - PHPの静的解析 — Algo13 2016.04.11 ドキュメント
  - kind: para
    text: http://algo13.net/php/tips/static-analysis.html
  - kind: list
    items:
    - ↑良い感じにまとまってるネ申記事
    - phpmd, phpcs, php7cc…
    - 簡単な構文解析のサンプル載ってる
  p16:
  - kind: para
    text: 何をしたいのか
  p17:
  - kind: para
    text: 静的解析できると何が嬉しいのか
  - kind: list
    items:
    - Syntax Errorなファイルを
  - kind: para
    text: デプロイしないようにしたい…
  - kind: list
    items:
    - 弊社でも昔はありました
    - コードレビューでつまらないことを
  - kind: para
    text: 指摘したくない
  - kind: list
    items:
    - 割と膨大なコードを安全に
  - kind: para
    text: PHP7に着地させたい
  p18:
  - kind: para
    text: 最近のナウいツール
  p19:
  - kind: para
    text: etsy/phan
  - kind: list
    items:
    - Rasmus Lerdorfを要するEtsy社が
  - kind: para
    text: 開発する静的解析ツール
  - kind: list
    items:
    - 未定義関数とか型がをかしいとか、
  - kind: para
    text: とにかくいろんな指摘してくれる
  - kind: list
    items:
    - PHPDocの型を解析してくれる
    - 日本語で紹介すればバズれるぞ！！！
  p20:
  - kind: para
    text: 最近やってること
  p21:
  - kind: para
    text: baguette/definfo
  - kind: list
    items:
    - 最近夜な夜な作ってるツール
    - 実行時情報(Reflection)を使って
  - kind: para
    text: いろいろ指図してくれるようにするつもり
  - kind: list
    items:
    - タグジャンプの代替にしたい
    - 静的解析はしないつもりだったけど、
  - kind: para
    text: どうにもならないところはがんばって構文解析してる
