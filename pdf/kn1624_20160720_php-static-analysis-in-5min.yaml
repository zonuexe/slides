  p2:
  - node: p
    children:
    - node: text
      content: 'お前誰ようさみけんた (@tadsan) / Zonu.EXE

        '
    - node: text
      content: 'GitHub/Packagistでは id:zonuexe

        •Ruby書いてたら、何の因果かPHPを書く仕事に

        •好きな言葉はメタプログラミングです•'
  p3:
  - node: p
    children:
    - node: text
      content: さて
  p4:
  - node: p
    children:
    - node: text
      content: '敵を知れば百戦殆ふからず         プログラムを実際に動かさずして、•ソフトウェアの性質を把握する

        いろんなツールとか手法がある

        •         人間がPull Requestのdiffを見て•レビューするのも一種の静的解析

         ユニットテストは実際に動かすので•動的検査の一種'
  p5:
  - node: p
    children:
    - node: text
      content: wc -l **/*.php
  p6:
  - node: p
    children:
    - node: bold
      content: wc -l **/*.php
    - node: text
      content: 'Unixの標準コマンド

        '
    - node: text
      content: 'お前は何を言ってるんだ

        '
    - node: text
      content: '-lファイルの行数を測る ()

        '
    - node: text
      content: -cバイト数を測る ()
  p7:
  - node: p
    children:
    - node: text
      content: php -l a.php
  p8:
  - node: p
    children:
    - node: bold
      content: php -l target.php
    - node: text
      content: '         コードがSyntax Errorではないか•検査する

         実際に運用されるサーバーと同じ•バージョンを利用する

        git ls-files | grep ''\.php$'' | •xargs -IFILE -n1 php -l FILE'
  p9:
  - node: p
    children:
    - node: text
      content: token_get_all()
  p10:
  - node: p
    children:
    - node: bold
      content: token_get_all()
    - node: text
      content: 'PHPの標準関数 (要tokenizer)

        •         スクリプトを構文要素ごとに•切り分けてくれる(だけ)

        構文解析はしてくれない… (重要)

        •目的を集中すれば小さなパーサーは•意外に書けた'
  p11:
  - node: p
    children:
    - node: text
      content: preg_match()
  p12:
  - node: p
    children:
    - node: bold
      content: preg_match()
    - node: text
      content: 'PHPの標準関数（最終兵器）

        •雑な正規表現でも意外と機能する

        •正規表現パターンなら誰でも書ける•ので、チームでメンテナンスできる'
  p13:
  - node: p
    children:
    - node: bold
      content: preg_match()
    - node: text
      content: '         こんな感じで配列にパターンを•並べていく'
    - node: bold
      content: '[     ''level'' => ''error'',     ''desc''  => ''mt_srand() は使用禁止'',     ''pattern''
        => [         ''/[^a-zA-Z0-9_$:>]mt_srand *\(/i'' => false,     ], ],'
  p14:
  - node: p
    children:
    - node: text
      content: そのほか
  p15:
  - node: p
    children:
    - node: text
      content: 'よのなかにはたくさん実装あるPHPの静的解析          •— Algo13 2016.04.11 ドキュメント 

        http://algo13.net/php/tips/static-analysis.html↑良い感じにまとまってるネ申記事

        •phpmd, phpcs, php7cc…

        •簡単な構文解析のサンプル載ってる•'
  p16:
  - node: p
    children:
    - node: text
      content: 何をしたいのか
  p17:
  - node: p
    children:
    - node: text
      content: '静的解析できると何が嬉しいのか         Syntax Errorなファイルを•デプロイしないようにしたい…

        弊社でも昔はありました

        •コードレビューでつまらないことを•指摘したくない

         割と膨大なコードを安全に•PHP7に着地させたい'
  p18:
  - node: p
    children:
    - node: text
      content: 最近のナウいツール
  p19:
  - node: p
    children:
    - node: bold
      content: etsy/phan
    - node: text
      content: 'Rasmus Lerdorfを要するEtsy社が•開発する静的解析ツール

         未定義関数とか型がをかしいとか、•とにかくいろんな指摘してくれる

        PHPDocの型を解析してくれる

        •日本語で紹介すればバズれるぞ！！！•'
  p20:
  - node: p
    children:
    - node: text
      content: 最近やってること
  p21:
  - node: p
    children:
    - node: bold
      content: baguette/definfo
    - node: text
      content: '最近夜な夜な作ってるツール

        •         実行時情報(Reflection)を使って•         いろいろ指図してくれるようにするつもり

        タグジャンプの代替にしたい

        •静的解析はしないつもりだったけど、•         どうにもならないところはがんばって構文解析してる'
