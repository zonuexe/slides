    text: アジェンダ
  - kind: para
    text: PHPの型について
  - kind: para
    text: なぜ型をつけるのか
  - kind: para
    text: PHPの入出力型の特性
  p7:
  - kind: para
    text: 今回含まないもの
  - kind: para
    text: 各静的解析ツールやIDE(PhpStorm)固有の型・機能
  - kind: para
    text: メタプログラミングに対応した型付け
  p8:
  - kind: para
    text: 用語について
  - kind: para
    text: 単に関数と呼ぶとき、メソッドとクロージャを含む
  - kind: para
    text: 定義に直接記述する型を型宣言(type declaration)、PHPDocを型注釈(annotation)と呼びます
  p9:
  - kind: para
    text: PHPの型について
  p10:
  - kind: para
    text: 型の前に
  p11:
  - kind: para
    text: プログラムには
  - kind: para
    text: 依存があるという
  - kind: para
    text: ことを認める
  p12:
  - kind: para
    text: 依存とは
  p13:
