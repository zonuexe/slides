    text: 型情報を書くことで、型宣言
  - kind: para
    text: できない詳細な型を付ける
  - kind: para
    text: PHPが対応しない型や、
  - kind: para
    text: 実行時に検査しにくい型を
  - kind: para
    text: 記述できる
  p64:
  - kind: para
    text: PHPDoc(型注釈)にしか書けない型
  - kind: para
    text: コレクションの型
  - kind: para
    text: ジェネリクス
  - kind: para
    text: ユニオン型はPHPDocで
  - kind: para
    text: 長年使われていたがPHP8で
  - kind: para
    text: 型宣言に取り入れられた
  p65:
  - kind: para
    text: PHPDoc(型注釈)にしか書けない型
  - kind: para
    text: リテラル型・定数型
  - kind: para
    text: array-shapes
  - kind: para
    text: (Object-like arrays)
  p66:
  - kind: heading
    level: 1
    text: パラメータの型
  - kind: para
    text: <?php
  - kind: para
    text: /**
  - kind: para
    text: '* 検索エンジンを単語検索する'
  - kind: para
    text: '*/'
  - kind: para
    text: function search(string $word, string $mode) {
  - kind: para
    text: // ...
  - kind: para
    text: '}'
  - kind: para
    text: ユーザーが検索したいワード
  - kind: para
    text: 検索モードはどんな文字列で
  - kind: para
    text: なんでも入れていい
  - kind: para
    text: も入れたいわけではない
  p67:
  - kind: heading
    level: 1
    text: パラメータのリテラルユニオン型
  - kind: para
    text: <?php
  - kind: para
    text: /**
  - kind: para
    text: '* 検索エンジンを単語検索する'
  - kind: para
    text: '* @phpstan-param ''exact''|''partial'' $mode'
  - kind: para
    text: '*/'
  - kind: para
    text: function search(string $word, string $mode) {
  - kind: para
    text: // ...
  - kind: para
    text: '}'
  - kind: para
    text: 期待値をResultでそのまま書
  - kind: para
    text: ける
  p68:
  - kind: heading
    level: 1
    text: パラメータの定数プレフィクス型
  - kind: para
    text: <?php
  - kind: para
    text: const SEARCH_MODE_EXACT = 'exact';
  - kind: para
    text: const SEARCH_MODE_PARTIAL = 'partial';
  - kind: para
    text: /**
  - kind: para
    text: '* 検索エンジンを単語検索する'
  - kind: para
    text: '* @phpstan-param SEARCH_MODE_* $mode'
  - kind: para
    text: '*/'
  - kind: para
    text: function search(string $word, string $mode) {
  - kind: para
    text: // ...
  - kind: para
    text: '}'
  - kind: para
    text: ユーザーが検索したいワード
  - kind: para
    text: なんでも入れていい
  p69:
  - kind: para
    text: 型なしは
  - kind: para
    text: どこから来るの？
  p70:
  - kind: para
    text: ここまでは値をリテラル
  - kind: para
    text: で記述するか引数経由で
  - kind: para
    text: 期待通りの値が渡される
  - kind: para
    text: 前提で話をしてきた
  p71:
  - kind: heading
    level: 1
    text: リテラルは実行時変化しない
  - kind: para
    text: <?php
  - kind: para
    text: 'function print_add(int $a, int $b): int|float'
  - kind: para
    text: '{'
  - kind: para
    text: echo $a + $b;
  - kind: para
    text: '}'
  - kind: para
    text: print_add(1, 2);
  p72:
  - kind: heading
    level: 1
    text: 外部入力
  - kind: para
    text: <?php
  - kind: para
    text: 'function print_add(int $a, int $b): int|float'
  - kind: para
    text: '{'
  - kind: para
    text: echo $a + $b;
  - kind: para
    text: '}'
  - kind: para
    text: print_add($_GET['a'], $_GET['b']);
  - kind: para
    text: 期待する形式の値が渡
  - kind: para
    text: クエリが
  - kind: para
    text: きちんと渡されたら動く
  - kind: para
    text: されなければエラー
  p73:
  - kind: heading
    level: 1
    text: 厳密な入力
  - kind: para
    text: <?php
  - kind: para
    text: declare(strict_types=1);
  - kind: para
    text: 'function print_add(int $a, int $b): int|float'
  - kind: para
    text: '{'
  - kind: para
    text: echo $a + $b;
  - kind: para
    text: '}'
  - kind: para
    text: print_add($_GET['a'], $_GET['b']);
  - kind: para
    text: ?a=1&b=2 が渡されようが
  - kind: para
    text: 厳密な型付けを有効化
  - kind: para
    text: 型が違うので絶対動かない
  p74:
  - kind: para
    text: DB(PDO)から取得した型
  - kind: para
    text: PDOはデフォルトでプリペア
  - kind: para
    text: ドステートメントのエミュ
  - kind: para
    text: レーションが有効
  - kind: para
    text: その場合は全てのカラムが
  - kind: para
    text: 文字列になってしまう
  p75:
  - kind: para
    text: デシリアライズした値
  - kind: para
    text: unserialize(),
  - kind: para
    text: json_decode()など
  - kind: para
    text: これらも何が入っているか
  - kind: para
    text: わからない
  p76:
  - kind: para
    text: まとめ
  p77:
  - kind: para
    text: 今回はPHPに組み込
  - kind: para
    text: みの型の使いかたに
  - kind: para
    text: 絞って説明しました
  p78:
  - kind: para
    text: 実際に厳密に型を付けて
  - kind: para
    text: いくと、これだけでは力
  - kind: para
    text: 不足なポイントが多く出
  - kind: para
    text: てきます
