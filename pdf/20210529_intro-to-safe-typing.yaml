  - kind: para
    text: データ型(3) ﬂoat 浮動小数点数型
  - kind: para
    text: 0.1, 10.0, -0.3, INF, -INF
  - kind: para
    text: のような値
  - kind: para
    text: PHPでは整数の範囲を外れた
  - kind: para
    text: 数はfloatになる
  - kind: para
    text: PHP_INT_MAX+1 は ﬂoat
  p36:
  - kind: para
    text: データ型(4) bool 論理型
  - kind: para
    text: true と false の二種類だけ
  - kind: para
    text: の値からなる型
  - kind: para
    text: $a==$b や $a < $b のような
  - kind: para
    text: 比較式の結果はbool
  - kind: para
    text: PHPでは $a && $b もbool
  p37:
  - kind: para
    text: スカラー型のまとめ
  - kind: para
    text: bool, int, float, stringの
  - kind: para
    text: 4種をスカラー(scalar)と呼ぶ
  - kind: para
    text: 後述する複合型でも特殊型で
  - kind: para
    text: もないものという共通性
  p38:
  - kind: para
    text: 複合型
  - kind: para
    text: 内部に別の値を持てる型
  - kind: para
    text: array (配列)
  - kind: para
    text: object (オブジェクト)
  - kind: para
    text: ※ PHPマニュアルはcallable特殊型と
  - kind: para
    text: iterable特殊型も複合型として記載
  p39:
  - kind: para
    text: データ型(5) array 配列型
  - kind: para
    text: 他言語のリストと辞書(ハッシュ)
  - kind: para
    text: を兼ねた型だが､基本は辞書的
  - kind: para
    text: '[1, 2, 3] や [] (空配列)'
  - kind: para
    text: '[''name'' => ''taro'', ''birthday'' => ''09-13'']'
  - kind: para
    text: のように複数の値を格納できる
  p40:
  - kind: para
    text: データ型(5) array 配列型
  - kind: para
    text: 作成時にキーを指定しないと0
  - kind: para
    text: からの連番になる
  - kind: para
    text: '[1]と [0 => 1] は同じ'
  - kind: para
    text: $a = [3 => 'a'] は
  - kind: para
    text: '[null, null, ''a'']ではない'
  p41:
  - kind: para
    text: データ型(6) object
  - kind: para
    text: プロパティ(メンバー変数)を持
  - kind: para
    text: ち､$obj->prop のような構文
  - kind: para
    text: でアクセスできる値の型
  - kind: para
    text: objectには属するクラスがあ
  - kind: para
    text: り、組み込みクラス、ユー
  - kind: para
    text: ザー定義、stdClassがある
  p42:
  - kind: para
    text: 型宣言とクラス
  - kind: para
