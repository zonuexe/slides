  - kind: para
    text: <?php
  - kind: para
    text: $a = 1;$b = 2;
  - kind: para
    text: echo $a + $b;
  p15:
  - kind: para
    text: マスクされている
  - kind: para
    text: という状態を
  - kind: para
    text: コードに反映する
  p16:
  - kind: heading
    level: 1
    text: 簡単なコードを考える
  - kind: para
    text: <?php
  - kind: para
    text: $a = 1;$b = 2;
  - kind: para
    text: echo $a + $b;
  p17:
  - kind: heading
    level: 1
    text: 簡単なコードを考える
  - kind: para
    text: <?php
  - kind: para
    text: function print_add($a, $b){echo $a + $b;}
  - kind: para
    text: print_add(1, 2);
  p18:
  - kind: para
    text: 汎用的な処理と
  - kind: para
    text: 実際の値を
  - kind: para
    text: 切り離すことができた
  p19:
  - kind: heading
    level: 1
    text: 簡単なコードを考える
  - kind: para
    text: <?php
  - kind: para
    text: こいつらが何者かわからん
  - kind: para
    text: function print_add($a, $b){echo $a + $b;}
  - kind: para
    text: print_add(1, 2);
  p20: []
  p21:
  - kind: para
    text: 型をつけよう
  p22:
  - kind: heading
    level: 1
    text: 簡単なコードを考える
  - kind: para
    text: 型が明確になった
  - kind: para
    text: <?php
  - kind: para
    text: function print_add($a, $b){echo $a + $b;}
  - kind: para
    text: print_add(1, 2);
  p23:
  - kind: para
    text: そもそも
  - kind: para
    text: 型とは
  p24:
  - kind: para
    text: データ型
  - kind: para
    text: PHPで使える値の種類のこと
  - kind: para
    text: あたいへんすうていすう
  - kind: para
    text: 値＝変数･定数にセットしたり､
  - kind: para
    text: 関数呼び出しに渡せるもの
  - kind: para
    text: 値は何らかのデータ型に属する
  p25:
  - kind: para
    text: PHPと型
  - kind: para
    text: PHPは型システムの分類として弱い動的型付けあるいは「型なし」と分類されがち
  - kind: para
    text: しかしPHPは単なる型なしと呼ぶには型を使ってできることが多い
  p26:
  - kind: para
    text: PHPの実行時型検査
  - kind: para
    text: 関数のパラメータと戻り値、プロパティに型宣言できる
  - kind: para
    text: 強力な実行時型検査
  - kind: para
    text: 実行時にコードの型宣言通り型で実行されることが保障
  - kind: para
    text: TSやPythonとは異なる
  p27:
  - kind: para
    text: PHP5の型ヒント
  - kind: para
    text: Type Hintingと呼ばれてた
  - kind: para
    text: array, callableあるいはクラス/インターフェイスしか書けなかった
  - kind: para
    text: PHP7.0以降ではスカラー型に対応し、型宣言に改称
  p28:
  - kind: para
    text: PHPの静的型検査
  - kind: para
    text: Psalm, PHPStanなどの検査ツールが豊富
  - kind: para
    text: PhpStormは検査能力は劣るが簡単に導入できる
  - kind: para
    text: 今回の発表では個別のツールの導入方法には触れません
  p29:
  - kind: para
    text: データ型(1) int 整数型
  - kind: para
    text: 0, 1, 2や-100のような数
  - kind: para
    text: 最大値はPHP_INT_MAXで最小値はPHP_INT_MIN
  p30:
  - kind: para
    text: データ型(2) string 文字列型
  - kind: para
    text: '"a" "xyz" "あいう" のような文字の並びだと思ってください'
  - kind: para
    text: から
  - kind: para
    text: 長さ0の "" (空文字列)も存在する
  - kind: para
    text: PHPの文字列値はエンコーディングを持たないバイト列
  p31:
  - kind: para
    text: ここで簡単な
  - kind: para
    text: コードを考えて
  - kind: para
    text: みましょう
  p32:
  - kind: heading
    level: 1
    text: 簡単なコードを考える
  - kind: para
    text: 値
  - kind: para
    text: <?php
  - kind: para
    text: 細かくいうと$a = 1のような変数代入も式
  - kind: para
    text: 値"2"
  - kind: para
    text: 値%
  - kind: para
    text: 値"2"
  - kind: para
    text: $a = 1;$b = "2";$c = $a + $b;
  - kind: para
    text: 式1 + "2"
  - kind: para
    text: echo $c;
  - kind: para
    text: 値%
  - kind: para
    text: 値%
  p33:
  - kind: para
    text: リテラルと式
  - kind: para
    text: コードに直接書く値をリテラル(literal)といいます
  - kind: para
    text: 1 2.3 "abc" みたいなの
  - kind: para
    text: $a + $b のようなコードを式(expression)といいます
  p34:
  - kind: heading
    level: 1
    text: 値には必ず型がある
  - kind: para
    text: int(1)
  - kind: para
    text: <?php
  - kind: para
    text: string("2")
  - kind: para
    text: int(1)
  - kind: para
    text: string("2")
  - kind: para
    text: $a = 1;$b = "2";$c = $a + $b;
  - kind: para
    text: 式1 + "2"
  - kind: para
    text: echo $c;
  - kind: para
    text: int(3)
  - kind: para
    text: int(3)
  p35:
  - kind: para
    text: データ型(3) ﬂoat 浮動小数点数型
  - kind: para
    text: 0.1, 10.0, -0.3, INF, -INFのような値
  - kind: para
    text: PHPでは整数の範囲を外れた数はfloatになる
  - kind: para
    text: PHP_INT_MAX+1 は ﬂoat
  p36:
  - kind: para
    text: データ型(4) bool 論理型
  - kind: para
    text: true と false の二種類だけの値からなる型
  - kind: para
    text: $a==$b や $a < $b のような比較式の結果はbool
  - kind: para
    text: PHPでは $a && $b もbool
  p37:
  - kind: para
    text: スカラー型のまとめ
  - kind: para
    text: bool, int, float, stringの4種をスカラー(scalar)と呼ぶ
  - kind: para
    text: 後述する複合型でも特殊型でもないものという共通性
  p38:
  - kind: para
    text: 複合型
  - kind: para
    text: 内部に別の値を持てる型
  - kind: para
    text: array (配列)
  - kind: para
    text: object (オブジェクト)
  - kind: para
    text: ※ PHPマニュアルはcallable特殊型とiterable特殊型も複合型として記載
  p39:
  - kind: para
    text: データ型(5) array 配列型
  - kind: para
    text: 他言語のリストと辞書(ハッシュ)を兼ねた型だが､基本は辞書的
  - kind: para
    text: '[1, 2, 3] や [] (空配列)'
  - kind: para
    text: '[''name'' => ''taro'', ''birthday'' => ''09-13'']'
  - kind: para
    text: のように複数の値を格納できる
  p40:
  - kind: para
    text: データ型(5) array 配列型
  - kind: para
    text: 作成時にキーを指定しないと0からの連番になる
  - kind: para
    text: '[1]と [0 => 1] は同じ'
  - kind: para
    text: $a = [3 => 'a'] は
  - kind: para
    text: '[null, null, ''a'']ではない'
  p41:
  - kind: para
    text: データ型(6) object
  - kind: para
    text: プロパティ(メンバー変数)を持ち､$obj->prop のような構文でアクセスできる値の型
  - kind: para
    text: objectには属するクラスがあり、組み込みクラス、ユーザー定義、stdClassがある
  p42:
  - kind: para
    text: 型宣言とクラス
  - kind: para
    text: 型宣言にはクラス名またはインターフェイスを記述できる
  - kind: para
    text: 事実上のユーザー定義型
  - kind: para
    text: インターフェイスを活用すると実装と宣言を分離できる
  - kind: para
    text: 依存性逆転の原則(DIP)
  p43:
  - kind: para
    text: 全てinterfaceで指定すべきか
  - kind: para
    text: 抽象化でたしかに実装詳細への依存を避けることができる
  - kind: para
    text: 全ての依存をインターフェイスにすべきかは悩ましい
  - kind: para
    text: DTOやValueObjectなど
  - kind: para
    text: DataTimeInterface
  p44:
  - kind: para
    text: 特殊型
  - kind: para
    text: 単体で型宣言できない特殊な値
  - kind: para
    text: resource (リソース)
  - kind: para
    text: null (空値)
  - kind: para
    text: ※ nullはnullableの一部やPHP8のユニオン型の一部として記述可能
  p45:
  - kind: para
    text: 型ではないが特殊な戻り値
  - kind: para
    text: 'function(): void {}'
  - kind: para
    text: 値を返さないことを示す
  - kind: para
    text: 値を返さないということは、副作用があるというマーク
  - kind: para
    text: DBにデータを記録する、メールを送る、例外送出
  p46:
  - kind: para
    text: 複合的な型表記
  - kind: para
    text: nullable型
  - kind: para
    text: ?DateTimeとか
  - kind: para
    text: ユニオン型
  - kind: para
    text: A|Bとかstring|falseとか
  - kind: para
    text: PHP7ではPHPDocコメントに書く必要がある
  p47:
  - kind: para
    text: クラスの型付けを
  - kind: para
    text: 考えてみましょう
  p48:
  - kind: para
    text: Book (本)
  - kind: para
    text: プロパティ(メンバー変数)として、name(書名)とAuthor(著者オブジェクト)を持つ
  - kind: para
    text: メソッドは今回は割愛
  p49:
  - kind: heading
    level: 1
    text: クラスの型付けを考える 5.0
  - kind: para
    text: <?php // PHP 5.x～7.3
  - kind: para
    text: class Book {/** @var string */private $name;/** @var Author */private $author;public
      function __construct(string $name, Author $author) {$this->name = $name;$this->author
      = $author;}
  p50:
  - kind: heading
    level: 1
    text: クラスの型付けを考える 7.4
  - kind: para
    text: <?php // PHP 7.4
  - kind: para
    text: class Book{private string $name;private Author $author;public function __construct(string
      $name, Author $author) {$this->name = $name;$this->author = $author;}
  p51:
  - kind: heading
    level: 1
    text: クラスの型付けを考える 8.0
  - kind: para
    text: <?php // PHP 8.0以降
  - kind: para
    text: class Book{public function __construct(private string $name,private Author
      $author) {// プロパティ代入は不要
  - kind: para
    text: // $this->name = $name;// $this->author = $author;}
  p52:
  - kind: para
    text: 仕様変更
  - kind: para
    text: 😁
  p53:
  - kind: para
    text: 著者が複数の本って
  - kind: para
    text: いっぱいあるんじゃ
  p54:
  - kind: para
    text: 著者が複数…
  - kind: para
    text: 配列で受け取ろう
  p55:
  - kind: para
    text: $author
  - kind: para
    text: ↓
  - kind: para
    text: $author
  - kind: para
    text: s
  p56:
  - kind: heading
    level: 1
    text: 変更前 7.4
  - kind: para
    text: <?php // PHP 7.4
  - kind: para
    text: class Book{private string $name;private Author $author;public function __construct(string
      $name, Author $author) {$this->name = $name;$this->author = $author;}
  p57:
  - kind: heading
    level: 1
    text: 変更後 7.4
  - kind: para
    text: <?php // PHP 7.4
  - kind: para
    text: arrayって…情報量減っちゃってね？
  - kind: para
    text: class Book{private string $name;private array $authors;public function __construct(string
      $name, array $authors) {// ...}
  p58:
  - kind: para
    text: array型宣言は結構困る
  - kind: para
    text: 今回欲しいのはAuthorだけが入った配列
  - kind: para
    text: arrayだけでは不十分
  - kind: para
    text: '[''name''=>''太宰治'']みたいな配列がほしいわけではない'
  p59:
  - kind: para
    text: ここで出てくる
  - kind: para
    text: のがPHPDoc
  p60:
  - kind: heading
    level: 1
    text: 変更前 7.4
  - kind: para
    text: <?php // PHP 7.4
  - kind: para
    text: class Book{private string $name;private array $authors;public function __construct(string
      $name, array $authors) {// ...}
  p61:
  - kind: heading
    level: 1
    text: PHPDocでプロパティ型付け
  - kind: para
    text: <?php // PHP 7.4
  - kind: para
    text: class Book{private string $name;/** @var Authors[] */private array $authors;public
      function __construct(string $name, array $authors) {// ...}
  p62:
  - kind: heading
    level: 1
    text: PHPDocでメソッド型付け
  - kind: para
    text: <?php // PHP 7.4
  - kind: para
    text: class Book{private string $name;/** @var Authors[] */private array $authors;/***
      @param Authors[] $authors*/public function __construct(string $name, array $authors)
      {// ...
  p63:
  - kind: para
    text: PHPDoc(型注釈)について
  - kind: para
    text: DocComment /** … */に型情報を書くことで、型宣言できない詳細な型を付ける
  - kind: para
    text: PHPが対応しない型や、実行時に検査しにくい型を記述できる
  p64:
  - kind: para
    text: PHPDoc(型注釈)にしか書けない型
  - kind: para
    text: コレクションの型
  - kind: para
    text: ジェネリクス
  - kind: para
    text: ユニオン型はPHPDocで長年使われていたがPHP8で型宣言に取り入れられた
  p65:
  - kind: para
    text: PHPDoc(型注釈)にしか書けない型
  - kind: para
    text: リテラル型・定数型
  - kind: para
    text: array-shapes(Object-like arrays)
  p66:
  - kind: heading
    level: 1
    text: パラメータの型
  - kind: para
    text: <?php
  - kind: para
    text: /*** 検索エンジンを単語検索する
  - kind: para
    text: '*/function search(string $word, string $mode) {// ...}'
  - kind: para
    text: ユーザーが検索したいワード
  - kind: para
    text: 検索モードはどんな文字列で
  - kind: para
    text: なんでも入れていい
  - kind: para
    text: も入れたいわけではない
  p67:
  - kind: heading
    level: 1
    text: パラメータのリテラルユニオン型
  - kind: para
    text: <?php
  - kind: para
    text: /*** 検索エンジンを単語検索する
  - kind: para
    text: '* @phpstan-param ''exact''|''partial'' $mode*/function search(string $word,
      string $mode) {// ...}'
  - kind: para
    text: 期待値をResultでそのまま書
  - kind: para
    text: ける
  p68:
  - kind: heading
    level: 1
    text: パラメータの定数プレフィクス型
  - kind: para
    text: <?php const SEARCH_MODE_EXACT = 'exact';const SEARCH_MODE_PARTIAL = 'partial';
  - kind: para
    text: /*** 検索エンジンを単語検索する
  - kind: para
    text: '* @phpstan-param SEARCH_MODE_* $mode*/function search(string $word, string
      $mode) {// ...}'
  - kind: para
    text: ユーザーが検索したいワード
  - kind: para
    text: なんでも入れていい
  p69:
  - kind: para
    text: 型なしは
  - kind: para
    text: どこから来るの？
  p70:
  - kind: para
    text: ここまでは値をリテラル
  - kind: para
    text: で記述するか引数経由で
  - kind: para
    text: 期待通りの値が渡される
  - kind: para
    text: 前提で話をしてきた
  p71:
  - kind: heading
    level: 1
    text: リテラルは実行時変化しない
  - kind: para
    text: <?php
  - kind: para
    text: 'function print_add(int $a, int $b): int|float{echo $a + $b;}'
  - kind: para
    text: print_add(1, 2);
  p72:
  - kind: heading
    level: 1
    text: 外部入力
  - kind: para
    text: <?php
  - kind: para
    text: 'function print_add(int $a, int $b): int|float{echo $a + $b;}'
  - kind: para
    text: print_add($_GET['a'], $_GET['b']);
  - kind: para
    text: 期待する形式の値が渡
  - kind: para
    text: クエリがきちんと渡されたら動く
  - kind: para
    text: されなければエラー
  p73:
  - kind: heading
    level: 1
    text: 厳密な入力
  - kind: para
    text: <?php declare(strict_types=1);
  - kind: para
    text: 'function print_add(int $a, int $b): int|float{echo $a + $b;}'
  - kind: para
    text: print_add($_GET['a'], $_GET['b']);
  - kind: para
    text: ?a=1&b=2 が渡されようが
  - kind: para
    text: 厳密な型付けを有効化
  - kind: para
    text: 型が違うので絶対動かない
  p74:
  - kind: para
    text: DB(PDO)から取得した型
  - kind: para
    text: PDOはデフォルトでプリペアドステートメントのエミュレーションが有効
  - kind: para
    text: その場合は全てのカラムが文字列になってしまう
  p75:
  - kind: para
    text: デシリアライズした値
  - kind: para
    text: unserialize(),json_decode()など
  - kind: para
    text: これらも何が入っているかわからない
  p76:
  - kind: para
    text: まとめ
  p77:
  - kind: para
    text: 今回はPHPに組み込
  - kind: para
    text: みの型の使いかたに
  - kind: para
    text: 絞って説明しました
  p78:
  - kind: para
    text: 実際に厳密に型を付けて
  - kind: para
