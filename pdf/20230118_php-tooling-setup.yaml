text:
  p1:
  - kind: heading
    level: 1
    text: めんどくさくない
  - kind: heading
    level: 1
    text: PHP開発ツール導入
  - kind: heading
    level: 2
    text: Avoid the hassle and install QA tools in your PHP project
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2023-01-18 PHP勉強会@東京
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
  p3:
  - kind: heading
    level: 1
    text: さて
  p4:
  - kind: para
    text: あなたの会社ではPHPで書かれたツールを
  - kind: para
    text: 利用してますか？
  p5:
  - kind: para
    text: えっPHPってホームページを作る言語というかHTML
  - kind: para
    text: のテンプレートエンジンじゃないのそんな言語でツールて
  p6:
  - kind: para
    text: …ということを思って
  - kind: para
    text: るひともまだ居そう
  p7:
  - kind: heading
    level: 1
    text: わかる
  p8:
  - kind: para
    text: が、現実には既にいっぱい使われている
  p9:
  - kind: para
    text: PHPのツールはPHPで書こうね
  - kind: list
    items:
    - Composer … 依存マネージャー(パッケージ管理ツール)
    - PHPUnit … xUnitテスティングフレームワーク
    - PHP-CS-Fixer, PHP_CodeSniffer … コードフォーマッター
    - PHPStan, Psalm … 静的解析ツール (型チェッカー)
    - Deployer … アプリケーションデプロイツール
    - そのほかいろいろ！
  p10:
  - kind: para
    text: PHP vs tooling
  - kind: list
    items:
    - PHPはWebサーバだけでなくコマンドラインで動く
    - PHPのためのCLIアプリケーションフレームワークがある
    - 最近はSymfony Consoleが主流だと思う
    - PHPで書かれたPHPパーサーがある
    - PHPで書けばPHPに詳しいPHPerが貢献できる
    - PHPで書けばライブラリとして相互運用もできる
  p11:
  - kind: para
    text: 他言語 vs tooling
  - kind: list
    items:
    - 'PhpStorm: Java (OSSではない)'
    - 'Intephense: Node.js (npmにあるがOSSでない)'
    - php-parser (OSS)
    - PHP Rust Tools (OSS)
    - 'NoVerify: Go (OSS)'
    - VKCOM/php-parser
  p12:
  - kind: para
    text: どうやってツールをインストールするか
  p13:
  - kind: para
    text: Composer
  - kind: list
    items:
    - 対象のプロジェクトと依存対象を並列な「パッケージ」として扱える
    - 単体ファイルのcomposerコマンド(composer.phar)として利用できる
    - インストール方法は https://getcomposer.org/doc/00-intro.md に書いてある
    - Windows向けにはインストーラー(Composer-Setup.exe)がある
    - 実行ファイル(bin)も管理でき、プロジェクトの vendor/bin/ に
  - kind: para
    text: 配置されて実行できる (Windowsでも動くように工夫されている!)
  p14:
  - kind: heading
    level: 1
    text: composer global
  - kind: list
    items:
    - プロジェクトに依存しないパッケージをインストールできる
    - 基本的にはシステムワイドではなく、 ユーザーごとにインストールされる
    - 場所は composer global config -l などで検索できる
    - インストール先をPATH環境変数に追加すると通常のコマンドとして使える
    - たとえば PATH=$HOME/.composer/vendor/bin:$PATH など
  p15:
  - kind: para
    text: Composerで
  - kind: para
    text: 管理する問題
  p16:
  - kind: para
    text: 依存バージョンが
  - kind: para
    text: 衝突する！
  p17: []
  p18: []
  p19:
  - kind: heading
    level: 1
    text: バージョン衝突問題
  - kind: list
    items:
    - プロジェクト本体で使いたいパッケージとツールが要求するパッケージの
  - kind: para
    text: バージョンを合わせないといけない
  - kind: list
    items:
    - PHP-CS-FixerはPHP-ParserやSymfonyパッケージに依存しているの
  - kind: para
    text: で、全部のパッケージを最新に合わせ続けないと簡単に衝突する
  - kind: list
    items:
    - いろんな事情で古いSymfonyコンポーネントに依存している
  - kind: para
    text: ライブラリを使わざるを得ない事情があると詰む or バージョン上がらない
  p20:
  - kind: heading
    level: 1
    text: ＼(^o^)／
  p21:
  - kind: heading
    level: 1
    text: 解決策はある
  p22:
  - kind: para
    text: Pharアーカイブ
  - kind: list
    items:
    - 複数ファイルのPHPを一個のファイルに固めたもの
    - 普通のスクリプトとして実行できるようにできる
    - プロジェクトメンバー全員に使わせるにはどうすればいいか
    - ダウンロードスクリプトを作成して実行してもらう / ファイル自体をGit追加
    - PhiveというPharインストールツールもある
    - 手動でインストールしないといけないので細かいバージョンが揃わない問題
  p23:
  - kind: para
    text: composer bin-plugin
  - kind: list
    items:
    - https://github.com/bamarni/composer-bin-plugin
    - プロジェクト自体とは隔離したディレクトリでcomposerの依存を管理する
    - プラグイン側でサブディレクトリにインストールしたツールと
  - kind: para
    text: メインプロジェクト側の vendor/bin/ ディレクトリを同期してくれる
  - kind: list
    items:
    - 通常の composer install とは別管理なのでちょっとめんどくさい
  p24:
  - kind: heading
    level: 1
    text: これでいいのでは
  p25:
  - kind: para
    text: 依存バージョンを合わせられない問題
  p26:
  - kind: para
    text: PHPStanの
  - kind: para
    text: 開発者曰く
  p27: []
  p28:
  - kind: para
    text: PHPStanを入れるなら
  - kind: para
    text: composer require --dev
  - kind: para
    text: を使え
  p29:
  - kind: heading
    level: 1
    text: どういうことか
  p30: []
  p31:
  - kind: heading
    level: 1
    text: 依存が… ない…
  - kind: heading
    level: 2
    text: (PHPのバージョン制約だけ)
  p32:
  - kind: heading
    level: 1
    text: どういうことか
  p33: []
  p34:
  - kind: heading
    level: 1
    text: ここにコードはない
  p35: []
  p36:
  - kind: para
    text: GitにPharファイルを
  - kind: para
    text: 直接コミット!?
  p37:
  - kind: heading
    level: 1
    text: 話は長くなるので
  p38: []
  p39:
  - kind: para
    text: Composerパッケージは
  - kind: para
    text: Packagistで検索できる
  p40: []
  p41: []
  p42: []
  p43:
  - kind: para
    text: shimとかpharとか
  - kind: para
    text: distで検索するとコンフリクトしないバージョンが公開されている
  - kind: para
    text: (こともある)
  p44:
  - kind: para
    text: コンフリクトを避ける上
  - kind: para
    text: では依存ライブラリの
  - kind: para
    text: 名前空間隔離という
  - kind: para
    text: 技術が不可欠
  p45:
  - kind: para
    text: みんなもコンフリクトフリーな
  - kind: para
    text: ツールを量産しよう
