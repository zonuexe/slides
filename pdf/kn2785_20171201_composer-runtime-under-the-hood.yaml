text:
  p1:
  - kind: heading
    level: 1
    text: Composer解体新書
  - kind: para
    text: Anatomy of Composer, in Runtime
  - kind: para
    text: PHPカンファレンス北海道出張版(仮)
  - kind: para
    text: 'PHPオフ会 #phpcondo2017'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - 砂川出身、北海道工業大学
    - 2012年11月にピクシブ株式会社に入社
    - Emacs Lisper, PHPer
    - 入社前は自宅警備をしながらRuby書いてた
    - Qiitaに記事を書いたり変なコメントしてるよ
    - 2017年、PHPカンファレンス全部でしゃべった
  p3: []
  p4:
  - kind: para
    text: Composer使ってますか？
  p5:
  - kind: para
    text: Dependency Manager for PHP
  p6:
  - kind: para
    text: A. 使ってないB. FW経由でC. 直接使ってる
  p7:
  - kind: para
    text: 分かれそう
  p8:
  - kind: para
    text: 本日しない話
  p9:
  - kind: para
    text: PHPのクラスのオートローディングの説明
  p10:
  - kind: para
    text: プロジェクトでのComposerの運用方法
  p11:
  - kind: para
    text: 過去の発表を読んでください
  p12:
  - kind: para
    text: https://niconare.nicovideo.jp/watch/kn1371
  p13: []
  p14:
  - kind: para
    text: https://qiita.com/tadsan/items/86099d44d12f1103b0a0
  p15:
  - kind: para
    text: https://qiita.com/tadsan/items/a78c9160418200e2d47a
  p16:
  - kind: para
    text: Composerでできること
  p17:
  - kind: para
    text: ざっくり
  p18:
  - kind: para
    text: プロジェクトが依存するパッケージをダウンロードしてくる
  p19:
  - kind: para
    text: プロジェクトが依存するパッケージを利用可能にする
  p20:
  - kind: para
    text: 今日は実行時の話をします
  p21:
  - kind: para
    text: 基本はComposerのautoload.phpを読み込めば準備完了する
  p22: []
  p23:
  - kind: para
    text: 復習
  p24:
  - kind: para
    text: PHPスクリプトの読み込みかた
  p25:
  - kind: para
    text: require, require_once include, include_once
  p26:
  - kind: para
    text: 場合によるけど基本だいたい同じ
  p27:
  - kind: para
    text: どこから？
  p28:
  - kind: para
    text: A. ファイルシステムの絶対パス
  - kind: para
    text: B. include_pathからの相対パスC. プロトコル (ラッパー)
  p29:
  - kind: heading
    level: 1
    text: ファイルシステムの絶対パス
  - kind: para
    text: require '/path/to/file.php';
  - kind: para
    text: ファイルシステム内のフルパス
  - kind: para
    text: require __DIR__.'/../Klass.php';マジック定数__DIR__でスクリプトのディレクトリが入る
  p30:
  - kind: para
    text: include_pathからの相対パス
  - kind: para
    text: include_pathにディレクトリを追加する
  - kind: para
    text: だいたいデフォルトに "." が入ってる
  - kind: para
    text: require 'Hoge.php';
  - kind: para
    text: require 'Fuga/Piyo.php';
  - kind: para
    text: ディレクトリ内も探索される
  p31:
  - kind: heading
    level: 1
    text: プロトコル(ラッパー)
  - kind: para
    text: fopen('php://stderr', 'r') とかfile_get_contents('http://example.com/')とかやるための仕組み
  - kind: para
    text: ……が、セキュリティの懸念もあるので、デフォルトでは php.ini でallow_url_include = Off になってる
  p32:
  - kind: para
    text: 改めてComposer
  p33:
  - kind: para
    text: オートロード機能ついてる
  p34: []
  p35:
  - kind: para
    text: どうやって読み込んでるの？
  p36:
  - kind: para
    text: autoload.phpを読もう
  p37:
  - kind: para
    text: みなさまの手元のComposerプロジェクトを見比べながらお聞きください
  p38:
  - kind: para
    text: '% composer --version Composer version 1.5.2 2017-09-11 16:59:25% composer
      install --no-dev --prefer-dist'
  p39:
  - kind: heading
    level: 1
    text: vendor/autoload.php
  - kind: para
    text: <?php
  - kind: para
    text: // autoload.php @generated by Composer require_once __DIR__ . '/composer/autoload_real.php';
  - kind: para
    text: return ComposerAutoloaderInitbed8ae7d525347237f9cdad08c8930b3::getLoader();
  p40:
  - kind: heading
    level: 1
    text: vendor/autoload.php
  - kind: para
    text: 1.autoload_real.phpを読み込む2.謎のクラスの静的メソッドを実行
  - kind: para
    text: たぶん変なバイトキャッシュを残さないためにcontent-hashが付いたクラス名
  p41: []
  p42:
  - kind: heading
    level: 1
    text: autoload_real.php
  - kind: para
    text: 1.$loaderが生成済みなら返すだけ2.クラスローダーを読み込むだけのクラス
  - kind: para
    text: ローダーを登録して、使ったらすぐにspl_autoload_unregister する
  - kind: list
    items:
    - なんか環境依存の
  - kind: para
    text: ワークアラウンドっぽい気がする
  p43:
  - kind: heading
    level: 1
    text: autoload_real.php
  - kind: para
    text: if (null !== self::$loader) {return self::$loader;}
  - kind: para
    text: // Composer\Autoload クラスを読み込むだけのローダー
  - kind: para
    text: spl_autoload_register(array('ComposerAutoloaderInitbedRy', 'loadClassLoader'),true,
      true);
  - kind: para
    text: self::$loader = $loader = new \Composer\Autoload\ClassLoader();
  - kind: para
    text: spl_autoload_unregister(array('ComposerAutoloaderInitbedRy', 'loadClassLoader'));
  p44:
  - kind: heading
    level: 1
    text: autoload_real.php
  - kind: para
    text: 1.PHPの実行時環境によってクラス定義の読み込みを変更
  - kind: para
    text: 2.autoload_static.php VS 三兄弟
  - kind: list
    items:
    - PHP5.6以上で、HHVMじゃなくて、
  - kind: para
    text: zend_loader_file_encoded()が無効ならautoload_staticが利用される
  p45:
  - kind: heading
    level: 1
    text: autoload_real.php
  - kind: para
    text: $useStaticLoader = PHP_VERSION_ID >= 50600 && !defined('HHVM_VERSION') &&(!function_exists('zend_loader_file_encoded')
      || !zend_loader_file_encoded());if ($useStaticLoader) {require_once __DIR__
      . '/autoload_static.php';call_user_func(\Composer\Autoload\ComposerStaticInitbedRy::getInitializer($loader));}
      else {$map = require __DIR__ . '/autoload_namespaces.php';foreach ($map as $namespace
      => $path) {$loader->set($namespace, $path);}$map = require __DIR__ . '/autoload_psr4.php';foreach
      ($map as $namespace => $path) {$loader->setPsr4($namespace, $path);}$classMap
      = require __DIR__ . '/autoload_classmap.php';if ($classMap) {$loader->addClassMap($classMap);}}
  p46:
  - kind: heading
    level: 1
    text: autoload_static.php
  - kind: para
    text: プロジェクトの依存パッケージと、composer installのオプションに依存
  - kind: para
    text: デフォルトではComposer.jsonの定義通りのローディングを生成
  - kind: para
    text: --optimize-autoloader オプションでクラスマップを強制で生成する
  p47:
  - kind: heading
    level: 1
    text: autoload_static.php (PSR-4のみ)
  - kind: para
    text: <?php // autoload_static.php @generated by Composer namespace Composer\Autoload;
  - kind: para
    text: class ComposerStaticInitbed8ae7d525347237f9cdad08c8930b3 {public static
      $prefixLengthsPsr4 = array ('T' =>array ('Teto\\' => 5,
  - kind: para
    text: ),);public static $prefixDirsPsr4 = array ('Teto\\' =>array (
  - kind: para
    text: 0 => __DIR__ . '/../..' . '/src',),);public static function getInitializer(ClassLoader
      $loader) {return \Closure::bind(function () use ($loader) {
  - kind: para
    text: $loader->prefixLengthsPsr4 = ComposerStaticInitbed8ae7d525347237f9cdad08c8930b3::$prefixLengthsPsr4;$loader->prefixDirsPsr4
      = ComposerStaticInitbed8ae7d525347237f9cdad08c8930b3::$prefixDirsPsr4;
  - kind: para
    text: '}, null, ClassLoader::class);}'
  - kind: para
    text: '}'
  p48:
  - kind: heading
    level: 1
    text: autoload_static.php (optimized)
  - kind: para
    text: public static $classMap = array ('Teto\\Object\\Helper' => __DIR__ . '/../..'
      . '/src/Object/Helper.php','Teto\\Object\\MethodAlias' => __DIR__ . '/../..'
      . '/src/Object/MethodAlias.php','Teto\\Object\\ObjectArray' => __DIR__ . '/../..'
      . '/src/Object/ObjectArray.php','Teto\\Object\\PrivateGetter' => __DIR__ . '/../..'
      . '/src/Object/PrivateGetter.php','Teto\\Object\\PrivateStrictGetter' => __DIR__
      . '/../..' . '/src/Object/PrivateStrictGetter.php','Teto\\Object\\PropertyLikeMethod'
      => __DIR__ . '/../..' . '/src/Object/PropertyLikeMethod.php','Teto\\Object\\ReadOnly'
      => __DIR__ . '/../..' . '/src/Object/ReadOnly.php','Teto\\Object\\ToArrayInterface'
      => __DIR__ . '/../..' . '/src/Object/ToArrayInterface.php','Teto\\Object\\TypeAssert'
      => __DIR__ . '/../..' . '/src/Object/TypeAssert.php','Teto\\Object\\TypeDefinition'
      => __DIR__ . '/../..' . '/src/Object/TypeDefinition.php','Teto\\Object\\TypedProperty'
      => __DIR__ . '/../..' . '/src/Object/TypedProperty.php',);
  p49:
  - kind: heading
    level: 1
    text: autoload_static.phpの大事なとこ
  - kind: heading
    level: 2
    text: Closure::bind()でスコープ束縛して、
  - kind: heading
    level: 2
    text: メソッド呼び出しをけちりながら
  - kind: heading
    level: 2
    text: privateメンバーにセットしてる
  - kind: para
    text: return \Closure::bind(function () use ($loader) {$loader->prefixLengthsPsr4
      = ComposerStaticInitbedRy::$prefixLengthsPsr4;$loader->prefixDirsPsr4 = ComposerStaticInitbedRy::$prefixDirsPsr4;$loader->classMap
      = ComposerStaticInitbedRy::$classMap;
  - kind: para
    text: '}, null, ClassLoader::class);'
  p50:
  - kind: heading
    level: 1
    text: ClassLoader.php
  - kind: para
    text: クラスローダーの実装本体いままで設定された情報をもとにクラス名の解決・ファイルロードをする
  - kind: para
    text: 動的に変動する部分は分離されてるので、バイトコードがキャッシュされても特に問題なさそうに作ってるっぽい
  p51:
  - kind: heading
    level: 1
    text: ClassLoader.php
  - kind: para
    text: spl_autoload_register()で呼ばれる
  - kind: para
    text: クラスマップにあったらそれを読む
  - kind: para
    text: なかったらpsr-4, psr-2を読む
  - kind: para
    text: PEARに依存するなどの場合は
  - kind: para
    text: include_pathを読む
  p52:
  - kind: para
    text: これによって得られる知見
  p53:
  - kind: para
    text: Composerは、いろんなPHPのバージョンとか実行環境で動くように書かれてる
  p54:
  - kind: para
    text: 実行時にcomposer.jsonとかcomposer.lockは使ってなくて、静的なPHPスクリプトファイルが書き出される
  p55:
  - kind: para
    text: サーバーでcomposer installの必要はなく、手元でインストールしてvendorディレクトリごと転送してやればいい
  p56:
  - kind: para
    text: よくある誤解
  p57:
  - kind: para
    text: 「レンタルサーバーの最安プランでPHP動かしてるからComposer入らないんだ…」といったことはない
  p58:
  - kind: para
    text: 本筋から外れた話
  p59:
  - kind: para
    text: Autoloader Optimization
  - kind: para
    text: https://getcomposer.org/doc/articles/autoloader-optimization.md
  p60:
  - kind: para
    text: Level 1本番運用時は--optimize-autoloaderが基本
  p61:
  - kind: para
    text: ……そのほかは効果あるのかな？
  - kind: para
    text: (私は使ってないです)
  p62:
  - kind: para
    text: 予告
  p63:
  - kind: para
    text: PHP AdventCalendar 2017ではComposerとか全然考慮されてない(zipで配布されてる)SDKをむりやりComposerで管理する話を書きます
