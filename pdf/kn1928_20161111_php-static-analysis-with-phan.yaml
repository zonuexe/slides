  - kind: para
    text: JAPAN phpcon 2016, 3rd November
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - GitHub/Packagistでは id:zonuexe
    - 2012年 自宅警備→ピクシブ株式会社
    - モバイルアプリ向けWebAPI開発とか
    - 今年の春からメンテナンスとしてチーム独立
    - 日常的なバグ修正から、アーキテクチャの改善
  - kind: para
    text: リファクタリングやテストなどいろいろ！
  p3:
  - kind: para
    text: おしごと
  p4:
  - kind: para
    text: 現実に動いている
  - kind: para
    text: (ユーザーさんが利用している)
  - kind: para
    text: サービスを破壊せずに
  - kind: para
    text: コードの健全さを向上したい
  p5: []
  p6:
  - kind: para
    text: そんなノウハウをｷﾞｭｯと詰め込んだ
  - kind: heading
    level: 1
    text: PHP大規模開発入門(連載中)
  p7:
  - kind: heading
    level: 1
    text: PHP大規模開発入門
  - kind: list
    items:
    - 'Vol.87: PHPDocでコードの品質を保つ'
    - 'Vol.91: 名前空間とオートローディング'
    - 'Vol.94: PHP初心者がハマりがちな落とし穴'
  - kind: para
    text: ……型のキャスト，変数とリファレンス
  - kind: list
    items:
    - 'Vol.95: PHPの静的解析'
  - kind: para
    text: ……ドキュメントの生成，問題箇所の発見
  p8:
  - kind: heading
    level: 1
    text: PHP大規模開発入門
  - kind: list
    items:
    - 'Vol.87: PHPDocでコードの品質を保つ'
    - 'Vol.91: 名前空間とオートローディング'
    - 'Vol.94: PHP初心者がハマりがちな落とし穴'
  - kind: para
    text: ……型のキャスト，変数とリファレンス
  - kind: list
    items:
    - 'Vol.95: PHPの静的解析'
  - kind: para
    text: ……ドキュメントの生成，問題箇所の発見
  p9:
  - kind: heading
    level: 1
    text: おしながき
  - kind: list
    items:
    - PHPと型
    - PHPDocとは何か
    - Phanの紹介
  p10:
  - kind: para
    text: PHPと型
  p11:
  - kind: heading
    level: 1
    text: 動的型検査
  - kind: list
    items:
    - プログラムを動かしながら(←動的)
  - kind: para
    text: 手さぐりで型を調べる (←型検査)
  - kind: para
    text: $a = 13; $b = "2";
  - kind: para
    text: echo $a + $b;
  - kind: list
    items:
    - 「$aの型はintだな、$bの型はstring…
  - kind: para
    text: だけど数字だから足しざんできるね！」
  - kind: para
    text: ……みたいな茶番を毎回やってる
  p12:
  - kind: heading
    level: 1
    text: PHPの型
  - kind: list
    items:
    - 変数に型はないが、値が型を持つ
    - C言語みたいに int id のような定義はできない
    - 64 と 'A' は厳然とした別の型の値
    - '''64'' == 64 のような比較が成り立つ設計'
    - 関数は型宣言できる (ただし動的検査)
  p13:
  - kind: heading
    level: 1
    text: PHPの型の種類
  - kind: list
    items:
    - 整数(int) 浮動小数点数(float) 論理値(bool)
  - kind: para
    text: 文字列(string) 配列(array) リソース(resource)
  - kind: para
    text: オブジェクト(object) ヌル値(null)
  - kind: list
    items:
    - PHP5ではarrayのみ宣言に記述できる
    - 7.0ではint, float, string, boolが記述できる
  p14:
  - kind: heading
    level: 1
    text: 型宣言(PHP7)
  - kind: heading
    level: 2
    text: PHP7の関数(メソッド・クロージャ含む)は、
  - kind: heading
    level: 2
    text: 引数と返り値に型を定義することができる
  - kind: para
    text: // PHP 5
  - kind: para
    text: function trapezoid($h, $a, $b) {
  - kind: para
    text: return $h * ($a + $b) / 2;
  - kind: para
    text: '}'
  - kind: para
    text: // PHP 7
  - kind: para
    text: 'function trapezoid(float $h, float $a, float $b): float'
  - kind: para
    text: '{'
  - kind: para
    text: return $h * ($a + $b) / 2;
  - kind: para
    text: '}'
  p15:
  - kind: heading
    level: 1
    text: 動的型検査の弱点
  - kind: list
    items:
    - プログラムを動かしてみないとわからない
  - kind: para
    text: $a = 13; $b = [];
  - kind: para
    text: // 環境依存の分岐 (本番環境じゃないと動かない)
  - kind: para
    text: if (is_production()) {
  - kind: para
    text: echo $a + $b; // 検出できない
  - kind: para
    text: echo 1 + []; // ←これはPHP7で検出できるようになった
  - kind: para
    text: '}'
  - kind: para
    text: 'function f(): int {'
  - kind: para
    text: return []; // これも検出できない
  - kind: para
    text: '}'
  p16:
  - kind: para
    text: PHPDoc#とは何か
  p17:
  - kind: heading
    level: 1
    text: DocCommentとリフレクション
  - kind: list
    items:
    - 定義文(クラス・関数・メソッドなど)に付属する
  - kind: heading
    level: 2
    text: 特別なコメント(/** 〜 */ の範囲)を実行時に
  - kind: heading
    level: 2
    text: 文字列として取得することができる(DocComment)
  - kind: para
    text: /** ここはDocCommentだよ */
  - kind: para
    text: function hoge() {
  - kind: para
    text: '}'
  - kind: para
    text: $ref = new \ReflectionFunction('hoge');
  - kind: para
    text: echo $ref->getDocComment();
  - kind: para
    text: // => "/** ここはDocCommentだよ */"
  p18:
  - kind: heading
    level: 1
    text: PHPDoc型注釈
  - kind: heading
    level: 2
    text: DocCommentに型定義を注釈として記述する記法。
  - kind: heading
    level: 2
    text: PhpStormやPhanが解釈してくれる。
  - kind: para
    text: /**
  - kind: para
    text: '* @param float $h'
  - kind: para
    text: '* @param float $a'
  - kind: para
    text: '* @param float $b'
  - kind: para
    text: '* @return float'
  - kind: para
    text: '*/'
  - kind: para
    text: function trapezoid($h, $a, $b) {
  - kind: para
    text: return $h * ($a + $b) / 2;
  - kind: para
    text: '}'
  p19:
  - kind: para
    text: PhpStormの型表示
  p20:
  - kind: heading
    level: 1
    text: PHPDocの型
  - kind: list
    items:
    - 基本はPHPの型かクラス名を書く
    - callable, $this, self, static, voidなども有効
    - 複合型 (Union/Multiple types)
    - 「intまたは文字列」 int|string
    - 値が並んでるもの (配列/Collection)
    - 「intが並んでるもの」 int[]
    - https://zonuexe.github.io/phpDocumentor2-ja/references/phpdoc/types.html
  p21:
  - kind: heading
    level: 1
    text: なぜPHPDoc型注釈？
  - kind: list
    items:
    - いきなり実装コードに型定義を追加すると、
  - kind: para
    text: いままで顕在化しなかったバグが発生するおそれ
  - kind: list
    items:
    - 不用意なキャストや型検査でエラー発生
    - PHPDocはただのコメントなので、
  - kind: para
    text: 稼動中のコードの挙動を変更せず検査できる
  - kind: list
    items:
    - 現行のPHPの型定義以上の型付けを表現できる
    - 複合型やコレクション(array → int[])
    - PHP5で対応できない string, int など
  p22:
  - kind: heading
    level: 1
    text: これだけ覚えて帰ってね
  - kind: para
    text: タグ名
  - kind: para
    text: 意味
  - kind: para
    text: 例
  - kind: para
    text: '@param'
  - kind: para
    text: 引数を定義
  - kind: para
    text: '@param int $n1'
  - kind: para
    text: '@return'
  - kind: para
    text: 返り値を定義
  - kind: para
    text: '@return int[]'
  - kind: para
    text: '@var'
  - kind: para
    text: 変数/プロパティを定義
  - kind: para
    text: '@var int'
  - kind: para
    text: '@property'
  - kind: para
    text: マジックプロパティを定義
  - kind: para
    text: '@property int $id'
  - kind: heading
    level: 2
    text: ふつうのプロパティは@propertyじゃなくて
  - kind: heading
    level: 2
    text: '@varなので注意 (Phanは@property未対応)'
  p23:
  - kind: heading
    level: 1
    text: プロパティの例 (@var)
  - kind: heading
    level: 2
    text: ふつうのプロパティの場合は @var を使って書く
  - kind: para
    text: final class Book {
  - kind: para
    text: /** @var string */
  - kind: para
    text: public $title;
  - kind: para
    text: /** @var \MyApp\Author[] */
  - kind: para
    text: public $authors;
  - kind: para
    text: /** @var \MyApp\ISBN */
  - kind: para
    text: public $isbn;
  - kind: para
    text: '}'
  p24:
  - kind: heading
    level: 1
    text: プロパティの例 (@property)
  - kind: heading
    level: 2
    text: 拙作のzonuexe/objectsystemを使った場合
  - kind: para
    text: /**
  - kind: para
    text: '* @property string $title'
  - kind: para
    text: '* @property \MyApp\Author[] $authors'
  - kind: para
    text: '* @property \MyApp\ISBN $isbn'
  - kind: para
    text: '*/'
  - kind: para
    text: final class Book {
  - kind: para
    text: use \Teto\Object\TypedProperty;
  - kind: para
    text: protected static $property_types = [
  - kind: para
    text: '''title'' => ''string'','
  - kind: para
    text: '''authors'' => ''MyApp\Author[]'','
  - kind: para
    text: '''isbn'' => ''?MyApp\ISBN'','
  - kind: para
    text: '];'
  - kind: para
    text: '}'
  p25:
  - kind: heading
    level: 1
    text: 型注釈を使ったハック
  - kind: heading
    level: 2
    text: 複合型とコレクション(型の配列)を組み合せる
  - kind: para
    text: /** @return Book[]|\ArrayObject */
  - kind: para
    text: function getBooks() {
  - kind: para
    text: $data = hogehoge();
  - kind: para
    text: return new \ArrayObject($data);
  - kind: para
    text: '}'
  - kind: para
    text: $books = getBooks();
  - kind: para
    text: $books->▍ // ここで \ArrayObject の補完が効く
  - kind: para
    text: foreach ($books as $book) {
  - kind: para
    text: $book->▍ // ここで Book の補完が効く
  - kind: para
    text: '}'
  p26:
  - kind: para
    text: Phanの紹介
  p27:
  - kind: heading
    level: 1
    text: Phanとは何か
  - kind: list
    items:
    - ハンドメイドマーケットを運営する
  - kind: para
    text: アメリカのEtsy社が開発する静的解析ツール
  - kind: para
    text: https://github.com/etsy/phan
  - kind: list
    items:
    - 現在PHP作者のRasmus Lerdorf が所属し、
  - kind: para
    text: Phanの開発にも参加してる
  - kind: list
    items:
    - PHPの型定義と型注釈を両方見てくれる
    - ただし、@propertyと@method未対応
  p28:
  - kind: heading
    level: 1
    text: Phanの導入
  - kind: list
    items:
    - https://github.com/etsy/phan/releases
  - kind: para
    text: 最新のタグが付いてる.pharファイルをダウンロード
  - kind: list
    items:
    - PHP7とphp-astが必須
    - ただしラッパースクリプトを用意すれば、
  - kind: para
    text: サービスがPHP7で稼動してなくても動かせる
  - kind: para
    text: '#!/bin/sh'
  - kind: para
    text: /path/to/php7/bin/php ${PHAN_BIN:-/path/to/bin/phan} "$@"
  p29:
  - kind: heading
    level: 1
    text: Phanの設定
  - kind: list
    items:
    - はじめにWikiから設定ファイルをコピペして、
  - kind: heading
    level: 2
    text: プロジェクトの .phan/config.php に保存
  - kind: para
    text: https://github.com/etsy/phan/wiki/Getting-Started#creating-a-config-file
  - kind: para
    text: // ディレクトリホワイトリスト
  - kind: para
    text: '''directory_list'' => ['
  - kind: para
    text: '''src'','
  - kind: para
    text: '''vendor/symfony/console'','
  - kind: para
    text: '],'
  - kind: para
    text: // ディレクトリブラックリスト
  - kind: para
    text: '"exclude_analysis_directory_list" => ['
  - kind: para
    text: '''vendor/'''
  - kind: para
    text: '],'
  p30:
  - kind: heading
    level: 1
    text: Phanの設定(そのほか)
  - kind: list
    items:
    - '''generic_types_enabled'' => bool'
    - '@templateタグ(ジェネリック) 有効/無効'
    - '''suppress_issue_types'' => string[]'
    - 無視するIssueタイプを指定する
    - '''plugins'' => string[]'
    - Phanプラグインを追加できる
    - サンプルとしてDollarDollarが添付されている
    - $$var (可変変数)を検出
  p31:
  - kind: heading
    level: 1
    text: Phan コマンド
  - kind: list
    items:
    - -o, --output <filename> 出力ファイル指定
    - -m <mode>, --output-mode 出力形式
    - -x, --dead-code-detection デッドコード検出
    - --backward-compatibility-checks PHP7互換性
    - -j, --processes <int> 並列実行数
    - -p, --progress-bar 進捗バーを表示
  - kind: para
    text: ./phan-wrapper -m csv -o phan.csv -x -j4 \
  - kind: para
    text: --progress-bar --backward-compatibility-checks
  p32:
  - kind: heading
    level: 1
    text: Phan 出力
  - kind: list
    items:
    - デフォルトの場合の出力
  - kind: para
    text: pixiv-lib/Illust/Common.php:738 PhanTypeMismatchArgumentInternal
  - kind: para
    text: Argument 1 (month) is string but \checkdate() takes int
  - kind: para
    text: pixiv-lib/Illust/Common.php:738 PhanTypeMismatchArgumentInternal
  - kind: para
    text: Argument 2 (day) is string but \checkdate() takes int
  - kind: para
    text: path/to/file.php:333 PhanTypeMismatchArgumentInternal This is message.
  - kind: list
    items:
    - PhanTypeMismatchArgumentInternal はIssueと呼ばれる
    - Issueごとに出力するを制御可能(@suppressタグ)
  p33:
  - kind: heading
    level: 1
    text: Phan Issueいろいろ
  - kind: list
    items:
    - PhanParamTooFew / PhanParamTooMany
    - 引数が足りない／多い
    - PhanParamTypeMismatch
    - 引数の型が間違ってる
    - PhanRedefineClass / PhanRedefineFunction
    - 同名のクラス／関数がいくつも定義されてる
  p34:
  - kind: heading
    level: 1
    text: PhanUndeclaredClassCatch
  - kind: heading
    level: 2
    text: 存在しないクラスでキャッチしようとしてないか
  - kind: para
    text: // PHP 5
  - kind: para
    text: namespace MyApp;
  - kind: para
    text: try {
  - kind: para
    text: foo();
  - kind: para
    text: '} catch (RuntimeException $e) {'
  - kind: para
    text: // ↑ \MyApp\RuntimeException
  - kind: para
    text: '} catch (\Excaption $e) {'
  - kind: para
    text: // ↑ \Exception が正しい
  - kind: para
    text: '}'
  p35:
  - kind: heading
    level: 1
    text: PhanUndeclaredClassInstanceof
  - kind: heading
    level: 2
    text: 存在しないクラスでinstanceofしてないか
  - kind: para
    text: namespace MyApp;
  - kind: para
    text: $e = get_error();
  - kind: para
    text: if ($e instanceof RuntimeException) {
  - kind: para
    text: // ↑ \MyApp\RuntimeException
  - kind: para
    text: '} elseif ($e instanceof \Excaption) {'
  - kind: para
    text: // ↑ \Exception が正しい
  - kind: para
    text: '}'
  p36:
  - kind: heading
    level: 1
    text: PhanTypeMismatchForeach
  - kind: heading
    level: 2
    text: foreachできない値をforeachしようとしてる
  - kind: para
    text: $iter = null;
  - kind: para
    text: // E_WARNING
  - kind: para
    text: foreach ($iter as $i) {
  - kind: para
    text: echo $i;
  - kind: para
    text: '}'
  p37:
  - kind: heading
    level: 1
    text: PhanTypeMismatchReturn
  - kind: heading
    level: 2
    text: 定義と違った型の値を返してる
  - kind: para
    text: /** @return void */
  - kind: para
    text: function f() {
  - kind: para
    text: return null;
  - kind: para
    text: '}'
  - kind: para
    text: function g():int {
  - kind: para
    text: return [];
  - kind: para
    text: '}'
  p38:
  - kind: heading
    level: 1
    text: PhanTypeMissingReturn
  - kind: heading
    level: 2
    text: 特定の型を返すべきだが、何も返していない
  - kind: para
    text: /** @return int */
  - kind: para
    text: function g(){
  - kind: para
    text: return;
  - kind: para
    text: '}'
  p39:
  - kind: heading
    level: 1
    text: PhanTypeVoidAssignment
  - kind: heading
    level: 2
    text: 実際にはnullが代入されるが
  - kind: heading
    level: 2
    text: voidは「データがない」を意味するので適切ではな
  - kind: heading
    level: 2
    text: い
  - kind: para
    text: /** @return void */
  - kind: para
    text: function g(){ return; }
  - kind: para
    text: $result = g();
  p40:
  - kind: heading
    level: 1
    text: PhanNoopXXXX
  - kind: heading
    level: 2
    text: 無意味なコードを検出する
  - kind: para
    text: // 代入しない配列 PhanNoopArray
  - kind: para
    text: '[1, 2, 3];'
  - kind: para
    text: // 代入も実行もしないクロージャ PhanNoopClosure
  - kind: para
    text: function(){ return awesome(); };
  - kind: para
    text: // returnしていないので無意味 PhanNoopProperty
  - kind: para
    text: class C {
  - kind: para
    text: public $p;
  - kind: para
    text: function f() { $this->p; }
  - kind: para
    text: '}'
  p41:
  - kind: heading
    level: 1
    text: PhanDeprecatedFunction
  - kind: heading
    level: 2
    text: 廃止予定/非推奨のメソッドを利用。
  - kind: heading
    level: 2
    text: 古い実装を新しいものに置換する際に
  - kind: heading
    level: 2
    text: '@deprecated を付けておくと洗い出せてべんり'
  - kind: para
    text: function newAwesomeFunc(){}
  - kind: para
    text: /** @deprecated */
  - kind: para
    text: function oldFunc(){}
  - kind: para
    text: oldFunc(); // PhpStormは取り消し線で表示
  p42:
  - kind: heading
    level: 1
    text: Phan独自のアノテーション
  - kind: heading
    level: 2
    text: '@suppress <issue_type>'
  - kind: heading
    level: 2
    text: クラス・メソッドなどの範囲でIssueを無効化する
  - kind: para
    text: /** @suppress PhanUndeclaredConstant */
  - kind: para
    text: class C {
  - kind: para
    text: function f() { return AWESOME_CONSTANT; }
  - kind: para
    text: /** @supress PhanUndeclaredProperty */
  - kind: para
    text: function g() { return $this->p; }
  - kind: para
    text: '}'
  p43:
  - kind: heading
    level: 1
    text: Phan独自のアノテーション
  - kind: heading
    level: 2
    text: '@template 型変数(ジェネリック)'
  - kind: para
    text: /** @template T1 */
  - kind: para
    text: class Container {
  - kind: para
    text: /** @var T1 */
  - kind: para
    text: private $value;
  - kind: para
    text: public function __construct($value){ $this->value =
  - kind: para
    text: $value; }
  - kind: para
    text: function getValue() { return $value; }
  - kind: para
    text: '}'
  p44:
  - kind: heading
    level: 1
    text: Phanの制限
  - kind: list
    items:
    - define()関数での定数定義はサポートされない
    - 動的に定義されるため (constは静的)
    - Reference to undeclared constant 扱い
    - '@method には対応してない'
    - __call() を使ったProxyパターン殺し
  p45:
  - kind: heading
    level: 1
    text: Phanのめんどくさいところ
  - kind: list
    items:
    - 重い
    - ファイル数にもよるが数十秒〜 かかる
    - 標準化されてないPHPDocに惑わされる
    - PhanTypeMismatchReturn Returning type bool
  - kind: para
    text: but insert() is declared to return \成功
  - kind: list
    items:
    - 「@return 成功 true 失敗 false」
  p46:
  - kind: heading
    level: 1
    text: Phanの注意点
  - kind: list
    items:
    - メソッド／プロパティの動的定義に未対応
    - __get(), __set(), __call(), __callStatic() など
    - PHP用語としての「オーバーロード」
  - kind: para
    text: http://php.net/manual/ja/language.oop5.overloading.php
  - kind: list
    items:
    - 定数の動的定義にも未対応
    - define() はだめ。const文ならOK。
  p47:
  - kind: heading
    level: 1
    text: Phanの比較対象(競合)
  - kind: list
    items:
    - 定番：PHP Mess Detector (PHPMD)
    - さまざまな指摘をしてくれるが、型検査はなし
    - 似たサービスもいくつかある (private有料)
    - Scrutinizer, SensioLabsInsight, CodeClimate
    - これらコードの怪しい兆候を細かに教えてくれる
    - 型検査の精度ではPhanの方が良く見える
  p48:
  - kind: heading
    level: 1
    text: まとめ
  - kind: list
    items:
    - PHPDocの型注釈は動作に影響を及ぼさずに
  - kind: para
    text: 型を宣言することができる
  - kind: list
    items:
    - Phanはソースコードを動作させずに解析できる
    - Phanで静的解析することで、
  - kind: para
    text: リファクタリングのリスクを減らすことができる
  - kind: list
    items:
    - 廃止予定の非推奨メソッドには
  - kind: para
    text: '@deprecated をつける習慣をつけると殲滅が捗る'
