text:
  p1:
  - kind: heading
    level: 1
    text: PHPの成功と失敗
  - kind: heading
    level: 2
    text: Let's talk successes and failures in PHP applications
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2022-06-23【非公式】PHPカンファレンス福岡・前日Meetup
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人
  p3:
  - kind: heading
    level: 1
    text: さて
  p4:
  - kind: para
    text: 😎
  - kind: para
    text: サクセスしたい
  - kind: para
    text: ですか？
  p5:
  - kind: para
    text: ???「PHPをご存じか？」
  p6:
  - kind: para
    text: 世界で最も成功したプログラミング言語
  p7:
  - kind: para
    text: 多くの「失敗」を抱えたプログラミング言語
  p8:
  - kind: para
    text: ……という話はここで終了です
  p9:
  - kind: heading
    level: 1
    text: 本題
  p10:
  - kind: heading
    level: 1
    text: 今回のお題
  p11:
  - kind: para
    text: あなたのコードは
  - kind: para
    text: 「絶対に」正常に
  - kind: para
    text: 動きますか？
  p12:
  - kind: heading
    level: 1
    text: 成功と失敗を考える
  p13:
  - kind: para
    text: 検索して1件もレコードがなれば失敗か？
  p14:
  - kind: heading
    level: 1
    text: 場合による！
  p15:
  - kind: para
    text: プログラムが期待通りに動かないことを失敗と捉える
  p16:
  - kind: heading
    level: 1
    text: もうちょっと抽象的に
  p17:
  - kind: para
    text: あなたのプログラムはいつ動かない？
  - kind: list
    items:
    - A. 基本的には絶対動く (コンピュータやOSが正常動作する限り)
    - B. コンピュータが意図してない状態に陥ってない限りは動く
    - C. 通信先のDB/APIが動いてる限りは動く
    - D. ちゃんと正規の手順でセットアップしてくれる限りは動く
  p18:
  - kind: para
    text: (基本的に)絶対動くプログラム
  - kind: list
    items:
    - echo "Hello"
    - var_dump(1 + 1)
    - count([1, 2, 3])
  p19:
  - kind: para
    text: PCの環境が整っている限りは動く
  - kind: list
    items:
    - file_get_contents($path) // ファイルがあれば動く
    - file_put_contents($path, $body) // ディスクに書き込めれば
    - ネットワークが…
  p20:
  - kind: para
    text: 通信先の問題がなければ動く
  - kind: list
    items:
    - 接続先のデータベースが過負荷状態で応答しない
    - 接続先のAPIが何らかの問題で応答しない
    - 接続先との間のネットワークが詰まっている
    - これらの問題はこちらでは対処できない
  p21:
  - kind: para
    text: 想定通りの前提が揃っていれば
  - kind: list
    items:
    - 通信のためにAPIキーを環境変数でセットしておく必要がある
    - メソッド呼び出し前に正規のオプションをセットしていれば動く
    - php.ini におかしな設定が入っていなければ動く
    - 存在しないextensionを読み込もうとしてないかとか
  p22:
  - kind: para
    text: 想定していない事態にどう対処するか
  p23:
  - kind: heading
    level: 1
    text: file_get_contents($path)
  p24:
  - kind: para
    text: PHP標準関数はどうするか
  - kind: list
    items:
    - 失敗がありうる関数は、型としては |false のような型がつけられている
    - '例: file_get_contents() などを含む'
    - ただし、内部的にはエラーを発生させられる
    - そして発生したエラーはエラーハンドラーで握り潰される可能性がある
    - falseが返ってくるかどうかは環境による(!)
  p25:
  - kind: para
    text: エラーとは
  - kind: list
    items:
    - throwできる例外とは別にエラーというものがある
    - PHP7で追加されたErrorとは別物(!)
    - 発生したエラーはset_error_handler()でカスタマイズできる
    - エラーのままでは扱いにくいのでErrorExceptionに変換するといい
  p26:
  - kind: para
    text: 例外とは
  - kind: list
    items:
    - throwできるオブジェクト
    - 例外が発生する可能性がある処理をcatchで括ると補足できる
    - どのcatchにも捕捉されなかった例外はset_exception_handler()で
  - kind: para
    text: カスタマイズできる
  - kind: list
    items:
    - Webサイトの共通エラー画面を表示するのに使える
  p27:
  - kind: heading
    level: 1
    text: '@throws'
  - kind: list
    items:
    - ある関数メソッドを呼び出すと例外が発生することを使用者に示す
    - そのメソッドを呼び出して発生するおそれのある例外を捕捉して対処するこ
  - kind: para
    text: とを例外ハンドリンクという
  - kind: list
    items:
    - Javaのthrowsと検査例外(チェック例外)を模倣したもの
    - 静的解析ツールやPhpStormは@throwsがあるメソッド呼び出しに対し
  - kind: para
    text: て、try-catchがなければハンドリングすることを要求する
  p28:
  - kind: heading
    level: 1
    text: ユニオン型による失敗の表現
  - kind: list
    items:
    - 'function searchBooks($name): ?Book'
    - 検索がヒットしなければnullを返す
    - ユニオン型だけで失敗を表現すると、どうすればいいのか情報不足になりが
  - kind: para
    text: ち
  p29:
  - kind: heading
    level: 1
    text: ユニオン型+throwsによる失敗表現
  - kind: list
    items:
    - /**
  - kind: para
    text: '* @throws SearchEngineErrorException*/function searchBook($name): ?Book'
  - kind: list
    items:
    - 検索がヒットしなければnullを返す
    - 検索エンジンに異常事態があれば例外を示す
  p30:
  - kind: heading
    level: 1
    text: ユニオン型+throwsによる失敗表現
  - kind: list
    items:
    - /**
  - kind: para
    text: '* @throws SearchEngineErrorException*/function searchBook($name): ?Book'
  - kind: list
    items:
    - 検索がヒットしなければnullを返す
    - 検索エンジンに異常事態があれば例外を示す
  p31:
  - kind: heading
    level: 1
    text: リスト+throwsによる失敗表現
  - kind: list
    items:
    - /**
  - kind: para
    text: '* @throws SearchEngineErrorException*/function searchBook($name): array'
  - kind: list
    items:
    - 検索がヒットしなければnullを返す
    - 検索エンジンに異常事態があれば例外を示す
  p32:
  - kind: heading
    level: 1
    text: ユニオン型+throwsによる失敗表現
  - kind: list
    items:
    - /**
  - kind: para
    text: '* @throws SearchEngineErrorException*/function searchBook($name): ?Book'
  - kind: list
    items:
    - 検索がヒットしなければnullを返す
    - 検索エンジンに異常事態があれば例外を示す
  p33:
  - kind: heading
    level: 1
    text: 例外を含むユニオン型
  - kind: list
    items:
    - 'function searchBooks($name): Book|NotFound|DBError'
    - 検索がヒットすればnullを返す
    - 検索がヒットしなければNotFoundを返す
    - DBが異常ならDBErrorを返す
  p34:
  - kind: heading
    level: 1
    text: その他
