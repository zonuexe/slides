  - node: p
    children:
    - node: text
      content: 簡単な言語
  p29:
  - node: p
    children:
    - node: text
      content: Brainfuck
  p30:
  - node: p
    children:
    - node: text
      content: < > + - . , [ ] 言語仕様8命令だけ
  p31:
  - node: p
    children:
    - node: text
      content: トークン意味<ポインタを1進める>ポインタを1戻す+ポインタ位置の値を1加算-ポインタ位置の値を1減算.ポインタ位置に値を出力,1バイト読込ポインタ位置に代入[ポインタ位置の値が0なら]にジャンプ]ポインタ位置の値が0でなければ[にジャンプ
  p32:
  - node: p
    children:
    - node: text
      content: '>+++++++++[<++++++++>-]<.>+++++++[<++++>-]<+.+++++++..+++.[-]>++++++++[<++++>-]<.>+++++++++++[<+++++>-]<.>++++++++[<+++>-]<.++'
    - node: bold
      content: http://www.kmonos.net/alang/etc/brainfuck.php
