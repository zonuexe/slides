  - node: p
    children:
    - node: text
      content: チューリングマシンを使ってチューリングマシンと同等のものを構成できる
  p24:
  - node: p
    children:
    - node: text
      content: 万能チューリングマシン
  p25:
  - node: p
    children:
    - node: text
      content: ある計算機言語を使って万能チューリングマシンを構成できるとき、その言語はチューであると呼ぶリング完全
  p26:
  - node: p
    children:
    - node: text
      content: 万能？
  p27:
  - node: p
    children:
    - node: text
      content: ディスクにデータを書き込むとか、現在の時刻を知るとか、TCPパケットを送るとか、そういう魔法のような機械のことは想定してない
