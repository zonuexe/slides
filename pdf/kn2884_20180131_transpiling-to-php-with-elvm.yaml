  - kind: heading
    level: 1
    text: ELVMであらゆる言語から
  - kind: heading
    level: 1
    text: PHPに変換しよう
  - kind: para
    text: Let's convert from any language to PHP by ELVM
  - kind: para
    text: '2018-01-31 PHP勉強会@東京 #phpstudy'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社技術基盤チーム (pixiv.net)
    - Emacs Lisper, PHPer
    - 入社前は自宅警備をしながらRuby書いてた
    - Emacs PHP Modeのメンテナ引き継ぎました
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: 好きな言語構造はgotoです
  p4:
  - kind: para
    text: 宣伝
  p5:
  - kind: para
    text: 昨晩書いたまじめ記事
  - kind: para
    text: (当社比)
  p6: []
  p7:
  - kind: para
    text: 今日は話しません
  p8: []
  p9:
  - kind: para
    text: 前夜祭で話します
  p10:
  - kind: para
    text: チケット購入しよう
  p11:
  - kind: para
    text: はじめに
  p12:
  - kind: heading
    level: 1
    text: ELVMであらゆる言語から
  - kind: heading
    level: 1
    text: PHPに変換しよう
  - kind: para
    text: Let's convert from any language to PHP by ELVM
  - kind: para
    text: '2018-01-31 PHP勉強会@東京 #phpstudy'
  p13:
  - kind: para
    text: 「あらゆる」
  - kind: para
    text: はオーバー
  p14:
  - kind: para
    text: '|←樹海|.￣.||￣ ｵﾜﾀ┗(^o^ )┓三|| ┏┗ 三￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣￣'
  p15:
  - kind: para
    text: まあ話を聞いてくれ
  p16:
  - kind: para
    text: 計算可能性
  p17:
  - kind: para
    text: コンピュータで解ける問題
  p18:
  - kind: para
    text: チューリング
  - kind: para
    text: マシン
  p19:
  - kind: para
    text: https://www.google.com/doodles/alan-turings-100th-birthday
  p20:
  - kind: para
    text: チューリングさんが計算の可能性をつきつめたらこうなった
  p21:
  - kind: para
    text: 計算機で計算できる函数
  - kind: para
    text: チャーチ=チューリング
  - kind: para
    text: のテーゼ
  p22:
  - kind: para
    text: パソコンで計算できる
  - kind: para
    text: '||チューリング機械と同じ'
  p23:
  - kind: para
    text: チューリングマシンを使っ
  - kind: para
    text: てチューリングマシンと同等のものを構成できる
  p24:
  - kind: para
    text: 万能チューリ
  - kind: para
    text: ングマシン
  p25:
  - kind: para
    text: ある計算機言語を使って万能チューリングマシンを構成できるとき、その言語はチュー
  - kind: para
    text: リング完全であると呼ぶ
  p26:
  - kind: para
    text: 万能？
  p27:
  - kind: para
    text: ディスクにデータを書き込むと
  - kind: para
    text: か、現在の時刻を知るとか、TCPパケットを送るとか、そういう魔法のような機械のことは
  - kind: para
    text: 想定してない
  p28:
  - kind: para
    text: 簡単な言語
  p29:
  - kind: para
    text: Brainfuck
  p30:
  - kind: para
    text: < > + - . , [ ]言語仕様8命令だけ
  p31:
  - kind: para
    text: トークン意味
  - kind: para
    text: <ポインタを1進める
  - kind: para
    text: '>ポインタを1戻す'
  - kind: para
    text: +ポインタ位置の値を1加算
  - kind: para
    text: -ポインタ位置の値を1減算
  - kind: para
    text: .ポインタ位置に値を出力
  - kind: para
    text: ',1バイト読込ポインタ位置に代入'
  - kind: para
    text: '[ポインタ位置の値が0なら]にジャンプ'
  - kind: para
    text: ']ポインタ位置の値が0でなければ[にジャンプ'
  p32:
  - kind: para
    text: '>+++++++++[<++++++++>-]<.>+++++++[<++++>-]<+.+++++++..+++.[-]>++++++++[<++++>-]<.>+++++++++++[<+'
  - kind: para
    text: ++++>-]<.>++++++++[<+++>-]<.++
  - kind: para
    text: http://www.kmonos.net/alang/etc/brainfuck.php
  p33:
  - kind: para
    text: (神記事なのでゆっくり読んでほしい)
  p34:
  - kind: para
    text: Brainfuckは言語仕様
  - kind: para
    text: が非常に小さいので覚えるのは非常に簡単！
  p35:
  - kind: para
    text: 言語が簡単
  - kind: para
    text: '||その言語で書くのが簡単'
  p36:
  - kind: para
    text: そんなわけは
  - kind: para
    text: ない
  p37:
  - kind: para
    text: 言語の簡単さと人間の読み書きの容
  - kind: para
    text: 易さは一致しない
  p38:
  - kind: para
    text: 難解プログラミン
  - kind: para
    text: グ言語(Esolang)
  p39:
  - kind: para
    text: Brainfuckのようなへんてこ言語を
  - kind: para
    text: Esolangと呼ぶ
  - kind: para
    text: https://esolangs.org/wiki/Main_Page
  p40:
  - kind: para
    text: (Brainfuckは言語仕様は
  - kind: para
    text: 非常にわかりやすいが、
  - kind: para
    text: 異常に難解なEsolangも
  - kind: para
    text: 当然ある)
  p41:
  - kind: para
    text: 話を戻す
  p42:
  - kind: para
    text: Brainfuckはチューリング機械
  - kind: para
    text: と同等
  p43:
  - kind: para
    text: Brainfuckは万能チューリング機械
  p44:
  - kind: para
    text: Brainfuckはチューリング完全
  p45:
  - kind: para
    text: つまり
  p46:
  - kind: para
    text: Brainfuckを実装で
  - kind: para
    text: きる言語はチューリング完全
  p47:
  - kind: para
    text: PHPはチューリング完全かな？
  p48:
  - kind: para
    text: PHPを使ってBrainfuckを実装
  - kind: para
    text: してみよう
  p49:
  - kind: para
    text: ELVM
  p50:
  - kind: para
    text: ようやく話がここまできた
  p51:
  - kind: heading
    level: 1
    text: EsoLangVM
  - kind: para
    text: https://github.com/shinh/elvm
  p52:
  - kind: para
    text: Shinichiro Hamaji
  - kind: para
    text: さんが開発した
  - kind: para
    text: コンパイラ
  p53:
  - kind: para
    text: ELVMバイトコード
  - kind: para
    text: から任意の言語にコンパイルできる
  p54:
  - kind: para
    text: http://shinh.skr.jp/slide/elvm/009.html
  p55:
  - kind: para
    text: PHPターゲットが
  - kind: para
    text: なかったので追加しました
  p56:
  - kind: heading
    level: 1
    text: 2016年11月に
  - kind: para
    text: https://github.com/shinh/elvm/blob/master/target/php.c
  p57:
  - kind: para
    text: ご存じの通りJavaScriptはPHP
  - kind: para
    text: にそっくり！！
  p58:
  - kind: para
    text: JavaScriptをPHPっぽく直せばそれだけ
  - kind: para
    text: で動くはず
  p59:
  - kind: para
    text: そう思ってた頃が私にもありました
  p60:
  - kind: para
    text: なぜなのか
  p61:
  - kind: para
    text: JS版実装
  p62:
  - kind: para
    text: static void js_emit_func_prologue(int func_id) {emit_line("");emit_line("var
      func%d = function() {", func_id);inc_indent();emit_line("while (%d <= pc &&
      pc < %d && running) {",func_id * CHUNKED_FUNC_SIZE, (func_id + 1) *CHUNKED_FUNC_SIZE);inc_indent();
  p63:
  - kind: para
    text: func1, func2のよ
  - kind: para
    text: うな無名函数が
  - kind: para
    text: 作られる
  p64:
  - kind: para
    text: 'PHP Notice: Undefined variable: func0 in /Users/megurine/repo/elvm/out/00exit.eir.php
      on line 39'
  p65:
  - kind: para
    text: 変数束縛
  p66:
  - kind: para
    text: PHPは明示的に use($var) と書かないとレキシカルスコープを捕捉
  - kind: para
    text: できない
  p67:
  - kind: para
    text: ／(^o^)＼
  p68:
  - kind: para
    text: まあ解決策はな
  - kind: para
    text: くはないけど
  p69:
  - kind: para
    text: いちばん楽だったのは
  p70:
  - kind: para
    text: '|＼ __ ／ ﾋﾟｺｰﾝ＿ （ｍ） ＿ そうだ、goto'
  - kind: para
    text: '|ミ|／ ｀´ ＼(''A`)ノヽノヽくく'
  p71: []
  p72: []
  p73:
  - kind: para
    text: ネストが浅い！
  p74:
  - kind: para
    text: コールスタックが深くならない
  p75:
  - kind: para
    text: goto最高！
  p76:
  - kind: para
    text: 私からは異常
  - kind: para
    text: です
