text:
  p1:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: Language Update PHP
    - node: text
      content: Learn Language 2025pixiv Inc.
    - node: bold
      content: USAMI Kenta2025-09-05
  p2:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: お前誰よ
    - node: text
      content: 'うさみけんた / にゃんだーすわん●GitHub: @zonuexe○2012年11月から現職●ピクシブ株式会社 Platform
        Div PHPer●2012年末から現職、APIとかCIとかいろいろなとこ●最近はインフラっぽい仕事してます○'
    - node: bold
      content: tadsan
    - node: text
      content: Emacs PHP Modeを開発しています (2017年-)●
    - node: bold
      content: PHPer
    - node: text
      content: プログラミング言語にちょっとこだわりのある素人 ●(spcamp2010)2
  p3:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: みなさんご存じですね？
  p4:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: <?php
  p5:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: どのくらいご存じかは人による
    - node: text
      content: 2000年前後から世界中でWeb開発に活用されてきた●いわゆる動的型付けのスクリプト言語●とにかくいろいろな場面で使われてきた●Webアプリだけでなく汎用言語として多くのタスクをこなせる○現代で有名なのは「WordPress」「Laravel」「Wikipedia」●PHPが嫌いでもPHPを避けて生活するのが難しいくらい○5
  p6:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: PHP以前 (1990年代)
    - node: text
      content: 'Webアプリケーション ≒ CGI●必ずしもそうではないが、ほとんどはそうだったはず○例外：普通のやつらの上を行け Paul Graham:
        Common Lisp○CGIは任意の言語で書ける… '
    - node: bold
      content: が、
    - node: text
      content: ●Perl = パフォーマンスの問題○C言語 = メモリ安全に書くのが著しく難しい○シェルスクリプト = 非常に多くの課題がある○6
  p7:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: PHPは何を解決したか (1990年代前半)
    - node: text
      content: CGIではなくApacheのモジュールとして提供●現実にはレンタルサーバの権限の問題でCGIモードで運用も多い○HTMLと統合されたテンプレート言語●コードとHTMLの親子関係が逆転する○ライブラリではなく言語レベルでHTTPをサポートしている●他言語のCGIサポートはライブラリレベルなので、正しく使わない○とヘッダインジェクションのリスクがあった7
  p8:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: Webはどうなったか (2010年代)
    - node: text
      content: CGIではなくApacheのモジュールとして提供●CGIが廃れ、共用レンタルサーバの存在感が相対的に低下○HTMLと統合されたテンプレート言語●各言語でテンプレートライブラリが普及、使うのが当たり前○ライブラリではなく言語レベルでHTTPをサポートしている●CGIのような潜在的に危険なプロトコルが利用されなくなったの○で、フレームワークに乗って作る限り問題は起こらない8
  p9:
  - node: p
    children:
    - node: text
      content: '25409'
  p10:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: 他言語のWeb開発の断絶
    - node: text
      content: 'CGIはリクエストごとにプロセスを起動し、HTTPを標準入出力と環境変●数に置き換えるアーキテクチャなど考えず、シンプルな「スクリプト」でよかった○2000年代にインターフェイス／サーバ／アプリケーション分離の風潮●Python:
        WSGI, Ruby: Rack, Perl: PSGI○PHPはトレンドに乗らず、CGI／レンタルサーバも健在であり続けた●Apacheのmod_perl,
        mod_rubyも存在するが、主流にはならず○10'
  p11:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: グレートリセットが起こらなかったPHP
    - node: text
      content: Railsの普及により、Rubyでは事実上Railsに「標準化」された●Rack以前からあったRedmine, tDiaryなどはRackアプリケーション○に移行Python/Perlはフレームワークの寡占はないが、CGI世代と完全に断絶●PHPはLaravelが一般化しているが、フレームワークなしも混住●よくも悪くも2000年代始めの世界観を捨てきれていない○PHPにとっては「足枷」「便利ライブラリの集合」に過ぎない○11
  p12:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: 21世紀のCGI
  p13:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: 21世紀のSSI
  p14:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: そんな言語でも進化は続く
  p15:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: PHPの開発体制
    - node: text
      content: Request for Comments https://wiki.php.net/rfc●言語機能の改廃提案と投票プロセス、リリース周期が明文化○機能提案する人は仕様をまとめてMLで議論、実装も責任を持って用意●PHP原作者のRasmus
        Lardorfは開発者としての1票しか行使しない●PHP 7.0(2015年)以降、11月末〜12月初頭にリリースが定着●品質保障のためのfeature
        freeze、RC版なども定められた○15
  p16:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: The PHP Foundation
    - node: text
      content: PHPの著作権は「The PHP Group」という団体が持っている●2021年にPHPの継続的な開発を支援する財団が設立された●PHPのメイン開発者だったNikita
        Popovの引退が契機●各社からの協賛金を集め、数人のPHP「コア開発者」を雇っている●日本からは高町咲衣さんが参加 (PHP 8.4 リリースマネージャ)○16
  p17:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: PHPの言語仕様の進化
    - node: text
      content: 最新版はPHP 8.4 (2024年11月リリース)●PHPユーザーの多様性●開発文化 vs Web制作文化○基本的にはかなり保守的だが、有用な機能はじわじわ追加されている●PHP
        8.xで追加された構文を使えばかなり簡潔に書けることが多い○BC Breakは… そこそこある●基本的には「なぜこんなコードが動くんだ」という変なケースが潰○される17
  p18:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: '#[Attribute] (PHP 8.0)'
    - node: text
      content: PHPは歴史的にDoc commentにメタデータを書く文化が発達していた●リフレクションAPIで文字列を取得できる○構造化データは独自に構文解析する必要がある○#[Attribute]
        はPHPのシンタックスの一部としてパースされる●18
  p19:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: クラスの改善
    - node: text
      content: readonlyプロパティ (PHP 8.1)●readonlyクラス (PHP 8.2)●プロパティフック (PHP 8.4)●C#のプロパティと同じようにプロパティの読み込みと書き込みに○処理を書ける非対称プロパティ
        (PHP 8.4)●19
  p20:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: '#[Attribute] (PHP 8.0)'
    - node: text
      content: PHPは歴史的にDoc commentにメタデータを書く文化が発達していた●リフレクションAPIで文字列を取得できる○構造化データは独自に構文解析する必要がある○#[Attribute]
        はPHPのシンタックスの一部としてパースされる●誰もが使うというよりはフレームワークなどの機能として活用できる●20
  p21:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: match式 (PHP 8.0)
    - node: text
      content: 式バージョンのswitch●従来のswitch文の使いにくさが改善されている○残念ながら、高機能なパターンマッチ機能は未実装●21
  p22:
  - node: p
    children:
    - node: text
      content: '2540'
    - node: bold
      content: PHPのライセンス変更 (PHP 9.0?)
    - node: text
      content: 'PHP RFC: PHP License Update●本日時点ではまだ未確定だが、独自の '
    - node: bold
      content: PHP License
    - node: text
      content: ' からBSDライセンス●に移行する提案さまざまな歴史的経緯がまとめられていて読みごたえがある●22'
