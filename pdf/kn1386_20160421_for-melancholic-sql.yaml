  - kind: para
    text: '*/'
  - kind: para
    text: final class Board {
  - kind: para
    text: /**
  - kind: para
    text: '* @return Board[]'
  - kind: para
    text: '*/'
  - kind: para
    text: public static function findAll() {
  - kind: para
    text: $data = SQL\Query::execute(db(), self::findAll_query, [])
  - kind: para
    text: '->fetchAll(\PDO::FETCH_ASSOC) ?: [];'
  - kind: para
    text: $boards = [];
  - kind: para
    text: foreach ($data as $b) {
  - kind: para
    text: $boards[] = new Board($b);
  - kind: para
    text: '}'
  - kind: para
    text: return $boards;
  - kind: para
    text: '}'
  - kind: para
    text: const findAll_query = 'SELECT `id`, `name`, `text` FROM `boards`';
  - kind: para
    text: '}'
  p11:
  - kind: para
    text: use Teto\SQL;
  - kind: para
    text: public static function find($id) {
  - kind: para
    text: $data = SQL\Query::execute(db(), self::findAll_query, [
  - kind: para
    text: ''':id'' => $id,'
  - kind: para
    text: '])->fetchAll(\PDO::FETCH_ASSOC) ?: [];'
  - kind: para
    text: $boards = [];
  - kind: para
    text: foreach ($data as $b) {
  - kind: para
    text: $boards[] = new Board($b);
  - kind: para
    text: '}'
  - kind: para
    text: return $boards;
  - kind: para
    text: '}'
  - kind: para
    text: const find_query = ‘
  - kind: para
    text: SELECT `id`, `name`, `text` FROM `boards` WHERE `id` = $id@int
  - kind: para
    text: ''';'
  p12:
  - kind: heading
    level: 1
    text: 基本的なAPI
  - kind: list
    items:
    - どうにかしてPDOのコネクションをとっておく
    - $stmt = SQL\Query::execute($con, self::find_query,
  - kind: para
    text: '['':id'' => $id, '':hoge'' => $hoge] );'
  - kind: list
    items:
    - コネクション、SQL、アサインする値を渡す
    - 帰ってくる値はPDOStatementなので、
  - kind: para
    text: いつもの感覚でfetch/fetchAllするだけ！
  p13:
  - kind: heading
    level: 1
    text: const
  - kind: list
    items:
    - PHPのconstは(原則)実行時に変更されない
    - そこにパラメータを当て嵌めるだけ、なのは
  - kind: para
    text: なんとなく心理的な安心感がある (本当か?)
  - kind: list
    items:
    - お気付きだろうか…
    - このコードがPSR-1違反であることに…
