  p4:
  - kind: heading
    level: 1
    text: みんな大好きPDO
  - kind: list
    items:
    - PHP Data Objects
    - いろんなSQLを抽象化したオブジェクト
    - 学生がmysqli関数使ってたけどPDOでいい
    - あとなんか、Doctrineとか使った方がいいの?
  p5:
  - kind: heading
    level: 1
    text: Real World PHP
  - kind: list
    items:
    - 2015年にもなって徳丸先生がPHPカンファレン
  - kind: para
    text: スでSQLインジェクションの話をしてるリアル
  - kind: list
    items:
    - O/Rマッパー使っとけｗｗｗと煽ったところで、
  - kind: para
    text: 世界にはまだ文字列結合SQLが眠ってる
  p6:
  - kind: heading
    level: 1
    text: みんな事故る
  - kind: list
    items:
    - 文字列結合の温床
    - 型を指定するのはめんどくさい
    - $stmt->bindValue(':id', $id, \PDO::PARAM_INT)
    - 可変個数のIN句が地雷
  p7:
  - kind: heading
    level: 1
    text: Real World PHP
  - kind: para
    text: $names = ["taro","jiro","saburo"];
  - kind: para
    text: $str = implode(",", array_map($name){
  - kind: para
    text: return sprintf('"%s"', $name);
  - kind: para
    text: '});'
  - kind: para
    text: $sql = "SELECT * FROM users WHERE name IN ($str)";
  - kind: para
    text: // ↑典型的な漏れのあるロジックの例
  p8:
  - kind: heading
    level: 1
    text: PDOのラッパー作った
  - kind: list
    items:
    - 警告：ちゃんとしたO/Rマッパーの方がいい
    - (会社で同僚が作ったのを)コピペして再実装した
    - SQL内に型が書けるDSL
    - PDOに乗っかって、余計なことはしない
    - SQLインジェクションにある程度の耐性がある?
  p9:
  - kind: para
    text: composer require zonuexe/tetosql
  - kind: para
    text: https://github.com/BaguettePHP/TetoSQL
  p10:
