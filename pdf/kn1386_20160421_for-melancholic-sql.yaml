    - node: br
    - node: text
      content: '     */ '
    - node: br
    - node: text
      content: '    public static function findAll() { '
    - node: br
    - node: text
      content: '        $data = SQL\Query::execute(db(), self::findAll_query, []) '
    - node: br
    - node: text
      content: '            ->fetchAll(\PDO::FETCH_ASSOC) ?: []; '
  - node: p
    children:
    - node: text
      content: '        $boards = []; '
    - node: br
    - node: text
      content: '        foreach ($data as $b) { '
    - node: br
    - node: text
      content: '            $boards[] = new Board($b); '
    - node: br
    - node: text
      content: '        } '
  - node: p
    children:
    - node: text
      content: '        return $boards; '
    - node: br
    - node: text
      content: '    } '
    - node: br
    - node: text
      content: '    const findAll_query = ''SELECT `id`, `name`, `text` FROM `boards`''; '
    - node: br
    - node: text
      content: '}'
