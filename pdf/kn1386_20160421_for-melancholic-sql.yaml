    - スレッドフロート掲示板を作りたかった少年時
  - kind: para
    text: 代の代償行為として、モダンPHP、ただしフレームワーク抜きで書き始めました
  - kind: para
    text: http://qiita.com/tadsan/items/cdbbb5b08591af2b110d
  p4:
  - kind: heading
    level: 1
    text: みんな大好きPDO
  - kind: list
    items:
    - PHP Data Objects
    - いろんなSQLを抽象化したオブジェクト
    - 学生がmysqli関数使ってたけどPDOでいい
    - あとなんか、Doctrineとか使った方がいいの?
  p5:
  - kind: heading
    level: 1
    text: Real World PHP
  - kind: list
    items:
    - 2015年にもなって徳丸先生がPHPカンファレン
  - kind: para
    text: スでSQLインジェクションの話をしてるリアル
  - kind: list
    items:
    - O/Rマッパー使っとけｗｗｗと煽ったところで、
  - kind: para
    text: 世界にはまだ文字列結合SQLが眠ってる
  p6:
  - kind: heading
    level: 1
    text: みんな事故る
  - kind: list
    items:
    - 文字列結合の温床
    - 型を指定するのはめんどくさい
    - $stmt->bindValue(':id', $id, \PDO::PARAM_INT)
    - 可変個数のIN句が地雷
  p7:
  - kind: heading
    level: 1
    text: Real World PHP
  - kind: para
    text: $names = ["taro","jiro","saburo"];$str = implode(",", array_map($name){return
      sprintf('"%s"', $name);});$sql = "SELECT * FROM users WHERE name IN ($str)";
  - kind: para
    text: // ↑典型的な漏れのあるロジックの例
  p8:
  - kind: heading
    level: 1
    text: PDOのラッパー作った
  - kind: list
    items:
    - 警告：ちゃんとしたO/Rマッパーの方がいい
    - (会社で同僚が作ったのを)コピペして再実装した
    - SQL内に型が書けるDSL
    - PDOに乗っかって、余計なことはしない
    - SQLインジェクションにある程度の耐性がある?
  p9:
  - kind: para
    text: composer require zonuexe/tetosql
  - kind: para
    text: https://github.com/BaguettePHP/TetoSQL
  p10:
  - kind: para
    text: <?php namespace InspireBBS\Model;use Teto\SQL;
  - kind: para
    text: '/*** 板を表現するモデル* @copyright 2016 USAMI Kenta* @license WTFPL*/final class
      Board {/*** @return Board[]*/public static function findAll() {$data = SQL\Query::execute(db(),
      self::findAll_query, [])->fetchAll(\PDO::FETCH_ASSOC) ?: [];'
  - kind: para
    text: $boards = [];foreach ($data as $b) {$boards[] = new Board($b);}
  - kind: para
    text: return $boards;}const findAll_query = 'SELECT `id`, `name`, `text` FROM
      `boards`';}
  p11:
  - kind: para
    text: 'use Teto\SQL;public static function find($id) {$data = SQL\Query::execute(db(),
      self::findAll_query, ['':id'' => $id,])->fetchAll(\PDO::FETCH_ASSOC) ?: [];'
  - kind: para
    text: $boards = [];foreach ($data as $b) {$boards[] = new Board($b);}
  - kind: para
    text: return $boards;}const find_query = ‘SELECT `id`, `name`, `text` FROM `boards`
      WHERE `id` = $id@int';
  p12:
  - kind: heading
    level: 1
    text: 基本的なAPI
  - kind: list
    items:
    - どうにかしてPDOのコネクションをとっておく
    - $stmt = SQL\Query::execute($con, self::find_query,
  - kind: para
    text: '['':id'' => $id, '':hoge'' => $hoge] );'
  - kind: list
    items:
    - コネクション、SQL、アサインする値を渡す
    - 帰ってくる値はPDOStatementなので、
  - kind: para
    text: いつもの感覚でfetch/fetchAllするだけ！
  p13:
  - kind: heading
    level: 1
    text: const
  - kind: list
    items:
    - PHPのconstは(原則)実行時に変更されない
    - そこにパラメータを当て嵌めるだけ、なのは
  - kind: para
    text: なんとなく心理的な安心感がある (本当か?)
  - kind: list
    items:
    - お気付きだろうか…
    - このコードがPSR-1違反であることに…
