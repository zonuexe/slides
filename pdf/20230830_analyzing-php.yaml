  p26:
  - node: p
    children:
    - node: text
      content: 言語としてのPHP
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: よくあるC言語風の制御構文と標準関数をもったスクリプト言語
      - node: ul
        children:
        - node: li
