      '</ul>';
  p13:
  - kind: heading
    level: 1
    text: C
  - kind: para
    text: <?php declare(strict_types=1);namespace Foo\Http\Controller;
  - kind: para
    text: class BooksController extends BaseController {public function index() {$books
      = Books::getAll();
  - kind: para
    text: $this->render(compact("books"));}}
  p14:
  - kind: heading
    level: 2
    text: P H P の原作者
  - kind: heading
    level: 1
    text: ラスマスかく語りき
  p15:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “We have things like protected properties.We have abstract methods. We have
      all this stuff that your computer science teacher told you you should be using.I
      don't care about this crap at all.”–Rasmus Lerdorf https://en.wikiquote.org/wiki/Rasmus_Lerdorf
  p16:
  - kind: heading
    level: 1
    text: 2007年 MySQL Conference
  - kind: para
    text: “PHPにはprotectedプロパティも抽象メソッドもありますよ。計算機科学の教授が「使え」と言ってるものは全部。そんなことはクソ興味ないですけど”–Rasmus
      Lerdorf (tadsanによる超訳)
  p17:
  - kind: para
    text: 変数に$があってPerlっぽくて
  p18:
  - kind: para
    text: C言語っぽい関数と-> があって
  p19:
  - kind: para
    text: 雰囲気Javaっぽいオブジェクト指向で
  p20:
  - kind: heading
    level: 1
    text: PHPは見る人の心を映す
  p21:
  - kind: heading
    level: 1
    text: 整理しましょう
  p22:
  - kind: heading
    level: 1
    text: PHPは汎用プログラミング言語
  - kind: list
    items:
    - PHPはHTTP(≒Webサービス)を言語レベルでサポートしている
    - ほかの言語ではCGIライブラリとしてサポートしている機能が組み込み
    - 各Webサーバとの連携はSAPI(Server API)として定義されている
    - どのサーバー上でもCGI風の動作をする
    - コマンドラインスクリプトとして実行するモード(CLI)もSAPIのひとつ
  p23:
  - kind: heading
    level: 1
    text: Perl
  - kind: para
    text: use DBI;
  - kind: para
    text: $db = DBI->connect('...');$stmt = $db->prepare('SELECT * FROM books');$stmt->execute;print
      '<h1>本の一覧</h1>'; print '<ul>';for ($i = 0; $I < $sth->rows; $i++) {@row = $sth->fetchrow_array;print
      '<li>'; print $row[0]; print '</li>';}print '</ul>';
  p24:
  - kind: heading
    level: 1
    text: B = CGIスタイル
  - kind: para
    text: <?php require 'bootstrap.php';$db = mysqli_connect();$stmt = mysqli_prepare($db,
      'SELECT * FROM books');mysqli_stmt_execute($stmt);print '<h1>本の一覧</h1>';print
      '<ul>';foreach ($stmt as $s) {print '<li>'; print $s->name; print '</li>';}print
      '</ul>';
  p25:
  - kind: heading
    level: 1
    text: 現在でも動くCGI
  p26:
  - kind: para
    text: 言語としてのPHP
  - kind: list
    items:
    - よくあるC言語風の制御構文と標準関数をもったスクリプト言語
    - if, else, switch, while, for, goto
    - PHPのgotoは綺麗なgoto
    - 関数定義、クラス定義(class, interface, trait, enum)
    - クラスや関数の再定義(オープンクラス・モンキーパッチ)はできない
  p27:
  - kind: para
    text: PHPの実行フロー
  - kind: list
    items:
    - いわゆるVM(仮想機械)型のインタプリタ
    - RubyをはじめPerl, Pythonなど現代的な言語は基本的にこれ
    - 字句解析→構文解析→オペコードコンパイル
  p28: []
  p29:
  - kind: heading
    level: 1
    text: 仮想機械？
  p30: []
  p31: []
  p32:
  - kind: heading
    level: 1
    text: I am CPU.
  p33:
  - kind: heading
    level: 1
    text: つまり？
  p34:
  - kind: para
    text: 自分のことをCPUだと思い込んだ象
  p35:
  - kind: heading
    level: 1
    text: CPUの言葉でしゃべれ
  p36:
  - kind: heading
    level: 1
    text: Zend Engine
  - kind: para
    text: オペコード
  - kind: heading
    level: 1
    text: opcode
  p37:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: echo 1;
  - kind: para
    text: ECHO 1
  p38:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: echo 'foo';
  - kind: para
    text: ECHO 'foo'
  p39:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: print 'foo';
  - kind: para
    text: ECHO 'foo'
  p40:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php
  - kind: para
    text: echo 1 + 2;
  - kind: para
    text: ECHO 3
  p41:
  - kind: heading
    level: 1
    text: PHPはオペコードにコンパイルされる
  - kind: para
    text: <?php$a = 1;echo $a + 2;
  - kind: para
    text: ASSIGN !0, 1 ADD ~2 !0, 2 ECHO ~2
  p42:
  - kind: para
    text: opcodeでおｋ
  - kind: para
    text: <?php echo "foo";
  - kind: para
    text: ECHO 'foo'
  p43:
  - kind: para
    text: なんでこんなことするの
  p44:
  - kind: para
    text: PHP高度な構文解析が必要な高級なシンタックス
  p45:
  - kind: para
    text: opcode構文解析不要なシンプルな命令セット
  p46:
  - kind: para
    text: 分けて開発することで最適化しやすくなる
  p47:
  - kind: para
    text: PHPと型宣言
  - kind: list
    items:
    - いわゆる動的型付け(dynamic typing)のランタイム
    - 関数やプロパティ定義構文に型宣言があり、構文上で宣言されたものは
  - kind: para
    text: 実行時に確実にその型であることが保障される
  - kind: list
    items:
    - ただし array などのコンテナは中に何が入っているか明示できない
    - 現状では変数には型がない (なんでも入る)
  p48:
  - kind: para
    text: PHPとDocComment型注釈
  - kind: list
    items:
    - クラスや関数定義の真上のコメント内 /** ... */に型について注釈を書く
    - もちろんコメントなのでPHP実行中には解釈されないが、
  - kind: para
    text: PhpStormのようなIDEや静的解析ツールなどが参照してくれる
  - kind: list
    items:
    - 'array<Book> や array{name: string} のようにランタイムでは'
  - kind: para
    text: 保障されない型が書ける
  p49:
  - kind: para
    text: 静的解析しやすい特徴
  - kind: list
    items:
    - クラスや関数が再定義されることは基本的にない
    - Java風のクラス継承(class, interface)
    - 関数呼び出しは全て () がつく、文末は必ず ;
  p50:
  - kind: para
    text: PHPの進化は型宣言の進化
  p51:
  - kind: para
    text: いまやPHPは静的型付きと言っても過言ではない(本当か…？)
  p52:
  - kind: heading
    level: 1
    text: 型がついていない関数(PHP5)
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p53:
  - kind: heading
    level: 1
    text: スカラー型宣言(PHP7)
  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p54:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にfloatを強制するのか
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p55:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p56:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p57:
  - kind: heading
    level: 1
    text: LL言語としてのPHP vs エディタ
  - kind: list
    items:
    - 2000年代のCGIやLL言語(Lightweight Language)という用語が
  - kind: para
    text: よく使われていた頃は「重厚鈍重なIDEが必要な言語」のアンチテーゼとしてシンプルなスクリプト言語とエディタが好まれていた (ように思う)
  - kind: list
    items:
    - 時は流れ、Webアプリケーションは巨大になり、ファイルは増え、シンプルなエ
  - kind: para
    text: ディタでは開発のオーバーヘッドが無視しがたくなってきた
  - kind: list
    items:
    - PhpStorm(JetBrains社のIDE)が静的解析とインテリジェントな編集機能
  - kind: para
    text: を提供してくれるようになった
  p58:
  - kind: para
    text: PHPと静的解析
  - kind: list
    items:
    - PHP組み込みで提供されているのは php -l (syntax check) のみ
    - 「静的解析ツール」と呼ばれうるものは2000年代からあった
    - ドキュメント生成、コーディングスタイルのチェック
    - 2010年代後半になってPhpStormの普及を呼び水にして、
  - kind: para
    text: 型システムや変数スコープを正確に扱えるツールが開発され始めた
  p59:
  - kind: heading
    level: 1
    text: PHP Static Analysis Tool
  p60:
  - kind: para
    text: PHPStanとは
  - kind: list
    items:
    - 2016年から開発されているPHPの静的解析ツール
    - Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
  - kind: para
    text: 高速な解析を実現していた
  - kind: list
    items:
    - 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p61:
  - kind: para
    text: PHPStanの提供する型
  - kind: list
    items:
    - PHPの組み込み型、クラス名、インターフェイス名
    - '修飾型: non-empty-string, non-empty-array'
    - 'ユニオン型: A|B'
    - 'ジェネリクス: array<T>, ArrayObject<T>'
    - '定数型: 123, "foo", Foo::BAR'
  p62:
  - kind: para
    text: PHP処理系
  - kind: list
    items:
    - 'ソースコード: https://github.com/php/php-src'
    - 処理系のソースコードはC言語で書かれている(一部のみC++)
    - パーサーはYacc(Bison)で記述されている
    - 基礎知識は『Rubyソースコード完全解説』の知識が役に立つ
    - 議論はメーリングリストがメインだが、GitHub issueやPull Requestも
  - kind: para
    text: 受け付けてくれる
  p63:
  - kind: para
    text: PHPの開発体制
  - kind: list
    items:
    - Request for Comments https://wiki.php.net/rfc
    - 言語機能の改廃提案と投票プロセス、リリース周期が明文化
    - 機能提案する人は仕様をまとめてMLで議論、実装も責任を持って用意する
    - PHP原作者のRasmus Lardorfは開発者としての1票しか行使しない
    - PHP 7.0(2015年)以降、11月末〜12月初頭にリリースが定着
    - 品質保障のためのfeature freeze、RC版なども定められた
  p64:
  - kind: para
    text: EmacsとPHP
  - kind: list
    items:
    - 実はEmacsは標準でPHP編集機能を持っていない
    - サードパーティパッケージとしてPHP Modeを開発している
    - Emacsが提供するCc Modeという機能を基盤にしている
    - 「Cっぽい言語」をサポートするための巨大なフレームワークのようなもの
    - ほかの言語にある機能はキーワードを設定するだけ
    - ない機能は… 地道にサポートするしかない
  p65:
  - kind: heading
    level: 1
    text: Emacs PHP Modeのサポート範囲
  - kind: list
    items:
    - HTMLテンプレートのようなPHPコードはサポートしていない
    - 表示できない、まともにインデントできない
    - C言語族用のフレームワークがベースになっているため
    - 別のHTMLテンプレート用のモードを使うことを推奨
  p66:
  - kind: heading
    level: 1
    text: php-modeの未解決issue
  p67:
  - kind: para
    text: 最近のEmacs
  - kind: list
    items:
    - Emacs 29でLSPクライアントとTree-sitterが統合されるようになった
    - 既にいくつかの言語についてTree-sitterベースの編集モードが同梱
    - Tree-sitterはエラー耐性のあるincremental parsing library
    - 言語ごとのtreesitter-xxxのようなライブラリをインストールする必要
  p68:
  - kind: para
    text: php-ts-mode
  - kind: list
    items:
    - Emacs本体に同梱をされることを目標に開発中のパッケージ
    - tree-sitter-phpが提供してくれる構文木をベースに色付け・インデント
    - ライブラリをロードしたら簡単に提供できる… かと思ったが、
  - kind: para
    text: それほど簡単ではなかった
  - kind: list
    items:
    - 既存のphp-modeとの相互運用や基本的な問題を解決して、
  - kind: para
    text: 9月後半にリリースすることを目標に準備しています
