  p47:
  - node: p
    children:
    - node: text
      content: PHPと型宣言
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: いわゆる動的型付け(dynamic typing)のランタイム
    - node: li
      children:
      - node: text
        content: 関数やプロパティ定義構文に型宣言があり、構文上で宣言されたものは
      - node: br
      - node: text
        content: '実行時に確実にその型であることが保障される '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ただし array などのコンテナは中に何が入っているか明示できない
    - node: li
      children:
      - node: text
        content: 現状では変数には型がない (なんでも入る)
  p48:
  - node: p
    children:
    - node: text
      content: PHPとDocComment型注釈
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: クラスや関数定義の真上のコメント内 /** ... */に型について注釈を書く
    - node: li
      children:
      - node: text
        content: もちろんコメントなのでPHP実行中には解釈されないが、
      - node: br
      - node: text
        content: 'PhpStormのようなIDEや静的解析ツールなどが参照してくれる '
    - node: li
      children:
      - node: text
        content: 'array<Book> や array{name: string} のようにランタイムでは'
      - node: br
      - node: text
        content: 保障されない型が書ける
  p49:
  - node: p
    children:
    - node: text
      content: 静的解析しやすい特徴
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: クラスや関数が再定義されることは基本的にない
    - node: li
      children:
      - node: text
        content: Java風のクラス継承(class, interface)
    - node: li
      children:
      - node: text
        content: 関数呼び出しは全て () がつく、文末は必ず ;
  p50:
  - node: p
    children:
    - node: text
      content: PHPの進化は 型宣言の進化
  p51:
  - node: p
    children:
    - node: text
      content: 'いまやPHPは '
    - node: br
    - node: text
      content: 静的型付きと言っても
    - node: br
    - node: text
      content: '過言ではない '
    - node: br
    - node: text
      content: (本当か…？)
  p52:
  - node: p
    children:
    - node: text
      content: 型がついていない関数(PHP5)
  - node: p
    children:
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p53:
  - node: p
    children:
    - node: text
      content: スカラー型宣言(PHP7)
  - node: p
    children:
    - node: text
      content: 'int + intって '
    - node: br
    - node: text
      content: 本当にintなの？
  - node: p
    children:
    - node: text
      content: 'function add(int $a, int $b): int {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p54:
  - node: p
    children:
    - node: text
      content: 広い値をとるにはﬂoatが必要
  - node: p
    children:
    - node: text
      content: 'ひとつの解決策では '
    - node: br
    - node: text
      content: あるが… 不必要に5oat
    - node: br
    - node: text
      content: を強制するのか
  - node: p
    children:
    - node: text
      content: 'function add(float $a, float $b): float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p55:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈
  - node: p
    children:
    - node: text
      content: (アノテーション)
  - node: p
    children:
    - node: text
