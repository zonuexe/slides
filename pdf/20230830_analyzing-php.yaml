      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: どのサーバー上でもCGI風の動作をする
        - node: li
          children:
          - node: text
            content: コマンドラインスクリプトとして実行するモード(CLI)もSAPIのひとつ
