          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: PHPのgotoは綺麗なgoto
    - node: li
      children:
      - node: text
        content: 関数定義、クラス定義(class, interface, trait, enum)
    - node: li
      children:
      - node: text
        content: クラスや関数の再定義(オープンクラス・モンキーパッチ)はできない
  p27:
  - node: p
    children:
    - node: text
