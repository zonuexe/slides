  - node: p
    children:
    - node: text
      content: あえて型宣言を省略する
  - node: p
    children:
    - node: text
      content: ' * @param int|float $b'
    - node: br
    - node: text
      content: ' * @return int|float'
    - node: br
    - node: text
      content: ' */         '
    - node: br
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p56:
  - node: p
    children:
    - node: text
      content: ユニオン型宣言 (PHP8.0)
  - node: p
    children:
    - node: text
      content: 'function add(int|float $a, int|float $b): int|float {'
    - node: br
