    - node: br
    - node: text
      content: '}'
  p57:
  - node: p
    children:
    - node: text
      content: LL言語としてのPHP vs エディタ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2000年代のCGIやLL言語(Lightweight Language)という用語が
      - node: br
      - node: text
        content: よく使われていた頃は「重厚鈍重なIDEが必要な言語」のアンチテーゼとして
      - node: br
      - node: text
        content: 'シンプルなスクリプト言語とエディタが好まれていた (ように思う) '
    - node: li
      children:
      - node: text
        content: 時は流れ、Webアプリケーションは巨大になり、ファイルは増え、シンプルなエ
      - node: br
      - node: text
        content: 'ディタでは開発のオーバーヘッドが無視しがたくなってきた '
    - node: li
      children:
      - node: text
        content: PhpStorm(JetBrains社のIDE)が静的解析とインテリジェントな編集機能
      - node: br
      - node: text
        content: を提供してくれるようになった
  p58:
  - node: p
    children:
    - node: text
      content: PHPと静的解析
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHP組み込みで提供されているのは php -l (syntax check) のみ
    - node: li
      children:
      - node: text
        content: 「静的解析ツール」と呼ばれうるものは2000年代からあった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ドキュメント生成、コーディングスタイルのチェック
    - node: li
      children:
      - node: text
        content: 2010年代後半になってPhpStormの普及を呼び水にして、
      - node: br
      - node: text
        content: 型システムや変数スコープを正確に扱えるツールが開発され始めた
  p59:
  - node: p
    children:
    - node: text
      content: PHP Static Analysis Tool
  p60:
  - node: p
    children:
    - node: text
      content: PHPStanとは
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2016年から開発されているPHPの静的解析ツール
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - node: li
      children:
      - node: text
        content: 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
      - node: br
      - node: text
        content: '高速な解析を実現していた '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - node: li
      children:
      - node: text
        content: その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p61:
  - node: p
    children:
    - node: text
      content: PHPStanの提供する型
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: PHPの組み込み型、クラス名、インターフェイス名
    - node: li
      children:
      - node: text
        content: '修飾型: non-empty-string, non-empty-array'
    - node: li
      children:
      - node: text
        content: 'ユニオン型: A|B'
    - node: li
      children:
      - node: text
        content: 'ジェネリクス: array<T>, ArrayObject<T>'
    - node: li
      children:
      - node: text
        content: '定数型: 123, "foo", Foo::BAR'
  p62:
  - node: p
    children:
    - node: text
      content: PHP処理系
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'ソースコード: https://github.com/php/php-src'
    - node: li
      children:
      - node: text
        content: 処理系のソースコードはC言語で書かれている(一部のみC++)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: パーサーはYacc(Bison)で記述されている
        - node: li
          children:
          - node: text
            content: 基礎知識は『Rubyソースコード完全解説』の知識が役に立つ
    - node: li
      children:
      - node: text
        content: 議論はメーリングリストがメインだが、GitHub issueやPull Requestも
      - node: br
      - node: text
        content: 受け付けてくれる
  p63:
  - node: p
    children:
    - node: text
      content: PHPの開発体制
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Request for Comments https://wiki.php.net/rfc
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 言語機能の改廃提案と投票プロセス、リリース周期が明文化
    - node: li
      children:
      - node: text
        content: 機能提案する人は仕様をまとめてMLで議論、実装も責任を持って用意する
    - node: li
      children:
      - node: text
        content: PHP原作者のRasmus Lardorfは開発者としての1票しか行使しない
    - node: li
      children:
      - node: text
        content: PHP 7.0(2015年)以降、11月末〜12月初頭にリリースが定着
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 品質保障のためのfeature freeze、RC版なども定められた
  p64:
  - node: p
    children:
    - node: text
      content: EmacsとPHP
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 実はEmacsは標準でPHP編集機能を持っていない
    - node: li
      children:
      - node: text
        content: サードパーティパッケージとしてPHP Modeを開発している
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacsが提供するCc Modeという機能を基盤にしている
        - node: li
          children:
          - node: text
            content: 「Cっぽい言語」をサポートするための巨大なフレームワークのようなもの
    - node: li
      children:
      - node: text
        content: ほかの言語にある機能はキーワードを設定するだけ
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ない機能は… 地道にサポートするしかない
  p65:
  - node: p
    children:
    - node: text
      content: Emacs PHP Modeのサポート範囲
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: HTMLテンプレートのようなPHPコードはサポートしていない
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 表示できない、まともにインデントできない
          - node: ul
            children:
            - node: li
              children:
              - node: text
                content: C言語族用のフレームワークがベースになっているため
        - node: li
          children:
          - node: text
            content: 別のHTMLテンプレート用のモードを使うことを推奨
  p66:
  - node: p
    children:
    - node: text
      content: php-modeの未解決issue
  p67:
  - node: p
    children:
    - node: text
      content: 最近のEmacs
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Emacs 29でLSPクライアントとTree-sitterが統合されるようになった
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 既にいくつかの言語についてTree-sitterベースの編集モードが同梱
    - node: li
      children:
      - node: text
        content: Tree-sitterはエラー耐性のあるincremental parsing library
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 言語ごとのtreesitter-xxxのようなライブラリをインストールする必要
  p68:
  - node: p
    children:
    - node: text
      content: php-ts-mode
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Emacs本体に同梱をされることを目標に開発中のパッケージ
    - node: li
      children:
      - node: text
        content: tree-sitter-phpが提供してくれる構文木をベースに色付け・インデント
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ライブラリをロードしたら簡単に提供できる… かと思ったが、
          - node: br
          - node: text
            content: 'それほど簡単ではなかった '
    - node: li
      children:
      - node: text
        content: 既存のphp-modeとの相互運用や基本的な問題を解決して、
      - node: br
      - node: text
        content: 9月後半にリリースすることを目標に準備しています
