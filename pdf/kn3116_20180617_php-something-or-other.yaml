    children:
    - node: text
      content: 経緯
  p9:
  - node: p
    children:
    - node: text
      content: '         PhpStormが正式な綴り'
  p10:
  - node: p
    children:
    - node: text
      content: '         PHP-STORMでもphpStormでもない'
  p11:
  - node: p
    children:
    - node: text
      content: '         ちなみにCLIのコマンドはpstorm'
  p12:
  - node: p
    children:
    - node: text
      content: ところで
  p13:
  - node: p
    children:
    - node: text
      content: 'PHP関係のツールや         ライブラリには「PHPなんとか」が異常に多い'
  p14:
  - node: p
    children:
    - node: text
      content: 便乗
  p16:
  - node: p
    children:
    - node: text
      content: phpunit phpspec phpstan phpstorm phpbrew phpmd phpactor phpcs phpparser
        phploc phpdbg phptal phpdi phpdocumentor phpmetrics phpmode phpdox phpbench
  p17:
  - node: p
    children:
    - node: text
      content: 傾向
  p18:
  - node: p
    children:
    - node: text
      content: '         大文字・小文字         PHPの後         - スペースありなし         - ハイフン／アンダーバー… etc.'
  p19:
  - node: p
    children:
    - node: text
      content: よし、見ていくぞ
  p20:
  - node: p
    children:
    - node: text
      content: '         1. PHPUnit         PHP大文字         PHP後スペースなしUだけ大文字'
  p22:
  - node: p
    children:
    - node: text
      content: '         2. phpspec         PHP小文字         PHP後スペースなしspecも小文字'
  p24:
  - node: p
    children:
    - node: text
      content: '         2. phpspec         PHP小文字         PHP後スペースなしspecも小文字'
