text:
  p1:
  - kind: para
    text: Awesome “PHP-xxx”s.
  - kind: heading
    level: 1
    text: すごい「PHPなんとか」列伝
  - kind: para
    text: '2018-06-18 #phpconfuk PHPカンファレンス福岡2018懇親会LT'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4:
  - kind: para
    text: We are hiring!
  p5:
  - kind: para
    text: 前回のあらすじ
  p6: []
  p7:
  - kind: para
    text: 経緯
  p8: []
  p9:
  - kind: para
    text: PhpStormが
  - kind: para
    text: 正式な綴り
  p10:
  - kind: para
    text: PHP-STORMでもphpStormでもない
  p11:
  - kind: para
    text: ちなみにCLIのコマンドはpstorm
  p12:
  - kind: para
    text: ところで
  p13:
  - kind: para
    text: PHP関係のツールやライブラリには「PHPなんとか」が異常に多い
  p14:
  - kind: para
    text: 便乗
  p15: []
  p16:
  - kind: para
    text: phpunit phpspec phpstan phpstorm phpbrew phpmd phpactor phpcs phpparser
      phploc phpdbg phptal phpdi phpdocumentor phpmetrics
  - kind: para
    text: phpmode phpdox phpbench
  p17:
  - kind: para
    text: 傾向
  p18:
  - kind: para
    text: 大文字・小文字PHPの後- スペースありなし- ハイフン／アンダーバー… etc.
  p19:
  - kind: para
    text: よし、見ていくぞ
  p20:
  - kind: para
    text: 1. PHPUnit PHP大文字PHP後スペースなしUだけ大文字
  p21: []
  p22:
  - kind: para
    text: 2. phpspec PHP小文字PHP後スペースなしspecも小文字
  p23: []
  p24:
  - kind: para
    text: 2. phpspec PHP小文字PHP後スペースなしspecも小文字
  p25:
  - kind: para
    text: スライドを作るのがだるい
  p26:
  - kind: para
    text: 続きはTwitterで
  p27:
  - kind: para
    text: まとめ
  p28:
  - kind: para
    text: phpxx/phpxxみたいなパッケージ名だと、なんかコミュニティで開発されててすごそう感がある
  p29:
  - kind: para
    text: 安易なPHPxxx
  - kind: para
    text: 多すぎでは…
  p30:
  - kind: para
    text: 脆弱性で悪評を高めたPHPMailerとかもありましたね
  p31:
  - kind: para
    text: みなさんは名前とDL数だけでライブラリを選定したりしませんよね？？
