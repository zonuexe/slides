  p2:
  - node: p
    children:
    - node: text
      content: 'お前誰ようさみけんた (@tadsan) / Zonu.EXE

        '
    - node: text
      content: 'GitHub/Packagistでは id: zonuexe

        •ピクシブ株式会社 pixiv運営本部

        •Emacs Lisper, PHPer

        •Emacs PHP Modeのメンテナ引き継ぎました

        •好きなリスプはEmacs Lispです

        •Qiitaに記事を書いたり変なコメントしてるよ•'
  p4:
  - node: p
    children:
    - node: text
      content: We are hiring!
  p5:
  - node: p
    children:
    - node: bold
      content: '         '
    - node: text
      content: 前回のあらすじ
  p7:
