    text: https://gist.github.com/zonuexe/a513afd1d6933b3cc5cca0eb866f2834
  p65:
  - kind: para
    text: ファイルが数十個単位ならす
  - kind: para
    text: ぐに終るが、数千単位になる
  - kind: para
    text: と全数の検査はかなり
  - kind: para
    text: 時間が掛かるので注意
  p66:
  - kind: para
    text: 弊社での事例に
  - kind: para
    text: ついて
  p67: []
  p68:
  - kind: para
    text: ファイル数 6264
  - kind: para
    text: 行数 974419
  p69:
  - kind: para
    text: 毎回全ファイルを
  - kind: para
    text: チェックするのは
  - kind: para
    text: さすがにつらい
  p70:
  - kind: para
    text: デプロイ時に常にgit tagをつける
  - kind: para
    text: デプロイスクリプトで、
  - kind: para
    text: デプロイ成功したら日時と作
  - kind: para
    text: 業者名を含むタグを生成して
  - kind: para
    text: originにpushする
  p71:
  - kind: para
    text: 最新のリリースタグとの差分をとる
  - kind: para
    text: これで最新デプロイと手元の
  - kind: para
    text: 差分があるファイル抽出できる
  p72:
  - kind: para
    text: デプロイ時にphp -lを行う
  - kind: para
    text: 差分のあるファイル全部に対し
  - kind: para
    text: てチェックを実施し、一つでも
  - kind: para
    text: エラーのファイルがあったらデ
  - kind: para
    text: プロイ処理を中断する
  - kind: para
    text: 中断されるとtagはつかないの
  - kind: para
    text: で、差分が隠れることはない
  p73:
  - kind: para
    text: MergeRequestと二種類のビルド
  - kind: para
    text: PHPUnit
  - kind: para
    text: PHPStanおよび独自Linter
  - kind: para
    text: それぞれ実行時間は1分ちょっと
  p74:
  - kind: para
    text: PHPStan
  - kind: para
    text: PHPStan本運用のためbootstrap
  - kind: para
    text: 処理の軽いリファクタリングをした
  - kind: para
    text: _autoloader_for_static_analysis.php
  - kind: para
    text: この作業によってPhpactorと
  - kind: para
    text: いう別ツールも利用可能に
  p75:
  - kind: para
    text: PHPUnit
  - kind: para
    text: 直列実行で10分前後かかっていた
  - kind: para
    text: テストが依存するMySQLを複数起
  - kind: para
    text: 動し、PHPUnitのプロセスを並列
  - kind: para
    text: 実行することで1分程度で完了
  p76:
  - kind: para
    text: masterブランチへのテスト
  - kind: para
    text: MRのテストを無視してmaster
  - kind: para
    text: にマージされたときの防波堤
  - kind: para
    text: この段階で失敗したテストは
  - kind: para
    text: Slackで報告される
  - kind: para
    text: 時刻に依存したテストのランダ
  - kind: para
    text: ムフェイルがたまに報告される
  p77:
  - kind: para
    text: 実行環境
  - kind: para
    text: GitLab CI + Jenkins
  - kind: para
    text: 以前はPHPStanの警告はGitLab
  - kind: para
    text: のMRへのコメントで報告
  - kind: para
    text: 現在はCI実行はAWSまたは
  - kind: para
    text: Jenkinsで、それぞれの結果を
  - kind: para
    text: GitLabのパイプラインに統合
  p78:
  - kind: para
    text: まとめ
  p79:
  - kind: para
    text: どのようなCIを導入するか
  - kind: para
    text: プロジェクトの現状・性質による
  - kind: para
    text: テストが書ける密結合度か
  - kind: para
    text: 定義ファイルは分離されてるか
  - kind: para
    text: (同名の関数や定数が複数定義
  - kind: para
    text: されてるとはまる)
  p80:
  - kind: para
    text: 発表時に書き
  - kind: para
    text: そびれたこと
  p81:
  - kind: para
    text: 小姑CI
  - kind: para
    text: コーディングスタイルのような重
  - kind: para
    text: 箱の隅は人間がコードレビューで
  - kind: para
    text: 小うるさく責めるより、Botが鉄の
  - kind: para
    text: 心で指摘した方が角が立たない
  - kind: para
    text: PHP-CS-Fixerやphpcbfのよう
  - kind: para
    text: なコマンド一撃で修正されるよう
  - kind: para
    text: にすれば手間もかからない
  p82:
  - kind: para
    text: どんな場合も静的解析を導入すべきか
  - kind: para
    text: 普通の既存プロジェクトをPHPStan
  - kind: para
    text: やPhanで解析すると異常な量の
  - kind: para
    text: 型の不整合の警告が出るのが普通
  - kind: para
    text: 多すぎる警告を目のあたりにする
  - kind: para
    text: と、人間は無力感に苛まれる
  - kind: para
    text: (学習性無力感)
  p83:
  - kind: para
    text: 警告を深刻に受け止めない
  - kind: para
    text: そのプロダクトが実際は動いてる
  - kind: para
    text: のであれば、現状をあまり深刻に
  - kind: para
    text: 感じる必要はない
  - kind: para
    text: 警告は記述の不整合や曖昧な点を
  - kind: para
    text: 教えてくれてるだけなので、「警
  - kind: para
    text: 告を減らす」ことに価値がある
  p84:
  - kind: para
    text: 注目する警告を減らす
  - kind: para
    text: Phanであればmasterでのログ
  - kind: para
    text: 出力とブランチでの出力が減る
  - kind: para
    text: (増えない)ことだけに注目する
  - kind: para
    text: PHPStanであれば、ブランチで変
  - kind: para
    text: 更したファイル(と、そのクラス/関数を
  - kind: para
    text: 使ったファイル)だけを対象にしてみる
  p85:
  - kind: para
    text: 解析に怯えすぎず
  - kind: para
    text: ご安全に
