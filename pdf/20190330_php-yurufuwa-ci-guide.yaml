  - kind: para
    text: 2019-03-30 PHPerKaigi 2019 Day 1
  - kind: para
    text: 'Nerima Coconeri Hall #phperkaigi'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社サービスプラットフォーム事業部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - 2013年頃から仕事でPHPを書いてます
    - その前はRubyをちょっとやってました
    - 普段はPHP勉強会＠東京などでふざけた話をします
    - 今回は実用的な話をします
    - 去年は前夜祭トークでふざけた話をしました
    - 今回の発表の内容とは
  - kind: para
    text: あんまり関連ないです
  - kind: list
    items:
    - 無関係ではないけど
  p4: []
  p5: []
  p6: []
  p7:
  - kind: para
    text: アジェンダ
  p8:
  - kind: para
    text: CIとは何かCIで何ができるかCI実行環境の種類ゆるふわにCIを始める実際の事例について
  p9:
  - kind: para
    text: CodeIgniter(Web Framework)の話はしません
  p10:
  - kind: para
    text: CD (Continuous delivery/deployment)の話もしません
  p11:
  - kind: para
    text: 個別のCI製品の設定の話もしません
  p12:
  - kind: para
    text: CIとは何かCIで何ができるかCI実行環境の種類ゆるふわにCIを始める実際の事例について
  p13:
  - kind: para
    text: 本題の前に
  p14:
  - kind: para
    text: 今回紹介するツールとGitLab CIの設定をまとめてセットアップできるプロジェクトを用意してます
  - kind: para
    text: https://gitlab.com/zonuexe/phperkaigi-ci
  p15:
  - kind: para
    text: 予め断っておきますがこの構成では規模の大きなプロジェクトではパフォーマンス目立ちます(断言)
  p16:
  - kind: para
    text: 実プロジェクトに導入する際は各自の責任で取捨選択してください
  p17:
  - kind: para
    text: あとすみませんWindowsではたぶん動きません
  p18:
  - kind: para
    text: CIとは何か
  p19:
  - kind: para
    text: 単にシーアイと呼びます
  - kind: para
    text: CIとは
  - kind: para
    text: Continuous Integration(継続的インテグレーション)の略
  - kind: para
    text: もともとはXP(エクストリームプログラミング)コミュニティで明文化されたもの…らしい
  - kind: para
    text: 有名な文章は2000年に書かれた
  p20:
  - kind: para
    text: 議論には登るが、実⾏に移されることの少ない「ベストプラクティス」がソフトウェア開発にはいっぱいある。その中でも、もっとも基本的かつ重要なもの⼀つが、「完全に⾃動化されたビルドとテストプロセス」だ。これは、プロジェクトチームが⾃分のソフトウェアのビルドやテストを⼀⽇に何度も⾏うことを可能にするものである。
  - kind: para
    text: –Martin Fowler, 継続的インテグレーション (オブラブ訳)
  - kind: para
    text: http://objectclub.jp/community/XP-jp/xp_relate/cont-j
  p21: []
  p22:
  - kind: heading
    level: 1
    text: テスト自動化に必要なこと (引用)
  - kind: para
    text: 全てのソースコードが格納され、誰でも最新の(そして過去の)ソースを取り出すことが可能な、ただ一つの出入口を設定すること
  - kind: para
    text: ビルドプロセスを自動化して、誰でも、コマンド一つでソースからシステムを作り出すことができること
  - kind: para
    text: テスト作業を自動化して、コマンド一つでいつでもテストスィートを実行できるようにすること
  - kind: para
    text: 現行の実行可能モジュールで、もっとも適切であると自信を持てるようなものを、誰でも入手可能であるようにすること
  - kind: para
    text: –Martin Fowler, 継続的インテグレーション (オブラブ訳)
  - kind: para
    text: http://objectclub.jp/community/XP-jp/xp_relate/cont-j
  p23:
  - kind: heading
    level: 1
    text: テスト自動化に必要なこと (引用)
  - kind: para
    text: Git/GitHub
  - kind: para
    text: Composer
  - kind: para
    text: 全てのソースコードが格納され、誰でも最新の(そして過去の)ソースを取り出すことが可能な、ただ一つの出入口を設定すること
  - kind: para
    text: テスティングフレームワーク
  - kind: para
    text: ビルドプロセスを自動化して、誰でも、コマンド一つでソースからシステムを作り出すことができること
  - kind: para
    text: git tag / master
  - kind: para
    text: テスト作業を自動化して、コマンド一つでいつでもテストスィートを実行できるようにすること
  - kind: para
    text: 現行の実行可能モジュールで、もっとも適切であると自信を持てるようなものを、誰でも入手可能であるようにすること
  - kind: para
    text: –Martin Fowler, 継続的インテグレーション (オブラブ訳)
  - kind: para
    text: http://objectclub.jp/community/XP-jp/xp_relate/cont-j
  p24:
  - kind: heading
    level: 2
    text: テスト自動化に必要なこと (引用)
  - kind: para
    text: Git/GitHub
  - kind: heading
    level: 1
    text: CIの前提となる
  - kind: para
    text: Composer
  - kind: para
    text: 全てのソースコードが格納され、誰でも最新の(そして過去の)ソースを取り出すことが可能な、ただ一つの出入口を設定すること
  - kind: heading
    level: 1
    text: 環境は揃ってるので
  - kind: para
    text: テスティングフレームワーク
  - kind: para
    text: ビルドプロセスを自動化して、誰でも、コマンド一つでソースからシステムを作り出すことができること
  - kind: heading
    level: 1
    text: 基本的に組み合せで
  - kind: para
    text: git tag / master
  - kind: para
    text: テスト作業を自動化して、コマンド一つでいつでもテストスィートを実行できるようにすること
  - kind: heading
    level: 1
    text: かなりいける
  - kind: para
    text: 現行の実行可能モジュールで、もっとも適切であると自信を持てるようなものを、誰でも入手可能であるようにすること
  - kind: para
    text: –Martin Fowler, 継続的インテグレーション (オブラブ訳)
  - kind: para
    text: http://objectclub.jp/community/XP-jp/xp_relate/cont-j
  p25:
  - kind: para
    text: 銀の弾丸はない
  - kind: para
    text: コードの規模や構造によって導入できるツール・できないツールがある
  - kind: para
    text: 大規模なコードになるほど実行時間が掛かるようになり工夫が必要になってくる
  p26:
  - kind: para
    text: CIで何ができるか
  p27:
  - kind: para
    text: 継続的にされてると嬉しいこと
  - kind: para
    text: いろいろあるだろうが、基本的にはコードが正常に保たれてることは確認し続けたい
  - kind: para
    text: (コード上の異常発生を迅速に知る)
  - kind: para
    text: そのほか属人化してる項目や忘れられがちなプロセスを盛り込めるとよい
  p28:
  - kind: para
    text: コードの異常を検知するには
  - kind: para
    text: 実行してチェックする
  - kind: para
    text: 自動テスト(ユニットテスト, 受け入れテスト)
  - kind: para
    text: 人間が動作確認
  - kind: para
    text: 実行せずコードの品質を検査する
  - kind: para
    text: 「QAツール」と総称される
  p29:
  - kind: para
    text: 自動テスト(ユニットテスト)
  - kind: para
    text: PHPUnit, phpspecなど
  - kind: para
    text: 小さな単位でテストすることが理想だが、コードが古く結合度が高いプロジェクトではユニットテストに表現することが困難なこともある
  p30:
  - kind: para
    text: 自動テスト(受け入れテスト)
  - kind: para
    text: Codeception
  - kind: para
    text: 実際にHTTPリクエストを行ってテストできるフレームワーク
  - kind: para
    text: 古くテストが少ないプロジェクトではこちらの方が導入しやすいかもしれない
  p31:
  - kind: para
    text: QAツール (Quality Assurance)
  - kind: para
    text: 大まかに二種類に大別できる
  - kind: para
    text: 字句解析ベースで主にスタイルを検査するもの
  - kind: para
    text: 再帰的な型検査を行うもの
  p32:
  - kind: para
    text: コーディングスタイルベース
  - kind: para
    text: コードを字句的に解釈する
  - kind: para
    text: PHPMD (PHP Mess Detector)
  - kind: para
    text: PHP_CodeSniffer & phpcbf
  - kind: para
    text: PHP Coding Standards Fixer
  - kind: para
    text: 修正までやってくれるやつ
  p33:
  - kind: para
    text: 型検査を含む精密な型検査
  - kind: para
    text: 字句的な静的解析ツールはオブジェクトの未定義メソッド検出などはできないのに対して、最近開発が活発なツールはコードパスを詳細に解析して、さまざまな情報を出してくれる
  p34:
  - kind: para
    text: 型検査を含む精密な型検査
  - kind: para
    text: それぞれ開発が活発なツール
  - kind: para
    text: PHPStan, Psalm, Phan
  - kind: para
    text: ぶっちゃけキャラが被ってるけど、それぞれ検出してくれるポイントが違ったりする
  p35: []
  p36:
  - kind: para
    text: PHPStan vs Phan
  - kind: para
    text: Phanは純粋な静的解析
  - kind: para
    text: プロジェクト全体スキャン
  - kind: para
    text: PHPStanは実行時情報も利用し必要なファイルのみ解析
  - kind: para
    text: 高速に結果を返したい場合はPHPStanの方が有利
  p37:
  - kind: para
    text: PHPStanの制約
  - kind: para
    text: クラスや関数・定数の定義を予め(または遅延)読み込みできるようにする必要がある
  - kind: para
    text: PSR-1(定義だけのファイルと副作用の処理を分離すること)が重要
  p38:
  - kind: para
    text: PHPStanの制約
  - kind: para
    text: ComposerとかPSR-1を考慮してない時代のPHPプロジェクトには厳しいが、ハードルを越えれば高速で頻繁なビルドが可能
  p39:
  - kind: para
    text: PHPStanの効能
  - kind: para
    text: 今回の本題とは少し離れるが、EmacsやVimでチェッカーのバックエンドとして適切に設定すると、PhpStormを凌ぐ情報量がリアルタイムで得られる
  p40: []
  p41:
  - kind: para
    text: Vim+ALE
  p42:
  - kind: para
    text: CIの実行環境
  - kind: para
    text: いろいろ
  p43:
  - kind: para
    text: CIはいつ実行する
  - kind: para
    text: 「たくさんやるほうが望ましい」
  - kind: para
    text: 多くのCIサービスでGitHubと連携して、Pull Requestを作成したブランチにPushするたびに毎回ビルドを行うのが普通
  - kind: para
    text: 結果はPRのページに表示される
  p44:
  - kind: para
    text: 汎用CIの実行環境
  - kind: para
    text: テストプログラムを｢自動的｣かつ｢継続的｣に実行する必要がある
  - kind: para
    text: 汎用のCIと特定用途のCIがある
  - kind: para
    text: 現実的には下記のどちらか
  - kind: para
    text: 各種CI SaaSのどれかと契約
  - kind: para
    text: CI用のサーバを自前で用意
  p45:
  - kind: para
    text: CI SaaS (hosted)
  - kind: para
    text: サーバ自前管理の必要がない
  - kind: para
    text: 典型的にはGitHubなどと連携
  - kind: para
    text: CI側が用意したOS環境を利用するものと、Dockerイメージを利用するものがある
  p46: []
  p47:
  - kind: para
    text: CI SaaSの制約
  - kind: para
    text: GitHub EnterpriseやオンプレのGitLabは連携できない
  - kind: para
    text: 各種CIのオンプレ版(有償)を利用することで利用できるが、サーバの調達・管理は自前で行う必要がある
  p48:
  - kind: para
    text: オンプレミスのCI
  - kind: para
    text: サーバを自前で調達・管理する必要がある
  - kind: para
    text: 無料の製品ではJenkinsの牙城だった
  - kind: para
    text: 自前でGitLab CEをCI機能を持ってるので連携することもできる
  p49:
  - kind: para
    text: GitLabの場合
  - kind: para
    text: GitLabには複数ある
  - kind: para
    text: SaaS版のGitLab.com
  - kind: para
    text: オンプレ版のGitLab
  - kind: para
    text: それぞれの有料・無料版
  - kind: para
    text: どちらもCI機能が統合されてる
  p50:
  - kind: para
    text: GitLab.com
  - kind: para
    text: 無料でプライベートリポジトリ可
  - kind: para
    text: 無料版でもCI機能が利用可能
  - kind: para
    text: グループあたり月2000分まで
  - kind: para
    text: 設定ファイルに書くだけでDockerでビルドが実行される
  p51:
  - kind: para
    text: 特定用途のCI
  - kind: para
    text: PHP解析
  - kind: para
    text: SensioLabsInsight
  - kind: para
    text: Scrutinizer
  - kind: para
    text: コーディングスタイル
  - kind: para
    text: StyleCI
  p52:
  - kind: para
    text: 御託はわかった
  p53:
  - kind: para
    text: で、結局いろいろ準備しなくちゃいけなくてめんどくさいんでしょ？
  p54:
  - kind: para
    text: ゆるふわに始めるCI
  p55:
  - kind: para
    text: もっと気軽に手を付けられるところからやっていきましょう
  p56:
  - kind: para
    text: 継続して動かせるサーバがないさてどうするか
  p57:
  - kind: heading
    level: 1
    text: テスト自動化に必要なこと (引用)
  - kind: para
    text: 全てのソースコードが格納され、誰でも最新の(そして過去の)ソースを取り出すことが可能な、ただ一つの出入口を設定すること
  - kind: para
    text: ビルドプロセスを自動化して、誰でも、コマンド一つでソースからシステムを作り出すことができること
  - kind: para
    text: テスト作業を自動化して、コマンド一つでいつでもテストスィートを実行できるようにすること
  - kind: para
    text: 現行の実行可能モジュールで、もっとも適切であると自信を持てるようなものを、誰でも入手可能であるようにすること
  - kind: para
    text: –Martin Fowler, 継続的インテグレーション (オブラブ訳)
  - kind: para
    text: http://objectclub.jp/community/XP-jp/xp_relate/cont-j
  p58:
  - kind: para
    text: 複雑な反復作業があれば、一個のコマンド(スクリプト)でまとめてみることから始める
  p59:
  - kind: para
    text: ところで
  p60:
  - kind: para
    text: みなさんSyntaxErrorのPHPスクリプトを本番に反映して事故ったことはありますか？
  p61:
  - kind: para
    text: 私はたくさんあります
  - kind: heading
    level: 1
    text: 
  p62:
  - kind: para
    text: Syntax Errorになるファイルを確実に捕捉してみましょう
  p63:
  - kind: para
    text: git ls-files '*\.php' |xargs -I{} php -l {}
  p64:
  - kind: para
    text: Windowsにはxargsがない(たぶん)のでPHPでhttps://gist.github.com/zonuexe/a513afd1d6933b3cc5cca0eb866f2834
  p65:
  - kind: para
    text: ファイルが数十個単位ならすぐに終るが、数千単位になると全数の検査はかなり時間が掛かるので注意
  p66:
  - kind: para
    text: 弊社での事例について
  p67: []
  p68:
  - kind: para
    text: ファイル数 6264
  - kind: para
    text: 行数 974419
  p69:
  - kind: para
    text: 毎回全ファイルをチェックするのはさすがにつらい
  p70:
  - kind: para
    text: デプロイ時に常にgit tagをつけるデプロイスクリプトで、デプロイ成功したら日時と作業者名を含むタグを生成してoriginにpushする
  p71:
  - kind: para
    text: 最新のリリースタグとの差分をとるこれで最新デプロイと手元の差分があるファイル抽出できる
  p72:
  - kind: para
    text: デプロイ時にphp -lを行う差分のあるファイル全部に対してチェックを実施し、一つでもエラーのファイルがあったらデプロイ処理を中断する中断されるとtagはつかないので、差分が隠れることはない
  p73:
  - kind: para
    text: MergeRequestと二種類のビルド
  - kind: para
    text: PHPUnit
  - kind: para
    text: PHPStanおよび独自Linter
  - kind: para
    text: それぞれ実行時間は1分ちょっと
  p74:
  - kind: para
    text: PHPStan
  - kind: para
    text: PHPStan本運用のためbootstrap処理の軽いリファクタリングをした
  - kind: para
    text: _autoloader_for_static_analysis.php
  - kind: para
    text: この作業によってPhpactorという別ツールも利用可能に
  p75:
  - kind: para
    text: PHPUnit
  - kind: para
    text: 直列実行で10分前後かかっていた
  - kind: para
    text: テストが依存するMySQLを複数起動し、PHPUnitのプロセスを並列実行することで1分程度で完了
  p76:
  - kind: para
    text: masterブランチへのテスト
  - kind: para
    text: MRのテストを無視してmasterにマージされたときの防波堤
  - kind: para
    text: この段階で失敗したテストはSlackで報告される
  - kind: para
    text: 時刻に依存したテストのランダムフェイルがたまに報告される
  p77:
  - kind: para
    text: 実行環境
  - kind: para
    text: GitLab CI + Jenkins
  - kind: para
    text: 以前はPHPStanの警告はGitLabのMRへのコメントで報告
  - kind: para
    text: 現在はCI実行はAWSまたはJenkinsで、それぞれの結果をGitLabのパイプラインに統合
  p78:
  - kind: para
    text: まとめ
  p79:
  - kind: para
    text: どのようなCIを導入するか
  - kind: para
    text: プロジェクトの現状・性質による
  - kind: para
    text: テストが書ける密結合度か
  - kind: para
    text: 定義ファイルは分離されてるか
  - kind: para
    text: (同名の関数や定数が複数定義されてるとはまる)
  p80:
  - kind: para
    text: 発表時に書きそびれたこと
  p81:
  - kind: para
    text: 小姑CI
  - kind: para
    text: コーディングスタイルのような重箱の隅は人間がコードレビューで小うるさく責めるより、Botが鉄の心で指摘した方が角が立たない
  - kind: para
    text: PHP-CS-Fixerやphpcbfのようなコマンド一撃で修正されるようにすれば手間もかからない
  p82:
  - kind: para
    text: どんな場合も静的解析を導入すべきか
  - kind: para
    text: 普通の既存プロジェクトをPHPStanやPhanで解析すると異常な量の型の不整合の警告が出るのが普通
  - kind: para
    text: 多すぎる警告を目のあたりにすると、人間は無力感に苛まれる(学習性無力感)
  p83:
  - kind: para
    text: 警告を深刻に受け止めない
  - kind: para
    text: そのプロダクトが実際は動いてるのであれば、現状をあまり深刻に感じる必要はない
  - kind: para
    text: 警告は記述の不整合や曖昧な点を教えてくれてるだけなので、「警告を減らす」ことに価値がある
  p84:
  - kind: para
    text: 注目する警告を減らす
  - kind: para
    text: Phanであればmasterでのログ出力とブランチでの出力が減る(増えない)ことだけに注目する
  - kind: para
    text: PHPStanであれば、ブランチで変更したファイル(と、そのクラス/関数を使ったファイル)だけを対象にしてみる
  p85:
  - kind: para
    text: 解析に怯えすぎずご安全に
