    - node: br
    - node: text
      content: 'を構造体のつもりで '
    - node: br
    - node: text
      content: 多用されると静的解析
    - node: br
    - node: text
      content: を簡単に破滅できる
  p112:
  - node: p
    children:
    - node: text
      content: と思うでしょ？ PHPDocでなら 型をつけられます
  p113:
  - node: p
    children:
    - node: text
      content: PHPに型を付けたり
    - node: br
    - node: text
