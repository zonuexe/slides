    - node: text
      content: '  * @return mixed'
    - node: br
    - node: text
      content: '  */'
    - node: br
    - node: text
      content: function add($a, $b)
    - node: br
    - node: text
      content: '{'
    - node: br
    - node: text
      content: '    if (!is_int($a)) {'
    - node: br
    - node: text
      content: '        throw new TypeError(''Error'');'
    - node: br
    - node: text
      content: '    }'
    - node: br
    - node: text
      content: '    if (!is_int($b)) {'
    - node: br
    - node: text
      content: '        throw new TypeError(''Error'');'
    - node: br
    - node: text
      content: '    }'
  - node: p
    children:
    - node: text
      content: 実装するときに 以外の値が渡ってくる可能性を考えなくて良い
  - node: p
    children:
    - node: text
      content: '    //   int '
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p83:
  - node: p
    children:
    - node: text
      content: 実行時に変な値に対 して処理が続行する 可能性は避けられる
  p84:
  - node: p
    children:
    - node: text
      content: 例外で処理が 停止するので
  p85:
  - node: p
    children:
    - node: text
      content: 'PHPとかいう '
    - node: br
    - node: text
      content: '静的型付き '
    - node: br
    - node: text
      content: プログラミング言語
  p86:
  - node: p
    children:
    - node: text
      content: 静的型付きPHP
  - node: p
    children:
    - node: text
      content: <?php declare(strict_types=1);
  - node: p
    children:
    - node: text
      content: このメソッドを実装するときに 以外の値が
  - node: p
    children:
    - node: text
      content: '//   int '
    - node: br
    - node: text
      content: 渡ってくる可能性は考えなくてよい
  - node: p
    children:
    - node: text
      content: '// '
    - node: br
    - node: text
      content: 'function add(int $a, int $b): int'
    - node: br
    - node: text
      content: '{'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p87:
  - node: p
    children:
    - node: text
      content: '静的 = '
    - node: br
    - node: text
      content: '実行しなくても '
    - node: br
    - node: text
