    - node: br
    - node: text
      content: そういう関係になりがち
  p92:
  - node: p
    children:
    - node: text
      content: 'C言語は '
    - node: br
    - node: text
      content: 静的型付き
  p93:
  - node: p
    children:
    - node: text
      content: 多くの動的言語 はC言語で実装
  p94:
  - node: p
    children:
    - node: text
