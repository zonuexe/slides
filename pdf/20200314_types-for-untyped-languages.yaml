text:
  p1:
  - kind: heading
    level: 1
    text: 型なき言語に付ける型
  - kind: para
    text: Type in untyped languages
  - kind: para
    text: '#virtual_study_groupバーチャル空間勉強会#0'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer, Rubyist
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: 近況
  p6: []
  p7: []
  p8:
  - kind: para
    text: 話しました
  p9: []
  p10: []
  p11: []
  p12:
  - kind: para
    text: 仕方がないので全然違う話をします
  p13:
  - kind: para
    text: 本日のお題
  p14:
  - kind: para
    text: 型､ついてますか？
  p15:
  - kind: para
    text: 型については結構雑な印象で見解を語るひとが多い
  p16:
  - kind: para
    text: 俺も俺も
  p17:
  - kind: para
    text: 型があるから変更に強いというひとも居れば、型がないから変更に強いというひとも居る
  p18:
  - kind: para
    text: ？？？
  p19:
  - kind: para
    text: 型よくわからん
  p20:
  - kind: para
    text: 私もだ
  p21:
  - kind: para
    text: intとboolとかでしょ
  p22: []
  p23:
  - kind: para
    text: 読むがよい
  p24:
  - kind: para
    text: ‒Benjamin C. Pierce 著／住井英二郎 監訳／遠藤侑介・酒井政裕・今井敬吾・黒木裕介・今井宜洋・才川隆文・今井健男 訳 『型システム入門
      プログラミング言語と型の理論』（オーム社、978-4-274-06911-6、2013年）サンプル
  p25:
  - kind: para
    text: ‒Benjamin C. Pierce 著／住井英二郎 監訳／遠藤侑介・酒井政裕・今井敬吾・黒木裕介・今井宜洋・才川隆文・今井健男 訳 『型システム入門
      プログラミング言語と型の理論』（オーム社、978-4-274-06911-6、2013年）サンプル
  p26:
  - kind: para
    text: (一章はサンプルとしてPDFが無料でダウンロードできます)
  p27:
  - kind: para
    text: 正しい､完璧に正しいのだが
  p28:
  - kind: para
    text: 最初から用語多すぎ
  p29:
  - kind: para
    text: 説明の抽象度が高すぎて現実とのギャップ大きすぎ
  p30:
  - kind: para
    text: この1章の内容を解きほぐして説明するだけで何時間も話せそう
  p31:
  - kind: para
    text: そのほかの型とかプログラミング言語論の本を読むと数式みたいなのが出てきてﾜｹﾜｶﾗﾝ
  p32:
  - kind: para
    text: 型についてちょっと知りたいだけなのに
  p33:
  - kind: para
    text: 世の中の人と型
  p34:
  - kind: para
    text: 型を使っているが思索の対象として向き合ってないひと
  p35:
  - kind: para
    text: 特定の言語の型とだけ向き合ってる人
  p36:
  - kind: para
    text: 抽象概念の型と向き合ってるひと
  p37:
  - kind: para
    text: いろんな背景の人が居る
  p38:
  - kind: para
    text: 動的言語を使っていると静的型付き言語利用者から冷ややかに見られがち
  p39:
  - kind: para
    text: やーい型なし型なし
  p40:
  - kind: para
    text: 型はあるんだ！実行時にあるんだ！
  p41:
  - kind: para
    text: そういうことをまじめに主張すると憐れみを湛えた目で見られはじめる
  p42:
  - kind: para
    text: 真の型なし言語も複数あるが今回は割愛しました
  p43:
  - kind: para
    text: 型わかりたくないですか
  p44:
  - kind: para
    text: このトークに結論はない
  p45:
  - kind: para
    text: 実際の言語の型からいきましょう
  p46:
  - kind: para
    text: C言語
  p47:
  - kind: heading
    level: 1
    text: よくわからんけど型がだるい
  - kind: para
    text: '#include <stdio.h>'
  - kind: para
    text: long add(long a, long b) {return a + b;}
  - kind: para
    text: int main(void) {unsigned int x = 1, y = 2;
  - kind: para
    text: printf("%d + %d = %d\n", x, y, add(x, y));}
  p48:
  - kind: para
    text: 私たちFラン情報科学生は情弱なのでまともな説明もないカビの生えた教科書でC言語を叩き込まれる
  p49:
  - kind: para
    text: 私の入門者時代のC言語理解は曖昧なので曖昧なままで次の話に進めます
  p50:
  - kind: para
    text: さておき
  p51:
  - kind: heading
    level: 1
    text: 短くなってべんり
  - kind: para
    text: // JavaScript
  - kind: para
    text: function add(a, b) {return a + b;}
  - kind: para
    text: const x = 1, y = 2;
  - kind: para
    text: console.log(`${x} + ${y} + ${add(x, y)}`);
  p52:
  - kind: heading
    level: 1
    text: もっと短くなってべんり
  - kind: para
    text: '# Ruby'
  - kind: para
    text: def add(a, b)a + b end
  - kind: para
    text: x = 1; y = 2
  - kind: para
    text: 'puts "#{x} + #{y} + #{add x, y}"'
  p53:
  - kind: para
    text: そういう俺たちが動的言語に触れるとこうなる
  p54:
  - kind: para
    text: 型とか要らんやろｗ
  p55:
  - kind: para
    text: そうだな
  p56:
  - kind: heading
    level: 1
    text: 見ればわかるだろ
  - kind: para
    text: '# Ruby'
  - kind: para
    text: '# to_sオブジェクトが生えてたら何でもいい'
  - kind: para
    text: def show(obj)puts obj.to_s end
  p57:
  - kind: heading
    level: 1
    text: 常識的に考えて
  - kind: para
    text: '# Ruby'
  - kind: para
    text: '# 足し算できるものならなんでもいいし'
  - kind: para
    text: '# ジェネリクスとかなくてもいいｗ'
  - kind: para
    text: def add(a, b)a + b end
  - kind: para
    text: def show(obj)puts obj.to_s end
  p58:
  - kind: heading
    level: 1
    text: 引数が少ないうちはな…
  - kind: para
    text: '# Ruby'
  - kind: para
    text: 'user = User.findBy(id: params[:user_id])'
  p59:
  - kind: heading
    level: 1
    text: 引数が増えてくると
  - kind: para
    text: '# Ruby'
  - kind: para
    text: obj = palpunte(user_id,????,????,????,)
  - kind: para
    text: p obj
  p60:
  - kind: para
    text: 実装を直接見に行く機会が増える
  p61:
  - kind: heading
    level: 1
    text: 引数が増えてくると
  - kind: para
    text: '# Ruby'
  - kind: para
    text: '# 実装を見ないと期待するオプションに何を渡せばいいのか'
  - kind: para
    text: def palpunte (id, foo, bar, buz)p [id, foo, bar, buz]end# というか見てもよくわからない
  p62:
  - kind: heading
    level: 1
    text: 素朴に書くと引数がわからん
  - kind: para
    text: '# Ruby'
  - kind: para
    text: '# 実際にはキーワード引数だけで表現できる'
  - kind: para
    text: 'def palpunte (id: nil, **options)raise TypeError if id.nil?'
  - kind: para
    text: foo ||= "default foo"bar ||= "default bar"buz ||= "default buz"
  - kind: para
    text: p [id, foo, bar, bar]]end
  p63:
  - kind: heading
    level: 1
    text: だんだん型チェックが増えてく
  - kind: para
    text: '# Ruby'
  - kind: para
    text: raise TypeError unless foo.instance_of?(String)raise TypeError unless bar.instance_of?(String)raise
      TypeError unless buz.instance_of?(String)
  p64:
  - kind: para
    text: いわゆる動的言語にも型が付く流れ
  p65:
  - kind: para
    text: Flowtype
  - kind: para
    text: TypeScript
  p66:
  - kind: para
    text: PEP484
  - kind: para
    text: mypy
  p67:
  - kind: para
    text: Ruby3 rbi
  - kind: para
    text: Sorbet
  - kind: para
    text: Steep
  p68:
  - kind: para
    text: PHP型宣言
  - kind: para
    text: PHPDoc
  - kind: para
    text: PhpStorm,Phan
  p69:
  - kind: para
    text: 身体は型を求める
  p70:
  - kind: para
    text: 型が付いていないということはどういうことか
  p71:
  - kind: heading
    level: 1
    text: 可能性は無限大
  - kind: para
    text: <?php
  - kind: para
    text: /*** @param mixed $a 可能性は無限大
  - kind: para
    text: '* @param mixed $b* @return mixed*/function add($a, $b){return $a + $b;}'
  p72:
  - kind: heading
    level: 1
    text: 仮引数宣言がない言語
  - kind: para
    text: <?php
  - kind: para
    text: function add(){$args = func_get_args();
  - kind: para
    text: return array_pop($args)+ array_pop($args);}
  p73:
  - kind: para
    text: 無限大じゃ困るんだよ
  p74:
  - kind: para
    text: とはいえ+できる値という前提があるので案外困らない
  p75:
  - kind: para
    text: ほんとに？
  p76:
  - kind: heading
    level: 1
    text: PHPの演算子の暗黙的型変換
  - kind: para
    text: <?php
  - kind: para
    text: error_reporting(0);
  - kind: para
    text: var_dump(add(1, 2)); // => int(3) 想定通り
  - kind: para
    text: var_dump(add(1.0, 2.0)); // => float(3.0) 許容範囲
  - kind: para
    text: var_dump(add('1', '2')); // => int(3) 許容範囲
  - kind: para
    text: var_dump(add('', '')); // => int(0) ?????var_dump(add(1, 2, 3)); // => int(3)
      ?????var_dump(add([], [])); // => [] えっ?????
  - kind: para
    text: var_dump(add(PHP_INT_MAX, 1));// => float(9.2233720368548E+18)
  p77:
  - kind: para
    text: 実行時に型を調べよう
  p78:
  - kind: para
    text: いわゆる動的言語は実行時に型があるのでそれを検査できる
  p79:
  - kind: para
    text: JavaScriptではtypeof 演算子で型名文字列がとれる
  p80:
  - kind: para
    text: Python type()
  - kind: para
    text: Ruby Object#class
  p81:
  - kind: para
    text: PHPではis_int(),is_string()などの関数(gettypeは使いにくい)
  p82:
  - kind: heading
    level: 1
    text: 可能性を絞り込もう
  - kind: para
    text: <?php
  - kind: para
    text: /*** @param mixed $a 可能性は無限大
  - kind: para
    text: '* @param mixed $b 可能性は無限大'
  - kind: para
    text: '* @return mixed*/function add($a, $b){if (!is_int($a)) {throw new TypeError(''Error'');}if
      (!is_int($b)) {throw new TypeError(''Error'');}'
  - kind: para
    text: // 実装するときに int 以外の値が渡ってくる可能性を考えなくて良い
  - kind: para
    text: return $a + $b;}
  p83:
  - kind: para
    text: 実行時に変な値に対して処理が続行する可能性は避けられる
  p84:
  - kind: para
    text: 例外で処理が停止するので
  p85:
  - kind: para
    text: PHPとかいう静的型付きプログラミング言語
  p86:
  - kind: heading
    level: 1
    text: 静的型付きPHP
  - kind: para
    text: <?php declare(strict_types=1);
  - kind: para
    text: // このメソッドを実装するときに int 以外の値が
  - kind: para
    text: // 渡ってくる可能性は考えなくてよい
  - kind: para
    text: 'function add(int $a, int $b): int{return $a + $b;}'
  p87:
  - kind: para
    text: 静的 =実行しなくても型が決まってる状態
  p88:
  - kind: para
    text: 静的型付きStatically typed既に型が決定してる
  p89:
  - kind: para
    text: 動的型付けDynamic typing実行時に型を付ける
  p90:
  - kind: para
    text: よくある誤解
  - kind: para
    text: 静的型＝コンパイラ
  - kind: para
    text: 動的型＝インタプリタ
  p91:
  - kind: para
    text: ただしプログラム実行時のデータの表現方法がそういう関係になりがち
  p92:
  - kind: para
    text: C言語は静的型付き
  p93:
  - kind: para
    text: 多くの動的言語はC言語で実装
  p94:
  - kind: para
    text: 必ずしも排他の関係ではない
  p95:
  - kind: para
    text: お使いの言語ランタイム(ruby,python, phpなど)のC言語実装がどうなっているか、変数がC言語の型でどう表現されてるか読んでみるとおもしろいと思います
  p96:
  - kind: para
    text: PHPは実行時に型をチェックする
  p97:
  - kind: para
    text: ただし関数とプロパティに静的に型を付けられる
  p98:
  - kind: para
    text: ただし静的に型を付けても実行時にクラッシュする可能性があります
  p99:
  - kind: para
    text: 型で守られてるとはどういう状態か
  p100:
  - kind: para
    text: ‒Akinori Abe 『型安全性入門』(Apr 6, 2017)
  p101:
  - kind: para
    text: ‒Akinori Abe 『型安全性入門』(Apr 6, 2017)
  p102:
  - kind: para
    text: 関数を呼び出す側が間違って呼び出すことをPHPだけでは防げない
  p103:
  - kind: para
    text: 動的言語で完全かつ健全にするのは不可能
  p104:
  - kind: para
    text: 偽陽性(動かないのに動きそうなフリをしている)ことを最小にしていくことを目指す
  p105:
  - kind: para
    text: コンパイラの代りに静的型チェッカーを使おうということになる
  p106:
  - kind: para
    text: PHPでも複数の型チェッカーが揃っている
  p107:
  - kind: para
    text: PhpStorm
  - kind: para
    text: Phan, Psalm
  - kind: para
    text: PHPStan
  p108:
  - kind: para
    text: PHPのソースコードを解析しても判別できない型は注釈(annotate)してあげる必要がある
  p109:
  - kind: para
    text: 人間がコメントで型を書く
  p110:
  - kind: para
    text: 人間が型を間違ってつけると破綻するので実際簡単ではない
  p111:
  - kind: para
    text: 連想配列(Hash, dict)を構造体のつもりで多用されると静的解析を簡単に破滅できる
  p112:
  - kind: para
    text: と思うでしょ？PHPDocでなら型をつけられます
  p113:
  - kind: para
    text: PHPに型を付けたりCIに載せる話はFANBOXに記事やスライドを掲載してます
  p114: []
  p115:
  - kind: para
    text: 型について学ぶにはどうすればいい
  p116: []
  p117:
  - kind: para
    text: ハードルが高い(そもそも値段が…)
  p118:
  - kind: para
    text: 一章のPDFは無料なので読んでほしいが難しいので理解できなくてもいい
  p119: []
  p120:
  - kind: para
    text: 型のみならずプログラミング言語についてのさまざまな概念を学べる
  p121:
  - kind: para
    text: まとめ
  p122:
  - kind: para
    text: 仕事で使ってる言語を好きになるために目を逸らさず向き合っていこう
