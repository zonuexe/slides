  - kind: heading
    level: 1
    text: PHPerKaigi petit 8.1(2021年)
  p12:
  - kind: para
    text: 要約：
  - kind: para
    text: 型宣言arrayだけでは
  - kind: para
    text: 不十分なので、もっと
  - kind: para
    text: 詳しく書かねばならぬ
  p13:
  - kind: heading
    level: 1
    text: 著者一覧を出力したい
  - kind: para
    text: 'Book::$authors : array'
  - kind: para
    text: 中身が何かわからない！
  - kind: para
    text: Authorクラスの
  - kind: para
    text: メソッドを補完できない
  - kind: para
    text: class Book
  - kind: para
    text: '{'
  - kind: para
    text: 'function printAuthors($fp): void {'
  - kind: para
    text: foreach ($this->authors as $author) {
  - kind: para
    text: fwrite($fp, $author->getName());
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p14:
  - kind: heading
    level: 1
    text: りくつはわかった
  p15:
  - kind: para
    text: ならぬと言われても
  - kind: para
    text: どう書けばいいのか
  - kind: para
    text: わからん
  p16:
  - kind: heading
    level: 1
    text: 配列に型を付ける(実践篇)
  - kind: heading
    level: 2
    text: Practice to type array
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2021.10.02
  p17:
  - kind: para
    text: 配列は単一の型では
  - kind: para
    text: ないことを認める
  p18:
  - kind: para
    text: PHPマニュアルより引用
  - kind: para
    text: 今回の主題はこれではないので
  - kind: para
    text: 一旦忘れてください
  p19:
  - kind: para
    text: 重要なのは
  - kind: para
    text: データの持ちかた
  p20:
  - kind: heading
    level: 1
    text: 配列はひとつ！じゃない！！
  - kind: para
    text: list<int>
  - kind: para
    text: array<int,string>
  - kind: para
    text: array{id:int, name:string}
  - kind: list
    items:
    - ユーザＩＤがならんだリスト ［123, 456］
    - ユーザIDと名前の対応表 [123 => '野比のび太', 234 => '源静香']
    - ユーザを表す構造体 ['id' => 123, 'name' => '野比のび太']
    - ユーザを表す構造体がならんだリスト
  - kind: para
    text: '['
  - kind: para
    text: '[''id'' => 123, ''name'' => ''野比のび太''],'
  - kind: para
    text: '[''id'' => 234, ''name'' => ''源静香''],'
  - kind: para
    text: ']'
  - kind: para
    text: list<array{id:int, name:string}>
  p21:
  - kind: heading
    level: 1
    text: 配列はどこからくるの
  p22:
  - kind: para
    text: arrayのふるさと
  - kind: list
    items:
    - PHPコードに書かれたリテラル
    - HTTPリクエスト ($_GET, $_POST)
    - デシリアライズ (JSON, PHPシリアライズ)・eval
    - json_decode(file_get_contents(__DIR__ . '/config.json'))
    - 外部APIリクエスト
    - PDOStatement::fetch() 系メソッド
  p23:
  - kind: para
    text: arrayリテラル
  - kind: list
    items:
    - 旧式の array() とPHP 5.4以降の [] がある
    - '[''a'', ''b''] と [0 => ''a'', 1 => ''b'']'
    - キーを省略すると 0 はじまりになる
    - 重要： array() は関数ではない
    - array('key' => 'value') は書けるが
  - kind: para
    text: hoge('key' => 'value')はsyntax errorになる
  p24:
  - kind: heading
    level: 1
    text: デシリアライズ・eval
  - kind: list
    items:
    - 文字列に変換されたデータを解凍した結果
    - $a = json_decode("[1, 2]", true);
    - $b = unserialize("a:2:{i:0;i:1;i:1;i:2;}");
    - $c = eval('return [1, 2];');
  p25:
  - kind: heading
    level: 1
    text: PDOの場合
  - kind: list
    items:
    - PDO::fetch() に渡すオプションによって配列の形状が変わる
    - SELECT id, name FROM users; のようなＳＱＬを考える
    - PDO::FETCH_ASSOC → ['id' => '1', 'name' => '初音ミク']
    - PDO::FETCH_NUM → [0 => '1', 1 => '初音ミク']
    - PDO::FETCH_BOTH →
  - kind: para
    text: '[0 => ''1'', 1 => ''初音ミク'', ''id'' => ''1'', ''name'' => ''初音ミク'']'
  p26:
  - kind: heading
    level: 1
    text: PDOの場合 (fetchAll)
  - kind: list
    items:
    - さらにfetch(の結果が並ぶ)
    - PDO::FETCH_ASSOC → [
  - kind: para
    text: '[''id'' => ''1'', ''name'' => ''初音ミク''],'
  - kind: para
    text: '[''id'' => ''2'', ''name'' => ''鏡音リン''],'
  - kind: para
    text: '[''id'' => ''3'', ''name'' => ''鏡音レン''],'
  - kind: para
    text: ']'
  p27:
  - kind: heading
    level: 1
    text: HTTPリクエスト($_GET, $_POST)
  - kind: list
    items:
    - HTMLフォームからは実は配列も送れる
    - ?data[]=a&data[]=b
    - $_GET['data'] = ['a', 'b']
    - ?user[name]=a&user[addr]=b
    - $_GET['user'] = ['name' => 'a', 'addr' => 'b']
    - '''user_name'', `user_addr` みたいなのを手で展開するより便利'
  p28:
  - kind: para
    text: なぜ配列に
  - kind: para
    text: 型がつかないのか
  p29:
  - kind: heading
    level: 1
    text: (再掲)デシリアライズ・eval
  - kind: list
    items:
    - 文字列に変換されたデータを解凍した結果
    - $a = json_decode("[1, 2]", true);
    - $b = unserialize("a:2:{i:0;i:1;i:1;i:2;}");
    - $c = eval('return [1, 2];');
  p30:
  - kind: heading
    level: 1
    text: 実際のデシリアライズ・eval
  - kind: list
    items:
    - 文字列に変換されたデータを解凍した結果
    - $a = json_decode((string)$res->getBody(), true);
    - $b = unserialize($serialize);
    - $c = eval($code);
    - 変数に入っていたり、メソッドから動的に生成されたりする
    - ＝ ソースコードを見てもわからない
  p31:
  - kind: para
    text: 型宣言にarrayとしか書かないと
  - kind: list
    items:
    - メソッドに何を渡せばいいのかわからない
    - どんな形式の配列を渡しても動くという関数は決して多くない
    - 標準関数の count() のようなユーティリティが多め
    - プロパティにも何が入ってるのかわからない
    - 従来のLaravelは @var array まみれだった
    - Laravel 9.xのコードベースでは配列の内部構造に型がついている
  p32:
  - kind: heading
    level: 1
    text: たとえばこういう関数
  - kind: para
    text: /** DBからユーザーを取得する */
  - kind: para
    text: 'function findUsers(array $ids): array {}'
  - kind: para
    text: // こういうパラメータを渡されても困る
  - kind: para
    text: $users = findUsers(['hoge' => 'fuga'])
  - kind: para
    text: // $idsというパラメータから推測しろ？ うーんわからん
  p33:
  - kind: heading
    level: 1
    text: たとえばこういう関数
  - kind: para
    text: /** 検索する */
  - kind: para
    text: 'function search(string $word, array $opt): array {}'
  - kind: para
    text: $result = search('検索したい単語');
  - kind: para
    text: // 実装を確認しに行かないとわからない
  - kind: para
    text: $result = search('検索したい単語', [?????]);
  p34:
  - kind: heading
    level: 1
    text: 配列につける型
  p35:
  - kind: heading
    level: 1
    text: 従来多用されていた記法
  - kind: para
    text: /**
  - kind: para
    text: '* @param User[] $users'
  - kind: para
    text: '*/'
  - kind: para
    text: 'function printUsers(array $users): void {'
  - kind: para
    text: foreach ($users as $user) {
  - kind: para
    text: echo $user->name, "\n";
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p36:
  - kind: heading
    level: 1
    text: 従来記法の欠点
  - kind: list
    items:
    - 配列インデックスの型を指定できない
    - 以下の配列が区別できない
    - '[12 => new User(), 34 => new User()]'
    - '[''太郎'' => new User(), ''花子'' => new User()]'
    - '[new User(''太郎''), new User(''花子'')]'
  p37:
  - kind: heading
    level: 1
    text: PSR-5式の配列記法(ジェネリクス)
  - kind: para
    text: array<int,User>
  - kind: para
    text: array<string,User>
  - kind: list
    items:
    - 配列インデックスの型を指定できる
    - 以下の配列が区別できる
    - '[12 => new User(), 34 => new User()]'
    - '[''太郎'' => new User(), ''花子'' => new User()]'
    - '[new User(''太郎''), new User(''花子'')]'
  - kind: para
    text: list<User>
  p38:
  - kind: heading
    level: 1
    text: 従来多用されていた記法
  - kind: para
    text: /**
  - kind: para
    text: '* @param User[] $users'
  - kind: para
    text: '*/'
  - kind: para
    text: 'function printUsers(array $users): void {'
  - kind: para
    text: foreach ($users as $user) {
  - kind: para
    text: echo $user->name, "\n";
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p39:
  - kind: heading
    level: 1
    text: 旧PSR-5式の記法
  - kind: para
    text: /**
  - kind: para
    text: '* @param array<User> $users'
  - kind: para
    text: '*/'
  - kind: para
    text: 'function printUsers(array $users): void {'
  - kind: para
    text: foreach ($users as $user) {
  - kind: para
    text: echo $user->name, "\n";
  - kind: para
    text: '}'
  - kind: para
    text: '}'
  p40:
  - kind: para
    text: 変数リテラルや定数は @var を避ける
  - kind: list
    items:
    - 静的解析ツールの実装にもよるが、リテラルから構造を分析できる
    - PHPStanなどは構造を読み取ってくれる
    - むやみに書くと情報量が落ちる
