    text: ゴルフ出題するときに
  - kind: heading
    level: 1
    text: 考えていたこと
  - kind: heading
    level: 2
    text: My thoughts on creating code golf challenges.
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2025-04-23 #phpstudy'
  - kind: para
    text: 第175回 PHP勉強会@東京
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - kind: heading
    level: 1
    text: さて
  p4:
  - kind: para
    text: コードゴルフをご存じですか？
  - kind: heading
    level: 1
    text: ⛳
  p5:
  - kind: para
    text: コードゴルフはe-スポーツ
  - kind: list
    items:
    - 普通のゴルフ：
    - ボールを叩いてホールまで運び、1打でも少ない方が勝ち
  p6:
  - kind: para
    text: コードゴルフはe-スポーツ
  - kind: list
    items:
    - 普通のゴルフ：
    - ボールを叩いてホールまで運び、1打でも少ない方が勝ち
    - コードゴルフ：
    - キーを叩いて仕様を満たすコードを書き、1文字でも少ない方が勝ち
  p7:
  - kind: para
    text: コードゴルフはe-スポーツ
  - kind: list
    items:
    - 普通のゴルフ：
    - ボールを叩いてホールまで運び、1打でも少ない方が勝ち
    - コードゴルフ：
    - キーを叩いて仕様を満たすコードを書き、1文字でも少ない方が勝ち
    - Vimゴルフ：
    - キーを叩いてテキストをゴールまで編集し、手順が少ない方が勝ち
  p8: []
  p9: []
  p10:
  - kind: heading
    level: 1
    text: 2020年
  p11:
  - kind: heading
    level: 1
    text: 2024年 (昨年)
  p12:
  - kind: heading
    level: 1
    text: 2025年 (今回)
  p13:
  - kind: para
    text: コードゴルフ作問体制
  - kind: list
    items:
    - 2020年： 「PHPer Code Golf by pixiv」
    - tadsan(私)が単独でゴルフ場建設・作問
    - '2024年: 「コードゴルフ企画」'
    - いまむらさん(nsfisis)が単独でゴルフ場建設・作問
    - '2025年: 「PHPerコードバトル」'
    - いまむらさんがゴルフ場建設・tadsan(私)が作問を担当
  p14:
  - kind: para
    text: ゴルフ場 (playground)
  - kind: list
    items:
    - 参加者が自由に入力したプログラムが実行できる(≒任意コード実行)
    - 悪意を持った利用者が悪用できないようにする必要がある
    - ファイル書き込みでサーバのディスクを埋めて利用不能にするとか…
    - 無限ループでプログラムが永遠に終わらないとか…
    - 外部サービス攻撃の踏み台にされるとか、ビットコイン採掘されるとか…
    - いかに安全に実行できるようにするかは創意工夫の余地がある
  p15: []
  p16:
  - kind: heading
    level: 2
    text: 出題
  - kind: heading
    level: 1
    text: ⛳
  p17:
  - kind: para
    text: 今回の要件
  - kind: list
    items:
    - 標準入出力だけを使う・デフォルト有効化されていないモジュールは不可
    - 競技プログラミング文脈に頼りすぎない
    - 模範解答を開示する
    - 参加者は問題解答だけでなく、文字数を縮めることに集中できる
    - (非機能要件) コンテンツとして観戦して楽しい・わかりやすくする
  p18:
  - kind: heading
    level: 1
    text: 予選問題
  - kind: list
    items:
    - コードゴルフに不慣れな人も参戦するので、コードの難易度としては
  - kind: para
    text: プログラミングの初年度授業の発展課題くらいを「意識」
  - kind: list
    items:
    - ただし、ワンパターンにならないように難易度にこだわりすぎない
  p19:
  - kind: heading
    level: 1
    text: 作問方法
  p20:
  - kind: para
    text: php-play.devを使ったコーディング
  - kind: list
    items:
    - 完全にブラウザ上で動くPHPランタイム
    - ここはstdioが実装されてないが…
    - これを逆手にとって自分で定義してやる
    - PHPで定数にオブジェクトを代入できる
  - kind: para
    text: ようになったのはPHP 8.1からだが…
  p21:
  - kind: para
    text: php-play.devを使ったコーディング
  - kind: list
    items:
    - 完全にブラウザ上で動くPHPランタイム
    - ここはstdioが実装されてないが…
    - これを逆手にとって自分で定義してやる
    - PHPで定数にオブジェクトを代入できる
  - kind: para
    text: ようになったのはPHP 8.1からだが…
  - kind: list
    items:
    - 実はfwrite()の戻り値はリソースなので昔から許されてた
  p22:
  - kind: para
    text: php-play.devのデメリット
  - kind: list
    items:
    - タイムアウトが実装されていない
    - うっかりコードに while(true) とか書いてしまうとブラウザが固まる
    - 後で脱出条件を書こうとするとひっかかる
    - しばらく待ってるとChromeが処理を打ち切ってくれるが、それまで待つ
    - php-playはキーボードを打つたびにhistory.pushStateしてくれるので
  - kind: para
    text: 冷静に戻るボタンを1回押せば無限ループ直前まで帰ってこれる
