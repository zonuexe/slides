text:
  p1:
  - node: p
    children:
    - node: text
      content: 'ゴルフ出題するときに '
    - node: br
    - node: text
      content: 考えていたこと
  - node: p
    children:
    - node: text
      content: My thoughts on creating code golf challenges.
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2025-04-23 #phpstudy '
    - node: br
    - node: bold
      content: 第175回 PHP勉強会@東京
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3:
  - node: p
    children:
    - node: text
      content: さて
  p4:
  - node: p
    children:
    - node: text
      content: 'コードゴルフを ご存じですか？ '
    - node: br
    - node: text
      content: ⛳
  p5:
  - node: p
    children:
    - node: text
      content: コードゴルフはe-スポーツ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 普通のゴルフ：
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ボールを叩いてホールまで運び、1打でも少ない方が勝ち
  p6:
  - node: p
    children:
    - node: text
      content: コードゴルフはe-スポーツ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 普通のゴルフ：
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ボールを叩いてホールまで運び、1打でも少ない方が勝ち
    - node: li
      children:
      - node: text
        content: コードゴルフ：
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: キーを叩いて仕様を満たすコードを書き、1文字でも少ない方が勝ち
  p7:
  - node: p
    children:
    - node: text
      content: コードゴルフはe-スポーツ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 普通のゴルフ：
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ボールを叩いてホールまで運び、1打でも少ない方が勝ち
    - node: li
      children:
      - node: text
        content: コードゴルフ：
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: キーを叩いて仕様を満たすコードを書き、1文字でも少ない方が勝ち
    - node: li
      children:
      - node: text
        content: Vimゴルフ：
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: キーを叩いてテキストをゴールまで編集し、手順が少ない方が勝ち
  p8: []
  p9: []
  p10:
  - node: p
    children:
    - node: text
      content: 2020年
  p11:
  - node: p
    children:
    - node: text
      content: 2024年 (昨年)
  p12:
  - node: p
    children:
    - node: text
      content: 2025年 (今回)
  p13:
  - node: p
    children:
    - node: text
      content: コードゴルフ作問体制
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2020年： 「PHPer Code Golf by pixiv」
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: tadsan(私)が単独でゴルフ場建設・作問
    - node: li
      children:
      - node: text
        content: '2024年: 「コードゴルフ企画」'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: いまむらさん(ns¶sis)が単独でゴルフ場建設・作問
    - node: li
      children:
      - node: text
        content: '2025年: 「PHPerコードバトル」'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: いまむらさんがゴルフ場建設・tadsan(私)が作問を担当
  p14:
  - node: p
    children:
    - node: text
      content: ゴルフ場
  - node: p
    children:
    - node: text
      content: ' (playground)'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 参加者が自由に入力したプログラムが実行できる(≒任意コード実行)
    - node: li
      children:
      - node: text
        content: 悪意を持った利用者が悪用できないようにする必要がある
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ファイル書き込みでサーバのディスクを埋めて利用不能にするとか…
        - node: li
          children:
          - node: text
            content: 無限ループでプログラムが永遠に終わらないとか…
        - node: li
          children:
          - node: text
            content: 外部サービス攻撃の踏み台にされるとか、ビットコイン採掘されるとか…
    - node: li
      children:
      - node: text
        content: いかに安全に実行できるようにするかは創意工夫の余地がある
  p15: []
  p16:
  - node: p
    children:
    - node: text
      content: 出題
  - node: p
    children:
    - node: text
      content: ⛳
  p17:
  - node: p
    children:
    - node: text
      content: 今回の要件
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 標準入出力だけを使う・デフォルト有効化されていないモジュールは不可
    - node: li
      children:
      - node: text
        content: 競技プログラミング文脈に頼りすぎない
    - node: li
      children:
      - node: text
        content: 模範解答を開示する
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 参加者は問題解答だけでなく、文字数を縮めることに集中できる
    - node: li
      children:
      - node: text
        content: (非機能要件) コンテンツとして観戦して楽しい・わかりやすくする
  p18:
  - node: p
    children:
    - node: text
      content: 予選問題
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: コードゴルフに不慣れな人も参戦するので、コードの難易度としては
      - node: br
      - node: text
        content: 'プログラミングの初年度授業の発展課題くらいを「意識」 '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ただし、ワンパターンにならないように難易度にこだわりすぎない
  p19:
  - node: p
    children:
    - node: text
      content: 作問方法
  p20:
  - node: p
    children:
    - node: text
      content: php-play.devを使ったコーディング
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 完全にブラウザ上で動くPHPランタイム
    - node: li
      children:
      - node: text
        content: ここはstdioが実装されてないが…
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: これを逆手にとって自分で定義してやる
    - node: li
      children:
      - node: text
        content: PHPで定数にオブジェクトを代入できる ようになったのはPHP 8.1からだが…
  p21:
  - node: p
    children:
    - node: text
      content: php-play.devを使ったコーディング
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 完全にブラウザ上で動くPHPランタイム
    - node: li
      children:
      - node: text
        content: ここはstdioが実装されてないが…
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: これを逆手にとって自分で定義してやる
    - node: li
      children:
      - node: text
        content: 'PHPで定数にオブジェクトを代入できる ようになったのはPHP 8.1からだが… '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 実はfwrite()の戻り値はリソースなので昔から許されてた
  p22:
  - node: p
    children:
    - node: text
      content: php-play.devのデメリット
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: タイムアウトが実装されていない
    - node: li
      children:
      - node: text
        content: うっかりコードに while(true) とか書いてしまうとブラウザが固まる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 後で脱出条件を書こうとするとひっかかる
        - node: li
          children:
          - node: text
            content: しばらく待ってるとChromeが処理を打ち切ってくれるが、それまで待つ
    - node: li
      children:
      - node: text
        content: php-playはキーボードを打つたびにhistory.pushStateしてくれるので
      - node: br
      - node: text
        content: 冷静に戻るボタンを1回押せば無限ループ直前まで帰ってこれる
  p23: []
  p24: []
  p25: []
  p26:
  - node: p
    children:
    - node: text
      content: ボツ問題
  - node: p
    children:
