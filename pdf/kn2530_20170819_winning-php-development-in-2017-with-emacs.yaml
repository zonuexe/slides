text:
  p1:
  - kind: heading
    level: 1
    text: 2017年の 開発に
  - kind: heading
    level: 1
    text: Emacsで勝つ
  - kind: para
    text: PHP development in Emacs, 2017
  - kind: para
    text: '2017-08-19 NEEC Kamata #opendevcon Open Developers Conference 2017 Tokyo'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社でひたすらPHPやってる p(ixi)v
    - フレームワークなき道にフレームを作るおしごと
    - Qiitaに記事を書いたり変なコメントしてるよ
    - 最近やってること
    - 万難が排されつつあるのでPHP7 移行
    - えいやえいやとテスト書いたり直したりしてる
  p3:
  - kind: heading
    level: 1
    text: 開発してるもの
  - kind: list
    items:
    - PsySH (PHP) - PR/機能追加
    - whoops! (PHP) - PR/機能改善
    - php-mode.el (Emacs Lisp) - PR/機能追加/改善
    - composer.el (Emacs Lisp) - 開発者(オーナー)
    - psysh.el (Emacs Lisp) - 開発者(オーナー)
    - phpunit.el (Emacs Lisp) - 共同メンテナ
    - こまかいのいろいろ
  p4:
  - kind: para
    text: はじめに言っておく
  p5:
  - kind: para
    text: Photoshop
  p6:
  - kind: para
    text: PhpStorm
  p7:
  - kind: para
    text: PhpStorm先生はお前の先輩よりもPHPに詳しい
  p8:
  - kind: para
    text: PhpStorm先生は俺よりもずっとPHPに詳しい
  p9:
  - kind: para
    text: (僕が使ってるのはPHPだからPHPの話をするけど、あなたの使ってる[ﾋﾟｰ]言語も例外ではない)
  p10:
  - kind: para
    text: 僕の仕事＝同僚をPhpStormに改宗させること
  p11:
  - kind: para
    text: しょーもないヒューマンエラーを静的解析の力で捻じ伏せること
  p12:
  - kind: para
    text: 精度の高い静的解析と型推論
  p13:
  - kind: para
    text: それに裏打ちされた、入力補完(メソッド/プロパティ)、定義ジャンプ、未定義検出、型エラー検出、リファクタリング、etc, etc...
  p14:
  - kind: para
    text: いまどきテキストエディタでIDEに対抗しようとすることは、竹槍で戦闘機に対抗しようとすることに等しい
  p15:
  - kind: para
    text: では、なぜEmacsを利用するのか
  p16:
  - kind: para
    text: Emacs=環境
  p17:
  - kind: para
    text: (誇張ではない)
  p18:
  - kind: para
    text: エディタの機能=ただの関数
  p19:
  - kind: para
    text: 標準機能すら上書きできる
  p20:
  - kind: para
    text: 標準機能を置換するべんりパッケージいろいろある
  p21:
  - kind: para
    text: '[ﾋﾟｰ]よりもずっとはやい！'
  p22:
  - kind: para
    text: (Vimよりは遅いかも…)
  p23:
  - kind: para
    text: ともあれ高機能なエディタは好きな機能を組み合せて構築できるフレームワークのようなもの
  p24: []
  p25:
  - kind: heading
    level: 1
    text: 当時紹介したもの (1)
  - kind: para
    text: php-mode.el
  - kind: para
    text: 今も開発してるから入れてくれ頼む
  - kind: para
    text: phpunit.el
  - kind: para
    text: PHPUnitを簡単に実行できる
  - kind: para
    text: psysh.el
  - kind: para
    text: PHPのREPLを実行できる
  - kind: para
    text: 選択範囲のコードを実行したりできる
  p26:
  - kind: heading
    level: 1
    text: 当時紹介したもの (2)
  - kind: para
    text: TRAMP
  - kind: para
    text: sshのファイルを直接編集できる
  - kind: para
    text: Magit
  - kind: para
    text: Gitインターフェイス
  - kind: para
    text: エディタ内でgit blameできる
  - kind: para
    text: magit-find-file
  - kind: para
    text: リポジトリ内の絞り込み検索
  p27:
  - kind: heading
    level: 1
    text: 当時紹介したもの (3)
  - kind: para
    text: php-eldoc
  - kind: para
    text: PHPの標準関数の引数が表示できる
  - kind: para
    text: 標準関数ごときでぐぐってはいけない
  - kind: para
    text: smartchr.el
  - kind: para
    text: キーを連打すると入力文字列が入れ変る
  p28:
  - kind: heading
    level: 1
    text: そのほかべんりなもの
  - kind: para
    text: flycheck
  - kind: para
    text: 文法チェックやLintの非同期実行
  - kind: para
    text: チェッカーを独自実装できる
  - kind: para
    text: Projectile
  - kind: para
    text: プロジェクト管理ツール
  p29:
  - kind: para
    text: プロジェクト固有のマイナーモード
  - kind: para
    text: pixiv-dev.el
  - kind: para
    text: GitHubに置いてあるよ
  - kind: para
    text: べんりコマンドとか
  - kind: para
    text: 社内用のLintツールとか
  p30:
  - kind: para
    text: 弱点
  p31:
  - kind: para
    text: いちいち通信が発生するので、めちゃくちゃ遅い
  p32:
  - kind: para
    text: PhpStorm先生に学ぶ
  p33:
  - kind: heading
    level: 1
    text: automatic deployment
  - kind: para
    text: 保存したファイルを(S)FTPで勝手に送ってくれるやつ
  p34:
  - kind: para
    text: https://github.com/zonuexe/emacs-auto-deployment
  p35:
  - kind: para
    text: まとめ
  p36:
  - kind: para
    text: 素のエディタは竹槍
  p37:
  - kind: para
    text: 勝つには
  p38:
  - kind: para
    text: A. IDEが必要ないほどPHPの仕様に詳しくなる
  p39:
  - kind: para
    text: 俺が人間静的解析器だ
  p40:
  - kind: para
    text: B. いろんなツールやパッケージを組み合せて必要な機能を実現していく
  p41:
  - kind: para
    text: しかし道は険しい
  p42:
  - kind: para
    text: 最終的には快適な開発環境で、バグ起こしにくい開発を実現させることが目的
  p43:
  - kind: para
    text: やっていく気持ち
  p44:
  - kind: para
    text: 最後にお願い
  p45:
  - kind: para
    text: EmacsでのPHP開発で困ってることを共有してほしい
  p46:
  - kind: para
    text: 続きはWebで
  - kind: para
    text: '@tadsan'
  - kind: para
    text: https://github.com/zonuexe/emacs-php-development
size:
  max_width: 1024
  max_height: 768
links: {}
