text:
  p1:
  - kind: heading
    level: 1
    text: 2017年の 開発に
  - kind: heading
    level: 1
    text: Emacsで勝つ
  - kind: para
    text: PHP development in Emacs, 2017
  - kind: para
    text: '2017-08-19 NEEC Kamata #opendevcon'
  - kind: para
    text: Open Developers Conference 2017 Tokyo
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社でひたすらPHPやってる p(ixi)v
    - フレームワークなき道にフレームを作るおしごと
    - Qiitaに記事を書いたり変なコメントしてるよ
    - 最近やってること
    - 万難が排されつつあるのでPHP7 移行
    - えいやえいやとテスト書いたり直したりしてる
  p3:
  - kind: heading
    level: 1
    text: 開発してるもの
  - kind: list
    items:
    - PsySH (PHP) - PR/機能追加
    - whoops! (PHP) - PR/機能改善
    - php-mode.el (Emacs Lisp) - PR/機能追加/改善
    - composer.el (Emacs Lisp) - 開発者(オーナー)
    - psysh.el (Emacs Lisp) - 開発者(オーナー)
    - phpunit.el (Emacs Lisp) - 共同メンテナ
    - こまかいのいろいろ
  p4:
  - kind: para
    text: はじめに
  - kind: para
    text: 言っておく
  p5:
  - kind: para
    text: Photoshop
  p6:
  - kind: para
    text: PhpStorm
  p7:
  - kind: para
    text: PhpStorm先生は
  - kind: para
    text: お前の先輩よりも
  - kind: para
    text: PHPに詳しい
  p8:
  - kind: para
    text: PhpStorm先生は
  - kind: para
    text: 俺よりもずっと
  - kind: para
    text: PHPに詳しい
  p9:
  - kind: para
    text: (僕が使ってるのはPHPだ
  - kind: para
    text: からPHPの話をするけど、
  - kind: para
    text: あなたの使ってる
  - kind: para
    text: '[ﾋﾟｰ]言語も例外ではない)'
  p10:
  - kind: para
    text: 僕の仕事
  - kind: para
    text: ＝
  - kind: para
    text: 同僚をPhpStorm
  - kind: para
    text: に改宗させること
  p11:
  - kind: para
    text: しょーもないヒュー
  - kind: para
    text: マンエラーを
  - kind: para
    text: 静的解析の力で捻
  - kind: para
    text: じ伏せること
  p12:
  - kind: para
    text: 精度の高い
  - kind: para
    text: 静的解析と型推論
  p13:
  - kind: para
    text: それに裏打ちされた、
  - kind: para
    text: 入力補完(メソッド/プロパティ)、定
  - kind: para
    text: 義ジャンプ、未定義検出、型エ
  - kind: para
    text: ラー検出、リファクタリング、
  - kind: para
    text: etc, etc...
  p14:
  - kind: para
    text: いまどきテキストエディ
  - kind: para
    text: タでIDEに対抗しよう
  - kind: para
    text: とすることは、竹槍で
  - kind: para
    text: 戦闘機に対抗しようと
  - kind: para
    text: することに等しい
  p15:
  - kind: para
    text: では、なぜ
  - kind: para
    text: Emacsを
  - kind: para
    text: 利用するのか
  p16:
  - kind: para
    text: Emacs=環境
  p17:
  - kind: para
    text: (誇張ではない)
  p18:
  - kind: para
    text: エディタの機能
  - kind: para
    text: =ただの関数
  p19:
  - kind: para
    text: 標準機能すら
  - kind: para
    text: 上書きできる
  p20:
  - kind: para
    text: 標準機能を置換する
  - kind: para
    text: べんりパッケージ
  - kind: para
    text: いろいろある
  p21:
  - kind: para
    text: '[ﾋﾟｰ]よりも'
  - kind: para
    text: ずっとはやい！
  p22:
  - kind: para
    text: (Vimよりは遅いかも…)
  p23:
  - kind: para
    text: ともあれ高機能なエディタは
  - kind: para
    text: 好きな機能を
  - kind: para
    text: 組み合せて構築できる
  - kind: para
    text: フレームワークのようなもの
  p24: []
  p25:
  - kind: heading
    level: 1
    text: 当時紹介したもの (1)
  - kind: para
    text: php-mode.el
  - kind: para
    text: 今も開発してるから入れてくれ頼む
  - kind: para
    text: phpunit.el
  - kind: para
    text: PHPUnitを簡単に実行できる
  - kind: para
    text: psysh.el
  - kind: para
    text: PHPのREPLを実行できる
  - kind: para
    text: 選択範囲のコードを実行したりできる
  p26:
  - kind: heading
    level: 1
    text: 当時紹介したもの (2)
  - kind: para
    text: TRAMP
  - kind: para
    text: sshのファイルを直接編集できる
  - kind: para
    text: Magit
  - kind: para
    text: Gitインターフェイス
  - kind: para
    text: エディタ内でgit blameできる
  - kind: para
    text: magit-find-file
  - kind: para
    text: リポジトリ内の絞り込み検索
  p27:
  - kind: heading
    level: 1
    text: 当時紹介したもの (3)
  - kind: para
    text: php-eldoc
  - kind: para
    text: PHPの標準関数の引数が表示できる
  - kind: para
    text: 標準関数ごときでぐぐってはいけな
  - kind: para
    text: い
  - kind: para
    text: smartchr.el
  - kind: para
    text: キーを連打すると入力文字列が
  - kind: para
    text: 入れ変る
  p28:
  - kind: heading
    level: 1
    text: そのほかべんりなもの
  - kind: para
    text: flycheck
  - kind: para
    text: 文法チェックやLintの非同期実行
  - kind: para
    text: チェッカーを独自実装できる
  - kind: para
    text: Projectile
  - kind: para
    text: プロジェクト管理ツール
  p29:
  - kind: para
    text: プロジェクト固有のマイナーモード
  - kind: para
    text: pixiv-dev.el
  - kind: para
    text: GitHubに置いてあるよ
  - kind: para
    text: べんりコマンドとか
  - kind: para
    text: 社内用のLintツールとか
  p30:
  - kind: para
    text: 弱点
  p31:
  - kind: para
    text: いちいち通信が発生する
  - kind: para
    text: ので、めちゃくちゃ遅い
  p32:
  - kind: para
    text: PhpStorm先生に
  - kind: para
    text: 学ぶ
  p33:
  - kind: heading
    level: 1
    text: automatic deployment
  - kind: para
    text: 保存したファイルを(S)FTPで
  - kind: para
    text: 勝手に送ってくれるやつ
  p34:
  - kind: para
    text: https://github.com/zonuexe/emacs-auto-deployment
  p35:
  - kind: para
    text: まとめ
  p36:
  - kind: para
    text: 素のエディタは
  - kind: para
    text: 竹槍
  p37:
  - kind: para
    text: 勝つには
  p38:
  - kind: para
    text: A. IDEが必要ないほど
  - kind: para
    text: PHPの仕様に詳しくなる
  p39:
  - kind: para
    text: 俺が
  - kind: para
    text: 人間静的解析器だ
  p40:
  - kind: para
    text: B. いろんなツールやパッ
  - kind: para
    text: ケージを組み合せて必要
  - kind: para
    text: な機能を実現していく
  p41:
  - kind: para
    text: しかし道は
  - kind: para
    text: 険しい
  p42:
  - kind: para
    text: 最終的には快適な
  - kind: para
    text: 開発環境で、
  - kind: para
    text: バグ起こしにくい
  - kind: para
    text: 開発を実現させる
  - kind: para
    text: ことが目的
  p43:
  - kind: para
    text: やっていく
  - kind: para
    text: 気持ち
  p44:
  - kind: para
    text: 最後にお願い
  p45:
  - kind: para
    text: EmacsでのPHP開
  - kind: para
    text: 発で困ってること
  - kind: para
    text: を共有してほしい
  p46:
  - kind: para
    text: 続きはWebで
  - kind: para
    text: '@tadsan'
  - kind: para
    text: https://github.com/zonuexe/emacs-php-development
