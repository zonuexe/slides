  - kind: para
    text: '@extrbs という怪しい型も書ける'
  p54:
  - kind: para
    text: なぜrbs-inlineに一本化できないのか
  - kind: list
    items:
    - '# @rbs は、あくまで型情報に -- でコメントを載せる記法'
    - 主役は型だと認識している
    - '#: はRBS系エコシステムだけでなくSorbetも読み取るので、'
  - kind: para
    text: RBS仕様外の型情報を載せるのはあまりよくない
  - kind: list
    items:
    - Pythonの型宣言も実行時に読み飛ばされるが、ツールごとの非互換に弱い
    - '# @extrbs にRigorのRBS::Extendedをコメントに載せられる'
  p55:
  - kind: para
    text: 作り始めたばかりなので乞うご期待
