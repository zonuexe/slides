      - node: text
        content: エラーチェックのボイラープレートがｸﾞｯと減る SQLi(脆弱性)のリスクなし
    - node: li
      children:
      - node: text
        content: :hoge@int  で整数の埋め込み、 :fuga_ids@int[] で複数の整数を展開
      - node: br
      - node: text
        content: する %if や %for の記法で条件分岐や複数SETなども可能
  p39:
  - node: p
    children:
    - node: text
      content: PxvSql
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 問題意識はQiitaに書いた
  p40:
  - node: p
    children:
    - node: text
      content: TetoSQL
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: tadsanが個人の責任で再実装したバージョン (PHP≧5.4)
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: https://github.com/BaguettePHP/TetoSQL
    - node: li
      children:
      - node: text
        content: 記法を自由に拡張できるように作られている
    - node: li
      children:
      - node: text
        content: 各社で必要な記法や型を柔軟に実装することも可能！
  p41:
  - node: p
    children:
    - node: text
      content: PDOのラッパー
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: これは、少なくとも2011年以前からあった仕組み
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 書き込み用(master)と読み込み用(slave)を明示的に分けて利用可能
        - node: li
          children:
          - node: text
            content: slaveにINSERTやUPDATEなどのクエリを発行しようとすると例外
    - node: li
      children:
      - node: text
        content: 全クエリにSQLのクエリ単一行にして、トレースをコメントにして埋め込む
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: スロークエリのログにどのコントローラに起因するか集計しやすいスロークエ
          - node: br
          - node: text
            content: 'リを一覧できるビューアーもある '
        - node: li
          children:
          - node: text
            content: 最近ではDatadogのAPMを使えば不要になるかもしれない
  p42:
  - node: p
    children:
    - node: text
      content: 新機能のリリース時にどうする？
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'A: 新機能が実装されたブランチをリリースするときマージする'
    - node: li
      children:
      - node: text
        content: 'B: リリース前にあらかじめマージして、実行されないようにしておく'
    - node: li
      children:
      - node: text
        content: よくある問題
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Aは機能の規模が大きいとビッグバンマージを引き起こし、
          - node: br
          - node: text
            content: '予期せぬ問題を引き起こすことがある (コンフリクト解決が大変) '
        - node: li
          children:
          - node: text
            content: 理想としてはBで、一般ユーザー向けに実行されないとしても
          - node: br
          - node: text
            content: 鮮度のよいうちにマージしておきたい (リリース時の変更を最小限に)
  p43:
  - node: p
    children:
    - node: text
      content: 機能の有効化／無効化
  - node: p
    children:
    - node: text
      content: if ($_SERVER['REMOTE_ADDR'] === OFFICE_IP) {
    - node: br
    - node: text
      content: '    hogehoge();'
    - node: br
    - node: text
      content: '}'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 新しい機能をサービスに実装して、社内でだけ有効化したいとする
    - node: li
      children:
      - node: text
        content: 無造作にこんなコードを書かれると後から意味不明になるそもそも社外と社
      - node: br
      - node: text
        content: 内での挙動が別物になるので嫌な予感しかしない
  p44:
  - node: p
    children:
    - node: text
      content: フィーチャートグル
  - node: p
    children:
    - node: text
      content: if (ABTest_DevToggle::isEnabledDevToggle('hogeFunc')) {
    - node: br
    - node: text
      content: '    hogehoge();'
    - node: br
    - node: text
      content: '}'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 専用のコンソール画面でボタンを押すことで有効化／無効化される
    - node: li
      children:
      - node: text
        content: 設定を一行足すだけで一般ユーザーに対してリリースできる
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: リリース後に障害などが発生しないことが確認できたらifを消す
    - node: li
      children:
      - node: text
        content: 元はA/Bテストのための機構だった (一般ユーザーに対して確率で適用)
  p45:
  - node: p
    children:
    - node: text
      content: まとめ
  p46:
  - node: p
    children:
    - node: text
      content: 何もない野原に秩序をつくる
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: べんり機能を導入すると、部分的に生産性が体感で数倍になったりする
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 一からサービスを作るとしたら同じことを繰り返せるかは、悩む
        - node: li
          children:
          - node: text
            content: いまならLaravelを入れるかもしれないが、それは未来人だからできる発言
        - node: li
          children:
          - node: text
            content: サービスの価値はコードではなく、その結果のユーザー体験
        - node: li
          children:
          - node: text
            content: フレームワークがなかったとしても、
          - node: br
          - node: text
            content: pixivが2007年からユーザーに価値を提供してきた結果は変らない
  p47:
