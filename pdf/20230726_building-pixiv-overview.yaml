  p1:
  - kind: heading
    level: 1
    text: ふつうのpixivのつくりかた
  - kind: heading
    level: 2
    text: An introduction to building pixiv for ordinary PHPers
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2023-07-26 PHP の今を語る！4社合同勉強会
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人
  p3:
  - kind: heading
    level: 1
    text: PHPカンファレンス沖縄2023
  p4:
  - kind: heading
    level: 1
    text: LLイベント
  p5:
  - kind: heading
    level: 1
    text: の紹介
  p6:
  - kind: para
    text: pixiv.netとは
  - kind: list
    items:
    - “好き”に出会えるイラスト・マンガ・小説作品の投稿プラットフォーム
    - 2007年9月10日に開始
    - '累計登録ユーザー数: 約9300万ID'
    - '累計作品投稿作品数: 約1.2億作品 (うち小説1900万作品)'
    - 'イラストブックマーク: 約200億件'
    - Web・スマートフォンアプリで展開
  p7:
  - kind: heading
    level: 1
    text: ThePHPF
  p8:
  - kind: heading
    level: 1
    text: OSPO
  p9:
  - kind: heading
    level: 1
    text: 'ふつう #とは'
  p10:
  - kind: para
    text: フレームワークが
  - kind: para
    text: 使われていない
  p11:
  - kind: heading
    level: 1
    text: ただのPHP
  p12:
  - kind: heading
    level: 1
    text: ※諸説あります
  p13:
  - kind: para
    text: 諸説ありますが難しい構造には
  - kind: para
    text: なってない
  p14:
  - kind: para
    text: メタプログラミングは
  - kind: para
    text: 基本的にあまりやらない
  p15:
  - kind: para
    text: (こっそり使ってる
  - kind: para
    text: 部分もありますが大筋は追えるはず)
  p16:
  - kind: para
    text: PHP詳しくない人でも
  - kind: para
    text: 雰囲気に従って書けばセキュリティの問題は
  - kind: para
    text: 起こさないように
  p17:
  - kind: para
    text: pixivのPHP
  - kind: list
    items:
    - PHPはApache+mod_php (一時fpmを使っていたこともある)
    - nginxからリバースプロキシしてApacheにリクエスト
    - PHPそのものは独自でビルドしてはいるがプレーン
    - DocumentRootにある.phpファイルから処理を辿っていけば全部わかる
    - LinuxとかMySQLとかよくあるLAMPスタックに載っている
  p18:
  - kind: heading
    level: 1
    text: よくある質問
  - kind: list
    items:
    - フレームワークは使ってないの？
    - 使ってません。マイクロフレームワークのようなものはいくつかある
    - べんりユーティリティの集合でフレームワークに似ているが実態はラッパー
    - フレームワーク／言語の移行やフルスクラッチしないの…？
    - 直近での予定はありません。過去に痛い目にも遭ってるし
  p19:
  - kind: heading
    level: 1
    text: 10年前のコードのイメージ
  - kind: para
    text: include_onceいっぱい
  - kind: para
    text: エラーハンドリング(してないページもあった)
  - kind: para
    text: <?php // www.pixiv.net/htdocs/hoge.php require_once __DIR__ . '/../inc/bootstrap.php';include_once
      INC_PATH . '/Hoge/Fuga.php';include_once INC_PATH . '/Hoge/Piyo.class.php';try
      {display()} catch (Exception $e) {error::exception_error($e);}
  - kind: para
    text: この下にもいっぱい
  - kind: para
    text: ファイルローカルな
  - kind: para
    text: function display() {// ...
  - kind: para
    text: グローバル関数
  p20:
  - kind: heading
    level: 1
    text: 2015年のコードのイメージ
  - kind: para
    text: <?php // www.pixiv.net/htdocs/hoge.php require_once __DIR__ . '/../inc/bootstrap.php';
  - kind: para
    text: include_once一個だけ
  - kind: para
    text: AppRunner::execute(new Www_HogeController);
  - kind: para
    text: このクラスは自動ロードされる
  p21:
  - kind: heading
    level: 1
    text: 2018年のコードのイメージ
  - kind: para
    text: htdocs/hoge.phpは消滅
  - kind: para
    text: URLとファイルは切り離され
  - kind: para
    text: マップの一要素に
  - kind: para
    text: 全URLが1ファイルに
  - kind: para
    text: final class Controller_WwwRoutes {public static function getRoutes() {$route_map
      = ['/' => ['action' => function () {Www_IndexController::main();},],'/hoge.php'
      => ['action' => function () {Www_HogeController::main();},
  p22:
  - kind: heading
    level: 1
    text: PHPカンファレンス2017で発表
  p23:
  - kind: heading
    level: 1
    text: 2023年こうなりたい
  - kind: para
    text: '... ですっきり'
  - kind: para
    text: <?php // WwwRoutes.php public static function getRoutes() {return ['/' =>
      Www_View_IndexController::main(...),'/hoge' => Www_View_HogeController::main(...),'/.well-known/change-password'
      => fn() =>Util_Http::redirect_and_exit(ReverseRoute::fullAccountsPasswordChange([])),],
  p24:
  - kind: heading
    level: 1
    text: コントローラをdispatchする処理
  - kind: para
    text: <?php
  - kind: para
    text: whoops
  - kind: para
    text: final class PCAppRunner {public static function execute(Closure $action)
      {try {Controller_Util::turnOnWhoops();Controller_Util::redirectToHttps();
  - kind: para
    text: パソコン版
  - kind: para
    text: $action();} catch (\Throwable $exception) {PCAppRunner::setHttpStatus(500);Controller_Util::displayWhoops($exception);
  p25:
  - kind: para
    text: 開発しやすさのための取り組み
  p26:
  - kind: para
    text: CI (Jenkins, GitLab CI)
  - kind: list
    items:
    - GitLabにブランチをpush、MergeRequestを作るとCIが走る
    - PHPUnit、PHPStanと独自の正規表現ベースのlinterでチェック
    - PHPStanは2018年から運用開始
    - 時間帯にもよるけどpushして10分かからずに結果がコメントされる
  p27:
  - kind: para
    text: PHPで開発しにくいところ
  - kind: list
    items:
    - 外部入力(クエリパラメータ・フォーム・JSON)の取得・検証
    - PDOの機能の貧弱さ
    - テンプレートエンジンとURLの問題
    - RailsやLaravelにあるようなカッコイイ機能がない
    - かっこいいエラー表示
    - 対話環境/REPL (rails console)
  p28:
  - kind: heading
    level: 1
    text: クエリパラメータの問題
  - kind: para
    text: $id = $_GET['user_id'];if (is_numeric($id)) User_Common::getById($id);else
      error("不正な入力です");
  - kind: list
    items:
    - こういうコードを書いてはいけない
    - クエリパラメータに数字ではない値が入ってくる可能性
    - 入力が空、入力が任意の文字列、入力が不正な数字列、入力が配列
  - kind: heading
    level: 2
    text: filter_input() をかけると安全にはなるが、それでも面倒
  p29:
  - kind: para
    text: ParamHelper
  - kind: para
    text: $id = ParamHelper::get('id')->asPositiveInt();$user = User_Common::getById($id);
  - kind: list
    items:
    - 外部入力から値を取り出すヘルパー
    - クエリパラメータ・フォーム・URL・JSONなどに対応・拡張可能
    - 未入力や不正な入力があると例外を投げる
    - キャッチしてエラー画面を描画する
  p30:
  - kind: para
    text: ParamHelper
  - kind: para
    text: $mode = ParamHelper::get('mode')->asStringInArray['hoge', 'fuga']);
  - kind: list
    items:
    - ?mode=hoge または ?mode=fuga のみを期待するようなパターン
    - 不正な形式や ?mode=piyo のような期待しない入力で例外を投げる
    - PHPStan拡張で 'hoge'|'fuga' という型をつけている
    - 型安全と実行時安全の両立！ (PHPカンファレンス沖縄で話します)
  p31:
  - kind: heading
    level: 1
    text: テンプレートとURL生成の問題
  - kind: para
    text: <a href="{$smarty.const.SYSTEM_URL_WWW|escape}member_illust.php?id={$user.id|escape}">{$user.name|escape}</a>
  - kind: list
    items:
    - こういうコードを書くと事故が入り込みやすい
    - 純粋にtypoの危険性
    - idなどのパラメータに不正な値を入れるリスク
  p32:
  - kind: list
    items:
    - ReverseRoute
  - kind: para
    text: <a href="{reverse_route page='fullWwwMemberProfile' id=$user.id}">{$user.name|escape}</a>
  - kind: list
    items:
    - あるページに名前をつけて、reverse_route関数に page 引数で渡す
    - 生成結果は変更前と同じ
    - ルーティングの逆関数にあたるので、一部のフレームワークは
  - kind: heading
    level: 1
    text: ReverseRoutingやURLヘルパーなどの名前でサポートしてる
  p33:
  - kind: list
    items:
    - ReverseRoute
  - kind: para
    text: '/*** @route\example https://www.pixiv.net/member.php?id=12345 {id: 12345}*
      @route\example https://www.pixiv.net/member.php?id=12345&utm_source=xxxxx{id:
      12345, utm_source: "xxxxx"}*/public static function fullWwwMemberProfile(array
      $params){Util_Assert::num($params[''id'']);'
  - kind: para
    text: return ReverseRoute::buildUrl(SYSTEM_URL_WWW, '/member.php', ['id'],$params);}
  p34:
  - kind: list
    items:
    - Attribute最高！！
  - kind: para
    text: '#[RouteExample(''https://www.pixiv.net/member.php?id=12345'', [''id''=>
      12345])#[RouteExample(''https://www.pixiv.net/member.php?id=12345&utm_source=xxxxx,[''id''
      => 12345, ''utm_source'' => ''xxxxx''])public static function fullWwwMemberProfile(array
      $params){Util_Assert::num($params[''id'']);'
  - kind: para
    text: return ReverseRoute::buildUrl(SYSTEM_URL_WWW, '/member.php', ['id'],$params);}
  p35:
  - kind: heading
    level: 1
    text: blogに書きました
  - kind: heading
    level: 2
    text: https://devpixiv.hatenablog.com/entry/2016/10/25/093000
  p36:
  - kind: heading
    level: 1
    text: PDOの問題
  - kind: list
    items:
    - SQLは自動生成じゃなくて手で書きたい…
  - kind: para
    text: でもPDOで複雑なクエリを書こうとすると文字列結合が避けられない…
  - kind: list
    items:
    - 'PDOで書きにくいクエリの代表例: id IN (1, 2, 3)'
    - もう ? を並べてインデックスをインクリメントしながらbindValueはやだ…
    - PDOのクエリのplaceholderに ? を書くか :hoge で書くか問題
    - 型チェックできるように書くのもちょっとめんどう
    - だからテンプレートエンジンを作ろう → PxvSql
  p37:
  - kind: heading
    level: 1
    text: PxvSql
  p38:
  - kind: para
    text: PxvSql
  - kind: list
    items:
    - 文字列結合を一切やらなくてもクエリが書けるようになった
    - 実行時に型検査をするのでnullなどの不穏な値は入り込まない
    - エラーチェックのボイラープレートがｸﾞｯと減る SQLi(脆弱性)のリスクなし
    - :hoge@int で整数の埋め込み、 :fuga_ids@int[] で複数の整数を展開
  - kind: para
    text: する %if や %for の記法で条件分岐や複数SETなども可能
  p39:
  - kind: para
    text: PxvSql
  - kind: list
    items:
    - 問題意識はQiitaに書いた
  p40:
  - kind: para
    text: TetoSQL
  - kind: list
    items:
    - tadsanが個人の責任で再実装したバージョン (PHP≧5.4)
    - https://github.com/BaguettePHP/TetoSQL
    - 記法を自由に拡張できるように作られている
    - 各社で必要な記法や型を柔軟に実装することも可能！
  p41:
  - kind: heading
    level: 1
    text: PDOのラッパー
  - kind: list
    items:
    - これは、少なくとも2011年以前からあった仕組み
    - 書き込み用(master)と読み込み用(slave)を明示的に分けて利用可能
    - slaveにINSERTやUPDATEなどのクエリを発行しようとすると例外
    - 全クエリにSQLのクエリ単一行にして、トレースをコメントにして埋め込む
    - スロークエリのログにどのコントローラに起因するか集計しやすいスロークエ
  - kind: para
    text: リを一覧できるビューアーもある
  - kind: list
    items:
    - 最近ではDatadogのAPMを使えば不要になるかもしれない
  p42:
  - kind: heading
    level: 1
    text: 新機能のリリース時にどうする？
  - kind: list
    items:
    - 'A: 新機能が実装されたブランチをリリースするときマージする'
    - 'B: リリース前にあらかじめマージして、実行されないようにしておく'
    - よくある問題
    - Aは機能の規模が大きいとビッグバンマージを引き起こし、
  - kind: para
    text: 予期せぬ問題を引き起こすことがある (コンフリクト解決が大変)
  - kind: list
    items:
    - 理想としてはBで、一般ユーザー向けに実行されないとしても
  - kind: para
    text: 鮮度のよいうちにマージしておきたい (リリース時の変更を最小限に)
  p43:
  - kind: heading
    level: 1
    text: 機能の有効化／無効化
  - kind: para
    text: if ($_SERVER['REMOTE_ADDR'] === OFFICE_IP) {hogehoge();}
  - kind: list
    items:
    - 新しい機能をサービスに実装して、社内でだけ有効化したいとする
    - 無造作にこんなコードを書かれると後から意味不明になるそもそも社外と社
  - kind: heading
    level: 2
    text: 内での挙動が別物になるので嫌な予感しかしない
  p44:
  - kind: heading
    level: 1
    text: フィーチャートグル
  - kind: para
    text: if (ABTest_DevToggle::isEnabledDevToggle('hogeFunc')) {hogehoge();}
  - kind: list
    items:
    - 専用のコンソール画面でボタンを押すことで有効化／無効化される
    - 設定を一行足すだけで一般ユーザーに対してリリースできる
    - リリース後に障害などが発生しないことが確認できたらifを消す
    - 元はA/Bテストのための機構だった (一般ユーザーに対して確率で適用)
  p45:
  - kind: heading
    level: 1
    text: まとめ
  p46:
  - kind: heading
    level: 1
    text: 何もない野原に秩序をつくる
  - kind: list
    items:
    - べんり機能を導入すると、部分的に生産性が体感で数倍になったりする
    - 一からサービスを作るとしたら同じことを繰り返せるかは、悩む
    - いまならLaravelを入れるかもしれないが、それは未来人だからできる発言
    - サービスの価値はコードではなく、その結果のユーザー体験
    - フレームワークがなかったとしても、
  - kind: para
    text: pixivが2007年からユーザーに価値を提供してきた結果は変らない
  p47:
  - kind: para
    text: まとめ
  - kind: list
    items:
    - 今回の内容はPHPカンファレンス関西2018で発表したスライド
    - 2018年以来、良くも悪くもAPIが非常に安定している
    - そろそろPHP 8.2に全面移行できるので、次のスタンダードを考えたい
    - AttributesはPHP 8に全面移行できていなくても使えるので先行導入
    - pixivで開発者体験と安全性のフォーカスしたアプリケーションを
  - kind: para
    text: いっしょに開発していきましょう！！！！
  p48:
  - kind: heading
    level: 1
    text: 続きはWebで (あとWEB+DB PRESS)
  - kind: list
    items:
    - pixiv FANBOX @tadsan
    - pixiv inside
    - DocCommentでPHPのユニットテストの書きやすさを劇的に改善する手法
    - WEB+DB PRESS連載『PHP大規模開発入門』を振り返る
    - pixivの基盤ノウハウ大公開！PHPカンファレンス2017登壇レポート
  p49:
  - kind: heading
    level: 1
    text: 続きはWebで (あとWEB+DB PRESS)
  - kind: list
    items:
    - Qiita
    - 憂鬱なSQLのためのアレ、またはPDOと仲良くして枕を高くしてねむる
    - PSRの誤解
    - インスパイヤされて掲示板を作りたくなった シリーズ
    - includeって書きたくない僕たちのためのオートローディングとComposer
    - GitHub
    - whoopsやエラー処理の例 https://github.com/zonuexe/wdb-php-96-sample
  p50:
  - kind: heading
    level: 1
    text: 続きはWebで (あとWEB+DB PRESS)
  - kind: list
    items:
    - これ一冊を購入すれば歴代のPHP連載が全部
  - kind: para
    text: 読めるのでおすすめ
  - kind: list
    items:
    - まとめ https://inside.pixiv.blog/tadsan/3991
    - 今回の内容に近いものだと
    - vol.81, vol.87, vol.91, vol.94, vol. 96
    - 買って読んでね！ Webにサンプルコードもあるよ
