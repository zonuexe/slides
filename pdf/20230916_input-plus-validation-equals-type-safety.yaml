text:
  p1:
  - kind: heading
    level: 1
    text: 入力＋検査＝型安全
  - kind: heading
    level: 2
    text: Make PHP type safe by validating input
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: 2023-09-16 PHPカンファレンス沖縄2023
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
    - 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
    - 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - Emacs PHP Modeを開発しています (2017年-)
    - プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3: []
  p4: []
  p5:
  - kind: heading
    level: 1
    text: さて
  p6:
  - kind: heading
    level: 1
    text: 型、つけてますか？
  p7:
  - kind: para
    text: PHPの進化は型宣言の進化
  p8:
  - kind: heading
    level: 1
    text: 型がついていない関数(PHP5)
  - kind: para
    text: function add($a, $b) {return $a + $b;}
  p9:
  - kind: heading
    level: 1
    text: スカラー型宣言(PHP7)
  - kind: para
    text: int + intって本当にintなの？
  - kind: para
    text: 'function add(int $a, int $b): int {return $a + $b;}'
  p10:
  - kind: heading
    level: 1
    text: 広い値をとるにはfloatが必要
  - kind: para
    text: ひとつの解決策ではあるが… 不必要にfloatを強制するのか
  - kind: para
    text: 'function add(float $a, float $b): float {return $a + $b;}'
  p11:
  - kind: heading
    level: 1
    text: PHPDocの型注釈(アノテーション)
  - kind: para
    text: あえて型宣言を省略する
  - kind: para
    text: /*** @param int|float $a* @param int|float $b* @return int|float*/function
      add($a, $b) {return $a + $b;}
  p12:
  - kind: heading
    level: 1
    text: ユニオン型宣言 (PHP8.0)
  - kind: para
    text: 'function add(int|float $a, int|float $b): int|float {return $a + $b;}'
  p13:
  - kind: para
    text: いたるところに型が書けるようになった
  p14:
  - kind: heading
    level: 1
    text: PHP Static Analysis Tool
  p15:
  - kind: para
    text: PHPStanとは
  - kind: list
    items:
    - 2016年から開発されているPHPの静的解析ツール
    - Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
  - kind: para
    text: 高速な解析を実現していた
  - kind: list
    items:
    - 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p16: []
  p17:
  - kind: para
    text: 201X年、PHPは型の炎に包まれた!!
  p18:
  - kind: para
    text: いまやPHPは静的型付きと言っても過言ではない(本当か…？)
  p19:
  - kind: para
    text: だが型なしは滅びていなかった
  p20:
  - kind: para
    text: 型なしはどこからくるの？
  p21:
  - kind: heading
    level: 1
    text: 今回のお題
  p22:
  - kind: heading
    level: 1
    text: そうです
  p23:
  - kind: heading
    level: 1
    text: 今回のお題
  p24:
  - kind: para
    text: みなさんに覚えておいてほしいこと
  p25:
  - kind: heading
    level: 1
    text: 型なしとは何か
  p26:
