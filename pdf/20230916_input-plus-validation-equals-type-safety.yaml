text:
  p1:
  - node: p
    children:
    - node: text
      content: 入力＋検査＝型安全
  - node: p
    children:
    - node: text
      content: Make PHP type safe by validating input
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2023-09-16 '
  - node: p
    children:
    - node: bold
      content: PHPカンファレンス沖縄2023
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 Webエンジニアリングチーム PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 2012年末から現職、APIとかCIとかいろいろなところを見つめてきました
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)も開発しています
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: プログラミング言語にちょっとこだわりのある素人 (spcamp2010)
  p3: []
  p4: []
  p5:
  - node: p
    children:
    - node: text
      content: さて
  p6:
  - node: p
    children:
    - node: text
      content: 型､つけてますか？
  p7:
  - node: p
    children:
    - node: text
      content: PHPの進化は 型宣言の進化
  p8:
  - node: p
    children:
    - node: text
      content: 型がついていない関数(PHP5)
  - node: p
    children:
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p9:
  - node: p
    children:
    - node: text
      content: スカラー型宣言(PHP7)
  - node: p
    children:
    - node: text
      content: 'int + intって '
    - node: br
    - node: text
      content: 本当にintなの？
  - node: p
    children:
    - node: text
      content: 'function add(int $a, int $b): int {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p10:
  - node: p
    children:
    - node: text
      content: 広い値をとるにはﬂoatが必要
  - node: p
    children:
    - node: text
      content: 'ひとつの解決策では '
    - node: br
    - node: text
      content: あるが… 不必要に(cid:152)oat
    - node: br
    - node: text
      content: を強制するのか
  - node: p
    children:
    - node: text
      content: 'function add(float $a, float $b): float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p11:
  - node: p
    children:
    - node: text
      content: PHPDocの型注釈
  - node: p
    children:
    - node: text
      content: (アノテーション)
  - node: p
    children:
    - node: text
      content: /**
    - node: br
    - node: text
      content: ' * @param int|float $a'
  - node: p
    children:
    - node: text
      content: あえて型宣言を省略する
  - node: p
    children:
    - node: text
      content: ' * @param int|float $b'
    - node: br
    - node: text
      content: ' * @return int|float'
    - node: br
    - node: text
      content: ' */         '
    - node: br
    - node: text
      content: function add($a, $b) {
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p12:
  - node: p
    children:
    - node: text
      content: ユニオン型宣言 (PHP8.0)
  - node: p
    children:
    - node: text
      content: 'function add(int|float $a, int|float $b): int|float {'
    - node: br
    - node: text
      content: '    return $a + $b;'
    - node: br
    - node: text
      content: '}'
  p13:
  - node: p
    children:
    - node: text
      content: いたるところに型が 書けるようになった
  p14:
  - node: p
    children:
    - node: text
      content: PHP Static Analysis Tool
  p15:
  - node: p
    children:
    - node: text
      content: PHPStanとは
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 2016年から開発されているPHPの静的解析ツール
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Ondřej Mirtesさんの個人プロジェクト、2021年からフルタイム開発
    - node: li
      children:
      - node: text
        content: 開発当初は純粋な静的解析ではなく実行時リフレクションを用いることで
      - node: br
      - node: text
        content: '高速な解析を実現していた '
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 現在は静的解析がデフォルトで、レガシープロジェクトに導入しやすくなった
    - node: li
      children:
      - node: text
        content: その他のPHP静的解析ツールにはPsalm, Phan, Qodana(PhpStorm)
  p16: []
  p17:
  - node: p
    children:
    - node: text
      content: 201X年､PHPは 型の炎に包まれた!!
  p18:
  - node: p
    children:
    - node: text
      content: 'いまやPHPは '
    - node: br
    - node: text
      content: 静的型付きと言っても
    - node: br
    - node: text
      content: '過言ではない '
    - node: br
    - node: text
      content: (本当か…？)
  p19:
  - node: p
    children:
    - node: text
      content: 'だが型なしは '
    - node: br
    - node: text
      content: 滅びていなかった
  p20:
  - node: p
    children:
    - node: text
      content: '型なしは '
    - node: br
    - node: text
      content: どこからくるの？
  p21:
  - node: p
    children:
    - node: text
      content: 今回のお題
  p22:
  - node: p
    children:
    - node: text
      content: そうです
  p23:
  - node: p
    children:
    - node: text
      content: 今回のお題
  p24:
  - node: p
    children:
    - node: text
      content: 'みなさんに '
    - node: br
    - node: text
      content: '覚えておいて '
    - node: br
    - node: text
      content: ほしいこと
  p25:
  - node: p
    children:
    - node: text
      content: 型なしとは何か
  p26:
  - node: p
    children:
    - node: text
      content: 'Validation '
  p27:
  - node: p
    children:
    - node: text
      content: 'Validation '
    - node: br
    - node: text
      content: 'Sanitize '
  p28:
  - node: p
    children:
    - node: text
      content: 'Validation '
    - node: br
    - node: text
      content: Sanitize Escape
  p29:
  - node: p
    children:
    - node: text
      content: 'Validation '
  - node: p
    children:
    - node: text
      content: 'これは気に '
    - node: br
    - node: text
      content: しなくていい
  - node: p
    children:
    - node: text
      content: Sanitize Escape
  p30:
  - node: p
    children:
    - node: text
      content: '自信をもって '
    - node: br
    - node: text
      content: 説明できますか？
  p31:
  - node: p
    children:
    - node: text
      content: …ここから本題
  p32:
  - node: p
    children:
    - node: text
      content: クエリパラメータから
    - node: br
    - node: text
      content: ID値をとりたい
  p33:
  - node: p
    children:
    - node: bold
      content: '/** IDから記事を取得 */ '
  - node: p
    children:
    - node: bold
      content: 'function getById(int $id): Article '
    - node: br
    - node: bold
      content: '{ '
    - node: br
    - node: bold
      content: '    // 中でデータベースに問い合わせ '
  - node: p
    children:
    - node: bold
      content: '}'
  p34:
  - node: p
    children:
    - node: text
      content: 実際あぶない
  - node: p
    children:
    - node: bold
      content: '$id = $_GET[''id'']; '
    - node: br
    - node: bold
      content: $article=getById($id);
  p35:
  - node: p
    children:
    - node: text
      content: そもそも何者
  - node: p
    children:
    - node: bold
      content: '$id = $_GET[''id'']; '
    - node: br
    - node: bold
      content: $article=getById($id);
  p36:
  - node: p
    children:
    - node: text
      content: 'ここでブラウザ開く '
  - node: p
    children:
    - node: text
      content: https://phpstan.org/try
  p37:
  - node: p
    children:
    - node: text
      content: 型なしとはどういう状態か
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: ある式の値の型が静的に定まっていない (mixed, TSのunknown/any)
    - node: li
      children:
      - node: text
        content: 型付けされた関数に渡したときに要求された文脈に従っているか
      - node: br
      - node: text
        content: '(関数呼び出しをしたときにTypeErrorが出ないか安全だと言いきれない) '
    - node: li
      children:
      - node: text
        content: PHPではいろんなところから型なしが吹き出す
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: スーパーグローバル、eval、json_decode()、unserialize ()、
          - node: br
          - node: text
            content: PDOStatement::fetch()
  p38:
  - node: p
    children:
    - node: bold
      content: '// ?id=1 '
    - node: br
    - node: bold
      content: $_GET['id'] === '1';
  p39:
  - node: p
    children:
    - node: bold
      content: '// ?id=a '
    - node: br
    - node: bold
      content: $_GET['id'] === 'a';
  p40:
  - node: p
    children:
    - node: bold
      content: '// ?id[]=a '
    - node: br
    - node: bold
      content: $_GET['id'] === ['a'];
  p41:
  - node: p
    children:
    - node: bold
      content: '// ?id[foo]=bar $_GET[''id''] === '
    - node: br
    - node: bold
      content: '          [''foo'' => ''bar''];'
  p42:
  - node: p
    children:
    - node: text
      content: 'キャストすれば '
    - node: br
    - node: text
      content: いいのか
  p43:
  - node: p
    children:
    - node: text
      content: '危険ではないが '
    - node: br
    - node: text
      content: よくはない
  - node: p
    children:
    - node: bold
      content: '$id = (int)$_GET[''id'']; '
  p44:
  - node: p
    children:
    - node: bold
      content: '// ?id=32x '
    - node: br
    - node: bold
      content: '$id = (int)$_GET[''id'']; '
    - node: br
    - node: bold
      content: $id === 32;
  p45:
  - node: p
    children:
    - node: bold
      content: 'if (is_numeric($_GET[''id''])) { '
  - node: p
    children:
    - node: bold
      content: throw new BadRequestException();
    - node: br
    - node: bold
      content: '} '
  - node: p
    children:
    - node: bold
      content: $id = (int)$_GET['id'];
  p46:
  - node: p
    children:
    - node: text
      content: is_numeric()
  p47:
  - node: p
    children:
    - node: text
      content: 整数 123
  - node: p
    children:
    - node: text
      content: 小数 1.23
  - node: p
    children:
    - node: text
      content: '指数表記 '
  - node: p
    children:
    - node: text
      content: '1.844674407371E+1'
  - node: p
    children:
    - node: text
      content: 前後にスペース
  p48:
  - node: p
    children:
    - node: text
      content: 'だいたいのIDは '
    - node: br
    - node: text
      content: 正の整数だけ
  p49:
  - node: p
    children:
    - node: bold
      content: '// ?id=1.23 '
    - node: br
    - node: bold
      content: 'if (is_numeric($_GET[''id''])) { '
  - node: p
    children:
    - node: bold
      content: throw new BadRequestException();
    - node: br
    - node: bold
      content: '} '
  - node: p
    children:
    - node: bold
      content: $id = (int)$_GET['id'];
  p50:
  - node: p
    children:
    - node: text
      content: '安全に '
  - node: p
    children:
    - node: text
      content: int|false
  - node: p
    children:
    - node: bold
      content: '$id = filter_var( '
    - node: br
    - node: bold
      content: '    $_GET[''id''] ?? '''', '
    - node: br
    - node: bold
      content: '    FILTER_VALIDATE_INT '
    - node: br
    - node: bold
      content: );
  p51:
  - node: p
    children:
    - node: text
      content: '安全に '
  - node: p
    children:
    - node: bold
      content: '$id = filter_var( '
  - node: p
    children:
    - node: text
      content: int|false
  - node: p
    children:
    - node: bold
      content: '    $_GET[''id''] ?? '''', '
    - node: br
    - node: bold
      content: '    FILTER_VALIDATE_INT, '
    - node: br
    - node: bold
      content: '    [''options'' => [ '
    - node: br
    - node: bold
      content: '        ''min_range'' => 1, '
    - node: br
    - node: bold
      content: '    ]]);'
  p52:
  - node: p
    children:
    - node: text
      content: 'ここでブラウザ開く '
  - node: p
    children:
    - node: text
