  p30:
  - kind: para
    text: 自信をもって説明できますか？
  p31:
  - kind: heading
    level: 1
    text: …ここから本題
  p32:
  - kind: para
    text: クエリパラメータからID値をとりたい
  p33:
  - kind: para
    text: '/** IDから記事を取得 */function getById(int $id): Article{// 中でデータベースに問い合わせ}'
  p34:
  - kind: para
    text: 実際あぶない
  - kind: heading
    level: 1
    text: $id = $_GET['id'];
  - kind: heading
    level: 1
    text: $article = getById($id);
  p35:
  - kind: para
    text: そもそも何者
  - kind: heading
    level: 1
    text: $id = $_GET['id'];
  - kind: heading
    level: 1
    text: $article = getById($id);
  p36:
  - kind: heading
    level: 1
    text: ここでブラウザ開く
  - kind: heading
    level: 2
    text: https://phpstan.org/try
  p37:
  - kind: para
    text: 型なしとはどういう状態か
  - kind: list
    items:
    - ある式の値の型が静的に定まっていない (mixed, TSのunknown/any)
    - 型付けされた関数に渡したときに要求された文脈に従っているか
  - kind: para
    text: (関数呼び出しをしたときにTypeErrorが出ないか安全だと言いきれない)
  - kind: list
    items:
    - PHPではいろんなところから型なしが吹き出す
    - スーパーグローバル、eval、json_decode()、unserialize ()、
  - kind: para
    text: PDOStatement::fetch()
  p38:
  - kind: para
    text: // ?id=1$_GET['id'] === '1';
  p39:
  - kind: para
    text: // ?id=a$_GET['id'] === 'a';
  p40:
  - kind: para
    text: // ?id[]=a$_GET['id'] === ['a'];
  p41:
  - kind: para
    text: // ?id[foo]=bar$_GET['id'] ===['foo' => 'bar'];
  p42:
  - kind: para
    text: キャストすればいいのか
  p43:
  - kind: para
    text: 危険ではないがよくはない
  - kind: heading
    level: 1
    text: $id = (int)$_GET['id'];
  p44:
  - kind: para
    text: // ?id=32x$id = (int)$_GET['id'];$id === 32;
  p45:
  - kind: para
    text: if (is_numeric($_GET['id'])) {
  - kind: para
    text: throw new BadRequestException();
  - kind: para
    text: '}$id = (int)$_GET[''id''];'
  p46:
  - kind: heading
    level: 1
    text: is_numeric()
  p47:
  - kind: para
    text: 整数 123小数 1.23
  - kind: para
    text: 指数表記1.844674407371E+1
  - kind: para
    text: 前後にスペース
  p48:
  - kind: para
    text: だいたいのIDは正の整数だけ
  p49:
  - kind: para
    text: // ?id=1.23 if (is_numeric($_GET['id'])) {
  - kind: para
    text: throw new BadRequestException();
  - kind: para
    text: '}$id = (int)$_GET[''id''];'
  p50:
  - kind: para
    text: 安全に
  - kind: para
    text: int|false
  - kind: para
    text: $id = filter_var($_GET['id'] ?? '',FILTER_VALIDATE_INT);
  p51:
  - kind: para
    text: 安全に
  - kind: para
    text: int|false
  - kind: para
    text: $id = filter_var($_GET['id'] ?? '',FILTER_VALIDATE_INT,['options' => ['min_range'
      => 1,]]);
  p52:
  - kind: heading
    level: 1
    text: ここでブラウザ開く
  - kind: para
    text: https://phpstan.org/try
  - kind: para
    text: https://php-play.dev/
  p53:
  - kind: heading
    level: 1
    text: filter_var()
  p54:
  - kind: para
    text: うまいこと値のバリデーションできる標準関数
  p55:
  - kind: para
    text: ……話は遡り2007年
  p56:
  - kind: heading
    level: 1
    text: 伝説のプレゼン
  p57:
  - kind: para
    text: ホルモンのPHP (前半)
  - kind: list
    items:
    - Rasmus LerdorfがPHPを作った歴史的経緯を話している
    - 昔のPHPコードとか開発体制とか
    - 構文解析とか苦手なのでPHPの構文がめちゃくちゃだったという自虐
    - 利己的な動機で始めたプロジェクトだが開発者を惹きつけるように工夫して
  - kind: para
    text: いる様子
  - kind: list
    items:
    - 自宅サーバに入れたDrupalが遅いのでプロファイリングした
  p58:
  - kind: para
    text: ホルモンのPHP (後半)
  - kind: list
    items:
    - 世の中にセキュリティの問題が多いウェブサイトが多すぎる
    - IEとかFlashとかAdobe ReaderとかUTF-7とか罠がいっぱい
    - 俺たちのウェブは完全に壊れている。特にXSSがヤバイ。JS実行されちゃう。
  p59:
  - kind: para
    text: ホルモンのPHP (後半)
  - kind: list
    items:
    - 世の中にセキュリティの問題が多いウェブサイトが多すぎる
    - IEとかFlashとかAdobe ReaderとかUTF-7とか罠がいっぱい
    - 俺たちのウェブは完全に壊れている。特にXSSがヤバイ。JS実行されちゃう。
    - だからfilter関数作ったよ！ サニタイズすれば絶対にXSS起こらない！
