  p54:
  - node: p
    children:
    - node: text
      content: 'うまいこと値の '
    - node: br
    - node: text
      content: 'バリデーションできる '
    - node: br
    - node: text
      content: 標準関数
  p55:
  - node: p
    children:
    - node: text
      content: '……話は遡り '
    - node: br
    - node: text
      content: 2007年
  p56:
  - node: p
    children:
    - node: text
      content: 伝説のプレゼン
  p57:
  - node: p
    children:
    - node: text
      content: ホルモンのPHP (前半)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: Rasmus LerdorfがPHPを作った歴史的経緯を話している
    - node: li
      children:
      - node: text
        content: 昔のPHPコードとか開発体制とか
    - node: li
      children:
      - node: text
        content: 構文解析とか苦手なのでPHPの構文がめちゃくちゃだったという自虐
    - node: li
      children:
      - node: text
        content: 利己的な動機で始めたプロジェクトだが開発者を惹きつけるように工夫して
      - node: br
      - node: text
        content: 'いる様子 '
    - node: li
      children:
      - node: text
        content: 自宅サーバに入れたDrupalが遅いのでプロファイリングした
  p58:
  - node: p
    children:
    - node: text
      content: ホルモンのPHP (後半)
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 世の中にセキュリティの問題が多いウェブサイトが多すぎる
    - node: li
      children:
      - node: text
        content: IEとかFlashとかAdobe ReaderとかUTF-7とか罠がいっぱい
    - node: li
      children:
      - node: text
        content: 俺たちのウェブは完全に壊れている。特にXSSがヤバイ。JS実行されちゃう。
    - node: li
      children:
      - node: text
        content: '58'
  p59:
  - node: p
    children:
    - node: text
      content: ホルモンのPHP (後半)
  - node: ul
    children:
    - node: li
      children:
      - node: text
