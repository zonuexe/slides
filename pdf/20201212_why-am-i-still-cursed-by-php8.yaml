text:
  p1:
  - node: p
    children:
    - node: bold
      content: 私はなぜPHP8に苦しみ未だに解き放たれていないのか
  - node: p
    children:
    - node: text
      content: 'Why am I cursed by PHP8, and still not released?'
  - node: p
    children:
    - node: text
      content: '2020-12-12'
  - node: p
    children:
    - node: text
      content: 'PHPカンファレンス懇親会LT '
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
    - node: br
    - node: text
      content: 'うさみけんた (@tadsan)  '
  - node: p
    children:
    - node: text
      content: ' / Zonu.EXE'
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 'GitHub/Packagistでは id: zonuexe'
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: ピクシブ株式会社 pixiv運営本部
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer, Rubyist
    - node: li
      children:
      - node: text
        content: Emacs PHP Modeのメンテナ引き継ぎました
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 好きなリスプはEmacs Lispです
        - node: li
          children:
          - node: text
            content: Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - node: p
    children:
    - node: text
      content: 近況
  p6: []
  p7:
  - node: p
    children:
    - node: text
      content: 出ましたね
  p8: []
  p9:
  - node: p
    children:
    - node: text
      content: 出ちゃいま
    - node: br
    - node: text
      content: したね
  p10: []
  p11:
  - node: p
    children:
    - node: text
      content: 'このときは '
    - node: br
    - node: text
      content: 構文が違った
  p12: []
  p13:
  - node: p
    children:
    - node: text
      content: そのあといろ
    - node: br
    - node: text
      content: いろあった
  p14: []
  p15:
  - node: p
    children:
    - node: text
      content: いろいろ
    - node: br
    - node: text
      content: あった
  p16:
  - node: p
    children:
    - node: text
      content: '@@Attr   #[Attr] @[Attr]   <<Attr>> '
    - node: br
    - node: text
      content: '@:Attr    @{Attr}'
  p17:
  - node: p
    children:
    - node: text
      content: 書きかた工夫すれば
    - node: br
    - node: text
      content: PHP7と矛盾せずに導入
    - node: br
    - node: text
      content: 'できるのは '
    - node: br
    - node: text
      content: '#[Attr] 形式だけ'
  p18:
  - node: p
    children:
    - node: text
      content: それは わかる
  p19:
  - node: p
    children:
    - node: text
      content: '話は変り '
    - node: br
    - node: text
      content: ますが
  p20:
  - node: p
    children:
    - node: text
      content: テキストエディタの 構文色付けというの
    - node: br
    - node: text
      content: は意外に難しい
  p21:
  - node: p
    children:
    - node: text
      content: エディタの種類によって
    - node: br
    - node: text
      content: '色付けアルゴリズムの '
    - node: br
    - node: text
      content: 違いには結構違いがある
  p22:
  - node: p
    children:
    - node: text
      content: 一番よくあるのは
    - node: br
    - node: text
      content: コードのキーワード
    - node: br
    - node: text
      content: だけ色付ける方法
  p23:
  - node: p
    children:
    - node: text
      content: 'if, else, for, endif, '
    - node: br
    - node: text
      content: while, do, foreach, as, endif, ... などキーワード のリストと文字列の括弧 とコメントブロックだけ
  p24:
  - node: p
    children:
    - node: text
      content: 'PHPだとそれでは 不十分なことがある '
  - node: p
    children:
    - node: text
      content: (HereDoc/NowDoc)
  p25:
  - node: p
    children:
    - node: text
      content: Attributeも
  p26:
  - node: p
    children:
    - node: text
      content: 引数の非推奨化
  - node: p
    children:
    - node: text
      content: '#[Deprecated] '
    - node: br
    - node: text
      content: 'function f(     $arg1, '
    - node: br
    - node: text
      content: '    #['
  - node: p
    children:
    - node: text
      content: 'Deprecated] '
    - node: br
    - node: text
      content: $arg2){}
  p27:
  - node: p
    children:
    - node: text
      content: 引数の非推奨化
  - node: p
    children:
    - node: text
      content: '#[ '
    - node: br
    - node: text
      content: '    Deprecated '
    - node: br
    - node: text
      content: '] '
    - node: br
    - node: text
      content: 'function f($arg1, '
    - node: br
    - node: text
      content: '    #[ $arg2){}'
    - node: br
    - node: text
      content: 'Deprecated] '
  p28: []
  p29:
  - node: p
    children:
    - node: text
      content: エディタの構文色付けは 言語のパーサをそのまま 使えばいいわけではない
  p30:
  - node: p
    children:
    - node: text
      content: キーボードで1文字ごと
    - node: br
    - node: text
      content: 'に入力されるので '
    - node: br
    - node: text
      content: 画面に表示されている コードがPHPとして 正しいわけではない
  p31:
  - node: p
    children:
    - node: text
      content: 最近一番注目されて
    - node: br
    - node: text
      content: るのはtree-sitter
    - node: br
    - node: text
      content: というやつ
  p32:
  - node: p
    children:
    - node: text
      content: 'PHPではMicrosoftが '
    - node: br
    - node: text
      content: '開発している '
  - node: p
    children:
    - node: text
      content: 'Tolerant PHP Parser '
    - node: br
    - node: text
      content: というやつもある
  p33:
  - node: p
    children:
    - node: text
      content: 何が言いたい のかというと
  p34: []
  p35:
  - node: p
    children:
    - node: text
      content: EmacsにはCc Mode という言語モード用の フレームワークがある
  p36:
  - node: p
    children:
    - node: text
      content: Emacsの｢モード｣は画面 の文字に色を付けたりイ ンデント調節したりする
  p37:
  - node: p
    children:
    - node: text
      content: Cc Modeは｢C言語っ ぽい構文｣の言語を幅
    - node: br
    - node: text
      content: 広くサポートする
  p38:
  - node: p
    children:
    - node: text
      content: PHP Modeは何の 因果かjava-mode を継承している！！
  p39:
  - node: p
    children:
    - node: text
      content: ここまで言っておいて なんだけど表示自体の 対応は全然難しくない
  p40: []
  p41: []
  p42:
  - node: p
    children:
    - node: text
      content: 画面表示は割と ちゃんとしてる
  p43:
  - node: p
    children:
    - node: text
      content: じゃあ何が 問題なのか
  p44:
  - node: p
    children:
    - node: text
      content: なぜかインデント処理の どこかで正規表現マッチ
    - node: br
    - node: text
      content: 'に文字列を渡すべき '
    - node: br
    - node: text
      content: ところnilが渡ってエラー
  p45:
  - node: p
    children:
    - node: text
      content: バックトレースは
    - node: br
    - node: text
      content: あるが行数なし
  p46:
  - node: p
    children:
    - node: text
      content: そしてその関数は
    - node: br
    - node: text
      content: 2000行近くある…
  p47:
  - node: p
    children:
    - node: text
      content: 俺たちのデバッグ
    - node: br
    - node: text
      content: はこれからだ！
size:
  max_width: 1024
  max_height: 768
links:
  p2:
  - url: https://github.com/emacs-php/php-mode
    title: 'GitHub - emacs-php/php-mode: A powerful and flexible Emacs major mode
      for editing PHP scripts'
  p6:
  - url: https://www.php.net/releases/8.0/en.php
    title: 'PHP: PHP 8.0.0 Release Announcement'
  p10:
  - url: https://tadsan.fanbox.cc/posts/1052551
    title: 'PHP8 <<Attribute>>を語ろう #phpkansai ｜にゃんだーすわん｜pixivFANBOX'
