text:
  p1:
  - kind: heading
    level: 1
    text: 私はなぜPHP8に苦しみ
  - kind: heading
    level: 1
    text: 未だに解き放たれていないのか
  - kind: para
    text: Why am I cursed by PHP8, and still not released?
  - kind: para
    text: 2020-12-12 PHPカンファレンス懇親会LT
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer, Rubyist
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3: []
  p4: []
  p5:
  - kind: para
    text: 近況
  p6: []
  p7:
  - kind: para
    text: 出ましたね
  p8: []
  p9:
  - kind: para
    text: 出ちゃいましたね
  p10: []
  p11:
  - kind: para
    text: このときは構文が違った
  p12: []
  p13:
  - kind: para
    text: そのあといろいろあった
  p14: []
  p15:
  - kind: para
    text: いろいろあった
  p16:
  - kind: para
    text: '@@Attr'
  - kind: para
    text: '#[Attr]'
  - kind: para
    text: '@[Attr] <<Attr>>'
  - kind: para
    text: '@:Attr @{Attr}'
  p17:
  - kind: para
    text: 書きかた工夫すればPHP7と矛盾せずに導入できるのは#[Attr] 形式だけ
  p18:
  - kind: para
    text: それはわかる
  p19:
  - kind: para
    text: 話は変りますが
  p20:
  - kind: para
    text: テキストエディタの構文色付けというのは意外に難しい
  p21:
  - kind: para
    text: エディタの種類によって色付けアルゴリズムの違いには結構違いがある
  p22:
  - kind: para
    text: 一番よくあるのはコードのキーワードだけ色付ける方法
  p23:
  - kind: para
    text: if, else, for, endif,
  - kind: para
    text: while, do,
  - kind: para
    text: foreach, as,
  - kind: para
    text: endif, ... などキーワードのリストと文字列の括弧とコメントブロックだけ
  p24:
  - kind: para
    text: PHPだとそれでは不十分なことがある(HereDoc/NowDoc)
  p25:
  - kind: para
    text: Attributeも
  p26:
  - kind: heading
    level: 1
    text: 引数の非推奨化
  - kind: para
    text: '#[Deprecated]'
  - kind: para
    text: function f(
  - kind: para
    text: $arg1,
  - kind: para
    text: '#['
  - kind: para
    text: Deprecated]
  - kind: para
    text: $arg2){}
  p27:
  - kind: heading
    level: 1
    text: 引数の非推奨化
  - kind: para
    text: '#['
  - kind: para
    text: Deprecated
  - kind: para
    text: ']'
  - kind: para
    text: function f
  - kind: para
    text: (
  - kind: para
    text: Deprecated]
  - kind: para
    text: $arg1,
  - kind: para
    text: '#['
  - kind: para
    text: $arg2){}
  p28: []
  p29:
  - kind: para
    text: エディタの構文色付けは言語のパーサをそのまま使えばいいわけではない
  p30:
  - kind: para
    text: キーボードで1文字ごとに入力されるので画面に表示されているコードがPHPとして正しいわけではない
  p31:
  - kind: para
    text: 最近一番注目されてるのはtree-sitterというやつ
  p32:
  - kind: para
    text: PHPではMicrosoftが開発しているTolerant PHP Parserというやつもある
  p33:
  - kind: para
    text: 何が言いたいのかというと
  p34: []
  p35:
  - kind: para
    text: EmacsにはCc Modeという言語モード用のフレームワークがある
  p36:
  - kind: para
    text: Emacsの「モード」は画面の文字に色を付けたりインデント調節したりする
  p37:
  - kind: para
    text: Cc Modeは「C言語っぽい構文」の言語を幅広くサポートする
  p38:
  - kind: para
    text: PHP Modeは何の因果かjava-modeを継承している！！
  p39:
  - kind: para
    text: ここまで言っておいてなんだけど表示自体の対応は全然難しくない
  p40: []
  p41: []
  p42:
  - kind: para
    text: 画面表示は割とちゃんとしてる
  p43:
  - kind: para
    text: じゃあ何が問題なのか
  p44:
  - kind: para
    text: なぜかインデント処理のどこかで正規表現マッチに文字列を渡すべきところnilが渡ってエラー
  p45:
  - kind: para
    text: バックトレースはあるが行数なし
  p46:
  - kind: para
    text: そしてその関数は2000行近くある…
  p47:
  - kind: para
    text: 俺たちのデバッグはこれからだ！
