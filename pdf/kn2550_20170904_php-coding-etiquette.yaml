text:
  p1:
  - kind: heading
    level: 1
    text: いまさら！ お作法入門
  - kind: para
    text: Modern...? PHP manners guide
  - kind: para
    text: 'pixiv SUMMER BOOT CAMP 2017東京都渋谷区千駄ヶ谷 #pixiv_BOOTCAMP'
  p2: []
  p3:
  - kind: para
    text: 講義資料です
  p4:
  - kind: para
    text: このスライドはWebで公開します
  - kind: para
    text: (メモはとらなくても良いです、の意味)
  p5:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - 2012年11月にピクシブ株式会社に入社
    - Emacs Lisper, PHPer
    - 入社前は自宅警備をしながらRuby書いてた
    - Qiitaに記事を書いたり変なコメントしてるよ
  p6:
  - kind: para
    text: おぼえてほしいこと
  p7:
  - kind: para
    text: コードは動けばええんや
  - kind: heading
    level: 1
    text: 😄
  p8:
  - kind: para
    text: 反論？
  p9:
  - kind: heading
    level: 1
    text: 最高のコードは動くコード
  - kind: para
    text: コードの美しさはユーザーに見えない
  - kind: para
    text: 汚ないコードでも、動けばユーザーに
  - kind: para
    text: とっては最大の価値を生み出す
  p10:
  - kind: heading
    level: 1
    text: 最高のコードは動くコード
  - kind: para
    text: コードの美しさはユーザーに見えない
  - kind: para
    text: 汚ないコードでも、動けばユーザーに
  - kind: para
    text: とっては最大の価値を生み出す
  p11:
  - kind: heading
    level: 1
    text: 全ての物事には一長一短がある
  - kind: para
    text: 読めないコードはメンテできない
  - kind: para
    text: 機能拡張しにくい
  - kind: para
    text: ある日とつぜん動かなくなる
  - kind: para
    text: 仕様変更に追従困難
  p12:
  - kind: para
    text: 動けばの前提が崩れたコードは価値が大暴落
  p13:
  - kind: heading
    level: 1
    text: まとめると
  - kind: para
    text: ソースコードの美醜は現在の
  - kind: para
    text: プログラムの価値とは関係ない
  - kind: para
    text: ただし美しくないコードは
  - kind: para
    text: 将来の可能性を閉ざしかねない
  p14:
  - kind: para
    text: リーダブル
  - kind: para
    text: そのために「読める」
  - kind: para
    text: コードの追求とお作法の共有が必要
  p15:
  - kind: para
    text: 今回は大仰な設計の話ではなく、単にコーディングルールの共有をします
  p16:
  - kind: para
    text: PSR?
  p17:
  - kind: para
    text: その話はあとで
  p18:
  - kind: para
    text: <?phpからはじめよ
  - kind: para
    text: ファイル先頭は必ず<?phpを書きます
  - kind: para
    text: 必要ならnamespaceとuseを書きます
  - kind: para
    text: include_once 必要なければ書きません
  - kind: para
    text: そのあとクラス定義(だけ)を書きます
  - kind: para
    text: ファイル最後に ?> は書きません
  p19:
  - kind: para
    text: namespaceは必要か？
  - kind: para
    text: namespaceを利用すべきかは、
  - kind: para
    text: プロジェクトごとの事情に強く依存します
  - kind: para
    text: pixiv-libでは原則として利用しません
  - kind: para
    text: テストコード(tests/)でだけ使ってる
  - kind: para
    text: pixiv.git内のプロジェクト単位では、利用されることもあります
  p20:
  - kind: para
    text: もしもnamespaceがなかったら
  - kind: para
    text: User_Commonのような擬似名前空間
  - kind: para
    text: namespaceとuseの解決は少し面倒
  - kind: para
    text: 要はクラス名とファイル名の解決ができればオートローディングできます
  - kind: para
    text: User_Common → User/Common.php
  p21:
  - kind: para
    text: require/include_onceは最低限だけ
  - kind: para
    text: クラスローダーを登録することで、自動ローディングできる (遅延評価)
  - kind: para
    text: 1ファイルにつき1クラスを定義する
  - kind: para
    text: 関数定義などは基本的には
  - kind: para
    text: 初期化ファイルから読み込みます
  - kind: para
    text: (composer.jsonのautoload.files)
  p22:
  - kind: para
    text: ?> を書かない理由
  - kind: para
    text: 省略可能、書くメリットが皆無
  - kind: para
    text: PHPは <?php 〜 ?> の範囲外に
  - kind: para
    text: 書かれた文字列を出力します
  - kind: para
    text: 不随意にコード中に変な文字が混入し
  - kind: para
    text: たとき、文法エラーにもならず出力されかねないリスクがあります
  p23:
  - kind: heading
    level: 1
    text: クラス定義
  - kind: para
    text: クラスの概要を一行で要約すること
  - kind: para
    text: 一行で説明が不可能なら、クラスが持つ責任は明らかに多すぎます
  - kind: para
    text: クラス継承は慎重に設計してください
  - kind: para
    text: 個人的な経験では継承よりも委譲や
  - kind: para
    text: interfaceの方がうまくいきます
  p24:
  - kind: heading
    level: 1
    text: PHPDocの構造
  - kind: para
    text: /*** 概要(summary, 要約) ↓ 下は空行** 説明文(description)。クラスの説明を書きます。* ここには何行書いてもいいです。**
      説明不足よりも能弁を尊べ。** @see https://zonuexe.github.io/phpDocumentor2-ja/references/phpdoc/basic-syntax.html*/final
      class Foo_BarModel implements ModelInterface{// ...
  p25:
  - kind: para
    text: クラスとPHPDoc
  p26:
  - kind: heading
    level: 1
    text: メソッド定義
  - kind: para
    text: メソッドの概要を一行で要約し、引数と返り値の型をデザインします
  - kind: para
    text: 一行で説明できないメソッドは
  - kind: para
    text: その存在の軸が容易に揺らいでいく
  - kind: para
    text: 複数の型の値を返すメソッドは
  - kind: para
    text: 機能が多すぎ、利用側が煩雑になる
  p27:
  - kind: para
    text: メソッドとPHPDoc
  p28:
  - kind: para
    text: http://nico.ms/kn1774
  p29:
  - kind: heading
    level: 1
    text: これだけ覚えて帰ってね
  - kind: para
    text: タグ名
  - kind: para
    text: 意味
  - kind: para
    text: 例
  - kind: para
    text: '@param引数を定義@param int $n1'
  - kind: para
    text: '@return返り値を定義@return int[]'
  - kind: para
    text: '@var変数/プロパティを定義@var int'
  - kind: para
    text: '@propertyマジックプロパティを定義@property int $id'
  p30:
  - kind: heading
    level: 1
    text: PHPDocの型
  - kind: list
    items:
    - 「PHPの型」か「クラス名」を書く
    - 基本的な型
    - string, int, bool, float, array,
  - kind: para
    text: resource, null, true, false
  - kind: list
    items:
    - 擬似型
    - callable, void(返り値を返さない)
  - kind: para
    text: https://zonuexe.github.io/phpDocumentor2-ja/references/phpdoc/types.html
  p31:
  - kind: heading
    level: 1
    text: PHPDocの型
  - kind: list
    items:
    - 複合型
    - 「intまたは文字列」 int|string
    - 値が並んだ配列
    - 「intが並んだ配列」 int[]
  - kind: para
    text: https://zonuexe.github.io/phpDocumentor2-ja/references/phpdoc/types.html
  p32:
  - kind: para
    text: なんでPHPなのにわざわざ型を書くの
  p33:
  - kind: para
    text: バグるのと型書くの
  - kind: para
    text: どっちがええねん
  - kind: heading
    level: 1
    text: 😎
  p34:
  - kind: heading
    level: 1
    text: PHPは動的プログラミング言語
  - kind: para
    text: 静的型解析器(コンパイラ)は一般に実行前(コンパイル時)に変数や関数の型を特定する
  - kind: para
    text: PHPのVM(インタプリタ)は、
  - kind: para
    text: 変数や関数の型は基本的に特定せず、実行時に動的型解析する
  p35:
  - kind: para
    text: PHPの多くのバグは実行時まで遅延する
  p36:
  - kind: para
    text: 要は動かさないと
  - kind: para
    text: わからない
  p37:
  - kind: para
    text: 動かさなくてもバグを検出できるうれしみは大きい
  p38:
  - kind: para
    text: 引数一覧で型を表示するところ
  p39:
  - kind: para
    text: 型がめったくそなの叱ってくれ
  p40:
  - kind: para
    text: ループの話をしよう
  p41:
  - kind: para
    text: PHPのfor文は原則禁止
  - kind: heading
    level: 1
    text: 
  p42:
  - kind: para
    text: PHPの配列は歯抜けになる
  - kind: heading
    level: 1
    text: 
  p43:
  - kind: para
    text: foreachなら大丈夫
  - kind: heading
    level: 1
    text: 
  p44:
  - kind: para
    text: 引数一覧で型を表示するところ
  p45:
  - kind: para
    text: ループの中で補完が利かない
  p46:
  - kind: para
    text: きちんと型をつけ直す
  p47:
  - kind: para
    text: ループの中でも補完が利くよ
  p48:
  - kind: heading
    level: 1
    text: PSR
  - kind: para
    text: PHP Standards Recommendations
  - kind: para
    text: PHP標準勧告
  p49:
  - kind: heading
    level: 1
    text: PHP-FIG
  - kind: para
    text: PHP Framework Interop Group PHPフレームワーク相互運用グループ
  p50:
  - kind: para
    text: フレームワークや
  - kind: para
    text: CMSを開発する
  - kind: para
    text: 組織の寄合
  p51:
  - kind: heading
    level: 1
    text: 2017年8月現在のメンバー
  - kind: para
    text: CakePHP, Composer, concrete5, Contao Open Source CMS, Drupal, eZ Publish,
      Horde, IBM i Toolkit, Icicle, Jackalope, Joomla, Lithium,Magento, PEAR, Phalcon,
      Phing, phpBB,phpDocumentor, PHPixie, Pimcore, PPI Framework, PrestaShop, PyroCMS,
      ReactPHP,Revive Adserver, Sculpin, SilverStripe, Slim,Stash, Stormpath PHP SDK,
      SugarCRM,Symfony, Neos and Flow, Wikibase and Semantic MediaWiki, Yii framework,
      Zend Framework 2,Zikula
  - kind: para
    text: http://www.php-ﬁg.org/members/
  p52:
  - kind: para
    text: 相互運用??
  p53: []
  p54: []
  p55: []
  p56:
  - kind: para
    text: ばらばらに作ってたのを
  - kind: para
    text: 仕様化して相互に利用しやすくしようぜ！
  - kind: para
    text: ……みたいな人類の夢
  p57:
  - kind: para
    text: みんな仲良く
  - kind: heading
    level: 1
    text: 
  p58:
  - kind: heading
    level: 1
    text: PSR-0 Autoloading Standard
  - kind: para
    text: クラス名とファイルを一致させる規則
  - kind: para
    text: ベンダー名を名前空間のトップにする
  - kind: para
    text: \と_をDIRECTORY_SEPARATORに置換
  - kind: para
    text: 2014年にPSR-4に置換されて廃止
  p59:
  - kind: heading
    level: 1
    text: PSR-1 Basic Coding Standard
  - kind: para
    text: PHPコードは<?php … ?>または<?= … ?>
  - kind: para
    text: 文字コードはUTF-8(BOMなし)
  - kind: para
    text: クラスや定義のファイルは分けて、
  - kind: para
    text: 副作用のある処理とは分割する
  - kind: para
    text: クラス名はStudlyCaps(UpperCamlCase)、
  - kind: para
    text: メソッド名はlowerCamelCase、
  - kind: para
    text: プロパティ名は規定しないけど一貫せよ
  p60:
  - kind: heading
    level: 1
    text: PSR-2 Coding Style Guide
  - kind: para
    text: 具体的なコーディングスタイルガイド
  - kind: para
    text: PSRに準拠したライブラリが必ず遵守しなければいけないルールではなく、プロジェクトごとにガイドラインを
  - kind: para
    text: 決めるための叩き台
  - kind: para
    text: ↑ここ誤解してるひとが意外と多い
  p61:
  - kind: heading
    level: 1
    text: クラスや関数など定義の{は改行
  - kind: para
    text: final class Hoge implements Fizz{function hoge($a, $b){return $a + $b;}}function
      foo(){
  p62:
  - kind: heading
    level: 1
    text: そのほかの文の{は改行しない
  - kind: para
    text: $is_hoge = hoge();if ($is_hoge) {foo();} elseif (piyo($a)) {bar();}foreach
      ($values as $i => $v) {$values[$i] = piyopiyo($v);}
  p63:
  - kind: heading
    level: 1
    text: 演算子などは、きっちり空白
  - kind: para
    text: $str = "もじれつ";$str2 = $str . "！";
  - kind: para
    text: $n = 2;$m = 5;return foo($n, $m) * 2;
  p64:
  - kind: heading
    level: 1
    text: PSR-4 Autoloading Standard
  - kind: para
    text: クラス名とファイルを一致させる規則
  - kind: para
    text: ベンダー名を名前空間のトップにする
  - kind: para
    text: \と_をDIRECTORY_SEPARATORに置換
  - kind: para
    text: サブ名前空間とベースディレクトリの概念が導入
  p65:
  - kind: para
    text: わしのPSRは17まで
  - kind: para
    text: あるぞ
  p66:
  - kind: para
    text: さて
  p67:
  - kind: para
    text: ルールは破るためにある
  - kind: heading
    level: 1
    text: 😎
  p68:
  - kind: para
    text: 所詮はフレームワーク開発者どもの間の規則
  - kind: heading
    level: 1
    text: 😎
  p69:
  - kind: para
    text: プライベートなプロ
  - kind: para
    text: ジェクトがPSRに厳密に従っても得ら
  - kind: para
    text: れるものは乏しい
  p70:
  - kind: para
    text: プライベートなプロ
  - kind: para
    text: ジェクトがPSRに厳密に従っても得ら
  - kind: para
    text: れるものは乏しい
  p71:
  - kind: para
    text: 厳密に
  p72:
  - kind: para
    text: 都合のいいところだけ
  - kind: para
    text: 持ってくればいい
  - kind: heading
    level: 1
    text: 😊
  p73:
  - kind: para
    text: 規則とは理想的には自分たちの足を撃ち抜かないためにある
  p74:
  - kind: para
    text: 実態に即しない規則
  - kind: para
    text: は改正すべし
  p75:
  - kind: heading
    level: 1
    text: よく聞く例
  - kind: para
    text: PSR-2を魔改造カスタマイズ
  - kind: para
    text: インデントはスペースではなくタブ
  - kind: para
    text: '{ の改行位置が気に入らないので統一'
  - kind: para
    text: 要はコード内で統一感があれば良い
  p76:
  - kind: heading
    level: 1
    text: pixivの例
  - kind: para
    text: PSR-1, PSR-2はそのまま採用
  - kind: para
    text: 行の長さの規制だけ緩めてる
  - kind: para
    text: PSR-0, PSR-4は採用しない
  - kind: para
    text: 相互運用されないアプリケーションコードなどはvendorは厳密に意識しなくても別に問題が起こらない
  p77:
  - kind: heading
    level: 1
    text: クラスのオートロード
  - kind: para
    text: PSR-0, PSR-4の規約通りに配置するだけで、Composerがいい感じにロードできる
  - kind: para
    text: まあ文字列マッチしてるだけなので、
  - kind: para
    text: ベンダー名とか省略しても実際動く
  - kind: para
    text: そもそもローダーを自作してもいい
  p78:
  - kind: para
    text: まとめ
  p79:
  - kind: heading
    level: 1
    text: まとめ
  - kind: para
    text: (これに限らず)ルールやお作法は、われわれ人類が自爆しないための鎖
  - kind: para
    text: ルールが作られた背景には事情がある
  - kind: para
    text: ので、それを共有していくのが重要
  - kind: para
    text: 「どうしてこうなってるの」と感じたら質問していこう
