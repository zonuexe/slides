text:
  p1:
  - kind: heading
    level: 1
    text: 文字列をイテレーションする
  - kind: para
    text: Iterate over "elements" of a string.
  - kind: para
    text: '第138回 PHP勉強会＠東京2019年5月29日 #phpstudy'
  p2:
  - kind: heading
    level: 1
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE
    - 'GitHub/Packagistでは id: zonuexe'
    - ピクシブ株式会社 pixiv運営本部
    - Emacs Lisper, PHPer
    - Emacs PHP Modeのメンテナ引き継ぎました
    - 好きなリスプはEmacs Lispです
    - Qiitaに記事を書いたり変なコメントしてるよ
  p3:
  - kind: para
    text: 宣伝
  p4: []
  p5: []
  p6:
  - kind: para
    text: 先に
  p7:
  - kind: para
    text: 今回話す内容は平成最後のLT大会で発表した内容に由来
  p8: []
  p9:
  - kind: para
    text: 今回話す実装は既にライブラリ化しました
  p10: []
  p11:
  - kind: para
    text: おさらい
  p12:
  - kind: para
    text: イテレータとは何か
  p13:
  - kind: para
    text: 任意の処理を繰り返しの構造に落とし込める
  p14:
  - kind: para
    text: 繰り返し？
  p15:
  - kind: para
    text: みんなだいすきforeach
  p16:
  - kind: para
    text: どうするの？
  p17:
  - kind: para
    text: Iteratorインターフェイス
  p18: []
  p19: []
  p20: []
  p21:
  - kind: para
    text: ジェネレータ
  p22:
  - kind: para
    text: 関数でイテレータをつくれる
  p23:
  - kind: para
    text: 時間がないので割愛
  p24:
  - kind: para
    text: このあとさんざん出ます
  p25:
  - kind: para
    text: さて本題
  p26:
  - kind: heading
    level: 1
    text: 文字列をイテレーションする
  - kind: para
    text: Iterate over "elements" of a string.
  - kind: para
    text: '第138回 PHP勉強会＠東京2019年5月29日 #phpstudy'
  p27:
  - kind: para
    text: 問題です
  p28:
  - kind: para
    text: 入力した文字列を1文字ごとに改行区切りで出力せよ
  p29:
  - kind: para
    text: 簡単じゃん
  p30: []
  p31: []
  p32:
  - kind: para
    text: 簡単でしょ？
  - kind: heading
    level: 1
    text: 😄
  p33: []
  p34:
  - kind: para
    text: 本当に？
  - kind: heading
    level: 1
    text: 🤔
  p35: []
  p36:
  - kind: para
    text: (どう表示されるかは環境による)
  p37:
  - kind: para
    text: …………
  - kind: heading
    level: 1
    text: 🙃
  p38:
  - kind: para
    text: どうしてこんなことがおこるのか
  p39:
  - kind: para
    text: 前提1:PHPのstringは「文字」を知らない
  p40:
  - kind: para
    text: stringはただのバイト列
  p41:
  - kind: para
    text: $s = 'abc';echo $s[0];
  - kind: para
    text: これは先頭1文字ではなく
  - kind: para
    text: 1バイトを取り出す
  p42:
  - kind: para
    text: 逆に言うとstringにはどんなバイナリも格納できる
  p43:
  - kind: heading
    level: 1
    text: '例:'
  - kind: para
    text: '<?php$s = file_get_contents(''flower.png'');header(''Content-Type: image/png'');echo
      $s;'
  p44:
  - kind: para
    text: mb関数があるのでは？
  p45: []
  p46:
  - kind: para
    text: mb関数はencodingを常に指定しないと(環境依存せず)確実に処理できない
  - kind: heading
    level: 1
    text: 🤔
  p47:
  - kind: para
    text: PHP5.6以降ではdefault_charsetのデフォルト値が"UTF-8"に、mbstring.internal_encodingが非推奨になったのは嬉しい
  p48:
  - kind: para
    text: それはencodingを明示的に指定しなくても安全に処理できることを意味しない
  - kind: heading
    level: 1
    text: 🙃
  p49:
  - kind: para
    text: 前提2:UTF-8は可変長バイト
  p50:
  - kind: para
    text: ひとつの符号位置を表すために
  - kind: heading
    level: 1
    text: 1〜4バイト
  p51:
  - kind: para
    text: まだ日本語文字を「2バイト文字」と呼んだりしませんね？
  p52:
  - kind: para
    text: Unicodeより前の時代
  p53:
  - kind: para
    text: Shift_JISではガ (2バイト)
  - kind: para
    text: ｶﾞ (1バイト+1バイト)
  p54:
  - kind: para
    text: この頃は半角カナで情報量が半分になることもあった
  p55:
  - kind: para
    text: UTF-8ではガ (3バイト)
  - kind: para
    text: ｶﾞ (3バイト+3バイト)
  p56:
  - kind: para
    text: Unicode(UTF-8)で表現すると半角カナは単純にバイト数が倍になる
  p57:
  - kind: para
    text: たいへんですね
  - kind: heading
    level: 1
    text: ☺
  p58:
  - kind: para
    text: その上でUnicode時代の今日何を「文字」と呼ぶかを考える
  p59:
  - kind: para
    text: 1. バイトごと2. コードポイントごと3. 書記素クラスタごと
  p60:
  - kind: para
    text: バイトごと
  p61: []
  p62:
  - kind: para
    text: これがまさにバイトごとのイテレーション
  p63:
  - kind: para
    text: これをジェネレータに変換
  p64: []
  p65: []
  p66:
  - kind: para
    text: ライブラリとしては｢foreachできるオブジェクト｣(＝ジェネレータ)として提供
  p67:
  - kind: para
    text: そうすることで汎用的に利用できるようになる
  p68: []
  p69:
  - kind: para
    text: 例:数を集計する
  p70: []
  p71:
  - kind: para
    text: コードポイント
  - kind: para
    text: ごと
  p72:
  - kind: para
    text: コードポイント(符号位置)
  p73: []
  p74:
  - kind: para
    text: PHP(コア言語)はUnicodeを知らないが､PCRE関数preg_match()はUnicodeを知ってる ( /u 修飾子)
  p75: []
  p76:
  - kind: para
    text: 書記素クラスタごと
  p77:
  - kind: para
    text: 書記素とは？
  p78:
  - kind: para
    text: 人間の目に1文字に見える単位
  p79:
  - kind: para
    text: あ漢ガ
  p80:
  - kind: para
    text: どれも単独の書記素
  p81:
  - kind: para
    text: ところでUnicodeには「ガ」の複数の表現方法が存在する
  p82:
  - kind: para
    text: ガ (U+30AC)
  - kind: para
    text: ガ (U+30AB U+3099)
  - kind: para
    text: ｶﾞ (U+FF76 U+FF9E)
  p83:
  - kind: para
    text: 結合したガカ + ゛(結合文字)
  - kind: heading
    level: 1
    text: ガ (U+30AC)
  - kind: para
    text: 半角ｶ + ﾞ
  - kind: heading
    level: 1
    text: ガ (U+30AB U+3099)
  - kind: heading
    level: 1
    text: ｶﾞ (U+FF76 U+FF9E)
  p84:
  - kind: para
    text: Unicode正規化
  p85:
  - kind: para
    text: '余談: ファイル名に濁点のついた文字をGitで管理するとMacとそのほかのファイルシステムで諸々の厄介な事態が起こるので禁忌。これはAppleのファイルシステムが伝統的にファイル名をUnicode正規化することが問題'
  p86:
  - kind: para
    text: (本筋から逸れるので各自ggr)
  p87:
  - kind: para
    text: 書記素クラスタのターンはまだまだ終らないぜ
  p88:
  - kind: para
    text: 絵文字が開いてしまったパンドラの匣
  p89:
  - kind: para
    text: 'Case1: 国旗'
  p90:
  - kind: para
    text: 絵文字には国旗が充実
  p91:
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  - kind: para
    text: 
  p92:
  - kind: para
    text: ……と思うじゃん？
  p93:
  - kind: para
    text: 実態
  p94: []
  p95:
  - kind: para
    text: 国旗専用文字の[J]と[P]を並べて配置
  - kind: para
    text: すると
  - kind: para
    text: に化ける
  p96:
  - kind: para
    text: 'Case2: 家族'
  p97:
  - kind: para
    text: 
  p98:
  - kind: para
    text: この絵文字のバイト数
  - kind: para
    text: strlen('
  - kind: para
    text: ');
  p99:
  - kind: para
    text: この絵文字のバイト数
  - kind: para
    text: strlen('
  - kind: para
    text: ');// => 25
  p100:
  - kind: para
    text: この絵文字のUTF-8文字数
  - kind: para
    text: mb_strlen('
  - kind: para
    text: ', 'UTF-8');
  p101:
  - kind: para
    text: この絵文字のUTF-8文字数
  - kind: para
    text: mb_strlen('
  - kind: para
    text: ', 'UTF-8');// => 7
  p102:
  - kind: para
    text: 
  p103:
  - kind: para
    text: 👨|
  - kind: para
    text: 👩|
  - kind: para
    text: 👦|
  - kind: para
    text: 👦
  p104:
  - kind: para
    text: Zero Width Joiner
  p105:
  - kind: para
    text: さて
  p106:
  - kind: para
    text: そんな文字でも一安心
  p107: []
  p108:
  - kind: heading
    level: 1
    text: ICU(intl)に依存
  - kind: para
    text: (常に正しく計算するにはシステムに最新のUnicode定義が実装されたICUが必要)
  p109:
  - kind: para
    text: 今回の話題はただのトリビアか？
  p110:
  - kind: para
    text: 'No'
  p111:
  - kind: para
    text: Webアプリとしては「文字数」を制限しなければいけない場合が多々ある
  p112:
  - kind: para
    text: サービス都合の制限ストレージ(DB)都合制限
  p113:
  - kind: para
    text: 自分がどういう理由で文字数を制限しようとしているのか考えよう
  p114:
  - kind: para
    text: 例:MySQLのインデックス長のデフォルト設定が767バイトだからutf8mb4のカラムの文字数をVARCHAR(191)以下にしたい
  p115:
  - kind: para
    text: 例:長いユーザー名は画面に収まりきらないから30文字以下にしたい
  p116:
  - kind: para
    text: たいていはmb_strlen($s, 'UTF-8')
  - kind: para
    text: で片がつく
  p117:
  - kind: heading
    level: 1
    text: 「文字数」と「表示幅」は
  - kind: heading
    level: 1
    text: 全然違う概念なので厄介
  - kind: para
    text: (なので、今回紹介したeach_grapheme()を使って計算してもうまくいかない)
  p118:
  - kind: para
    text: オチはないけど各位よく考えて「文字」単位とつきあっていきましょう
  p119:
  - kind: para
    text: ちなみにTwitterの140文字制限がDBの制約ではないことは明白
