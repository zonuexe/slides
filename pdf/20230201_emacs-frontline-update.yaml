text:
  p1:
  - node: p
    children:
    - node: text
      content: Emacs最前線
  - node: p
    children:
    - node: text
      content: Emacs front line
  - node: p
    children:
    - node: text
      content: 'pixiv Inc. '
    - node: br
    - node: text
      content: USAMI Kenta
  - node: p
    children:
    - node: bold
      content: '2023-02-01  '
  - node: p
    children:
    - node: bold
      content: 'TechFeed Experts Night #12'
  p2:
  - node: p
    children:
    - node: text
      content: お前誰よ
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - node: li
      children:
      - node: text
        content: ピクシブ株式会社 pixiv事業本部 エンジニア
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - node: li
      children:
      - node: text
        content: Emacs Lisper, PHPer
      - node: ul
        children:
        - node: li
          children:
          - node: text
            content: Emacs PHP Modeを開発しています (2017年-)
    - node: li
      children:
      - node: text
        content: TechFeed公認PHPエキスパート
  p3: []
  p4: []
  p5:
  - node: p
    children:
    - node: text
      content: 私の立ち位置
  p6: []
  p7:
  - node: p
    children:
    - node: text
      content: さて
  p8:
  - node: p
    children:
    - node: text
      content: Vimはいいぞ！
  p9: []
  p10:
  - node: p
    children:
    - node: text
      content: 'Emacsの '
    - node: br
    - node: text
      content: 本質とは何か
  p11:
  - node: p
    children:
    - node: text
      content: 'A modern '
    - node: br
    - node: text
      content: Lisp machine
  p12: []
  p13:
  - node: p
    children:
    - node: text
      content: 'そういう機械が '
    - node: br
    - node: text
      content: 40年以上前にあった
  p14:
  - node: p
    children:
    - node: bold
      content: '「Multi-Paradigm Language TAO」より引用 '
  - node: p
    children:
    - node: bold
      content: ' https://www.nue.org/nue/tao/bitao/s001.html'
  p15:
  - node: p
    children:
    - node: text
      content: この写真は国産LISPマシンのELIS なので本家Emacsの開発経緯とは直 接関係ないのだが内蔵されたZENと いうEmacs風独自エディタの日本語
        入力メソッドKanzenが後のSKKに 繋がりIME史に影響を及ぼしている
  p16:
  - node: p
    children:
    - node: text
      content: それは置いといて
  p17:
  - node: p
    children:
    - node: text
      content: AIならLisp CGならLisp
  p18:
  - node: p
    children:
    - node: text
      content: 'そういう時代もあった '
    - node: br
    - node: text
      content: (らしい)
  p19:
  - node: p
    children:
    - node: text
      content: 'みなさんご存じ 通り '
  - node: p
    children:
    - node: text
      content: (ない)
  - node: p
    children:
    - node: text
      content: 'LISPマシンのような 高級言語専用マシンは '
    - node: br
    - node: text
      content: 廃れている
  p20:
  - node: p
    children:
    - node: text
      content: 199X年､世界は核の炎に 包まれた｡海は枯れ､地は 裂け､全ての生物が死滅し
    - node: br
    - node: text
      content: たかのように見えた｡
  p21:
  - node: p
    children:
    - node: text
      content: 'だが、Lispは '
    - node: br
    - node: text
      content: 死滅していなかった！
  p22:
  - node: p
    children:
    - node: text
      content: 世紀末救世主伝説Emacs
  p23:
  - node: p
    children:
    - node: text
      content: '元祖Emacsは '
    - node: br
    - node: text
      content: TECOというエディタの
    - node: br
    - node: text
      content: '拡張マクロ集 '
  - node: p
    children:
    - node: text
      content: (EditorMACroS)
  p24:
  - node: p
    children:
    - node: text
      content: なんだかんだありまして
  p25: []
  p26:
  - node: p
    children:
    - node: text
      content: 現代一般に“Emacs”と 呼ばれるのは1985年に 発表されたGNU Emacs
  p27:
  - node: p
    children:
    - node: text
      content: 'かつてGNU Emacsは '
    - node: br
    - node: text
      content: '「伽藍とバザール」 '
    - node: br
    - node: text
      content: と例えられた
  p28:
  - node: p
    children:
    - node: text
      content: 現代でもGitHubやGitLab ではなくMLで開発されてい るが､パッチを投げたら気軽 に取り込んでくれる雰囲気
  p29:
  - node: p
    children:
    - node: text
      content: 'むかしは歴史的経緯で '
    - node: br
    - node: text
      content: サードパーティのリポジト
    - node: br
    - node: text
      content: 'リを追加しなければ '
    - node: br
    - node: text
      content: PHPサポートできなかった
  p30:
  - node: p
    children:
    - node: text
      content: スクリプトで拡張できる テキストエディタの元祖
  p31:
  - node: p
    children:
    - node: text
      content: 現代でも健在
  p32: []
  p33: []
  p34:
  - node: p
    children:
    - node: text
      content: 'コードベースの '
    - node: br
    - node: text
      content: 60%はLisp
  p35:
  - node: p
    children:
    - node: text
      content: 'EmacsコアはC言語で '
    - node: br
    - node: text
      content: '書かれているが '
    - node: br
    - node: text
      content: 割合は15%に過ぎない
  p36:
  - node: p
    children:
    - node: text
      content: (大言壮語ではなく)
    - node: br
    - node: text
      content: あらゆるものをユーザー
    - node: br
    - node: text
      content: 'がカスタマイズできる '
    - node: br
    - node: text
      content: エディタ
  p37:
  - node: p
    children:
    - node: text
      content: 'Emacsの設定は '
    - node: br
    - node: text
      content: 'init.elというファイルに '
    - node: br
    - node: text
      content: 記述する
  p38:
  - node: p
    children:
    - node: text
      content: 'エディタの実装言語と '
    - node: br
    - node: text
      content: ユーザーのカスタマイズ
    - node: br
    - node: text
      content: 言語が同じ
  p39:
  - node: p
    children:
    - node: text
      content: ところで皆さん
  p40:
  - node: p
    children:
    - node: text
      content: 'ハッカーになりたく '
    - node: br
    - node: text
      content: ありませんか
  p41:
  - node: p
    children:
    - node: bold
      content: '「普通のやつらの上を行け ---Beating the Averages---」より引用 '
  - node: p
    children:
    - node: bold
      content: ' http://practical-scheme.net/trans/beating-the-averages-j.html'
  p42:
  - node: p
    children:
    - node: bold
      content: '「普通のやつらの上を行け ---Beating the Averages---」より引用 '
  - node: p
    children:
    - node: bold
      content: ' http://practical-scheme.net/trans/beating-the-averages-j.html'
  p43:
  - node: p
    children:
    - node: text
      content: 言語にはパワーがある
  p44:
  - node: p
    children:
    - node: bold
      content: '「普通のやつらの上を行け ---Beating the Averages---」より引用 '
  - node: p
    children:
    - node: bold
      content: ' http://practical-scheme.net/trans/beating-the-averages-j.html'
  p45:
  - node: p
    children:
    - node: text
      content: 'ということを '
    - node: br
    - node: text
      content: 'Yコンビネータ創始者の '
    - node: br
    - node: text
      content: 'ポールグレアムが '
    - node: br
    - node: text
      content: 言ってる
  p46:
  - node: p
    children:
    - node: text
      content: (viawebで使っていたの はCommon Lispだよと いうツッコミは躱しつつ)
  p47:
  - node: p
    children:
    - node: text
      content: 'ハッカーになりたければ '
  - node: p
    children:
    - node: text
      content: Emacs
  p48:
  - node: p
    children:
    - node: text
      content: 'Emacs Lispも '
    - node: br
    - node: text
      content: '同じパワーを持ってる '
    - node: br
    - node: text
      content: (70%くらい )
  - node: p
    children:
    - node: text
      content: '[要出典]'
  p49:
  - node: p
    children:
    - node: text
      content: 'えっじゃあ '
    - node: br
    - node: text
      content: 現代にEmacsを使うのは ハッカーワナビだけなの
  p50:
  - node: p
    children:
    - node: text
      content: 'そうだよ '
  p51:
  - node: p
    children:
    - node: text
      content: そうだよ 違います
  p52:
  - node: p
    children:
    - node: text
      content: エディタには パワーがある
  p53:
  - node: p
    children:
    - node: text
      content: 実行時にあらゆるものを
    - node: br
    - node: text
      content: '再定義できる '
    - node: br
    - node: text
      content: 最強の動的言語ランタイム
  p54:
  - node: p
    children:
    - node: text
      content: '危険な再定義をせずに hookという仕組みで 容易にカスタマイズ '
    - node: br
    - node: text
      content: できる設計が浸透している
  p55:
  - node: p
    children:
    - node: text
      content: Emacsは未完成品
  p56:
  - node: p
    children:
    - node: text
      content: 'ユーザーがinit.elを '
    - node: br
    - node: text
      content: '記述することで完成する '
    - node: br
    - node: text
      content: フレームワーク
  p57:
  - node: p
    children:
    - node: text
      content: 'init.elに書かなくても '
    - node: br
    - node: text
      content: コードを書き換えて
    - node: br
    - node: text
      content: 'Emacsの再起動なしに '
    - node: br
    - node: text
      content: 挙動を変更できる
  p58:
  - node: p
    children:
    - node: text
      content: 'あらゆるものを '
    - node: br
    - node: text
      content: 'カスタマイズしたければ '
  - node: p
    children:
    - node: text
      content: Emacs
  p59:
  - node: p
    children:
    - node: text
      content: 'C言語を知らなくても '
    - node: br
    - node: text
      content: 'Lispがわかれば '
    - node: br
    - node: text
      content: カスタマイズできる!!!
  p60:
  - node: p
    children:
    - node: text
      content: さて
  p61:
  - node: p
    children:
    - node: text
      content: Emacsはなんでもできる
  p62:
  - node: p
    children:
    - node: text
      content: 'メーラーでもあり '
    - node: br
    - node: text
      content: RSSリーダーでもあり EPUBやPDFも読める
  p63:
  - node: p
    children:
    - node: text
      content: 'エディタとして '
    - node: br
    - node: text
      content: 使いにくい？
  p64: []
  p65: []
  p66:
  - node: p
    children:
    - node: text
      content: '思考の速度で編集 '
    - node: br
    - node: text
      content: したければEvilが使える
  p67: []
  p68:
  - node: p
    children:
    - node: text
      content: '(私も翻訳の '
    - node: br
    - node: text
      content: お手伝いをしました)
  p69: []
  p70:
  - node: p
    children:
    - node: text
      content: カスタマイズが めんどくさい？
  p71: []
  p72:
  - node: p
    children:
    - node: text
      content: Emacs vs 重力
  p73:
  - node: p
    children:
    - node: text
      content: Emacsは動的言語インタ
    - node: br
    - node: text
      content: 'プリタでもあるので '
    - node: br
    - node: text
      content: GILからは逃れられない
  p74:
  - node: p
    children:
    - node: text
      content: 'Emacs28では '
    - node: br
    - node: text
      content: Lispをネイティブコンパ イルできるようになった
  p75:
  - node: p
    children:
    - node: text
      content: 'Lispで言語ごとの '
    - node: br
    - node: text
      content: '開発環境を '
    - node: br
    - node: text
      content: 実装し続けるの大変
  p76:
  - node: p
    children:
    - node: text
      content: '言語とEmacsLisp '
    - node: br
    - node: text
      content: '両方わかるひとが '
    - node: br
    - node: text
      content: 'メンテし続けないと '
    - node: br
    - node: text
      content: いけない
  p77:
  - node: p
    children:
    - node: text
      content: '動的言語Lispで '
    - node: br
    - node: text
      content: '重厚な処理を '
    - node: br
    - node: text
      content: すると重い
  p78:
  - node: p
    children:
    - node: text
      content: '重い関数は '
    - node: br
    - node: text
      content: 'C言語などで実装して '
    - node: br
    - node: text
      content: ダイナミックモジュール化
  p79:
  - node: p
    children:
    - node: text
      content: 'Emacs 29では '
    - node: br
    - node: text
      content: 'Tree-sitterベースの '
    - node: br
    - node: text
      content: 言語モードを導入
  p80:
  - node: p
    children:
    - node: text
      content: '問題意識を持って 高速な非同期UIを '
    - node: br
    - node: text
      content: 実装している人も居る
  p81: []
  p82: []
  p83: []
  p84:
  - node: p
    children:
    - node: text
      content: コンピュータサイエンス
    - node: br
    - node: text
      content: 'の問題に立ち向かって '
    - node: br
    - node: text
      content: 最強の環境を作りたい人
    - node: br
    - node: text
      content: はEmacsを
  p85:
  - node: p
    children:
    - node: text
      content: 'コミュニティは '
    - node: br
    - node: text
      content: Emacs JPのSlackに (不定期にオンラインミートアップも
    - node: br
    - node: text
      content: やってるよ)
