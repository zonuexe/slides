text:
  p1:
  - kind: heading
    level: 1
    text: Emacs最前線
  - kind: heading
    level: 2
    text: Emacs front line
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2023-02-01 TechFeed Experts Night #12'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - TechFeed公認PHPエキスパート
  p3: []
  p4: []
  p5:
  - kind: heading
    level: 1
    text: 私の立ち位置
  p6: []
  p7:
  - kind: heading
    level: 1
    text: さて
  p8:
  - kind: heading
    level: 1
    text: Vimはいいぞ！
  p9: []
  p10:
  - kind: para
    text: Emacsの本質とは何か
  p11:
  - kind: para
    text: A modern Lisp machine
  p12: []
  p13:
  - kind: para
    text: そういう機械が40年以上前にあった
  p14:
  - kind: para
    text: 「Multi-Paradigm Language TAO」より引用https://www.nue.org/nue/tao/bitao/s001.html
  p15:
  - kind: para
    text: この写真は国産LISPマシンのELISなので本家Emacsの開発経緯とは直接関係ないのだが内蔵されたZENというEmacs風独自エディタの日本語入力メソッドKanzenが後のSKKに繋がりIME史に影響を及ぼしている
  p16:
  - kind: heading
    level: 1
    text: それは置いといて
  p17:
  - kind: para
    text: AIならLisp CGならLisp
  p18:
  - kind: para
    text: そういう時代もあった(らしい)
  p19:
  - kind: para
    text: みなさんご存じ(ない)通りLISPマシンのような高級言語専用マシンは廃れている
  p20:
  - kind: para
    text: 199X年、世界は核の炎に包まれた。海は枯れ、地は裂け、全ての生物が死滅したかのように見えた。
  p21:
  - kind: para
    text: だが、Lispは死滅していなかった！
  p22:
  - kind: heading
    level: 1
    text: 世紀末救世主伝説Emacs
  p23:
  - kind: para
    text: 元祖EmacsはTECOというエディタの拡張マクロ集(EditorMACroS)
  p24:
  - kind: heading
    level: 1
    text: なんだかんだありまして
  p25: []
  p26:
  - kind: para
    text: 現代一般に“Emacs”と呼ばれるのは1985年に発表されたGNU Emacs
  p27:
  - kind: para
    text: かつてGNU Emacsは「伽藍とバザール」と例えられた
  p28:
  - kind: para
    text: 現代でもGitHubやGitLabではなくMLで開発されているが、パッチを投げたら気軽に取り込んでくれる雰囲気
  p29:
  - kind: para
    text: むかしは歴史的経緯でサードパーティのリポジトリを追加しなければPHPサポートできなかった
  p30:
  - kind: para
    text: スクリプトで拡張できるテキストエディタの元祖
  p31:
  - kind: heading
    level: 1
    text: 現代でも健在
  p32: []
  p33: []
  p34:
  - kind: para
    text: コードベースの60%はLisp
  p35:
  - kind: para
    text: EmacsコアはC言語で書かれているが割合は15%に過ぎない
  p36:
  - kind: para
    text: (大言壮語ではなく)あらゆるものをユーザーがカスタマイズできるエディタ
  p37:
  - kind: para
    text: Emacsの設定はinit.elというファイルに記述する
  p38:
  - kind: para
    text: エディタの実装言語とユーザーのカスタマイズ言語が同じ
  p39:
  - kind: heading
    level: 1
    text: ところで皆さん
  p40:
  - kind: para
    text: ハッカーになりたくありませんか
  p41:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用http://practical-scheme.net/trans/beating-the-averages-j.html
  p42:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用http://practical-scheme.net/trans/beating-the-averages-j.html
  p43:
  - kind: heading
    level: 1
    text: 言語にはパワーがある
  p44:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用http://practical-scheme.net/trans/beating-the-averages-j.html
  p45:
  - kind: para
    text: ということをYコンビネータ創始者のポールグレアムが言ってる
  p46:
  - kind: para
    text: (viawebで使っていたのはCommon Lispだよというツッコミは躱しつつ)
  p47:
  - kind: para
    text: ハッカーになりたければEmacs
  p48:
  - kind: para
    text: Emacs Lispも同じパワーを持ってる(70%くらい[要出典])
  p49:
  - kind: para
    text: えっじゃあ現代にEmacsを使うのはハッカーワナビだけなの
  p50:
  - kind: heading
    level: 1
    text: そうだよ
  p51:
  - kind: para
    text: そうだよ違います
  p52:
  - kind: para
    text: エディタにはパワーがある
  p53:
  - kind: para
    text: 実行時にあらゆるものを再定義できる最強の動的言語ランタイム
  p54:
  - kind: para
    text: 危険な再定義をせずにhookという仕組みで容易にカスタマイズできる設計が浸透している
  p55:
  - kind: heading
    level: 1
    text: Emacsは未完成品
  p56:
  - kind: para
    text: ユーザーがinit.elを記述することで完成するフレームワーク
  p57:
  - kind: para
    text: init.elに書かなくてもコードを書き換えてEmacsの再起動なしに挙動を変更できる
  p58:
  - kind: para
    text: あらゆるものをカスタマイズしたければEmacs
  p59:
  - kind: para
    text: C言語を知らなくてもLispがわかればカスタマイズできる!!!
  p60:
  - kind: heading
    level: 1
    text: さて
  p61:
  - kind: heading
    level: 1
    text: Emacsはなんでもできる
  p62:
  - kind: para
    text: メーラーでもありRSSリーダーでもありEPUBやPDFも読める
  p63:
  - kind: para
    text: エディタとして使いにくい？
  p64: []
  p65: []
  p66:
  - kind: para
    text: 思考の速度で編集したければEvilが使える
  p67: []
  p68:
  - kind: para
    text: (私も翻訳のお手伝いをしました)
  p69: []
  p70:
  - kind: para
    text: カスタマイズがめんどくさい？
  p71: []
  p72:
  - kind: heading
    level: 1
    text: Emacs vs 重力
  p73:
  - kind: para
    text: Emacsは動的言語インタプリタでもあるのでGILからは逃れられない
  p74:
  - kind: para
    text: Emacs28ではLispをネイティブコンパイルできるようになった
  p75:
  - kind: para
    text: Lispで言語ごとの開発環境を実装し続けるの大変
  p76:
  - kind: para
    text: 言語とEmacsLisp両方わかるひとがメンテし続けないといけない
  p77:
  - kind: para
    text: 動的言語Lispで重厚な処理をすると重い
  p78:
  - kind: para
    text: 重い関数はC言語などで実装してダイナミックモジュール化
  p79:
  - kind: para
    text: Emacs 29ではTree-sitterベースの言語モードを導入
  p80:
  - kind: para
    text: 問題意識を持って高速な非同期UIを実装している人も居る
  p81: []
  p82: []
  p83: []
  p84:
  - kind: para
    text: コンピュータサイエンスの問題に立ち向かって最強の環境を作りたい人はEmacsを
  p85:
  - kind: heading
    level: 1
    text: コミュニティは
  - kind: heading
    level: 1
    text: Emacs JPのSlackに
  - kind: para
    text: (不定期にオンラインミートアップもやってるよ)
