text:
  p1:
  - kind: heading
    level: 1
    text: Emacs最前線
  - kind: heading
    level: 2
    text: Emacs front line
  - kind: heading
    level: 3
    text: pixiv Inc.
  - kind: heading
    level: 3
    text: USAMI Kenta
  - kind: para
    text: '2023-02-01'
  - kind: para
    text: 'TechFeed Experts Night #12'
  p2:
  - kind: para
    text: お前誰よ
  - kind: list
    items:
    - うさみけんた (@tadsan) / Zonu.EXE / にゃんだーすわん
    - ピクシブ株式会社 pixiv事業本部 エンジニア
    - 最近はピクシブ百科事典(dic.pixiv.net)を開発しています
    - Emacs Lisper, PHPer
    - Emacs PHP Modeを開発しています (2017年-)
    - TechFeed公認PHPエキスパート
  p3: []
  p4: []
  p5:
  - kind: heading
    level: 1
    text: 私の立ち位置
  p6: []
  p7:
  - kind: heading
    level: 1
    text: さて
  p8:
  - kind: heading
    level: 1
    text: Vimはいいぞ！
  p9: []
  p10:
  - kind: para
    text: Emacsの
  - kind: para
    text: 本質とは何か
  p11:
  - kind: para
    text: A modern
  - kind: para
    text: Lisp machine
  p12: []
  p13:
  - kind: para
    text: そういう機械が
  - kind: para
    text: 40年以上前にあった
  p14:
  - kind: para
    text: 「Multi-Paradigm Language TAO」より引用
  - kind: para
    text: https://www.nue.org/nue/tao/bitao/s001.html
  p15:
  - kind: para
    text: この写真は国産LISPマシンのELIS
  - kind: para
    text: なので本家Emacsの開発経緯とは直
  - kind: para
    text: 接関係ないのだが内蔵されたZENと
  - kind: para
    text: いうEmacs風独自エディタの日本語
  - kind: para
    text: 入力メソッドKanzenが後のSKKに
  - kind: para
    text: 繋がりIME史に影響を及ぼしている
  p16:
  - kind: heading
    level: 1
    text: それは置いといて
  p17:
  - kind: para
    text: AIならLisp
  - kind: para
    text: CGならLisp
  p18:
  - kind: para
    text: そういう時代もあった
  - kind: para
    text: (らしい)
  p19:
  - kind: para
    text: みなさんご存じ(ない)通り
  - kind: para
    text: LISPマシンのような
  - kind: para
    text: 高級言語専用マシンは
  - kind: para
    text: 廃れている
  p20:
  - kind: para
    text: 199X年、世界は核の炎に
  - kind: para
    text: 包まれた。海は枯れ、地は
  - kind: para
    text: 裂け、全ての生物が死滅し
  - kind: para
    text: たかのように見えた。
  p21:
  - kind: para
    text: だが、Lispは
  - kind: para
    text: 死滅していなかった！
  p22:
  - kind: heading
    level: 1
    text: 世紀末救世主伝説Emacs
  p23:
  - kind: para
    text: 元祖Emacsは
  - kind: para
    text: TECOというエディタの
  - kind: para
    text: 拡張マクロ集
  - kind: para
    text: (EditorMACroS)
  p24:
  - kind: heading
    level: 1
    text: なんだかんだありまして
  p25: []
  p26:
  - kind: para
    text: 現代一般に“Emacs”と
  - kind: para
    text: 呼ばれるのは1985年に
  - kind: para
    text: 発表されたGNU Emacs
  p27:
  - kind: para
    text: かつてGNU Emacsは
  - kind: para
    text: 「伽藍とバザール」
  - kind: para
    text: と例えられた
  p28:
  - kind: para
    text: 現代でもGitHubやGitLab
  - kind: para
    text: ではなくMLで開発されてい
  - kind: para
    text: るが、パッチを投げたら気軽
  - kind: para
    text: に取り込んでくれる雰囲気
  p29:
  - kind: para
    text: むかしは歴史的経緯で
  - kind: para
    text: サードパーティのリポジト
  - kind: para
    text: リを追加しなければ
  - kind: para
    text: PHPサポートできなかった
  p30:
  - kind: para
    text: スクリプトで拡張できる
  - kind: para
    text: テキストエディタの元祖
  p31:
  - kind: heading
    level: 1
    text: 現代でも健在
  p32: []
  p33: []
  p34:
  - kind: para
    text: コードベースの
  - kind: para
    text: 60%はLisp
  p35:
  - kind: para
    text: EmacsコアはC言語で
  - kind: para
    text: 書かれているが
  - kind: para
    text: 割合は15%に過ぎない
  p36:
  - kind: para
    text: (大言壮語ではなく)
  - kind: para
    text: あらゆるものをユーザー
  - kind: para
    text: がカスタマイズできる
  - kind: para
    text: エディタ
  p37:
  - kind: para
    text: Emacsの設定は
  - kind: para
    text: init.elというファイルに
  - kind: para
    text: 記述する
  p38:
  - kind: para
    text: エディタの実装言語と
  - kind: para
    text: ユーザーのカスタマイズ
  - kind: para
    text: 言語が同じ
  p39:
  - kind: heading
    level: 1
    text: ところで皆さん
  p40:
  - kind: para
    text: ハッカーになりたく
  - kind: para
    text: ありませんか
  p41:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p42:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p43:
  - kind: heading
    level: 1
    text: 言語にはパワーがある
  p44:
  - kind: para
    text: 「普通のやつらの上を行け ---Beating the Averages---」より引用
  - kind: para
    text: http://practical-scheme.net/trans/beating-the-averages-j.html
  p45:
  - kind: para
    text: ということを
  - kind: para
    text: Yコンビネータ創始者の
  - kind: para
    text: ポールグレアムが
  - kind: para
    text: 言ってる
  p46:
  - kind: para
    text: (viawebで使っていたの
  - kind: para
    text: はCommon Lispだよと
  - kind: para
    text: いうツッコミは躱しつつ)
  p47:
  - kind: para
    text: ハッカーになりたければ
  - kind: para
    text: Emacs
  p48:
  - kind: para
    text: Emacs Lispも
  - kind: para
    text: 同じパワーを持ってる
  - kind: para
    text: (70%くらい
  - kind: para
    text: '[要出典])'
  p49:
  - kind: para
    text: えっじゃあ
  - kind: para
    text: 現代にEmacsを使うのは
  - kind: para
    text: ハッカーワナビだけなの
  p50:
  - kind: heading
    level: 1
    text: そうだよ
  p51:
  - kind: para
    text: そうだよ
  - kind: para
    text: 違います
  p52:
  - kind: para
    text: エディタには
  - kind: para
    text: パワーがある
  p53:
  - kind: para
    text: 実行時にあらゆるものを
  - kind: para
    text: 再定義できる
  - kind: para
    text: 最強の動的言語ランタイム
  p54:
  - kind: para
    text: 危険な再定義をせずに
  - kind: para
    text: hookという仕組みで
  - kind: para
    text: 容易にカスタマイズ
  - kind: para
    text: できる設計が浸透している
  p55:
  - kind: heading
    level: 1
    text: Emacsは未完成品
  p56:
  - kind: para
    text: ユーザーがinit.elを
  - kind: para
    text: 記述することで完成する
  - kind: para
    text: フレームワーク
  p57:
  - kind: para
    text: init.elに書かなくても
  - kind: para
    text: コードを書き換えて
  - kind: para
    text: Emacsの再起動なしに
  - kind: para
    text: 挙動を変更できる
  p58:
  - kind: para
    text: あらゆるものを
  - kind: para
    text: カスタマイズしたければ
  - kind: para
    text: Emacs
  p59:
  - kind: para
    text: C言語を知らなくても
  - kind: para
    text: Lispがわかれば
  - kind: para
    text: カスタマイズできる!!!
  p60:
  - kind: heading
    level: 1
    text: さて
  p61:
  - kind: heading
    level: 1
    text: Emacsはなんでもできる
  p62:
  - kind: para
    text: メーラーでもあり
  - kind: para
    text: RSSリーダーでもあり
  - kind: para
    text: EPUBやPDFも読める
  p63:
  - kind: para
    text: エディタとして
  - kind: para
    text: 使いにくい？
  p64: []
  p65: []
  p66:
  - kind: para
    text: 思考の速度で編集
  - kind: para
    text: したければEvilが使える
  p67: []
  p68:
  - kind: para
    text: (私も翻訳の
  - kind: para
    text: お手伝いをしました)
  p69: []
  p70:
  - kind: para
    text: カスタマイズが
  - kind: para
    text: めんどくさい？
  p71: []
  p72:
  - kind: heading
    level: 1
    text: Emacs vs 重力
  p73:
  - kind: para
    text: Emacsは動的言語インタ
  - kind: para
    text: プリタでもあるので
  - kind: para
    text: GILからは逃れられない
  p74:
  - kind: para
    text: Emacs28では
  - kind: para
    text: Lispをネイティブコンパ
  - kind: para
    text: イルできるようになった
  p75:
  - kind: para
    text: Lispで言語ごとの
  - kind: para
    text: 開発環境を
  - kind: para
    text: 実装し続けるの大変
  p76:
  - kind: para
    text: 言語とEmacsLisp
  - kind: para
    text: 両方わかるひとが
  - kind: para
    text: メンテし続けないと
  - kind: para
    text: いけない
  p77:
  - kind: para
    text: 動的言語Lispで
  - kind: para
    text: 重厚な処理を
  - kind: para
    text: すると重い
  p78:
  - kind: para
    text: 重い関数は
  - kind: para
    text: C言語などで実装して
  - kind: para
    text: ダイナミックモジュール化
  p79:
  - kind: para
    text: Emacs 29では
  - kind: para
    text: Tree-sitterベースの
  - kind: para
    text: 言語モードを導入
  p80:
  - kind: para
    text: 問題意識を持って
  - kind: para
    text: 高速な非同期UIを
  - kind: para
    text: 実装している人も居る
  p81: []
  p82: []
  p83: []
  p84:
  - kind: para
    text: コンピュータサイエンス
  - kind: para
    text: の問題に立ち向かって
  - kind: para
    text: 最強の環境を作りたい人
  - kind: para
    text: はEmacsを
  p85:
  - kind: heading
    level: 1
    text: コミュニティは
  - kind: heading
    level: 1
    text: Emacs JPのSlackに
  - kind: para
    text: (不定期にオンラインミートアップも
  - kind: para
    text: やってるよ)
