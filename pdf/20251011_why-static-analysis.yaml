    - node: text
      content: 静的型付き言語(statically typed language)•型検査 = プログラム(ソースコード)が型の制約を満たすか調べる
        •例： 関数呼び出しに正しい型を渡せているか •静的型付きの言語はプログラムの実行前に型検査合格を前提とする •型がついたとき、実行時にその種のエラーが起こらない性質を
        「健全である」あるいは「型安全である」という •コンパイルの過程で型検査し、実行時に型情報を持たない言語も多い •静的型付けと呼ぶのはおすすめしない
        (が、よく言われている)
    - node: bold
      content: '30'
  p60:
  - node: p
    children:
    - node: text
      content: 動的言語(dynamic language)•プログラムの実行前に型検査合格を前提としない言語 •実行時に「値」と「型タグ」をセットで扱い、処理しながら逐次型検査を行なう
        •実行時にソースコードを評価する(eval)など柔軟な機能を提供する •原理上どんな文字列も実行できるので、無限の可能性を秘めている •動的型付けと呼ぶのはおすすめしない
        (が、よく言われている)
    - node: bold
      content: '31'
