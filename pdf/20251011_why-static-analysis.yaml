    children:
    - node: text
      content: Webページはいつ「変化」するか
  - node: ul
    children:
    - node: li
      children:
      - node: text
        content: 永遠に変化しない／新しいファイルをアップロードしたら変化する
    - node: li
      children:
      - node: text
        content: 最初の表示は同じだが、人間が操作したら画面表示が変化する
    - node: li
      children:
      - node: text
        content: ページをリロードするごとに新しい内容が表示される
    - node: li
      children:
