      content: 品質管理 vs 俺たち•ソフトウェアを安定させるには、その挙動を予測可能な範囲に収めたい •例： メソッドに期待する形式の引数を渡せば、エラーなく実行されてほしい
        •メソッドに同じ引数を渡せば、決まった結果になってほしい •わざわざ実装にジャンプしなくても、引数の形式がわかりやすくなってほしい •そこで、動的解析
        = ユニットテスト = 動かして試してみる
    - node: bold
      content: '34'
  p64:
  - node: p
    children:
    - node: text
      content: PHP vs 型付け•PHPは根本的に動的言語であり、ほとんどの特徴が当てはまる •ただしPHPには型宣言があり、型宣言通りの値が渡されなければエラー
        •他言語でも型宣言は存在するが、実行時に保証されない口約束であることも •Python, TypeScript… •一方でPHPでは動かしてみれば型宣言に反しているかがわかる
    - node: bold
      content: '35'
