  p21:
  - node: p
    children:
    - node: text
      content: Webページはいつ「変化」するか•永遠に変化しない／新しいファイルをアップロードしたら変化する •最初の表示は同じだが、人間が操作したら画面表示が変化する
        •ページをリロードするごとに新しい内容が表示される •人間が操作するごとに新しい内容が表示される
  p22:
  - node: p
    children:
    - node: text
      content: 整理してみましょう
    - node: bold
      content: '13'
  p23:
  - node: p
    children:
    - node: text
      content: Webページはどこで「変化」するかブラウザ画面上で変化しないブラウザ画面上で変化するサーバーが返す シングルページ 静的ページ内容は常に同じアプリケーションサーバーが返す
        サーバーサイド サーバーサイドレンダリング 内容は変わることがあるテンプレートエンジン+ hydration
  p24:
  - node: p
    children:
    - node: text
      content: Webページはどこで「変化」するかブラウザ画面上で変化しないブラウザ画面上で変化するサーバーが返す シングルページ 静的ページ内容は常に同じアプリケーションサーバーが返す
