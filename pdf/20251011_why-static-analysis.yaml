    text: Webページはいつ「変化」するか
  - kind: list
    items:
    - 永遠に変化しない／新しいファイルをアップロードしたら変化する
    - 最初の表示は同じだが、人間が操作したら画面表示が変化する
    - ページをリロードするごとに新しい内容が表示される
    - 人間が操作するごとに新しい内容が表示される
