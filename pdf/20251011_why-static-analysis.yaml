        APIがいる↓ 動的サイト サーバーが返す シングルページ 静的ページアプリケーションサーバ (PHP, Node.js, Go, Railsなど…)内容は常に同じアプリケーションサーバーが返す
        サーバーサイド サーバーサイドレンダリング 内容は変わることがあるテンプレートエンジン+ hydration
  p37:
  - node: p
    children:
    - node: text
      content: Webアプリ vs Next.js (SSR)ブラウザ画面上で変化しないブラウザ画面上で変化するNext.jsのようなフレームワークは
        サーバーが返す シングルページ 静的ページこれに特化している内容は常に同じアプリケーションサーバーが返す サーバーサイド サーバーサイドレンダリング
        Vercel, AmplifyなどのPaaS内容は変わることがあるテンプレートエンジン+ hydration
  p38:
  - node: p
    children:
    - node: text
      content: Webアプリ vs Next.js (SSG/SPA)ブラウザ画面上で変化しないブラウザ画面上で変化するサーバーが返す 静的ページ シングルページ
        内容は常に同じ(SSG/静的サイト生成)アプリケーションサーバーが返す サーバーサイド サーバーサイドレンダリング Next.jsは静的サイト開発にも使える内容は変わることがあるテンプレートエンジン+
        hydration
  p39:
  - node: p
    children:
    - node: text
      content: Webアプリケーションの静と動•ここまでの説明はとても大雑把 •現実のWebサイトでは静的な要素と動的な要素が複雑に入り混じる •静的なHTML/JSファイルからAPIにリクエストしてページ表示するとか
        •静と動を適切に見極めて構成することで、開発効率やインフラコストの最適化 •従来はサーバーサイドアプリケーションが必要だったものも、 近年では外部サービス(mBaaS/IDaaS)に依存することもできる
  p40:
  - node: p
