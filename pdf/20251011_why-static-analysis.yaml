  p39:
  - kind: para
    text: Webアプリケーションの静と動
  - kind: list
    items:
    - ここまでの説明はとても大雑把
    - 現実のWebサイトでは静的な要素と動的な要素が複雑に入り混じる
    - 静的なHTML/JSファイルからAPIにリクエストしてページ表示するとか
    - 静と動を適切に見極めて構成することで、開発効率やインフラコストの最適化
    - 従来はサーバーサイドアプリケーションが必要だったものも、
  - kind: para
    text: 近年では外部サービス(mBaaS/IDaaS)に依存することもできる
