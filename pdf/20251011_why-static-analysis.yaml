  p33:
  - node: p
    children:
    - node: text
      content: 静的ホスティング vs Webアプリブラウザ画面上で変化しないブラウザ画面上で変化するサーバーが返す シングルページ 静的ページ内容は常に同じアプリケーションサーバーが返す
        サーバーサイド サーバーサイドレンダリング ↑ 静的ホスティングサーバー 内容は変わることがあるテンプレートエンジン+ hydration(GitHub
        Pages, PHP/CGI非対応レンタルサーバ, HTTPサーバ単体)
  p34:
  - node: p
    children:
    - node: text
      content: 動的Webサーバ(PHP)ブラウザ画面上で変化しないブラウザ画面上で変化する↓ 動的サイト サーバーが返す シングルページ 静的ページアプリケーションサーバ
        (PHP, Node.js, Go, Railsなど…)内容は常に同じアプリケーションサーバーが返す サーバーサイド サーバーサイドレンダリング 内容は変わることがあるテンプレートエンジン+
        hydration
  p35:
  - node: p
    children:
    - node: text
      content: 動的Webサーバ(PHP)ブラウザ画面上で変化しないブラウザ画面上で変化するサーバーサイド単体で 扱えるのはここ↓ 動的サイト サーバーが返す
        シングルページ 静的ページアプリケーションサーバ (PHP, Node.js, Go, Railsなど…)内容は常に同じアプリケーションサーバーが返す
        サーバーサイド サーバーサイドレンダリング 内容は変わることがあるテンプレートエンジン+ hydration
  p36:
